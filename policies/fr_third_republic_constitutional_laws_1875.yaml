policy_id: fr_third_republic_constitutional_laws_1875
status: candidate
title: Constitutional laws establish the French Third Republic
countries: [FRA]
timeframe: {start: 1875, end: 1884}
description: >
  A series of constitutional laws in 1875 established a bicameral Parliament,
  a president elected by the two chambers, and a government accountable to
  Parliament. The settlement institutionalized a republic after four years of
  provisional arrangements and was partly revised in 1884. Suffrage and
  institutional participation remained limited by the period's gender
  exclusion and colonial status.
enacted_by: [fr_third_republic_consolidation_1871_1900]
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The laws supplied a durable constitutional and parliamentary framework, though not equal political inclusion.
references:
  - "Élysée, Constitutional Laws of 1875: https://www.elysee.fr/la-presidence/les-lois-constitutionnelles-de-1875"
  - "French National Assembly, History of the National Assembly: https://www.assemblee-nationale.fr/histoire/7da.asp"
notes: "Institutional transition only; this is not coded as a market-liberalization or measured state-size event."
