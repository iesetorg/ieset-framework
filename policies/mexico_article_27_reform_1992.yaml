policy_id: mexico_article_27_reform_1992
status: candidate
title: Mexico Article 27 agrarian reform, 1992
countries:
- MEX
timeframe:
  start: 1992
  end: 1992
  enacted_date: '1992-01-06'
  effective_date: '1992-01-07'
description: >-
  The Article 27 constitutional amendment published on 6 January 1992 ended the
  prospective land-distribution mandate, recognised ejido and communal legal
  personality, and provided for ejido members to contract over land use and, under
  specified procedures, obtain full title to parcels. The implementing Ley Agraria,
  published on 26 February 1992, set conditions for leasing, transfers of parcel
  rights within an ejido, assembly approval of full title, and registration. Rights
  were conditional; the amendment did not automatically privatise ejido land.
enacted_by:
- mexico_salinas_nafta_neoliberal_1988_1994
axes_moved:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  intended: true
  rationale: Article 27 allowed commercial companies to own rural land within statutory limits and the Agrarian Law provided for productive associations, widening permitted entry in agriculture.
- axis: institutional.property_rights
  direction: +
  magnitude: weak
  intended: true
  rationale: Article 27 recognised ejido legal personality and provided conditional parcel-right transfer and full-title procedures, subject to assembly and registration requirements.
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
references:
- 'Article 27 constitutional amendment, DOF 6 January 1992, clauses IV and VII and transitories: https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_120_06ene92.pdf'
- 'Ley Agraria, DOF 26 February 1992, Articles 79-82 and original transitional commencement: https://www.diputados.gob.mx/LeyesBiblio/pdf/LAgra.pdf'
- 'Diario Oficial issue listing the Ley Agraria, 26 February 1992: https://dof.gob.mx/index_113.php?day=26&month=02&year=1992'
notes: >-
  Consolidates the former mexico_article_27_ejido_reform_1992 record. The constitutional
  amendment took effect on 7 January 1992; the implementing Agrarian Law took effect
  on 27 February 1992. A study of parcel transactions must use the latter date and
  account for local certification and assembly decisions. The policy did not itself
  change central-bank independence or trade barriers. Earlier generic axis-overlap
  hypothesis links did not test this Mexico reform.
