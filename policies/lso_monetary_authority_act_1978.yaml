# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: lso_monetary_authority_act_1978
status: candidate
title: Lesotho creates a monetary authority before its 1980 opening
countries:
- LSO
timeframe:
  start: 1978
  end: 1978
description: The Lesotho Monetary Authority Act established the monetary authority in 1978. Operations
  commenced on 2 January 1980. The institution was renamed the Central Bank of Lesotho in 1982 with expanded
  responsibilities. Establishment, operational opening, and the later central-bank conversion are distinct
  events; this entry dates the first legal step.
scope: national
references:
- 'Central Bank of Lesotho, Background: https://centralbank.org.ls/background/'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
