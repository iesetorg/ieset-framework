policy_id: us_dred_scott_decision_1857
status: candidate
title: Dred Scott v. Sandford decision
countries: [USA]
timeframe:
  start: 1857
  end: 1857
  enacted_date: "1857-03-06"
description: >
  The Supreme Court held that people of African descent were not U.S. citizens
  under the Constitution and that Congress could not prohibit slavery in
  federal territories. The ruling denied federal recognition and protection
  to Black people and intensified sectional conflict.
enacted_by:
  - us_antebellum_sectional_law_1820_1857
axes_moved:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: strong
    intended: true
    rationale: The ruling expressly denied Black people national citizenship and restricted Congress's authority to limit slavery in federal territories.
references:
  - "U.S. National Archives, Dred Scott v. Sandford: https://www.archives.gov/milestone-documents/dred-scott-v-sandford"
notes: Candidate coding of the court's holding and its formal legal consequences, not a proxy for all antebellum political action.
