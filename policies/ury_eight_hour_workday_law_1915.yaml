policy_id: ury_eight_hour_workday_law_1915
status: candidate
title: Uruguay legislates an eight-hour working day
countries:
- URY
timeframe:
  start: 1915
  end: 1915
  enacted_date: '1915-11-17'
description: Law No. 5350, promulgated on 17 November 1915, set an eight-hour daily limit for specified
  workers and employees and a maximum of 48 hours over six working days. It also provided for regulation
  of daily rest periods. The policy describes statutory limits for covered employment, not uniform enforcement
  across every occupation or a measured employment effect.
scope: national
references:
- 'Uruguay IMPO, Law No. 5350 of 1915: https://www.impo.com.uy/bases/leyes/5350-1915'
notes: Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  magnitude: weak
  intended: true
  rationale: The statutory hours limit constrains working-time arrangements for covered employers; the
    direction describes stronger employment protection, not net welfare.
enacted_by:
- uruguay_working_time_reform_1915
