policy_id: uk_employment_rights_bill_2024
status: candidate
title: UK Employment Rights Bill 2024 / Act 2025
countries:
- GBR
scope: subnational
timeframe:
  start: 2024
  end: ongoing
  enacted_date: '2025-12-18'
  treatment_onset_unresolved: true
description: >-
  The Employment Rights Bill was introduced on 10 October 2024 and became the
  Employment Rights Act 2025 on 18 December 2025. As enacted, ordinary
  unfair-dismissal protection changes from a two-year to a six-month qualifying
  period for dismissals from 1 January 2027; it does not create general day-one
  protection. The Act also provides for guaranteed-hours rights, fire-and-rehire
  limits and other employment changes that commence on separate schedules. Bill
  introduction and Royal Assent are not a common date of applied treatment. Most
  of this labour-law package applies in Great Britain rather than Northern Ireland.
enacted_by:
