policy_id: libya_revolution_transition_2011_2014_policy
status: candidate
title: Revolution and transitional state formation
countries:
- LBY
timeframe:
  start: 2011
  end: 2013
description: The 2011 revolution ended Qaddafi’s rule and a transitional council declared a new Libyan
  state. Elections and interim institutions followed, but armed groups and competing centres of authority
  limited the state’s monopoly on force. This short transition captures institutional rupture and political
  competition, while avoiding an assumed unified economic programme.
enacted_by:
- libya_revolution_transition_2011_2014
scope: national
coalition_label_at_enactment: National Transitional Council and General National Congress
axes_moved:
- axis: institutional.rule_of_law
  direction: mixed
  magnitude: moderate
  intended: true
  rationale: The transition introduced elections and new institutions while state authority remained fragmented.
- axis: fiscal.spending_level
  direction: '0'
  magnitude: weak
  intended: true
  rationale: Oil-financed public spending continued, but the episode is not coded as a clear directional
    fiscal reform.
references:
- 'United Nations, Member States: Libya: https://www.un.org/en/about-us/member-states/libya'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
