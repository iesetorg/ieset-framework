policy_id: uga_central_bank_and_currency_1966
status: candidate
title: Uganda establishes its central bank and first national currency
countries:
- UGA
timeframe:
  start: 1966
  end: 1966
description: The Bank of Uganda Act established a national central bank in 1966, and the bank opened on
  15 August. It issued Uganda's first national currency that year after the East African Currency Board
  arrangement ended. The institutional transition is recorded without assigning previous common currency-board
  policies solely to Uganda or assuming a direction of monetary expansion.
scope: national
references:
- 'Bank of Uganda, History of Uganda Currency: https://archive.bou.or.ug/bou/currency/history_of_the_currency.html'
- 'Bank of Uganda, Who We Are: https://archive.bou.or.ug/bou/about/who_we_are.html'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
