policy_id: italy_kingdom_proclaimed_1861
status: candidate
title: First Italian Parliament proclaims the Kingdom of Italy
countries: [ITA]
timeframe:
  start: 1861
  end: 1861
  enacted_date: "1861-03-17"
description: >
  On 17 March 1861, the first Italian Parliament proclaimed the Kingdom of
  Italy after the unification campaign. The new state remained a constitutional
  monarchy with a restricted electorate; Rome became the capital in 1871.
enacted_by:
  - italy_unification_1861_1870
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The proclamation established a national parliamentary state over most of the peninsula, though voting rights were narrowly restricted.
references:
  - "Italian Chamber of Deputies, A Day at Montecitorio, pp. 10-11: https://www.camera.it/application/xmanager/projects/leg17/attachments/pubblicazione/pdfs/000/000/778/Montecitorio_ingl_def.pdf"
notes: Candidate coding of political unification and national institutions.
