# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tz_economic_recovery_programme_and_market_reforms_1986
status: candidate
title: Tanzania Economic Recovery Programme and initial market reforms
countries: [TZA]
timeframe: {start: 1986, end: 1995, enacted_date: "1986-06-01"}
description: >
  Adopted in 1986 after severe macroeconomic deterioration, the Economic Recovery
  Programme began trade and exchange liberalisation and a gradual move away from
  administered prices and exclusive state provision. Reforms were supported by
  external financing and remained partial across sectors.
enacted_by: [tanzania_mwinyi_liberalisation_1986_1995]
coalition_label_at_enactment: CCM government under Ali Hassan Mwinyi
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "The programme began liberalising trade and foreign exchange arrangements."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "Market pricing and private-sector entry expanded from a state-dominated starting point."}
references:
  - "World Bank, Yes Africa Can, chronology of Tanzania's economic transformation: https://documents.worldbank.org/en/publication/documents-reports/documentdetail/304221468001788072/yes-africa-can-success-stories-from-a-dynamic-continent"
notes: "Start year marks adoption of the recovery programme; implementation was gradual."
