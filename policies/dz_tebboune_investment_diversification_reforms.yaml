# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: dz_tebboune_investment_diversification_reforms
status: candidate
title: Algeria investment, diversification, and public-sector reform programme
countries: [DZA]
timeframe: {start: 2020, end: ongoing}
description: >
  The Tebboune government set a programme to diversify the hydrocarbon economy,
  encourage non-hydrocarbon exports and private investment, and continue major
  public investment and household support. Subsequent investment and land laws,
  digital business procedures, and public-finance reforms were presented as
  steps toward that programme. The 2025–2026 fiscal reviews show that the
  economy remains state-led and hydrocarbon-dependent.
coalition_label_at_enactment: Tebboune presidency and successive governments
enacted_by: [algeria_tebboune_diversification_state_2019_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, intended: true, rationale: "Public investment and wage expenditure expanded substantially in 2024 and remain central to the announced development approach."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, intended: true, rationale: "Investment and land laws seek to facilitate private activity while state enterprises and regulatory barriers remain substantial."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: moderate, intended: true, rationale: "Non-hydrocarbon export promotion coexists with import substitution and trade restrictions."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: moderate, intended: true, rationale: "Broad household support and subsidies remain in place, while policy debate includes gradual retargeting."}
references:
  - "Algerian Government Action Plan, economic renewal and diversification: https://premier-ministre.gov.dz/fr/post/pour-une-relance-et-un-renouveau-economiques"
  - "IMF 2025 Article IV Consultation: https://www.imf.org/en/publications/cr/issues/2025/09/18/algeria-2025-article-iv-consultation-press-release-and-staff-report-570472"
  - "IMF 2026 Article IV mission findings: https://www.imf.org/en/news/articles/2026/07/06/pr26236-algeria-imf-staff-completes-2026-article-iv-mission"
notes: "Government intentions and IMF assessments are stated separately; the programme has not produced a completed transition to private-sector-led growth."
