policy_id: liberia_civil_war_and_transitions_1989_2003_policy
status: candidate
title: Civil war, interim governments, and the Taylor presidency
countries:
- LBR
timeframe:
  start: 1989
  end: 2003
description: The 1989 rebellion became a prolonged civil war, with state authority fragmented among armed
  factions and successive interim arrangements. The 1997 election brought Charles Taylor to the presidency,
  but renewed fighting followed from 2000 until the 2003 peace agreement. The episode represents collapse
  and reconstruction of state institutions, not a coherent single economic programme.
enacted_by:
- liberia_civil_war_and_transitions_1989_2003
scope: national
coalition_label_at_enactment: Competing armed factions, interim governments, and National Patriotic Party
  government
axes_moved:
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Civil war and fragmented authority sharply weakened effective national legal institutions.
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Conflict and fragmented control impaired ordinary national market rules and competition.
references:
- 'U.S. Department of State, Liberia background (2004): https://2009-2017.state.gov/outofdate/bgn/liberia/40628.htm'
- 'U.S. Department of State, Liberia security assistance (2008): https://2001-2009.state.gov/t/pm/64675.htm'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
