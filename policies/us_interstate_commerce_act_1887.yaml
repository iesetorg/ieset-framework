# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_interstate_commerce_act_1887
status: candidate
title: Interstate Commerce Act of 1887
countries: [USA]
timeframe:
  start: 1887
  end: 1887
  enacted_date: "1887-02-04"
description: >
  The Interstate Commerce Act required interstate rail carriers to charge just
  and reasonable rates, barred discriminatory rebates and certain pooling
  practices, and created the Interstate Commerce Commission to receive reports
  and oversee compliance. It was the first federal regulation of a private
  industry. The initial commission had limited enforcement authority; the act
  did not itself create the broader rate-setting powers enacted in 1906.
enacted_by:
  - us_gilded_age_federal_market_rules_1887_1890
axes_moved:
  - axis: regulatory.sectoral_licensing
    direction: "+"
    magnitude: weak
    intended: true
    rationale: This taxonomy's nearest sectoral-oversight axis captures new federal rail supervision and reporting, not literal entry licensing or the later Hepburn Act rate-setting power.
  - axis: regulatory.product_market_competition
    direction: mixed
    intended: true
    rationale: Bans on discriminatory rebates supported fairer competition, while restrictions on pooling and rates limited carrier discretion; the net competitive direction is not coded from enactment alone.
references:
  - "Interstate Commerce Act, 24 Stat. 379 (1887): https://www.archives.gov/milestone-documents/interstate-commerce-act"
notes: Weak sectoral coding reflects a new commission with limited early powers; it should not be interpreted as general federal control of railroad prices.
