# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: deu_stability_and_growth_act_1967
status: candidate
title: West German Stability and Growth Act
countries: [DEU]
timeframe: {start: 1967, end: 1973, enacted_date: "1967-06-08"}
description: >
  The Act established a federal framework for coordination of fiscal and economic
  policy among federal, state, and local governments and codified the goal of
  maintaining price stability, high employment, external balance, and steady growth.
  The Grand Coalition and later social-liberal government used active demand management
  while preserving the social-market economy.
enacted_by: [germany_stability_law_and_social_liberal_reforms_1967_1973]
coalition_label_at_enactment: CDU/CSU-SPD Grand Coalition under Kurt Georg Kiesinger
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "The Act authorised coordinated countercyclical fiscal policy to stabilise employment and growth."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, intended: true, rationale: "The framework formalised constitutional fiscal coordination across levels of government."}
references:
  - "German Bundestag, Stability and Growth Act adopted 1967: https://www.bundestag.de/dokumente/textarchiv/1967-05-10-stabilitaetsgesetz-505290"
notes: "The 1973 end marks the period before the oil shock and subsequent Schmidt government."
