policy_id: mus_export_processing_zone_and_diversification_1983_2016_policy
status: candidate
title: Mauritius export-led diversification and services growth, 1983–2016
countries:
- MUS
timeframe:
  start: 1983
  end: 2016
description: World Bank studies document the export-processing-zone boom, later shift toward tourism and services,
  and the country’s long structural transformation.
enacted_by:
- mus_export_processing_zone_and_diversification_1983_2016
coalition_label_at_enactment: Successive Mauritian governments during export-led diversification
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  intended: false
  rationale: Export-processing zones and preferential market access supported manufactured exports and international
    trade.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: false
  rationale: Private export manufacturing, tourism, and later financial services expanded the market economy.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  intended: false
  rationale: Public investment in infrastructure and education supported diversification and social development.
references:
