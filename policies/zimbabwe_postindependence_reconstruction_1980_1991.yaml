policy_id: zimbabwe_postindependence_reconstruction_1980_1991_policy
status: candidate
title: Post-independence reconstruction and social-service expansion
countries:
- ZWE
timeframe:
  start: 1980
  end: 1990
description: After independence in 1980, the government pursued redistribution in education and health
  and retained extensive price, exchange, and administrative controls inherited from the pre-independence
  period. Private production and markets continued to operate. The period is therefore coded as a mixed
  economy with a stronger social and administrative state, not as complete nationalisation.
enacted_by:
- zimbabwe_postindependence_reconstruction_1980_1991
scope: national
coalition_label_at_enactment: Zimbabwe African National Union–Patriotic Front government
axes_moved:
- axis: fiscal.transfer_expansion
  direction: +
  magnitude: moderate
  intended: true
  rationale: Expanded access to public education and health was a central post-independence priority.
- axis: regulatory.price_control_intensity
  direction: +
  magnitude: moderate
  intended: true
  rationale: Price and foreign-exchange controls remained important features of the policy regime.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Political authority became increasingly concentrated within the governing party.
references:
- 'IMF, Zimbabwe recent economic developments (1997): https://www.elibrary.imf.org/view/journals/002/1997/059/article-A001-en.xml'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
