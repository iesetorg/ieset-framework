# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: lao_tenth_national_socioeconomic_plan_2026
status: candidate
title: Lao PDR Tenth National Socio-Economic Development Plan 2026–2030
countries: [LAO]
timeframe: {start: 2026, end: ongoing}
description: >
  The Tenth National Socio-Economic Development Plan sets a new five-year
  framework for growth and structural development following the Ninth Plan.
  Party and government materials emphasise productive sectors, services,
  international trade, infrastructure, and progress toward development
  targets. This plan extends the party-state's medium-term planning approach
  and does not itself establish that its growth targets will be met.
coalition_label_at_enactment: Lao People's Revolutionary Party government
enacted_by: [laos_nsedp_development_and_diversification_2021_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "Medium-term targets include public infrastructure and productive-sector development."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "National planning steers resources toward selected productive sectors and services."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, intended: true, rationale: "The plan seeks regional and international trade integration and LDC graduation."}
references:
  - "Lao News Agency, Tenth Plan growth targets: https://kpl.gov.la/asean2024/en/detail.aspx?id=97147"
  - "Lao News Agency, National Assembly discussion of draft Tenth Plan: https://kpl.gov.la/asean2024/En/detail.aspx?id=91910"
  - "Lao PDR, Ninth Plan 2021–2025: https://nipn.lsb.gov.la/document/the-9th-national-socio-economic-development-plan-2021-2025/"
notes: "This policy records an adopted or formally presented plan framework and its intended direction, not measured growth results."
