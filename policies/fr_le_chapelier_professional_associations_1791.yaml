policy_id: fr_le_chapelier_professional_associations_1791
status: candidate
title: French Le Chapelier decree restricts professional associations, 1791
countries: [FRA]
scope: national
timeframe:
  start: 1791
  enacted_date: '1791-06-14'
description: >
  The decree of 14 June 1791 prohibited the re-establishment of corporations
  of people in the same occupation and restricted collective professional
  deliberations and agreements, including worker combinations over the terms
  of labour. It followed the March Allarde trade-opening law but addressed
  association and collective bargaining rather than the patente requirement.
  This record describes enacted legal restrictions without estimating their
  enforcement, duration, or effect on wages and welfare.
references:
- 'French Légifrance, initial Le Chapelier decree of 14 June 1791: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000704780'
- 'French National Assembly report explaining Articles 1, 4 and 8 and the 14–17 June dating: https://www.assemblee-nationale.fr/14/rap-info/i3829.asp'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The government legal record labels the instrument a decree of 14 June 1791;
  later parliamentary history also refers to the law as 14–17 June. The
  specific legally operative day after adoption is not established here, so
  no effective_date is entered. This policy-only record has no movement link,
  signed axis, country-drift step, or tested effect.
