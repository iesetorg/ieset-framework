# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_ahv_13th_pension_referendum_2024
status: candidate
title: Swiss 13th old-age pension referendum (2024)
countries: [CHE]
timeframe:
  start: 2026
  end: ongoing
description: >
  Swiss voters approved a popular initiative to add a thirteenth annual payment
  to the public old-age pension. The payment equals one twelfth of the old-age
  pension paid during the year to an eligible claimant. The Federal Council set
  the first payment for December 2026. The referendum authorised a transfer
  expansion; it did not itself settle the financing mechanism.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: '+'
    intended: true
    rationale: >
      The approved initiative adds an annual public pension payment to eligible
      old-age beneficiaries beginning in 2026.
evaluation_design:
  event_dates:
    - '2026-12 first payment month; exact payment day not established'
  known_data_gaps:
    - Exact first-payment day and recipient-level payout timing are not established here.
  notes: >
    The March 2024 referendum authorised the benefit but did not expose
    beneficiaries to a payment. Treatment begins with the December 2026 payout.
references:
  - https://www.bsv.admin.ch/de/newnsb/GfSUvYXM1WibRS3P9FOJr
