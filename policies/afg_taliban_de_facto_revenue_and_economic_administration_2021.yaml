# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: afg_taliban_de_facto_revenue_and_economic_administration_2021
status: candidate
title: Afghanistan de facto revenue administration and self-reliance programme
countries: [AFG]
timeframe: {start: 2021, end: ongoing, enacted_date: "2021-08-15"}
description: >
  Following the Taliban's takeover, the de facto authorities consolidated
  revenue collection, customs duties, fees, and budget allocation under a
  central account and promoted domestic self-reliance, infrastructure,
  agriculture, mining, and private investment. UN reporting describes higher
  collections alongside opaque budget processes, severe constraints on rights,
  and continuing barriers to international finance.
enacted_by: [afghanistan_taliban_de_facto_government_2021_present]
coalition_label_at_enactment: Taliban de facto authorities
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: "The policy operated after the constitutional order collapsed; UN reporting identifies opacity and the exclusionary legal environment."}
  - {axis: regulatory.sectoral_licensing, direction: "+", magnitude: moderate, intended: true, rationale: "Taxes, customs duties, fees, business charges, and mineral royalties are collected through centralised authorities."}
references:
  - "UN Security Council, S/2024/499, paragraphs 31–32: https://digitallibrary.un.org/record/4053880/files/S_2024_499-EN.pdf"
  - "United Nations in Afghanistan, 2025 Country Results Report: https://afghanistan.un.org/sites/default/files/2026-04/AFG_AR_2025_HiRes_Final%20for%20print%20and%20website%20posting-20AP26.pdf"
notes: "Policy implementation and fiscal data are reported by the UN; the record does not treat stated priorities as measured outcomes."
