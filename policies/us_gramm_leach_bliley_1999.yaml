description: 'P.L. 106-102 of 12 November 1999. Repealed Glass-Steagall Act Sections 20 and 32 separating commercial and investment banking; permitted Financial Holding Companies to engage in insurance,
  securities, banking under Fed umbrella supervision. Codified post-1987 federal-regulator accretion of bank-powers; retrospectively debated as contributor to 2007-2008 financial crisis.

  '
