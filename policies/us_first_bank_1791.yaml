# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_first_bank_1791
status: candidate
title: First Bank of the United States chartered
countries: [USA]
timeframe:
  start: 1791
  end: 1791
  enacted_date: "1791-02-25"
description: >
  The First Bank of the United States received a federal charter to act as a
  fiscal agent, hold public funds, support federal transactions, and issue
  paper currency. The charter created a national financial institution but not
  a central bank with the later Federal Reserve's mandate or structure.
enacted_by:
  - us_federalist_state_building_1789_1800
axes_moved:
  - axis: regulatory.financial_deregulation
    direction: "-"
    magnitude: weak
    intended: true
    rationale: A federal charter and public-fund role added national oversight and a common financial institution to a banking system that remained substantially state-based; this codes the added regulatory architecture, not its later market effects.
references:
  - "U.S. House of Representatives, The First Bank of the United States: https://history.house.gov/Historical-Highlights/1700s/1791_First_Bank/"
  - "U.S. Treasury, Alexander Hamilton (1789–1795): https://home.treasury.gov/about/history/prior-secretaries/alexander-hamilton-1789-1795"
notes: Candidate coding. This was a time-limited charter, not the creation of the Federal Reserve or a modern independent central bank.
