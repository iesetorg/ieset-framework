notes: >
  The Act was adopted in 1993 and came into force on 1 January 1994.
  The movement step is attributed to 1994 implementation, not the passage year.
  The 2000 treatment of retained corporate profits is later context, not part
  of the 1994 personal-tax progressivity step.
