policy_id: estonia_flat_tax_1994
status: candidate
title: Estonian flat-tax reform 1994
countries:
- EST
timeframe:
  start: 1994
  enacted_date: '1993-12-08'
  effective_date: '1994-01-01'
description: >
  The Income Tax Act adopted on 8 December 1993 took effect on 1 January
  1994. It replaced the previous personal income-tax schedule with a
  proportional 26% rate above a basic exemption, and lowered the corporate
  income-tax ceiling to 26%. This record describes the 1994 statutory tax
  schedule; it does not attribute later corporate-tax rules or economic
  outcomes to this enactment.
enacted_by: [estonia_laar_market_tax_reform_1994_1995]
coalition_label_at_enactment: Pro Patria coalition (centre-right, classical-liberal)
axes_moved:
- axis: fiscal.tax_progressivity
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Multi-bracket progressive tax replaced with single rate + no deductions.
- axis: fiscal.tax_corporate
  direction: '-'
  magnitude: moderate
  intended: true
