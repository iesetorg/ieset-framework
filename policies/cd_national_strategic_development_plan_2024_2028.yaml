# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cd_national_strategic_development_plan_2024_2028
status: candidate
title: Democratic Republic of the Congo National Strategic Development Plan 2024–2028
countries: [COD]
timeframe: {start: 2024, end: ongoing}
description: >
  The second-term government plan presents a five-year economic, social, and
  political programme centred on security, state capacity, solidarity,
  infrastructure, and diversification. IMF financing is aligned to the
  government's programme while adding fiscal and governance conditions. The
  plan's public-investment figures and policy objectives are not treated as
  verified delivery.
coalition_label_at_enactment: Union Sacree-led government under Felix Tshisekedi
enacted_by: [drc_tshisekedi_action_programme_2024_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "The programme increases planned resources for public services, infrastructure, and state authority."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "Government planning prioritises infrastructure, mineral-value chains, and economic diversification."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: weak, intended: true, rationale: "Private investment and diversification are promoted alongside a central state role in strategic development."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, intended: true, rationale: "State modernisation and rule-of-law objectives are explicit programme pillars, without evidence of full implementation."}
references:
  - "DRC National Strategic Development Plan: https://plan.gouv.cd/plan-national-strategique-de-developpement-2024-2028/"
  - "DRC plan overview: https://plan.gouv.cd/projet_programmes/plan-national-strategique-de-developpement-pnsd/"
  - "IMF 2025 ECF and RSF arrangements: https://www.elibrary.imf.org/view/journals/002/2025/023/article-A001-en.xml"
notes: "Policy direction and budget plans are distinct from realised implementation."
