# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: yem_national_dialogue_transition_and_subsidy_reform_2012
status: candidate
title: Yemen transitional government and National Dialogue process
countries: [YEM]
timeframe: {start: 2012, end: 2014, enacted_date: "2012-02-27"}
description: >
  Abdrabbuh Mansur Hadi assumed the presidency through a transitional process and
  convened a National Dialogue aimed at a federal constitutional settlement. The
  government also attempted fuel-subsidy reforms and macroeconomic adjustment with
  donor support; implementation was limited by political fragmentation and weak state
  capacity.
enacted_by: [yemen_post_saleh_transition_and_national_dialogue_2012_2014]
coalition_label_at_enactment: Internationally recognised transitional government under Abdrabbuh Mansur Hadi
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, intended: true, rationale: "A negotiated National Dialogue was convened to develop a new constitutional order."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, intended: true, rationale: "Fuel subsidy reform aimed to reduce fiscal costs while donor support protected basic services."}
references:
  - "UN Human Rights Council, Yemen transition and National Dialogue background: https://yemen.un.org/en/download/4043/21008"
  - "IMF, Yemen programme note: https://www.imf.org/external/np/country/notes/yemen.htm"
notes: "Transition process was overtaken by renewed conflict in 2014–2015."
