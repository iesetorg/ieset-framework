# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_revenue_act_1869_tea_sales_licence_repeal
status: candidate
title: Tea and related retail excise-licence repeal, 1869
countries: [GBR]
scope: national
timeframe:
  start: 1869
  enacted_date: '1869-06-24'
  effective_date: '1869-07-05'
description: >
  Section 14 of the Revenue Act 1869 removed the excise-licence requirement
  for persons trading in or selling coffee, tea, cocoa nuts, chocolate, or
  pepper from 5 July 1869 and repealed the specified earlier licence laws.
  Section 15 preserved specified rights and continuing regulatory duties of
  sellers in Ireland under the earlier statute; the change was not a general
  repeal of all food-retail rules or customs duties.
coalition_label_at_enactment: Gladstone Liberal ministry (1868-1874)
axes_moved:
- axis: regulatory.sectoral_licensing
  direction: '-'
  intended: true
  rationale: >
    Section 14 removed a named excise licence needed to sell the listed
    products. Magnitude is withheld because the practical entry burden
    has not been quantified and section 15 preserved Irish regulations.
references:
- 'Revenue Act 1869, 32 & 33 Vict. c. 14, sections 14-15 and schedule D, as enacted: https://www.legislation.gov.uk/ukpga/Vict/32-33/14/pdfs/ukpga_18690014_en.pdf'
evaluation_design:
  event_dates:
  - '1869-06-24: Revenue Act received Royal Assent.'
  - '1869-07-05: Section 14 ends the specified retail excise-licence requirement.'
  exempt_or_uncontrolled_units:
  - Goods and activities outside the five named product categories.
  known_data_gaps:
  - No shop-entry, price, compliance, or tax-revenue outcome series is attached.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  This is a distinct provision of the 1869 Revenue Act with its own treatment
  date, not a second claim about the Act's corn-duty abolition. The country
  code GBR denotes the historical United Kingdom of Great Britain and Ireland;
  section 15's Irish saving prevents a blanket claim that all retail rules
  ceased there. No existing authored movement spans 1869, so enacted_by is
  omitted and no country-drift step is created. The policy records a statutory
  licensing change, not an observed entry or consumer-price effect.
