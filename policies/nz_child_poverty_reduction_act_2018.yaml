description: The Child Poverty Reduction Act 2018 required the government to use specified child-poverty
  measures, set reduction targets, and publish monitoring reports. It received Royal assent
  on 20 December and commenced the following day. The Act itself did not increase Working for
  Families or Best Start payments; those transfer changes need their own instrument and date.
