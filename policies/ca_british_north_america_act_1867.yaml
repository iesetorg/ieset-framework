policy_id: ca_british_north_america_act_1867
status: candidate
title: British North America Act establishes the Dominion of Canada
countries: [CAN]
timeframe:
  start: 1867
  end: 1867
  enacted_date: "1867-03-29"
description: >
  The British North America Act united the Province of Canada, Nova Scotia,
  and New Brunswick in a federal Dominion beginning 1 July 1867, with federal
  and provincial legislative powers defined in the constitutional statute.
  The Act did not end Canada's constitutional relationship with Britain.
enacted_by:
  - canada_confederation_state_formation_1867_1873
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The statute established a constitutional federal legislature and divided powers between federal and provincial governments.
references:
  - "Library of Parliament, Parliamentary Primer timeline: https://lop.parl.ca/staticfiles/Learn/Documents/ParliamentaryPrimer/LOP_TimelineBrochEN.pdf"
notes: Candidate coding of constitutional state formation; it does not imply complete sovereignty or universal inclusion.
