policy_id: singapore_innovation_and_compact_2004_2024_policy
status: candidate
title: Singapore innovation strategy and social compact renewal
countries:
  - SGP
timeframe:
  start: 2004
  end: 2023
description: >
  The government continued to develop Singapore's external economic links and
  higher-value industries while investing in research, workforce skills, and
  digital infrastructure. It maintained long-run fiscal sustainability and
  reserves and used targeted support and Forward Singapore consultations to
  renew social policy priorities.
enacted_by:
  - singapore_innovation_and_compact_2004_2024
scope: national
coalition_label_at_enactment: People's Action Party government
axes_moved:
  - axis: regulatory.trade_openness
    direction: +
    magnitude: weak
    intended: true
    rationale: The government maintained global trade and investment integration.
  - axis: fiscal.spending_level
    direction: +
    magnitude: moderate
    intended: true
    rationale: Public investment supported research, skills, and infrastructure.
  - axis: fiscal.transfer_expansion
    direction: +
    magnitude: weak
    intended: true
    rationale: Targeted support and social-compact renewal expanded selected assistance.
references:
  - "Singapore Prime Minister's Office, Lee Hsien Loong profile: https://www.pmo.gov.sg/about-us/past-prime-ministers/mr-lee-hsien-loong/"
  - "Forward Singapore, report and programme: https://www.forwardsingapore.gov.sg/newsroom/"
notes: Candidate period summary; not an annual series of spending or transfers.
