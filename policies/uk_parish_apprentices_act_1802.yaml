policy_id: uk_parish_apprentices_act_1802
status: candidate
title: UK mill apprentice working-hours and welfare rules, 1802
countries: [GBR]
scope: national
timeframe:
  start: 1802
  enacted_date: '1802-06-22'
  effective_date: '1802-12-25'
description: >
  The 1802 Act applied to cotton and woollen mills and factories in Great
  Britain and Ireland employing at least three apprentices or twenty other
  persons. It required workplace ventilation and washing, clothing and basic
  instruction for apprentices, and a maximum of twelve working hours per day
  for apprentices, excluding meals. It prohibited apprentice night work from
  June 1803, with temporary exceptions for mills using specified numbers of
  spindles that expired in December 1803 or June 1804. These working-hours
  protections concerned apprentices, not all factory workers.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: >
    Section IV limited apprentice hours and night work in covered mills.
    Magnitude is withheld because coverage and enforcement are not quantified.
references:
- 'Health and Morals of Apprentices Act 1802, 42 Geo. 3 c. 73, as enacted, sections I-V: https://www.legislation.gov.uk/ukpga/Geo3/42/73/pdfs/ukpga_18020073_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Section I made the mill rules applicable from 25 December 1802; section IV
  staged the night-work ban and section V temporarily excepted some mills.
  GBR denotes the historical United Kingdom, including Ireland in 1802; the
  historical policy is not separately scored for modern IRL. No movement is
  attributed, so this policy-only record creates no country-drift step.
