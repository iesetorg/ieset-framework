# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_war_of_1812_federal_financing
status: candidate
title: War of 1812 federal mobilization and borrowing
countries: [USA]
timeframe: {start: 1812, end: 1815}
description: >
  The War of 1812 sharply increased federal military and financing demands.
  The national debt rose from about $45 million at the start of 1812 to roughly
  $119 million by September 1815, while the government relied heavily on
  borrowing and Treasury notes. This entry records wartime fiscal expansion as
  a directional policy episode, not as an annual spending-to-GDP measurement.
enacted_by: [us_democratic_republican_governments_1801_1815]
axes_moved:
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: War mobilization increased federal outlays and borrowing; the debt path is corroborating context, not a direct spending-share measure.
references:
  - "U.S. Treasury, Historical Debt Outstanding — history of the debt: https://treasurydirect.services.treasury.gov/government/historical-debt-outstanding/"
  - "U.S. Department of the Treasury, Albert Gallatin (1801–1814): https://home.treasury.gov/about/history/prior-secretaries/albert-gallatin-1801-1814"
  - "U.S. Senate, Declaration of War with Great Britain, 1812: https://www.senate.gov/about/images/documents/war-of-1812-senate-amendments.htm"
notes: "War finance records a temporary directional spending expansion, not a permanent fiscal settlement; the debt series alone does not identify annual spending levels."
