policy_id: ch_bilaterals_ii_with_eu_2004
status: candidate
title: Swiss-EU Bilateral Agreements II signed in 2004
countries: [CHE]
scope: supranational
timeframe:
  start: 2004
  end: ongoing
  signed_date: '2004-10-26'
  enacted_date: '2004-12-17'
description: >-
  Switzerland and the European Union signed the second package of bilateral
  agreements on 26 October 2004, and the Swiss Parliament approved the
  agreements in separate federal decrees on 17 December 2004. The package
  covers distinct areas including Schengen/Dublin cooperation, taxation of
  savings, processed agricultural products, statistics and the environment.
  Its agreements are not legally tied to one another and entered into force
  on different dates; the package has no single effective date.
enacted_by:
