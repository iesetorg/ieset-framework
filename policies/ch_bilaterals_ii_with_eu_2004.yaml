evaluation_design:
  event_dates:
    - '2004-10-26 package signed'
    - '2004-12-17 Swiss parliamentary approval in separate decrees'
    - '2005-03-30 processed agricultural products agreement entered into force'
    - '2008-03-01 Schengen/Dublin agreements formally entered into force'
  notes: >-
    Use the entry date of the relevant component for a sector-specific
    treatment. The signature and parliamentary approval are not common
    implementation dates for the whole package.
