# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: syr_transitional_recovery_and_economic_liberalisation_2025
status: candidate
title: Syrian transitional recovery and economic liberalisation programme
countries: [SYR]
timeframe: {start: 2025, end: ongoing}
description: >
  During the transitional period after the Assad government's fall, the new
  authorities began institutional restructuring, national dialogue, economic
  opening, and recovery planning. United Nations analysis describes steps
  toward reintegration and liberalisation while identifying continuing gaps
  in inclusive governance, the rule of law, transparency, and security.
enacted_by: [syria_al_sharaa_transitional_state_and_recovery_2024_present]
coalition_label_at_enactment: Syrian transitional authorities
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "The UN Common Country Analysis describes an economic liberalisation direction and renewed international reintegration."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, intended: true, rationale: "Institution-building and transition coexist with reported deficits in legal framework, transparency, and inclusion."}
references:
  - "United Nations in Syria, Common Country Analysis, 31 March 2026: https://syria.un.org/en/312773-common-country-analysis-syria"
  - "UN Security Council, briefing on Syria's political transition, 12 February 2025: https://press.un.org/en/2025/sc15991.doc.htm"
notes: "The record captures early transitional policy direction and does not infer completed outcomes."
