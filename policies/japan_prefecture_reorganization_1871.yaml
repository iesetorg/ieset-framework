# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: japan_prefecture_reorganization_1871
status: candidate
title: Abolition of domains and establishment of prefectures
countries: [JPN]
timeframe:
  start: 1871
  end: 1871
  enacted_date: "1871-07-14"
description: >
  The Meiji government abolished the domains and replaced hereditary domain
  lords with centrally appointed prefectural governors. This extended direct
  national administration across the former domains.
enacted_by:
  - japan_meiji_state_formation_1868_1872
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The reform replaced hereditary domain administrations with a nationally directed territorial system.
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: weak
    intended: true
    rationale: National administration assumed responsibilities previously distributed across domain governments; this does not quantify net public spending.
references:
  - "National Archives of Japan, Return of lands and abolition of domains: https://www.archives.go.jp/exhibition/digital/modean_state/contents/return/index.html"
notes: Candidate coding of administrative centralization, not a numerical expenditure estimate.
