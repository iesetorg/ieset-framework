policy_id: latvia_crisis_austerity_and_euro_2008_2011_policy
status: candidate
title: Financial crisis adjustment and euro-oriented stabilisation
countries:
- LVA
timeframe:
  start: 2008
  end: 2010
description: The global financial crisis produced a severe downturn and a balance-of-payments emergency.
  Latvia maintained its euro peg and adopted fiscal consolidation alongside international financial assistance
  and structural reforms. The response combined market continuity and external anchoring with sharp public
  adjustment.
enacted_by:
- latvia_crisis_austerity_and_euro_2008_2011
scope: national
coalition_label_at_enactment: People’s Party and Unity governments
axes_moved:
- axis: fiscal.spending_level
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Fiscal consolidation reduced public expenditure during the crisis.
- axis: monetary.central_bank_independence
  direction: +
  magnitude: weak
  intended: true
  rationale: Maintaining the currency peg and convergence path constrained discretionary monetary policy.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  intended: true
  rationale: Reform conditions supported structural adjustment and market institutions.
references:
- 'European Commission, Latvia and the EU: https://eur-lex.europa.eu/legal-content/summary/latvia.html'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
