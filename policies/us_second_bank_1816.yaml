# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_second_bank_1816
status: candidate
title: Second Bank of the United States chartered
countries: [USA]
timeframe:
  start: 1816
  end: 1816
  enacted_date: "1816-04-10"
description: >
  Congress chartered the Second Bank of the United States after the First
  Bank's charter expired. It served as a federal fiscal agent and sought to
  support a more uniform currency; its role and constitutionality remained
  politically contested.
enacted_by:
  - us_postwar_national_bank_1816_1824
axes_moved:
  - axis: regulatory.financial_deregulation
    direction: "-"
    magnitude: moderate
    intended: true
    rationale: The renewed federal charter created a national financial institution with a public-fund role, expanding federal oversight and monetary coordination.
references:
  - "U.S. Senate Committee on Finance, History: https://www.finance.senate.gov/about/history"
notes: Candidate coding of institutional structure, not an estimate of the Bank's net economic effects.
