policy_id: france_eec_accession_rome_treaty_1957
status: candidate
title: France founding EEC membership under the Treaty of Rome
countries:
- FRA
timeframe:
  start: 1958
  end: 1958
  signed_date: '1957-03-25'
  effective_date: '1958-01-01'
description: >-
  France was one of six signatories of the Treaty establishing the European
  Economic Community on 25 March 1957. The Treaty applied from 1 January
  1958, establishing a customs union and a transition toward removing duties
  and quotas between members, with a common external tariff. This founding
  membership event does not date later CAP transfers, domestic subsidies or
  the completion of tariff elimination to the Treaty-signing day.
enacted_by:
