# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tw_end_emergency_rule_and_direct_election_1991_1996
status: candidate
title: Taiwan ends emergency-era constitutional provisions and establishes direct presidential election
countries: [TWN]
timeframe: {start: 1991, end: 1996, enacted_date: "1996-03-23"}
description: >
  Beginning in 1991, Taiwan terminated the Temporary Provisions effective during the
  Period of Communist Rebellion and retired the first-generation legislature. The
  constitutional amendments of the 1990s expanded elections in Taiwan, culminating
  in the first direct presidential election in March 1996. These changes dismantled
  core emergency-era institutions and established competitive electoral selection of
  the presidency.
enacted_by: [taiwan_lee_teng_hui_democratic_transition_1988_2000]
coalition_label_at_enactment: Kuomintang government under Lee Teng-hui
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: strong, intended: true, rationale: "The emergency-era constitutional framework was dismantled and direct competitive presidential elections began."}
references:
  - "Office of the President, ROC (Taiwan), Political History: https://www.president.gov.tw/qrcode/19e"
notes: "Record describes the institutional transition rather than assigning it to a single amendment."
