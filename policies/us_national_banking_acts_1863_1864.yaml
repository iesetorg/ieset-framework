# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_national_banking_acts_1863_1864
status: candidate
title: National Currency and Banking Acts of 1863–1864
countries: [USA]
timeframe:
  start: 1863
  end: 1864
  enacted_date: "1864-06-03"
description: >
  The 1863 National Currency Act created the Office of the Comptroller of the
  Currency and a national bank charter system. The 1864 National Banking Act
  revised that framework, setting capital and reserve requirements for privately
  owned national banks and linking note issuance to federal bonds. This was
  federal rule-making for a national payments and banking market, not creation
  of a modern central bank.
enacted_by:
  - us_civil_war_republican_economic_state_building_1862_1864
axes_moved:
  - axis: regulatory.financial_deregulation
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Under this axis's semantics, plus means tighter financial regulation; national charters, reserves, and OCC examination added federal banking rules.
references:
  - "Office of the Comptroller of the Currency, Founding of the OCC and the National Banking System: https://occ.gov/about/who-we-are/history/history-of-the-occ/founding-occ-national-bank-system/index-founding-occ-national-banking-system.html"
  - "Federal Reserve History, National Banking Acts of 1863 and 1864: https://www.federalreservehistory.org/essays/national-banking-acts"
notes: The enacted date is the 1864 revision; the 1863 creation is documented in the description and movement attribution basis.
