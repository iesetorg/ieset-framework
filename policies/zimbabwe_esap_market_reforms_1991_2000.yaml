policy_id: zimbabwe_esap_market_reforms_1991_2000_policy
status: candidate
title: Economic Structural Adjustment Programme
countries:
- ZWE
timeframe:
  start: 1991
  end: 1999
description: Beginning in 1991, the government adopted a multi-year Economic Structural Adjustment Programme
  intended to move from a highly regulated economy toward greater reliance on market forces. Reforms included
  domestic price, interest-rate, investment, labour, trade, and foreign-exchange liberalisation, but fiscal
  imbalances and implementation difficulties limited results.
enacted_by:
- zimbabwe_esap_market_reforms_1991_2000
scope: national
coalition_label_at_enactment: Zimbabwe African National Union–Patriotic Front government
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  intended: true
  rationale: The programme liberalised external trade and removed import controls.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: true
  rationale: Domestic price, investment, and labour-market rules were liberalised.
- axis: monetary.monetary_expansion_direction
  direction: '-'
  magnitude: weak
  intended: true
  rationale: The programme called for tighter fiscal and monetary policy, with uneven implementation.
references:
- 'IMF, Zimbabwe recent economic developments (1997): https://www.elibrary.imf.org/view/journals/002/1997/059/article-A001-en.xml'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
