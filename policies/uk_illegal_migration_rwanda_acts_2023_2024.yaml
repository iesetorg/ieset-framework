# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_illegal_migration_rwanda_acts_2023_2024
status: candidate
title: UK Illegal Migration Act 2023 and Safety of Rwanda Act 2024
countries:
- GBR
timeframe:
  start: 2023
  end: 2024
  enacted_date: '2023-07-20'
  treatment_onset_unresolved: true
description: >
  The Illegal Migration Act 2023 received Royal Assent on 20 July 2023 and
  provided a framework concerning irregular arrivals, asylum claims and
  removals; most sections required later commencement regulations. The Safety
  of Rwanda (Asylum and Immigration) Act 2024 received Royal Assent on
  25 April 2024 and required UK decision-makers to treat Rwanda as a safe
  country for specified purposes. The Rwanda removal policy was later
  abandoned, and the 2024 Act was repealed in 2025.
enacted_by:
- uk_sunak_conservative_2022_2024
coalition_label_at_enactment: Conservative majority (Sunak)
references:
- 'UK legislation, Illegal Migration Act 2023, introduction and section 68: https://www.legislation.gov.uk/ukpga/2023/37/pdfs/ukpga_20230037_en.pdf'
- 'UK legislation, Safety of Rwanda (Asylum and Immigration) Act 2024: https://www.legislation.gov.uk/ukpga/2024/8/pdfs/ukpga_20240008_en.pdf'
- 'UK legislation, Border Security, Asylum and Immigration Act 2025 explanatory notes on repeal: https://www.legislation.gov.uk/ukpga/2025/31/notes/division/3/index.htm'
notes: >
  These Acts have different commencement rules. Neither Royal Assent date
  establishes a person-level removal treatment, which requires individual
  exposure evidence. Unrelated worker and student visa measures have been
  removed from this policy description.
axes_moved:
- axis: regulatory.immigration_openness
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Statutory restrictions for specified irregular-arrival asylum claims; actual removal exposure remains unverified.
- axis: institutional.judicial_independence
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Legislatively overriding the Supreme Court's factual finding on Rwanda is a contested case of legislative versus judicial primacy; weak-negative coding reflects the scoped nature of the override.
