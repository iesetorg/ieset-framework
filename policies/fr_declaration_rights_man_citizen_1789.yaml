# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_declaration_rights_man_citizen_1789
status: candidate
title: Declaration of the Rights of Man and the Citizen
countries: [FRA]
timeframe:
  start: 1789
  end: 1789
  enacted_date: "1789-08-26"
description: >
  The National Assembly adopted a declaration of political and civil rights
  grounded in liberty, equality before law, national sovereignty, and property
  as a protected right. Its universal language did not deliver equal rights in
  practice for women, enslaved people, or colonial subjects.
enacted_by:
  - fr_constituent_assembly_legal_reordering_1789_1791
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The Declaration stated general principles of legal equality and public authority under law, while its stated universality was not extended equally to all people under French rule.
  - axis: institutional.property_rights
    direction: "+"
    magnitude: weak
    intended: true
    rationale: It declared property a protected right within the new constitutional order; protection remained unequal in practice across gender, status, and colonial lines.
references:
  - "French Constitutional Council, Constitutional Block (Declaration dated 26 August 1789): https://qpc360.conseil-constitutionnel.fr/constitutional-block"
  - "French National Assembly, French Revolution: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise"
notes: Candidate coding of declared institutional principles; it is not a claim that universal rights were fully realized.
