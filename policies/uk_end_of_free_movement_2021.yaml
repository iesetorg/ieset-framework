# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_end_of_free_movement_2021
status: candidate
title: End of EU free movement under the 2020 Immigration Act
countries:
- GBR
timeframe:
  start: 2020
  end: 2021
  enacted_date: '2020-11-11'
  effective_date: '2021-01-01'
description: >
  The Immigration and Social Security Co-ordination (EU Withdrawal) Act 2020
  ended EU free movement for new arrivals to the UK from 1 January 2021,
  with a domestic points-based immigration system. Existing residents could
  retain rights through the EU Settlement Scheme; new EU and EEA applicants
  became subject to route-specific skill, salary, and language rules.
enacted_by:
- uk_brexit_2016_2020
axes_moved:
- axis: regulatory.immigration_openness
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Points-based system imposed skill, salary, and English thresholds on EU arrivals from 1 Jan 2021.
references:
- https://www.gov.uk/government/news/immigration-act-receives-royal-assent-free-movement-to-end-on-31-december-2020
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The enacted legal change is distinct from any observed change in total
  migration or downstream labour-market and fiscal outcomes.
