policy_id: tw_defence_budget_2025
status: candidate
title: Taiwan 2025 legal defence budget appropriation
countries: [TWN]
timeframe:
  start: 2025
  end: 2025
  enacted_date: '2025-03-21'
description: >-
  Taiwan's 2025 central government budget, including the Ministry of National
  Defense's annual appropriation, passed its final legislative reading on
  21 January 2025 and was published by presidential order on 21 March 2025.
  The ministry reported that its proposed NT$476 billion appropriation was
  cut by about NT$8.4 billion during review. This entry records the legally
  published 2025 budget, not a multi-year defence-spending ramp, proposed
  2026 special procurement, released cash or actual military expenditure.
enacted_by:
  - taiwan_lai_dpp_2024_present
evaluation_design:
  event_dates:
    - '2025-01-21 final legislative reading of the 2025 central budget'
    - '2025-03-21 presidential publication of the approved 2025 budget'
  known_data_gaps:
    - Exact line-item release, freeze lifting, commitment and cash-spending dates are not established here.
    - The budget year began before publication; no unsupported effective or exposure date is assigned.
  notes: >-
    The ministry's review account reports a proposed NT$476 billion MND
    appropriation and NT$8.4 billion of cuts. This policy is a discrete 2025
    annual appropriation. It does not prove a 2024 decision or that spending,
    readiness or national fiscal-spending-level outcomes increased.
references:
  - https://www.president.gov.tw/Page/294/49802
  - https://www.mnd.gov.tw/File/52646
suppress_inferred_axis_links: true
