# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cz_consolidation_package_2024
status: candidate
title: Czech public-budget consolidation package (2024)
countries: [CZE]
timeframe:
  start: 2024
  end: ongoing
  effective_date: '2024-01-01'
description: >
  Act No. 349/2023 Coll. amended more than sixty Czech laws in a public-budget
  consolidation package taking effect mainly in 2024. It reduced selected
  subsidies and state operating expenditure, raised the corporate income-tax
  rate by two percentage points, narrowed tax exemptions, and replaced two
  reduced VAT bands with a single 12 percent band alongside the 21 percent
  standard rate. The package combined revenue and expenditure measures.
enacted_by:
  - czech_republic_fiala_spolu_2021_2025
axes_moved:
  - axis: fiscal.tax_corporate
    direction: '+'
    intended: true
    rationale: >
      The package raised the statutory corporate income-tax rate by two
      percentage points.
  - axis: fiscal.spending_level
    direction: '-'
    intended: true
    rationale: >
      The enacted package reduced selected non-investment subsidies and state
      operating expenditure; the effect on total spending share needs separate
      outcome measurement.
references:
  - https://www.mfcr.cz/assets/attachments/2024-04-30_Convergence-Programme-of-the-Czech-Republic-April-2024.pdf
  - https://financnisprava.gov.cz/cs/dane/danovy-system-cr/popis-systemu
notes: >
  Act No. 349/2023 Coll. was published on 12 December 2023, while its revenue
  and spending provisions rolled out across 2024 and 2025. The publication
  date is not an impact-treatment date; select dates by provision before an
  event study.
