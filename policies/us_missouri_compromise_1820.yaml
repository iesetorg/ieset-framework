# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_missouri_compromise_1820
status: candidate
title: Missouri Compromise
countries: [USA]
timeframe:
  start: 1820
  end: 1820
  enacted_date: "1820-03-06"
description: >
  The compromise admitted Missouri as a slave state and Maine as a free state,
  and barred slavery in much of the remaining Louisiana Purchase territory
  north of latitude 36°30′. It temporarily managed sectional conflict while
  preserving slavery where it already existed and allowing its expansion in
  part of the territory.
enacted_by:
  - us_antebellum_sectional_law_1820_1857
axes_moved:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: moderate
    intended: true
    rationale: The law made federal territorial governance hinge on a political balance that preserved and geographically regulated slavery rather than equal legal status.
references:
  - "U.S. Senate, Missouri Compromise Ushers in New Era for the Senate: https://www.senate.gov/artandhistory/history/minute/Missouri_Compromise.htm"
notes: Candidate coding of a compromise that temporarily managed, but did not resolve, slavery and territorial conflict.
