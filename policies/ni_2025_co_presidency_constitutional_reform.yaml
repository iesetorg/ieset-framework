policy_id: ni_2025_co_presidency_constitutional_reform
status: candidate
title: Nicaragua's 2025 constitutional co-presidency reform
countries: [NIC]
timeframe:
  start: 2025
  end: ongoing
  enacted_date: '2025-02-18'
  effective_date: '2025-02-18'
description: >-
  Law No. 1234 amended Nicaragua's constitution and was published in La
  Gaceta No. 32 on 18 February 2025. The consolidated constitution provides
  for a presidency made up of one male co-president and one female
  co-president, elected by popular vote, and six-year terms for the two offices.
  Publication and the legal creation of the office are the recorded events;
  this entry does not assume an observed change in institutional quality.
enacted_by:
  - nicaragua_ortega_fsln_consolidation_2007_present
evaluation_design:
  event_dates:
    - '2025-01-30 National Assembly approval recorded in consolidated text'
    - '2025-02-18 Law No. 1234 published in La Gaceta No. 32'
  notes: >-
    The publication date is used as the legal start. The office's later
    exercise and any political consequences require separate evidence.
