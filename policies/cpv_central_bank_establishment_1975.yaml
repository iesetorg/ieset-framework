policy_id: cpv_central_bank_establishment_1975
status: candidate
title: Cabo Verde establishes its central and development bank
countries:
- CPV
timeframe:
  start: 1975
  end: 1975
  enacted_date: '1975-09-29'
description: Cabo Verde established Banco de Cabo Verde on 29 September 1975. Its initial responsibilities
  combined currency issuance, foreign exchange administration, treasury services, central banking, and
  commercial and development banking. This records the institution-building decision after independence,
  rather than an estimate of lending, spending, or monetary expansion.
scope: national
references:
- 'Banco de Cabo Verde, About the Bank: https://www.bcv.cv/en/O%20Banco/Paginas/OBanco.aspx'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
