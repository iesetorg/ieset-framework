policy_id: latvia_eu_accession_and_market_integration_1999_2008_policy
status: candidate
title: EU accession and market integration
countries:
- LVA
timeframe:
  start: 1999
  end: 2007
description: Latvia completed EU accession in 2004 after the Commission assessed it as a functioning market
  economy. Accession embedded competition, state-aid, and internal-market rules and supported rapid integration
  into European trade and finance. Strong growth also increased exposure to external capital and demand
  cycles.
enacted_by:
- latvia_eu_accession_and_market_integration_1999_2008
scope: national
coalition_label_at_enactment: Successive centre-right and centre-left coalition governments
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  intended: true
  rationale: EU membership integrated Latvia into the single market.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: true
  rationale: Accession extended competition and state-aid rules.
- axis: institutional.rule_of_law
  direction: +
  magnitude: weak
  intended: true
  rationale: EU legal and administrative obligations strengthened institutional alignment.
references:
- 'European Commission, Latvia Regular Report (2003): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A52003SC1203'
- 'EUR-Lex, Latvia accession summary: https://eur-lex.europa.eu/legal-content/summary/latvia.html'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
