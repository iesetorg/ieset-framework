# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: germany_imperial_constitution_1871
status: candidate
title: Constitution of the German Empire
countries: [DEU]
timeframe:
  start: 1871
  end: 1871
  enacted_date: "1871-04-16"
description: >
  The Imperial Constitution formed a federal empire of 25 states. The
  Bundesrat represented the states and participated in legislation, while
  the Reichstag passed laws and budgets. The Kaiser appointed the Chancellor,
  and the executive retained substantial authority independent of parliamentary
  confidence.
enacted_by:
  - germany_empire_constitution_1871
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The Constitution created common federal legislative institutions and a national Reichstag but retained monarchic executive dominance.
references:
  - "German Bundestag, The Empire (1871–1918): https://www.bundestag.de/en/parliament/history/parliamentarism/empire"
notes: Candidate coding of federal constitutional structure, not democratic parliamentary government.
