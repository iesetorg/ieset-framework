# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: gha_democratic_transition_and_contested_adjustment_1992
status: candidate
title: Ghana return to multiparty constitutional government and contested economic adjustment
countries: [GHA]
timeframe: {start: 1992, end: 2000, enacted_date: "1992-01-07"}
description: >
  Ghana's 1992 Constitution and multiparty elections opened a new electoral period.
  Economic adjustment continued unevenly: fiscal expansion and inflationary pressures
  contributed to policy reversals in the 1990s, while cocoa-sector reform and
  divestiture advanced incompletely.
enacted_by: [ghana_rawlings_democratic_adjustment_1992_2000]
coalition_label_at_enactment: National Democratic Congress government under Jerry Rawlings
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, intended: true, rationale: "A constitutional multiparty political system was established."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "Fiscal expenditure pressures rose and earlier adjustment measures were partly reversed."}
references:
  - "World Bank, Ghana adjustment lending and reform setbacks, 1992–1997: https://documents1.worldbank.org/curated/en/988621468030626957/pdf/596200NWP01pub158288B0prsc1ghana1cs.pdf"
notes: "Movement codes the combined political opening and contested continuation of the adjustment programme."
