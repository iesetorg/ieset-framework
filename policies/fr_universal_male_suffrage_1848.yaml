# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_universal_male_suffrage_1848
status: candidate
title: Universal male suffrage established
countries: [FRA]
timeframe:
  start: 1848
  end: 1848
  enacted_date: "1848-03-05"
description: >
  A provisional-government decree established direct universal male suffrage
  for the election of the Constituent Assembly. Women and colonial populations
  remained excluded from equal political participation.
enacted_by:
  - fr_second_republic_second_empire_1848_1870
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The decree greatly broadened political participation among men, while excluding women and colonial populations and leaving executive accountability to later constitutional design.
references:
  - "French National Assembly, 1848 universal male suffrage: https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/histoire/le-suffrage-universel/la-republique-et-le-suffrage-universel/1848-la-deuxieme-republique-met-en-place-le-suffrage-universel-masculin"
notes: Candidate coding of formal voting rules, not a claim of universal inclusion.
