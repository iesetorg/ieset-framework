policy_id: uk_vat_private_school_fees_2025
status: candidate
title: UK VAT on private school fees 2025
countries:
- GBR
timeframe:
  start: 2025
  end: ongoing
  enacted_date: '2025-03-20'
  effective_date: '2025-01-01'
  treatment_onset_unresolved: true
description: >-
  VAT at the standard 20 percent rate applied to private-school education and
  boarding services for terms beginning on or after 1 January 2025. The
  government announced the policy on 29 July 2024; anti-forestalling rules
  reached certain prepayments from that date, and Finance Act 2025 received
  Royal Assent on 20 March 2025 with retrospective commencement provisions.
  The separately legislated change to English business-rates charitable relief
  is outside this VAT record. The January service date does not alone define
  an anticipation-free treatment window.
enacted_by:
- uk_starmer_labour_2024_present
coalition_label_at_enactment: Labour majority (Starmer)
axes_moved:
- axis: fiscal.tax_progressivity
  direction: +
  magnitude: weak
  intended: true
  rationale: Removal of the VAT exemption targets fee-paying private education; actual incidence and enrollment effects require separate evidence.
references:
- https://www.gov.uk/government/publications/vat-on-private-school-fees/applying-vat-to-private-school-fees
- https://www.legislation.gov.uk/ukpga/2025/8/part/3/crossheading/value-added-tax/2025-03-20
- https://www.gov.uk/guidance/charging-and-reclaiming-vat-on-goods-and-services-related-to-private-school-fees
