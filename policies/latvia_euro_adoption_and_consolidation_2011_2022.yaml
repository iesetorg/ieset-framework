# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: latvia_euro_adoption_and_consolidation_2011_2022_policy
status: candidate
title: Euro adoption and institutional consolidation
countries:
- LVA
timeframe:
  start: 2011
  end: 2021
description: Latvia adopted the euro in 2014 after post-crisis adjustment and continued integration into
  EU fiscal, financial, and regulatory frameworks. Governments maintained a market-based economy while
  expanding security and resilience priorities. This broad period ends before the separately coded 2022
  security-state coalition.
enacted_by:
- latvia_euro_adoption_and_consolidation_2011_2022
scope: national
coalition_label_at_enactment: Unity, Greens and Farmers, and New Unity coalition governments
axes_moved:
- axis: monetary.central_bank_independence
  direction: +
  magnitude: moderate
  intended: true
  rationale: Euro adoption transferred monetary policy to the Eurosystem.
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  intended: true
  rationale: Continued EU single-market integration maintained a high degree of external openness.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  intended: true
  rationale: Security and resilience priorities increased late in the period, without defining the full
    era.
references:
- 'EUR-Lex, Latvia accession and euro-area summary: https://eur-lex.europa.eu/legal-content/summary/latvia.html'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
