# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: deu_allied_occupation_economic_reconstruction_1945
status: candidate
title: Allied occupation and economic reconstruction of Germany
countries: [DEU]
timeframe: {start: 1945, end: 1947, enacted_date: "1945-05-08"}
description: >
  Allied occupation replaced Nazi government and directed demilitarisation, reparations,
  denazification, rationing, and reconstruction. Economic systems increasingly diverged
  between the Soviet zone and the western occupation zones before the 1948 currency
  reform and the establishment of separate German states.
enacted_by: [germany_allied_occupation_and_diverging_economic_systems_1945_1947]
coalition_label_at_enactment: Allied Control Council and occupation administrations
axes_moved:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, intended: true, rationale: "The Nazi state was dismantled, but sovereign German democratic government was not yet restored."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, intended: true, rationale: "Rationing and administrative allocation persisted as economic arrangements diverged by occupation zone."}
references:
  - "German Federal Agency for Civic Education, economic development 1945–1949: https://www.bpb.de/shop/zeitschriften/izpb/deutschland-1945-1949-259/10077/wirtschaftsentwicklung-von-1945-bis-1949/"
notes: "The record covers the immediate occupation phase and bridges to the existing West German social-market economy movement in 1948."
