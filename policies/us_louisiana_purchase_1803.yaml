policy_id: us_louisiana_purchase_1803
status: candidate
title: Louisiana Purchase
countries: [USA]
timeframe: {start: 1803, end: 1803, enacted_date: "1803-04-30"}
description: >
  The United States purchased the Louisiana Territory from France for $15
  million under a treaty signed on 30 April 1803. The acquisition roughly
  doubled the country's territory and extended federal jurisdiction west of
  the Mississippi. It was a major territorial and fiscal act, and the United
  States acquired inhabited Indigenous lands without Indigenous consent.
enacted_by: [us_democratic_republican_governments_1801_1815]
references:
  - "U.S. National Archives, Louisiana Purchase Treaty (1803): https://www.archives.gov/milestone-documents/louisiana-purchase-treaty"
notes: "This event is attached for historical context; no market-openness or state-size axis is inferred from territorial acquisition alone."
