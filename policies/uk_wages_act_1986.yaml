policy_id: uk_wages_act_1986
status: candidate
title: UK Wages Act 1986
countries:
- GBR
timeframe:
  start: 1986
  end: 1986
  enacted_date: '1986-07-25'
  treatment_onset_unresolved: true
description: >
  The Wages Act 1986 received Royal Assent on 25 July 1986. Section 24(5)
  immediately removed workers under 21 from existing wages-council orders,
  while the broader Part II wages-council regime commenced two months later.
  Wage-payment protection and redundancy-rebate provisions followed other
  commencement rules.
enacted_by:
- uk_thatcher_second_term_1983_1987
- thatcherism
coalition_label_at_enactment: Conservative majority
references:
- 'UK legislation, Wages Act 1986, introduction and sections 24(5) and 33: https://www.legislation.gov.uk/ukpga/1986/48/pdfs/ukpga_19860048_en.pdf'
notes: >
  The immediate under-21 legal change is distinct from later Part II
  commencement and worker-level wage exposure. A single Act date is
  insufficient for all outcomes.
