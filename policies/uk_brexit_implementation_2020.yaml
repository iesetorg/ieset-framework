policy_id: uk_brexit_implementation_2020
status: draft
title: Legacy UK Brexit implementation bundle lead
countries:
- GBR
timeframe:
  start: 2020
  end: 2021
description: >
  This legacy bundle conflated the EU-UK Trade and Cooperation Agreement,
  agreed in December 2020 and provisionally applied from January 2021, with
  the Immigration and Social Security Co-ordination (EU Withdrawal) Act 2020.
  Their distinct trade and free-movement decisions are retained in
  uk_trade_cooperation_agreement_2020 and uk_end_of_free_movement_2021.
  This identifier remains as provenance and is not a separate scored policy.
references:
