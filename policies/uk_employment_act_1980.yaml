description: >
  The Employment Act 1980 amended trade-union and employment law, including
  picketing, closed-shop rules and ballot support. It received Royal Assent on
  1 August 1980. Section 21 required ministerial orders to commence many
  substantive sections, potentially on different dates.
enacted_by:
- uk_thatcher_first_term_1979_1983
- thatcherism
coalition_label_at_enactment: Conservative majority
references:
