# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: syc_monetary_authority_decree_1978
status: candidate
title: Seychelles replaces its currency board with a monetary authority
countries:
- SYC
timeframe:
  start: 1978
  end: 1978
  enacted_date: '1978-11-24'
description: The Seychelles Monetary Authority Decree was enacted on 24 November 1978 and the authority
  opened on 1 December. Compared with the currency board, it received monetary-policy responsibilities,
  bank-inspection powers, and lender-of-last-resort functions. Its board remained closely tied to the
  finance administration. The entry codes added financial oversight, not increased independence or a measured
  expansion of money.
scope: national
references:
- 'Central Bank of Seychelles, History of the Bank: https://www.cbs.sc/Aboutus/HistoryOfBank.html'
notes: Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated.
axes_moved:
- axis: regulatory.financial_deregulation
  direction: +
  magnitude: weak
  intended: true
  rationale: Bank inspection and monetary control powers were added relative to the predecessor currency
    board, which lacked a banking-supervision mandate.
enacted_by:
- seychelles_monetary_authority_reform_1978
