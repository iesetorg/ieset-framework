# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: at_nationalbank_independence_amendment_1998
status: candidate
title: Austria Nationalbank Act independence amendment 1998
countries: [AUT]
timeframe:
  start: 1998
  end: 1998
  effective_date: '1998-05-03'
description: >
  Austria's lower house passed the Nationalbank Act amendment on 25 March 1998,
  its upper house approved it on 17 April, and it was promulgated on 24 April.
  Its national independence provisions took effect on 3 May 1998, while
  provisions transferring monetary powers to the Eurosystem took effect with
  the euro in 1999.
enacted_by: [austria_klima_central_bank_statute_1997_2000]
coalition_label_at_enactment: SPÖ-ÖVP grand coalition
axes_moved:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: moderate
    rationale: National independence provisions took effect before euro entry.
references:
  - https://www.oenb.at/dam/jcr%3A93070658-de80-4c76-81dd-83597697b827/ar_1998_tcm16-8010.pdf
