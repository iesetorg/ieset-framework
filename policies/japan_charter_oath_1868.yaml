policy_id: japan_charter_oath_1868
status: candidate
title: Charter Oath of the Meiji government
countries: [JPN]
timeframe:
  start: 1868
  end: 1868
  enacted_date: "1868-04-06"
description: >
  The Charter Oath announced deliberative assemblies, public discussion, and
  the pursuit of knowledge as principles for the new Meiji government. It was
  a programmatic statement, not an implemented parliamentary constitution.
enacted_by:
  - japan_meiji_state_formation_1868_1872
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    intended: true
    rationale: The oath articulated a new national political framework and deliberative principles, without itself creating representative institutions or binding constitutional rights.
references:
  - "National Diet Library, Initial Steps toward a Constitutional State: https://www.ndl.go.jp/modern/e/cha1/"
notes: Candidate coding of a foundational political declaration, not a claim that its representative aspirations were realized.
