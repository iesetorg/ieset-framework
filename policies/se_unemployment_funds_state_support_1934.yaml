# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: se_unemployment_funds_state_support_1934
status: candidate
title: Sweden's 1934 state-supported voluntary unemployment funds
countries: [SWE]
timeframe:
  start: 1934
  enacted_date: '1934-06-15'
description: >
  In June 1934 the Riksdag adopted ordinances recognizing voluntary
  unemployment funds and providing state grants to them. The system took
  effect on 1 January 1935 and covered eligible wage earners who joined an
  approved fund. It was neither a universal benefit nor compulsory social
  insurance. State contributions expanded the public role in unemployment
  income support, while member contributions continued to fund the system.
enacted_by: [sweden_hansson_crisis_reforms_1933_1935]
coalition_label_at_enactment: Social Democratic minority government
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: weak
    intended: true
    rationale: >
      State grants to recognized unemployment funds added a limited,
      voluntary benefit channel from 1935; coverage was not universal.
references:
  - "Riksdag, Government Proposition 1937:172, quoting ordinances No. 264 and No. 265 of 15 June 1934: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/kungl-majts-proposition-nr-172_dy30172/html/"
  - "Swedish Government Official Report SOU 2008:54, section 2.2 on adoption, funding and 1 January 1935 commencement: https://www.regeringen.se/contentassets/c8ac7b3b1e5e47f693658714cd354db7/obligatorisk-arbetsloshetsforsakring-sou-200854/"
notes: >
  Attribution year is the 1934 Riksdag adoption; implementation began in
  1935. The transfer direction is a limited programme expansion, not a
  measured take-up or poverty outcome.
