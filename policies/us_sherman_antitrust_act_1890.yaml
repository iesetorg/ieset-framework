policy_id: us_sherman_antitrust_act_1890
status: candidate
title: Sherman Anti-Trust Act of 1890
countries: [USA]
timeframe:
  start: 1890
  end: 1890
  enacted_date: "1890-07-02"
description: >
  The Sherman Anti-Trust Act prohibited contracts, combinations, and conspiracies
  in restraint of interstate or foreign trade and made monopolization unlawful.
  It authorized federal proceedings against trusts while leaving businesses
  privately owned. The law's broad wording and early court interpretations
  limited practical enforcement, so its enactment is distinguished from later
  twentieth-century antitrust campaigns.
enacted_by:
  - us_gilded_age_federal_market_rules_1887_1890
axes_moved:
  - axis: regulatory.product_market_competition
    direction: "+"
    magnitude: weak
    intended: true
    rationale: The statutory prohibition aimed to curb restraints and monopoly, but limited early enforcement supports only a weak enactment-era competition step.
references:
  - "Sherman Anti-Trust Act, 26 Stat. 209 (1890): https://www.archives.gov/milestone-documents/sherman-anti-trust-act"
notes: Candidate coding concerns legal authorization at enactment, not demonstrated market outcomes or the stronger enforcement of the Progressive Era.
