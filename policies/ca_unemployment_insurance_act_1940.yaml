# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ca_unemployment_insurance_act_1940
status: candidate
title: Unemployment Insurance Act and constitutional amendment
countries: [CAN]
timeframe: {start: 1940, end: 1971, enacted_date: "1940-08-07"}
description: >
  After agreement with all provinces, the 1940 constitutional amendment added
  unemployment insurance to Parliament's enumerated powers. The Unemployment
  Insurance Act received Royal Assent on 7 August 1940 and came into effect in
  July 1941, initially covering selected industrial and manufacturing workers.
  Later 1971 reforms broadened coverage and benefits; this record describes the
  creation and subsequent extension of the national program.
enacted_by: [canada_unemployment_insurance_state_1940_1971]
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The statute established a contributory federal income-support program for covered unemployed workers.
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The constitutional amendment clarified federal legislative authority through agreement with the provinces.
references:
  - "Government of Canada, Federal-provincial agreements and the 1941 Unemployment Insurance Program: https://www.canada.ca/en/intergovernmental-affairs/services/federation/unemployment-insurance-program.html"
  - "Department of Justice Canada, British North America Act, 1940: https://justice.canada.ca/eng/rp-pr/csj-sjc/constitution/lawreg-loireg/p1t181.html"
  - "Employment and Social Development Canada, EI history and 1971 reforms: https://www.canada.ca/en/employment-social-development/programs/ei/ei-list/reports/monitoring2019/intro.html"
notes: "This records the federal program and authority; it does not imply that all workers were covered in 1941."
