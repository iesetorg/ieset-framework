policy_id: hu_eu_funds_rule_of_law_reform_2026
status: candidate
title: Hungary EU funds access amendment Act XVIII of 2026
countries: [HUN]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: '2026-06-26'
  effective_date: '2026-06-29'
description: >-
  Act XVIII of 2026 amends multiple Hungarian laws on oversight of EU funds,
  public-asset governance and integrity safeguards as part of efforts to meet
  previously agreed EU conditions. Parliament adopted the Act on 23 June
  2026 and it was promulgated on 26 June. Its general provisions commenced
  on the third day after promulgation; listed sections began on later dates.
  The Act records enacted legal changes, not Commission acceptance, payment
  of suspended EU funds or a measured improvement in the rule of law.
enacted_by:
  - hungary_magyar_tisza_2026_present
evaluation_design:
  event_dates:
    - '2026-06-23 parliamentary adoption of Act XVIII'
    - '2026-06-26 promulgation of Act XVIII'
    - '2026-06-29 general commencement under section 181(1)'
    - '2026-07-15, 2026-08-20 and 61st-day exceptions under section 181(2)-(4)'
  known_data_gaps:
    - Completion of every EU milestone, Commission assessment and actual disbursement remain unverified.
  notes: >-
    Effective_date is only the first general legal commencement, not a
    common date for every amended section. The preamble describes the
    package as addressing EU-funds conditions; no release of funds or
    institution-level outcome follows automatically from enactment.
references:
  - https://njt.jog.gov.hu/jogszabaly/2026-18-00-00.3
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
