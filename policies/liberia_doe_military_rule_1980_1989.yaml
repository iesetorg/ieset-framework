policy_id: liberia_doe_military_rule_1980_1989_policy
status: candidate
title: Doe military rule and state patronage
countries:
- LBR
timeframe:
  start: 1980
  end: 1989
description: The 1980 coup ended the long True Whig Party era and installed military rule, followed by
  a controlled constitutional transition and the contested 1985 election. The period combined concentrated
  political authority and patronage with an economy still dependent on private firms, foreign investment,
  and commodity exports; political authoritarianism should not be read as comprehensive state ownership.
enacted_by:
- liberia_doe_military_rule_1980_1989
scope: national
coalition_label_at_enactment: People’s Redemption Council / National Democratic Party of Liberia
axes_moved:
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  intended: true
  rationale: The coup displaced constitutional succession and consolidated military-led authority.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  intended: true
  rationale: Public patronage and state-controlled appointments expanded discretionary allocation; this
    is a period-level reading, not a fiscal-series estimate.
references:
- 'U.S. Department of State, Liberia background (2004): https://2009-2017.state.gov/outofdate/bgn/liberia/40628.htm'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
