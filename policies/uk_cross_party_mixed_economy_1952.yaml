# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_cross_party_mixed_economy_1952
status: candidate
title: UK post-war welfare state and mixed-economy cross-party settlement
countries: [GBR]
timeframe: {start: 1952, end: 1975, enacted_date: "1952-01-01"}
description: >
  Conservative and Labour governments broadly retained the post-war welfare state and
  a mixed economy, with public ownership of major utilities and industries persisting
  alongside private enterprise. The 1970s combined continued public provision with
  rising inflation, industrial conflict, and external shocks.
enacted_by: [uk_postwar_mixed_economy_and_consensus_1952_1975]
coalition_label_at_enactment: Conservative government under Winston Churchill
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "Welfare and health institutions established after the war remained cross-party commitments."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, intended: true, rationale: "Public ownership of selected industries and utilities continued despite partial denationalisation."}
references:
  - "UK Parliament, privatisation and public ownership chronology: https://researchbriefings.files.parliament.uk/documents/RP14-61/RP14-61.pdf"
notes: "Phase marker for the post-war settlement; the 1976 adjustment phase already has its own movement records."
