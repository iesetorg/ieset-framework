policy_id: canada_capital_gains_inclusion_2024
status: draft
title: Proposed Canada capital-gains inclusion increase (withdrawn)
countries:
- CAN
timeframe:
  start: 2024
  end: 2025
description: 'Budget 2024 proposed an increase in the capital-gains inclusion rate from 50% to 66.67% for corporations and trusts and for individuals on annual realised gains above C$250,000. The proposed
  25 June 2024 start was later deferred to 1 January 2026. The government then withdrew the proposal in March 2025; the enacted inclusion rate remained one-half. This record retains the proposal as history,
  not as an enacted capital-tax treatment.

  '
references:
- https://www.canada.ca/en/revenue-agency/news/newsroom/tax-tips/tax-tips-2025/update-cra-administration-proposed-capital-gains-taxation-changes.html
- https://budget.canada.ca/2025/report-rapport/pdf/budget-2025.pdf
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: "Unlegislated proposal; neither its announcement nor withdrawal is an enacted tax-rate change."
