policy_id: paraguay_stroessner_regime_1954_1989
status: candidate
title: Stroessner regime formation and authoritarian governance
countries: [PRY]
timeframe: {start: 1954, end: 1989}
description: >
  Alfredo Stroessner's 1954 coup established a Colorado Party and military
  dictatorship that lasted until the February 1989 coup. The regime combined
  political control and repression with private enterprise, foreign investment,
  and state-supported infrastructure and economic stabilisation; its political
  authoritarianism should not be read as proof of comprehensive state
  ownership.
enacted_by: [paraguay_stroessner_regime_1954_1989]
axes_moved:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: strong
    intended: true
    rationale: Political authority was concentrated in the ruling party and armed forces under a dictatorship.
references:
  - "OECD, Setting the scene: Good governance for a more sustainable and inclusive Paraguay: https://www.oecd.org/en/publications/oecd-public-governance-reviews-paraguay_9789264301856-en/full-report/component-5.html"
  - "World Bank, Paraguay: The Role of the State (Report No. 15044-PA): https://documents1.worldbank.org/curated/en/348711468757777070/pdf/multi_page.pdf"
