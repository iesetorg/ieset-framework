policy_id: uk_british_aerospace_shipbuilding_nationalisation_1977
status: candidate
title: UK British Aerospace and Shipbuilding nationalisation (1977)
countries:
- GBR
timeframe:
  start: 1977
  end: 1977
  enacted_date: '1977-03-17'
  treatment_onset_unresolved: true
description: >
  The Aircraft and Shipbuilding Industries Act 1977 established British
  Aerospace and British Shipbuilders and provided for securities of specified
  aircraft and shipbuilding companies to vest in those bodies. It received
  Royal Assent on 17 March 1977. Section 19 makes the aircraft and
  shipbuilding vesting dates separate appointed dates.
enacted_by:
- uk_callaghan_labour_1976_1979
coalition_label_at_enactment: Labour minority
references:
- 'UK legislation, Aircraft and Shipbuilding Industries Act 1977, introduction and sections 19 and 56: https://www.legislation.gov.uk/ukpga/1977/3/pdfs/ukpga_19770003_en.pdf'
notes: >
  Royal Assent does not date every company transfer. The exact company vesting
  roster and appointed dates require source coding before an effect test.
axes_moved:
- axis: regulatory.sectoral_licensing
  direction: +
  magnitude: strong
  rationale: Full public ownership of aerospace and shipbuilding sectors.
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: moderate
  rationale: Private competitors merged into state conglomerates.
