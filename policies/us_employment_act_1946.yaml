policy_id: us_employment_act_1946
status: candidate
title: Employment Act of 1946
countries: [USA]
timeframe: {start: 1946, enacted_date: '1946-02-20'}
description: >
  The Employment Act declared a continuing federal policy to coordinate
  national plans and resources, with cooperation from industry, agriculture,
  labor, and state and local governments, to promote maximum employment,
  production, and purchasing power while supporting free competitive enterprise
  and the general welfare. It established standing federal institutions for
  economic reporting and policy advice. The statutory objective did not itself
  guarantee an employment level or a specific amount of federal spending.
enacted_by:
