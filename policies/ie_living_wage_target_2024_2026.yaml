policy_id: ie_living_wage_target_2024_2026
status: draft
title: Ireland living-wage target provenance lead
countries:
- IRL
timeframe:
  start: 2022
  end: ongoing
description: >
  The Government announced a target on 16 November 2022 to transition the
  national minimum wage toward a living wage of 60% of median hourly earnings.
  This record preserves that decision's provenance while the separate annual
  statutory wage changes are checked. It is not a Harris-era enactment and
  does not establish fiscal tax, spending, or transfer effects.
references:
- https://www.gov.ie/en/department-of-enterprise-tourism-and-employment/press-releases/t%C3%A1naiste-announces-introduction-of-national-living-wage/
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The 2022 target and later annual minimum-wage decisions need distinct legal
  instruments before this lead can become a scored policy treatment.
