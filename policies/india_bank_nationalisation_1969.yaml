policy_id: india_bank_nationalisation_1969
status: candidate
title: India Bank Nationalisation 1969
countries:
- IND
timeframe:
  start: 1969
  end: ongoing
  effective_date: '1969-07-19'
description: >-
  India transferred the undertakings of fourteen large commercial banks to the
  state on 19 July 1969. The Banking Companies (Acquisition and Transfer of
  Undertakings) Act, 1970, gave the acquisition and transfer statutory form
  with that date as its enforcement date. The later nationalisation of six
  additional banks in 1980 was a separate measure.
enacted_by:
- india_swadeshi_economic_nationalism_pre_1991
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
references:
- https://www.indiacode.nic.in/indiacode/handle/123456789/1373?view_type=browse
- https://www.rbi.org.in/Scripts/PublicationReportDetails.aspx?ID=1160
notes: >-
  India Code dates the 1970 Act to 31 March 1970 and its enforcement to 19 July
  1969. This row tracks the 1969 acquisition, not the separate 1980 tranche.
  The previous 1951 start and 1991 end followed the parent movement rather
  than this measure. The former licensing, trade, fiscal, and financial-axis
  assignments lacked intervention-specific evidence or used an inverted axis
  sign, so they are withheld pending component-level review.
