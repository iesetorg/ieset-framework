policy_id: us_securities_exchange_act_1934
status: candidate
title: Securities Exchange Act of 1934
countries:
- USA
timeframe:
  start: 1934
  end: ongoing
  enacted_date: '1934-06-06'
  effective_date: '1934-07-01'
description: >-
  The Securities Exchange Act of 1934 created the Securities and Exchange Commission
  and established federal oversight of national securities exchanges, securities
  transactions, brokers and dealers, issuer reporting, and proxy solicitation.
  Its provisions began to take effect in stages during 1934.
enacted_by:
- us_fdr_new_deal_1933_1939
axes_moved:
- axis: regulatory.financial_deregulation
  direction: +
  magnitude: weak
  intended: true
  rationale: The 1934 Act expanded federal securities-market oversight and disclosure duties; this axis defines + as tighter financial regulation.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
references:
- https://www.govinfo.gov/content/pkg/USCODE-2024-title15/html/USCODE-2024-title15-chap2B.htm
notes: >-
  Section 34 gives 1 July 1934 as the general commencement date, with specified
  provisions commencing on 1 September and 1 October 1934. The continuing end
  denotes the amended statute, not an unchanged 1934 treatment. Later SEC rules
  and other New Deal policies are outside this record.
