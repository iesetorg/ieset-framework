policy_id: us_dodd_frank_2010
status: candidate
title: Dodd-Frank Wall Street Reform and Consumer Protection Act 2010
countries:
- USA
timeframe:
  start: 2010
  enacted_date: '2010-07-21'
description: >
  Public Law 111-203 established the Consumer Financial Protection Bureau and
  Financial Stability Oversight Council, restricted certain proprietary trading
  by banking entities, required enhanced prudential standards for designated
  large financial firms, created an orderly liquidation framework, and expanded
  derivatives oversight. This record codes the 2010 statute, not a measured
  change in crisis risk or credit access.
enacted_by:
- us_obama_first_term_2009_2013
coalition_label_at_enactment: Democratic trifecta (Obama administration + 111th Congress)
