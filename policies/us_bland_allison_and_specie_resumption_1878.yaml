policy_id: us_bland_allison_and_specie_resumption_1878
status: candidate
title: United States Bland–Allison Act and return to specie payments
countries: [USA]
timeframe: {start: 1878, end: 1879, enacted_date: "1878-02-28"}
description: >
  The Bland–Allison Act required Treasury purchases of silver bullion and its coinage,
  while the Resumption Act took effect in 1879 and restored redemption of U.S. notes
  in specie. Together they reflected contested monetary choices during post-Civil War
  adjustment, with limited federal social spending and continued tariff protection.
enacted_by: [us_gilded_age_industrial_growth_1878_1886]
coalition_label_at_enactment: Hayes administration and congressional monetary coalitions
axes_moved:
  - {axis: monetary.central_bank_independence, direction: "mixed", magnitude: weak, intended: true, rationale: "The measures changed Treasury money and specie obligations before establishment of the Federal Reserve."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, intended: true, rationale: "The Treasury was required to purchase and coin silver bullion."}
references:
  - "U.S. Congress, Bland–Allison Act, 1878: https://www.govinfo.gov/content/pkg/STATUTE-20/pdf/STATUTE-20-Pg25.pdf"
notes: "The 1878 start reflects both monetary statutes and the wider post-Reconstruction period."
