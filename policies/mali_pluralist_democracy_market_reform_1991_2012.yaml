# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: mali_pluralist_democracy_market_reform_1991_2012_policy
status: candidate
title: Third Republic, pluralist democracy, and market reform
countries:
- MLI
timeframe:
  start: 1991
  end: 2011
description: The 1991 transition led to the 1992 constitution and a pluralist multiparty republic. The
  government continued a decade of reforms that shifted parts of the economy from state control toward
  market mechanisms, including public-enterprise restructuring and privatisation. Political transition,
  social tensions, and uneven state capacity shaped implementation.
enacted_by:
- mali_pluralist_democracy_market_reform_1991_2012
scope: national
coalition_label_at_enactment: Transition government and successive elected governments
axes_moved:
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  intended: true
  rationale: The 1992 constitution established multiparty democratic institutions.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: true
  rationale: Privatisation and public-enterprise reform sought to increase private-sector activity.
- axis: fiscal.spending_level
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Civil-service and enterprise reforms aimed to reduce fiscal burdens, while social-service
    spending continued.
references:
- 'UN Committee on the Rights of the Child, Mali second periodic report: https://digitallibrary.un.org/record/582290/files/CRC_C_MLI_2-EN.pdf'
- 'IMF, Mali: structural reforms and macroeconomic adjustment 1988–98: https://www.elibrary.imf.org/view/journals/002/1999/020/article-A001-en.xml'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
