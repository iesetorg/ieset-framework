title: 'Pae Ora (Healthy Futures) Act 2022: Māori Health Authority'
countries:
- NZL
timeframe:
  start: 2022
  end: 2024
  enacted_date: '2022-06-14'
  effective_date: '2022-07-01'
  treatment_onset_unresolved: true
description: The Pae Ora (Healthy Futures) Act 2022 established the Māori Health Authority and
  Health New Zealand as national health entities, replacing district health boards and assigning
  Māori health commissioning and planning functions within the new system. The Act received
  Royal assent on 14 June and commenced on 1 July 2022. It changed public health governance;
  it did not create an occupational licence or document a quantified health outcome.
