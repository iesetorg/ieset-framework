policy_id: uk_electricity_privatisation_1989_1990
status: candidate
title: UK electricity privatisation (1989-1991)
countries:
- GBR
timeframe:
  start: 1989
  end: 1991
  enacted_date: '1989-07-27'
  treatment_onset_unresolved: true
description: >
  The Electricity Act 1989 provided the legal framework for transfers from
  electricity boards into successor companies and for licensing and
  regulation. The Central Electricity Generating Board was divided in 1990;
  regional electricity companies were sold in December 1990 and stakes in
  National Power and PowerGen in March 1991. Transmission and distribution
  price controls began at vesting on 31 March 1990. Royal Assent on 27 July
  1989 was not the common company-level transfer or sale date.
enacted_by:
- uk_thatcher_third_term_1987_1990
coalition_label_at_enactment: Conservative (Thatcher III)
references:
- 'UK legislation, Electricity Act 1989, introduction and section 113: https://www.legislation.gov.uk/ukpga/1989/29/pdfs/ukpga_19890029_en.pdf'
- 'UK Competition and Markets Authority, Energy market investigation final report, paragraphs 7.5-7.7: https://assets.publishing.service.gov.uk/media/5773de34e5274a0da3000113/final-report-energy-market-investigation.pdf'
- 'UK energy regulator, Annex D major events in the energy industry, 1990-1991: https://assets.publishing.service.gov.uk/media/5b8e8595ed915d1ee57a5d0c/Annex_D_1990_to_2018.pdf'
notes: >
  Royal Assent is a legal framework date. Board vesting, individual company
  sale and subsequent market exposure occurred on different dates;
  company-level treatment remains uncoded.
axes_moved:
