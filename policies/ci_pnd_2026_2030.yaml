# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ci_pnd_2026_2030
status: candidate
title: Côte d'Ivoire National Development Plan 2026–2030
countries: [CIV]
timeframe: {start: 2026, end: ongoing, enacted_date: "2026-04-14"}
description: >
  The National Assembly adopted the National Development Plan 2026–2030 as a
  five-year framework for public policy and investment. The plan sets a large
  investment programme funded mainly by private investment while reserving a
  substantial public component for infrastructure, industrialisation, human
  capital, agriculture, and governance. Its targets remain plans, not achieved
  outcomes.
coalition_label_at_enactment: Alassane Ouattara presidency and RHDP government
enacted_by: [cote_divoire_ouattara_development_planning_2011_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "The plan assigns a substantial investment share to public infrastructure and state services."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "The plan prioritises agriculture, agro-industry, infrastructure, and industrialisation."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, intended: true, rationale: "Most projected investment is private and the framework seeks stronger private-sector activity, although realised competition effects are not measured."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, intended: true, rationale: "The plan includes human-capital and social inclusion priorities but does not specify a quantified transfer change."}
references:
  - "National Assembly adoption, 14 April 2026: https://www.plan.gouv.ci/actualite/947"
  - "Government of Côte d'Ivoire, 2026–2030 National Development Plan: https://www.gouv.ci/index.php/actualite/pnd-2026-2030-la-cote-divoire-accelere-sa-transformation-pour-batir-une-grande-nation-stable-ambitieuse-et-solidaire-0846"
notes: "Plan targets are not treated as realised expenditure or growth outcomes."
