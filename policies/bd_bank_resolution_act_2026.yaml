# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bd_bank_resolution_act_2026
status: candidate
title: Bangladesh Bank Resolution Act 2026
countries: [BGD]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: '2026-04-10'
  effective_date: '2026-04-10'
description: >-
  Act No. 88 of 2026 gives Bangladesh Bank a statutory framework for
  resolution of troubled scheduled banks. Section 1(4) says the Act enters
  into force immediately. Section 74 repeals the 2025 Bank Resolution
  Ordinance while preserving measures taken under that ordinance. This is
  a parliamentary continuation and codification of a pre-existing framework;
  the record does not treat it as a new rescue, restored bank solvency, or
  evidence of implementation success.
enacted_by:
  - bangladesh_tarique_rahman_bnp_2026_present
evaluation_design:
  event_dates:
    - '2025-05-09 predecessor Bank Resolution Ordinance issued under the interim government'
    - '2026-04-10 Act No. 88 enacted and effective immediately under section 1(4)'
  known_data_gaps:
    - No bank-specific resolution outcome or causal macroeconomic effect is established by this Act.
    - The 2026 Act carries forward a pre-existing ordinance; only statutory continuity is attributed to this government.
  notes: >-
    The government's broad banking-sector repair programme remains a forward
    reference. This record covers the narrower parliamentary enactment of
    bank-resolution powers, not supervisory execution or rehabilitation.
references:
  - https://bdlaws.minlaw.gov.bd/act-print-1717.html
  - https://bdlaws.minlaw.gov.bd/act-print-1532.html
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Dated statute and continuity only. No observed banking outcome, causal
  effect, movement-axis or school-score credit is assigned.
