policy_id: namibia_independence_constitution_1990
status: candidate
title: Namibian Constitution and independence settlement
countries: [NAM]
timeframe:
  start: 1990
  enacted_date: "1990-03-21"
description: >
  Namibia's Constitution took effect at independence on 21 March 1990. It
  established a multiparty democratic republic, protected fundamental rights,
  and recognized property rights subject to constitutionally defined
  expropriation for public interest with just compensation. It marks the legal
  opening framework for the post-independence state rather than a single
  market/state score.
enacted_by: [namibia_swapo_post_independence_governance_1990_2019]
references:
  - "Constitution of the Republic of Namibia, 1990: https://namiblii.org/akn/na/act/1990/constitution/eng%402014-10-13"
  - "World Bank, Namibia country overview: https://www.worldbank.org/ext/en/country/namibia"
