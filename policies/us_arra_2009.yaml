policy_id: us_arra_2009
status: candidate
title: ARRA Section 1705 clean-energy loan guarantees
countries:
- USA
timeframe:
  start: 2009
  end: 2011
  enacted_date: '2009-02-17'
description: >
  Section 406 of Public Law 111-5 added Section 1705 to the Energy Policy Act
  of 2005. It authorized temporary federal loan guarantees for eligible U.S.
  renewable-energy systems, electric-power transmission, and leading-edge
  biofuel projects that began construction by 30 September 2011. This record
  describes the targeted credit-support provision within the Recovery Act,
  not a second enactment of the Act or a measured energy or economic outcome.
enacted_by:
- us_obama_ara_2009_recovery
axes_moved:
- axis: fiscal.sectoral_subsidy
  direction: +
  intended: true
  rationale: Section 1705 created targeted federal credit support for specified energy projects; authority alone does not establish the value or effects of loans issued.
references:
- 'American Recovery and Reinvestment Act, Public Law 111-5, Section 406 (17 February 2009): https://www.govinfo.gov/content/pkg/PLAW-111publ5/html/PLAW-111publ5.htm'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Narrow Section 1705 facet of Public Law 111-5. The parent
  us_obama_ara_2009_recovery policy records the Act's general spending and
  transfer provisions. The two policy IDs share one statute and must not be
  counted as two national policy events or two independent outcome tests.
