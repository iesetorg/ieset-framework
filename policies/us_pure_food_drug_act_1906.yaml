# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_pure_food_drug_act_1906
status: candidate
title: Pure Food and Drug Act 1906
countries: [USA]
timeframe:
  start: 1906
  end: 1906
  enacted_date: "1906-06-30"
description: >
  The Pure Food and Drug Act of 1906 prohibited interstate commerce in adulterated
  or misbranded food and medicines, required more truthful labelling, and gave the
  federal government a durable enforcement role in consumer-product safety. Paired
  with the Meat Inspection Act, it marked a decisive break from the weak and highly
  fragmented pre-1906 regime in which quality standards depended mostly on state law,
  reputation, or private litigation.
enacted_by:
  - us_progressive_era_reform_consensus_1901_1917
references:
  - "Food and Drugs Act, 34 Stat. 768–772 (1906): https://www.govinfo.gov/content/pkg/STATUTE-34/pdf/STATUTE-34-Pg768.pdf"
  - "FDA, Part I: The 1906 Food and Drugs Act and Its Enforcement: https://www.fda.gov/about-fda/changes-science-law-and-regulatory-authorities/part-i-1906-food-and-drugs-act-and-its-enforcement"
notes: >
  The 1906 act regulated adulteration and labeling through postmarket enforcement,
  not premarket entry permission. The current axes taxonomy has no dedicated
  consumer-product-safety axis. Sections 3–5 prescribe enforcement procedure,
  but that alone does not establish a country-level change in institutional
  rule of law. No axis score is assigned to this policy.
