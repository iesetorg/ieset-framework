policy_id: uk_factory_act_1844_women_hours
status: candidate
title: UK factory working-hours rules extended to adult women, 1844
countries: [GBR]
scope: national
timeframe:
  start: 1844
  enacted_date: '1844-06-06'
  effective_date: '1844-10-01'
description: >
  The Factory Act 1844 amended the earlier factory rules for mechanically
  powered textile premises throughout the United Kingdom of Great Britain
  and Ireland. From its general commencement on 1 October 1844, section XXXII
  subjected women over eighteen employed in covered factories to the same
  hours and manner-of-work restrictions as young persons. The Act also revised
  child-work arrangements, records and inspection rules, with stated exceptions
  and separate commencement for specified provisions. It did not set a general
  working-hours rule for adult men or every workplace.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: >
    Section XXXII extended the covered factories' existing young-person
    working-hours restrictions to adult women. The sign reflects the statutory
    limit on scheduling, not a measured employment effect; magnitude is withheld.
references:
- 'Factory Act 1844, 7 & 8 Vict. c. 15, as enacted, sections I, XXXII and LXXIII: https://www.legislation.gov.uk/ukpga/Vict/7-8/15/pdfs/ukpga_18440015_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Section I specifies 1 October 1844 as the general effective date, except
  provisions with separately specified starts; section II altered inspectors'
  powers on passage. The effective_date here is the start of the adult-women
  working-hours rule in section XXXII. GBR denotes the historical United
  Kingdom including Ireland, not a separately scored modern IRL jurisdiction.
  This policy-only record creates no movement or numeric country-drift step.
