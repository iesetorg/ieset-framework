# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bg_currency_board_and_eu_transition_1997
status: candidate
title: Bulgaria currency board and EU accession reform programme
countries: [BGR]
timeframe: {start: 1997, end: 2007, enacted_date: "1997-07-01"}
description: >
  Bulgaria introduced a currency board in July 1997 and accelerated stabilisation,
  privatisation, price liberalisation, and institutional reforms linked to European
  Union accession. Negotiations opened in 1999 and accession followed in 2007.
enacted_by: [bulgaria_currency_board_eu_accession_reforms_1997_2007]
coalition_label_at_enactment: Reform government led by the Union of Democratic Forces
axes_moved:
  - {axis: monetary.central_bank_independence, direction: "+", magnitude: moderate, intended: true, rationale: "The currency board constrained discretionary monetary and government financing."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, intended: true, rationale: "Privatisation and liquidation reduced the state enterprise footprint."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "EU accession requirements and market integration deepened openness."}
references:
  - "World Bank, Bulgaria transition and crisis: https://documents1.worldbank.org/curated/en/984761468769131587/pdf/multi0page.pdf"
  - "World Bank, Bulgaria stabilization and EU accession structural reforms: https://documents1.worldbank.org/curated/en/253381468015849237/pdf/342330BG.pdf"
notes: "A long programme record links the 1997 monetary anchor with later EU-linked structural reforms."
