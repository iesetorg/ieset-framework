# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: mmr_state_administration_council_military_takeover_2021
status: candidate
title: Myanmar military takeover and State Administration Council
countries: [MMR]
timeframe: {start: 2021, end: ongoing, enacted_date: "2021-02-01"}
description: >
  The armed forces detained elected civilian leaders and displaced the elected
  government in February 2021, then established the State Administration
  Council. The takeover undermined constitutional government and was followed
  by repression, civil disobedience, and armed resistance that fragmented
  territorial control and disrupted public services.
enacted_by: [myanmar_state_administration_council_2021_present]
coalition_label_at_enactment: Myanmar armed forces and State Administration Council
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: "The coup displaced elected civilian institutions and detained elected leaders; these are institutional effects rather than an asserted economic policy goal."}
references:
  - "UN Secretary-General, report on Myanmar, S/2025/81: https://myanmar.un.org/sites/default/files/2025-04/n2506635%20%281%29.pdf"
notes: "The report documents the coup regime and its contestation; this entry makes no claim that it controls the full national territory."
