policy_id: fr_pension_reform_2023
status: candidate
title: Retirement-age reform 62 → 64 (Borne government)
countries:
- FRA
timeframe:
  start: 2023
  enacted_date: '2023-04-14'
  treatment_onset_unresolved: true
description: >
  Law no. 2023-270 of 14 April 2023 raised the ordinary retirement opening age
  from 62 toward 64, by three months for successive birth cohorts from those
  born after August 1961, reaching 64 for cohorts born from 1968. It also
  accelerated the schedule for 43 years of insurance for a full-rate pension.
  The implementing decree applies the age rules to pensions taking effect from
  1 September 2023, with cohort and regime exceptions.
enacted_by:
- france_macron_presidency_2017_present
coalition_label_at_enactment: Renaissance-led relative plurality (Borne government)
references:
- 'Légifrance, original Law no. 2023-270, promulgated 14 April 2023 and published 15 April 2023, article 10: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047445077'
- 'Légifrance, Decree no. 2023-436 of 3 June 2023, article 1 and application from 1 September 2023: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047625782'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The former description misstated the step as four months; the decree specifies
  three-month steps. Birth-cohort and pension-regime exposure must be defined
  before treatment timing is ready. A retirement-eligibility rule is not a
  direct change to labour-market flexibility; fiscal savings or employment
  effects are outcomes to test, not policy-axis changes established here.
