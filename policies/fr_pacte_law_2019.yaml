  treatment_onset_unresolved: true
description: >
  Law no. 2019-486 of 22 May 2019 changed employee-count thresholds and
  crossing rules for specified business obligations, revised employee-saving
  arrangements, and authorised capital transactions involving Française des
  Jeux and Aéroports de Paris. The legal authorisations do not themselves
  establish that either sale occurred; provisions commenced on different dates.
enacted_by:
- france_macron_presidency_2017_present
coalition_label_at_enactment: La République en Marche / MoDem presidential majority
references:
- 'Légifrance, original Law no. 2019-486, promulgated 22 May 2019 and published 23 May 2019, articles 11 and 130-139: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000038496102'
notes: >
  Article 11's main employee-threshold changes were deferred to 1 January 2020,
  with transitional exceptions; other provisions have separate dates. The
  prior text mixed legal authorisation with later sale implementation. No
  common firm-level treatment onset or sale outcome is coded here. The former
  financial-deregulation plus sign conflicted with that axis's definition of
  tighter bank regulation, and the broad business bundle cannot be assigned a
  single product-market-competition movement from this law alone.
