policy_id: japan_oecd_accession_1964
status: candidate
title: Japan Oecd Accession 1964
countries:
- JPN
timeframe:
  start: 1964
  end: 1964
  effective_date: '1964-04-28'
description: >-
  Japan became an OECD member on 28 April 1964 and adhered to the OECD Codes
  of Liberalisation of Capital Movements and Current Invisible Operations.
  OECD documentation records substantial initial reservations, including 18
  major capital-transaction items. Membership created a phased legal framework;
  it does not establish that every capital control, sectoral screen or goods
  trade restriction was removed on the accession date.
