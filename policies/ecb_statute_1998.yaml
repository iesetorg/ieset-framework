timeframe:
  start: 1998
  effective_date: '1998-06-01'
description: 'The ESCB and ECB Statute was annexed to the Maastricht Treaty, which entered into force in 1993. The ECB itself was established on 1 June 1998 after the initial eleven euro participants were selected;
  their national central banks became part of the Eurosystem when the single monetary policy began on 1 January 1999. This record dates the ECB institution, not a simultaneous 1992 domestic central-bank reform
  across those countries.

  '
