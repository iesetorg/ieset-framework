  rationale: €10.5bn package, core spending growth ~9% — third year above the self-imposed 5% ceiling.
- axis: fiscal.transfer_expansion
  direction: +
  magnitude: moderate
  intended: true
  rationale: €2.2bn once-offs (energy credits, welfare double-weeks, child-benefit double) plus €12 base-rate weekly increase.
- axis: fiscal.tax_progressivity
