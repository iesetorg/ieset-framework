policy_id: us_national_defense_education_act_1958
status: candidate
title: National Defense Education Act of 1958
countries: [USA]
timeframe: {start: 1958, end: 1968, enacted_date: '1958-09-02'}
description: >
  The National Defense Education Act authorized federal support for student
  loans, fellowships, research, and instruction in areas including science,
  mathematics, and foreign languages. Congress framed the program as a response
  to national-defense and education needs following Sputnik. It expanded federal
  involvement in education finance and capacity, while the exact incidence and
  long-run effects varied across institutions and students.
enacted_by:
  - us_postwar_bipartisan_economic_settlement_1944_1963
axes_moved:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: weak
    intended: true
    rationale: Federal loans, grants, and institutional support subsidized education and research in designated fields.
references:
  - "National Defense Education Act, 72 Stat. 1580 (1958)"
  - "National Archives, Office of Education records: https://www.archives.gov/research/guide-fed-records/groups/012.html"
