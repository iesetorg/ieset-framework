# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: hu_public_media_independence_reset_2026
status: candidate
title: Hungary 2026 public-media governance amendment
countries: [HUN]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: '2026-06-26'
  effective_date: '2026-07-26'
description: >-
  Act XXI of 2026 amends Hungary's 2010 media-services law and the 2012
  parliamentary law. Its substantive provisions create an Independent Public
  Media Board and change public-media oversight, appointments and governance.
  Parliament adopted the Act on 23 June 2026 and it was promulgated on
  26 June; the substantive sections began on the thirtieth day after
  promulgation. The statute does not itself establish that board members
  were appointed or that editorial independence changed in practice.
enacted_by:
  - hungary_magyar_tisza_2026_present
evaluation_design:
  event_dates:
    - '2026-06-23 parliamentary adoption of Act XXI'
    - '2026-06-26 promulgation of Act XXI'
    - '2026-07-26 substantive sections 1-37 and 39-46 commenced under section 47(2)'
  known_data_gaps:
    - Board appointment, newsroom practice and media-pluralism outcomes require separate evidence.
    - Some later implementation, funding and entity-transition provisions have distinct dates.
  notes: >-
    Effective_date codes the law's substantive governance provisions, not
    immediate completion of all organisational transitions. No realised
    independence or rule-of-law score is inferred from the legal design.
references:
  - https://njt.jog.gov.hu/jogszabaly/2026-21-00-00.0
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Statutory governance change only. No measured media, causal, policy,
  movement-axis or school-score outcome is assigned.
