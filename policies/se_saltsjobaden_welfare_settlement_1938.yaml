policy_id: se_saltsjobaden_welfare_settlement_1938
status: candidate
title: "Saltsjöbaden labour accord and postwar welfare expansion"
countries: [SWE]
timeframe: {start: 1938, end: 1975}
description: >
  The 1938 Saltsjöbaden Agreement institutionalized labour-market cooperation
  between the LO trade-union confederation and the employers' federation,
  leaving collective bargaining primarily to organized labour and employers
  while the Social Democratic state expanded social insurance and welfare
  services during the postwar decades. The model retained private ownership
  and an export-oriented market economy; this record describes the settlement
  and its broad postwar development, not a single enacted statute.
enacted_by: [sweden_sap_saltsjobaden_and_postwar_welfare_1936_1975]
coalition_label_at_enactment: "Social Democratic Party governments and peak labour-market organizations"
axes_moved:
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: strong, rationale: "The postwar settlement expanded social insurance and welfare-state provision over several decades.", intended: true}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Public responsibility for social security and services grew during sustained postwar expansion.", intended: true}
  - {axis: regulatory.labour_market_flexibility, direction: mixed, magnitude: moderate, rationale: "Centralized collective bargaining coordinated wage-setting while relying heavily on negotiated labour-market self-regulation rather than direct state wage controls.", intended: true}
references:
