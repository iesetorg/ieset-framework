  direction: +
  magnitude: weak
  intended: true
  rationale: The Act authorized federal investment and state fiscal assistance; tax relief and transfers are distinct components.
- axis: fiscal.transfer_expansion
  direction: +
  magnitude: weak
  intended: true
  rationale: The Act extended unemployment support and increased health and nutrition assistance during the recession.
