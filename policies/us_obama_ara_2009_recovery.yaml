policy_id: us_obama_ara_2009_recovery
status: candidate
title: American Recovery and Reinvestment Act of 2009
countries:
- USA
timeframe:
  start: 2009
  enacted_date: '2009-02-17'
description: >
  Public Law 111-5 combined tax relief, unemployment and health-program aid,
  state fiscal assistance, and federal investment in infrastructure, education,
  health information technology, and energy projects. This record captures the
  2009 Recovery Act only; Dodd-Frank and the Affordable Care Act were separate
  2010 statutes. It does not assign an observed economic outcome to the Act.
enacted_by:
- us_obama_first_term_2009_2013
