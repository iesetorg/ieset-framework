policy_id: de_basic_law_1949
status: candidate
title: Basic Law of the Federal Republic of Germany, 1949
countries: [DEU]
scope: national
timeframe:
  start: 1949
  end: 1949
  enacted_date: '1949-05-23'
  effective_date: '1949-05-24'
description: >
  The Parliamentary Council promulgated the Basic Law on 23 May 1949, and it
  entered into force on 24 May. It established a federal parliamentary state
  with binding basic rights, equality before the law, independent courts, and
  constitutional review. At adoption it applied to the new West German federal
  state, not the Soviet occupation zone or later East Germany; its extension to
  the eastern states followed reunification in 1990.
axes_moved:
  - axis: institutional.rule_of_law
    direction: '+'
    magnitude: moderate
    intended: true
    rationale: The operative constitution established enforceable basic-rights and judicial architecture in the West German state; later implementation is a separate question.
references:
  - 'German Bundestag, original adoption and territorial history: https://www.bundestag.de/dokumente/textarchiv/1949-05-23-grundgesetz-641776'
  - 'German Bundestag, promulgation and entry into force: https://www.bundestag.de/parlament/grundgesetz/aktueller-begriff-grundgesetz-643586'
  - 'Federal Constitutional Court, separate 1951 operational dates: https://www.bundesverfassungsgericht.de/EN/TheFederalConstitutionalCourt/History/history_node.html'
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
notes: >
  The Basic Law was drafted by a multiparty Parliamentary Council before the
  Adenauer government existed. The contemporary Erhard social-market movement
  references this institutional setting, but is not named as the enactor.
  The DEU country key denotes the West German legal territory in 1949, not
  all territory of present-day Germany. This is a formal legal policy step,
  not a measured national rule-of-law outcome.
