# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: liberia_postwar_reconstruction_2003_2024_policy
status: candidate
title: Postwar transition and competitive multiparty governments
countries:
- LBR
timeframe:
  start: 2003
  end: 2023
description: The 2003 Comprehensive Peace Agreement established a transitional government and a route
  to elections by 2005. Competitive elections and postwar rebuilding followed under successive governments.
  This broad period captures institutional reconstruction and electoral competition; it does not imply
  uninterrupted stability or a single economic-policy direction.
enacted_by:
- liberia_postwar_reconstruction_2003_2024
scope: national
coalition_label_at_enactment: National Transitional Government, Unity Party, and Coalition for Democratic
  Change governments
axes_moved:
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  intended: true
  rationale: The peace agreement and subsequent elections restored constitutional political competition
    after war.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  intended: true
  rationale: Post-conflict reconstruction relied on public administration and externally supported state
    rebuilding; the axis is a cautious period summary.
references:
- 'Comprehensive Peace Agreement of Liberia (2003), U.S. Department of State archive: https://2001-2009.state.gov/p/af/rls/24149.htm'
- 'UNMIL, Liberia elections and transition (2005): https://peacekeeping.un.org/sites/default/files/yir2005.pdf'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
