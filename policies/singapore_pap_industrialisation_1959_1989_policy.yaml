# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: singapore_pap_industrialisation_1959_1989_policy
status: candidate
title: Singapore's PAP-era industrialisation and development strategy
countries:
  - SGP
timeframe:
  start: 1959
  end: 1989
description: >
  From self-government in 1959 and independence in 1965, Singapore built a
  state-directed programme of export-oriented industrialisation, public housing,
  education, and infrastructure while attracting multinational investment and
  maintaining international trade links. CPF social insurance is part of the
  broader institutional setting, but this record codes the distinct national
  development strategy rather than treating the 1955 CPF ordinance as a 1959 event.
enacted_by:
  - singapore_pap_industrialisation_1959_1989
scope: national
coalition_label_at_enactment: People's Action Party government
axes_moved:
  - axis: fiscal.spending_level
    direction: +
    magnitude: moderate
    intended: true
    rationale: Public housing, infrastructure, and education required substantial state programmes and investment.
  - axis: regulatory.trade_openness
    direction: +
    magnitude: moderate
    intended: true
    rationale: Export-led industrialisation and foreign investment integrated the economy with external markets.
  - axis: regulatory.product_market_competition
    direction: +
    magnitude: weak
    intended: true
    rationale: Policy sought competitive export industries and investment, alongside extensive state planning and coordination.
references:
  - "Singapore Parliament, Historical Development: https://www.parliament.gov.sg/history/historical-development"
  - "SG101, 1959-1965: https://www.sg101.gov.sg/economy/surviving-our-independence/1959-1965/"
  - "SG101, 1965-1970: https://www.sg101.gov.sg/economy/surviving-our-independence/1965-1970/"
notes: >
  Period-level candidate for the transition to self-government and the initial
  PAP development strategy. Singapore became an independent state in 1965.
