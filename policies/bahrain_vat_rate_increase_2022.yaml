# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bahrain_vat_rate_increase_2022
status: candidate
title: Bahrain VAT rate increase to 10 percent
countries:
- BHR
timeframe:
  start: 2022
  end: ongoing
  enacted_date: '2021-12-18'
  effective_date: '2022-01-01'
description: 'Bahrain doubled the standard value-added tax rate from 5 percent to 10 percent from 1 January 2022 as part of a non-oil revenue and fiscal-balance package. The measure retained the GCC VAT
  architecture but increased the consumption-tax burden on most taxable goods and services, widening a revenue source that had only been introduced in Bahrain in 2019.

  '
enacted_by:
- bahrain_hamad_salman_fiscal_diversification_2020_present
scope: national
coalition_label_at_enactment: Al Khalifa monarchy; Crown Prince Salman cabinet
references:
- 'Bahrain Law No. 33 of 2021, Articles 3-5 (official Arabic text): https://www.lloc.gov.bh/Legislation/HTM/K3321'
- 'Bahrain Legislation and Legal Opinion Commission, official English amendment index: https://www.legalaffairs.gov.bh/En/Legislation/Amendments/L4818'
evaluation_design:
  regulated_units:
  - Standard-rated supplies and imports from 1 January 2022, subject to the statutory transition for older contracts.
  exempt_or_uncontrolled_units:
  - Statutorily zero-rated or exempt supplies.
  - Qualifying pre-2022 contracts retaining the 5 percent rate temporarily under Article 4.
  event_dates:
  - '2021-12-18: Law No. 33 of 2021 issued.'
  - '2021-12-23: Official Gazette publication.'
  - '2022-01-01: Article 3 standard-rate increase took effect.'
  notes: Article 4 can preserve the old rate for eligible pre-existing contracts until contract end, amendment, renewal, or one year, whichever occurs first.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: The canonical tax-progressivity axis measures the personal income-tax schedule, not VAT; the law itself does not establish a spending cut. This consumption-tax decision remains unscored pending an appropriate axis.
