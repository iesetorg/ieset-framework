policy_id: cz_windfall_tax_2023
status: candidate
title: Czech temporary windfall-profits tax (2023–2025)
countries: [CZE]
timeframe:
  start: 2023
  end: 2025
  enacted_date: '2022-11-24'
  effective_date: '2023-01-01'
description: >
  Act No. 366/2022 Coll. added a temporary 60 percent surcharge on excess
  profits of qualifying energy, fossil-fuel and banking companies for tax
  years 2023–2025. The surcharge applies to profits above a statutory
  comparison with the 2018–2021 average plus an allowance. It is a targeted
  corporate-tax measure, distinct from the general corporate-rate increase
  in the 2024 consolidation package.
enacted_by:
  - czech_republic_fiala_spolu_2021_2025
axes_moved:
  - axis: fiscal.tax_corporate
    direction: '+'
    magnitude: weak
    intended: true
    rationale: Temporary surcharge raises the burden for qualifying firms with excess profits, not all corporations.
references:
  - https://financnisprava.gov.cz/cs/dane/dane/dan-z-prijmu/dan-z-neocekavanych-zisku/pravni-uprava/zakladni-informace-k-pravni-uprave-dane
  - https://financnisprava.gov.cz/assets/cs/prilohy/d-seznam-dani/Zakon366_2022.pdf
  - https://www.mfcr.cz/assets/attachments/2023-04-28_Convergence-Programme-of-the-Czech-Republic-April-2023.pdf
notes: >
  The statute is dated 24 November 2022 and the surcharge first applies from
  1 January 2023. This record codes statutory intent; it does not infer a net
  revenue, investment or welfare effect.
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
