policy_id: ury_republic_bank_charter_1896
status: candidate
title: Uruguay charters the Banco de la Republica
countries:
- URY
timeframe:
  start: 1896
  end: 1896
  enacted_date: '1896-08-04'
description: Act No. 2480 of 4 August 1896 approved the charter of Banco de la Republica Oriental del
  Uruguay. The bank was constituted that month with functions that included central-banking responsibilities.
  This is the earlier bank, not the separate central bank created in the 1960s. The record does not treat
  its creation as evidence of a quantified increase in public lending or monetary expansion.
scope: national
references:
- 'Banco Central del Uruguay, Proceso Fundacional: https://www.bcu.gub.uy/Acerca-de-BCU/Paginas/Proceso-Fundacional.aspx'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
