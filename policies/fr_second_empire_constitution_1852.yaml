# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_second_empire_constitution_1852
status: candidate
title: Constitution of the Second Empire
countries: [FRA]
timeframe:
  start: 1852
  end: 1852
  enacted_date: "1852-01-14"
description: >
  Following the 1851 coup, the new constitution concentrated power in the
  president and then Emperor Napoleon III. The elected Corps législatif had
  restricted powers and lacked legislative initiative; political opposition
  was suppressed after the coup.
enacted_by:
  - fr_second_republic_second_empire_1848_1870
axes_moved:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: strong
    intended: true
    rationale: The constitution empowered an executive not dependent on legislative confidence and sharply limited the elected chamber's authority.
references:
  - "French National Assembly, Second Empire 1852–1870: https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/histoire/le-suffrage-universel/la-republique-et-le-suffrage-universel/1852-1870-le-second-empire-ou-le-devoiement-du-suffrage-universel"
notes: Candidate coding of constitutional concentration; later liberalization in the 1860s is not represented by this policy alone.
