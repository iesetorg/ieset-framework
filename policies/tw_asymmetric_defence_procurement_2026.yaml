# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tw_asymmetric_defence_procurement_2026
status: candidate
title: Taiwan's 2026 special act for asymmetric defence procurement
countries: [TWN]
timeframe:
  start: 2026
  end: 2033
  enacted_date: '2026-05-11'
  effective_date: '2026-05-13'
description: >-
  Taiwan promulgated the Special Act on the Procurement Project to Safeguard
  National Security and Strengthen Asymmetric Capabilities on 11 May 2026.
  It authorizes a specified set of artillery, missile, anti-armour,
  counter-drone and air-defence procurement programs through 2033, subject
  to subsequent special-budget bills and Legislative Yuan review. The law
  sets ceilings and reporting duties; it is not evidence that every listed
  item was funded, contracted, delivered or fielded.
evaluation_design:
  event_dates:
    - '2026-05-08 Legislative Yuan third reading reported by defence ministry'
    - '2026-05-11 presidential promulgation'
    - '2026-05-13 legal effect under Central Regulation Standard Act Article 13'
  notes: >-
    Authorizing statute and later budget, procurement, delivery and
    operational-capability events must be tracked separately.
references:
  - https://law.mnd.gov.tw/English/EngLawData.aspx?lsid=FL106445
  - https://www.mnd.gov.tw/en/Publication/86952
  - https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030133
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Legal authorization is recorded without attributing the Legislative Yuan's
  enacted text to the DPP executive or claiming appropriated spending,
  weapons delivery, deterrence effects, hypothesis or school credit.
