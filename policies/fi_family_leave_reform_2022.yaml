# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fi_family_leave_reform_2022
status: candidate
title: Finland family-leave reform 2022 (Perhevapaauudistus)
countries:
- FIN
timeframe:
  start: 2022
  enacted_date: '2022-01-14'
  effective_date: '2022-08-01'
description: >-
  The 2022 family-leave reform replaced the previous maternity (105 working days),
  paternity (54) and shared parental (158) allowance structure with 40 pregnancy
  allowance days and 160 parental allowance days for each parent. Up to 63 of a
  parent's 160 days can be transferred. For a two-parent birth, the statutory
  total changed from 317 to 360 allowance days; actual benefit use can differ.
  The new rules chiefly apply to children with an estimated birth date on or
  after 4 September 2022 who were not born before 1 August 2022. For adoption,
  the new rules apply when parents began caring for the child on or after
  31 July 2022.
enacted_by:
- finland_marin_rainbow_2019_2023
coalition_label_at_enactment: SDP-Centre-Greens-Left Alliance-RKP five-party rainbow coalition
axes_moved:
- axis: fiscal.transfer_expansion
  direction: +
  magnitude: weak
  rationale: >-
    The statutory family allowance quota for a two-parent birth rose from
    105 + 54 + 158 = 317 to 40 + 160 + 160 = 360 paid working days. This is
    an entitlement expansion, not an estimate of actual take-up or fiscal cost.
  intended: true
evaluation_design:
  design_features:
  - eligible_vs_ineligible_groups
  - phase_in_or_threshold_comparison
  regulated_units:
  - Families with a child whose estimated birth date was 4 September 2022 or later and who was not born before 1 August 2022.
  - Adoptive families that began caring for a child on or after 31 July 2022.
  exempt_or_uncontrolled_units:
  - Families with a child born before 1 August 2022 remained under the previous provisions regardless of estimated birth date.
  - Families with an estimated birth date before 4 September 2022 are a possible comparison cohort, subject to transitional exceptions and verification of individual eligibility.
  event_dates:
  - '2021-12-08: Parliament adopted the reform.'
  - '2022-01-14: Act 28/2022 was enacted.'
  - '2022-08-01: New provisions entered into force.'
  - '2022-09-04: Expected-birth-date eligibility threshold for most birth families.'
  known_data_gaps:
  - Individual estimated birth date, actual birth date or adoption care-start date, and allowance use are needed to classify eligibility and measured take-up.
  notes: >-
    An eligibility-threshold comparison needs checks for calendar and seasonal
    trends and birth-timing differences. The statute identifies entitlement,
    not a causal effect on employment, equality, or spending.
references:
- 'Finlex, Act amending the Health Insurance Act 28/2022 (14 January 2022; in force 1 August 2022): https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2022/28'
- 'Finnish Government, Family leave reform enters into force in August 2022 (13 January 2022): https://valtioneuvosto.fi/en/-/1271139/family-leave-reform-enters-into-force-in-august-2022'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
