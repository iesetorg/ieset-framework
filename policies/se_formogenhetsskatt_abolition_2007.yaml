policy_id: se_formogenhetsskatt_abolition_2007
status: candidate
title: Foermoegenhetsskatt (wealth tax) abolition 2007
countries:
- SWE
timeframe:
  start: 2007
  enacted_date: '2007-12-18'
  effective_date: '2008-01-01'
description: 'Sweden repealed its annual net wealth tax through SFS 2007:1403, issued on 18 December 2007 after parliamentary approval on 17 December. The repeal entered into force on 1 January 2008 but applied first at the 2008 assessment, so no tax was charged on 2007 year-end net wealth. The government had announced its intention during 2007; the 2007 tax-year application must not be confused with the later legislative decision or commencement date. Ending the tax also ended the wealth declaration that would have recorded 2007 year-end holdings, reducing the continuity of direct individual wealth statistics after the repeal. This record describes the enacted tax change, not a verified effect on migration or measured wealth inequality.'
enacted_by:
- sweden_reinfeldt_alliance_2006_2014
coalition_label_at_enactment: Alliansen
axes_moved:
- axis: fiscal.tax_capital
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Repeal of the principal capital-stock tax on individuals.
- axis: fiscal.tax_progressivity
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Wealth tax had been strongly progressive top-decile incidence.
references:
- 'SFS 2007:1403 (issued 18 December 2007; commencement 1 January 2008): https://rkrattsdb.gov.se/SFSdoc/07/071403.PDF'
- 'Riksdag decision on 17 December 2007, Betankande 2007/08:SkU15: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/slopad-formogenhetsskatt-och-begransad-avdragsratt_gv01sku15/'
- 'Government proposition 2007/08:26 (2007 tax-year application and wealth-declaration change): https://www.regeringen.se/rattsliga-dokument/proposition/2007/10/prop.-20070826/'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >-
  Generic axis-overlap links previously attached to this record did not test
  the Swedish 2007 tax-year repeal or its implementation. They were removed
  on review. No policy-outcome hypothesis is explicitly linked: repeal also
  changed collection of individual wealth statistics, so a simple before/after
  wealth-share contrast would mix policy and measurement changes.
