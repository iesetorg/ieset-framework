policy_id: uk_trade_boards_act_1918_expansion
status: candidate
title: 'Trade Boards Act 1918: wider wage-board powers'
countries:
- GBR
scope: national
timeframe:
  start: 1918
  enacted_date: '1918-08-08'
  effective_date: '1918-10-01'
description: The Act amended the 1909 Trade Boards system. It allowed the Minister of Labour to
  extend the scheme by special order to trades lacking adequate wage-regulation machinery and broadened
  boards' ability to set minimum time, piece, guaranteed, and overtime rates for defined work and
  worker classes. It changed the machinery for covered trades; it did not set one immediate national
  rate for all industries.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: The amendment expanded the legal route to enforce sectoral wage floors, while actual
    coverage still required trade-specific action.
references:
- 'Trade Boards Act 1918, 8 & 9 Geo. 5 c. 32, original print: https://www.legislation.gov.uk/ukpga/Geo5/8-9/32/pdfs/ukpga_19180032_en.pdf'
