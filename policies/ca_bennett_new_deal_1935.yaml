policy_id: ca_bennett_new_deal_1935
status: candidate
title: Bennett New Deal and Employment and Social Insurance Act
countries: [CAN]
timeframe: {start: 1935, end: 1937}
description: >
  During the Great Depression, Parliament passed a package known as R. B. Bennett's
  New Deal, including the Employment and Social Insurance Act. The proposed
  compulsory unemployment-insurance scheme would have used employer, employee,
  and government contributions. Courts held that the Act exceeded federal
  legislative authority, and it did not establish a lasting national insurance
  program; the record preserves the reform attempt without coding it as an
  implemented transfer expansion.
enacted_by: [canada_bennett_new_deal_1935_1937]
references:
  - "Government of Canada, Federal-provincial agreements and the 1941 Unemployment Insurance Program: https://www.canada.ca/en/intergovernmental-affairs/services/federation/unemployment-insurance-program.html"
  - "Department of Justice Canada, British North America Act, 1940: https://justice.canada.ca/eng/rp-pr/csj-sjc/constitution/lawreg-loireg/p1t181.html"
notes: "Context-only policy entry: the proposed unemployment-insurance scheme was invalidated and should not be scored as a durable implemented program."
