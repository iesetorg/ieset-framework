policy_id: us_usmca_2020
status: candidate
title: United States-Mexico-Canada Agreement
countries:
- USA
timeframe:
  start: 2020
  signed_date: '2018-11-30'
  enacted_date: '2020-01-29'
  effective_date: '2020-07-01'
description: >
  The United States-Mexico-Canada Agreement replaced NAFTA when it entered
  into force on 1 July 2020. It continued preferential regional trade while
  raising automotive regional-content requirements, adding a labor-value-content
  rule, and updating digital-trade, labor, and environmental obligations. The
  agreement was signed in 2018 and implemented by U.S. law in January 2020;
  neither date is its entry into force or evidence of an economic outcome.
enacted_by:
- us_trump_first_term_broad_2017_2021
- us_trump_tariffs_2018_2019
axes_moved:
- axis: regulatory.trade_openness
  direction: mixed
  intended: true
  rationale: The agreement retained NAFTA's regional preferences and added digital-trade access, while tighter automotive origin and labor-content rules narrowed eligibility for some preferential treatment relative to NAFTA.
references:
