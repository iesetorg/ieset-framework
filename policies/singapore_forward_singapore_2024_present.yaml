policy_id: singapore_forward_singapore_2024_policy
status: candidate
title: Singapore Forward Singapore agenda and Budget 2024 support
countries:
  - SGP
timeframe:
  start: 2024
  end: ongoing
description: >
  Budget 2024 introduced household and cost-of-living support measures as the
  new administration began implementing the Forward Singapore agenda. The
  government framed its priorities around jobs, economic resilience, and a
  stronger social compact while maintaining competitiveness and fiscal
  sustainability.
enacted_by:
  - singapore_forward_singapore_2024_present
scope: national
coalition_label_at_enactment: People's Action Party government
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: +
    magnitude: weak
    intended: true
    rationale: Budget 2024 introduced targeted household and cost-of-living support.
  - axis: fiscal.spending_level
    direction: +
    magnitude: weak
    intended: true
    rationale: New investment and support priorities are balanced with fiscal-sustainability commitments.
  - axis: regulatory.trade_openness
    direction: +
    magnitude: weak
    intended: true
    rationale: The administration states that competitiveness and global economic connections remain priorities.
references:
  - "Singapore Ministry of Finance, Budget 2024: https://www.mof.gov.sg/budget-archives/budget-2024/"
  - "Singapore Prime Minister's Office, May 2024 Cabinet transition: https://www.pmo.gov.sg/newsroom/dpm-lawrence-wong-at-the-press-conference-on-cabinet-line-up-may-2024/"
notes: Provisional early-government policy grouping; review after further implementation evidence.
