policy_id: uk_full_expensing_capital_allowance_2023
status: candidate
title: UK full expensing for plant and machinery (2023; permanent 2024)
countries:
- GBR
timeframe:
  start: 2023
  end: ongoing
  enacted_date: '2023-07-11'
  effective_date: '2023-04-01'
  treatment_onset_unresolved: true
description: >-
  Full expensing for qualifying new plant and machinery expenditure from
  1 April 2023 was legislated in Finance (No. 2) Act 2023, which received Royal
  Assent on 11 July 2023. The initial 100 percent main-rate and 50 percent
  special-rate first-year allowances were time-limited; the 22 November 2023
  Autumn Statement announced permanence, enacted by Finance Act 2024 on
  22 February 2024. The initial allowance and later permanent-extension
  announcement are distinct events and cannot share one treatment onset.
