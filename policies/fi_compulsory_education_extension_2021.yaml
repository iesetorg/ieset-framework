# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fi_compulsory_education_extension_2021
status: candidate
title: Finland compulsory education extension from 2021
countries:
- FIN
timeframe:
  start: 2021
  end: ongoing
  enacted_date: '2020-12-30'
  effective_date: '2021-08-01'
description: >
  Finland's Compulsory Education Act (1214/2020) extended compulsory education
  until age 18 or completion of an upper-secondary qualification and made
  qualifying upper-secondary studies and required materials free for students
  covered by the extension. The law first applied to students whose basic
  education obligation ended after 1 January 2021, mostly the spring 2021
  grade-nine cohort born in 2005. Duties to apply for further education began
  on 1 January 2021; the main age-extension provisions began on 1 August 2021.
enacted_by:
- finland_marin_rainbow_2019_2023
scope: national
coalition_label_at_enactment: Marin five-party coalition
references:
- 'Finlex, Compulsory Education Act 1214/2020, sections 16 and 25: https://www.finlex.fi/fi/lainsaadanto/2020/1214'
- 'Finnish National Agency for Education, implementation and first covered school-leaver cohort, 15 February 2021: https://www.oph.fi/fi/uutiset/2021/opetushallitus-tukee-oppivelvollisuuden-laajentamisen-toimeenpanossa-uusia'
- 'Finnish National Agency for Education, applicability and free-study provisions: https://www.oph.fi/fi/kansainvalisyys/perustietoa-oppivelvollisuuden-laajentamisesta'
evaluation_design:
  design_features:
  - eligible_vs_ineligible_groups
  - phase_in_or_threshold_comparison
  regulated_units:
  - Students resident in Finland whose basic education obligation ended after 1 January 2021; first substantial group was spring 2021 grade-nine leavers, mostly born in 2005.
  exempt_or_uncontrolled_units:
  - Students whose basic education obligation ended before 1 January 2021; earlier school-leaver cohorts were outside the extension.
  event_dates:
  - '2020-12-30: Act 1214/2020 issued.'
  - '2021-01-01: specified application and guidance duties took effect.'
  - '2021-08-01: principal age-extension and free-study provisions took effect.'
  second_order_outcomes:
  - Upper-secondary enrollment, continuation, qualification completion, and time to completion by school-leaver cohort.
  - Education-provider spending on materials and travel support for covered students.
  - Subsequent youth employment and earnings, conditional on education history and age.
  known_data_gaps:
  - Student-level basic-education completion dates and exception status are required; birth year alone does not define exposure.
  - The adjacent 2020 and 2021 school-leaver cohorts faced different pandemic schooling and labour-market conditions.
  - The obligation, free materials, and guidance changed together, so a cohort comparison cannot isolate any single component.
  notes: >
    This is a cohort-eligibility design seed, not an estimated effect or a claim
    of exchangeable treated and comparison cohorts. Verify student-level
    exposure, pre-reform cohort trends, pandemic disruption, and later policy
    changes before causal interpretation. The exact first application date is
    1 January 2021 for advance duties; the age extension began 1 August 2021.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The statute establishes schooling duties and free qualifying education; it
  does not itself establish a change in environmental regulation, employment
  protection, cash or near-cash transfers, or government spending as a share
  of GDP. No policy axis is scored until an applicable measure and magnitude
  are verified. The programme did not expire with the Marin government in 2023.
