# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: nz_rbnz_single_mandate_restoration_2023
status: candidate
title: New Zealand restores a single RBNZ economic objective, 2023
countries: [NZL]
scope: national
timeframe:
  start: 2023
  enacted_date: '2023-12-19'
  effective_date: '2023-12-20'
description: >
  The Reserve Bank of New Zealand (Economic Objective) Amendment Act 2023
  received Royal assent on 19 December and commenced the next day. It removed
  supporting maximum sustainable employment as a separate statutory
  monetary-policy objective, leaving achievement and maintenance of medium-term
  price stability. The revised Monetary Policy Committee remit also began on
  20 December and continued to require attention to avoidable employment
  volatility.
enacted_by:
- newzealand_luxon_coalition_2023_present
coalition_label_at_enactment: National-ACT-NZ First coalition
references:
- 'New Zealand Legislation, Reserve Bank of New Zealand (Economic Objective) Amendment Act 2023, assent, commencement section 2, and amendment section 4: https://www.legislation.govt.nz/act/public/2023/64/en/latest/'
- 'Reserve Bank of New Zealand, history of the December 2023 Monetary Policy Committee remit: https://www.rbnz.govt.nz/monetary-policy/about-monetary-policy/history-of-the-remit-and-policy-targets-agreement'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The former 20 December enacted_date was the commencement date; Royal assent
  occurred on 19 December. This was a change of statutory objective and remit,
  not an evidenced increase in legal, operational, or personnel independence.
  No monetary outcome is attributed to this date.
