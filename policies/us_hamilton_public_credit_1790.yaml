# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_hamilton_public_credit_1790
status: candidate
title: Federal assumption and funding of Revolutionary War debts
countries: [USA]
timeframe:
  start: 1790
  end: 1790
  enacted_date: "1790-08-04"
description: >
  Congress authorized federal funding of the national debt and assumption of
  eligible state Revolutionary War debts, establishing a national public-credit
  program. The Hamilton plan paired the stronger federal fiscal capacity with
  new customs and excise revenue. Its distributional and constitutional
  objections were politically contested, and this record codes the federal
  fiscal institution rather than a later economic result.
enacted_by:
  - us_federalist_state_building_1789_1800
axes_moved:
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Federal assumption of state debt enlarged federal fiscal responsibilities and established a national funding program; it does not imply a measured rise in spending as a share of GDP.
  - axis: fiscal.tax_progressivity
    direction: "0"
    magnitude: weak
    intended: false
    rationale: The cited customs and excise revenue system does not establish a progressive tax schedule, so no directional tax-progressivity change is coded.
references:
  - "U.S. Treasury, Alexander Hamilton (1789–1795): https://home.treasury.gov/about/history/prior-secretaries/alexander-hamilton-1789-1795"
  - "U.S. Treasury, History of the Treasury: https://home.treasury.gov/about/history/history-overview/history-of-the-treasury"
notes: Candidate coding of a discrete national fiscal institution. It is not an estimate of debt-service cost, tax burden, or total government size.
