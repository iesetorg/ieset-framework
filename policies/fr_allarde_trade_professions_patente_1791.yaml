policy_id: fr_allarde_trade_professions_patente_1791
status: candidate
title: French Allarde law opens trades subject to patente, 1791
countries: [FRA]
scope: national
timeframe:
  start: 1791
  enacted_date: '1791-03-17'
  effective_date: '1791-04-01'
description: >
  Article 7 of the law of 2–17 March 1791 allowed people to conduct a trade
  or exercise a profession, art, or craft from 1 April 1791, subject to first
  obtaining and paying for a patente and complying with police regulations.
  The law also displaced guild-master and jurande privileges. The freedom was
  therefore conditional, and this record does not infer equal practical access
  or an economy-wide outcome from the legal text.
references:
- 'French Légifrance, Allarde law Article 7, original wording and 1 April 1791 commencement: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006501995'
- 'French Légifrance, full law of 2–17 March 1791: https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006071106/'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Légifrance identifies the law as adopted 2–17 March, with Article 7 created
  on 17 March and in force from 1 April. This is a policy-only legal-context
  record; it has no movement link, signed axis, country-drift step, or tested
  effect. The law's French jurisdiction is not a claim of uniform implementation
  in every territory or population under French control.
