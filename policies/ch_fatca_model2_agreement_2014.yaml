# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_fatca_model2_agreement_2014
status: candidate
title: Swiss-US FATCA Model 2 agreement effective in 2014
countries: [CHE]
timeframe:
  start: 2014
  end: ongoing
  signed_date: '2013-02-14'
  effective_date: '2014-06-02'
description: >-
  Switzerland and the United States signed an agreement on 14 February 2013
  to facilitate Swiss financial institutions' implementation of the US
  Foreign Account Tax Compliance Act. The agreement entered into force on
  2 June 2014, and the Swiss implementing act followed on 30 June 2014.
  Under its Model 2 arrangement, institutions report US account details
  directly with customer consent; accounts without consent are handled
  through administrative-assistance requests. This record concerns the
  Swiss agreement, not the earlier enactment of the US statute.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
evaluation_design:
  event_dates:
    - '2013-02-14 Swiss-US agreement signed'
    - '2014-06-02 agreement entered into force'
    - '2014-06-30 Swiss implementing act entered into force'
  notes: >-
    Swiss agreement and domestic implementing-act dates differ. This record
    does not measure account disclosures or tax compliance.
references:
  - https://www.sif.admin.ch/en/fatca-agreement
  - https://www.sif.admin.ch/dam/en/sd-web/5dqzJyqAJKQ4/bericht-sif-2014-en.pdf
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Legal reporting obligations are recorded without inferred effects on
  banking secrecy, compliance, fiscal receipts or hypothesis verdicts.
