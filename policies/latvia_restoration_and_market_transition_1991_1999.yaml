policy_id: latvia_restoration_and_market_transition_1991_1999_policy
status: candidate
title: Independence restoration and market transition
countries:
- LVA
timeframe:
  start: 1991
  end: 1998
description: After restoring independence in 1991, Latvia rebuilt national institutions and shifted from
  a centrally planned system toward a market economy. Price and trade liberalisation, privatisation, and
  macroeconomic stabilisation accompanied the transition. By 1999 the European Commission considered Latvia
  a functioning market economy, while noting remaining reforms and financial-sector weaknesses.
enacted_by:
- latvia_restoration_and_market_transition_1991_1999
scope: national
coalition_label_at_enactment: Successive post-independence coalition governments
axes_moved:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: strong
  intended: true
  rationale: The transition replaced central planning with private enterprise, market pricing, and privatisation.
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: Trade and external economic relations were liberalised during EU-oriented transition.
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  intended: true
  rationale: Constitutional independence and new market institutions were rebuilt.
references:
- 'European Commission, Latvia Regular Report (1999): https://enlargement.ec.europa.eu/system/files/2016-12/latvia_en.pdf'
- 'EUR-Lex, Latvia accession evaluation: https://eur-lex.europa.eu/legal-content/summary/latvia.html'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
