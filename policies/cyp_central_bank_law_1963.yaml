description: The Republic of Cyprus established its central bank in 1963 under the Central Bank of Cyprus
  Law and relevant constitutional provisions. This identifies a national monetary institution following
  independence. It does not infer the institution's original degree of independence from later legislation
  or from its subsequent Eurosystem membership.
scope: national
