policy_id: us_enforcement_acts_1870_1871
status: candidate
title: Federal Enforcement Acts of 1870-1871
countries: [USA]
timeframe: {start: 1870, end: 1871}
description: >
  The Enforcement Acts implemented congressional authority under the
  Reconstruction Amendments by making specified forms of voter intimidation
  and conspiratorial violence federal offenses and authorizing federal
  supervision or intervention in elections. The statutes strengthened federal
  capacity to protect voting rights for a limited period; later court rulings,
  political withdrawal, and organized violence sharply constrained their reach.
enacted_by:
  - us_reconstruction_civil_rights_1865_1877
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Federal criminal and enforcement authority was extended to protect constitutional voting guarantees against organized intimidation.
references:
  - "National Archives, Laws and Court Cases: https://www.archives.gov/research/african-americans/vote/laws-and-courts"
  - "National Archives, Enforcement Acts and Colfax case: https://www.archives.gov/fort-worth/highlights/columbus-nash"
