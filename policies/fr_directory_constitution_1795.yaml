policy_id: fr_directory_constitution_1795
status: candidate
title: Constitution of Year III establishes the Directory
countries: [FRA]
timeframe:
  start: 1795
  end: 1795
  enacted_date: "1795-08-22"
description: >
  The Constitution of Year III established the Directory and a bicameral
  legislature after the Convention. It restored property-qualified,
  two-degree suffrage and created a divided executive, amid continuing
  political instability.
enacted_by:
  - fr_convention_directory_1792_1799
axes_moved:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: weak
    intended: true
    rationale: The constitution restricted political participation compared with the Convention's earlier broad male suffrage and operated amid recurrent extra-constitutional interventions.
references:
  - "French National Assembly, Constitution of Year III and the Directory: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/constitution-de-l-an-iii-le-directoire"
notes: Candidate coding of restricted suffrage and divided institutions in the Directory.
