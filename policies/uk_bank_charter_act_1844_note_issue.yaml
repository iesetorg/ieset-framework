policy_id: uk_bank_charter_act_1844_note_issue
status: candidate
title: UK Bank Charter Act limits new note issuers, 1844
countries: [GBR]
scope: national
timeframe:
  start: 1844
  enacted_date: '1844-07-19'
  effective_date: '1844-07-19'
description: >
  Section X of the Bank Charter Act 1844 barred bankers who were not lawfully
  issuing their own notes on 6 May 1844 from becoming new bank-note issuers
  in any part of the United Kingdom, from the Act's passage on 19 July.
  Separately, section I required the Bank of England to separate its issue
  department from its banking business after 31 August, and several further
  restrictions and reporting rules applied specifically to England and Wales.
  This record does not treat those provisions as simultaneous or as a measured
  monetary, banking-access, or financial-stability result.
references:
- 'Bank Charter Act 1844, 7 & 8 Vict. c. 32, as enacted, sections I, X, XI and XIII: https://www.legislation.gov.uk/ukpga/1844/32/pdfs/ukpga_18440032_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The effective date here is the from-passage UK-wide section X restriction,
  not the 31 August issue-department start or later England/Wales reporting
  phases. GBR denotes the historical UK jurisdiction including Ireland before
  partition; no modern IRL score, movement link, signed axis, drift step,
  or tested effect is inferred.
