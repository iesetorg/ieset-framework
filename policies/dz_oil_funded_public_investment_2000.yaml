# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: dz_oil_funded_public_investment_2000
status: candidate
title: "Oil-funded public investment and state-led recovery"
countries: [DZA]
timeframe: {start: 2000, end: 2018}
description: >
  Higher hydrocarbon revenues after 1999 enabled large state investment
  programmes in infrastructure, housing, water, and agriculture. Public
  spending and transfers rose around the 2000s boom, while state-owned
  enterprises and public banks remained prominent. After the 2014 oil-price
  fall the government first consolidated spending, then shifted in 2018 toward
  monetary financing and import barriers to sustain growth and employment.
  The period is therefore a state-led, oil-dependent recovery with later
  policy reversals, not a uniform expansion.
enacted_by: [algeria_bouteflika_oil_funded_developmental_state_1999_2019]
coalition_label_at_enactment: "FLN-led administrations under Abdelaziz Bouteflika"
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "Oil receipts financed extensive public investment and transfers, although spending consolidated after the 2014 price shock before rising again in 2018.", intended: true}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Government programmes directed oil revenues toward infrastructure, housing, utilities, and public enterprises.", intended: true}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: weak, rationale: "The 2018 strategy hardened import barriers after years of gradual market reform; the direction changed over the period.", intended: true}
  - {axis: monetary.monetary_expansion_direction, direction: "+", magnitude: weak, rationale: "Beginning in 2017 the government used central-bank financing to fund deficits; this is a late-period reversal rather than a uniform 2000-2018 trend.", intended: true}
references:
  - "IMF, Algeria 2018 Article IV Consultation: https://www.elibrary.imf.org/view/journals/002/2018/168/article-A001-en.xml"
  - "IMF, Algeria Public Investment Management: https://www.elibrary.imf.org/view/journals/002/2018/169/article-A001-en.xml"
  - "World Bank, Algeria Economic Update and fiscal developments: https://documents1.worldbank.org/curated/en/099514310252319658/pdf/IDU0a007dcea0411604dc009a830ad4ea8f93962.pdf"
