# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_planning_housing_target_revision_2024
status: candidate
title: UK National Planning Policy Framework revision 2024
countries:
- GBR
scope: subnational
timeframe:
  start: 2024
  end: ongoing
  effective_date: '2024-12-12'
description: >-
  The revised National Planning Policy Framework was published for England on
  12 December 2024. It restored mandatory housing targets, set a revised standard
  method with an aggregate annual housing-need figure around 370,000, and
  introduced a grey-belt definition with affordable-housing and infrastructure
  conditions. This was a change to national planning guidance applying in England,
  not enactment of a UK-wide statute. Building outcomes and the dates at which
  local plans changed are separate questions.
enacted_by:
- uk_starmer_labour_2024_present
coalition_label_at_enactment: Labour majority (Starmer)
axes_moved:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  intended: true
  rationale: Higher housing targets and a route for some grey-belt development were intended to ease planning-side entry constraints; the realized effect is not asserted.
references:
- https://www.gov.uk/government/news/planning-overhaul-to-reach-15-million-new-homes
- https://assets.publishing.service.gov.uk/media/67aafe8f3b41f783cca46251/NPPF_December_2024.pdf
