description: The 2024 amendment removed the Māori Health Authority as a statutory health entity
  and reassigned provisions concerning Māori health governance within the Pae Ora framework.
  It received Royal assent on 5 March and commenced on 30 June 2024. The statutory abolition
  is distinct from the timing and quality of health-service changes or any measured patient
  outcome.
