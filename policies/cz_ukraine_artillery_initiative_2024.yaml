policy_id: cz_ukraine_artillery_initiative_2024
status: candidate
title: Czech-led joint artillery-ammunition procurement for Ukraine (2024)
countries: [CZE]
timeframe:
  start: 2024
  end: ongoing
description: >
  Czechia, the Netherlands and Denmark launched a joint programme in March
  2024 to locate and procure large-calibre ammunition in third countries for
  delivery to Ukraine, with participating governments providing finance.
  Czech officials confirmed in June 2024 that the first shipments had reached
  Ukraine under Czech Defence Ministry coordination and supervision.
enacted_by:
  - czech_republic_fiala_spolu_2021_2025
references:
  - https://vlada.gov.cz/assets/media-centrum/aktualne/Joint-Statement-Leaders_-Meeting-on-Defence-of-Ukraine.pdf
  - https://mzv.gov.cz/kiev/cz/zpravy_a_udalosti/prvni_zasilka_municni_iniciativy_je_na.html
notes: >
  The official joint statement dates the programme launch to March 2024
  without a day; the Czech embassy reported on 28 June that deliveries
  had already occurred. No exact authorisation or first-delivery day is
  established by these sources. No economic-policy axis or outcome effect
  is inferred from the multinational procurement programme.
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
