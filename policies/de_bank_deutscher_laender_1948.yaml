# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: de_bank_deutscher_laender_1948
status: candidate
title: Bank deutscher Länder establishment and autonomy 1948
countries: [DEU]
timeframe:
  start: 1948
  end: 1948
  effective_date: '1948-03-01'
description: >
  Allied military-government laws established the Bank deutscher Länder
  on 1 March 1948 as the central institution of the West German banking
  system. It was independent of German political authorities from its
  establishment, and gained independence from Allied occupying authorities
  in 1951. The 1957 Bundesbank Act later replaced the institution while
  preserving independence from German government instructions.
enacted_by: [germany_wirtschaftswunder_erhard_1948_1966]
axes_moved:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: strong
    rationale: Founding law created a central bank independent of German political authorities.
references:
  - https://www.bundesbank.de/en/tasks/topics/dates-of-the-german-monetary-policy-detailed-version--626908
