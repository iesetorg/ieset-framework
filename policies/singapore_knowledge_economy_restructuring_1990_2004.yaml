# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: singapore_knowledge_economy_restructuring_1990_2004_policy
status: candidate
title: Singapore services and knowledge-economy restructuring
countries:
  - SGP
timeframe:
  start: 1990
  end: 2003
description: >
  The government diversified the economy toward financial services, tourism,
  overseas investment, research, and knowledge-intensive production after the
  1985 recession. Regional investments and trade agreements expanded Singapore's
  external economic links, while public institutions continued to coordinate
  infrastructure and investment promotion.
enacted_by:
  - singapore_knowledge_economy_restructuring_1990_2004
scope: national
coalition_label_at_enactment: People's Action Party government
axes_moved:
  - axis: regulatory.trade_openness
    direction: +
    magnitude: moderate
    intended: true
    rationale: Trade agreements and regional investment expanded external economic integration.
  - axis: regulatory.product_market_competition
    direction: +
    magnitude: weak
    intended: true
    rationale: Reforms sought to maintain a competitive business environment and expand private-sector services.
  - axis: fiscal.spending_level
    direction: +
    magnitude: weak
    intended: true
    rationale: Public investment supported infrastructure and research capacity.
references:
  - "SG101, 1986 to 1996: Rebounding into a Decade of Growth: https://www.sg101.gov.sg/economy/growing-our-economy/1986/"
  - "SG101, Transformation of Singapore's Economy: https://www.sg101.gov.sg/resources/archives/challengeaccepted-transformation-singapore-economy/"
notes: >
  Period-level candidate for the state's economic diversification and
  internationalisation strategy.
