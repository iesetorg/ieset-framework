# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: dz_market_transition_and_stabilization_1989
status: candidate
title: "Late-1980s and 1990s market transition and stabilization"
countries: [DZA]
timeframe: {start: 1986, end: 1998}
description: >
  After the 1986 oil shock, Algeria introduced gradual market reforms,
  including enterprise autonomy, trade liberalization, and price reform.
  Stabilization deepened from 1994 with price-control reductions, subsidy
  retrenchment, public-enterprise restructuring, and steps toward privatization
  and foreign participation. Reform was stop-and-go amid political turmoil
  and civil conflict, so formal changes did not amount to a settled market
  system.
enacted_by: [algeria_transition_and_civil_conflict_1989_1999]
coalition_label_at_enactment: "FLN government and transitional authorities"
axes_moved:
  - {axis: regulatory.price_control_intensity, direction: "-", magnitude: strong, rationale: "Most price and margin controls were removed by 1995-96, while a small group of essentials remained controlled.", intended: true}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Import licensing was abolished and tariffs and external-trade controls were liberalized in stages, with interruptions.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Competition law, public-enterprise restructuring, and privatization mechanisms were introduced, with uneven execution.", intended: true}
  - {axis: fiscal.transfer_expansion, direction: "-", magnitude: moderate, rationale: "Generalized subsidies were reduced and replaced in stages by targeted transfers; this codes programme direction rather than household incidence.", intended: true}
references:
  - "IMF, Algeria institutional reforms during the 1990s: https://www.elibrary.imf.org/view/journals/002/1996/071/article-A001-en.xml"
  - "World Bank, Algeria transition to a market economy: https://documents1.worldbank.org/curated/en/465181468164057191/pdf/31105.pdf"
  - "IMF, Algeria stabilization and transition to market: https://www.imf.org/en/publications/occasional-papers/issues/2016/12/30/algeria-stabilization-and-transition-to-market-2671"
