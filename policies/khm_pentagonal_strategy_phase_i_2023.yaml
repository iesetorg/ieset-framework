# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: khm_pentagonal_strategy_phase_i_2023
status: candidate
title: Cambodia Pentagonal Strategy Phase I
countries: [KHM]
timeframe: {start: 2023, end: ongoing}
description: >
  Cambodia's Seventh Legislature government adopted the Pentagonal Strategy
  Phase I as its socio-economic agenda. The strategy prioritises people,
  roads, water, electricity, and technology; it sets goals for growth, jobs,
  poverty reduction, governance, private-sector investment, and trade. It
  provides a framework for national and sectoral plans, with targets and
  intended actions not treated as verified outcomes.
coalition_label_at_enactment: Cambodian People's Party-led Seventh Legislature government
enacted_by: [cambodia_hun_manet_pentagonal_strategy_2023_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "The strategy prioritises infrastructure and human-capital investment through national planning."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "The plan coordinates investment toward selected infrastructure and productive priorities."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, intended: true, rationale: "The government seeks a favourable climate for business, investment, and trade."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, intended: true, rationale: "The agenda includes social-protection priorities without specifying a quantified transfer expansion."}
references:
  - "Royal Government of Cambodia, Pentagonal Strategy Phase I: https://pressocm.gov.kh/wp-content/uploads/2023/08/ENG-Royal-Government-Pentagonal-Strategy-Phase-I.pdf"
  - "Hun Manet's presentation of the strategy, 24 August 2023: https://pressocm.gov.kh/en/archives/83960"
notes: "Policy priorities and goals are coded; the strategy's growth or poverty targets are not treated as achieved outcomes."
