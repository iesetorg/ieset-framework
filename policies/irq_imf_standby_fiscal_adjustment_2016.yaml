# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: irq_imf_standby_fiscal_adjustment_2016
status: candidate
title: "2016 Stand-By Arrangement and fiscal/banking reforms"
countries: [IRQ]
timeframe: {start: 2015, end: 2022}
description: >
  Iraq sought an IMF programme amid the fight against ISIS and a steep oil-price
  shock. The 2016 Stand-By Arrangement aimed to restore fiscal and external
  balance, improve public financial management, protect social spending, and
  begin restructuring state-owned banks. The period includes later shocks and
  implementation gaps, so the record captures programme direction rather than
  assuming full delivery or uninterrupted reform.
enacted_by: [iraq_oil_shock_conflict_adjustment_and_reform_2014_2022]
coalition_label_at_enactment: "Government of Haider al-Abadi; subsequent federal governments"
axes_moved:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "The IMF-supported programme targeted lower spending and fiscal consolidation while protecting selected social programmes.", intended: true}
  - {axis: fiscal.transfer_expansion, direction: "mixed", magnitude: weak, rationale: "The programme protected safety-net support and aid for displaced people even as it targeted overall consolidation.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "The programme proposed restructuring state-owned banks and enterprises to reduce their dominance and support private-sector-led growth.", intended: true}
references:
  - "IMF, Iraq Gets $5.34 Billion Loan to Support Economic Stability, July 2016: https://www.imf.org/en/news/articles/2016/07/12/14/31/na071416-iraq-gets-imf-loan-to-support-economic-stability"
  - "IMF, 2017 second review of Iraq Stand-By Arrangement: https://www.imf.org/en/News/Articles/2017/06/05/pr17207-imf-team-reaches-staff-level-agreement-on-second-review-of-stand-by-arrangement-with-iraq"
