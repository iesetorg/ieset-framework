# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cr_cafta_and_fiscal_rule_2007
status: candidate
title: "CAFTA-DR integration and rule-based fiscal consolidation"
countries: [CRI]
timeframe: {start: 2007, end: 2025}
description: >
  Costa Rica approved CAFTA-DR by referendum in 2007 and the agreement entered
  into force for the country in 2009, binding a further phase of trade and
  investment integration. The 2018 Law to Strengthen Public Finance later
  introduced a spending-growth fiscal rule and tax reforms; IMF-supported
  programmes sustained fiscal consolidation through 2023. This period combines
  external market opening with a stronger rule-based constraint on spending,
  while retaining public services and social protection.
enacted_by: [costa_rica_cafta_and_fiscal_rule_2007_2025]
coalition_label_at_enactment: "Alternating PLN, PUSC, PAC, and PPSD administrations"
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "CAFTA-DR entered into force for Costa Rica in 2009 and bound further goods-and-services integration.", intended: true}
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "The 2018 fiscal law imposed spending-growth limits and the IMF-supported programme consolidated public finances.", intended: true}
  - {axis: fiscal.tax_progressivity, direction: "+", magnitude: weak, rationale: "The 2018 reform converted sales tax to VAT and increased income taxes, with stated aims of improving progressivity; incidence depends on implementation and exemptions.", intended: true}
references:
  - "WTO, CAFTA-DR entry into force for Costa Rica: https://rtais.wto.org/UI/PublicShowRTAIDCard.aspx?rtaid=27"
  - "IMF, Costa Rica 2019 Article IV: https://www.imf.org/en/news/articles/2019/02/26/msc022519-costa-rica-staff-cs-of-the-2019-article-iv-mission"
  - "IMF, Costa Rica 2023 Article IV and programme review: https://www.imf.org/-/media/files/publications/cr/2023/english/1criea2023005.pdf"
