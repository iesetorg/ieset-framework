# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_trade_cooperation_agreement_2020
status: candidate
title: EU-UK Trade and Cooperation Agreement (signed 2020)
countries:
- GBR
timeframe:
  start: 2020
  end: ongoing
  signed_date: '2020-12-30'
  effective_date: '2021-01-01'
description: >
  The EU and UK announced agreement on the Trade and Cooperation Agreement
  on 24 December 2020, signed it on 30 December, and applied it provisionally
  from 1 January 2021. It established zero tariffs and quotas for qualifying
  goods subject to rules of origin, while trade outside the single market and
  customs union faced customs and sanitary checks and reduced services access.
  The separate 2020 Immigration Act ended EU free movement.
enacted_by:
- uk_brexit_2016_2020
axes_moved:
- axis: regulatory.trade_openness
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Customs declarations, rules of origin, and SPS checks raised non-tariff trade barriers vs. single market.
- axis: regulatory.product_market_competition
  direction: mixed
  magnitude: weak
  intended: true
  rationale: Level-playing-field provisions discipline subsidy and labour-standard competition unevenly across sectors.
references:
- https://www.gov.uk/government/publications/trade-and-cooperation-agreement-implementation-report-january-2021-to-december-2022/uk-eu-trade-and-cooperation-agreement-implementation-report-1-january-2021-to-31-december-2022
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Generic axis-overlap matches are withheld until a TCA-specific empirical
  design measures trade or welfare effects.
