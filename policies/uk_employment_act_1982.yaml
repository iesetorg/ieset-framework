policy_id: uk_employment_act_1982
status: candidate
title: UK Employment Act 1982 (Tebbit Act)
countries:
- GBR
timeframe:
  start: 1982
  end: 1982
  enacted_date: '1982-10-28'
  treatment_onset_unresolved: true
description: >
  The Employment Act 1982 amended legal liabilities and remedies involving
  trade unions, employers and workers, including trade-dispute and civil-action
  provisions. It received Royal Assent on 28 October 1982. Section 22 deferred
  most substantive provisions to commencement orders that could specify
  different dates.
enacted_by:
- uk_thatcher_first_term_1979_1983
- thatcherism
coalition_label_at_enactment: Conservative majority
references:
- 'UK legislation, Employment Act 1982, introduction and section 22: https://www.legislation.gov.uk/ukpga/1982/46/pdfs/ukpga_19820046_en.pdf'
notes: >
  No strike outcome or effect is inferred from the statute. Provision-specific
  commencement and union-level exposure remain unresolved.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: +
  magnitude: strong
  rationale: Removal of statutory immunity was a step-change in union legal exposure.
- axis: institutional.property_rights
  direction: +
  magnitude: moderate
  rationale: Property at issue in industrial action now subject to legal process.
