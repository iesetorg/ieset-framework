# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: angola_civil_war_market_reversal_1992_2001_policy
status: candidate
title: Angola's renewed civil war and interrupted economic transition
countries: [AGO]
timeframe: {start: 1992, end: 2001}
description: >
  After the Bicesse agreement, Angola held multiparty elections in September
  1992, but UNITA contested the result and fighting resumed. The conflict
  devastated production and infrastructure, generated very high inflation, and
  interrupted efforts to liberalise prices, foreign trade, wages, banking, and
  exchange arrangements introduced around 1990-1992.
enacted_by: [angola_civil_war_market_reversal_1992_2001]
scope: national
coalition_label_at_enactment: MPLA government during renewed civil war
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: Armed conflict and contested elections displaced rule-bound political administration.}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: moderate, intended: false, rationale: War disrupted the functioning and extension of the market-transition reforms.}
references:
  - "UN Peacemaker, Bicesse Accords: https://peacemaker.un.org/en/node/9614"
  - "IMF, Angola staff report 1995: https://www.elibrary.imf.org/view/journals/002/1995/122/article-A001-en.xml"
notes: "The state and UNITA did not have uniform territorial reach during the war."
