# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: deu_hindenburg_programme_and_war_economy_1916
status: candidate
title: Hindenburg Programme and intensified German war-economy mobilisation
countries: [DEU]
timeframe: {start: 1916, end: 1917, enacted_date: "1916-08-29"}
description: >
  The Supreme Army Command's Hindenburg Programme sought a major increase in military
  production through state coordination of labour and industrial resources. The 1916
  Auxiliary Service Law imposed expanded labour obligations. The programme intensified
  a total-war economy and military control over domestic priorities.
enacted_by: [germany_world_war_one_wartime_mobilisation_1915_1917]
coalition_label_at_enactment: German Imperial government and Supreme Army Command
axes_moved:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: strong, intended: true, rationale: "Industrial and labour resources were directed to arms and military procurement."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, intended: true, rationale: "Centralised wartime mobilisation displaced voluntary market allocation."}
references:
  - "German Federal Agency for Civic Education, war economy: https://www.bpb.de/themen/erster-weltkrieg-weimar/ersterweltkrieg/177509/oekonomie-des-krieges/"
  - "German History in Documents and Images, Hindenburg Programme: https://germanhistorydocs.ghi-dc.org/pdf/eng/811_Hindenburg%20Program_150.pdf"
notes: "Specific policy record for the 1916–1917 intensification; wartime mobilisation began earlier."
