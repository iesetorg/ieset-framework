# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bg_postcommunist_market_transition_and_crisis_1990
status: candidate
title: Bulgaria post-communist political and economic transition
countries: [BGR]
timeframe: {start: 1990, end: 1997, enacted_date: "1990-06-10"}
description: >
  Bulgaria transitioned from communist rule to competitive politics and began price,
  ownership, and market reforms. Reform proceeded slowly and inconsistently; weak
  budget constraints and delayed restructuring contributed to the severe 1996–1997
  financial crisis.
enacted_by: [bulgaria_postcommunist_transition_1990_1997]
coalition_label_at_enactment: Successive post-communist coalition governments
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, intended: true, rationale: "Pluralist elections replaced one-party communist political rule."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "Market transition and price liberalisation began, although reforms were delayed."}
references:
  - "World Bank, Bulgaria transition and 1996–1997 crisis: https://documents1.worldbank.org/curated/en/984761468769131587/pdf/multi0page.pdf"
notes: "The record includes the transition-era crisis; the currency-board stabilisation is represented separately."
