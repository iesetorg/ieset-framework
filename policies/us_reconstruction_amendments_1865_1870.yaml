policy_id: us_reconstruction_amendments_1865_1870
status: candidate
title: Reconstruction Amendments (1865-1870)
countries: [USA]
timeframe: {start: 1865, end: 1870}
description: >
  The Thirteenth Amendment (ratified 1865) abolished slavery; the Fourteenth
  Amendment (ratified 1868) established national birthright citizenship and
  equal-protection and due-process guarantees; and the Fifteenth Amendment
  (ratified 1870) prohibited denial or abridgment of voting rights on grounds
  of race, color, or prior enslavement and authorized congressional enforcement.
  These constitutional rules changed formal legal status and federal authority,
  while their practical protection varied and was later narrowed by violence,
  state action, and court decisions.
enacted_by:
  - us_reconstruction_civil_rights_1865_1877
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: strong
    intended: true
    rationale: The amendments expanded constitutional guarantees of freedom, citizenship, equal protection, and voting rights and gave Congress enforcement authority.
references:
