# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: hr_schengen_accession_2023
status: candidate
title: Croatia Schengen accession 2023
countries:
- HRV
timeframe:
  start: 2023
  end: ongoing
  enacted_date: '2022-12-08'
  effective_date: '2023-01-01'
description: 'Council Decision (EU) 2022/2451 applied the Schengen acquis in full to Croatia, lifting checks on persons at internal land and sea borders from 1 January 2023 and at internal air borders from
  26 March 2023. The policy integrated Croatia into the EU border-free travel area while leaving external Schengen border obligations in place.

  '
enacted_by:
- croatia_plenkovic_hdz_eu_integration_2016_present
coalition_label_at_enactment: Plenkovic HDZ-led government with Council of the EU approval
axes_moved:
- axis: regulatory.immigration_openness
  direction: +
  magnitude: moderate
  intended: true
  rationale: Routine checks on persons at internal Schengen borders were lifted from 2023; this changes border-enforcement posture, not residence or work eligibility.
references:
- 'Council Decision (EU) 2022/2451 on full application of the Schengen acquis in Croatia: https://eur-lex.europa.eu/eli/dec/2022/2451/oj'
evaluation_design:
  event_dates:
  - '2022-12-08: Council adopted Decision (EU) 2022/2451.'
  - '2023-01-01: Internal land and sea checks on persons were lifted.'
  - '2023-03-26: Internal air checks on persons were lifted.'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The Council decision concerns checks on persons, not tariffs, non-tariff
  goods barriers, or an FTA. Its verification of pre-existing Schengen
  conditions does not itself establish stronger general rule of law. External
  border obligations and legal residence or work eligibility remain distinct.
