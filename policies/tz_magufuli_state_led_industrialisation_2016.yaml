# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tz_magufuli_state_led_industrialisation_2016
status: candidate
title: Tanzania state-led industrialisation and public investment agenda
countries: [TZA]
timeframe: {start: 2016, end: 2021, enacted_date: "2016-01-01"}
description: >
  The fifth-phase government emphasised industrialisation, public infrastructure, and
  domestic value addition, while adopting more assertive approaches to mining and
  resource sovereignty. The period also featured greater pressure on private
  investment and civic institutions. It increased state direction without restoring
  the former fully state-owned economy.
enacted_by: [tanzania_magufuli_state_led_turn_2015_2021]
coalition_label_at_enactment: CCM government under John Magufuli
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "Public infrastructure investment was made a leading development instrument."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "Government increased direction of strategic investment and mineral-sector rules."}
references:
  - "World Bank IEG, Tanzania Country Program Evaluation: https://ieg.worldbankgroup.org/evaluations/world-bank-group-tanzania/overview"
  - "IMF, Tanzania 2017 Article IV Consultation: https://www.elibrary.imf.org/view/journals/002/2017/013/article-A001-en.xml"
notes: "Policy direction is coded without treating announced investment plans as completed outcomes."
