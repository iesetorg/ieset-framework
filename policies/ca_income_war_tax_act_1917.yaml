# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ca_income_war_tax_act_1917
status: candidate
title: Income War Tax Act introduces federal income taxation
countries: [CAN]
timeframe: {start: 1917, end: 1948}
description: >
  Parliament introduced a general federal tax on personal and corporate income
  in 1917 to help finance the First World War. The government initially described
  it as temporary, reviewed it after the war, retained it, and replaced the
  Income War Tax Act with the Income Tax Act in 1948. This record captures the
  new federal tax instrument, not a quantified estimate of total tax burden.
enacted_by: [canada_federal_income_tax_state_1917_1948]
axes_moved:
  - axis: fiscal.tax_progressivity
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The federal personal income tax introduced graduated rates, creating a progressive federal tax instrument where none had existed.
references:
  - "Canada Revenue Agency, Purpose of taxes — historical milestones: https://www.canada.ca/en/revenue-agency/services/tax/individuals/educational-programs/purpose-taxes.html"
  - "Library of Parliament, A Closer Look at the Flat Tax (1917 income tax rates and surtaxes): https://publications.gc.ca/Collection-R/LoPBdP/BP/prb0110-e.htm"
notes: "The 1948 endpoint marks permanent federal income-tax status under a replacement statute; the tax itself continued thereafter."
