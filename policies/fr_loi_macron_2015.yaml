description: >
  Law no. 2015-990 of 6 August 2015 addressed intercity coach transport,
  retail opening on Sundays and evenings, regulated legal professions, and
  labour-court procedure. These are distinct provisions with different
  implementation rules; the promulgation date is not one common exposure date.
