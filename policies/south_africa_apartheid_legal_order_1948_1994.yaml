policy_id: south_africa_apartheid_legal_order_1948_1994
status: candidate
title: Apartheid legal and administrative order
countries: [ZAF]
timeframe: {start: 1948, end: 1994}
description: >
  The National Party government elected in 1948 formalised apartheid through
  racial classification, residential and land separation, political exclusion,
  and restrictions on movement and work. The system used state law and
  administration to enforce racial hierarchy; this entry describes that
  institutional regime and does not treat it as a simple market-versus-state
  position.
enacted_by: [south_africa_national_party_apartheid_1948_1994]
axes_moved:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: strong
    intended: true
    rationale: Racially discriminatory laws denied equal political and legal standing and were enforced by state institutions.
  - axis: regulatory.labour_market_flexibility
    direction: "-"
    magnitude: strong
    intended: true
    rationale: Apartheid law restricted where Black South Africans could live and work and constrained their movement and employment choices.
references:
  - "South African Government, History: https://www.gov.za/about-sa/history"
  - "South African Department of Basic Education, Timeline: The History of Apartheid: https://www.education.gov.za/LinkClick.aspx?fileticket=oRjFfXEp1Ak%3D&mid=2502&portalid=0&tabid=670"
  - "South African Parliament, 30 Year Review of South Africa's Democracy: https://www.parliament.gov.za/storage/app/media/BusinessPubs/2024/10-12-2024/Parliaments_30_Year_Review_of_South_Africas_Democracy-Final_For_Publication.pdf"
