policy_id: lux_monetary_institute_supervision_1983
status: candidate
title: Luxembourg creates a monetary institute with financial supervision
countries:
- LUX
timeframe:
  start: 1983
  end: 1983
  enacted_date: '1983-05-20'
description: Luxembourg established the Institut monetaire luxembourgeois in 1983 with responsibility
  for financial-sector supervision and currency issuance. It did not yet possess all the functions of
  a central bank. The institute inherited the existing bank commissioner's supervisory competences.
  This records the institution and transfer of responsibilities, leaving the subsequent 1998 central-bank
  creation and European monetary integration as separate developments. No tightening of regulation is inferred.
scope: national
references:
- 'Banque centrale du Luxembourg, Monetary history: https://www.bcl.lu/en/About/histoire_monetaire/index.html'
- 'Commission de Surveillance du Secteur Financier, History (20 May 1983): https://www.cssf.lu/en/history/'
notes: Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated.
