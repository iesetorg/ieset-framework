# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: khm_property_and_market_reforms_1989
status: candidate
title: "State-property reform and recognition of private initiative"
countries: [KHM]
timeframe: {start: 1985, end: 1993}
description: >
  After rebuilding under extensive state ownership, Cambodia gradually
  recognized private enterprise beyond household production in 1985 and
  launched a broad property reform programme in 1989. The programme granted
  state enterprises more autonomy and harder budget constraints, permitted
  privatization of state assets, and encouraged domestic and foreign private
  investment. Privatization was partly spontaneous and weakly transparent, so
  this marks a market-opening transition rather than a completed institutional
  settlement.
enacted_by: [cambodia_prk_state_reconstruction_and_market_transition_1979_1993]
coalition_label_at_enactment: "People's Republic of Kampuchea / State of Cambodia government"
axes_moved:
  - {axis: institutional.property_rights, direction: "+", magnitude: strong, rationale: "The 1989 reform programme allowed privatization of state assets and encouraged private investment after the abolition of private property rights in 1979.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Recognition of private firms, state-enterprise autonomy, and private investment expanded market activity, though the state retained major assets.", intended: true}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "Harder budget constraints and privatization were intended to reduce enterprise burdens on the state; no measured net fiscal effect is inferred.", intended: true}
references:
  - "World Bank, Cambodia: From Recovery to Development, Volume II: https://documents1.worldbank.org/curated/en/120711468017956356/pdf/multi0page.pdf"
  - "World Bank, Land and State Property Rights in Cambodia: https://documents1.worldbank.org/curated/en/809851468213260073/pdf/398090KH.pdf"
