# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: gha_hipc_and_private_sector_reform_2001
status: candidate
title: Ghana HIPC debt relief and private-sector-oriented reform agenda
countries: [GHA]
timeframe: {start: 2001, end: 2008, enacted_date: "2001-03-01"}
description: >
  Ghana entered the enhanced HIPC debt-relief process in 2001. The government combined
  macroeconomic stabilisation and debt relief with private-sector competitiveness and
  market-oriented growth, while retaining social spending and public-service functions.
enacted_by: [ghana_kufuor_market_reforms_2001_2008]
coalition_label_at_enactment: New Patriotic Party government under John Kufuor
axes_moved:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "The agenda sought stronger private investment and competitiveness."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, intended: true, rationale: "Debt relief and stabilisation were intended to improve fiscal management."}
references:
  - "World Bank, Ghana adjustment lending and reform overview: https://documents1.worldbank.org/curated/en/988621468030626957/pdf/596200NWP01pub158288B0prsc1ghana1cs.pdf"
notes: "The measure records a multi-year reform direction; it does not imply that all debt relief or reforms occurred in 2001."
