# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: paraguay_democratic_transition_1989
status: candidate
title: Paraguay transition to democratic constitutional government
countries: [PRY]
timeframe: {start: 1989, end: 1992}
description: >
  The February 1989 coup ended Alfredo Stroessner's 34-year dictatorship and
  initiated a transition that included competitive elections and a constituent
  process. The 1992 Constitution defined Paraguay as a representative democracy.
  Paraguay also joined Mercosur as a founding member in 1991, opening a separate
  regional economic integration track.
enacted_by: [paraguay_democratic_transition_1989_2022]
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The transition replaced dictatorship with constitutional representative democracy and competitive elections.
  - axis: regulatory.trade_openness
    direction: "+"
    magnitude: weak
    intended: true
    rationale: Founding membership in Mercosur established regional market integration in 1991.
references:
  - "OECD, Setting the scene: Good governance for a more sustainable and inclusive Paraguay: https://www.oecd.org/en/publications/oecd-public-governance-reviews-paraguay_9789264301856-en/full-report/component-5.html"
