policy_id: ae_abu_dhabi_dubai_bailout_2009
status: candidate
title: Abu Dhabi $20bn Dubai bailout
countries:
- ARE
timeframe:
  start: 2009
  enacted_date: '2009-12-14'
description: >
  In response to Dubai World's November 2009 debt standstill, Abu Dhabi and
  the UAE central bank provided financing to Dubai through government-bond
  purchases and later support for the Nakheel sukuk repayment. The record
  preserves the credit intervention but does not classify it as a general
  government spending increase or a change to legal property rights without
  fiscal-accounting and creditor-outcome evidence.
enacted_by:
- uae_khalifa_early_era_2004_2014
- uae_khalifa_global_financial_crisis_2008_2010
references:
- Dubai Government statement, 14 December 2009
- Central Bank of the UAE bond issuance February 2009
- https://centralbank.ae/media/phgb4hyj/cbuae-annual-report-2009-en.pdf
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Financial-asset versus fiscal-expense treatment and creditor recoveries
  require independent accounting evidence before directional axes are coded.
