policy_id: us_clinton_welfare_reform_1996
status: candidate
title: Personal Responsibility and Work Opportunity Reconciliation Act, 1996
countries: [USA]
scope: national
timeframe:
  start: 1996
  enacted_date: '1996-08-22'
  treatment_onset_unresolved: true
description: >
  Public Law 104-193, approved on 22 August 1996, replaced the federal Aid to
  Families with Dependent Children framework with Temporary Assistance for
  Needy Families block grants and set work-participation and time-limit rules.
  Title I generally took effect on 1 July 1997, with stated exceptions and
  state transition provisions. This record marks the federal statute rather
  than a single nationwide household treatment date.
enacted_by:
- us_clinton_first_term_1993_1997
coalition_label_at_enactment: Democratic president and Republican-majority Congress
references:
- 'U.S. Government Publishing Office, Public Law 104-193, approved 22 August 1996; Title I sections 103 and 116: https://www.govinfo.gov/content/pkg/PLAW-104publ193/pdf/PLAW-104publ193.pdf'
- 'Congressional Research Service, TANF legislative history and transition summary: https://www.congress.gov/crs_external_products/R/PDF/R44668/R44668.21.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Section 116 sets 1 July 1997 as the general Title I effective date, with
  exceptions and state-dependent transition rules. No one effective_date is
  entered for all households, so the legal enacted date does not qualify as a
  common treatment onset in the event-treatment registry. The statute's
  architecture does not by itself establish a change in total transfer
  spending, labour-market flexibility, wages, or distributional outcomes.
