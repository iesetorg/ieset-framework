policy_id: jp_cptpp_entry_2018
status: candidate
title: CPTPP entry into force for Japan in 2018
countries:
- JPN
timeframe:
  start: 2018
  end: ongoing
  signed_date: '2018-03-08'
  effective_date: '2018-12-30'
description: >-
  The Comprehensive and Progressive Agreement for Trans-Pacific Partnership
  was signed on 8 March 2018 and entered into force for Japan on 30 December
  2018, alongside Australia, Canada, Mexico, New Zealand and Singapore. This
  record codes Japan's legal market-access commitments and entry date. Later
  parties joined on other dates and are not represented by this Japanese
  record. It does not assert a measured Japanese trade or welfare effect.
enacted_by:
- abenomics_2012_2020
coalition_label_at_enactment: Abe LDP–Komeito government
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: The agreement's preferential market-access commitments began for Japan on 30 December 2018.
references:
- 'Japan Ministry of Foreign Affairs treaty record and dates: https://www.mofa.go.jp/mofaj/ila/et/page23_002473.html'
- 'Australian DFAT party-specific entry dates: https://www.dfat.gov.au/trade/agreements/in-force/cptpp/comprehensive-and-progressive-agreement-for-trans-pacific-partnership'
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: Legal entry and intended openness are coded separately from empirical effect evidence; no school or policy-score credit follows from this record.
