status: candidate
title: Loi Travail (El Khomri)
countries:
- FRA
timeframe:
  start: 2016
  enacted_date: '2016-08-08'
  treatment_onset_unresolved: true
description: >
  Law no. 2016-1088 of 8 August 2016 revised the hierarchy of collective
  bargaining on working time, amended economic-dismissal rules, and established
  the personal activity account. Collective-agreement provisions had staged
  application rather than a single nationwide treatment date.
enacted_by:
- france_hollande_ps_2012_2017
coalition_label_at_enactment: Parti Socialiste-led majority (Valls government)
references:
- 'Légifrance, original Law no. 2016-1088, promulgated 8 August 2016 and published 9 August 2016, especially articles 8 and 21: https://www.legifrance.gouv.fr/jorf/id/JORFSCTA000032983231'
notes: >
  Article 21 applies from January 2017 to working-time, rest and leave
  collective agreements, and from September 2019 to other agreements, with
  exceptions. The legal enactment date is not a uniform employer exposure date;
  no labour-market effect is claimed.
