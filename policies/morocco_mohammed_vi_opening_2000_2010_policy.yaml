# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: morocco_mohammed_vi_opening_2000_2010_policy
status: candidate
title: Morocco trade liberalisation, privatisation, and infrastructure strategy
countries: [MAR]
timeframe: {start: 2000, end: 2010}
description: >
  Morocco implemented trade agreements, reduced tariffs, privatised selected
  enterprises, reformed financial and labour markets, and expanded public
  infrastructure investment. The reforms increased private and foreign
  investment opportunities, but the public-enterprise sector remained large
  and central to capital formation and public services.
enacted_by: [morocco_mohammed_vi_opening_2000_2010]
scope: national
coalition_label_at_enactment: Moroccan monarchy and successive governments
axes_moved:
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, intended: true, rationale: Trade agreements and tariff reductions lowered barriers to external commerce.}
  - {axis: regulatory.product_market_competition, direction: +, magnitude: weak, intended: true, rationale: Selected privatisations and competition reforms widened private-sector participation.}
references:
  - "IMF, Morocco 2005 Article IV consultation: https://www.imf.org/en/news/articles/2015/09/28/04/53/pn05125"
  - "IMF, Morocco 20 Years of Reforms: https://www.elibrary.imf.org/display/book/9798400225406/CH001.xml"
notes: "The record does not treat privatisation as a withdrawal of the state from the economy."
