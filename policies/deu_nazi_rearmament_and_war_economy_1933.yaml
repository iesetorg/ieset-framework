# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: deu_nazi_rearmament_and_war_economy_1933
status: candidate
title: Nazi dictatorship, rearmament, coercive controls, and war economy
countries: [DEU]
timeframe: {start: 1933, end: 1945, enacted_date: "1933-01-30"}
description: >
  The Nazi seizure of power destroyed democratic institutions and subordinated labour,
  industry, trade, and finance to dictatorship, persecution, rearmament, and conquest.
  Private ownership continued in many firms, but coercion and state priorities
  increasingly determined allocation; forced labour and plunder became central during
  the war.
enacted_by: [germany_nazi_dictatorship_war_economy_1933_1945]
coalition_label_at_enactment: National Socialist dictatorship under Adolf Hitler
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: true, rationale: "The dictatorship abolished political pluralism and dismantled legal protections."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: strong, intended: true, rationale: "Rearmament and war production received state-directed credit and procurement."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, intended: true, rationale: "Coercive controls displaced ordinary market choice and worker freedom."}
references:
  - "German Federal Agency for Civic Education, economic policy under National Socialism: https://www.bpb.de/shop/zeitschriften/apuz/archiv/528695/wirtschaftspolitik-und-wirtschaftsverfassung-im-dritten-reich/"
notes: "The economic coding is paired with explicit destruction of democracy and the regime's crimes; it is not an ideological endorsement."
