policy_id: lux_zollverein_accession_1842
status: candidate
title: Luxembourg joins the German customs union
countries:
- LUX
timeframe:
  start: 1842
  end: 1842
description: Luxembourg joined the German customs union, the Zollverein, in 1842. Prussian thalers subsequently
  became the principal circulating currency, while accounts continued to use Belgian francs. This record
  dates customs-union membership and its monetary setting. Membership alone is not used to score net trade
  openness toward both member and non-member countries.
scope: national
references:
- 'Banque centrale du Luxembourg, Monetary history: https://www.bcl.lu/en/About/histoire_monetaire/index.html'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
