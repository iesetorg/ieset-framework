# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: afg_national_unity_aid_transition_2014_2020_policy
status: candidate
title: Afghanistan's National Unity Government and declining international grants
countries: [AFG]
timeframe: {start: 2014, end: 2020}
description: >
  Following the contested 2014 presidential election, an extra-constitutional
  agreement created the National Unity Government. At the same time, the
  international security drawdown and declining grants weakened demand and
  fiscal capacity. Economic growth slowed, security worsened, and COVID-19
  added pressure to public finances and employment before the 2021 takeover.
enacted_by: [afg_national_unity_aid_transition_2014_2020]
scope: national
coalition_label_at_enactment: National Unity Government
axes_moved:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, intended: false, rationale: Donor grants and public expenditure declined relative to the 2009 peak.}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: weak, intended: false, rationale: The contested election and negotiated power-sharing arrangement interrupted routine constitutional governance.}
references:
  - "World Bank, Afghanistan Development Update 2021: https://thedocs.worldbank.org/en/doc/e406b6f24c2b7fdeb93b56c3116ed8f1-0310012021/original/Afghanistan-Development-Update-FINAL.pdf"
notes: "Candidate period coding; security and aid conditions varied substantially by region and year."
