policy_id: mali_coup_conflict_transition_2012_2020_policy
status: candidate
title: Mali coup, conflict, and transitional state rebuilding
countries:
- MLI
timeframe:
  start: 2012
  end: 2019
description: 'The 2012 coup interrupted constitutional government during an armed and territorial crisis.
  A political transition led to elections in 2013, while security operations and international support
  continued. The episode affected state authority and public security needs without constituting a single
  coherent economic policy programme.

  '
enacted_by:
- mali_coup_conflict_transition_2012_2020
scope: national
coalition_label_at_enactment: Military-led transitional authorities and elected governments
axes_moved:
- axis: institutional.rule_of_law
  direction: mixed
  magnitude: strong
  intended: false
  rationale: The coup interrupted constitutional order; transition and elections later restored elected
    institutions.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  intended: false
  rationale: Conflict and reconstruction raised demands on public security and state rebuilding.
references:
- 'United Nations, Report of the Secretary-General on Mali (2013): https://documents.un.org/doc/undoc/gen/g13/100/67/pdf/g1310067.pdf'
notes: 'Period-level candidate used to extend national political coverage. It is not an estimate of public
  spending or continuous conflict intensity.

  '
