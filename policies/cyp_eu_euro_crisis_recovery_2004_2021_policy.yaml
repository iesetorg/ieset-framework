policy_id: cyp_eu_euro_crisis_recovery_2004_2021_policy
status: candidate
title: Cyprus EU integration, euro adoption, crisis adjustment, and recovery, 2004–2021
countries:
- CYP
timeframe:
  start: 2004
  end: 2021
description: The European Commission records EU accession and euro adoption; the IMF documents the 2013 banking
  and fiscal adjustment, subsequent recovery, and pandemic-era policy support.
enacted_by:
- cyp_eu_euro_crisis_recovery_2004_2021
coalition_label_at_enactment: Successive Republic of Cyprus governments during EU accession, euro adoption, and
  adjustment
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  intended: false
  rationale: EU single-market participation and euro-area accession deepened Cyprus’s integration with European
    markets.
- axis: regulatory.financial_deregulation
  direction: '-'
  magnitude: moderate
  intended: false
  rationale: Bank resolution and stronger supervision followed the financial crisis.
- axis: fiscal.spending_level
  direction: mixed
  magnitude: moderate
  intended: false
  rationale: Fiscal consolidation after the bank crisis was followed by temporary pandemic support.
