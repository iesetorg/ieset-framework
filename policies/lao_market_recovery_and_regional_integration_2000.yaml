# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: lao_market_recovery_and_regional_integration_2000
status: candidate
title: Lao PDR resumption of market reforms after late-1990s crisis
countries: [LAO]
timeframe: {start: 2000, end: 2010, enacted_date: "2000-01-01"}
description: >
  After regional financial crisis slowed structural reform, the government resumed
  enterprise and public-resource reform, regional integration, and investment opening.
  The World Bank documents gradual progress from the New Economic Mechanism toward a
  market-oriented economy, with ongoing state planning and growing resource-sector
  investment.
enacted_by: [laos_recovery_and_regional_integration_1998_2010]
coalition_label_at_enactment: Lao People's Revolutionary Party government
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "Resumed regional integration and investment reforms expanded market connections."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, intended: true, rationale: "Enterprise reform continued after the late-1990s slowdown."}
references:
  - "World Bank, Third Structural Adjustment Credit completion report: https://documents1.worldbank.org/curated/en/120551468300561706/pdf/multi-page.pdf"
notes: "The year 2000 is a phase marker after the crisis-era slowdown, not a single enactment date."
