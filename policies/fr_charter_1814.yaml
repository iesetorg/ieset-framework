policy_id: fr_charter_1814
status: candidate
title: French Constitutional Charter promulgated in 1814
countries: [FRA]
scope: national
timeframe:
  start: 1814
  enacted_date: '1814-06-04'
description: >
  Louis XVIII promulgated the Constitutional Charter on 4 June 1814. It
  affirmed equality before law and tax, individual liberties, judicial
  independence, and legislative approval of taxation within a two-chamber
  constitutional monarchy. The king retained the sole initiative of laws,
  broad executive and ordinance powers, and authority to dissolve the elected
  chamber; the electoral franchise was restricted by high tax qualifications.
  The record captures formal constitutional constraints, not their uniform
  enforcement or a democratic mandate.
enacted_by: [fr_bourbon_restoration_charter_1814, fr_restoration_july_monarchy_1814_1848]
axes_moved:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  intended: true
  rationale: >
    The Charter's formal equality, judicial-independence, and legislative tax
    constraints support a cautious positive legal-content step. Royal powers,
    a narrow franchise, and uncertain enforcement cap the magnitude at weak.
references:
- 'French National Assembly, Constitutional Charter of 4 June 1814: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/restauration/la-charte-constitutionnelle'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The Charter was promulgated on 4 June 1814. The step describes formal
  constraints relative to Napoleonic executive rule, not a measured rule-of-law
  level or a continuous account of all later nineteenth-century regimes.
