# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_charter_1814
status: candidate
title: Constitutional Charter of 1814
countries: [FRA]
timeframe:
  start: 1814
  end: 1814
  enacted_date: "1814-06-04"
description: >
  Louis XVIII granted a constitutional charter establishing a two-chamber
  legislature and a constitutional-monarchical framework. Voting and
  eligibility for the lower chamber were limited by high direct-tax thresholds.
enacted_by:
  - fr_restoration_july_monarchy_1814_1848
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    intended: true
    rationale: The charter established formal legislative institutions and some constitutional limits while maintaining a monarchic source of authority and an exceptionally narrow electorate.
references:
  - "French National Assembly, Charter of 1814: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/restauration/la-charte-constitutionnelle"
notes: Candidate coding of constitutional institutions, not representative democracy.
