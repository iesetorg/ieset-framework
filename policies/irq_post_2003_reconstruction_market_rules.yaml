# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: irq_post_2003_reconstruction_market_rules
status: candidate
title: "Post-2003 reconstruction and market-rule reforms"
countries: [IRQ]
timeframe: {start: 2003, end: 2014}
description: >
  After the 2003 invasion and collapse of the Ba'athist government, Iraqi and
  transitional authorities introduced a new currency, central-bank
  independence, commercial banking legislation, more open trade rules, and a
  foreign-investment law allowing ownership in most sectors. Reconstruction
  and service provision remained heavily state-financed and oil-dependent;
  these reforms therefore represent a partial market-opening under a much
  larger public-sector role, not a completed transformation.
enacted_by: [iraq_post_baath_reconstruction_and_market_transition_2003_2014]
coalition_label_at_enactment: "Transitional authorities and post-2005 Iraqi governments"
axes_moved:
  - {axis: monetary.central_bank_independence, direction: "+", magnitude: strong, rationale: "The 2004 central-bank law provided for institutional independence and barred central-bank credit to government.", intended: true}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "The authorities described an open trade regime and established the Trade Bank of Iraq to facilitate international commerce.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "New banking and foreign-investment laws expanded entry opportunities, while reconstruction remained state led.", intended: true}
references:
  - "IMF, Iraq Letter of Intent and MEFP, September 2004: https://www.imf.org/External/NP/LOI/2004/irq/01/"
  - "IMF, 2007 Article IV Consultation with Iraq: https://www.imf.org/en/news/articles/2015/09/28/04/53/pn07103"
