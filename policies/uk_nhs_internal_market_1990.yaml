policy_id: uk_nhs_internal_market_1990
status: candidate
title: UK NHS internal market (NHS and Community Care Act 1990)
countries:
- GBR
timeframe:
  start: 1990
  end: 1997
  enacted_date: '1990-06-29'
  treatment_onset_unresolved: true
description: >
  The National Health Service and Community Care Act 1990 authorised NHS
  contracts, NHS trusts and fund-holding practices. It received Royal Assent
  on 29 June 1990. The first wave of GP fundholders took responsibility for
  budgets on 1 April 1991; trust and practice adoption was staggered rather
  than a single nationwide provider-level treatment on Royal Assent.
enacted_by:
- uk_thatcher_third_term_1987_1990
coalition_label_at_enactment: Conservative (Thatcher III)
references:
- 'UK legislation, National Health Service and Community Care Act 1990, introduction and Part I: https://www.legislation.gov.uk/ukpga/1990/19/pdfs/ukpga_19900019_en.pdf'
- 'UK Parliament Hansard, GP Fundholding, 28 June 1995, first-wave budget date: https://hansard.parliament.uk/Commons/1995-06-28/debates/30fa36c5-5cd2-4670-8c7d-7842a4c244bd/GpFundholding'
notes: >
  A practice or trust roster, adoption dates and comparison units are needed
  for any effect test; the statute does not measure service outcomes.
axes_moved:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  rationale: Purchaser/provider split introduced competition proxies into tax-financed healthcare.
- axis: fiscal.spending_level
  direction: '0'
  rationale: Administrative restructuring rather than spending-share change.
