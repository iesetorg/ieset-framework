# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_nixon_wage_price_controls_1971
status: candidate
title: Nixon wage, price, and rent controls, 1971–1974
countries:
- USA
scope: national
timeframe:
  start: 1971
  end: 1974
  enacted_date: '1971-08-15'
  effective_date: '1971-08-15'
description: >
  Executive Order 11615 imposed a 90-day national freeze on prices, rents,
  wages, and salaries from 15 August 1971. Later orders and regulations
  replaced that initial freeze with successive phases of administered
  controls through 1974. This record dates the start of Phase I; the gold
  convertibility suspension and import surcharge were separate measures.
  Shortages, quality changes, and later inflation require separate evidence
  from the legal controls and are not established by the order's date.
enacted_by:
- us_nixon_wage_price_controls_1971_1974
coalition_label_at_enactment: Republican administration (Nixon)
axes_moved:
- axis: regulatory.price_control_intensity
  direction: +
  magnitude: strong
  intended: true
  rationale: Executive Order 11615 directly froze national prices and rents for 90 days.
references:
- 'U.S. National Archives, Executive Order 11615 disposition and signed date of 15 August 1971: https://www.archives.gov/federal-register/executive-orders/1971.html'
- 'U.S. National Archives, Economic Stabilization Program records, Phase I from 15 August to 13 November 1971 and later phases: https://www.archives.gov/research/guide-fed-records/groups/432.html'
- 'U.S. Government Publishing Office, Federal Register of 17 August 1971, Executive Order 11615 at 36 FR 15727: https://www.govinfo.gov/content/pkg/FR-1971-08-17/pdf/FR-1971-08-17.pdf'
linked_hypotheses:
- price_controls_produce_shortages_and_quality_degradation
evaluation_design:
  design_features:
  - controlled_vs_uncontrolled_categories
  - high_frequency_event_study
  - welfare_accounting
  - distributional_decomposition
  - quality_margin
  - leakage_substitution
  regulated_units:
  - Phase I-IV controlled prices, wages, and rents
  - beef and other categories for which shortage outcomes need measurement
  exempt_or_uncontrolled_units:
  - categories liberalized earlier in later phases
  - imports affected separately by the surcharge
  comparison_markets:
  - controlled categories vs categories liberalized earlier
  - pre-freeze vs Phase I vs Phase II-IV vs post-control windows
  event_dates:
  - 1971-08-15 Phase I 90-day freeze announced
  - 1971-11-14 Phase II controls begin
  - 1973 Phase III/IV liberalization and re-controls
  - 1974-04 broad controls expire
  second_order_outcomes:
  - category-level shortages and queues
  - quality or product-mix deterioration
  - post-freeze catch-up inflation by category
  - enforcement and compliance costs
  - substitution into imports or uncontrolled categories
  distributional_groups:
  - consumers of controlled goods
  - workers under wage controls
  - producers and retailers
  - enforcement targets
  known_data_gaps:
  - monthly category shortage indicators beyond petroleum and beef
  - product-quality and substitution measures
  - compliance/enforcement cost data
  notes: >
    This is a proposed phased design. The 15 August date identifies the legal
    start of Phase I, not a completed causal test of shortages or inflation.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
