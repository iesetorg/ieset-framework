# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: drc_joseph_kabila_postwar_state_2006_2018_policy
status: candidate
title: DRC post-transition reconstruction and resource-sector governance
countries: [COD]
timeframe: {start: 2006, end: 2018}
description: >
  After the 2006 elections ended the political transition, the government
  pursued macroeconomic stability, mining reform, infrastructure, and public
  investment while resource exports remained central to growth. Recurrent
  conflict, weak accountability, limited public services, and delayed elections
  constrained the reach and legitimacy of state institutions.
enacted_by: [drc_joseph_kabila_postwar_state_2006_2018]
scope: national
coalition_label_at_enactment: Joseph Kabila government
axes_moved:
  - {axis: regulatory.sectoral_licensing, direction: +, magnitude: moderate, intended: true, rationale: "Government policy continued to organise investment, licenses, and revenues around extractive industries."}
  - {axis: fiscal.spending_level, direction: +, magnitude: weak, intended: true, rationale: "Reconstruction and infrastructure programmes expanded public investment from a very low postwar base."}
references:
  - "IMF, DRC 2007 Article IV: https://www.elibrary.imf.org/view/journals/002/2007/327/article-A001-en.xml"
notes: "Resource investment does not imply diversified or broadly distributed growth."
