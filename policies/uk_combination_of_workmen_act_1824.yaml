policy_id: uk_combination_of_workmen_act_1824
status: candidate
title: UK Combination of Workmen Act 1824 removes specified criminal bans
countries: [GBR]
scope: national
timeframe:
  start: 1824
  enacted_date: '1824-06-21'
  effective_date: '1824-06-21'
description: >
  The Act of 21 June 1824 repealed specified laws against combinations of
  workers and masters over wages, hours, and the manner of work throughout
  the United Kingdom. Sections II and III exempted covered worker and
  employer combinations from prosecution merely for combining. The Act still
  penalised violence, threats, and intimidation. Parliament repealed and
  replaced it in July 1825, so the record is a short-lived legal episode,
  not a durable measure of union freedom or labour-market outcomes.
references:
- 'Combination of Workmen Act 1824, 5 Geo. 4 c. 95, as enacted, sections I–VI: https://www.legislation.gov.uk/ukpga/Geo4/5/95/pdfs/ukpga_18240095_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The original statute is dated 21 June 1824 and section I begins from
  passage. It refers to laws operative in Great Britain and Ireland. GBR
  denotes the historical UK jurisdiction; this record does not separately
  score modern IRL. It has no movement link, signed axis, drift step, or
