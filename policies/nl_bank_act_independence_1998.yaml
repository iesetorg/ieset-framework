policy_id: nl_bank_act_independence_1998
status: candidate
title: Netherlands Bank Act 1998 independence provisions
countries: [NLD]
timeframe:
  start: 1998
  end: 1998
  enacted_date: '1998-03-26'
  effective_date: '1998-06-01'
description: >
  The Dutch Bank Act 1998 adapted De Nederlandsche Bank's statute for
  European monetary union and removed the finance minister's power to
  instruct the Bank on monetary decisions. The national statute entered
  into force on 1 June 1998, before euro monetary policy began in 1999.
enacted_by: [netherlands_kok_purple_1994_2002]
coalition_label_at_enactment: PvdA-VVD-D66 purple coalition
axes_moved:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: strong
    rationale: National statute removed ministerial instruction power.
references:
  - https://wetten.overheid.nl/BWBR0009508/2013-01-01/0/HoofdstukIII/Artikel17/informatie
  - https://www.ecb.europa.eu/pub/pdf/conrep/cr1998en.pdf
