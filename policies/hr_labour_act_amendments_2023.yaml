policy_id: hr_labour_act_amendments_2023
status: candidate
title: Croatia Labour Act amendments 2023
countries:
- HRV
timeframe:
  start: 2023
  end: ongoing
  enacted_date: '2022-12-16'
  effective_date: '2023-01-01'
description: >
  Croatia's Labour Act amendments changed fixed-term contract rules, remote
  and additional work, work-life balance, employee information duties, and
  platform-mediated work. Most provisions began on 1 January 2023, while
  specified provisions began on 1 July 2023 or 1 January 2024. The package
  tightened parts of employment protection while formalising new arrangements.
enacted_by:
- croatia_plenkovic_hdz_eu_integration_2016_present
scope: national
coalition_label_at_enactment: Plenkovic HDZ-led coalition
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: mixed
  magnitude: moderate
  intended: true
  rationale: Limits on fixed-term use and stronger worker rights tightened protection, while remote and additional-work rules clarified flexible arrangements.
references:
- 'Croatia Act on Amendments to the Labour Act, Official Gazette NN 151/2022, Article 67: https://narodne-novine.nn.hr/clanci/sluzbeni/2022_12_151_2343.html'
evaluation_design:
  event_dates:
  - '2022-12-16: Parliament adopted the amendment.'
  - '2022-12-22: Official Gazette publication.'
  - '2023-01-01: General commencement of the amendment.'
  - '2023-07-01: Article 55 commenced.'
  - '2024-01-01: Article 56, including platform-work provisions, commenced.'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The mixed labour-flexibility coding concerns fixed-term protection and
  formalised remote or additional work, with 2023 as the first operative year.
  Platform-work provisions are not treated as January 2023 exposure.
  New employment rules do not by themselves demonstrate a change in general
  contract enforcement or judicial independence under the rule-of-law axis.
