policy_id: fr_lme_2008
status: candidate
title: LME — Loi de modernisation de l'économie
countries:
- FRA
timeframe:
  start: 2008
  enacted_date: '2008-08-04'
  treatment_onset_unresolved: true
description: >
  Law no. 2008-776 of 4 August 2008 established a simplified micro-social
  option for qualifying self-employed people, changed aspects of commercial
  negotiation and retail authorisation, and reorganised competition oversight.
  The provisions belong to one omnibus law but did not share one start date.
enacted_by:
- france_sarkozy_ump_2007_2012
coalition_label_at_enactment: UMP majority
references:
- 'Légifrance, original Law no. 2008-776, promulgated 4 August 2008 and published 5 August 2008, including article 1 and other staged provisions: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000019283050'
notes: >
  The micro-social regime specified in article 1 applied from 1 January 2009;
  the August 2008 law date does not represent common firm-level exposure to
  all commercial and self-employment reforms. The self-employment option is not
  a change to hiring, firing, or collective-bargaining rules. No outcome is
  asserted.
axes_moved:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: true
  rationale: Retail-pricing negotiation; commercial-zoning easing; competition-authority reform.
