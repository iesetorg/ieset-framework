# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bo_israel_diplomatic_relations_restored_2025
status: candidate
title: Bolivia–Israel diplomatic relations restored in December 2025
countries: [BOL]
timeframe:
  start: 2025
  end: ongoing
  signed_date: '2025-12-09'
  effective_date: '2025-12-09'
description: >-
  Bolivia's and Israel's foreign ministers signed a joint communiqué in
  Washington on 9 December 2025 restoring full diplomatic relations between
  their countries. The communiqué provided for later appointment of
  ambassadors, planning for resident embassies and continued bilateral
  dialogue. This record codes the signed restoration of relations. It does
  not say that ambassadors or resident embassies were already in place, and
  it does not code a separate United States–Bolivia restoration.
enacted_by:
  - bolivia_rodrigo_paz_pdc_2025_present
evaluation_design:
  event_dates:
    - '2025-12-09 joint communiqué signed and restoration announced by Bolivia'
  notes: >-
    The Bolivian foreign ministry dated the completed signing 9 December;
    the Israeli foreign ministry published its account 10 December. Future
    ambassador appointments are prospective and are not coded as completed.
references:
  - https://cancilleria.gob.bo/mre/2025/12/09/23660/
  - https://www.gov.il/es/pages/israel-y-bolivia-reanudan-relaciones-diplomaticas
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  This is a diplomatic-status event only. It supplies no evidence of trade,
  investment, security or welfare effects and no axis, hypothesis, causal,
  policy-performance or school-score credit.
