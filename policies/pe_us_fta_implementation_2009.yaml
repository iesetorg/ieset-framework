policy_id: pe_us_fta_implementation_2009
status: candidate
title: US-Peru TPA entry into force 2009
countries:
- PER
- USA
timeframe:
  start: 2009
  enacted_date: '2009-02-01'
description: 'US-Peru Trade Promotion Agreement entered into force 1 February 2009 under García. Legislative Decrees 994-1094 (2008) implemented domestic compliance; some (1015/1090) triggered Baguazo.
  Paralleled Peru-China FTA (signed 2009-04-28) and Peru-EFTA (2010). Completed Toledo-era negotiation arc.

  '
enacted_by:
- peru_garcia_apra_second_2006_2011
coalition_label_at_enactment: APRA
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: Full FTA tariff regime + services/IP commitments.
references:
- 'U.S. Trade Representative, Peru Trade Promotion Agreement: entered into force 2009-02-01. https://ustr.gov/trade-agreements/free-trade-agreements/peru-tpa'
linked_hypotheses:
- peru_us_fta_bilateral_exports_2009
outcome_summary: >-
  The linked preregistered descriptive comparison of US merchandise exports
  to Peru against six fixed South American destinations is INCONCLUSIVE. Its
  pre-agreement trend gap was 0.031993 log units per year, above the registered
  0.03 maximum. It supplies no directional treaty-effect conclusion, no causal
  inference, and no policy or school score credit.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >-
  Eight prior axis-overlap auto-links were reviewed and removed because none
  tests this bilateral treaty, its 2009 implementation, or the registered
  USA-to-Peru merchandise-flow outcome. The explicit hypothesis above is the
  only treaty-specific evidence link currently established.
