# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: deu_bismarck_social_insurance_1883_1889
status: candidate
title: Imperial social insurance laws for sickness, accidents, and old age
countries: [DEU]
timeframe: {start: 1883, end: 1889}
description: >
  The Imperial Reichstag legislated national sickness, accident, and old-age
  and invalidity insurance in the 1880s. These contributory schemes, built
  through legislation involving employers, workers, and the state, formed an
  early national social-insurance system. The laws were enacted within the
  authoritarian constitutional structure of the German Empire and did not
  make the imperial executive responsible to a parliamentary majority.
enacted_by: [germany_imperial_state_building_social_insurance_1871_1901]
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: strong
    intended: true
    rationale: Statutory insurance expanded nationally organized income and health protection against sickness, workplace injury, old age, and invalidity.
references:
  - "German Bundestag, The Empire (1871–1918): https://www.bundestag.de/en/parliament/history/parliamentarism/empire"
  - "German Bundestag, German Empire constitutional structure (German): https://www.bundestag.de/parlament/geschichte/parlamentarismus/kaiserreich"
notes: "Social-insurance expansion is kept distinct from parliamentary accountability and from a numeric public-spending estimate."
