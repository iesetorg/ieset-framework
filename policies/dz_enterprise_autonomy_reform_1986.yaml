# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: dz_enterprise_autonomy_reform_1986
status: candidate
title: "Early enterprise-autonomy reforms after the oil shock"
countries: [DZA]
timeframe: {start: 1986, end: 1989}
description: >
  Following the 1986 oil-price collapse, Algeria began gradual reforms to
  decentralize decisions, give public enterprises more autonomy, and introduce
  market mechanisms into the centrally planned economy. State ownership and
  the broader planning model remained intact, and political opening accelerated
  only after the 1988 unrest.
enacted_by: [algeria_chadli_market_opening_1979_1989]
coalition_label_at_enactment: "National Liberation Front (FLN) government under Chadli Bendjedid"
axes_moved:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Enterprise autonomy and partial decentralization introduced early market mechanisms within an economy still dominated by public firms.", intended: true}
  - {axis: institutional.property_rights, direction: "+", magnitude: weak, rationale: "The reform direction gave public enterprises greater operating autonomy but did not privatize core productive assets.", intended: true}
references:
  - "IMF, Setting of Economic Reform in Algeria: https://www.elibrary.imf.org/display/book/9781557756916/ch02.xml"
  - "IMF, National Approach to Market-Oriented Tax Reform: https://www.elibrary.imf.org/display/book/9781557752758/ch017.xml"
