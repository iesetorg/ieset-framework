notes: >
  This codes the federal law, not an estimate of registration, turnout,
  spending, or transfer effects. The former 1964-1968 period was the parent
  movement window rather than the Act's date. Subsequent amendments and the
  2013 coverage-formula ruling require separate temporal treatment.
