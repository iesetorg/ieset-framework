policy_id: us_voting_rights_act_1965
status: candidate
title: Voting Rights Act 1965
countries:
- USA
scope: national
timeframe:
  start: 1965
  end: 1965
  enacted_date: '1965-08-06'
description: >
  The Voting Rights Act of 1965 prohibited denial or abridgment of voting
  rights on account of race or color nationwide under section 2. Its coverage
  formula and section 5 preclearance applied to covered states and localities,
  requiring federal review of voting-rule changes there. Other provisions
  authorized federal examiners and enforcement. President Johnson signed the
  Act on 6 August 1965; preclearance did not apply to every jurisdiction.
enacted_by:
- us_lbj_great_society_1964_1968
axes_moved:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  intended: true
  rationale: Sections 2 and 5 established nationwide equal-vote protection and targeted federal preclearance of changes in covered jurisdictions.
references:
- 'U.S. National Archives, enrolled Voting Rights Act of 1965 and transcript: https://www.archives.gov/milestone-documents/voting-rights-act'
suppress_inferred_axis_links: true
