policy_id: uk_revenue_act_1869_fire_insurance_stamp_duty_repeal
status: candidate
title: Fire-insurance percentage stamp-duty repeal, 1869
countries: [GBR]
scope: national
timeframe:
  start: 1869
  enacted_date: '1869-06-24'
  effective_date: '1869-06-25'
description: >
  Section 12 of the Revenue Act 1869 ended the one-shilling-and-sixpence
  per-centum annual stamp duty on policies insuring solely against fire loss
  or damage from 25 June 1869. The repeal preserved liabilities for policies
  made or renewed earlier and prior offences. Section 13 allowed a limited
  refund for qualifying policies made or renewed after 12 April and before
  25 June 1869 for their post-24-June coverage.
coalition_label_at_enactment: Gladstone Liberal ministry (1868-1874)
