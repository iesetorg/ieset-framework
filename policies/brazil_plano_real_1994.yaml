# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: brazil_plano_real_1994
status: candidate
title: Real becomes Brazil's legal currency, 1994
countries: [BRA]
scope: national
timeframe:
  start: 1994
  enacted_date: '1994-06-30'
  effective_date: '1994-07-01'
description: >
  Provisional Measure 542, issued on 30 June 1994, made the real the unit of
  Brazil's national monetary system and legal tender throughout its territory
  from 1 July. It converted monetary obligations expressed in cruzeiros reais
  or in the indexed Unit of Real Value under detailed statutory rules. This
  record dates the new currency's legal operation within the broader Plano
  Real programme; it does not date every fiscal or anti-inflation component.
enacted_by:
- brazil_real_plan_cardoso_1994_2002
coalition_label_at_enactment: Itamar Franco administration; Fernando Henrique Cardoso helped design the programme
references:
- 'Brazilian Presidency, Provisional Measure 542 of 30 June 1994, Articles 1–2 and conversion rules: https://www.planalto.gov.br/ccivil_03/mpv/1990-1995/542.htm'
- 'Banco Central do Brasil, original Communication 4,011 of 30 June 1994 launching real notes and coins on 1 July: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?numero=4011&tipo=Comunicado'
- 'Banco Central do Brasil, Plano Real chronology and URV-to-real conversion: https://www.bcb.gov.br/controleinflacao/planoreal'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The previous 1 July enacted_date was the currency's first legal day, not the
  date of Provisional Measure 542. The larger programme began before July;
  neither a central-bank-independence change nor a fiscal-spending reduction
  follows from this currency instrument alone. No hypothesis result or
  inflation effect is attributed to the enactment date.
