# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_pacific_railway_act_1862
status: candidate
title: Pacific Railway Act of 1862
countries: [USA]
timeframe:
  start: 1862
  end: 1862
  enacted_date: "1862-07-01"
description: >
  The Pacific Railway Act chartered a private transcontinental railway project
  and authorized federal land grants and government bond support for construction.
  It committed public resources to a selected transport network while leaving
  operation with federally chartered private corporations. Later amendments and
  construction outcomes are separate from the 1862 authorization coded here.
enacted_by:
  - us_civil_war_republican_economic_state_building_1862_1864
axes_moved:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: strong
    intended: true
    rationale: The act authorized federal land and bond support for a specific railway construction sector.
references:
  - "Pacific Railway Act, 12 Stat. 489 (1862): https://www.archives.gov/milestone-documents/pacific-railway-act"
notes: The fiscal axis records support authorized at enactment; it is not a claim about the ultimate fiscal cost or project returns.
