policy_id: mlt_eu_accession_and_euro_reform_2004_2019_policy
status: candidate
title: Malta’s EU accession, fiscal reform, and euro adoption, 2004–2019
countries:
- MLT
timeframe:
  start: 2004
  end: 2019
description: The Maltese authorities’ 2005 and 2008 IMF consultations document parastatal reform, fiscal consolidation,
  divestment, market liberalisation, and euro adoption; the European Commission records Malta’s 2004 EU accession.
enacted_by:
- mlt_eu_accession_and_euro_reform_2004_2019
coalition_label_at_enactment: Successive Maltese governments during EU membership and euro adoption
axes_moved:
- axis: fiscal.spending_level
  direction: '-'
  magnitude: moderate
  intended: false
  rationale: Fiscal consolidation reduced the deficit and debt burden during the run-up to euro membership.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: false
  rationale: Parastatal reform, divestment, and market liberalisation reduced direct public-sector involvement.
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  intended: false
  rationale: EU and euro-area participation deepened European and global market integration.
references:
