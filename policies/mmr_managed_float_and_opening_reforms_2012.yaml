# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: mmr_managed_float_and_opening_reforms_2012
status: candidate
title: Myanmar exchange-rate unification and market-opening reforms
countries: [MMR]
timeframe: {start: 2011, end: 2020, enacted_date: "2012-04-01"}
description: >
  The new government began reforms to unify exchange rates, establish a managed float,
  increase budget transparency, modernise finance, and liberalise trade and foreign
  investment. Political opening and civilian administration expanded but did not
  remove constitutional military powers or end conflict.
enacted_by: [myanmar_quasi_civilian_and_nld_reform_2011_2020]
coalition_label_at_enactment: Thein Sein-led transitional government
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "Trade and foreign investment were liberalised and exchange restrictions eased."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "Reforms sought to build institutions for an integrated market economy."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, intended: true, rationale: "Civilian administration and competitive elections expanded within constitutional limits."}
references:
  - "IMF, Myanmar 2011 Article IV: https://www.elibrary.imf.org/view/journals/002/2012/104/article-A001-en.xml"
  - "World Bank, Myanmar Economic Transition amid Conflict: https://www.worldbank.org/en/country/myanmar/publication/myanmar-economic-transition-amid-conflict-a-systematic-country-diagnostic"
notes: "The record covers the 2011–2020 transition period; reforms were uneven and the military retained constitutional power."
