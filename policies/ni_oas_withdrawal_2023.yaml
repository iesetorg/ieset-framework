# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ni_oas_withdrawal_2023
status: candidate
title: Nicaragua's denunciation of the OAS Charter effective in 2023
countries: [NIC]
timeframe:
  start: 2023
  end: ongoing
  effective_date: '2023-11-19'
description: >-
  Nicaragua sent a letter dated 18 November 2021 notifying the Organization
  of American States that it was denouncing the OAS Charter. The OAS General
  Secretariat received it on 19 November 2021. Under the Charter's two-year
  notice rule, the denunciation took effect on 19 November 2023 and
  Nicaragua ceased to be an OAS member. OAS membership withdrawal does not
  itself extinguish Nicaragua's obligations under other applicable
  inter-American human-rights instruments.
enacted_by:
  - nicaragua_ortega_fsln_consolidation_2007_present
evaluation_design:
  event_dates:
    - '2021-11-18 denunciation letter dated'
    - '2021-11-19 notice received by OAS General Secretariat'
    - '2023-11-19 Charter denunciation effective and membership ceased'
  notes: >-
    Notice and effective dates are distinct. This is a treaty-membership
    event, not a measure of democracy, rights protection or trade flows.
references:
  - https://www.oas.org/en/sla/dil/inter_american_treaties_a-41_charter_oas_signatories.asp
  - https://www.oas.org/en/sla/dil/inter_american_treaties_recent_actions_2023.asp
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  This record codes only the legally effective membership change. It does
  not assign rights outcomes, causal effects, axis movement or school credit.
