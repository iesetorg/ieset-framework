policy_id: nz_smokefree_generation_2022
status: candidate
title: Smokefree Environments (Smoked Tobacco) Amendment Act 2022
countries:
- NZL
timeframe:
  start: 2022
  end: 2024
  enacted_date: '2022-12-16'
  treatment_onset_unresolved: true
description: The 2022 Act established a staged statutory programme for fewer approved smoked-tobacco
  retailers, reduced nicotine in smoked tobacco, and a prohibition on sales to people born on
  or after 1 January 2009. Preparatory provisions commenced in January 2023, while the three
  headline restrictions were scheduled for July 2024, April 2025, and January 2027 respectively.
  The 2024 repeal removed those headline restrictions before their scheduled first application.
