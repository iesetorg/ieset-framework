# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_autumn_statement_fiscal_drag_2022
status: candidate
title: UK Autumn Statement 2022 — fiscal drag threshold freeze
countries:
- GBR
timeframe:
  start: 2022
  end: 2028
  effective_date: '2023-04-06'
  treatment_onset_unresolved: true
description: >-
  HM Treasury published the Autumn Statement on 17 November 2022. It extended the
  freeze of income-tax and National Insurance thresholds to April 2028 and lowered
  the income-tax additional-rate threshold from GBP 150,000 to GBP 125,140 from
  6 April 2023. Other tax and spending measures had different start dates. The
  2022 date is an announcement, while 6 April 2023 is the first date for the
  specified additional-rate threshold; the package has no single treatment onset.
enacted_by:
- uk_sunak_conservative_2022_2024
coalition_label_at_enactment: Conservative majority (Sunak)
axes_moved:
- axis: fiscal.tax_progressivity
  direction: +
  magnitude: weak
  intended: true
  rationale: The additional-rate threshold reduction increases top-band coverage; the combined distributional effect of threshold freezes is not inferred from this coding.
references:
- https://www.gov.uk/government/publications/autumn-statement-2022-documents/autumn-statement-2022-html
- https://www.gov.uk/government/news/autumn-finance-bill-2022-published
