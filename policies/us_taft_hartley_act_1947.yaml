policy_id: us_taft_hartley_act_1947
status: candidate
title: Labor-Management Relations Act (Taft-Hartley)
countries: [USA]
timeframe: {start: 1947, enacted_date: '1947-06-23'}
description: >
  The Labor-Management Relations Act amended federal labor law by restricting
  specified union practices, permitting state right-to-work laws, and changing
  the rules governing labor-management disputes. President Truman vetoed the
  measure and Congress overrode the veto. Its statutory provisions shifted
  bargaining power in some domains; the coding records the legal change and
  does not claim a uniform effect on wages, employment, or unionization.
enacted_by:
  - us_postwar_bipartisan_economic_settlement_1944_1963
axes_moved:
  - axis: regulatory.labour_market_flexibility
    direction: "+"
    magnitude: weak
    intended: true
    rationale: Restrictions on selected union tactics and permission for state right-to-work laws loosened some statutory constraints on employers and labor markets.
references:
  - "Labor-Management Relations Act, 61 Stat. 136 (1947)"
  - "US Senate, Truman veto record: https://www.senate.gov/reference/Legislation/Vetoes/Presidents/TrumanH.pdf"
