policy_id: nz_smokefree_generation_repeal_2024
status: candidate
title: Smokefree Environments and Regulated Products Amendment Act 2024
countries:
- NZL
timeframe:
  start: 2024
  end: 2024
  enacted_date: '2024-03-05'
  effective_date: '2024-03-06'
  treatment_onset_unresolved: true
description: The 2024 Amendment Act removed the 2022 provisions for a generational smoked-tobacco
  sales prohibition, a retailer-number reduction, and a reduced-nicotine requirement. It received
  Royal assent on 5 March and commenced on 6 March 2024. The three central restrictions had
  been scheduled for later dates and had not begun, so the repeal is a reversal of future rules
  rather than a measured liberalisation of an operating retailer regime.
