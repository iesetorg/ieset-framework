description: The Fair Pay Agreements Act 2022 created a framework under which eligible unions
  could initiate bargaining for industry- or occupation-wide minimum employment terms. Most
  provisions commenced on 1 December 2022; preliminary sections commenced earlier and a limited
  provision later. No fair pay agreement was concluded before the framework was repealed on
  20 December 2023. The legal opportunity to bargain is distinct from actual sector-wide employment
  terms.
enacted_by:
