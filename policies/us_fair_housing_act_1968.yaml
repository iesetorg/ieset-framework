policy_id: us_fair_housing_act_1968
status: candidate
title: Fair Housing Act of 1968
countries: [USA]
scope: national
timeframe:
  start: 1968
  end: 1968
  enacted_date: '1968-04-11'
  effective_date: '1968-04-11'
description: >
  Title VIII of the Civil Rights Act of 1968 prohibited specified racial,
  religious, color, and national-origin discrimination in housing sale,
  rental, and related financing. President Johnson signed it on 11 April
  1968. On enactment, its sale and rental prohibitions applied to federal or
  federally aided dwellings described in section 803; coverage expanded to
  other non-exempt dwellings on 1 January 1969. Statutory exemptions remained.
enacted_by: [us_lbj_great_society_1964_1968]
axes_moved:
  - axis: institutional.rule_of_law
    direction: '+'
    magnitude: weak
    intended: true
    rationale: Section 804 established a federal housing equal-treatment prohibition, initially for federally connected dwellings and then for other non-exempt dwellings.
references:
  - 'U.S. Statutes at Large, Public Law 90-284, Title VIII, approved 11 April 1968: https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg73.pdf'
  - 'U.S. Department of Housing and Urban Development, Fair Housing Act section 803 staged coverage: https://www.hud.gov/sites/dfiles/GC/documents/HUDBasicLawsJune2025.pdf'
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
notes: >
  The effective_date is the first statutory treatment date for covered
  federally connected housing. It is not the treatment date for all eligible
  housing; section 803 expanded coverage on 1 January 1969, with exemptions.
  The policy record does not assert an observed housing-market outcome.
