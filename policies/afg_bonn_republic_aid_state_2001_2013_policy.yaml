policy_id: afg_bonn_republic_aid_state_2001_2013_policy
status: candidate
title: Afghanistan's Bonn-era state building and aid-financed public sector
countries: [AFG]
timeframe: {start: 2001, end: 2013}
description: >
  The Bonn process established an interim administration and was followed by a
  2004 Constitution, elections, public-sector reconstruction, and expanded
  health, education, and infrastructure services. International civilian and
  security grants financed an exceptional share of the budget and public
  expenditure. The Constitution protected private property and provided for a
  market economy, although security and institutional capacity remained weak.
enacted_by: [afg_bonn_republic_aid_state_2001_2013]
scope: national
coalition_label_at_enactment: Islamic Republic governments
axes_moved:
  - {axis: fiscal.spending_level, direction: +, magnitude: strong, intended: true, rationale: Foreign grants and reconstruction finance expanded public expenditure and state services.}
  - {axis: institutional.property_rights, direction: +, magnitude: moderate, intended: true, rationale: The 2004 Constitution expressly protected private property and a market economy.}
references:
  - "World Bank, Afghanistan economic development from 2001 to 2021: https://thedocs.worldbank.org/en/doc/5f01165822f3639224e0d483ba1861fc-0310062022/original/ADU-2022-FINAL-CLEARED.pdf"
  - "Afghanistan National Development Strategy: https://documents1.worldbank.org/curated/en/533851467994667485/pdf/434310PRSP0P1117376B01OFF0USE0ONLY1.pdf"
notes: "This records donor-financed public spending separately from domestic revenue capacity."
