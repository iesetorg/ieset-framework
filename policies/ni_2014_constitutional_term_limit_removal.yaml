policy_id: ni_2014_constitutional_term_limit_removal
status: candidate
title: Nicaragua's 2014 constitutional amendment to presidential eligibility
countries: [NIC]
timeframe:
  start: 2014
  end: ongoing
  enacted_date: '2014-01-29'
  effective_date: '2014-02-10'
description: >-
  Law No. 854 amended Nicaragua's constitution, including Articles 146 and
  147 on presidential elections and eligibility. Article 146 retained direct
  election and made a relative plurality sufficient; the amended Article 147
  no longer contained the former presidential reelection restriction. The
  National Assembly dated the law 29 January 2014, and Article 51 made it
  effective on publication in La Gaceta on 10 February 2014. This record
  describes the legal rule, not any subsequent election result.
enacted_by:
  - nicaragua_ortega_fsln_consolidation_2007_present
evaluation_design:
  event_dates:
    - '2014-01-29 National Assembly law date'
    - '2014-02-10 publication in La Gaceta and entry into force'
  notes: >-
    The published constitutional text is the legal exposure. Later electoral
    outcomes are separate observations and are not inferred here.
references:
