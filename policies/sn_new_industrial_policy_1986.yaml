# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: sn_new_industrial_policy_1986
status: candidate
title: "New Industrial Policy and trade opening"
countries: [SEN]
timeframe: {start: 1986, end: 1993}
description: >
  Senegal's 1986 New Industrial Policy sought to improve firm competitiveness
  and exports by reducing and harmonizing tariffs, removing most quantitative
  import restrictions, opening domestic trade, and restructuring public
  enterprises. The liberalization was partial and uneven: some measures were
  reversed by 1989 and remaining protection was still substantial in 1993.
enacted_by: [senegal_diouf_adjustment_1981_1993]
coalition_label_at_enactment: "Socialist Party government under Abdou Diouf"
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Tariff reduction and removal of most quantitative restrictions opened parts of the goods market, although some measures were later reversed.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Opening domestic trade and reducing protected industrial allocation increased competitive pressure, with uneven implementation.", intended: true}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "Enterprise restructuring and reduced administration of industrial incentives aimed to lower public-sector costs.", intended: true}
references:
  - "IMF, Senegal 1978-93: https://www.elibrary.imf.org/display/book/9781557755667/C4.xml"
  - "IMF, A Review of Senegal's Industrial Framework: https://www.elibrary.imf.org/display/book/9781484303139/ch003.xml"
