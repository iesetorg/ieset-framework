# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_eea_referendum_rejection_1992
status: candidate
title: Swiss rejection of European Economic Area accession (1992)
countries: [CHE]
timeframe:
  start: 1992
  end: 1992
description: >
  Swiss voters rejected accession to the European Economic Area on 6 December
  1992, with 50.3 percent voting no. Switzerland consequently did not enter the
  proposed EEA agreement and subsequently pursued sectoral agreements with the
  European Union. This record captures the rejected accession proposal, not an
  enacted tariff, trade restriction, or measured change in trade openness.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
evaluation_design:
  event_dates:
    - '1992-12-06 EEA accession referendum rejected'
  notes: >
    The vote blocked a proposed accession. It did not itself change Swiss trade
    barriers. Do not code the rejection as a negative trade-openness treatment;
    evaluate the later bilateral agreements at their own effective dates.
references:
  - https://www.europa.eda.admin.ch/en/popular-votes-and-chronology
  - https://www.bk.admin.ch/de/volksabstimmung-vom-6-dezember-1992
