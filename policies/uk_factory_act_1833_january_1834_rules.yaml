policy_id: uk_factory_act_1833_january_1834_rules
status: candidate
title: UK textile-mill child and youth work restrictions, 1833–34
countries: [GBR]
scope: national
timeframe:
  start: 1833
  enacted_date: '1833-08-29'
  effective_date: '1834-01-01'
description: >
  Sections I and VII of the Factory Act 1833 applied from 1 January 1834 to
  specified mechanically powered textile mills and factories throughout the
  United Kingdom of Great Britain and Ireland. They barred night work by
  people under eighteen and employment of children under nine, with an
  exception for silk mills in the latter rule. The Act also capped under-eighteen
  hours, created factory inspectors, and phased in further child-hour and
  schooling requirements on different dates. It did not cover every industry
  or impose a general working-hours limit on adults.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: >
    Sections I and VII restricted night scheduling and employment of children
    in the covered mills from 1 January 1834. The sign reflects the legal
    restriction, not an estimated labour-market effect; magnitude is withheld.
references:
- 'Factory Act 1833, 3 & 4 Will. 4 c. 103, as enacted, sections I, II, VII, VIII and XVII: https://www.legislation.gov.uk/ukpga/Will4/3-4/103/pdfs/ukpga_18330103_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The effective date is the explicit 1 January 1834 start of the two rules
  emphasized here; it is not the first operation or full commencement of every
  provision in the 1833 Act. Section II's under-eighteen hours cap and section
  XVII's authority to appoint inspectors are separately worded, while other
  child-hour and schooling provisions phased in after passage. GBR denotes the
  historical United Kingdom including Ireland, not a separately scored modern
  IRL jurisdiction. This policy-only record creates no movement or numeric
  country-drift step.
