policy_id: nz_trial_periods_all_employers_2023
status: candidate
title: Employment Relations (Trial Periods) Amendment Act 2023
countries:
- NZL
scope: national
timeframe:
  start: 2023
  enacted_date: '2023-12-22'
  effective_date: '2023-12-23'
  treatment_onset_unresolved: true
description: The Employment Relations (Trial Periods) Amendment Act 2023 removed the restriction
  limiting optional trial clauses of up to 90 days to employers with fewer than 20 employees.
  From 23 December 2023, any employer could agree to a valid written trial clause with a new
  employee who had not previously worked for that employer. The Act changed legal eligibility;
  it does not establish how many firms used trial clauses or any employment effect.
enacted_by:
- newzealand_luxon_coalition_2023_present
coalition_label_at_enactment: National-ACT-NZ First
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: +
  magnitude: moderate
  intended: true
  rationale: Section 67A broadened optional dismissal-trial eligibility from small employers
    to all employers.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
references:
- 'New Zealand Legislation, Employment Relations (Trial Periods) Amendment Act 2023 (2023 No
  69), assent 22 December 2023, section 2 commencement and sections 4 to 5: https://www.legislation.govt.nz/act/public/2023/69/en/latest/'
notes: Potentially treated firms had at least 20 employees and new employment contracts after
  23 December 2023; smaller firms were already eligible. Actual trial-clause uptake, affected
  new hires and outcomes are unobserved, so second-order treatment onset remains unresolved.
