# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: sn_dakar_toll_highway_ppp_2003
status: candidate
title: "Dakar-Diamniadio toll highway public-private partnership"
countries: [SEN]
timeframe: {start: 2003, end: 2013}
description: >
  The Wade government pursued a toll-highway concession as a new form of
  infrastructure finance: the private partner contributed to construction and
  operated the road for toll revenue, while government and development-finance
  partners covered other costs. Construction and opening extended beyond
  Wade's presidency, so the policy period identifies the project rather than
  attributing the completed result to one administration.
enacted_by: [senegal_wade_private_investment_and_infrastructure_2000_2012]
coalition_label_at_enactment: "Sopi Coalition / Senegalese Democratic Party government"
axes_moved:
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "The project combined public contributions with private financing; available evidence does not establish a net change in total public spending.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "A private concession introduced toll-funded private participation in highway construction and operations, alongside public investment.", intended: true}
references:
  - "World Bank PPP Reference Guide case study, Senegal's Toll Highway PPP 2003-2013: https://ppp.worldbank.org/library/new-route-development-senegal-s-toll-highway-ppp-2003-2013"
