# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fi_bank_of_finland_independence_1997_1998
status: candidate
title: Finland Bank of Finland independence Acts 1997 and 1998
countries: [FIN]
timeframe:
  start: 1997
  end: 1998
  enacted_date: '1997-07-24'
  effective_date: '1998-01-01'
description: >
  Finland's 1997 Bank of Finland Act took effect on 1 January 1998 and
  removed the principal statutory conflicts with central-bank independence.
  Act 214/1998 then made additional independence provisions effective on
  1 May 1998, before Eurosystem integration took effect in January 1999.
enacted_by: [finland_lipponen_rainbow_1995_2003]
coalition_label_at_enactment: Lipponen rainbow coalition
axes_moved:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: strong
    rationale: Domestic statutory autonomy changed in 1998 before euro entry.
references:
  - https://www.finlex.fi/sv/lagstiftning/forfattningssamling/1997/719
  - https://publications.bof.fi/bitstream/10024/45846/1/168283.pdf
  - https://www.ecb.europa.eu/pub/pdf/conrep/cr1998en.pdf
