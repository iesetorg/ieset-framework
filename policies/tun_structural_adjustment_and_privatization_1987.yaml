# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tun_structural_adjustment_and_privatization_1987
status: candidate
title: Tunisia structural adjustment and public-enterprise reform
countries: [TUN]
timeframe: {start: 1987, end: 2011, enacted_date: "1987-08-02"}
description: >
  The structural adjustment programme launched after the 1986 crisis sought price,
  trade, interest-rate and investment liberalisation; public-enterprise restructuring
  and gradual privatisation; and outward-oriented growth. Subsequent programmes
  continued these measures, with significant strategic state ownership retained.
enacted_by: [tunisia_ben_ali_adjustment_and_export_led_growth_1988_2011]
coalition_label_at_enactment: Government of Tunisia under Zine El Abidine Ben Ali
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "The programme liberalised trade and encouraged export orientation."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "Price, investment, and private-enterprise reforms expanded market allocation."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, intended: true, rationale: "Public-enterprise restructuring and selected privatisations reduced state commercial ownership."}
references:
  - "IMF, Tunisia structural reform programme launched in 1986: https://www.elibrary.imf.org/display/book/9781557753571/ch005.xml"
  - "IMF, Tunisia privatization and public enterprise reform: https://www.elibrary.imf.org/view/journals/002/2000/037/article-A001-en.xml"
notes: "The linked movement begins in 1988; this policy record starts with the adjustment programme and reform law in 1987."
