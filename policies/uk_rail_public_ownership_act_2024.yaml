# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_rail_public_ownership_act_2024
status: candidate
title: UK Passenger Railway Services (Public Ownership) Act 2024
countries:
- GBR
timeframe:
  start: 2024
  end: ongoing
  enacted_date: '2024-11-28'
  effective_date: '2024-11-28'
  treatment_onset_unresolved: true
description: >
  The Act amended the Railways Act 1993 to prohibit new or extended private
  passenger franchise agreements, subject to a temporary-continuation exception,
  and to provide for public-sector operation of designated passenger services.
  It extends to England, Wales and Scotland. The legal change took effect on
  Royal Assent, while individual services move as their existing contracts end
  or reach break points; Royal Assent did not transfer every operator at once.
enacted_by:
- uk_starmer_labour_2024_present
coalition_label_at_enactment: Labour majority (Starmer)
references:
- 'UK legislation, Passenger Railway Services (Public Ownership) Act 2024, sections 1, 2 and 5: https://www.legislation.gov.uk/ukpga/2024/25/pdfs/ukpga_20240025_en.pdf'
- 'UK Department for Transport, public ownership: railway passenger services, 4 December 2024: https://www.gov.uk/government/speeches/public-ownership-railway-passenger-services'
axes_moved:
- axis: regulatory.sectoral_licensing
  direction: +
  magnitude: strong
  intended: true
  rationale: Eliminates private-operator franchising regime; state becomes sole operator class for passenger rail.
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Removes operator-level competitive tendering in passenger rail.
linked_hypotheses_inferred:
- asian_convergence_vs_western_stagnation_2000_2023
- price_controls_produce_shortages_and_quality_degradation
