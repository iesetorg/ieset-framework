notes: >
  The effective_date is the Act's legal commencement, not a common service-level
  treatment date. South Western Railway was scheduled as the first transfer on
  25 May 2025, with later contracts following their own dates. Operator-level
  treatment requires a separate route or contract roster; no outcome is inferred.
