policy_id: us_volcker_disinflation_1979_1982
status: candidate
title: Federal Reserve reserve-targeting decision and disinflation period, 1979–1982
countries: [USA]
scope: national
timeframe:
  start: 1979
  end: 1982
description: >
  At its special meeting on 6 October 1979, the Federal Open Market Committee
  directed open-market operations to place primary emphasis on restraining the
  expansion of bank reserves, allowing wider federal-funds-rate fluctuations.
  The decision aimed to slow growth of monetary aggregates. This policy record
  places that decision within the subsequent disinflation period; it does not
  treat the meeting date as a statute, a uniformly applied treatment date, or
  proof of the cause of later inflation and employment changes.
enacted_by:
- volcker_disinflation_1979_1982
coalition_label_at_enactment: Federal Open Market Committee under Chair Paul Volcker
references:
- 'Federal Reserve Board, record of policy actions at the 6 October 1979 FOMC meeting, domestic policy directive: https://www.federalreserve.gov/monetarypolicy/files/fomcropa19791006.pdf'
- 'Federal Reserve History, chronology of Volcker announcement and subsequent operating procedure: https://www.federalreservehistory.org/essays/anti-inflation-measures'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The former enacted_date of 6 October described an FOMC decision and public
  announcement, not enactment of a law or the first day of open-market
  operations. The exact treatment onset for an event study requires a separate
  operational definition. Neither a legal independence change nor an observed
  monetary-base contraction is inferred from the meeting record.
