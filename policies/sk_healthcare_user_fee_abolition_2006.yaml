policy_id: sk_healthcare_user_fee_abolition_2006
status: candidate
title: Healthcare user-fee abolition 2006
countries:
- SVK
timeframe:
  start: 2006
  enacted_date: '2006-08-04'
  effective_date: '2006-09-01'
description: >
  Government Regulation 485/2006 amended the patient-fee schedule, setting
  charges for outpatient visits and specified inpatient lodging and meals to
  zero Slovak korunas from 1 September 2006. The government changed the
  implementing fee amounts rather than repealing the underlying healthcare law.
enacted_by:
- slovakia_fico_smer_first_term_2006_2010
coalition_label_at_enactment: Smer-SNS-HZDS
references:
- 'Government Regulation 485/2006 Z. z., approved 4 August and effective 1 September 2006: https://static.slov-lex.sk/static/SK/ZZ/2006/485/20060901.print.html'
evaluation_design:
  event_dates:
  - '2006-08-04: Government Regulation 485/2006 approved.'
  - '2006-08-22: Regulation published.'
  - '2006-09-01: Zero-fee schedule first applied.'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The canonical transfer-expansion axis covers cash and near-cash transfer
  programmes. A fee waiver for publicly financed medical services does not
  establish such a programme, so the event remains unscored pending a suitable
  public-service or patient-charge axis.
