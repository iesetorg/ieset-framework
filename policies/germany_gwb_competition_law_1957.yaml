title: Germany Gwb Competition Law 1957
countries:
- DEU
timeframe:
  start: 1958
  end: 1958
  enacted_date: '1957-07-27'
  effective_date: '1958-01-01'
description: >-
  The West German Act Against Restraints of Competition (GWB), dated 27 July
  1957, entered into force on 1 January 1958. It prohibited restrictive
  agreements and created the Bundeskartellamt to enforce cartel rules and
  supervise abuses of market power. Later amendments, including merger
  control introduced in 1973, are outside this original-act event.
