# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: morocco_constitution_and_pjd_2011_2020_policy
status: candidate
title: Morocco 2011 constitutional reform and fuel-subsidy restructuring
countries: [MAR]
timeframe: {start: 2011, end: 2020}
description: >
  The 2011 constitution revised the formal balance among parliament, the
  government, and the monarchy. Subsequent governments phased out most
  petroleum-price subsidies between 2012 and 2015 and prepared universal health
  insurance and family allowances as part of a broader social protection
  reform programme approved in 2020.
enacted_by: [morocco_constitution_and_pjd_2011_2020]
scope: national
coalition_label_at_enactment: Constitutional monarchy and PJD-led coalitions
axes_moved:
  - {axis: institutional.rule_of_law, direction: +, magnitude: weak, intended: true, rationale: "The constitution formally strengthened the parliament and head of government's role while preserving royal prerogatives."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, intended: true, rationale: "Most fuel subsidies were removed over 2012-2015, reducing broad price support."}
  - {axis: fiscal.transfer_expansion, direction: +, magnitude: weak, intended: true, rationale: "The 2020 reform programme prepared broader social assistance and health coverage."}
references:
  - "World Bank, Morocco reform overview: https://documents1.worldbank.org/curated/en/099445305182323280/pdf/SECBOS0941e8cb0520b7060244f58dca781.pdf"
  - "World Bank, Morocco social protection reform 2020: https://www.worldbank.org/en/news/press-release/2020/12/03/world-bank-supports-moroccos-social-protection-response-and-reform"
notes: "The social protection record describes a programme and does not imply that every benefit was fully implemented by 2020."
