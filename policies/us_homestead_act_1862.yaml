# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_homestead_act_1862
status: candidate
title: Homestead Act of 1862
countries: [USA]
timeframe:
  start: 1862
  end: 1862
  enacted_date: "1862-05-20"
description: >
  The Homestead Act offered eligible adults up to 160 acres of surveyed federal
  land after a filing fee, residence, and cultivation requirements. It transferred
  public land toward privately held settler farms rather than simply withdrawing
  the federal government from land allocation. The policy's distributional reach
  was unequal, and its implementation formed part of westward settlement that
  affected and dispossessed Indigenous peoples.
enacted_by:
  - us_civil_war_republican_economic_state_building_1862_1864
axes_moved:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: In-kind grants of federal land supported eligible settler agriculture; this codes the public resource transfer, not federal cash outlays.
  - axis: institutional.property_rights
    direction: mixed
    intended: false
    rationale: Settler title was expanded while Indigenous land claims and property rights were harmed; a single national sign would obscure that asymmetry.
references:
  - "Homestead Act, 12 Stat. 392 (1862): https://www.archives.gov/milestone-documents/homestead-act"
  - "National Park Service, Native Americans and the Homestead Act: https://www.nps.gov/home/learn/historyculture/native-americans-and-the-homestead-act.htm"
notes: Candidate coding treats land grants as in-kind sector support; it does not equate formal settler title with property security for all residents.
