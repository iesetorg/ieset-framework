# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: nicaragua_post_sandinista_market_transition_1991_2006_policy
status: candidate
title: Nicaragua stabilisation, market liberalisation, and public-asset divestment
countries: [NIC]
timeframe: {start: 1991, end: 2006}
description: >
  The post-1990 governments used IMF-supported programmes to reduce
  macroeconomic imbalances, liberalise most prices and foreign trade, reform
  the banking system, privatise public assets, and reduce public employment and
  military outlays. Later administrations pursued debt relief and fiscal
  consolidation, while concentrated ownership and unresolved property claims
  limited the breadth of the market transition.
enacted_by: [nicaragua_post_sandinista_market_transition_1991_2006]
scope: national
coalition_label_at_enactment: Chamorro, Alemán, and Bolaños administrations
axes_moved:
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, intended: true, rationale: "Price, trade, and foreign-exchange liberalisation expanded private commerce and external trade."}
  - {axis: institutional.property_rights, direction: +, magnitude: moderate, intended: true, rationale: "Public-asset divestment and restored private financial activity increased the formal private sector."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, intended: true, rationale: "Stabilisation reduced public employment and military expenditure."}
references:
  - "IMF, Nicaragua recent economic developments 1990-1996: https://www.imf.org/en/publications/cr/issues/2016/12/30/nicaragua-recent-economic-developments-1732"
  - "World Bank, Nicaragua private-sector transition: https://documents1.worldbank.org/curated/en/792361468775605076/pdf/279670NI.pdf"
notes: "Broad period proxy across three governments and multiple IMF-supported programmes."
