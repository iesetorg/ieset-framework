# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_glass_steagall_banking_act_1933
status: candidate
title: Banking Act of 1933 (Glass-Steagall)
countries: [USA]
scope: national
timeframe:
  start: 1933
  enacted_date: '1933-06-16'
description: >
  The Banking Act of 1933 restricted securities dealing, underwriting, and
  affiliations for covered commercial banks; established the Federal Deposit
  Insurance Corporation; changed federal bank supervision; and authorized
  deposit-interest restrictions. Some separation provisions allowed a
  transition period, and the temporary federal deposit-insurance fund began
  coverage on 1 January 1934. The 1999 repeal of key affiliation restrictions
  did not end all provisions or the FDIC, so 1999 is not this policy's end date.
enacted_by:
- us_fdr_new_deal_1933_1939
axes_moved:
- axis: regulatory.financial_deregulation
  direction: '+'
  intended: true
  rationale: >
    The Act imposed bank securities, affiliation, supervision, and deposit
    restrictions. Magnitude is withheld because these provisions had
    different coverage and transition dates.
references:
- 'Banking Act of 1933, ch. 89, 48 Stat. 162, original statute: https://www.govinfo.gov/content/pkg/STATUTE-48/pdf/STATUTE-48-Pg162-2.pdf'
- 'Federal Reserve History, Banking Act of 1933: https://www.federalreservehistory.org/essays/glass-steagall-act'
- 'FDIC, historical timeline 1930-1939: https://www.fdic.gov/history/1930-1939'
evaluation_design:
  event_dates:
  - '1933-06-16: Banking Act signed.'
  - '1934-01-01: Temporary federal deposit-insurance fund began coverage.'
  - '1999: Key securities-affiliation restrictions repealed; other provisions and FDIC continued.'
  known_data_gaps:
  - No bank-level treated/comparison outcomes are attached to this statutory record.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  A deposit-insurance fund and its possible contingent liability are not
  household cash transfers. Agency creation by itself does not establish a
  general-government spending-share change, stronger judicial rule of law,
  bank-run prevention effect, or crisis-rate effect. The former generic
  inferred links and duplicate enacted_by entry were removed. Separate
  enactment, phase-in, and 1999 partial-repeal dates should be used for any
  future outcome design.
