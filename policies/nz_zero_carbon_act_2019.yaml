description: The Climate Change Response (Zero Carbon) Amendment Act 2019 inserted long-term
  national greenhouse-gas targets, a Climate Change Commission, emissions-budget duties, and
  adaptation planning into New Zealand law. It received Royal assent on 13 November and commenced
  the next day. Later budget decisions, sector rules, emissions reductions, and economic costs
  require their own dates and evidence.
