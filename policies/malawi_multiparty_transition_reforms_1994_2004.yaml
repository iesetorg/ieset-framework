policy_id: malawi_multiparty_transition_reforms_1994_2004_policy
status: candidate
title: Multiparty transition and market-oriented reforms
countries:
- MWI
timeframe:
  start: 1994
  end: 2003
description: The 1993 referendum and 1994 multiparty election ended three decades of one-party rule. The
  new government promoted private-sector activity and competitive markets, deregulation, macroeconomic
  stabilisation, and reorientation of public expenditure toward social services. Fiscal pressures, drought,
  and weak implementation complicated the reform path.
enacted_by:
- malawi_multiparty_transition_reforms_1994_2004
scope: national
coalition_label_at_enactment: United Democratic Front governments
axes_moved:
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  intended: true
  rationale: Multiparty constitutional government replaced the one-party system.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: true
  rationale: The reform programme sought stronger private-sector activity and competitive markets.
- axis: fiscal.transfer_expansion
  direction: +
  magnitude: weak
  intended: true
  rationale: Public spending was reoriented toward social services, alongside significant fiscal stress.
references:
- 'World Bank, Malawi Fiscal Restructuring and Deregulation Program completion report: https://documents1.worldbank.org/curated/en/784411468048895989/pdf/multi-page.pdf'
- 'World Bank, Malawi country economic memorandum: https://documents1.worldbank.org/curated/en/473381468270033298/pdf/36862.pdf'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
