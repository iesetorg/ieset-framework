# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tw_industrial_innovation_tax_credit_amendment_2025
status: candidate
title: Taiwan's 2025 Industrial Innovation Statute tax-credit amendment
countries: [TWN]
timeframe:
  start: 2025
  end: 2029
  enacted_date: '2025-05-07'
  effective_date: '2025-05-09'
description: >-
  Taiwan promulgated amendments to the Industrial Innovation Statute on 7
  May 2025. Revised Article 10-1 extended equipment-investment tax credits
  through 2029 and made AI products and services and energy-conservation
  and carbon-reduction investments eligible alongside existing categories.
  The amended statute also revised start-up investment incentives and
  outbound-investment controls. Article 10-1 uses the statute's
  promulgation-day commencement rule, which becomes legally effective on
  the third calendar day. Qualifying expenditure windows and other
  article-specific dates are stated separately in the statute.
enacted_by:
  - taiwan_lai_dpp_2024_present
evaluation_design:
  event_dates:
    - '2025-04-18 Legislative Yuan passed the amendments'
    - '2025-05-07 presidential promulgation'
    - '2025-05-09 Article 10-1 effective under Central Regulation Standard Act Article 13'
    - '2029-12-31 scheduled end of Article 10-1 incentive window'
  notes: >-
    This is a broad industrial tax amendment, not a semiconductor-only grant.
    Eligibility for a tax credit is not evidence of take-up or output effects.
references:
  - https://law.moea.gov.tw/EngLawContent.aspx?id=10684&lan=E
  - https://www.president.gov.tw/Page/294/49838
  - https://english.ey.gov.tw/News3/9E5540D592A5FECD/5f572369-d688-4734-8bb6-0bd96c69f845
  - https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030133
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Tax-credit eligibility and legal dates are source-backed. No subsidy
  magnitude, investment response, causal effect or school credit is inferred.
