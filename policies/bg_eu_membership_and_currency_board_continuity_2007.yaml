# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bg_eu_membership_and_currency_board_continuity_2007
status: candidate
title: Bulgaria EU membership under currency-board and fiscal discipline framework
countries: [BGR]
timeframe: {start: 2007, end: 2022, enacted_date: "2007-01-01"}
description: >
  EU membership placed Bulgaria within the single market and common rules for
  competition and state aid, while the currency board continued to anchor monetary
  policy and governments generally maintained low public debt. EU funds supported
  investment; institutional performance and corruption remained contested.
enacted_by: [bulgaria_eu_member_state_economic_governance_2007_2022]
coalition_label_at_enactment: Coalition government under Sergei Stanishev
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "Membership integrated Bulgaria into the EU single market and common regulatory framework."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, intended: true, rationale: "Fiscal restraint coexisted with EU-supported public investment."}
references:
  - "World Bank, Bulgaria stabilization and EU accession structural reforms: https://documents1.worldbank.org/curated/en/253381468015849237/pdf/342330BG.pdf"
notes: "Movement-level summary spans subsequent governments and is not a claim of an unchanged coalition."
