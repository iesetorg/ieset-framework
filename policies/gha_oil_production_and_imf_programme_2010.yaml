# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: gha_oil_production_and_imf_programme_2010
status: candidate
title: Ghana oil production, public investment and macroeconomic stabilisation
countries: [GHA]
timeframe: {start: 2010, end: 2016, enacted_date: "2010-12-15"}
description: >
  Commercial oil production began at Jubilee field in 2010, creating a new source of
  export earnings and public revenue. Public infrastructure and social investment
  remained priorities, while fiscal imbalances, energy shortages, and debt pressures
  led to an IMF programme in 2015.
enacted_by: [ghana_mills_mahama_ndc_government_2009_2016]
coalition_label_at_enactment: National Democratic Congress government under John Atta Mills
axes_moved:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, intended: true, rationale: "Oil production and public investment increased the strategic role of the state in the resource sector."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "Infrastructure and social programmes expanded before a subsequent stabilisation programme."}
references:
  - "World Bank, Ghana adjustment and growth context: https://documents1.worldbank.org/curated/en/988621468030626957/pdf/596200NWP01pub158288B0prsc1ghana1cs.pdf"
notes: "The period combines resource production and public investment with later fiscal adjustment."
