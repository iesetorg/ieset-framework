# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: kz_tokayev_economic_liberalisation_decree_2024
status: candidate
title: Kazakhstan measures to liberalise the economy, 2024
countries: [KAZ]
timeframe: {start: 2024, end: ongoing, enacted_date: "2024-05-08"}
description: >
  The Tokayev administration announced and issued measures to reduce the
  state's commercial participation, remove unnecessary business regulation,
  improve the business climate, and support medium-sized private firms. The
  programme also retained state-led diversification, social support, and
  strategic investment, so it is a direction toward more competition within a
  continuing developmental state.
coalition_label_at_enactment: Tokayev presidency and government
enacted_by: [kazakhstan_tokayev_fair_state_market_reform_2019_present]
axes_moved:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "The programme seeks to reduce unnecessary regulation and state dominance in commercial activity."}
  - {axis: institutional.property_rights, direction: "+", magnitude: weak, intended: true, rationale: "The administration commits to stronger protection of private property and clearer business rules, while asset-recovery policy creates a countervailing state role."}
  - {axis: fiscal.sectoral_subsidy, direction: "mixed", magnitude: weak, intended: true, rationale: "Commercial state participation is to fall while industrial diversification and strategic investment remain state priorities."}
references:
  - "President of Kazakhstan, 2024 State of the Nation Address: https://mirror.akorda.kz/en/president-kassym-jomart-tokayevs-state-of-the-nation-address-just-kazakhstan-law-and-order-economic-growth-social-optimism-482433"
  - "President of Kazakhstan, economic liberalisation and competition priorities: https://mirror.akorda.kz/en/president-kassym-jomart-tokayevs-state-of-the-nation-address-181857"
notes: "This codes the announced policy package; it does not assume each deregulatory measure was completed."
