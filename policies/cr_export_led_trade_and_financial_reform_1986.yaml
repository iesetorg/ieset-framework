# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cr_export_led_trade_and_financial_reform_1986
status: candidate
title: "Export-led growth, trade opening, and financial reform"
countries: [CRI]
timeframe: {start: 1986, end: 2006}
description: >
  From the mid-1980s Costa Rica promoted non-traditional exports and foreign
  investment, cut average tariffs, joined GATT, removed most import licences
  and quotas, and opened interest-rate and credit allocation regimes. The
  reforms reduced anti-export bias and encouraged private-sector activity;
  they unfolded gradually and did not privatize the whole public sector or
  replace the country's social model.
enacted_by: [costa_rica_export_led_reform_and_opening_1986_2006]
coalition_label_at_enactment: "Alternating democratic administrations"
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: strong, rationale: "Tariffs were substantially reduced, GATT membership began in 1989, and most import licences and quotas were removed from 1990 onward.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Export-processing zones, private banking, and increased foreign investment expanded private-market activity.", intended: true}
  - {axis: regulatory.financial_deregulation, direction: "+", magnitude: moderate, rationale: "Interest-rate controls and directed credit allocation were relaxed, and private banks gained a larger role.", intended: true}
references:
  - "World Bank, Costa Rica economic reforms and export-led growth: https://documents1.worldbank.org/curated/en/433001468023660146/pdf/36180.pdf"
  - "WTO, Costa Rica 2007 Trade Policy Review: https://www.wto.org/english/tratop_e/tpr_e/tp282_e.htm"
