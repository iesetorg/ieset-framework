# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: lao_new_economic_mechanism_1986
status: candidate
title: Lao PDR New Economic Mechanism
countries: [LAO]
timeframe: {start: 1986, end: 1997, enacted_date: "1986-11-01"}
description: >
  The New Economic Mechanism abandoned central planning in favour of broad price
  liberalisation, exchange-rate unification, removal of the state trade monopoly,
  opening of domestic and international trade, entry for private firms, and greater
  autonomy for family farms. State enterprises were reduced while the ruling party
  retained political control and strategic oversight.
enacted_by: [laos_new_economic_mechanism_transition_1987_1997]
coalition_label_at_enactment: Lao People's Revolutionary Party government
axes_moved:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: strong, intended: true, rationale: "Private firms and family farms were allowed to operate as administered prices and central allocation were reduced."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "The state trade monopoly was removed and cross-border trade opened."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, intended: true, rationale: "The state enterprise footprint was reduced as the economy shifted toward private activity."}
references:
  - "World Bank, Lao PDR economic transition and growth: https://documents1.worldbank.org/curated/en/250731468277466031/pdf/317640corr.pdf"
notes: "Adoption was in 1986; the linked movement begins in 1987 to avoid implying immediate full implementation."
