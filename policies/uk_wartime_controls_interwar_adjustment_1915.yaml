# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_wartime_controls_interwar_adjustment_1915
status: candidate
title: UK wartime mobilisation, interwar adjustment and renewed wartime controls
countries: [GBR]
timeframe: {start: 1915, end: 1944, enacted_date: "1915-01-01"}
description: >
  The First and Second World Wars expanded government direction of production, labour,
  materials, and procurement. Between wars, the UK returned to market coordination and
  pursued fiscal and monetary adjustment. The period therefore contains distinct
  expansions and contractions of public direction rather than one sustained policy.
enacted_by: [uk_wartime_planning_and_interwar_adjustment_1915_1944]
coalition_label_at_enactment: Successive wartime and interwar governments
axes_moved:
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: strong, intended: true, rationale: "Wartime spending surged and peacetime adjustment reduced it."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, intended: true, rationale: "War controls expanded and later receded before renewed mobilisation in 1939."}
references:
  - "UK Parliament, Post-War Reconstruction debate (1943): https://hansard.parliament.uk/commons/1943-12-07/debates/25243630-b603-45f3-a497-bd715cce0ea9/Post-WarReconstruction"
notes: "This dated policy overview summarises a sequence; separate years are not treated as one continuous implementation."
