# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_civil_code_1804
status: candidate
title: French Civil Code promulgated
countries: [FRA]
timeframe:
  start: 1804
  end: 1804
  enacted_date: "1804-03-21"
description: >
  The Civil Code consolidated civil law nationally in 36 laws and 2,281
  articles covering persons, property, and ownership. It unified law across
  regions but entrenched male authority within the family and did not make
  political rights democratic.
enacted_by:
  - fr_consulate_empire_legal_state_1799_1815
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: National civil codification reduced regional legal pluralism, though the Code preserved substantial gender hierarchy and the regime was not democratic.
references:
  - "French National Assembly, 1804-1810 — Legal codification: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/consulat-et-premier-empire/la-codification-juridique"
notes: Candidate coding of legal unification, not a general endorsement of Napoleonic rule or the Code's unequal provisions.
