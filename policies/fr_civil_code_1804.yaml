# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_civil_code_1804
status: candidate
title: French Civil Code consolidated in 1804
countries: [FRA]
scope: national
timeframe:
  start: 1804
  enacted_date: '1804-03-21'
description: >
  The law of 30 Ventose Year XII consolidated 36 previously adopted civil-law
  measures into the French Civil Code on 21 March 1804. It set a national
  framework for persons, property, and ownership and displaced Roman law,
  royal ordinances, and local custom in matters covered as the component laws
  became executable. The code retained unequal family status, including male
  authority over married women; this record makes no claim of universal legal
  equality, independent courts, or a measured economic outcome.
enacted_by: [fr_consulate_civil_codification_1804]
axes_moved:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  intended: true
  rationale: >
    Replacing regional civil-law pluralism with a published national code
    supports a narrow improvement in formal legal uniformity and predictability.
    The weak tag does not claim stronger judicial independence or equal
    treatment in family law.
references:
- 'French National Assembly, legal codification under the Consulate and Empire: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/consulat-et-premier-empire/la-codification-juridique'
- 'French National Assembly, original law consolidating the Civil Code, 30 Ventose Year XII: https://www.assemblee-nationale.fr/evenements/code-civil/cc1804-loi.pdf'
- 'French National Assembly, parliamentary report on gender equality and the 1804 Civil Code: https://www.assemblee-nationale.fr/11/rapports/r1240.asp'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The consolidation law is dated 21 March 1804. Its component civil laws had
  their own dates of executory force, so this record does not assign a single
  effective date to every provision. It is a candidate legal-content coding,
  not a measured rule-of-law or welfare outcome. The archived origin/main
  policy's moderate magnitude was reduced to weak.
