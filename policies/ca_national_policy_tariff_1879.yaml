# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ca_national_policy_tariff_1879
status: candidate
title: Macdonald National Policy protective tariff
countries: [CAN]
timeframe: {start: 1879, end: 1896}
description: >
  The 1879 budget introduced a protective tariff intended to raise federal
  revenue and shelter selected Canadian manufacturing from foreign competition.
  The measure became the tariff element of John A. Macdonald's National Policy;
  this record does not treat the railway and immigration components as part of
  the tariff's measured effect.
enacted_by: [canada_national_policy_1879_1896]
axes_moved:
  - axis: regulatory.trade_openness
    direction: "-"
    magnitude: moderate
    intended: true
    rationale: The tariff raised duties on selected imports, reducing openness to those goods while retaining trade for revenue and supply.
references:
  - "House of Commons of Canada, Budget speech, 14 March 1879: https://lop.parl.ca/staticfiles/ParlInfo/Documents/Budgets/En/1879-03-14.pdf"
  - "John H. Young, Canadian Commercial Policy, Royal Commission on Canada's Economic Prospects (1957): https://publications.aws.tpsgc-pwgsc.cloud-nuage.canada.ca/site/eng/9.894071/publication.html"
notes: "Candidate historical coding; the tariff's distributional and industrial effects are not inferred from its stated purpose."
