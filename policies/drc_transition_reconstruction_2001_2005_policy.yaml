# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: drc_transition_reconstruction_2001_2005_policy
status: candidate
title: DRC peace-process reconstruction and economic liberalisation
countries: [COD]
timeframe: {start: 2001, end: 2005}
description: >
  The interim programme launched in 2001 sought to restore peace, reduce
  hyperinflation, unify exchange rates, liberalise prices and trade, and
  establish a more predictable environment for private activity. The later
  reconstruction programme linked economic reform with political reunification,
  inter-Congolese dialogue, and preparation for national elections.
enacted_by: [drc_transition_reconstruction_2001_2005]
scope: national
coalition_label_at_enactment: Joseph Kabila government and transitional authorities
axes_moved:
  - {axis: monetary.central_bank_independence, direction: +, magnitude: moderate, intended: true, rationale: Monetary reform and reduced deficit financing supported disinflation.}
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, intended: true, rationale: Exchange unification and price and trade liberalisation opened formal market channels.}
references:
  - "IMF, DRC 2001 Enhanced Interim Program: https://www.imf.org/external/np/loi/2001/cod/01/index.htm"
  - "IMF, DRC 2002 reconstruction programme: https://www.imf.org/external/np/loi/2002/cod/02/index.htm"
notes: "Formal reforms were implemented unevenly across a large country with continuing armed conflict."
