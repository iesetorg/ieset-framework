  enacted_date: '1957-07-26'
  effective_date: '1957-08-01'
description: >-
  The Bundesbank Act was signed on 26 July 1957 and entered into force on
  1 August 1957. It merged the Bank deutscher Länder and the Land central
  banks into the Deutsche Bundesbank and made the new institution independent
  of federal-government instructions. The Bank deutscher Länder had already
  been independent of German political authorities since its 1948 founding.
  This record concerns statutory continuity, not a second country-map step.
