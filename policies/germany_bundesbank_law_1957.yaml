  enacted_date: '1957-07-26'
  effective_date: '1957-08-01'
description: >-
  The Bundesbank Act was signed on 26 July 1957 and entered into force on
  1 August 1957. It merged the Bank deutscher Länder and the Land central
  banks into the Deutsche Bundesbank and established a central bank independent
  of federal-government instructions. This record concerns the statutory
  institution and its legal independence, not later inflation or growth results.
