policy_id: ie_future_ireland_fund_2024
status: candidate
title: Ireland's Future Ireland and Infrastructure funds (2024 Act)
countries:
- IRL
timeframe:
  start: 2024
  end: ongoing
  enacted_date: '2024-06-18'
description: >
  The Future Ireland Fund and Infrastructure, Climate and Nature Fund Act
  2024 established two long-term state savings vehicles managed by the NTMA.
  The funds had been proposed in Budget 2024; the Act was enacted on 18 June
  2024 and their principal establishment provisions were commenced on 30
  July. Contributions move Exchequer resources into state financial assets.
  The record does not infer an increase in current spending, corporation-tax
  rates, welfare transfers, or labour-market regulation from that asset move.
enacted_by:
- ireland_harris_fg_2024_present
references:
