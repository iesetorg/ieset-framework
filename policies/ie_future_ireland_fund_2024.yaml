linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Budget 2024 proposed the funds under Varadkar; enactment and commencement
  occurred during Harris's Taoiseach term. Later contributions are separate
  cash-flow decisions and are not scored here without fiscal classification.
