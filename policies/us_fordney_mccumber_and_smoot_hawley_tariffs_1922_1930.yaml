policy_id: us_fordney_mccumber_and_smoot_hawley_tariffs_1922_1930
status: candidate
title: United States Fordney–McCumber and Smoot–Hawley tariff acts
countries: [USA]
timeframe: {start: 1922, end: 1930, enacted_date: "1930-06-17"}
description: >
  Congress raised protective tariffs with the Fordney–McCumber Act of 1922 and again
  with the Smoot–Hawley Act of 1930. These measures formed part of the postwar turn
  away from lower tariff policy and increased barriers to imported goods during the
  early Great Depression.
enacted_by: [us_postwar_republicanism_and_early_depression_1918_1932]
coalition_label_at_enactment: Republican congressional majorities and Hoover administration
axes_moved:
  - {axis: regulatory.trade_openness, direction: "-", magnitude: strong, intended: true, rationale: "Higher tariffs increased barriers to imported goods and prompted trade retaliation concerns."}
references:
  - "U.S. State Department, Protectionism 1921–1936: https://history.state.gov/milestones/1921-1936/protectionism"
  - "U.S. Department of Labor, 1920s and start of the Depression: https://www.dol.gov/general/aboutdol/history/dolchp02"
notes: "This record concerns the protectionist tariff direction; it does not attribute the Great Depression to tariffs alone."
