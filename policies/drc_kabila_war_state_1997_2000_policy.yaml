policy_id: drc_kabila_war_state_1997_2000_policy
status: candidate
title: DRC regime change and renewed Congo war
countries: [COD]
timeframe: {start: 1997, end: 2000}
description: >
  Laurent-Désiré Kabila's forces captured Kinshasa in 1997, ended the Mobutu
  government, and renamed the country the Democratic Republic of the Congo. A
  new rebellion began in 1998, leading to a regional war, foreign military
  intervention, and severe disruption of state administration and economic
  activity across much of the country.
enacted_by: [drc_kabila_war_state_1997_2000]
scope: national
coalition_label_at_enactment: Alliance of Democratic Forces for the Liberation of Congo
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: Armed regime change and renewed war undermined stable legal and political authority.}
  - {axis: regulatory.sectoral_licensing, direction: +, magnitude: moderate, intended: false, rationale: Wartime competition over mineral access concentrated and politicised control of resource flows.}
references:
  - "UN MONUC, mission background: https://peacekeeping.un.org/sites/default/files/past/monuc/background.shtml"
notes: "Resource control was contested by state and non-state forces and varied regionally."
