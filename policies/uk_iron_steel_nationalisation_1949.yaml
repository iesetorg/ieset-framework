policy_id: uk_iron_steel_nationalisation_1949
status: candidate
title: Iron Steel Nationalisation 1949
countries:
- GBR
timeframe:
  start: 1951
  end: 1951
  enacted_date: '1949-11-24'
  effective_date: '1951-02-15'
description: >-
  The Iron and Steel Act 1949 established the Iron and Steel Corporation of
  Great Britain and provided for the transfer of specified company securities
  to it. The general transfer to public ownership occurred on 15 February
  1951. Part III also required licences for covered iron and steel activities
  carried on by businesses outside the Corporation, beginning three months
  after the general transfer. The 1953 Act ended the 1949 framework on
  13 July 1953; that reversal is a separate decision.
