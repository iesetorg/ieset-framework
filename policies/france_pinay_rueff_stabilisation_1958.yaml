policy_id: france_pinay_rueff_stabilisation_1958
status: candidate
title: France Pinay-Rueff Stabilisation 1958
countries:
- FRA
timeframe:
  start: 1958
  end: 1960
description: >-
  The Pinay-Rueff programme was prepared in late 1958 and implemented through
  several monetary, budget, tax, and trade measures. A 27 December 1958
  ordinance provided for devaluation, convertibility, and a new monetary
  unit; ordinances at the end of December implemented much of the budget and
  trade programme. The new franc entered use on 1 January 1960.
enacted_by:
- france_trente_glorieuses_indicative_planning_1945_1975
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  intended: true
  rationale: The December 1958 programme liberalised external trade, as documented in the French finance ministry's Pinay cabinet archive.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
references:
- https://www.economie.gouv.fr/files/files/directions_services/saef/docs_joints/rech_en_arch/Ministres/CabPinay_B-0068964_B_0068976_1A-0000409_1A-0000452.pdf
- https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000339269
- https://www.legifrance.gouv.fr/loda/id/LEGIARTI000006725763/1959-12-23
notes: >-
  This is a multi-instrument programme with different legal and application
  dates; no single enacted_date or effective_date represents the whole bundle.
  The prior 1945-1975 timeframe was the parent movement, not this programme.
  The former licensing, subsidy, and spending scores bundled unrelated or
  opposite-direction measures and are withheld. The trade axis captures the
  documented liberalisation, without assigning a pre-1958 movement drift step.
