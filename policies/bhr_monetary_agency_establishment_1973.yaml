policy_id: bhr_monetary_agency_establishment_1973
status: candidate
title: Bahrain Monetary Agency begins central banking and regulation
countries:
- BHR
timeframe:
  start: 1973
  end: 1973
description: Bahrain established the Bahrain Monetary Agency in 1973 to carry out central banking and
  financial regulatory functions. The present central bank identifies the agency as its institutional
  predecessor. This record documents the establishment year; it does not project the current bank's full
  statutory powers back to 1973.
scope: national
references:
- 'Central Bank of Bahrain, institutional background: https://careers.cbb.gov.bh/'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
