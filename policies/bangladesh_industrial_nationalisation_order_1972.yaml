policy_id: bangladesh_industrial_nationalisation_order_1972
status: candidate
title: Bangladesh Industrial Enterprises (Nationalisation) Order 1972
countries: [BGD]
timeframe:
  start: 1972
  enacted_date: "1972-03-26"
description: >
  President's Order No. 27 provided for nationalisation of scheduled industrial
  enterprises and established corporations to control, supervise and coordinate
  nationalised and other enterprises, as well as to develop new industrial
  enterprises. It applied throughout Bangladesh and took effect immediately.
enacted_by: [bangladesh_post_independence_nationalisation_1972_1981]
axes_moved:
  - axis: regulatory.product_market_competition
    direction: "-"
    magnitude: strong
    intended: true
    rationale: The order vested scheduled private industrial enterprises in government ownership and placed them under public corporations.
references:
  - "Bangladesh Industrial Enterprises (Nationalisation) Order, 1972, President's Order No. 27: https://bdlaws.minlaw.gov.bd/act-print-378.html"
