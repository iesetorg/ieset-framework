policy_id: ie_oecd_pillar2_agreement_2021
status: candidate
title: Ireland joins OECD Pillar 2 agreement in principle (2021)
countries:
- IRL
timeframe:
  start: 2021
  end: 2021
description: >
  In October 2021 Ireland joined the OECD/G20 Inclusive Framework political
  agreement on a 15% global minimum effective tax for in-scope multinational
  groups. The statement did not itself change domestic corporation tax law.
  Ireland enacted Pillar 2 through Finance (No.2) Act 2023, recorded separately
  as ie_oecd_pillar2_corporate_tax_2024.
enacted_by:
- ireland_martin_ff_rotating_2020_2022
references:
