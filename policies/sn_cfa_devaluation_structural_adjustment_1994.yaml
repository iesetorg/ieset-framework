# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: sn_cfa_devaluation_structural_adjustment_1994
status: candidate
title: "CFA devaluation and structural adjustment"
countries: [SEN]
timeframe: {start: 1994, end: 2000}
description: >
  Following the zone-wide 50 percent CFA-franc devaluation in January 1994,
  Senegal adopted fiscal restraint, tariff simplification, price and trade
  liberalization, public-enterprise restructuring and privatization, and
  measures intended to expand private investment. The reform package was
  implemented under the Diouf government and continued through the 2000
  transition; implementation varied by sector.
enacted_by: [senegal_diouf_adjustment_1994_2000]
coalition_label_at_enactment: "Socialist Party government under Abdou Diouf"
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Tariffs were simplified and reduced and most import and export licenses were removed.", intended: true}
  - {axis: regulatory.price_control_intensity, direction: "-", magnitude: moderate, rationale: "Price controls were lifted across many consumer and producer markets after the 1994 adjustment.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Price controls were lifted and public enterprises restructured or privatized to reduce direct state participation in commercial activity.", intended: true}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "The program targeted deficit reduction and public-sector cost control; this codes intended restraint rather than a measured net spending outcome.", intended: true}
references:
  - "IMF, Senegal Policy Framework Paper 1998-2000: https://www.imf.org/external/np/pfp/senegal/seng-01.htm"
  - "IMF and IDA, Senegal HIPC Decision Point: https://www.imf.org/external/np/hipc/2000/sen/index.htm"
