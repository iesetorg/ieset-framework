policy_id: be_nbb_monetary_autonomy_law_1993
status: candidate
title: Belgian National Bank monetary autonomy law 1993
countries: [BEL]
timeframe:
  start: 1993
  end: 1993
  enacted_date: '1993-03-22'
description: >
  Belgium's law of 22 March 1993 removed the finance minister's veto over
  National Bank monetary-policy decisions and restricted state suspension
  and opposition powers to legal or statutory violations. The change
  strengthened national monetary autonomy before the later 1998 ESCB statute.
enacted_by: [belgium_dehaene_cvp_1992_1999]
coalition_label_at_enactment: CVP/PSC-SP/PS
axes_moved:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: strong
    rationale: Removed ministerial veto over national monetary-policy decisions.
references:
  - https://www.nbb.be/doc/ts/publications/nbbreport/archives/nbb1993ar.ihqc.pdf
  - https://www.ecb.europa.eu/pub/pdf/annrep/ar1994en.pdf
