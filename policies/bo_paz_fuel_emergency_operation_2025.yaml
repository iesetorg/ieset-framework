# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bo_paz_fuel_emergency_operation_2025
status: candidate
title: Bolivia's December 2025 fuel price and supply decree (DS 5503)
countries: [BOL]
timeframe:
  start: 2025
  end: 2026
  enacted_date: '2025-12-17'
  effective_date: '2025-12-17'
description: >-
  Decree Supreme 5503 of 17 December 2025 introduced fuel price and supply
  measures. The National Hydrocarbons Agency records new domestic prices from
  17 December for special gasoline, diesel, premium gasoline and other fuels;
  the hydrocarbons ministry described changes to reference prices and the
  refinery, transport, wholesale and retail margins. This entry records the
  decree's fuel provisions and their implementation, not the entire decree's
  separate tax, investment, labour or social provisions. Decree 5516 of
  13 January 2026 abrogated DS 5503 and set a successor fuel-price framework.
enacted_by:
  - bolivia_rodrigo_paz_pdc_2025_present
evaluation_design:
  event_dates:
    - '2025-12-17 DS 5503 dated and fuel prices changed, according to ANH'
    - '2026-01-13 DS 5516 abrogated DS 5503; successor framework is separate'
  notes: >-
    The 2025 start and 2026 end describe this decree's legal episode only.
    Continued prices under DS 5516 are not credited to an ongoing DS 5503.
    There is no estimate of supply, fiscal, welfare or price effects.
references:
  - https://dgsc.gob.bo/DS5503-2025.pdf
  - https://www.anh.gob.bo/InsideFiles/Documentos/Documentos_Id-1345-260304-0604-0.pdf
  - https://www.mhe.gob.bo/2025/12/18/gobierno-y-el-municipio-de-potosi-firman-convenio-para-modernizar-el-alumbrado-publico-con-tecnologia-led-y-sistemas-inteligentes/
  - https://www.impuestos.gob.bo/wp-content/uploads/2026/01/RND-102600000001.pdf
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  This is a dated legal and administrative event only. The successor decree
  and any outcomes require separate evidence. No axis, hypothesis, causal,
  policy-performance or school-score credit is assigned by enactment.
