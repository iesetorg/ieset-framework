# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: bo_paz_fuel_emergency_operation_2025
status: candidate
title: Bolivia's December 2025 fuel price and supply decree (DS 5503)
countries: [BOL]
timeframe:
  start: 2025
  end: 2026
  enacted_date: '2025-12-17'
  effective_date: '2025-12-18'
description: >-
  Decree Supreme 5503 of 17 December 2025 introduced fuel price and supply
  measures. The National Hydrocarbons Agency's 18 December resolution set
  Gasolina Especial + at Bs 6.96/l, Super Etanol 92 at Bs 8.28/l, and Diesel
  Oil + at Bs 9.80/l; its public price table lists these prices as effective
  from 18 December. The hydrocarbons ministry described changes to reference
  prices and the refinery, transport, wholesale and retail margins. This entry
  records the decree's fuel provisions and their implementation, not the
  decree's separate tax, investment, labour or social provisions. Decree 5516
  of 13 January 2026 abrogated DS 5503 and set a successor fuel-price framework.
enacted_by:
  - bolivia_rodrigo_paz_pdc_2025_present
evaluation_design:
  event_dates:
    - '2025-12-17 DS 5503 dated; Article 121 ties legal force to Gazette publication'
    - '2025-12-18 ANH resolution 0789/2025 set and public table dates listed retail fuel prices'
    - '2026-01-13 DS 5516 abrogated DS 5503; successor framework is separate'
  notes: >-
    Effective_date codes the first documented application of the listed retail
    fuel prices, not the decree's legal entry into force. Article 121 makes legal
    force contingent on Gazette publication; the ANH retrospective 2025 report
    says the decree entered force on 17 December, but its product-specific public
    table and resolution 0789/2025 date the listed retail prices to 18 December.
    The public table dates premium gasoline to 2 December and does not support
    coding its price as a new 18 December retail change. The 2025 start and 2026
    end describe this decree's episode only; continued prices under DS 5516 are
    not credited to DS 5503. No supply, fiscal, welfare or price effect is estimated.
references:
