  - https://www.anh.gob.bo/w2019/contenido.php?Y=2025&s=13
  - https://www.impuestos.gob.bo/wp-content/uploads/2026/01/RND-102600000001.pdf
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  This is a dated legal and administrative event only. The successor decree
  and any outcomes require separate evidence. No axis, hypothesis, causal,
