policy_id: nz_fast_track_approvals_act_2024
status: candidate
title: Fast-track Approvals Act 2024
countries:
- NZL
timeframe:
  start: 2024
  end: ongoing
  enacted_date: '2024-12-23'
  effective_date: '2024-12-24'
  treatment_onset_unresolved: true
description: >
  The Act established a national alternative approvals process for projects with
  significant regional or national benefits. It allows ministerial referral and
  expert-panel consideration of approval applications under several existing
  statutes. The Act received Royal Assent on 23 December 2024 and commenced the
  next day; the application service opened on 7 February 2025. Individual
  projects enter the process and receive decisions on different dates.
