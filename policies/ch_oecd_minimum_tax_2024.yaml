# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_oecd_minimum_tax_2024
status: candidate
title: Swiss OECD/G20 corporate minimum top-up tax (2024)
countries: [CHE]
timeframe:
  start: 2024
  end: ongoing
description: >
  Following a June 2023 constitutional referendum, Switzerland introduced a
  domestic supplementary tax in January 2024 for large multinational groups
  with annual turnover of at least EUR 750 million. Where an affected group's
  calculated effective Swiss tax rate is below 15 percent, a domestic top-up
  tax applies under the OECD rules, which include a substance carve-out. An
  international income-inclusion rule took effect in January 2025;
  the 2024 measure was the domestic component of the minimum-tax framework.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
axes_moved:
  - axis: fiscal.tax_corporate
    direction: '+'
    intended: true
    rationale: >
      The domestic top-up tax raises the corporate tax burden for covered
      profits calculated to fall below the minimum rate, subject to the rules'
      substance carve-out.
evaluation_design:
  event_dates:
    - '2024-01-01 domestic supplementary tax effective'
    - '2025-01-01 international income-inclusion rule effective'
  notes: >
    The Federal Council decided on the ordinance in December 2023. Domestic
    and international components have different effective dates and should
    be evaluated separately.
references:
  - https://www.efd.admin.ch/en/implementation-oecd-minimum-tax-rate-switzerland
  - https://www.estv.admin.ch/en/top-up-tax
