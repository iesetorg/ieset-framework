policy_id: cz_pension_age_extension_2024
status: candidate
title: Czech retirement-age extension enacted in 2024
countries: [CZE]
timeframe:
  start: 2025
  end: ongoing
  enacted_date: '2024-12-04'
  effective_date: '2025-01-01'
description: >
  Act No. 417/2024 Coll. amended the public pension-age schedule, phasing
  retirement ages upward by birth cohort and setting age 67 for people born
  after 1988. The measure replaces the prior age-65 ceiling for affected
  cohorts. Its legal commencement in 2025 precedes most actual retirement
  and expenditure effects, which depend on cohort eligibility years.
enacted_by:
  - czech_republic_fiala_spolu_2021_2025
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: '-'
    magnitude: weak
    intended: true
    rationale: Later eligibility reduces the scheduled duration of old-age pension payments for affected future cohorts.
references:
  - https://e-sbirka.gov.cz/sb/2024/417/2025-09-01?zalozka=historie
  - https://www.mpsv.cz/cms/documents/2584bb0f-a202-3232-51af-1edf427b6df0/TZ_12_12_2024_Nov%C3%BD%2Brok_legislativn%C3%AD_p%C5%99ehled.pdf
notes: >
  The statute is dated 4 December 2024, was published 18 December 2024,
  and generally took effect on 1 January 2025. The movement's former
  2023 policy reference described a proposal year, not this enactment.
