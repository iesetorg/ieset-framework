# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_charter_revised_1830
status: candidate
title: Revised Constitutional Charter of 1830
countries: [FRA]
timeframe:
  start: 1830
  end: 1830
  enacted_date: "1830-08-14"
description: >
  The revised Charter after the July Revolution recognized national sovereignty
  more explicitly, shared legislative initiative between the chambers and the
  king, and advanced parliamentary practice. The electorate remained
  tax-qualified and very small.
enacted_by:
  - fr_restoration_july_monarchy_1814_1848
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    intended: true
    rationale: The revised charter removed the prior royal claim to unilaterally grant the constitution and strengthened parliamentary roles, but maintained a narrow censitary electorate.
references:
  - "French National Assembly, Revised Charter of 1830: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/monarchie-de-juillet/la-charte-constitutionnelle-revisee"
notes: Candidate coding of parliamentary and sovereignty changes under a limited franchise.
