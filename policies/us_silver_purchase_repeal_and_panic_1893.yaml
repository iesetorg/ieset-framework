policy_id: us_silver_purchase_repeal_and_panic_1893
status: candidate
title: United States repeal of compulsory silver purchases during the Panic of 1893
countries: [USA]
timeframe: {start: 1893, end: 1893, enacted_date: "1893-11-01"}
description: >
  Congress repealed the Sherman Silver Purchase Act's requirement for monthly federal
  silver purchases amid the 1893 financial panic and pressure on Treasury gold reserves.
  The repeal reflected the national political conflict over the monetary standard and
  the federal government's role in supporting currency convertibility.
enacted_by: [us_populist_gold_standard_and_progressive_transition_1891_1900]
coalition_label_at_enactment: Cleveland administration and congressional anti-silver coalition
axes_moved:
  - {axis: monetary.central_bank_independence, direction: "mixed", magnitude: moderate, intended: true, rationale: "The change removed a federal silver-purchase mandate but preserved the Treasury's gold-standard obligations."}
references:
  - "U.S. Department of the Treasury, John G. Carlisle and the 1893 silver repeal: https://home.treasury.gov/about/history/prior-secretaries/john-g-carlisle-1893-1897"
notes: "This record focuses on the 1893 repeal; the Gold Standard Act was enacted in 1900."
