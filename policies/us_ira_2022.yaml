# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_ira_2022
status: candidate
title: Inflation Reduction Act of 2022 — climate, health, and tax provisions
countries:
- USA
timeframe:
  start: 2022
  enacted_date: '2022-08-16'
description: >
  Public Law 117-169 expanded and created clean-energy tax credits and grants,
  with domestic-content and North American assembly conditions for selected
  credits. It also authorised Medicare drug-price negotiation, extended
  Affordable Care Act subsidies, imposed a 15% corporate alternative minimum
  tax on certain book income, and established a 1% stock-repurchase excise.
  Provisions have different later application dates; enactment is neither the
  first payment date nor evidence of an observed economic outcome.
enacted_by:
- biden_ira_chips_2022
- us_biden_administration_broad_2021_2025
coalition_label_at_enactment: Democratic trifecta (Senate tie-break, reconciliation)
axes_moved:
- axis: fiscal.sectoral_subsidy
  direction: +
  magnitude: strong
  intended: true
  rationale: Clean-energy production, investment, and manufacturing credits plus targeted grants expanded sectoral support.
- axis: regulatory.trade_openness
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Domestic-content and North American assembly conditions favour selected domestic or regional inputs; they are not a general tariff increase.
- axis: regulatory.environmental_stringency
  direction: +
  magnitude: weak
  intended: true
  rationale: Clean Air Act program funding expanded enforcement and implementation capacity; the tax credits alone do not impose emissions standards.
- axis: fiscal.tax_corporate
  direction: +
  magnitude: weak
  intended: true
  rationale: The corporate book-income minimum tax and stock-repurchase excise increased selected corporate tax liabilities.
references:
- 'Inflation Reduction Act, Public Law 117-169 (16 August 2022): https://www.congress.gov/117/plaws/publ169/PLAW-117publ169.pdf'
- 'US Department of Energy, domestic-content credit guidance: https://www.energy.gov/policy/articles/president-bidens-investing-america-agenda-boosting-american-manufacturing-and-clean'
- 'US Environmental Protection Agency, Clean Air Act grants under the IRA: https://www.epa.gov/grants/clean-air-act-grants-under-inflation-reduction-act'
- 'Internal Revenue Service, stock-repurchase excise tax: https://www.irs.gov/instructions/i7208'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
