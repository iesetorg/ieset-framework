policy_id: ltu_independence_market_transition_1991_2004_policy
status: candidate
title: Lithuanian independence and market transition, 1991–2004
countries:
- LTU
timeframe:
  start: 1991
  end: 2004
description: World Bank and IMF assessments document the post-independence move from central planning, phased price
  reform, and rapid privatisation beginning in 1991; Lithuania joined the EU in 2004.
enacted_by:
- ltu_independence_market_transition_1991_2004
coalition_label_at_enactment: Successive Lithuanian governments after restoration of independence
axes_moved:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: strong
  intended: false
  rationale: Price liberalisation, private-sector development, and large-scale enterprise privatisation dismantled
    central planning.
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  intended: false
  rationale: Trade and currency reforms redirected the economy toward European markets.
references:
- 'World Bank Lithuania: The Transition to a Market Economy; IMF Lithuania Article IV (1996); European Commission
  Lithuania and the Euro: https://documents.worldbank.org/en/publication/documents-reports/documentdetail/440411468757199694'
- 'World Bank Lithuania: The Transition to a Market Economy; IMF Lithuania Article IV (1996); European Commission
  Lithuania and the Euro: https://www.elibrary.imf.org/view/journals/002/1996/072/article-A001-en.xml'
- 'World Bank Lithuania: The Transition to a Market Economy; IMF Lithuania Article IV (1996); European Commission
  Lithuania and the Euro: https://economy-finance.ec.europa.eu/euro/eu-countries-and-euro/lithuania-and-euro_en'
notes: Broad movement-period proxy; review policy-specific enactment dates before promotion to canonical status.
