policy_id: mlt_central_bank_act_1967
status: candidate
title: Malta enacts the law establishing its central bank
countries:
- MLT
timeframe:
  start: 1967
  end: 1967
  enacted_date: '1967-11-11'
description: Malta enacted its central bank law on 11 November 1967, with the bank formally established
  on 17 April 1968. The legislation provided for the institution and its functions, transferred the former
  Note Security Fund's assets and liabilities, and replaced earlier currency legislation. The law and
  opening are distinguished rather than treated as one imprecise founding date.
scope: national
references:
- 'Central Bank of Malta, A Brief History (50th anniversary publication): https://www.centralbankmalta.org/site/excel/publications/CBM-50-Anniversary-Publication.pdf'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
