policy_id: uk_combination_of_workmen_act_1825
status: candidate
title: UK Combination of Workmen Act 1825 replaces the 1824 settlement
countries: [GBR]
scope: national
timeframe:
  start: 1825
  enacted_date: '1825-07-06'
  effective_date: '1825-07-06'
description: >
  The Act of 6 July 1825 repealed the 1824 Combination of Workmen Act while
  keeping specified earlier anti-combination enactments repealed. It allowed
  workers and employers to meet and agree over the wages or hours they would
  demand or pay, but section III penalised violence, threats, intimidation,
  molestation, and obstruction used to force employment or association choices.
  The record captures this qualified statutory settlement without treating
  all collective action as lawful or measuring subsequent labour outcomes.
references:
- 'Combination of Workmen Act 1825, 6 Geo. 4 c. 129, as enacted, sections I–V: https://www.legislation.gov.uk/ukpga/Geo4/6/129/pdfs/ukpga_18250129_en.pdf'
