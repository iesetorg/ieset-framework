# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cr_stabilization_and_structural_adjustment_1982
status: candidate
title: "Post-crisis stabilization and first structural-adjustment programme"
countries: [CRI]
timeframe: {start: 1982, end: 1985}
description: >
  Following the 1980-82 debt and balance-of-payments crisis, Costa Rica began
  IMF-supported stabilization in 1982 and structural reform from 1983. The
  programme restrained public employment and state-enterprise deficits,
  reduced the fiscal imbalance, and began shifting incentives toward exports.
  Stabilization restored macroeconomic balance, but adjustment was phased and
  the country's social-service settlement remained politically important.
enacted_by: [costa_rica_crisis_stabilization_and_adjustment_1979_1985]
coalition_label_at_enactment: "National Liberation Party government under Luis Alberto Monge"
axes_moved:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "The programme targeted the fiscal imbalance, public wage bill, and state-enterprise losses.", intended: true}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "Export incentives and structural reform began a gradual shift from protected domestic production toward export growth.", intended: true}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, rationale: "Reforms reduced support to some state enterprises while the wider public-service settlement remained.", intended: true}
references:
  - "IMF, Costa Rica recent economic developments: https://www.elibrary.imf.org/view/journals/002/1998/045/article-A002-en.xml"
  - "World Bank, Costa Rica country-assistance evaluation: https://documents1.worldbank.org/curated/en/703151468749950643/pdf/Costa-Rica-Country-assistance-evaluation.pdf"
