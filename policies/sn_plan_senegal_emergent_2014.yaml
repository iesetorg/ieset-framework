# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: sn_plan_senegal_emergent_2014
status: candidate
title: "Plan Sénégal Émergent"
countries: [SEN]
timeframe: {start: 2014, end: 2023}
description: >
  Adopted in 2014, the Plan Sénégal Émergent became the government's
  long-term development framework, with successive priority action plans for
  2014-2018 and 2019-2023. Its stated pillars combine economic transformation
  and growth, social services and protection, sustainable development, and
  governance. This record codes the adopted planning direction, not proof
  that the plan's targets were achieved.
enacted_by: [senegal_sall_emerging_senegal_plan_2012_2024]
coalition_label_at_enactment: "Macky Sall administration / Benno Bokk Yakaar coalition"
axes_moved:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "The national framework coordinates investment around economic transformation and priority sectors, without quantifying net subsidy changes.", intended: true}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "The action plans coordinate public investment and social-service expansion; this records intent rather than a measured net expenditure effect.", intended: true}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Institutional strengthening and governance are explicit pillars of the strategy.", intended: true}
references:
  - "World Bank, Senegal Country Partnership Framework FY20-FY24: https://documents1.worldbank.org/curated/en/608781583719225540/pdf/Senegal-Country-Partnership-Framework-for-the-Period-FY20-FY24.pdf"
