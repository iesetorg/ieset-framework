# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_treasury_federal_reserve_accord_1951
status: candidate
title: Treasury-Federal Reserve Accord
countries: [USA]
timeframe: {start: 1951, enacted_date: '1951-03-04'}
description: >
  The Treasury and Federal Reserve announced an accord separating government
  debt management from the conduct of monetary policy after the wartime and
  postwar interest-rate peg. The agreement gave the Federal Reserve greater
  ability to set monetary policy without maintaining a fixed price for Treasury
  securities. The coding captures the institutional change, not a claim that
  central-bank independence was absolute or politically uncontested.
enacted_by:
  - us_postwar_bipartisan_economic_settlement_1944_1963
axes_moved:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The accord ended the wartime peg and restored scope for monetary policy to respond to inflation independently of routine debt financing.
references:
  - "Joint announcement of the Treasury and Federal Reserve, 1951-03-04"
  - "Federal Reserve History: https://www.federalreservehistory.org/essays/treasury-fed-accord"
