policy_id: fr_non_catholic_civil_status_edict_1787_1788
status: candidate
title: French non-Catholic civil-status edict, 1787–1788
countries: [FRA]
scope: national
timeframe:
  start: 1788
description: >
  The royal edict issued in November 1787 provided forms for non-Catholic
  subjects and resident foreigners to register marriage, birth, and death and
  obtain related civil effects, using specified judges or Catholic clergy. It
  also allowed specified property, succession, trade, and professional rights
  while retaining Catholicism's exclusive public worship and excluding
  non-Catholics from several public offices. The Paris Parlement registered
  the edict on 29 January 1788. This record describes the national royal
  instrument, not uniform local registration or implementation on that day.
references:
- 'Original text of the November 1787 royal edict, Articles I–IV and XXI, reproduced by the Musée protestant: https://museeprotestant.org/wp-content/uploads/2014/01/Edit-du-Roi-de-novembre-1787-Musee-protestant.pdf'
- 'Bibliothèque nationale de France manuscript catalogue, November 1787 edict and Paris Parlement registration on 29 January 1788: https://ccfr.bnf.fr/portailccfr/ark%3A/16871/004D41440037'
- 'French National Assembly chronology, civil status but no public worship freedom or public office: https://www.assemblee-nationale.fr/histoire/eglise-etat/chronologie.asp'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The original edict dates itself only to November 1787. Its Article XXI ties
  the period for regularising earlier marriages to publication and registration
  in the court covering each person's domicile. The precisely documented
  29 January 1788 date is registration in Paris, not an established single
  kingdom-wide effective date; neither enacted_date nor effective_date is
  invented. The 1788 start denotes the first dated registration found for this
  national instrument. This is policy context only, with no movement link,
  signed axis, country-drift step, or tested effect.
