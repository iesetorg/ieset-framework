policy_id: uk_corporation_tax_increase_2023
status: candidate
title: UK Corporation Tax main rate increase to 25% (April 2023)
countries:
- GBR
timeframe:
  start: 2023
  end: ongoing
  enacted_date: '2021-06-10'
  effective_date: '2023-04-01'
description: >-
  Finance Act 2021, enacted on 10 June 2021, set the corporation-tax main rate
  at 25 percent for the financial year beginning 1 April 2023, compared with
  19 percent for the preceding year. A 19 percent small-profits rate applied
  to eligible companies with profits no more than GBP 50,000, with marginal
  relief up to GBP 250,000. The announcement and legislation occurred under
  the Johnson government; the higher rate first applied under the Sunak
  government.
