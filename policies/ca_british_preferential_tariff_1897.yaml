# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ca_british_preferential_tariff_1897
status: candidate
title: Laurier government's British preferential tariff
countries: [CAN]
timeframe: {start: 1897, end: 1911}
description: >
  The Laurier government introduced preferential tariff treatment for British
  goods in 1897 and later widened the preference. It redirected some dutiable
  imports toward Britain but preserved Canada's general customs tariff and
  domestic-industry protection; it was a selective preference rather than
  general free trade.
enacted_by: [canada_laurier_liberal_1896_1911]
axes_moved:
  - axis: regulatory.trade_openness
    direction: mixed
    magnitude: weak
    intended: true
    rationale: Preferential treatment reduced barriers for eligible British goods but maintained and extended tariff discrimination against other origins.
references:
  - "House of Commons of Canada, Budget speech, 14 March 1901 (describes 1897 tariff policy): https://lop.parl.ca/staticfiles/ParlInfo/Documents/Budgets/En/1901-03-14.pdf"
  - "House of Commons of Canada, Budget speech, 29 November 1906 (reports effects and scope of British preference): https://lop.parl.ca/staticfiles/ParlInfo/Documents/Budgets/En/1906-11-29.pdf"
notes: "The direction is coded mixed because the preference altered partner-specific access without removing the protective tariff structure."
