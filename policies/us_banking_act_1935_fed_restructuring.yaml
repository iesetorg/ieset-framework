policy_id: us_banking_act_1935_fed_restructuring
status: candidate
title: Banking Act of 1935 Federal Reserve restructuring
countries: [USA]
scope: national
timeframe:
  start: 1935
  enacted_date: '1935-08-23'
description: >
  Title II of the Banking Act of 1935 reorganized the Federal Reserve Board
  as the Board of Governors, shifted specified powers from regional Reserve
  Banks to the Board, and established the Federal Open Market Committee's
  Board-and-Reserve-Bank voting structure. The statute also removed the
  Treasury Secretary and Comptroller of the Currency from the Board after
  1936. Title I separately made the federal deposit-insurance framework
  permanent. It did not expire when 1999 legislation changed securities
  affiliations under the distinct 1933 Banking Act.
enacted_by:
- us_fdr_new_deal_1933_1939
axes_moved:
- axis: monetary.central_bank_independence
  direction: '+'
  intended: true
  rationale: >
    Removal of Treasury and Comptroller seats from the Board increased formal
    separation from the executive branch. Magnitude is withheld, and greater
    Board authority relative to Reserve Banks is recorded separately from
    independence from fiscal authority.
references:
- 'Banking Act of 1935, ch. 614, 49 Stat. 684, official U.S. Code reference: https://www.govinfo.gov/content/pkg/USCODE-2022-title12/html/USCODE-2022-title12.htm'
- 'Federal Reserve History, Banking Act of 1935: https://www.federalreservehistory.org/essays/banking-act-of-1935'
- 'Federal Reserve History, Federal Open Market Committee: https://www.federalreservehistory.org/essays/federal-open-market-committee'
evaluation_design:
  event_dates:
  - '1935-08-23: Banking Act signed.'
  - '1936-03: Reconstituted FOMC first met under the 1935 law.'
  known_data_gaps:
  - No counterfactual independence, inflation, or bank-stability outcome is attached.
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The policy's former 1933 start and 1999 end were inherited from the
  separate 1933 Banking Act and are removed. This record codes the formal
  governance change only; it does not claim de facto monetary independence,
  tighter bank-entry regulation, or a measured macroeconomic outcome. The
  corresponding 1935 child-policy link in the FDR New Deal movement is
  documentary and does not add an independent numeric country-drift step.
