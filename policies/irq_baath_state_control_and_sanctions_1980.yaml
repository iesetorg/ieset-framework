# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: irq_baath_state_control_and_sanctions_1980
status: candidate
title: "Ba'athist state control, war economy, and sanctions period"
countries: [IRQ]
timeframe: {start: 1980, end: 2003}
description: >
  During late Ba'athist rule, Iraq combined extensive state ownership and
  central planning with prolonged war, then faced international sanctions
  after its 1990 invasion of Kuwait. The sanctions and subsequent Oil-for-Food
  constraints were externally imposed conditions, not domestic liberalizing
  or statist policy choices by Baghdad; this record describes the market/state
  environment and marks that attribution limit explicitly.
enacted_by: [iraq_baath_war_and_sanctions_state_1980_2003]
coalition_label_at_enactment: "Ba'ath Party government under Saddam Hussein"
axes_moved:
  - {axis: institutional.property_rights, direction: "-", magnitude: strong, rationale: "Ba'athist Iraq relied on extensive state ownership and control of productive assets.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, rationale: "Central planning and state control of industry and trade substantially constrained private market allocation.", intended: true}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: strong, rationale: "The 1990-2003 UN sanctions severely constrained external trade; this is an environmental condition imposed internationally, not attributed as a domestic policy choice.", intended: false}
references:
  - "World Bank, Transition to the Market in a Post-Conflict State: Iraq: https://documents1.worldbank.org/curated/en/386761468253198087/pdf/284250English0Transition014014161.pdf"
  - "UN Security Council, Oil-for-Food Programme history: https://www.un.org/depts/oip/backgroundindex.html"
  - "IMF, Iraq Macroeconomic Assessment: https://www.imf.org/external/np/oth/102103.htm"
