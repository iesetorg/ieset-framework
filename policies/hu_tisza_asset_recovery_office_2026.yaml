# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: hu_tisza_asset_recovery_office_2026
status: candidate
title: Hungary National Asset Recovery and Protection Office Act 2026
countries: [HUN]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: '2026-07-28'
  effective_date: '2026-07-29'
description: >-
  Act XXXIV of 2026 establishes Hungary's National Asset Recovery and
  Protection Office to examine suspected unlawful disposal of public assets,
  seek preservation or recovery, and initiate proceedings under statutory
  safeguards. Parliament adopted and promulgated the Act on 28 July 2026;
  its core establishment provisions commenced the next day. Several other
  provisions have staggered later dates. Creation of the legal office is not
  evidence that assets were recovered or that investigations succeeded.
enacted_by:
  - hungary_magyar_tisza_2026_present
evaluation_design:
  event_dates:
    - '2026-07-28 Act XXXIV adopted and promulgated'
    - '2026-07-29 general commencement under section 63(1)'
    - '2026-08-26 and later dates apply to specified exceptions in section 63'
  known_data_gaps:
    - Appointment and operational start of office leadership are separate from statutory commencement.
    - Recovered assets, case outcomes and institutional independence are not measured here.
  notes: >-
    Effective_date codes commencement of the core establishment provisions.
    Section 64 allows up to 30 days after commencement for first leadership
    appointments; actual appointment and recovery are not inferred. No broad
    rule-of-law outcome is coded from enactment alone.
references:
  - https://njt.jog.gov.hu/jogszabaly/2026-34-00-00
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Dated statute only. No observed asset recovery, causal effect, policy
  performance, movement-axis or school-score credit is assigned.
