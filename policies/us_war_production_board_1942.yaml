policy_id: us_war_production_board_1942
status: candidate
title: War Production Board and federal procurement priorities
countries: [USA]
timeframe: {start: 1942, end: 1945, enacted_date: '1942-01-16'}
description: >
  Executive Order 9024 established the War Production Board and authorized it
  to direct federal departments and agencies on war procurement and
  production, including priorities, specifications, conversion, requisitioning,
  plant expansion, and financing. The Board directed industrial capacity and
  scarce materials toward military requirements. It was an emergency wartime
  institution and was terminated after the war.
enacted_by:
  - us_wwii_economic_mobilization_1940_1945
axes_moved:
  - axis: regulatory.product_market_competition
    direction: "-"
    magnitude: moderate
    intended: true
    rationale: Federal production priorities and allocation orders displaced ordinary market allocation for covered materials and industries.
references:
  - "Executive Order 9024 (1942): https://www.presidency.ucsb.edu/documents/executive-order-9024-establishing-the-war-production-board-the-executive-office-the"
