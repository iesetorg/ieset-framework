policy_id: fr_tepa_2007
status: candidate
title: Loi TEPA — Travail, Emploi, Pouvoir d'Achat
countries:
- FRA
timeframe:
  start: 2007
  enacted_date: '2007-08-21'
  treatment_onset_unresolved: true
description: >
  Law no. 2007-1223 of 21 August 2007 introduced income-tax and social-charge
  relief for qualifying overtime pay, changes to inheritance and gift tax,
  a mortgage-interest tax credit, and provisions on the direct-tax cap. The
  overtime relief applied to work performed from 1 October 2007; other fiscal
  provisions had different tax-period and eligibility rules.
enacted_by:
- france_sarkozy_ump_2007_2012
coalition_label_at_enactment: UMP majority
references:
- 'Légifrance, original Law no. 2007-1223, promulgated 21 August 2007 and published 22 August 2007; article 1 XIII sets the overtime start: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000278649'
notes: >
  The law reduced tax and contribution liabilities for specified overtime; it
  did not itself alter the statutory 35-hour threshold. The former labour-
  flexibility axis and its generic overlap links therefore overstated the
  legal change. The fiscal package mixed targeted overtime relief with
  inheritance and tax-cap measures, so its net personal-income-tax
  progressivity is not coded from the law date. Separate tax measures need
  separate treatment definitions.
axes_moved:
- axis: fiscal.tax_capital
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Inheritance-tax relief and direct-tax cap provisions.
