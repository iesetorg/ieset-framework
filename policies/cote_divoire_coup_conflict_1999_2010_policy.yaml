# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cote_divoire_coup_conflict_1999_2010_policy
status: candidate
title: Côte d'Ivoire coup and recurrent armed conflict
countries: [CIV]
timeframe: {start: 1999, end: 2010}
description: >
  A coup in 1999 was followed by a 2002 rebellion, a north-south division, and
  a national-reconciliation process. The disputed 2010 election produced a
  renewed armed crisis. Conflict damaged infrastructure, interrupted normal
  administration, and impaired investment and economic activity before the
  2011 settlement.
enacted_by: [cote_divoire_coup_conflict_1999_2010]
scope: national
coalition_label_at_enactment: Successive military, transitional, and elected authorities
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: "Coups, armed conflict, and disputed election outcomes weakened constitutional government."}
  - {axis: institutional.property_rights, direction: "-", magnitude: moderate, intended: false, rationale: "Conflict and territorial division undermined security and predictable enforcement."}
references:
  - "UN MINUCI background: https://peacekeeping.un.org/sites/default/files/past/minuci/background.html"
  - "World Bank, Côte d'Ivoire Country Economic Memorandum: https://documents1.worldbank.org/curated/en/232621635224063141/pdf/P172646-8cc6a128-c95f-45cb-b9f3-06ce211eff15.pdf"
notes: "This policy-period summary describes institutional disruption rather than a uniform regulatory shift."
