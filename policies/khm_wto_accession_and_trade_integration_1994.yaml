# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: khm_wto_accession_and_trade_integration_1994
status: candidate
title: "WTO accession and trade-integration commitments"
countries: [KHM]
timeframe: {start: 1994, end: 2013}
description: >
  Cambodia applied to join the WTO in 1994, negotiated commitments through
  2003, and became a member in October 2004. Its accession package committed
  the government to transparent publication of laws, limits on unjustified
  quantitative restrictions, non-discriminatory domestic taxes, and WTO
  disciplines for state trading and investment measures, with several
  implementation deadlines extending to 2013. These commitments opened and
  formalized external market rules while leaving substantial domestic state
  direction and enforcement gaps in place.
enacted_by: [cambodia_cpp_state_led_market_integration_1993_2023]
coalition_label_at_enactment: "Cambodian People's Party-led coalition governments"
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Accession bound tariffs and constrained unjustified import restrictions, although Cambodia retained listed export restrictions and tariffs.", intended: true}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Commitments on trading rights, state enterprises, and investment measures established rules for a more contestable market, with uneven domestic implementation.", intended: true}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Transparency and publication duties were part of accession commitments; this records formal rules rather than verified enforcement outcomes.", intended: true}
references:
  - "WTO, Cambodia: What Cambodia has promised: https://www.wto.org/english/thewto_e/acc_e/factsheet_cambodge_e.htm"
  - "WTO, Cambodia membership and accession timeline: https://www.wto.org/english/thewto_e/acc_e/a1_cambodge_e.htm"
