# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: si_euro_adoption_2007
status: candidate
title: Slovenia euro adoption 2007
countries:
- SVN
timeframe:
  start: 2007
  end: ongoing
  enacted_date: '2006-07-11'
  effective_date: '2007-01-01'
description: 'Slovenia adopted the euro on 1 January 2007 after Council Decision 2006/495/EC found that it fulfilled the convergence conditions and abrogated its derogation. The changeover replaced the
  tolar with the euro, moved Slovenian monetary policy into the Eurosystem, and removed exchange-rate conversion costs with euro-area trading partners.

  '
enacted_by: []
coalition_label_at_enactment: SDS-NSi-SLS-DeSUS coalition (Jansa I)
references:
- 'Council Decision 2006/495/EC on adoption by Slovenia of the single currency on 1 January 2007: https://eur-lex.europa.eu/eli/dec/2006/495/oj'
evaluation_design:
  event_dates:
  - '2006-07-11: Council adopted Decision 2006/495/EC.'
  - '2007-01-01: Slovenia adopted the euro and its derogation was abrogated.'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The decision changed currency regime and monetary-policy jurisdiction.
  Conversion costs are not tariffs, non-tariff barriers, or an FTA under the
  trade-openness axis. ECB membership alone does not establish a measured
  change in central-bank independence from fiscal authority. No canonical
  axis is assigned until the relevant institutional change is measured.
