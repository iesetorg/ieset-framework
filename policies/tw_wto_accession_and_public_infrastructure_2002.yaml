policy_id: tw_wto_accession_and_public_infrastructure_2002
status: candidate
title: Taiwan WTO accession and continued public infrastructure investment
countries: [TWN]
timeframe: {start: 2002, end: 2002, enacted_date: "2002-01-01"}
description: >
  Taiwan became a WTO member in January 2002, embedding its trade relationships in
  multilateral rules. This policy is paired with the government's continuing use of
  infrastructure and financial-sector reforms during the period; the trade accession
  date is the primary dated measure represented here.
enacted_by: [taiwan_chen_shui_bian_dpp_government_2000_2008]
coalition_label_at_enactment: Democratic Progressive Party government under Chen Shui-bian
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "WTO membership expanded rules-based access and obligations in the multilateral trading system."}
references:
  - "WTO, Chinese Taipei membership profile: https://www.wto.org/english/thewto_e/countries_e/chinese_taipei_e.htm"
notes: "The wider movement includes other policies and is not represented by this accession record alone."
