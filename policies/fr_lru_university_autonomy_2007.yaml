policy_id: fr_lru_university_autonomy_2007
status: candidate
title: LRU — university autonomy law
countries:
- FRA
timeframe:
  start: 2007
  enacted_date: '2007-08-10'
  treatment_onset_unresolved: true
description: >
  Law no. 2007-1199 of 10 August 2007 reorganised university governance and
  provided for expanded budget and human-resource responsibilities. Its
  expanded-responsibility chapter was to apply to all universities within
  five years of publication, while other provisions took effect when each
  university installed its new board.
enacted_by:
- france_sarkozy_ump_2007_2012
coalition_label_at_enactment: UMP majority
references:
- 'Légifrance, original Law no. 2007-1199, promulgated 10 August 2007 and published 11 August 2007, including articles 43 and 49: https://www.legifrance.gouv.fr/jorf/id/JORFSCTA000000902862'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The previous 2008-2013 implementation phrase exceeded the statute's
  five-year deadline from August 2007. University-specific board and autonomy
  dates remain uncoded. No rule-of-law or product-market-competition movement
  is inferred from governance changes alone, and no outcome is claimed.
