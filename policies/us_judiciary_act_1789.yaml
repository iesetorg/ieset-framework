policy_id: us_judiciary_act_1789
status: candidate
title: Judiciary Act establishes the first federal courts, 1789
countries: [USA]
scope: national
timeframe:
  start: 1789
  enacted_date: '1789-09-24'
description: >
  The First Congress's Judiciary Act created thirteen federal judicial
  districts and provided district and circuit courts alongside the Supreme
  Court. It assigned limited federal trial and appellate jurisdictions,
  including specified review of state-court decisions on federal questions.
  The original districts lay in the eleven states then covered by the new
  federal judiciary; the Act did not establish courts in North Carolina or
  Rhode Island, which had not yet ratified the Constitution.
references:
- 'U.S. Statutes at Large, 1 Stat. 73, ch. 20 (24 September 1789), sections 1-6, 9, 11, and 25: https://wwws.loc.gov/law/help/statutes-at-large/1st-congress/session-1/c1s1ch20.pdf'
- 'U.S. National Archives, enrolled Federal Judiciary Act and transcript: https://www.archives.gov/milestone-documents/federal-judiciary-act'
- 'Supreme Court of the United States, first organized session on 2 February 1790: https://www.supremecourt.gov/about/faq_general.aspx'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The statute was approved on 24 September 1789. Section 3 scheduled the
  first New York and New Jersey district-court sessions for 3 November 1789;
  the first Supreme Court session actually opened on 2 February 1790 after
  a one-day quorum delay. The statute scheduled initial circuit-court
  sessions across districts in April-May 1790. Those staggered operational
  dates do not support a single practical nationwide effective date. This
  policy-only record is distinct from the 4 March constitutional-government
  marker. It carries no authored movement, signed axis, hypothesis link, or
  measured rule-of-law outcome; federal jurisdiction remained limited and
  access and rights were not uniform across states and populations.
