policy_id: uk_victorian_franchise_education_labour_reform_1867
status: candidate
title: "Victorian franchise, public education, and labour reforms"
countries: [GBR]
timeframe: {start: 1867, end: 1884}
description: >
  Between the Second Reform Act of 1867 and the Third Reform Act of 1884,
  Parliament expanded the household franchise, established a national role in
  elementary schooling through locally funded school boards, and recognized
  trade unions in law. These reforms broadened political participation and
  public institutional capacity while the economy remained predominantly
  private and Britain maintained its free-trade orientation.
enacted_by: [uk_victorian_liberal_market_and_reform_1850_1905]
coalition_label_at_enactment: "Alternating Liberal and Conservative governments"
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "Legislation widened the parliamentary franchise and formalized rights of trade-union association.", intended: true}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "The Education Act established public school boards funded by local rates where provision was deficient.", intended: true}
  - {axis: regulatory.labour_market_flexibility, direction: mixed, magnitude: weak, rationale: "Legal recognition of unions strengthened collective organization while leaving bargaining largely outside direct state wage-setting.", intended: true}
references:
