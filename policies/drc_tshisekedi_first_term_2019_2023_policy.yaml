# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: drc_tshisekedi_first_term_2019_2023_policy
status: candidate
title: DRC peaceful transfer and initial Tshisekedi social-infrastructure programme
countries: [COD]
timeframe: {start: 2019, end: 2023}
description: >
  After a peaceful transfer of presidential power in January 2019, the new
  government set out a 100-day programme covering governance, growth, social
  services, and solidarity. The administration launched free basic education
  and infrastructure initiatives and resumed economic engagement with the IMF,
  although coalition arrangements and weak oversight constrained implementation.
enacted_by: [drc_tshisekedi_first_term_2019_2023]
scope: national
coalition_label_at_enactment: Coalition government under Félix Tshisekedi
axes_moved:
  - {axis: institutional.rule_of_law, direction: +, magnitude: weak, intended: true, rationale: The peaceful transfer of power opened a new accountability period but did not itself resolve governance weaknesses.}
  - {axis: fiscal.transfer_expansion, direction: +, magnitude: moderate, intended: true, rationale: Free basic education expanded government-financed services.}
references:
  - "IMF, DRC 2019 Article IV: https://www.elibrary.imf.org/downloadpdf/view/journals/002/2019/285/article-A001-en.pdf"
  - "IMF, DRC 2019 programme: https://www.imf.org/en/news/articles/2019/12/20/na122019five-takeaways-from-the-democratic-republic-of-the-congos-imf-program"
notes: "The coding captures declared programme direction and initial adoption, not full implementation."
