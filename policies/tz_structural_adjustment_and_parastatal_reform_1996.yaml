# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tz_structural_adjustment_and_parastatal_reform_1996
status: candidate
title: Tanzania macroeconomic stabilisation and parastatal reform phase
countries: [TZA]
timeframe: {start: 1996, end: 2015, enacted_date: "1996-01-01"}
description: >
  From 1996, Tanzania accelerated privatisation and restructuring of parastatals,
  financial-sector reform, fiscal stabilisation, agricultural marketing reform, and
  trade integration. The period also included continued public development planning
  and did not remove CCM's dominant political role.
enacted_by: [tanzania_mkapa_kikwete_structural_reform_1995_2015]
coalition_label_at_enactment: CCM government under Benjamin Mkapa
axes_moved:
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, intended: true, rationale: "Parastatal reform and privatisation reduced the direct commercial role of the state."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "Structural reforms developed a market-oriented regulatory framework and expanded private activity."}
references:
  - "World Bank, Yes Africa Can, chronology of Tanzania's economic transformation: https://documents.worldbank.org/en/publication/documents-reports/documentdetail/304221468001788072/yes-africa-can-success-stories-from-a-dynamic-continent"
notes: "Broad period record summarises a long reform phase; not every reform began or ended in 1996 or 2015."
