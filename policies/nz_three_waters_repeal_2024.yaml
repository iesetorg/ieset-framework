description: The Water Services Acts Repeal Act 2024 repealed the Water Services Entities Act
  2022 and two related 2023 Acts, disestablished the Northland and Auckland Water Services Entity,
  and provided transitional arrangements. The Act received Royal assent on 16 February and commenced
  on 17 February 2024. It did not enact the later Local Water Done Well framework or establish
  private competition among water suppliers.
