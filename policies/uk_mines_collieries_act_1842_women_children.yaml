  direction: '-'
  intended: true
  rationale: Employment in the covered underground jobs was legally restricted for the specified
    groups; the sign records the rule's content, not a welfare or employment effect.
references:
- 'Mines and Collieries Act 1842, 5 & 6 Vict. c. 99, original print: https://www.legislation.gov.uk/ukpga/Vict/5-6/99/pdfs/ukpga_18420099_en.pdf'
