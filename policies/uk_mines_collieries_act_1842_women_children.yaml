policy_id: uk_mines_collieries_act_1842_women_children
status: candidate
title: 'Mines and Collieries Act 1842: women and children underground'
countries:
- GBR
scope: national
timeframe:
  start: 1842
  enacted_date: '1842-08-10'
description: The Act restricted underground employment in mines and collieries in the then United
  Kingdom. It phased out women's and girls' underground work, prohibited boys below ten from that
  work subject to the Act's transitional rule, and permitted appointed inspectors to enter mines.
  The final general prohibition on female underground work and the under-ten rule were stated to
  operate from March 1843.
