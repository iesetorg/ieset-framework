policy_id: germany_eec_accession_1957
status: candidate
title: West German founding EEC membership under the Treaty of Rome
countries:
- DEU
timeframe:
  start: 1958
  end: 1958
  signed_date: '1957-03-25'
  effective_date: '1958-01-01'
description: >-
  The Federal Republic of Germany was one of six signatories of the Treaty
  establishing the European Economic Community on 25 March 1957. The Treaty
  applied from 1 January 1958, establishing a customs union and a transition
  toward removing duties and quotas between members, with a common external
  tariff. This record does not attribute export growth, central-bank rules,
  labour bargaining, or later market changes to treaty entry alone.
