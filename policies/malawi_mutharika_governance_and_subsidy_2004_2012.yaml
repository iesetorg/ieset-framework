policy_id: malawi_mutharika_governance_and_subsidy_2004_2012_policy
status: candidate
title: Mutharika-era growth strategy and farm input support
countries:
- MWI
timeframe:
  start: 2004
  end: 2011
description: The period combined macroeconomic growth ambitions and donor-supported reforms with a large
  Farm Input Subsidy Programme that placed the state centrally in smallholder input markets. It also saw
  increasing political centralisation. The mixed policy content makes a simple market/state label misleading.
enacted_by:
- malawi_mutharika_governance_and_subsidy_2004_2012
scope: national
coalition_label_at_enactment: United Democratic Front and Democratic Progressive Party governments
axes_moved:
- axis: fiscal.sectoral_subsidy
  direction: +
  magnitude: strong
  intended: true
  rationale: The Farm Input Subsidy Programme used public resources to lower smallholder input costs.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Political concentration and restrictions on opposition became more pronounced late in the
    period.
- axis: fiscal.spending_level
  direction: +
  magnitude: moderate
  intended: true
  rationale: Large agricultural support and social spending expanded the state’s economic role.
references:
- 'World Bank, Malawi country economic memorandum: https://documents1.worldbank.org/curated/en/473381468270033298/pdf/36862.pdf'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
