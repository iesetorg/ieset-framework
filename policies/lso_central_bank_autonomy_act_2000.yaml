policy_id: lso_central_bank_autonomy_act_2000
status: candidate
title: Lesotho grants greater central bank autonomy in the 2000 Act
countries:
- LSO
timeframe:
  start: 2000
  end: 2000
description: The Central Bank of Lesotho Act came into force in August 2000 and granted the institution
  considerable autonomy according to the bank's historical account. The coding concerns the reported legal
  change in autonomy. It does not establish how much independence the bank exercised in practice or infer
  an inflation or growth effect.
scope: national
references:
- 'Central Bank of Lesotho, Background: https://centralbank.org.ls/background/'
notes: Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated.
axes_moved:
- axis: monetary.central_bank_independence
  direction: +
  magnitude: weak
  intended: true
  rationale: The bank's historical account explicitly reports greater autonomy under the 2000 Act; this
    is de jure institutional coding only.
enacted_by:
- lesotho_central_bank_autonomy_reform_2000
