policy_id: ie_oecd_pillar2_corporate_tax_2024
status: candidate
title: Ireland OECD Pillar 2 15% minimum effective corporate tax (QDMTT, IIR, UTPR)
countries:
- IRL
timeframe:
  start: 2024
  end: ongoing
  enacted_date: '2023-12-18'
description: >
  Finance (No.2) Act 2023 transposed the Pillar 2 global minimum tax into
  Irish law on 18 December 2023. The domestic top-up tax and income inclusion
  rule applied to in-scope fiscal years beginning on or after 31 December
  2023, generally calendar 2024. The undertaxed profits backstop generally
  applied from 31 December 2024, with limited earlier cases. In-scope groups
  have consolidated revenue of at least €750 million; smaller companies
  retain the 12.5% headline corporation-tax rate.
enacted_by:
- ireland_varadkar_fg_2022_2024
coalition_label_at_enactment: FF + FG + Green rotating-Taoiseach coalition (Varadkar as Taoiseach at signing)
axes_moved:
- axis: fiscal.tax_corporate
  direction: +
  magnitude: moderate
  intended: true
  rationale: 15% effective minimum for in-scope MNCs raises the corporate-tax burden above the 12.5% headline that defined the Irish FDI model since 2003.
