policy_id: uk_factories_act_1847_ten_hours
status: candidate
title: 'Factories Act 1847: staged hours limits'
countries:
- GBR
scope: national
timeframe:
  start: 1847
  end: 1848
  enacted_date: '1847-06-08'
  effective_date: '1847-07-01'
description: The Act tightened hours limits for young people under eighteen in the textile factories
  covered by earlier factory legislation, first to eleven hours a day and sixty-three a week from
  July 1847, then to ten hours a day and fifty-eight a week from May 1848. It extended those limits
  to adult women in the same covered factories. It did not impose a general ten-hour day on adult
  men or on all workplaces.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: The law narrowed scheduling options in specified factories for young people and adult
    women; it does not establish the net effect on output or employment.
references:
- 'Factories Act 1847, 10 & 11 Vict. c. 29, original print: https://www.legislation.gov.uk/ukpga/Vict/10-11/29/pdfs/ukpga_18470029_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: The first legal step starts 1 July 1847; the ten-hour step starts 1 May 1848. This is distinct
  from the 1844 extension of existing rules to adult women. Historical GBR denotes the United Kingdom
  jurisdiction of the time, including Ireland before partition; it is not a separate modern IRL
  score. This policy-only entry creates no numeric country-drift step or tested policy-effect claim.
