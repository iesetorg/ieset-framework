# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: lao_asean_wto_and_resource_investment_2011
status: candidate
title: Lao PDR regional integration and state-directed resource investment phase
countries: [LAO]
timeframe: {start: 2011, end: 2020, enacted_date: "2011-01-01"}
description: >
  Laos continued market integration under party-state development plans, with private
  and foreign investment concentrated in hydropower, mining, and infrastructure. WTO
  accession took effect in 2013. Resource concessions and transport projects expanded
  while public borrowing and contingent liabilities became important constraints.
enacted_by: [laos_state_directed_integration_and_resource_development_2011_2020]
coalition_label_at_enactment: Lao People's Revolutionary Party government
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "WTO accession and regional integration increased external market access and obligations."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "State planning and concessions directed investment toward infrastructure and natural resources."}
references:
  - "World Bank, Forging Ahead: Restoring Stability and Boosting Prosperity: https://documents1.worldbank.org/curated/en/099120123031014987/pdf/P17777009e31da0510b2ee090dc949b25e9.pdf"
notes: "Phase-level policy record; WTO membership entered into force in 2013."
