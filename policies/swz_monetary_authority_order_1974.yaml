policy_id: swz_monetary_authority_order_1974
status: candidate
title: Swaziland establishes its monetary authority and introduces the lilangeni
countries:
- SWZ
timeframe:
  start: 1974
  end: 1974
  enacted_date: '1974-03-22'
description: The Monetary Authority of Swaziland was established by the 1974 Order and began operations
  on 1 April. The lilangeni entered circulation on 6 September at parity with the South African rand,
  with both currencies remaining legal tender. The historical jurisdiction was Swaziland, now named Eswatini.
  Currency issuance alone does not establish a change in monetary independence or money-supply growth.
scope: national
references:
- 'Central Bank of Eswatini, History of the Bank: https://www.centralbank.org.sz/about/'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
