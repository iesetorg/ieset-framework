policy_id: singapore_medisave_1984
status: candidate
title: Singapore Medisave 1984
countries:
- SGP
timeframe:
  start: 1984
  end: ongoing
description: 'Medisave was launched in April 1984 as the first pillar of Singapore''s "3M" healthcare financing system, carving a dedicated medical savings account out of the existing CPF contribution framework.
  Workers contribute a percentage of monthly wages to individual Medisave accounts used to pay for hospitalisation, selected outpatient services, and approved insurance premiums.

  '
enacted_by:
- singapore_cpf_forced_saving_architecture_1955
- lky_singapore_founding_1955_1990
references:
- https://www.cpf.gov.sg/member/infohub/educational-resources/from-paper-to-pixels-how-your-cpf-statements-have-changed-over-the-last-70-years
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: "The CPF Board dates the MediSave Account to 1984. The source establishes account creation, not a repeal of tax-funded care, lower spending, or hospital competition effect."
