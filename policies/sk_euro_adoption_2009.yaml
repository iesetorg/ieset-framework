# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: sk_euro_adoption_2009
status: candidate
title: Slovak euro adoption 2009
countries:
- SVK
timeframe:
  start: 2009
  enacted_date: '2008-07-08'
  effective_date: '2009-01-01'
description: >
  Council Decision 2008/608/EC approved Slovakia's adoption of the euro on
  8 July 2008. The euro replaced the Slovak koruna on 1 January 2009, when
  Slovakia's derogation was abrogated. Council Regulation 694/2008 fixed the
  conversion rate at 30.1260 Slovak korunas per euro for that changeover.
enacted_by:
- slovakia_fico_smer_first_term_2006_2010
coalition_label_at_enactment: Smer-SNS-HZDS
references:
- 'Council Decision 2008/608/EC, 8 July 2008: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32008D0608'
- 'Council Regulation (EC) No 694/2008, conversion rate: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32008R0694'
evaluation_design:
  event_dates:
  - '2008-07-08: Council euro-adoption decision and conversion-rate regulation.'
  - "2009-01-01: Euro adoption and abrogation of Slovakia's derogation."
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Currency conversion is not a tariff, non-tariff barrier, or FTA under the
  trade-openness axis. Eurosystem membership alone does not establish a
  measured change or explicitly confirmed neutrality in central-bank
  independence from fiscal authority. No canonical axis is assigned.
