policy_id: mexico_banxico_autonomy_1994
status: candidate
title: Mexico Banco de México autonomy, 1993-1994
countries:
- MEX
timeframe:
  start: 1993
  end: 1994
  enacted_date: '1993-12-23'
  effective_date: '1994-04-01'
description: >-
  The 20 August 1993 constitutional amendment established Banco de México's autonomy,
  price-stability priority, and bar on compelled lending. The Ley del Banco de México,
  published on 23 December 1993, specified its governance and operations and generally
  took effect on 1 April 1994. The legal package created a five-member governing board
  with staggered terms. The constitutional amendment itself entered into force on
  21 August 1993; 1 April 1994 marks implementation under the new organic law.
enacted_by:
- mexico_salinas_nafta_neoliberal_1988_1994
axes_moved:
- axis: monetary.central_bank_independence
  direction: +
  magnitude: weak
  intended: true
  rationale: The constitutional and statutory rules granted de jure autonomy, a price-stability mandate, and protection from ordered government lending; de facto effects require separate measurement.
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
references:
- 'Constitutional amendment, DOF 20 August 1993, Articles 28, 73 and 123 and transitories: https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_126_20ago93_ima.pdf'
- 'Ley del Banco de México, DOF 23 December 1993, original text and Article 1 transitional commencement: https://www.banxico.org.mx/publicaciones-y-prensa/informes-anuales/%7BD133B5DA-B686-7D8D-4C20-5943C0E1F8E6%7D.pdf'
- 'Banco de México account of the 1 April 1994 start of operational autonomy and five-member board: https://www.banxico.org.mx/conociendo-banxico/autonomia-funciones-banco-m.html'
notes: >-
  Consolidates the former mexico_banxico_autonomy_1993 record with this implementation
  record. The constitutional amendment was effective on 21 August 1993, while the new
  bank law generally became effective on 1 April 1994. This record codes the legal
  independence intervention, not proven inflation or growth effects. Earlier generic
  axis-overlap hypothesis links did not test this Mexico reform.
