policy_id: mali_military_regime_and_enterprise_reform_1968_1991_policy
status: candidate
title: Military-led regime and state-enterprise adjustment
countries:
- MLI
timeframe:
  start: 1968
  end: 1990
description: The 1968 coup ended the First Republic. Military-led government restricted political activity
  and later established a single constitutional party. From the 1980s, structural adjustment and public-enterprise
  reform began to reduce the state’s role in some sectors, creating a mixed trajectory of political closure
  and gradual market reform.
enacted_by:
- mali_military_regime_and_enterprise_reform_1968_1991
scope: national
coalition_label_at_enactment: Military government and Democratic Union of the Malian People
axes_moved:
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  intended: true
  rationale: The coup suspended the constitution and political activity was heavily restricted.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  intended: true
  rationale: From 1982, structural-adjustment agreements and public-enterprise reforms began a gradual
    shift toward private activity.
- axis: fiscal.spending_level
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Enterprise restructuring and civil-service reductions sought to reduce the public-sector
    burden.
references:
- 'UN Committee on the Rights of the Child, Mali second periodic report: https://digitallibrary.un.org/record/582290/files/CRC_C_MLI_2-EN.pdf'
- 'IMF, Mali: recent economic developments (1994): https://www.elibrary.imf.org/view/journals/002/1994/011/article-A001-en.xml'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
