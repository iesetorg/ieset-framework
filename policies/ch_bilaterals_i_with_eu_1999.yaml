# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_bilaterals_i_with_eu_1999
status: candidate
title: Switzerland-EU Bilateral Agreements I (1999)
countries: [CHE]
timeframe:
  start: 2002
  end: ongoing
description: >
  Switzerland and the European Union signed seven linked sectoral agreements in
  June 1999 covering free movement of persons, technical barriers to trade,
  public procurement, agriculture, research, air transport, and land transport.
  Swiss voters approved the package in May 2000, and it entered into force in
  June 2002. The agreements expanded reciprocal access to selected European
  markets after Swiss voters rejected membership in the European Economic Area.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
axes_moved:
  - axis: regulatory.trade_openness
    direction: '+'
    intended: true
    rationale: >
      Sectoral agreements reduced technical barriers and expanded reciprocal
      access in agriculture, procurement, and transport markets.
evaluation_design:
  event_dates:
    - '2002-06-01 agreements entered into force'
  notes: >
    The 1999 signature and 2000 referendum were authorization milestones.
    Treatment timing begins at entry into force in June 2002; specific sectors
    still need separate treated and comparison units before causal testing.
references:
  - https://www.europa.eda.admin.ch/en/bilateral-agreements-1-1999
