# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_embargo_act_1807
status: candidate
title: Jefferson administration's Embargo Act
countries: [USA]
timeframe: {start: 1807, end: 1809, enacted_date: "1807-12-22"}
description: >
  Congress prohibited most American ships from departing for foreign ports in
  December 1807, seeking to pressure Britain and France without entering the
  European war. The embargo sharply restricted U.S. external commerce and was
  repealed in March 1809, with replacement restrictions continuing under the
  Non-Intercourse Act.
enacted_by: [us_democratic_republican_governments_1801_1815]
axes_moved:
  - axis: regulatory.trade_openness
    direction: "-"
    magnitude: strong
    intended: true
    rationale: The embargo barred nearly all American ships from foreign ports and sharply reduced external trade until repeal.
references:
  - "Annals of Congress, 12th Congress, account of the 1807 embargo and 1809 repeal: https://www.congress.gov/annals-of-congress/volume-25.pdf"
  - "National Archives, Guide to House Records, embargo and 19th-century trade policy: https://www.archives.gov/legislative/guide/house/chapter-21.html"
notes: "This is a strong temporary restriction on foreign trade; the record does not treat it as a lasting market-regime change."
