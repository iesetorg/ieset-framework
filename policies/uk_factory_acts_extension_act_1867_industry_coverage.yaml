policy_id: uk_factory_acts_extension_act_1867_industry_coverage
status: candidate
title: 'Factory Acts Extension Act 1867: wider manufacturing coverage'
countries:
- GBR
scope: national
timeframe:
  start: 1867
  enacted_date: '1867-08-15'
  effective_date: '1868-01-01'
description: The Act extended earlier factory rules to additional kinds of manufacturing across
  the then United Kingdom, including metal production and foundries, machinery work, paper, glass,
  tobacco, printing, and bookbinding. Section 6 applied incorporated Factory Acts to newly covered
  factories from January 1868, subject to named exclusions and transition provisions. It did not
  make the existing factory rules universal across every workplace.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: The 1868 extension subjected additional covered manufacturers to statutory limits on
    the employment of children, young people, and women; no effect on employment is claimed.
references:
- 'Factory Acts Extension Act 1867, 30 & 31 Vict. c. 103, original print, sections 2-7 and schedule:
  https://www.legislation.gov.uk/ukpga/Vict/30-31/103/pdfs/ukpga_18670103_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: Section 6 supplies the 1 January 1868 date for incorporation of earlier factory rules in
  newly covered premises. The Act also had exceptions and temporary modifications; a one-day universal
  treatment assumption would be false. Historical GBR denotes the United Kingdom jurisdiction of
  the time, including Ireland before partition; it is not a separately scored modern IRL jurisdiction.
  This policy-only record creates no movement, numeric country-drift step, or tested outcome claim.
