  effective_date: '2023-01-04'
  treatment_onset_unresolved: true
description: >
  The Subsidy Control Act 2022 received Royal Assent on 28 April 2022.
  The main domestic subsidy-control regime began on 4 January 2023. It sets
  principles and procedures for public authorities deciding whether to give
  subsidies or make schemes, with transparency, referral and appeal provisions.
  A later subsidy decision is a distinct unit-level event; the Act does not
  by itself establish subsidy volume or economic effects.
