policy_id: tls_ninth_government_productive_sector_social_capital_2023
status: candidate
title: Timor-Leste Ninth Government productive-sector and social-capital programme
countries: [TLS]
timeframe: {start: 2023, end: ongoing}
description: >
  The Ninth Constitutional Government's programme continues the Strategic
  Development Plan through productive-sector and social-capital investment.
  The 2024 budget prioritises economic affairs, infrastructure, agriculture,
  tourism, education, health, and social protection, including petroleum-fund
  transfers above estimated sustainable income. The announced plan seeks to
  invest resource wealth in diversification rather than routine recurrent
  costs, though actual budget execution must be assessed separately.
coalition_label_at_enactment: Ninth Constitutional Government coalition
enacted_by: [timor_leste_petroleum_fund_developmental_planning_2002_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, intended: true, rationale: "The 2024 budget funds large infrastructure, productive-sector, and social-capital priorities with petroleum-fund withdrawals."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "Public investment supports agriculture, tourism, infrastructure, and other productive sectors."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, intended: true, rationale: "The programme funds social protection and inclusion, though the plan does not establish the net transfer change."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, intended: true, rationale: "The government seeks private-sector activity and diversification while maintaining the state as a principal investor."}
references:
  - "Government of Timor-Leste, Ninth Government Programme: https://timor-leste.gov.tl/?lang=en&p=7213"
  - "Government of Timor-Leste, 2024 General State Budget: https://timor-leste.gov.tl/?lang=en&n=1&p=35468"
  - "Government of Timor-Leste, 2027–2030 National Medium-Term Plan: https://timor-leste.gov.tl/?lang=en&n=1&p=52465"
notes: "The source describes programme and budget commitments; public budget execution is often partial and actual effects remain unverified."
