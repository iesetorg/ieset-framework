# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tunisia_post_revolution_transition_and_reform_2011
status: candidate
title: Tunisia post-revolution political transition and economic recovery measures
countries: [TUN]
timeframe: {start: 2011, end: 2021, enacted_date: "2011-01-14"}
description: >
  The revolution ended Ben Ali's rule and initiated competitive elections and a
  constitution-making process. Governments faced a severe 2011 recession, higher
  unemployment, regional disparities, security shocks, and fiscal pressure. The state
  maintained a major role in employment and support while reform agendas sought private
  investment and inclusive growth; implementation was uneven.
enacted_by: [tunisia_post_revolution_transition_2011_2021]
coalition_label_at_enactment: Constituent Assembly and coalition governments
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, intended: true, rationale: "Competitive elections and constitution-making replaced the prior authoritarian order."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "Public employment and transfers expanded in response to social and economic demands."}
references:
  - "IMF, Tunisia 2012 Article IV: https://www.elibrary.imf.org/abstract/journals/002/2012/255/article-A001-en.xml"
  - "IMF, Tunisia 2013 Article IV and post-revolution reforms: https://www.elibrary.imf.org/view/journals/002/2013/161/article-A001-en.xml"
notes: "The record summarises a decade-long transition and is not a claim that one measure remained in force for the full interval."
