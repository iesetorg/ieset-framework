# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: se_hansson_public_works_1933
status: candidate
title: Sweden's 1933 unemployment public-works appropriations
countries: [SWE]
timeframe: {start: 1933}
description: >
  The Hansson minority government proposed expanded state and municipal
  public works as part of its 1933 crisis programme. The Riksdag provided
  appropriations for unemployment-relief works during budget year 1933/34,
  including SEK 3 million for state contingency works and SEK 8.5 million
  for municipal contingency works. These were additional public employment
  and project expenditures, not a transfer programme. The appropriations
  authorize spending; they do not by themselves establish how many jobs
  resulted or the change in total government expenditure as a share of GDP.
enacted_by: [sweden_hansson_crisis_reforms_1933_1935]
coalition_label_at_enactment: Social Democratic minority government with Farmers' League legislative support
axes_moved:
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: weak
    intended: true
    rationale: >
      New 1933/34 public-works appropriations increased planned direct public
      expenditure; the national spending-to-GDP change is unverified.
references:
  - "Riksdag 1933, Special Committee Report No. 17 on unemployment works: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/utlatande/sarskilda-utskottets-utlatande-nr-17_du10s%C3%A4ru17/"
  - "Riksdag 1940, Government Proposition No. 236, historical appropriation table for 1933/34: https://data.riksdagen.se/dokument/E130236"
notes: >
  Code the 1933 budget decision, not an asserted 1933 employment or growth
  outcome. Earlier public works existed; this policy is the documented
  1933/34 expansion.
