policy_id: tw_nuclear_license_renewal_amendment_2025
status: candidate
title: Taiwan's 2025 nuclear reactor license-renewal amendment
countries: [TWN]
timeframe:
  start: 2025
  end: ongoing
  enacted_date: '2025-05-23'
  effective_date: '2025-05-25'
description: >-
  Taiwan amended Article 6 of the Nuclear Reactor Facilities Regulation Act
  on 23 May 2025. The amendment lets a reactor operator apply to renew an
  operating license after the old license has expired, subject to the
  Nuclear Safety Commission's safety review and approval. Maanshan Unit 2,
  Taiwan's last operating nuclear reactor, had shut down on 17 May when its
  forty-year license expired. The amendment created a route to seek later
  operation; it did not itself renew a license or restart a reactor.
evaluation_design:
  event_dates:
    - '2025-05-17 Maanshan Unit 2 operating license expired and unit shut down'
    - '2025-05-23 Article 6 amendment promulgated'
    - '2025-05-25 legal effect under Central Regulation Standard Act Article 13'
  notes: >-
    The shutdown preceded the amendment. The legal reopening of a renewal
    route is distinct from any regulator approval or physical restart.
references:
  - https://erss.nusc.gov.tw/law/EngLawContent.aspx?id=10102&lan=E
  - https://www.moea.gov.tw/Mns/english/news/News.aspx?kind=6&menu_id=176&news_id=119939
  - https://www.nusc.gov.tw/english/Nuclear-Reactor-Safety/Nuclear-Power-Plants-in-Taiwan-269.html
  - https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030133
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  This record does not attribute the Legislative Yuan's amendment to the DPP
  executive, treat the shutdown as an irreversible nuclear ban, or infer
  generation, emissions, price or safety effects.
