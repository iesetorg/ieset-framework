# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: cote_divoire_post_houphouet_adjustment_1994_1999_policy
status: candidate
title: Côte d'Ivoire CFA devaluation and post-1993 economic adjustment
countries: [CIV]
timeframe: {start: 1994, end: 1998}
description: >
  Following the 1994 CFA franc devaluation, Côte d'Ivoire combined external
  adjustment with structural reforms and recovery in export agriculture.
  Economic performance improved through the late 1990s, while political
  competition increasingly involved disputes over citizenship, land claims,
  and eligibility for office.
enacted_by: [cote_divoire_post_houphouet_adjustment_1994_1999]
scope: national
coalition_label_at_enactment: PDCI government under Henri Konan Bédié
axes_moved:
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, intended: true, rationale: Devaluation and structural adjustment aimed to restore export competitiveness and external balance.}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: weak, intended: false, rationale: Exclusionary political disputes weakened inclusive and predictable political institutions.}
references:
  - "World Bank, Côte d'Ivoire country economic strategy: https://documents1.worldbank.org/curated/en/751081468261264291/pdf/625720P10958500rces0f0Growth0Engl.pdf"
  - "UN MINUCI background: https://peacekeeping.un.org/sites/default/files/past/minuci/background.html"
notes: "Economic recovery and institutional deterioration ran concurrently."
