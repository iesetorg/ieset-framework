notes: Section 2 states 1 January 1875 general commencement; sections 10 and 12 include January
  1876 changes. Section 20 restricts the factories covered, so this is not a general adult-work
  rule. Historical GBR denotes the United Kingdom jurisdiction of the time, including Ireland before
  partition; it is not a separately scored modern IRL jurisdiction. This policy-only record creates
  no movement, numeric country-drift step, or tested outcome claim.
