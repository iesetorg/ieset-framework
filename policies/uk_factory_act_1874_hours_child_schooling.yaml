policy_id: uk_factory_act_1874_hours_child_schooling
status: candidate
title: 'Factory Act 1874: hours and child-schooling revision'
countries:
- GBR
scope: national
timeframe:
  start: 1874
  enacted_date: '1874-07-30'
  effective_date: '1875-01-01'
description: The Act revised employment periods and meal intervals for women, young people, and
  children in the factories it covered, including earlier textile and lace-factory categories. It
  regulated children's work patterns and linked some child employment conditions to schooling. The
  general commencement was January 1875, while some age and recovery-of-lost-time provisions changed
  in January 1876.
axes_moved:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  intended: true
  rationale: The revised permitted work periods, meal rules, and child-employment conditions limited
    scheduling in specified factories; the coding is not an estimate of economic impact.
references:
- 'Factory Act 1874, 37 & 38 Vict. c. 44, original print, sections 2-12 and 20: https://www.legislation.gov.uk/ukpga/Vict/37-38/44/pdfs/ukpga_18740044_en.pdf'
linked_hypotheses_inferred: []
