policy_id: uk_corn_law_repeal_1846
status: candidate
title: Corn Laws Repeal — UK 1846
countries:
- GBR
timeframe:
  start: 1846
  end: 1849
  enacted_date: '1846-06-26'
  effective_date: '1846-06-26'
description: >
  The Importation Act 1846 replaced the prior duties on imported corn, grain,
  meal, and flour with a lower scheduled scale from its enactment on 26 June
  1846. From 1 February 1849 it imposed a nominal one-shilling duty per quarter
  on grain; it did not abolish all corn duties in 1846 or 1849. The remaining
  corn duties were repealed separately in 1869.
enacted_by:
- peel_conservative_split_1846
coalition_label_at_enactment: Conservative split — majority-opposition coalition
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: The 1846 Act substantially reduced import duties on grain, though a nominal duty remained after the phase-in.
references:
- 'Importation Act 1846, 9 & 10 Vict. c. 22, as enacted: https://www.legislation.gov.uk/ukpga/Vict/9-10/22/pdfs/ukpga_18460022_en.pdf'
- 'Revenue Act 1869, 32 & 33 Vict. c. 14, section 4, later repeal of corn duties: https://www.legislation.gov.uk/ukpga/Vict/32-33/14/pdfs/ukpga_18690014_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: The 1846-1849 span denotes the scheduled tariff transition; the year 1869 is a separate later law, not a second event within this policy record.
