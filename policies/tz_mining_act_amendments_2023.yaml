policy_id: tz_mining_act_amendments_2023
status: candidate
title: Tanzania Finance Act 2023 refinery inspection-fee exemption
countries: [TZA]
timeframe:
  start: 2023
  end: 2023
  enacted_date: '2023-06-30'
  effective_date: '2023-07-01'
description: >-
  Section 45 of Finance Act No. 7 of 2023 added refineries to the exemption
  in Mining Act section 90A(5) from the one-percent mineral inspection fee.
  The Act received presidential assent and was gazetted on 30 June 2023 and
  commenced on 1 July 2023. This is a narrow fee exemption, not a repeal of
  the 2017 mining framework or a general liberalisation of the sector.
enacted_by:
  - tanzania_suluhu_ccm_2021_present
evaluation_design:
  event_dates:
    - '2023-06-30 Finance Act No. 7 of 2023 assented and gazetted'
    - '2023-07-01 Act commenced under section 2'
  known_data_gaps:
    - Actual fee incidence, refinery volumes, investment and public-revenue effects are not measured here.
  notes: >-
    The enacted text amends only section 90A(5). The 2023 revised edition of
    the Mining Act is a consolidation, not the enactment date. No IESET axis
    cleanly represents this sector-specific inspection-fee exemption, so no
    axis or hypothesis link is inferred.
