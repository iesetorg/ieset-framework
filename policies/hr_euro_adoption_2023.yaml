policy_id: hr_euro_adoption_2023
status: candidate
title: Croatia euro adoption 2023
countries:
- HRV
timeframe:
  start: 2023
  end: ongoing
  enacted_date: '2022-07-12'
  effective_date: '2023-01-01'
description: 'Croatia adopted the euro on 1 January 2023 after Council Decision 2022/1211 concluded that it fulfilled the convergence conditions and abrogated its derogation. The changeover replaced the
  kuna, moved Croatian monetary policy into the Eurosystem framework, and removed exchange-rate conversion frictions with euro-area trade, tourism, and financial partners.

  '
enacted_by:
- croatia_plenkovic_hdz_eu_integration_2016_present
coalition_label_at_enactment: Plenkovic HDZ-led government
references:
- 'Council Decision (EU) 2022/1211 on adoption by Croatia of the euro on 1 January 2023: https://eur-lex.europa.eu/eli/dec/2022/1211/oj'
evaluation_design:
  event_dates:
  - '2022-07-12: Council adopted Decision (EU) 2022/1211.'
  - '2023-01-01: Croatia adopted the euro and its derogation was abrogated.'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Currency-conversion costs are outside the trade-policy axis. Eurosystem
  membership alone does not establish a measured change or explicitly
  confirmed neutrality in central-bank independence from fiscal authority.
  The currency-regime event remains unscored on canonical axes.
