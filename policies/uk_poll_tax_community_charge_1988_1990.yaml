policy_id: uk_poll_tax_community_charge_1988_1990
status: candidate
title: UK Community Charge (Poll Tax) 1988-1990
countries:
- GBR
timeframe:
  start: 1988
  end: 1993
  enacted_date: '1988-07-29'
  treatment_onset_unresolved: true
description: >
  The Abolition of Domestic Rates Etc. (Scotland) Act 1987 established the
  Scottish community-charge route, with liability from April 1989. The Local
  Government Finance Act 1988 received Royal Assent on 29 July 1988 and
  created the England and Wales framework, applied from April 1990. The Local
  Government Finance Act 1992 replaced community charges with council tax
  from the 1993 financial year.
enacted_by:
- uk_thatcher_third_term_1987_1990
coalition_label_at_enactment: Conservative (Thatcher III)
references:
- 'UK legislation, Abolition of Domestic Rates Etc. (Scotland) Act 1987, sections 1 and 14: https://www.legislation.gov.uk/ukpga/1987/47/pdfs/ukpga_19870047_en.pdf'
- 'UK legislation, Local Government Finance Act 1988, introduction and Part I: https://www.legislation.gov.uk/ukpga/1988/41/pdfs/ukpga_19880041_en.pdf'
- 'UK legislation, Local Government Finance Act 1992, introduction and section 1: https://www.legislation.gov.uk/ukpga/1992/14/pdfs/ukpga_19920014_en.pdf'
notes: >
  Scotland and England/Wales followed different laws and application years.
  The 1988 Royal Assent is not a shared UK treatment onset; a comparative
  study must code jurisdiction-specific liability dates.
axes_moved:
- axis: fiscal.tax_progressivity
  direction: '-'
  magnitude: moderate
  rationale: Flat per-adult charge replacing property-based rates flattened local-tax incidence.
- axis: institutional.property_rights
  direction: '0'
  rationale: Did not alter property-rights framework directly.
