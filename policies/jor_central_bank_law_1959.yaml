# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: jor_central_bank_law_1959
status: candidate
title: Jordan legislates for a central bank before its 1964 opening
countries:
- JOR
timeframe:
  start: 1959
  end: 1959
description: Jordan issued its central bank law in 1959. The institution began operating on 1 October
  1964, succeeding the Jordan Currency Board established in 1950. The policy date records legislation,
  not five additional years of central bank operations. Later statutory autonomy is not assumed to have
  been present in the original law.
scope: national
references:
- 'Central Bank of Jordan, A Brief Outlook: https://cbj.gov.jo/EN/Pages/Central_Bank_of_Jordan_A_Brief_Outlook'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
