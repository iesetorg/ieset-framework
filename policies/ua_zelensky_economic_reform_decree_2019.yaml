# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ua_zelensky_economic_reform_decree_2019
status: candidate
title: Ukraine urgent economic reform and investment measures, 2019
countries: [UKR]
timeframe: {start: 2019, end: 2021, enacted_date: "2019-11-08"}
description: >
  Presidential Decree No. 837/2019 directed the government to advance competitive
  transport markets, liberalise labour relations, prepare agricultural land
  reform, start large-scale privatisation, ease conditions for small business,
  and improve the investment and business climate. These directives established
  policy intent and deadlines; they do not demonstrate full implementation.
coalition_label_at_enactment: Zelensky presidency and Servant of the People government
enacted_by: [ukraine_zelensky_economic_reform_programme_2019_2021]
axes_moved:
  - {axis: institutional.property_rights, direction: "+", magnitude: moderate, intended: true, rationale: "The decree directed preparation for a market in agricultural land and large-scale privatisation."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, intended: true, rationale: "The programme sought competitive railway transport, alcohol-sector liberalisation, and private investment."}
  - {axis: regulatory.labour_market_flexibility, direction: "+", magnitude: moderate, intended: true, rationale: "The decree explicitly called for liberalising labour relations and modernising labour law."}
references:
  - "President of Ukraine, Decree No. 837/2019: https://www.president.gov.ua/en/news/volodimir-zelenskij-pidpisav-ukaz-pro-nevidkladni-z-p-58289"
  - "President of Ukraine, 2019 investment and business directives: https://www.president.gov.ua/en/news/volodimir-zelenskij-onovlena-vlada-maye-stimulyuvati-investi-57097"
notes: "The statute is coded as a package of directives. The policy's intended directions are not presented as verified completed results."
