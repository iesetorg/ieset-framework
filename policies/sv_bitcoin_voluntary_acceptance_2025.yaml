policy_id: sv_bitcoin_voluntary_acceptance_2025
status: candidate
title: Bitcoin Law reform — voluntary private acceptance (2025)
countries:
- SLV
timeframe:
  start: 2025
  end: ongoing
  enacted_date: '2025-01-29'
description: >
  Legislative Decree No. 199 amended the Bitcoin Law on 29 January 2025
  (published 30 January; effective 30 April). It made private acceptance of
  Bitcoin voluntary, removed compulsory public and private acceptance and
  Bitcoin tax payments, and curtailed the state's conversion obligation.
  The amendment implemented a prior action following the IMF staff-level
  agreement of 18 December 2024. The IMF Executive Board approved the
  $1.4 billion Extended Fund Facility on 26 February 2025. Bitcoin may
  still be used voluntarily in private transactions; the law's wording
  continues to call it curso legal, so the change is better described by
  its removed compulsory features than as a complete ban on legal tender.
enacted_by:
- elsalvador_bukele_second_term_2024_present
coalition_label_at_enactment: Nuevas Ideas supermajority
axes_moved:
- axis: regulatory.financial_deregulation
  direction: mixed
  rationale: Private acceptance became voluntary while public-sector Bitcoin activity was restricted; no net financial-regulation direction is established.
- axis: monetary.monetary_expansion_direction
  direction: '0'
  magnitude: weak
  intended: true
  rationale: The dollarised economy's money supply was not expanded or contracted by making Bitcoin acceptance voluntary.
linked_hypotheses: []
references:
