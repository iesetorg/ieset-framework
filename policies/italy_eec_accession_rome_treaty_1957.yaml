policy_id: italy_eec_accession_rome_treaty_1957
status: candidate
title: Italy founding EEC membership under the Treaty of Rome
countries:
- ITA
timeframe:
  start: 1958
  end: 1958
  signed_date: '1957-03-25'
  effective_date: '1958-01-01'
description: >-
  Italy was one of six signatories of the Treaty establishing the European
  Economic Community on 25 March 1957. The Treaty applied from 1 January
  1958, establishing a customs union and a transition toward removing duties
  and quotas between members, with a common external tariff. This founding
  membership record does not treat later CAP payments or Italian industrial
  growth as results demonstrated by the accession event.
enacted_by:
- italian_economic_miracle_1950_1970
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  intended: true
  rationale: Treaty Articles 9 and 13 committed members to a customs union and progressive internal-duty abolition.
