# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_snb_eur_floor_2011_2015
status: candidate
title: Swiss National Bank minimum CHF per euro rate (2011-2015)
countries: [CHE]
timeframe:
  start: 2011
  end: 2015
  enacted_date: '2011-09-06'
  effective_date: '2011-09-06'
description: >
  The Swiss National Bank set a minimum exchange rate of CHF 1.20 per euro on
  6 September 2011 and declared that it was prepared to purchase foreign
  currency without a fixed quantity limit to defend that minimum. The SNB
  discontinued the minimum on 15 January 2015. The exchange-rate floor was a
  temporary monetary policy instrument; its discontinuation and the simultaneous
  interest-rate reduction are separate components of the January 2015 decision.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
evaluation_design:
  event_dates:
    - '2011-09-06 minimum CHF 1.20 per euro announced and applied'
    - '2015-01-15 minimum discontinued with immediate effect'
  notes: >
    The policy directly fixes an exchange-rate floor, for which this corpus has
    no dedicated axis. Its stated willingness to purchase foreign currency
    does not by itself measure changes in the monetary base or establish an
    outcome verdict. Treat introduction and discontinuation as separate event
    dates in any analysis, with the simultaneous 2015 rate cut accounted for.
references:
  - https://www.snb.ch/en/publications/communication/press-releases/2011/pre_20110906
  - https://www.snb.ch/en/publications/communication/press-releases/2015/pre_20150115
notes: >
  The SNB made these monetary policy decisions independently. The enacted_by
  reference groups the event with the Swiss governance-era movement; it does
  not attribute the SNB decision to the Federal Council.
