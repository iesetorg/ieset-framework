policy_id: uk_corn_importation_act_1815
status: candidate
title: UK grain import threshold under the Importation Act 1815
countries: [GBR]
scope: national
timeframe:
  start: 1815
  enacted_date: '1815-03-23'
  effective_date: '1815-03-23'
description: >
  The Importation Act 1815 allowed foreign corn, meal, and flour to be brought
  into the United Kingdom and warehoused without duty, but barred their entry
  for home consumption when the published British price of the relevant grain
  fell below the statutory threshold. Foreign wheat could enter for home
  consumption duty-free when the British wheat price reached 80 shillings per
  quarter; grain from British North American colonies had lower thresholds.
  The Act thus restricted domestic use of imported grain without banning all
  imports or imposing a general duty on grain admitted above the thresholds.
coalition_label_at_enactment: Lord Liverpool's ministry
axes_moved:
- axis: regulatory.trade_openness
  direction: '-'
  intended: true
  rationale: >
    Sections III and IV conditioned foreign grain's admission for home
    consumption on high domestic price thresholds. Magnitude is withheld
    because the incremental restriction against the prior regime has not been
    quantified.
references:
- 'Importation Act 1815, 55 Geo. 3 c. 26, as enacted, sections I-IV and VI-IX: https://www.legislation.gov.uk/ukpga/Geo3/55/26/pdfs/ukpga_18150026_en.pdf'
- 'House of Lords, Corn Bill second reading, 15 March 1815 (Lord Liverpool): https://api.parliament.uk/historic-hansard/lords/1815/mar/15/corn-bill'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The Act amended older corn-importation laws; it was not the origin of every
  Corn Law. Later statutes revised the regime before the separate 1846 reform.
  No movement is attributed, so this policy-only record creates no country-
  drift step. GBR denotes the historical United Kingdom, including Ireland
  in 1815; the historical policy is not separately scored for modern IRL.
