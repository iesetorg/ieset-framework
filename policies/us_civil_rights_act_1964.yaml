policy_id: us_civil_rights_act_1964
status: candidate
title: Civil Rights Act of 1964
countries: [USA]
scope: national
timeframe:
  start: 1964
  end: 1964
  enacted_date: '1964-07-02'
description: >
  The Civil Rights Act of 1964 barred discrimination in covered public
  accommodations, authorized federal action against discrimination in public
  facilities and schools, prohibited discrimination in federally assisted
  programs, and established federal employment-discrimination rules and the
  Equal Employment Opportunity Commission. President Johnson signed it on
  2 July 1964. Major Title VII employment prohibitions began one year later;
  the statute did not make every provision operative on signing day.
enacted_by: [us_lbj_great_society_1964_1968]
axes_moved:
  - axis: institutional.rule_of_law
    direction: '+'
    magnitude: moderate
    intended: true
    rationale: Titles II, IV, and VI established national equal-treatment and federal-enforcement rules at enactment; Title VII employment prohibitions took effect in 1965.
references:
  - 'U.S. National Archives, enrolled Civil Rights Act of 1964 and transcript, including Title VII section 716: https://www.archives.gov/milestone-documents/civil-rights-act'
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
notes: >
  This is a federal statutory treatment, not a measured desegregation or
  employment outcome. The 1965 Voting Rights Act and 1968 Fair Housing Act
  address distinct voting and housing protections and have separate records.
