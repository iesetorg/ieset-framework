# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: yem_plc_formation_and_un_truce_2022
status: candidate
title: Yemen Presidential Leadership Council formation and UN truce
countries: [YEM]
timeframe: {start: 2022, end: ongoing, enacted_date: "2022-04-07"}
description: >
  President Hadi transferred authority to an eight-member Presidential Leadership
  Council intended to unite the internationally recognised government's anti-Houthi
  coalition. A UN-mediated truce reduced active hostilities in 2022, but expired without
  a comprehensive settlement. Separate institutions, monetary authorities, and
  economic zones continue.
enacted_by: [yemen_presidential_leadership_council_fragmented_stabilisation_2022_present]
coalition_label_at_enactment: Presidential Leadership Council and associated factions
axes_moved:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, intended: true, rationale: "The PLC formalised a coalition executive but did not unify institutions across the country."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, intended: true, rationale: "Continuing oil export blockades and aid shortfalls constrain recognised-government fiscal capacity."}
references:
  - "World Bank, Yemen Economic Monitor, Spring 2025: https://www.worldbank.org/en/news/press-release/2025/06/02/economic-fragmentation-and-external-shocks-hamper-yemen-s-recovery-path"
  - "UN Security Council Panel of Experts on Yemen, report S/2023/833: https://digitallibrary.un.org/record/4028446/files/S_2023_833-EN.pdf"
notes: "Ongoing interval reflects continuing institutional division documented by current source reports."
