description: The Fair Pay Agreements Act Repeal Act 2023 repealed the 2022 bargaining framework
  and its associated regulations from the day after Royal assent, ending pending bargaining
  processes subject to transitional provisions. This repeal did not itself amend the separate
  90-day employment-trial rule; that rule changed under a different Act assented to on 22 December
  2023.
