- 'New Zealand Legislation, Fair Pay Agreements Act Repeal Act 2023 (2023 No 65), assent 19
  December 2023, sections 2 and 5 and Schedule 1: https://www.legislation.govt.nz/act/public/2023/65/en/latest/'
notes: Because no fair pay agreement took effect before repeal, a before-after comparison of
  sector-wide terms cannot be treated as an implemented agreement reversal. The separate trial-period
  amendment is recorded as nz_trial_periods_all_employers_2023.
