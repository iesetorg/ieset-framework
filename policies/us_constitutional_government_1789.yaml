# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_constitutional_government_1789
status: candidate
title: Constitutional federal government begins operating
countries: [USA]
timeframe:
  start: 1789
  end: 1789
  enacted_date: "1789-03-04"
description: >
  The new federal government began operating under the Constitution after
  ratification by nine states. Compared with the Articles of Confederation,
  the Constitution created a federal government with direct taxing powers
  and authority to regulate interstate commerce. This codes the institutional
  change in governing capacity, not a claim that the United States immediately
  had one uniform national market or that the new government's powers were
  uncontested.
enacted_by:
  - us_federalist_state_building_1789_1800
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The Constitution established durable federal institutions and a supreme-law framework, while ratification debates and the later Bill of Rights show that the settlement remained contested.
  - axis: regulatory.product_market_competition
    direction: "+"
    magnitude: weak
    intended: true
    rationale: Federal authority over interstate commerce created a national basis for common market rules; this codes legal capacity, not immediate market integration or competition outcomes.
references:
  - "U.S. National Archives, The Constitution: How Did it Happen?: https://www.archives.gov/founding-docs/constitution/how-did-it-happen"
  - "U.S. National Archives, Constitution Q&A (government began operating March 4, 1789): https://www.archives.gov/founding-docs/constitution-q-and-a"
notes: Candidate historical coding. The Articles-era baseline was decentralized and could request funds from states but lacked enforcement and interstate-commerce powers; this is a documented institutional context, not a numeric market/state score.
