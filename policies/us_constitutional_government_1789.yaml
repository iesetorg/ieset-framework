policy_id: us_constitutional_government_1789
status: candidate
title: U.S. constitutional federal government begins legal operation, 1789
countries: [USA]
scope: national
timeframe:
  start: 1789
  effective_date: '1789-03-04'
description: >
  The federal government under the ratified U.S. Constitution began legally
  operating on 4 March 1789, succeeding the Articles of Confederation. The
  Constitution provided federal taxing and interstate-commerce powers and a
  framework for Congress, the executive, and the judiciary. Congress did not
  begin practical operation until it had a quorum on 6 April, the executive
  became operative with Washington's inauguration on 30 April, and the Supreme
  Court first sat in February 1790. This record dates the legal start, not full
  institutional operation or a measured change in economic freedom.
references:
- 'U.S. National Archives, Constitution questions and answers, government operation timeline: https://www.archives.gov/founding-docs/constitution-q-and-a'
- 'U.S. National Archives, First Federal Congress, 1789–1791: https://www.archives.gov/exhibits/treasures_of_congress/text/page2_text.html'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The Constitution was drafted and ratified before 1789; 4 March marks the
  legal beginning of government under it, not the Constitution's enactment
  date. This policy-only context has no authored movement link, signed axis,
  magnitude, empirical result, or numeric country-drift step. State-level
  systems, slavery, Indigenous polities, and populations excluded from
  representation are outside this narrow federal institution date.
