timeframe:
  start: 1970
  end: 1970
  enacted_date: '1970-01-02'
  effective_date: '1970-01-04'
description: >-
  France's Law 70-7 of 2 January 1970 created the salaire minimum
  interprofessionnel de croissance (SMIC) in place of the SMIG. Légifrance
  dates the original law's operative articles to 4 January 1970. Article 6
  initially set the SMIC equal to the then applicable SMIG and established the
  reference index for the first adjustment. Later payroll relief, actual wage
  distribution changes and public-sector wage costs are separate questions.
