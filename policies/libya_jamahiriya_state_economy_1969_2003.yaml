# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: libya_jamahiriya_state_economy_1969_2003_policy
status: candidate
title: Qaddafi-era Jamahiriya and state-directed economy
countries:
- LBY
timeframe:
  start: 1969
  end: 2002
description: The 1969 revolution established a new republic and later the Jamahiriya political system.
  Oil revenues financed a highly state-directed economy, with public ownership and central planning dominant
  in important sectors. Private activity was heavily constrained, but the economy was not uniformly state-owned;
  hydrocarbon production and informal private activity require distinct treatment.
enacted_by:
- libya_jamahiriya_state_economy_1969_2003
scope: national
coalition_label_at_enactment: Revolutionary Command Council and Jamahiriya political system
axes_moved:
- axis: fiscal.spending_level
  direction: +
  magnitude: strong
  intended: true
  rationale: Oil-financed public investment and services made the state the dominant allocator.
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Private enterprise was restricted and market allocation was displaced in many sectors.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Political institutions concentrated authority outside competitive constitutional government.
references:
- 'World Bank, Libya: From Privilege to Competition (2006): https://documents1.worldbank.org/curated/en/918691468053103808/pdf/30295.pdf'
- 'United Nations, Member States: Libya: https://www.un.org/en/about-us/member-states/libya'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
