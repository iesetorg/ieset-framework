# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_autumn_budget_2024_tax_package
status: candidate
title: UK Autumn Budget 2024 — tax-raising package
countries:
- GBR
timeframe:
  start: 2024
  end: ongoing
  effective_date: '2024-10-30'
  treatment_onset_unresolved: true
description: >-
  HM Treasury presented the Autumn Budget on 30 October 2024. Its capital-gains-tax
  main-rate changes applied to disposals from that date; the employer National
  Insurance rise and lower secondary threshold were scheduled for 6 April 2025,
  with inheritance-tax changes on later dates. This record represents the multi-date
  Budget tax package, not a single simultaneous legal or economic treatment. The
  30 October date is the first application of one component, not enactment of the
  entire package.
enacted_by:
- uk_starmer_labour_2024_present
coalition_label_at_enactment: Labour majority (Starmer)
axes_moved:
- axis: fiscal.tax_progressivity
  direction: +
  magnitude: moderate
  intended: true
  rationale: Budget measures on capital gains and inheritance tax were designed to increase taxation of higher-income and wealth holders; realized distributional incidence is untested.
- axis: fiscal.tax_capital
  direction: +
  magnitude: strong
  intended: true
  rationale: Main capital-gains-tax rates rose on 30 October 2024; other capital-tax changes were scheduled for later dates.
references:
- https://www.gov.uk/government/publications/autumn-budget-2024/autumn-budget-2024-html
- https://www.gov.uk/government/publications/autumn-budget-2024-overview-of-tax-legislation-and-rates-ootlar
