policy_id: vn_wto_accession_2007
status: candidate
title: Vietnam WTO accession 2007
countries:
- VNM
timeframe:
  start: 2007
  end: ongoing
  effective_date: '2007-01-11'
description: 'Viet Nam became the WTO''s 150th member on 11 January 2007, after the General Council approved its accession package on 7 November 2006 and Viet Nam notified acceptance on 12 December. The package bound goods tariffs and set services-market commitments, including staged foreign entry in distribution, banking, insurance, and telecommunications. This record codes the accession commitments and membership date; it does not infer an export, investment, growth, or welfare effect from the legal event alone.'
enacted_by:
- vietnam_dung_pm_2006_2016
- vietnam_doi_moi_1986
coalition_label_at_enactment: CPV under Nguyễn Tấn Dũng premiership
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: Bound tariff cuts, services access, trading-rights liberalisation.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  intended: true
- axis: regulatory.sectoral_licensing
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: Foreign-entry permits in banking, insurance, distribution liberalised.
references:
- 'WTO accession record and dated package: https://www.wto.org/english/thewto_e/acc_e/a1_vietnam_e.htm'
- 'WTO General Council approval, 7 November 2006: https://www.wto.org/english/news_e/pres06_e/pr455_e.htm'
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
