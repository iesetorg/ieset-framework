policy_id: bdi_national_central_bank_law_1964
status: candidate
title: Burundi creates a national central bank after the common bank splits
countries:
- BDI
timeframe:
  start: 1964
  end: 1964
  enacted_date: '1964-04-09'
description: The law of 9 April 1964 created the Bank of the Kingdom of Burundi after the common Rwanda-Burundi
  issuing bank split. The national bank began operations on 19 May 1964. Its initial law was replaced
  by new statutes in January 1965. The record concerns the national institution and does not attribute
  the earlier colonial or joint bank to independent Burundi.
scope: national
references:
- 'Banque de la Republique du Burundi, Historique: https://archive.brb.bi/fr/content/historique'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
