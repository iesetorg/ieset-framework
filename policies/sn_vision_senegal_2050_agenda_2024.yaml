# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: sn_vision_senegal_2050_agenda_2024
status: candidate
title: Senegal 2050 National Transformation Agenda
countries: [SEN]
timeframe: {start: 2024, end: ongoing}
description: >
  The new government launched a long-term national transformation agenda with
  a ten-year strategic master plan and a 2025–2029 five-year implementation
  plan. The framework prioritises a competitive and diversified economy,
  human capital and social equity, sustainable regional development, and
  governance. It seeks national sovereignty and domestic value creation while
  inviting private investment and partnerships; its planned outputs are not
  coded as completed outcomes.
coalition_label_at_enactment: Faye presidency and PASTEF-led government
enacted_by: [senegal_faye_pastef_national_transformation_2024_present]
axes_moved:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "The agenda directs planning and investment toward priority productive sectors and national transformation objectives."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, intended: true, rationale: "Good governance and stronger institutions form one of the agenda's stated pillars."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, intended: true, rationale: "The programme includes public investment and social-capital objectives, though a net expenditure effect is not established by the plan announcement."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: weak, intended: true, rationale: "Sovereignty and domestic value creation are combined with private investment and partnership goals."}
references:
  - "Presidency of Senegal, launch of Senegal 2050: https://www.presidence.sn/en/actualites/the-launch-of-the-national-transformation-agenda-senegal-2050-1/"
  - "Senegal 2050 strategic document: https://bo-admin.presidence.sn/storage/documents/5md5fMAh2Ti99EfAqRNMpLQwxCkKKJN94r8n9fDN.pdf"
notes: "This policy records an adopted planning framework, not achievement of its 2050 targets."
