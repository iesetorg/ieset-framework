policy_id: nl_kok_budget_surplus_1998_2001
status: candidate
title: Kok Budget Surplus 1998 2001
countries:
- NLD
timeframe:
  start: 1998
  end: 2002
description: >
  Context record for the Kok II budget surpluses. The real expenditure framework
  was introduced under Kok I in 1994 and continued in the 1999-2002 budget
  period; the surpluses were fiscal outcomes, not a separate enacted treatment.
  The 1999 Miljoenennota explicitly says the previous cabinet introduced the
  real expenditure framework and that the same method set the new period's
  ceilings. This record has no independent axis step or policy-effect evidence.
enacted_by:
- netherlands_kok_ii_purple_1998_2002
references:
- https://www.rijksfinancien.nl/miljoenennota/1999
- https://www.rijksfinancien.nl/miljoenennota/2002
