policy_id: mali_keita_socialist_republic_1960_1968_policy
status: candidate
title: First Republic and socialist state-building
countries:
- MLI
timeframe:
  start: 1960
  end: 1967
description: Independent Mali’s first government established a de facto single-party socialist regime
  and pursued a planned national economy. The state expanded its role in production and administration
  while the new republic built national institutions. The short episode ended with the 1968 military coup.
enacted_by:
- mali_keita_socialist_republic_1960_1968
scope: national
coalition_label_at_enactment: Sudanese Union–African Democratic Rally government
axes_moved:
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Planning and state direction displaced market allocation across major activities.
- axis: fiscal.spending_level
  direction: +
  magnitude: moderate
  intended: true
  rationale: The new government expanded national administration and public economic direction.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: moderate
  intended: true
  rationale: A de facto single-party system limited political competition.
references:
- 'UN Committee on the Rights of the Child, Mali second periodic report: https://digitallibrary.un.org/record/582290/files/CRC_C_MLI_2-EN.pdf'
- 'UNCTAD, Investment policy review: Mali: https://digitallibrary.un.org/record/428747/files/poiteiitm24-en.pdf'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
