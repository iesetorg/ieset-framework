# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: yem_conflict_fragmentation_and_competing_economic_authorities_2015
status: candidate
title: Yemen conflict and fragmentation of national economic institutions
countries: [YEM]
timeframe: {start: 2015, end: 2021, enacted_date: "2015-03-26"}
description: >
  The conflict divided Yemen among multiple political-military authorities and
  disrupted national monetary, fiscal, and administrative systems. The recognised
  government and Houthi authorities developed separate institutions and exchange
  arrangements, while conflict and territorial control constrained production, public
  services, and trade.
enacted_by: [yemen_war_economy_and_fragmented_authority_2015_2021]
coalition_label_at_enactment: Competing national and de facto authorities
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: true, rationale: "The conflict fragmented national authority and legal administration."}
  - {axis: monetary.central_bank_independence, direction: "-", magnitude: strong, intended: true, rationale: "Competing monetary authorities displaced unified central-bank policy."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, intended: true, rationale: "Conflict and coercive territorial controls severely disrupted ordinary market exchange."}
references:
  - "World Bank, Yemen transformed political economy and fragmented institutions: https://documents1.worldbank.org/curated/en/099050923091537357/pdf/P17826203eb7ac0030b5540af4456d0dd7c.pdf"
notes: "The record describes fragmentation, not one country's unified policy programme."
