# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: mmr_partial_market_opening_1988
status: candidate
title: Myanmar post-1988 partial market opening under military rule
countries: [MMR]
timeframe: {start: 1988, end: 2010, enacted_date: "1988-09-18"}
description: >
  After the 1988 uprising, the military government permitted private external trade,
  border commerce, foreign investment, and market sales of much agricultural output.
  The opening remained partial, and the military did not honour the 1990 election result.
enacted_by: [myanmar_slorc_spdc_market_opening_1989_2010]
coalition_label_at_enactment: State Law and Order Restoration Council
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "Private trade and foreign-investment rules partially opened the previously inward-looking economy."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: true, rationale: "Military rule continued and the elected 1990 parliament was not permitted to govern."}
references:
  - "IMF, Myanmar 1997 Article IV: https://www.elibrary.imf.org/view/journals/002/1997/031/article-A001-en.xml"
notes: "Policy started in 1988; linked movement begins in 1989 to represent the ensuing governing period."
