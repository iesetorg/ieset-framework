# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_debt_brake_constitutional_2001
status: candidate
title: Swiss federal constitutional debt brake (2001 approval, 2003 budget)
countries: [CHE]
timeframe:
  start: 2003
  end: ongoing
description: >
  Swiss voters approved the constitutional debt brake on 2 December 2001. Its
  expenditure rule sets a ceiling on the Confederation's ordinary budget
  spending using expected receipts adjusted for the economic situation. The
  federal rule was first applied to the 2003 budget; it permits an exceptional
  increase in the ceiling and requires later compensation for excess spending.
  This record covers the federal fiscal rule, not cantonal finances or a
  demonstrated fall in general-government spending as a share of GDP.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
evaluation_design:
  event_dates:
    - '2001-12-02 constitutional amendment approved by referendum'
    - '2003 first federal budget subject to the debt brake; exact operative day not established here'
  notes: >
    Use the 2003 federal budget for treatment timing. The rule constrains an
    expenditure ceiling, but approval alone does not identify the change in
    actual federal or general-government spending, debt, growth, or welfare.
references:
  - https://www.efv.admin.ch/en/federal-governments-debt-brake
  - https://www.efd.admin.ch/en/the-debt-brake
