policy_id: us_gi_bill_1944
status: candidate
title: Servicemen's Readjustment Act (GI Bill)
countries: [USA]
timeframe: {start: 1944, end: 1956, enacted_date: '1944-06-22'}
description: >
  The Servicemen's Readjustment Act authorized federal education and training
  support, unemployment benefits, and loan guarantees for eligible returning
  service members. The benefits helped veterans transition into civilian life
  and widened access to higher education and home finance. The National Archives
  reports that millions used its education and training provisions; the record
  also notes that access and implementation were unequal, including along
  racial lines.
enacted_by:
  - us_postwar_bipartisan_economic_settlement_1944_1963
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Federal benefits provided tuition, subsistence, unemployment support, and housing assistance to eligible veterans.
references:
  - "Servicemen's Readjustment Act, 58 Stat. 284 (1944)"
  - "National Archives: https://www.archives.gov/milestone-documents/servicemens-readjustment-act"
