  direction: +
  magnitude: weak
  intended: true
  rationale: Pact reinforced the political insulation of the ECB by removing fiscal pressure on monetary policy.
- axis: fiscal.spending_level
  direction: '-'
  magnitude: weak
  intended: true
  rationale: Excessive-deficit procedure constrained discretionary spending growth in member states.
