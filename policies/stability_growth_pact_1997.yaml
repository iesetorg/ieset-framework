timeframe:
  start: 1997
description: 'Adopted by the European Council in June 1997 and specified by Council Regulations 1466/97 and 1467/97, the Stability and Growth Pact translated Maastricht''s deficit and
  debt reference values into EU-level surveillance and excessive-deficit procedures. Participating and non-participating member states submitted distinct stability or convergence programmes;
  their obligations and monetary-union status were not identical. Fiscal targets alone do not establish a decrease in each country''s spending level.

  '
references:
- 'EUR-Lex, Council Regulation (EC) No 1466/97 of 7 July 1997: https://eur-lex.europa.eu/eli/reg/1997/1466/oj/eng'
- 'ECB, Economic and Monetary Union chronology: https://www.ecb.europa.eu/ecb/history-arts-culture/history/emu/html/index.en.html'
