# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: uk_corn_duty_final_abolition_1869
status: candidate
title: Final UK corn import-duty abolition, 1869
countries: [GBR]
scope: national
timeframe:
  start: 1869
  enacted_date: '1869-06-24'
  effective_date: '1869-06-01'
description: >
  Section 4 of the Revenue Act 1869 ended customs duties on imported corn,
  grain, meal, flour, and the other enumerated related articles throughout
  Great Britain and Ireland from 1 June 1869. The Act received Royal Assent on
  24 June 1869, so this provision applied retrospectively. It removed the
  residual grain duty left after the Importation Act 1846 phased in its lower
  tariff schedule; it was a separate statute and decision from the 1846 reform.
coalition_label_at_enactment: Gladstone Liberal ministry (1868-1874)
axes_moved:
- axis: regulatory.trade_openness
  direction: '+'
  intended: true
  rationale: >
    Section 4 eliminated remaining customs duties on the enumerated imported
    grains and related articles. Magnitude is withheld because the residual
    duty's aggregate trade-policy importance has not been quantified.
references:
- 'Revenue Act 1869, 32 & 33 Vict. c. 14, section 4, as enacted: https://www.legislation.gov.uk/ukpga/Vict/32-33/14/pdfs/ukpga_18690014_en.pdf'
- 'UK Parliament, William Ewart Gladstone first administration 1868-1874: https://www.parliament.uk/about/living-heritage/evolutionofparliament/parliamentwork/communicating/from-the-parliamentary-collections/collections-hansard/subscription-form-w-gladstone/'
evaluation_design:
  event_dates:
  - '1849-02-01: Nominal residual grain duty began under the 1846 phase-in.'
  - '1869-06-01: Section 4 makes listed customs duties cease.'
  - '1869-06-24: Revenue Act 1869 received Royal Assent.'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  There is no existing UK movement spanning 1869. This policy deliberately
  omits enacted_by rather than attributing Gladstone's 1869 legislation to the
  Peel movement, which ends in 1849. A policy-only record does not create a
  country-drift axis step; no outcome effect or hypothesis verdict is claimed.
  GBR denotes the historical UK state governing Great Britain and Ireland in
  1869. Present-day country outlines do not map that Irish territory; this
  record is not separately scored for modern IRL or in country drift.
