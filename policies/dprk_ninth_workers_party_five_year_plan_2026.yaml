policy_id: dprk_ninth_workers_party_five_year_plan_2026
status: candidate
title: DPRK Ninth Workers' Party Congress Five-Year Plan 2026–2030
countries: [PRK]
timeframe: {start: 2026, end: 2030}
description: >
  The Ninth Workers' Party Congress set a national economic plan for 2026–2030
  that prioritises state-led industrial and agricultural development, defence,
  construction, and regional modernisation. Its Regional Development 20x10
  programme targets modern industrial facilities in twenty counties each
  year, alongside priorities in metallurgy, chemicals, power, coal, machinery,
  information technology, and artificial intelligence.
enacted_by: [dprk_workers_party_economic_plans_2021_present]
coalition_label_at_enactment: Workers' Party of Korea and DPRK government
axes_moved:
  - {axis: institutional.property_rights, direction: "-", magnitude: moderate, intended: true, rationale: "The plan places industrial and regional investment priorities within central party-state direction."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "The plan announces substantial state-led construction and industrial investment, without a comparable budget measure."}
references:
  - "United Nations in DPRK, 9th Workers' Party Congress unveils new Five-Year Plan 2026–2030, 25 February 2026: https://dprk.un.org/en/310999-9th-workers-party-congress-unveils-new-five-year-plan-2026-2030"
notes: "This is a plan record, not evidence that announced output or investment targets have been achieved."
