# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: jp_meiji_constitution_and_diet_1889_1890
status: candidate
title: Meiji Constitution promulgated and Imperial Diet convened
countries: [JPN]
timeframe: {start: 1889, end: 1890, enacted_date: "1889-02-11"}
description: >
  The Meiji Constitution was promulgated in February 1889 and came into force
  in November 1890, when the Imperial Diet first convened. It created a
  constitutional legislative institution and provided a legal framework for
  imperial government, while sovereignty remained with the Emperor and the
  franchise was restricted. The transition is coded as state and legal
  institution-building, not as democratization on modern terms.
enacted_by: [japan_meiji_constitutional_state_1873_1905]
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: A written constitution and national legislature formalized public institutions while preserving imperial executive authority and restricted suffrage.
references:
  - "National Archives of Japan, Promulgation of the Constitution of the Empire of Japan: https://www.archives.go.jp/hub/meiji/meiji02.html"
  - "National Archives of Japan, Constitution of Japan and the Imperial Diet: https://www.digital.archives.go.jp/pickup-en"
notes: "Constitutionalization is not equated with parliamentary sovereignty or full popular representation."
