# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: us_hepburn_act_1906
status: candidate
title: Hepburn Act 1906
countries: [USA]
timeframe:
  start: 1906
  end: 1906
  enacted_date: "1906-06-29"
description: >
  The Hepburn Act sharply expanded the Interstate Commerce Commission's authority
  over railroad rates and practices, extending regulation to pipelines, terminals,
  sleeping-car companies, and ferries connected to interstate commerce. The reform
  let the ICC set maximum rates and inspect carrier accounts, converting an earlier
  and weaker oversight regime into something much closer to public-utility regulation
  for the country's core transport network.
enacted_by:
  - us_progressive_era_reform_consensus_1901_1917
axes_moved:
  - axis: regulatory.product_market_competition
    direction: mixed
    intended: true
    rationale: "Federal maximum-rate authority constrained carrier tariff discretion while the act sought fairer shipping rates; enactment alone does not establish a net change in entry or rivalry."
references:
  - "Hepburn Act, 34 Stat. 584 (1906)"
  - "National Archives, Hepburn Rate Bill: https://www.archives.gov/legislative/features/hepburn"
notes: >
  This law expanded Interstate Commerce Commission rate oversight, not
  licensing or permission to enter the railroad business. No net
  competition-direction score is inferred from enactment.
