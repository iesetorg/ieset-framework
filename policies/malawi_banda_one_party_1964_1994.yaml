# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: malawi_banda_one_party_1964_1994_policy
status: candidate
title: Banda-era one-party developmental state
countries:
- MWI
timeframe:
  start: 1964
  end: 1993
description: After independence, Banda consolidated a one-party authoritarian system and concentrated
  political authority in the presidency. The state directed important parts of the formal economy and
  agricultural marketing, while private enterprise and estate agriculture remained present. This is a
  mixed state-directed market order, not a claim that Malawi had a fully state-owned economy.
enacted_by:
- malawi_banda_one_party_1964_1994
scope: national
coalition_label_at_enactment: Malawi Congress Party under Hastings Kamuzu Banda
axes_moved:
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  intended: true
  rationale: Political competition was restricted under one-party rule.
- axis: regulatory.sectoral_licensing
  direction: +
  magnitude: moderate
  intended: true
  rationale: State direction and controls shaped key agricultural and formal economic activities.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  intended: true
  rationale: The state played a substantial role in development and agricultural administration; scale
    is not inferred from ownership alone.
references:
- 'World Bank, Malawi country economic memorandum (2004): https://documents1.worldbank.org/curated/en/473381468270033298/pdf/36862.pdf'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
