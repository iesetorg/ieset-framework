policy_id: us_two_ocean_navy_act_1940
status: candidate
title: 1940 Naval Expansion and Two-Ocean Navy program
countries: [USA]
timeframe: {start: 1940, end: 1941}
description: >
  In 1940 Congress authorized a major naval expansion, including additional
  warship construction and shipbuilding capacity. The Naval Expansion Act
  authorized construction of further combatant vessels and facilities; the
  July Two-Ocean Navy legislation then authorized a much larger fleet-building
  programme in response to the deteriorating international security situation.
  The new authorizations directed public resources toward naval procurement
  and expanded private and public shipbuilding capacity before US entry into
  World War II.
enacted_by:
  - us_wwii_economic_mobilization_1940_1945
axes_moved:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Federal authorization and funding for new combat ships, shipbuilding ways, and defense production facilities supported a selected sector.
references:
