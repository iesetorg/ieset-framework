policy_id: uk_roman_catholic_relief_act_1829
status: candidate
title: UK Roman Catholic Relief Act opens specified offices, 1829
countries: [GBR]
scope: national
timeframe:
  start: 1829
  enacted_date: '1829-04-13'
description: >
  The Roman Catholic Relief Act 1829 removed specified religious declarations
  as qualifications for Parliament and a range of civil and military offices.
  It permitted otherwise qualified Catholics to sit and vote in Parliament
  after taking a substituted oath. The Act retained explicit exclusions for
  certain offices, ecclesiastical roles, and universities. Section XL deferred
  commencement until ten days after passage; this record does not assign an
  exact operative calendar day or claim full civic equality.
references:
- 'Roman Catholic Relief Act 1829, 10 Geo. 4 c. 7, as enacted, sections I, II, IX, X, XII, XVI and XL: https://www.legislation.gov.uk/ukpga/Geo4/10/7/pdfs/ukpga_18290007_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The statute is dated 13 April 1829. Section XL says commencement occurs at
  expiration of ten days from and after passage; an exact day is withheld to
  avoid calendar-count ambiguity. Its provisions expressly address England,
  Ireland, and Scotland. GBR is the historical UK jurisdiction, not a
  separately scored modern IRL. No movement link, signed axis, drift step,
  or tested effect is assigned.
