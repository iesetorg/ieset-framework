# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: afg_mujahideen_and_first_emirate_1992_2001_policy
status: candidate
title: Afghanistan's civil-war and first-emirate political economy
countries: [AFG]
timeframe: {start: 1992, end: 2000}
description: >
  The post-PDPA period saw competing Mujahideen factions establish an Islamic
  State in 1992, followed by a civil war and the Taliban's capture of Kabul in
  1996. The first Taliban Emirate controlled major cities and imposed a highly
  restrictive order, while conflict and fragmented territorial authority
  disrupted public administration, services, and predictable market rules.
enacted_by: [afg_mujahideen_and_first_emirate_1992_2001]
scope: national
coalition_label_at_enactment: Mujahideen factions and Taliban authorities
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: Civil war and competing authorities weakened consistent rule-bound administration.}
  - {axis: institutional.property_rights, direction: "-", magnitude: moderate, intended: false, rationale: Conflict and fragmented institutions weakened security and enforcement of property claims.}
references:
  - "World Bank, Afghanistan economic development from 2001 to 2021: https://thedocs.worldbank.org/en/doc/5f01165822f3639224e0d483ba1861fc-0310062022/original/ADU-2022-FINAL-CLEARED.pdf"
  - "UN Security Council, 1988 Sanctions Committee reports: https://www.un.org/securitycouncil/sanctions/1988/panel-of-experts/reports"
notes: "Period summary for a fragmented conflict interval; control varied greatly by region."
