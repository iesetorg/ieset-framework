policy_id: tw_forward_looking_infrastructure_2017
status: candidate
title: Taiwan Forward-looking Infrastructure Development Program
countries: [TWN]
timeframe: {start: 2017, end: 2024, enacted_date: "2017-07-07"}
description: >
  Taiwan's multi-year public infrastructure program funded selected projects in rail,
  digital infrastructure, water, urban and rural development, and green energy. The
  program combined legislated public investment with a strategy to improve connectivity
  and support industrial transformation.
enacted_by: [taiwan_tsai_ing_wen_dpp_government_2016_2024]
coalition_label_at_enactment: Democratic Progressive Party government under Tsai Ing-wen
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, intended: true, rationale: "A multi-year public infrastructure appropriation financed selected national projects."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, intended: true, rationale: "Project selection directed public capital toward transport, digital, water, and green-energy sectors."}
references:
