# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: qat_monetary_agency_law_1973
status: candidate
title: Qatar replaces the joint currency arrangement with a national monetary agency
countries:
- QAT
timeframe:
  start: 1973
  end: 1973
description: Law No. 7 of 1973 established the Qatar Monetary Agency after termination of the Qatar-Dubai
  monetary arrangement. Qatar introduced a separate national riyal during that transition. This record
  covers the national institutional change; the prior joint currency council is not retrospectively assigned
  to Qatar alone. No precise day is assigned because the official historical pages differ on the transition
  dates.
scope: national
references:
- 'Qatar legal portal, Law No. 7 of 1973: https://almeezan.qa/LawPage.aspx?id=4095&language=en'
- 'Qatar Central Bank, History of Banknotes: https://www.qcb.gov.qa/en/Pages/HistoryOfBanknotes.aspx'
notes: 'Historical source review 2026-10-09. The one-year interval marks the recorded decision, not the
  full duration of its legal effects. Candidate status is retained; outcome hypotheses and causal effects
  have not been evaluated. No axis direction is assigned: institution creation or currency issuance alone
  does not prove greater central-bank independence, monetary expansion, regulation, or a spending change.'
