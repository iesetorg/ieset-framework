policy_id: libya_limited_market_opening_2003_2011_policy
status: candidate
title: Sanctions relief and limited economic opening
countries:
- LBY
timeframe:
  start: 2003
  end: 2010
description: Following the 2003–04 lifting of Libya-specific sanctions, the government accelerated steps
  to attract private investment, liberalise selected markets, and prepare privatisations. IMF reporting
  still described the economy as largely state-controlled and regulated, so the period represents a partial
  opening within the existing political order, not a transition to a market economy.
enacted_by:
- libya_limited_market_opening_2003_2011
scope: national
coalition_label_at_enactment: Jamahiriya government
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  intended: true
  rationale: Sanctions relief and trade liberalisation reduced external restrictions.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  intended: true
  rationale: Privatisation and private-sector reforms were advanced but only partially implemented.
- axis: institutional.rule_of_law
  direction: '0'
  magnitude: weak
  intended: true
  rationale: Economic opening did not substantially alter concentrated political authority.
references:
- 'IMF, Libya 2004 Article IV consultation: https://www.elibrary.imf.org/view/journals/002/2005/083/article-A001-en.xml'
notes: Period-level historical coding candidate. The timeframe bounds an institutional/political episode;
  start-year placement in the drift map is a period proxy, not an exact enactment date or proof of continuous
  policy implementation.
