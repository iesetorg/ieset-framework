policy_id: uk_unemployment_insurance_act_1920_coverage
status: candidate
title: 'Unemployment Insurance Act 1920: wider insured employment'
countries:
- GBR
scope: national
timeframe:
  start: 1920
  enacted_date: '1920-08-09'
  effective_date: '1920-11-08'
description: The Act replaced the narrower unemployment-insurance provisions of the 1911-era scheme
  with a broader system for employed people aged sixteen and over in listed work. It provided statutory
  unemployment benefits funded through contributions, subject to conditions and exceptions; its
  schedule excluded categories including agriculture and domestic service. The general commencement
  was November 1920.
axes_moved:
- axis: fiscal.transfer_expansion
  direction: +
  intended: true
  rationale: The law broadened access to statutory unemployment benefits relative to the prior covered
    occupations; it did not create an unconditional payment for all adults.
references:
- 'Unemployment Insurance Act 1920, 10 & 11 Geo. 5 c. 30, original print: https://www.legislation.gov.uk/ukpga/Geo5/10-11/30/pdfs/ukpga_19200030_en.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: Section 48 gives 8 November 1920 as general commencement with specified exceptions. The first
  schedule sets covered and excluded work. Historical GBR denotes the United Kingdom jurisdiction
  of the time, including Ireland before partition; it is not a separate modern IRL score. This policy-only
  entry creates no numeric country-drift step or tested policy-effect claim.
