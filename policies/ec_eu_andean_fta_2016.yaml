  effective_date: '2017-01-01'
description: 'Ecuador joined the EU-Colombia-Peru Trade Agreement via an accession protocol signed on 11 Nov 2016. Its trade provisions were first applied provisionally between the EU and Ecuador on 1 Jan 2017; formal legal entry into force followed on 1 Nov 2024. The 2017 date is the operative trade-treatment date, not full treaty entry into force. Asymmetric tariff elimination,
  rules of origin, IP + services + government-procurement chapters, TRQs for sensitive agricultural products. Pragmatic trade-liberalisation pivot despite Correa''s earlier rejection of FTAs — driven by
  banana + cut-flower + shrimp + canned-tuna exporter interests + end of EU GSP+ preferences.

  '
