policy_id: ca_postwar_social_programs_1952_1977
status: candidate
title: Old-age security, public health insurance, and federal transfers
countries: [CAN]
timeframe: {start: 1952, end: 1977}
description: >
  The Old Age Security Act came into force in 1952. The federal government then
  cost-shared provincial hospital insurance beginning with the 1957 Act and
  extended cost-sharing to physician services under the 1966 Medical Care Act;
  the Canada Pension Plan and Canada Assistance Plan were also introduced in
  1966. In 1977, Established Programs Financing replaced open-ended cost-sharing
  with block funding. This bundle marks the creation and redesign of major
  postwar transfer and social-insurance institutions, not a single party's
  program or a single direction on every fiscal margin.
enacted_by: [canada_postwar_social_citizenship_1952_1977]
axes_moved:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: strong
    intended: true
    rationale: Old-age benefits, contributory pensions, social assistance cost-sharing, and public health-insurance transfers enlarged the federal transfer architecture.
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Federal cost-sharing financed growing provincial hospital and medical insurance services; the 1977 block-funding redesign later changed the funding rule.
references:
  - "Library of Parliament, Old Age Security Act chronology: https://lop.parl.ca/staticfiles/PublicWebsite/Home/ResearchPublications/LegislativeSummaries/PDF/39-1/c36-e.pdf"
  - "Health Canada, Canada Health Act Annual Report 2016–17, history of hospital and medical care insurance: https://www.canada.ca/en/health-canada/services/publications/health-system-services/canada-health-act-annual-report-2016-2017.html"
  - "Department of Finance Canada, History of Health and Social Transfers: https://www.canada.ca/en/department-finance/programs/federal-transfers/history-health-social-transfers.html"
  - "Department of Finance Canada, Fiscal Reference Tables 2022, major transfers to persons: https://www.canada.ca/en/department-finance/services/publications/fiscal-reference-tables/2022/part-2.html"
notes: "Cross-party institutional arc: do not interpret the bundled movement as an endorsement of every policy or of its later funding formula."
