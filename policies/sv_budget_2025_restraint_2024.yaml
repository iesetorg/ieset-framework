policy_id: sv_budget_2025_restraint_2024
status: candidate
title: El Salvador 2025 budget restraint (approved December 2024)
countries: [SLV]
timeframe:
  start: 2024
  end: 2025
  enacted_date: '2024-12-18'
  effective_date: '2025-01-01'
description: >
  The Legislative Assembly approved the 2025 General Budget and special budgets
  on 18 December 2024. The IMF's same-day staff-level agreement described
  fiscal measures already included in the approved budget, worth about 1.5
  percent of GDP in 2025. These included restraint of the public wage bill
  and spending on goods and services, alongside lower transfers to
  municipalities. This record describes the approved budget decision; actual
  execution and downstream fiscal or growth effects require separate evidence.
enacted_by:
