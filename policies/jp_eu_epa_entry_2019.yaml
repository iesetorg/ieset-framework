policy_id: jp_eu_epa_entry_2019
status: candidate
title: EU–Japan Economic Partnership Agreement entry in 2019
countries:
- JPN
timeframe:
  start: 2019
  end: ongoing
  signed_date: '2018-07-17'
  effective_date: '2019-02-01'
description: >-
  The EU and Japan signed their Economic Partnership Agreement on 17 July
  2018. It entered into force on 1 February 2019 after both parties completed
  their procedures. The agreement phases out most tariffs on trade between
  Japan and the EU and sets related trade rules. This record codes Japan's
  legal treaty regime and date; the EU is a bloc and is not coded as a
  country. It does not assert a measured export, growth or welfare effect.
enacted_by:
- abenomics_2012_2020
coalition_label_at_enactment: Abe LDP–Komeito government; agreement with the European Union
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: The agreement's preferential market-access commitments entered into force on 1 February 2019.
references:
- 'Council of the EU treaty record, signature and entry dates: https://www.consilium.europa.eu/en/documents/treaties-agreements/agreement/?DocLanguage=en&id=2018022'
- 'Council of the EU entry announcement: https://www.consilium.europa.eu/en/press/press-releases/2018/12/21/eu-japan-trade-agreement-will-enter-into-force-on-1-february-2019/'
suppress_inferred_axis_links: true
