policy_id: us_federal_aid_highway_act_1956
status: candidate
title: Federal-Aid Highway Act of 1956
countries: [USA]
timeframe: {start: 1956, end: 1969, enacted_date: '1956-06-29'}
description: >
  The Federal-Aid Highway Act authorized a national interstate system and
  committed substantial federal funding, largely financed through federal
  motor-fuel and vehicle taxes and allocated to states. It expanded federal
  participation in infrastructure investment and reshaped transportation and
  settlement patterns; the National Archives also documents displacement and
  neighborhood harms caused by highway routes. The coding concerns the enacted
  federal investment program, not its net welfare effects.
enacted_by:
  - us_postwar_bipartisan_economic_settlement_1944_1963
axes_moved:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: Federal grants covered most eligible interstate construction costs and supported a large, geographically allocated public works program.
references:
  - "Federal-Aid Highway Act, 70 Stat. 374 (1956)"
  - "National Archives: https://www.archives.gov/milestone-documents/national-interstate-and-defense-highways-act"
