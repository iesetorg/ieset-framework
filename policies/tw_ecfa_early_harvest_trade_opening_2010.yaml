# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: tw_ecfa_early_harvest_trade_opening_2010
status: candidate
title: Taiwan–China Economic Cooperation Framework Agreement (ECFA)
countries: [TWN]
timeframe: {start: 2010, end: ongoing, enacted_date: "2010-06-29"}
description: >
  The cross-strait ECFA established a framework for economic cooperation and early
  harvest tariff reductions for selected goods and services. Its market-opening
  effects were staged and sector-specific; it did not create a comprehensive free
  trade area or remove the political contest over cross-strait integration.
enacted_by: [taiwan_ma_ying_jeou_cross_strait_integration_2008_2016]
coalition_label_at_enactment: Kuomintang government under Ma Ying-jeou
axes_moved:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, intended: true, rationale: "Early harvest provisions reduced trade barriers for selected goods and services."}
references:
  - "Taiwan Ministry of Economic Affairs, ECFA text: https://www.trade.gov.tw/Files/PageFile/651641/ECFA.pdf"
notes: "The agreement entered into force in September 2010; 'ongoing' denotes the agreement's formal status."
