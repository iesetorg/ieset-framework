# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_august_decrees_1789
status: candidate
title: August decrees remove provincial privileges, 1789
countries: [FRA]
scope: national
timeframe:
  start: 1789
  effective_date: '1789-11-03'
description: >
  The National Constituent Assembly adopted the August decrees on 4–11 August
  1789. Article 10 removed the particular pecuniary and other privileges of
  provinces, principalities, towns, and local communities into the common law
  of French people. The royal letters patent published on 3 November gave
  these decrees legal force. This record covers that formal metropolitan
  privilege abolition, not the later completion of feudal-dues abolition,
  enforcement across all localities, or rights in the colonies.
enacted_by: [fr_constituent_provincial_privilege_abolition_1789, fr_constituent_assembly_legal_reordering_1789_1791]
axes_moved:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  intended: true
  rationale: >
    Article 10's durable removal of special provincial legal privileges in
    favor of common law supports a limited formal equal-treatment step. Its
    narrow legal scope and staged abolition of other feudal rights preclude
    a stronger national rule-of-law score.
references:
- 'French National Assembly, Night of 4 August and the 3 November letters patent: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/nuit-du-4-aout-abolition-des-privileges'
- 'French Conseil d Etat, 11 December 1974 decision quoting and applying August Decrees Article 10: https://www.legifrance.gouv.fr/ceta/id/CETATEXT000007614920'
- 'French National Assembly, French Revolution chronology: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  Narrow recoding of origin/main's fr_august_decrees_1789 candidate. The
  archived 4 August date records a debate and first vote; the August 4–11
  decrees acquired legal force with the letters patent published on
  3 November 1789. Other feudal dues remained subject to redemption until
  further laws in 1792–1793. No property-rights step or empirical outcome is
  inferred.
