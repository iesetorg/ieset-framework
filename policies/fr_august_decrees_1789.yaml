# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: fr_august_decrees_1789
status: candidate
title: August Decrees abolish feudal privileges
countries: [FRA]
timeframe:
  start: 1789
  end: 1789
  enacted_date: "1789-08-04"
description: >
  The Constituent Assembly's August Decrees dismantled the legal order of
  feudal dues and estate privileges, while some obligations were initially
  subject to redemption. This was a major shift toward common national law,
  though implementation and the scope of abolition changed through later
  revolutionary legislation.
enacted_by:
  - fr_constituent_assembly_legal_reordering_1789_1791
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: strong
    intended: true
    rationale: The Assembly removed inherited legal privileges and feudal rights in favor of a more uniform national legal order; initial redemption conditions and uneven implementation qualify the change.
references:
  - "French National Assembly, Night of 4 August: Abolition of Privileges: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/nuit-du-4-aout-abolition-des-privileges"
  - "French National Assembly, French Revolution chronology: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise"
notes: Candidate coding of the statutory and institutional change; it does not treat formal abolition as immediate or uniform implementation.
