description: >
  Public Law 115-97, signed on 22 December 2017, amended the federal tax code.
  The original law set the corporate income-tax rate at 21 percent, changed
  individual rate schedules and deductions for tax years beginning in 2018,
  and added other business and international tax provisions with distinct
  effective-date rules. This record covers the enacted package, rather than
  one tax provision or one common taxpayer treatment date.
