policy_id: japan_gatt_accession_1955
status: candidate
title: Japan Gatt Accession 1955
countries:
- JPN
timeframe:
  start: 1955
  end: 1955
  effective_date: '1955-09-10'
description: >-
  Japan became a GATT contracting party on 10 September 1955. Membership
  brought its covered trade relationships into the multilateral tariff and
  most-favoured-nation framework, but a number of contracting parties invoked
  Article XXXV to withhold application of GATT between themselves and Japan.
  This accession record therefore does not claim universal market access or
  immediate removal of Japan's import and foreign-exchange restrictions.
enacted_by:
- japan_post_war_meti_industrial_policy_1952_1975
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  intended: true
  rationale: GATT membership applied tariff and MFN commitments only to contracting parties that did not invoke Article XXXV against Japan.
references:
- https://www.wto.org/english/thewto_e/gattmem_e.htm
- https://www.wto.org/gatt_docs/English/SULPDF/90690179.pdf
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
