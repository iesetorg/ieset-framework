# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ua_martial_law_wartime_economic_regime_2022
status: candidate
title: Ukraine martial law and wartime economic administration
countries: [UKR]
timeframe: {start: 2022, end: ongoing, enacted_date: "2022-02-24"}
description: >
  Ukraine imposed martial law following Russia's full-scale invasion, enabling
  temporary restrictions and directing government agencies toward defence,
  public safety, and essential services. Wartime budgets prioritised security
  and social expenditure, while IMF-supported programmes later sought fiscal
  stability, governance reforms, and recovery planning. The emergency regime
  remains active and is not treated as a permanent peacetime model.
coalition_label_at_enactment: Zelensky presidency and Verkhovna Rada under martial law
enacted_by: [ukraine_wartime_mobilisation_and_recovery_2022_present]
axes_moved:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, intended: true, rationale: "Defence, security, and essential services became priority budget uses under the martial-law regime."}
  - {axis: regulatory.sectoral_licensing, direction: "+", magnitude: moderate, intended: true, rationale: "Martial law authorises temporary public measures and restrictions for defence and public safety."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, intended: true, rationale: "Temporary rights restrictions coexist with later legal, transparency, and anti-corruption reforms."}
references:
  - "President of Ukraine, martial law decree, 24 February 2022: https://www.president.gov.ua/en/news/prezident-pidpisav-ukaz-pro-zaprovadzhennya-voyennogo-stanu-73109"
  - "Verkhovna Rada, 2022 wartime legislative work: https://www.rada.gov.ua/en/news/News/top_news/231895.html"
  - "IMF, Ukraine EFF review: https://www.imf.org/en/news/articles/2023/06/29/pr23249-ukraine-imf-exec-board-completes-1st-review-eff-arrangement"
notes: "War-related measures describe emergency administration, not a normative programme for a post-war economy."
