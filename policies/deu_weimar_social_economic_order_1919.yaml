# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: deu_weimar_social_economic_order_1919
status: candidate
title: Weimar constitutional social and economic order
countries: [DEU]
timeframe: {start: 1919, end: 1932, enacted_date: "1919-08-11"}
description: >
  The Weimar Constitution created a parliamentary republic, guaranteed political and
  social rights, and recognised public responsibilities in economic life while
  preserving private property and enterprise. Subsequent administrations navigated
  hyperinflation, stabilisation, international reparations arrangements, and the Great
  Depression; the later crisis undermined democratic government.
enacted_by: [germany_weimar_republic_and_economic_crises_1918_1932]
coalition_label_at_enactment: Weimar coalition and successive parliamentary governments
axes_moved:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: strong, intended: true, rationale: "The constitution established a parliamentary republic and an extensive rights framework."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: moderate, intended: true, rationale: "Social commitments and reconstruction coexisted with later deflationary adjustment."}
references:
  - "German Federal Agency for Civic Education, Weimar Republic crisis conditions: https://www.bpb.de/themen/erster-weltkrieg-weimar/weimarer-republik/276646/krisenbedingungen-der-weimarer-republik/"
notes: "A constitutional and period-level record; it does not imply a uniform economic policy throughout the republic."
