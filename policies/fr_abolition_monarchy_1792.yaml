policy_id: fr_abolition_monarchy_1792
status: candidate
title: National Convention abolishes the monarchy
countries: [FRA]
timeframe:
  start: 1792
  end: 1792
  enacted_date: "1792-09-21"
description: >
  The National Convention abolished the French monarchy and established the
  First Republic. Its election used broad male suffrage, though war and
  revolutionary conflict shaped the new regime's institutions and practice.
enacted_by:
  - fr_convention_directory_1792_1799
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    intended: true
    rationale: The Convention replaced hereditary monarchy with a republic and national representative assembly, without ensuring stable constitutional constraints or equal participation for all residents.
references:
  - "French National Assembly, Convention and end of the monarchy: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/la-convention-nationale-et-la-fin-de-la-royaute"
notes: Candidate coding of the institutional change; not a characterization of subsequent revolutionary government.
