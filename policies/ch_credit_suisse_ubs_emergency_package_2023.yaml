policy_id: ch_credit_suisse_ubs_emergency_package_2023
status: candidate
title: Swiss emergency measures enabling the UBS-Credit Suisse takeover
countries: [CHE]
timeframe:
  start: 2023
  end: 2023
  enacted_date: '2023-03-19'
  effective_date: '2023-03-19'
description: >-
  On 19 March 2023, the Swiss Federal Council adopted emergency measures
  supporting UBS's acquisition of Credit Suisse, including a federal
  guarantee for Swiss National Bank liquidity assistance and a separate
  potential loss-protection guarantee for UBS. FINMA approved the takeover
  that day. The corporate merger was legally completed on 12 June 2023;
  the federal guarantees were terminated in August 2023. The rescue
  measures and the later legal closing are distinct events.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
evaluation_design:
  event_dates:
    - '2023-03-19 emergency package adopted and FINMA takeover approval'
    - '2023-06-12 corporate merger legally completed'
    - '2023-08-11 federal guarantees terminated'
  notes: >-
    The first policy exposure is the emergency state package, not the
    later corporate closing. No counterfactual stability effect is coded.
references:
  - https://www.efd.admin.ch/en/credit-suisse-en
  - https://www.finma.ch/en/news/2023/03/20230319-mm-cs-ubs/
  - https://www.finma.ch/en/news/2023/06/20230612-mm-vollzug-zusammenschluss-ubs-cs/
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  The emergency decision and transaction dates are source-backed. This
  record does not score financial deregulation or claim a measured effect.
