# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_aeoi_crs_start_2017
status: candidate
title: Swiss automatic financial-account information exchange from 2017
countries: [CHE]
timeframe:
  start: 2017
  end: ongoing
  enacted_date: '2015-12-18'
  effective_date: '2017-01-01'
description: >-
  The Swiss Federal Assembly adopted the legal framework for automatic
  exchange of financial-account information on 18 December 2015. The
  implementing legal basis entered into force on 1 January 2017, when
  institutions began collecting reportable information for participating
  partner jurisdictions under the OECD Common Reporting Standard and
  related agreements. The first exchanges occurred in 2018, after the
  initial collection year; entry into force is not an observed outcome.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
evaluation_design:
  event_dates:
    - '2015-12-18 federal adoption of the AEOI legal framework'
    - '2017-01-01 Swiss AEOI legal basis entered into force'
    - '2018 first exchanges of 2017 account information'
  notes: >-
    The Swiss legal start and the first cross-border data exchanges are
    separate exposure dates. Partner jurisdictions entered at different times.
references:
  - https://www.sif.admin.ch/en/legal-basis-aeoi
  - https://www.sif.admin.ch/en/automatic-exchange-information-aeoi
  - https://www.europa.eda.admin.ch/en/automatic-exchange-of-information-in-tax-matters
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  This record establishes the Swiss legal and collection timeline only;
  it does not assign a tax-compliance effect or school credit.
