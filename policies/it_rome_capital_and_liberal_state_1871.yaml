# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: it_rome_capital_and_liberal_state_1871
status: candidate
title: Rome becomes the seat of the Italian government
countries: [ITA]
timeframe: {start: 1871, end: 1871}
description: >
  Following Rome's annexation in 1870, the Italian Parliament legislated the
  transfer of the national government from Florence to Rome in February 1871.
  This completed an important stage in territorial and administrative
  consolidation under the Kingdom of Italy; it did not by itself broaden
  suffrage or create a fully democratic system.
enacted_by: [italy_liberal_monarchy_state_consolidation_1871_1900]
axes_moved:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    intended: true
    rationale: National institutions were consolidated in the capital of the newly unified state; political representation remained narrow.
references:
  - "Italian Senate, 11th Legislature (1870–1874), Rome annexation and transfer of the seat of government: https://www.senato.it/node/84617/printable/print"
notes: "The small institutional step represents administrative integration only; the period's limited franchise is not coded as broad democratic inclusion."
