# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: ch_eu_programmes_agreement_2025
status: candidate
title: Switzerland-EU programmes agreement, provisionally applied from 2025
countries: [CHE]
timeframe:
  start: 2025
  end: ongoing
  signed_date: '2025-11-10'
  effective_date: '2025-01-01'
description: >-
  Switzerland and the EU signed the EU Programmes Agreement on 10 November
  2025. Its provisional application associates Switzerland with Horizon
  Europe, Euratom and Digital Europe retroactively from 1 January 2025.
  The agreement is an advance element of the wider Bilaterals III package;
  it does not put that package into force or establish later association
  with ITER, Erasmus+ or EU4Health.
enacted_by:
  - switzerland_federal_council_ordoliberal_continuity_1992_present
evaluation_design:
  event_dates:
    - '2025-01-01 retroactive start of provisional programme association'
    - '2025-11-10 agreement signed in Bern'
  known_data_gaps:
    - Grant-award and disbursement dates for Swiss participants are not established by the agreement date.
    - Ratification and formal entry into force of the wider Bilaterals III package are separate and not credited here.
  notes: >-
    Effective_date is the official retroactive provisional-application date,
    not a claim that any grant was paid on 1 January. Signed_date is the
    actual signature. No generic trade-openness axis or research-outcome
    hypothesis is inferred from association eligibility alone.
references:
  - https://www.europa.eda.admin.ch/en/newnsb/_AfAX1ioyLE_IqIi_raOP
  - https://research-and-innovation.ec.europa.eu/news/all-research-and-innovation-news/updates-association-third-countries-horizon-europe-2021-12-21_en
  - https://www.europa.eda.admin.ch/en/package-switzerland-eu
suppress_inferred_axis_links: true
linked_hypotheses_inferred: []
disclosure: >-
  Signed and provisionally applied programme agreement only. No measured
  programme, innovation, growth, causal or school-score outcome is assigned.
