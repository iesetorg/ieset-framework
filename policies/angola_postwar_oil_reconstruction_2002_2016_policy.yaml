# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: angola_postwar_oil_reconstruction_2002_2016_policy
status: candidate
title: Angola's oil-financed postwar reconstruction
countries: [AGO]
timeframe: {start: 2002, end: 2016}
description: >
  The 2002 peace agreement ended 27 years of civil war. The government
  prioritised demobilisation, resettlement, national reconstruction, and
  rebuilding financial stability, while oil exports financed a large public
  investment programme. The state's role in the economy remained extensive,
  and dependence on petroleum left public finances exposed to the 2014-2016
  oil-price shock.
enacted_by: [angola_postwar_oil_reconstruction_2002_2016]
scope: national
coalition_label_at_enactment: MPLA government
axes_moved:
  - {axis: fiscal.spending_level, direction: +, magnitude: strong, intended: true, rationale: Postwar reconstruction and infrastructure were funded substantially through oil revenues.}
references:
  - "IMF, Angola 2003 Article IV consultation: https://www.imf.org/en/news/articles/2015/09/28/04/53/pn03115"
  - "World Bank, Angola Country Economic Memorandum: https://www.worldbank.org/en/country/angola/publication/angola-country-economic-memorandum-moving-beyond-oil"
notes: "Oil revenue is not equivalent to broad-based diversification or household prosperity."
