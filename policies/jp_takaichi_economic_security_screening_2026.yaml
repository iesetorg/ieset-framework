policy_id: jp_takaichi_economic_security_screening_2026
status: candidate
title: Japan JFIC interagency foreign-investment review launch
countries:
- JPN
timeframe:
  start: 2026
  end: ongoing
  enacted_date: '2026-06-29'
description: >
  The 2026 Foreign Exchange and Foreign Trade Act amendment was promulgated on
  5 June. Its interministerial coordination section took effect that day. The
  Japan Foreign Investment Committee (JFIC) was launched on 29 June to bring
  relevant ministries' information and views into existing inward-investment
  screening. The broader changes to regulated investment scope and risk
  mitigation are scheduled to take effect on 4 January 2027 and are not part
  of this 2026 step. The February strategic-field roadmap remains an agenda,
  not an enacted element of this record.
enacted_by:
- japan_takaichi_ldp_2025_present
axes_moved:
- axis: regulatory.sectoral_licensing
  direction: +
  magnitude: weak
  intended: true
  rationale: The operational JFIC adds a modest interagency screening layer to existing foreign-investment review; the broader 2027 statutory scope expansion is excluded.
references:
- 'Ministry of Finance, 2026 FEFTA amendment promulgated 5 June: https://www.mof.go.jp/english/policy/international_policy/fdi/20260518180731.html'
- 'Ministry of Finance, JFIC establishment and 29 June first meeting: https://www.mof.go.jp/policy/international_policy/gaitame_kawase/fdi/20260618215004.html'
- 'Ministry of Finance, statutory coordination effective 5 June 2026; broader screening provisions effective 4 January 2027: https://www.mof.go.jp/policy/international_policy/gaitame_kawase/fdi/260916_koukaiyou_gaiyou_eigo.pdf'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: "Score only JFIC's operational coordination from 29 June 2026. Do not infer a trade-openness change or predate the 2027 screening-scope rules."
