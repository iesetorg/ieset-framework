policy_id: kr_eu_fta_provisional_application_2011
status: candidate
title: EU–Republic of Korea FTA provisional application in 2011
countries:
- KOR
timeframe:
  start: 2011
  end: ongoing
  effective_date: '2011-07-01'
description: >-
  The EU–Republic of Korea Free Trade Agreement began provisional application
  on 1 July 2011. It removed most import duties at the outset and phased out
  most remaining duties over five years, while addressing selected non-tariff
  barriers. This Korean policy record identifies a treaty regime and its legal
  application date; the EU is a bloc and is not coded as a country. It does not
  assert a measured export, growth, employment, or welfare effect.
enacted_by:
- skorea_lee_myung_bak_gnp_2008_2013
coalition_label_at_enactment: Lee Myung-bak government; agreement with the European Union
axes_moved:
- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  intended: true
  rationale: Provisional application began tariff removal and market-access commitments on 1 July 2011.
references:
