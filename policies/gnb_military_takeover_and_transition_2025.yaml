# yaml-language-server: $schema=../schemas/policy.schema.json
policy_id: gnb_military_takeover_and_transition_2025
status: candidate
title: Guinea-Bissau military takeover and disputed transition programme
countries: [GNB]
timeframe: {start: 2025, end: ongoing, enacted_date: "2025-11-26"}
description: >
  Military officers seized power following the November 2025 general elections,
  detained political and electoral officials, and announced a transition
  programme. The United Nations condemned the coup and called for constitutional
  order to be restored; ECOWAS rejected the military's transition programme and
  called for the election process and political freedoms to be respected.
enacted_by: [guinea_bissau_military_transition_after_coup_2025_present]
coalition_label_at_enactment: Military leadership and transitional authorities
axes_moved:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, intended: false, rationale: "The takeover interrupted the electoral process and constitutional transfer of power."}
references:
  - "UN Secretary-General, statement on Guinea-Bissau, 27 November 2025: https://www.un.org/sg/en/content/sg/statements/2025-11-27/statement-attributable-the-spokesperson-for-the-secretary-general-guinea-bissau"
  - "ECOWAS, 68th Summit communiqué, 14 December 2025: https://www.ecowas.int/ecowas-heads-of-state-reaffirm-commitment-to-democracy-peace-and-regional-stability-at-their-68th-summit-in-abuja/"
notes: "This captures the institutional takeover; it does not assert that the election outcome was resolved or the announced transition accepted by regional bodies."
