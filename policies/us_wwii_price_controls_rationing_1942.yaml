policy_id: us_wwii_price_controls_rationing_1942
status: candidate
title: Emergency Price Control Act and wartime rationing
countries: [USA]
timeframe: {start: 1942, end: 1946, enacted_date: '1942-01-30'}
description: >
  The Emergency Price Control Act authorized maximum price ceilings and rent
  controls, and the Office of Price Administration administered price
  stabilization and rationing of scarce civilian goods during World War II.
  The system affected household purchases across the country and was wound
  down after the emergency, with the OPA abolished in 1947. It is coded as a
  temporary intervention in market prices and allocation, not as a measure of
  permanent peacetime regulation.
enacted_by:
  - us_wwii_economic_mobilization_1940_1945
axes_moved:
  - axis: regulatory.price_control_intensity
    direction: "+"
    magnitude: strong
    intended: true
    rationale: Statutory ceilings on prices and rents and extensive commodity rationing constrained market-clearing allocation.
references:
  - "Emergency Price Control Act, 56 Stat. 23 (1942)"
  - "National Archives, Office of Price Administration records: https://www.archives.gov/research/guide-fed-records/groups/188.html"
  - "National Archives, America on the Homefront: https://www.archives.gov/boston/exhibits/homefront"
