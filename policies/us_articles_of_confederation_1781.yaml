policy_id: us_articles_of_confederation_1781
status: candidate
title: Articles of Confederation enter into force for the thirteen United States, 1781
countries: [USA]
scope: national
timeframe:
  start: 1781
  end: 1789
  effective_date: '1781-03-01'
description: >
  Ratification by the thirteenth state, Maryland, brought the Articles of
  Confederation into force on 1 March 1781 as the United States' first written
  national constitution. The Articles joined the thirteen named states in a
  confederation, reserved undelegated powers to each state, and gave Congress
  specified common powers while leaving it without an independent general
  taxing or interstate-commerce power. The later Constitution replaced this
  national framework in 1789.
references:
- 'U.S. National Archives, original Articles of Confederation transcript and ratification history, including force from 1 March 1781: https://www.archives.gov/milestone-documents/articles-of-confederation'
- 'U.S. Department of State, Office of the Historian, Articles took effect on 1 March 1781: https://history.state.gov/milestones/1776-1783/continental-congress'
- 'U.S. National Archives, constitutional succession timeline, old Confederation ended 3 March 1789 and new government began legally 4 March: https://www.archives.gov/founding-docs/constitution-q-and-a'
linked_hypotheses_inferred: []
suppress_inferred_axis_links: true
notes: >
  The original instrument names thirteen founding states. USA identifies the
  institutional predecessor of today's United States; it does not assert that
  the confederation governed all land or people within today's U.S. borders.
  Congress adopted the text on 15 November 1777, but unanimous ratification
  and legal force came on 1 March 1781. The 1789 end marks replacement by the
  Constitution; no exact end field exists in this schema. This record is
  policy context only, with no movement link, signed axis, measured effect,
  hypothesis verdict, or numeric country-drift step.
