# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: myanmar_slorc_spdc_market_opening_1989_2010
status: candidate
name: Myanmar SLORC and SPDC military rule with partial market opening
countries: [MMR]
timeframe: {start: 1989, end: 2010}
coalition: "State Law and Order Restoration Council (SLORC), later State Peace and Development Council (SPDC)"
leaders: ["Than Shwe (SPDC Chairman, 1992–2011)"]
doctrine: >
  After the 1988 uprising, the military government abandoned parts of the Burmese Way
  to Socialism and permitted partial market reforms: private external trade, foreign
  investment, private agricultural sales, and some domestic business activity. The
  reforms remained limited and inconsistent within military rule, state-owned
  enterprises, sanctions, and severe institutional constraints. The 1990 election
  result was not honoured and ASEAN membership came in 1997. This is coded as
  authoritarian market opening, not democratisation.
policies: [mmr_partial_market_opening_1988]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Foreign-investment law and external trade opening partially reversed the prior inward-looking model."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Private firms and agricultural markets were permitted, although military and state control remained extensive."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "Military rule persisted and the 1990 election result was ignored."}
predecessor_movements: [mmr_burmese_way_to_socialism_1962]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Partial market opening occurred without political liberty, secure rule of law, or a consistent regulatory environment."}
  - {position_id: institutionalism, alignment: opposed, notes: "Military rule displaced competitive constitutional government despite selective market opening."}
references:
  - "IMF, Myanmar 1997 Article IV: https://www.elibrary.imf.org/view/journals/002/1997/031/article-A001-en.xml"
  - "World Bank, Myanmar Economic Transition amid Conflict: https://documents1.worldbank.org/curated/en/507421574785059413/pdf/Myanmar-Economic-Transition-amid-Conflict.pdf"
notes: "Ends with the 2010 election and 2011 transition; political and economic opening remained limited under the military regime."
