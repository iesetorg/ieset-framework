doctrine: The Third Republic governed through the First World War and a difficult interwar period of reconstruction,
  coalition turnover, fiscal disputes, and efforts to preserve parliamentary republican institutions. The Union
  sacrée wartime coalition gave way to contested postwar financial and political realignment before the Popular
  Front period.
