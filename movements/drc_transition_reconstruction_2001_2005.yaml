# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: drc_transition_reconstruction_2001_2005
status: candidate
name: Joseph Kabila peace process and macroeconomic stabilisation
countries: [COD]
timeframe: {start: 2001, end: 2005}
coalition: Transitional government and inter-Congolese dialogue
leaders: [Joseph Kabila]
doctrine: >
  From 2001, the government pursued peace talks, national reconstruction, and
  macroeconomic stabilisation. Reforms unified exchange rates, liberalised
  prices and trade, restored budget procedures, and created a framework for
  private-sector activity. The 2003 transitional government prepared the
  country for the 2006 elections, while armed conflict persisted in the east.
policies: [drc_transition_reconstruction_2001_2005_policy]
axes_summary:
  - {axis: monetary.central_bank_independence, direction: +, magnitude: moderate, rationale: Reforms restored monetary discipline and moved away from direct fiscal financing.}
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, rationale: The government unified exchange rates and liberalised trade and prices.}
  - {axis: institutional.rule_of_law, direction: +, magnitude: weak, rationale: "The peace process and transitional arrangements prepared for national elections, although security remained fragile."}
references:
  - "IMF, DRC 2001 Enhanced Interim Program: https://www.imf.org/external/np/loi/2001/cod/01/index.htm"
  - "IMF, DRC 2002 reconstruction programme: https://www.imf.org/external/np/loi/2002/cod/02/index.htm"
  - "UN MONUC, mission background: https://peacekeeping.un.org/sites/default/files/past/monuc/background.shtml"
notes: "The national transition coexisted with continued insecurity and weak state reach in the east."
