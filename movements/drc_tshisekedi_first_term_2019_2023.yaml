# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: drc_tshisekedi_first_term_2019_2023
status: candidate
name: Tshisekedi's first term and post-election economic programme
countries: [COD]
timeframe: {start: 2019, end: 2023}
coalition: Coalition governments under Félix Tshisekedi
leaders: [Félix Tshisekedi]
doctrine: >
  Félix Tshisekedi's inauguration in January 2019 marked the DRC's first
  peaceful presidential transfer of power. His programme promised improved
  governance, infrastructure, social inclusion, and free basic education, while
  cooperation with the IMF resumed and public financial management remained a
  central constraint. Coalition bargaining with the former ruling majority
  limited the executive's room to implement its agenda.
policies: [drc_tshisekedi_first_term_2019_2023_policy]
axes_summary:
  - {axis: institutional.rule_of_law, direction: +, magnitude: weak, rationale: A peaceful presidential transfer created a new opening for institutional accountability.}
  - {axis: fiscal.transfer_expansion, direction: +, magnitude: moderate, rationale: The free basic education initiative expanded publicly funded provision.}
  - {axis: fiscal.spending_level, direction: +, magnitude: weak, rationale: The 100-day programme prioritised infrastructure and public investment.}
references:
  - "IMF, DRC 2019 Article IV: https://www.elibrary.imf.org/downloadpdf/view/journals/002/2019/285/article-A001-en.pdf"
  - "IMF, DRC programme review: https://www.imf.org/en/news/articles/2019/12/20/na122019five-takeaways-from-the-democratic-republic-of-the-congos-imf-program"
notes: "This ends before the second term beginning in 2024, which is represented by a separate movement."
