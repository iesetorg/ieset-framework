# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: bulgaria_eu_member_state_economic_governance_2007_2022
status: candidate
name: Bulgaria EU-member economic governance and coalition politics
countries: [BGR]
timeframe: {start: 2007, end: 2022}
coalition: "Successive coalition and GERB-led governments"
leaders: ["Boyko Borisov (Prime Minister, 2009–2021, in three terms)"]
doctrine: >
  EU membership consolidated open-market rules, competition and state-aid constraints,
  and access to the single market. Governments maintained a currency board, low public
  debt, and comparatively low tax rates while using EU funds and public investment for
  development. Coalition instability and corruption concerns limited institutional
  convergence; the period ended amid repeated elections and political fragmentation.
policies: [bg_eu_membership_and_currency_board_continuity_2007]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "EU single-market membership continued to structure trade and investment rules."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "Fiscal restraint coexisted with EU-funded public investment and subsidies."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Formal EU legal alignment coexisted with persistent rule-of-law and corruption concerns."}
predecessor_movements: [bulgaria_currency_board_eu_accession_reforms_1997_2007]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Open-market membership and fiscal restraint coexist with targeted public spending and EU-supported development."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "EU legal frameworks apply, but domestic institutional performance has remained contested."}
references:
  - "World Bank, Bulgaria stabilization and EU accession structural reforms: https://documents1.worldbank.org/curated/en/253381468015849237/pdf/342330BG.pdf"
notes: "The interval closes the large pre-2023 gap; later political movements are recorded separately from 2023 onward."
