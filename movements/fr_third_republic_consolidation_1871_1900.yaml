# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_third_republic_consolidation_1871_1900
status: candidate
name: French Third Republic — constitutional consolidation
countries: [FRA]
timeframe: {start: 1871, end: 1900}
coalition: Republican and monarchist parliamentary blocs under the provisional National Assembly and Third Republic
leaders: ["Adolphe Thiers", "Patrice de MacMahon", "Jules Grévy"]
doctrine: >
  After the fall of the Second Empire, the elected National Assembly governed
  provisionally while republican and monarchist blocs contested the form of
  the state. The 1875 constitutional laws established a bicameral parliamentary
  republic and were revised in 1884. The settlement consolidated republican
  institutions but preserved an indirect election for the president and
  excluded women and colonial subjects from equal political participation.
policies: [fr_third_republic_constitutional_laws_1875]
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The 1875 constitutional laws replaced provisional arrangements with a durable parliamentary republic.
    drift_attribution_year: 1875
    drift_attribution_basis: The constitutional laws were adopted in February and July 1875 to define the new Republic's institutions.
references:
  - "Élysée, Constitutional Laws of 1875: https://www.elysee.fr/la-presidence/les-lois-constitutionnelles-de-1875"
  - "French National Assembly, History of the National Assembly: https://www.assemblee-nationale.fr/histoire/7da.asp"
notes: "This fills a documented institutional interval from 1871; it is not evidence of annual policy change through 1900."
