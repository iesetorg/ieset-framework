# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_federalist_state_building_1789_1800
status: candidate
name: Federalist-era constitutional and fiscal state building
countries: [USA]
timeframe: {start: 1789, end: 1800}
coalition: Washington and Adams administrations; Hamiltonian Federalist fiscal program, contested by Democratic-Republicans
leaders:
  - George Washington
  - Alexander Hamilton
  - John Adams
doctrine: >
  Federalists argued that the new republic required a capable national government,
  public credit, customs-based revenue, and common institutions to stabilize the
  union and support commerce. Their constitutional and fiscal program was
  vigorously contested by Democratic-Republicans who favored narrower federal
  powers and greater state authority. The coding describes enacted federal
  institution-building in the period, not a settled consensus or an estimate of
  the total size of the state.
policies:
  - us_constitutional_government_1789
  - us_hamilton_public_credit_1790
  - us_first_bank_1791
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: Ratification placed durable federal institutions and a supreme-law framework into operation; the contested ratification and subsequent Bill of Rights are part of the same constitutional settlement.
    drift_attribution_year: 1789
    drift_attribution_basis: The Constitution's federal government began operating on March 4, 1789; the national government and its commerce and taxation powers were the discrete institutional change coded.
  - axis: regulatory.product_market_competition
    direction: "+"
    magnitude: weak
    rationale: The Constitution supplied federal authority for common interstate-commerce rules; this is a change in legal capacity, not evidence that a single competitive national market immediately resulted.
    drift_attribution_year: 1789
    drift_attribution_basis: The Constitution's commerce authority took effect with the new federal government in 1789.
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: moderate
    rationale: Federal assumption and funding of public debt expanded federal fiscal responsibilities and revenue administration without establishing a measured spending-to-GDP change.
    drift_attribution_year: 1790
    drift_attribution_basis: Congress authorized the federal funding and debt-assumption plan in 1790.
  - axis: regulatory.financial_deregulation
    direction: "-"
    magnitude: weak
    rationale: The First Bank's federal charter added a national oversight and fiscal-agent institution to a still largely state-based banking system.
    drift_attribution_year: 1791
    drift_attribution_basis: The First Bank charter was signed on February 25, 1791.
references:
  - "U.S. National Archives, The Constitution: How Did it Happen?: https://www.archives.gov/founding-docs/constitution/how-did-it-happen"
  - "U.S. Treasury, Alexander Hamilton (1789–1795): https://home.treasury.gov/about/history/prior-secretaries/alexander-hamilton-1789-1795"
  - "U.S. House of Representatives, The First Bank of the United States: https://history.house.gov/Historical-Highlights/1700s/1791_First_Bank/"
notes: >
  This is the first coded national U.S. movement in the extended map. It does
  not cover the colonial economy, Indigenous polities, slavery, state-level
  systems, or the full range of Federalist and Democratic-Republican policies.
  The 1789 movement-start context is historical and institutional, not a
  numerical market/state score.
