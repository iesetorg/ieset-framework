# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: bulgaria_postcommunist_transition_1990_1997
status: candidate
name: Bulgaria post-communist transition and macroeconomic crisis
countries: [BGR]
timeframe: {start: 1990, end: 1997}
coalition: "Successive post-communist coalition governments"
leaders: ["Zhelyu Zhelev (President, 1990–1997)", "Zhan Videnov (Prime Minister, 1995–1997)"]
doctrine: >
  The fall of communist one-party rule began a difficult transition to electoral
  democracy and a market economy. Early governments moved unevenly on privatisation,
  price liberalisation, and stabilisation. Stop-start reforms, soft budget constraints,
  and weak institutions contributed to the 1996–1997 banking and hyperinflation crisis.
  The period was a contested transition rather than a single coherent liberal reform
  programme.
policies: [bg_postcommunist_market_transition_and_crisis_1990]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "Competitive elections and constitutional pluralism replaced communist one-party rule."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Price and ownership transitions began, but implementation was slow and uneven."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: moderate, rationale: "The transition included fiscal instability, soft budget constraints, and later crisis adjustment."}
predecessor_movements: [bulgaria_communist_state_building_1944_1989]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "A pluralist political system was created, while governance and market institutions remained fragile."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Market transition began, but reforms were inconsistent and the state retained a large economic role."}
references:
  - "World Bank, Bulgaria transition and 1996–1997 crisis: https://documents1.worldbank.org/curated/en/984761468769131587/pdf/multi0page.pdf"
notes: "Ends with the 1997 change in government and adoption of the currency board."
