doctrine: The Mackenzie government governed through a severe post-1873 economic downturn, pursued civil-service
  and electoral reform, and advanced the Canadian Pacific Railway project with public support. Its fiscal restraint
  and reform programme operated within a young federal dominion still dependent on customs revenue and infrastructure
  building.
