# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: italy_unification_1861_1870
status: candidate
name: Italian unification and parliamentary monarchy
countries: [ITA]
timeframe: {start: 1861, end: 1870}
coalition: Kingdom of Sardinia leadership and the parliamentary movement for Italian unification
leaders:
  - Victor Emmanuel II
  - Camillo Benso, Count of Cavour
  - Giuseppe Garibaldi
doctrine: >
  Unification joined most of the peninsula's states into the Kingdom of Italy
  under a constitutional monarchy and Parliament, with the capital transferred
  to Rome in 1871. Political participation remained sharply limited by
  property and tax qualifications, and unification was accomplished through
  war, annexation, and plebiscites with uneven local consent.
policies:
  - italy_kingdom_proclaimed_1861
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: A national parliament and state replaced the peninsula's multiple sovereign states, while suffrage remained restricted and political incorporation uneven.
    drift_attribution_year: 1861
    drift_attribution_basis: The first Italian Parliament proclaimed the Kingdom of Italy on 17 March 1861.
references:
  - "Italian Chamber of Deputies, A Day at Montecitorio (history of Italian Parliament): https://www.camera.it/application/xmanager/projects/leg17/attachments/pubblicazione/pdfs/000/000/778/Montecitorio_ingl_def.pdf"
notes: Candidate backfill for national state formation; it does not equate unification with broad democratic inclusion.
