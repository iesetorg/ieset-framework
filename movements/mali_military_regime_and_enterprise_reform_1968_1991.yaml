movement_id: mali_military_regime_and_enterprise_reform_1968_1991
status: candidate
name: Military-led regime and state-enterprise adjustment
countries:
- MLI
timeframe:
  start: 1968
  end: 1990
coalition: Military government and Democratic Union of the Malian People
leaders:
- Moussa Traore
doctrine: The 1968 coup ended the First Republic. Military-led government restricted political activity
  and later established a single constitutional party. From the 1980s, structural adjustment and public-enterprise
  reform began to reduce the state’s role in some sectors, creating a mixed trajectory of political closure
  and gradual market reform.
policies:
- mali_military_regime_and_enterprise_reform_1968_1991_policy
axes_summary:
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  rationale: The coup suspended the constitution and political activity was heavily restricted.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  rationale: From 1982, structural-adjustment agreements and public-enterprise reforms began a gradual
    shift toward private activity.
- axis: fiscal.spending_level
  direction: '-'
  magnitude: weak
  rationale: Enterprise restructuring and civil-service reductions sought to reduce the public-sector
    burden.
