# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: kazakhstan_tokayev_fair_state_market_reform_2019_present
status: candidate
name: "Tokayev's Fair Kazakhstan and economic reform programme"
countries: [KAZ]
timeframe: {start: 2019, end: ongoing}
coalition: "Presidency of Kassym-Jomart Tokayev and successive governments"
leaders:
  - "Kassym-Jomart Tokayev (President from 2019)"
policies: [kz_tokayev_economic_liberalisation_decree_2024]
doctrine: >
  The Tokayev administration has continued state-led development planning
  while calling for political modernisation, more competitive markets, and a
  reduced role for state capitalism. Its programme combines stronger social
  support and public-administration reform with privatization, removal of
  redundant business rules, private-enterprise development, and diversification
  away from raw-material dependence. These are declared policy directions,
  not proof that the state has withdrawn from the economy.
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "The administration has directed removal of redundant business requirements, reduced administrative price controls, and promoted private-sector competition and entrepreneurship."}
  - {axis: institutional.property_rights, direction: "+", magnitude: weak, rationale: "Official programmes call for protection of private property and transparent rules while also returning some assets to state ownership; the net direction is therefore modest."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "National development planning, social support, and infrastructure priorities preserve a substantial state role, though their net spending change is not quantified here."}
  - {axis: fiscal.sectoral_subsidy, direction: "mixed", magnitude: moderate, rationale: "Industrial diversification and strategic infrastructure remain state-directed while the government also seeks less direct state participation in commercial activity."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Political and administrative reform agendas emphasize accountability, local governance, and clearer rules, with implementation quality not inferred."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The state continues strategic planning and public investment, but current policy also explicitly seeks a smaller state role in commercial markets."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Competition, entrepreneurship, private property, and deregulation are stated goals, within a state-led political economy."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "Constitutional and administrative reforms are central to the government's stated programme, while the extent of political competition remains a separate empirical question."}
references:
  - "President of Kazakhstan, State of the Nation Address on economic and political reform: https://mirror.akorda.kz/en/president-kassym-jomart-tokayevs-state-of-the-nation-address-181857"
  - "President of Kazakhstan, 2024 Address on economic liberalisation and reducing state participation: https://mirror.akorda.kz/en/president-kassym-jomart-tokayevs-state-of-the-nation-address-just-kazakhstan-law-and-order-economic-growth-social-optimism-482433"
  - "President of Kazakhstan, National Development Plan 2025 and state-planning reforms: https://mirror.akorda.kz/en/state-of-the-nation-addressby-president-of-the-republic-of-kazakhstan-kassym-jomart-tokayev-38126"
  - "President of Kazakhstan, 2025 address on reducing the role of state-owned enterprises: https://node2.akorda.kz/en/president-kassym-jomart-tokayevs-state-of-the-nation-address-to-the-people-of-kazakhstan-kazakhstan-in-the-era-of-artificial-intelligence-current-challenges-and-solutions-through-digital-transformation-1083029"
notes: "Starts with Tokayev's 2019 presidency and tracks programme shifts through the most recent 2025 presidential address. It does not treat presidential announcements as implemented effects."
