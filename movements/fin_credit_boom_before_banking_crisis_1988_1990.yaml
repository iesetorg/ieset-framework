doctrine: Financial liberalisation and buoyant external demand fuelled rapid growth and credit expansion during
  the late 1980s. Monetary policy tightened in 1989 as asset prices turned; the period ends at the onset of the
  banking and output downturn, before the deeper 1991–93 recession.
policies:
- fin_credit_boom_before_banking_crisis_1988_1990_policy
