  direction: +
  magnitude: moderate
  rationale: Financial liberalisation supported rapid credit growth before the crisis.
- axis: monetary.monetary_expansion_direction
  direction: '-'
  magnitude: weak
  rationale: Monetary policy tightened in 1989 to restrain overheating and inflation.
