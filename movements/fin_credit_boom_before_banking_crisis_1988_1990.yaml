movement_id: fin_credit_boom_before_banking_crisis_1988_1990
status: candidate
name: Finland’s credit boom and early banking-crisis turn, 1988–1990
countries:
- FIN
timeframe:
  start: 1988
  end: 1990
coalition: Harri Holkeri National Coalition–Social Democratic coalition
leaders:
