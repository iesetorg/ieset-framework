# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: afg_national_unity_aid_transition_2014_2020
status: candidate
name: National Unity Government and aid drawdown
countries: [AFG]
timeframe: {start: 2014, end: 2020}
coalition: National Unity Government
leaders: [Ashraf Ghani, Abdullah Abdullah]
doctrine: >
  The disputed 2014 election produced a power-sharing National Unity Government
  as international security forces drew down and grants began to fall. Public
  institutions and services continued, but political disputes, deteriorating
  security, declining donor support, and the 2020 pandemic sharply constrained
  growth and the state's fiscal room before the August 2021 change of regime.
policies: [afg_national_unity_aid_transition_2014_2020_policy]
axes_summary:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: Grants declined substantially from their 2009 peak and constrained public spending.}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: weak, rationale: The disputed 2014 election and extra-constitutional power-sharing arrangement disrupted formal governance.}
references:
  - "World Bank, Afghanistan Development Update 2021: https://thedocs.worldbank.org/en/doc/e406b6f24c2b7fdeb93b56c3116ed8f1-0310012021/original/Afghanistan-Development-Update-FINAL.pdf"
  - "World Bank, Afghanistan development priorities: https://thedocs.worldbank.org/en/doc/8033eefca38ca8af7b653869a3469087-0310012021/original/Policy-Notes-report-Jan-12-2021-Final-version-2.pdf"
notes: "The 2021 takeover is coded separately and is not treated as an ordinary transfer of government."
