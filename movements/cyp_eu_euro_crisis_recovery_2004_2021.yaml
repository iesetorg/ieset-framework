movement_id: cyp_eu_euro_crisis_recovery_2004_2021
status: candidate
name: Cyprus EU integration, euro adoption, crisis adjustment, and recovery, 2004–2021
countries:
- CYP
timeframe:
  start: 2004
  end: 2021
coalition: Successive Republic of Cyprus governments during EU accession, euro adoption, and adjustment
leaders:
- Tassos Papadopoulos
- Demetris Christofias
- Nicos Anastasiades
doctrine: Cyprus joined the European Union in 2004, adopted the euro in 2008, and then faced a banking and sovereign
  crisis. The 2013 IMF-supported adjustment restructured major banks and tightened fiscal policy. After a strong
  recovery, pandemic support measures expanded fiscal support again in 2020–21.
policies:
- cyp_eu_euro_crisis_recovery_2004_2021_policy
- cy_euro_adoption_2008
axes_summary:
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  rationale: EU single-market participation and euro-area accession deepened Cyprus’s integration with European
    markets.
- axis: regulatory.financial_deregulation
  direction: '-'
  magnitude: moderate
  rationale: Bank resolution and stronger supervision followed the financial crisis.
- axis: fiscal.spending_level
  direction: mixed
  magnitude: moderate
  rationale: Fiscal consolidation after the bank crisis was followed by temporary pandemic support.
