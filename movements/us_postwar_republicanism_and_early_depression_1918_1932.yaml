# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_postwar_republicanism_and_early_depression_1918_1932
status: candidate
name: United States postwar Republican administrations and early Depression response
countries: [USA]
timeframe: {start: 1918, end: 1932}
coalition: "Republican administrations of Harding, Coolidge, and Hoover"
leaders: ["Warren G. Harding (President, 1921–1923)", "Calvin Coolidge (President, 1923–1929)", "Herbert Hoover (President, 1929–1933)"]
doctrine: >
  After World War I, federal policy shifted toward lower income-tax rates, higher
  protective tariffs, immigration restriction, and a smaller direct domestic role.
  The federal government still shaped markets through the Federal Reserve, farm and
  infrastructure policy, and corporate rules. After the 1929 crash, Hoover expanded
  federal credit and emergency intervention, including the Reconstruction Finance
  Corporation and Banking Act of 1932, but avoided the scale of the later New Deal.
  The movement therefore spans a low-spending 1920s model and a limited early-crisis
  response.
policies: [us_fordney_mccumber_and_smoot_hawley_tariffs_1922_1930]
axes_summary:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "The 1920s emphasised federal retrenchment, followed by limited emergency credit intervention under Hoover."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: strong, rationale: "Fordney–McCumber and Smoot–Hawley raised protective tariffs."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Federal institutions remained intact while immigration restrictions and limited crisis protection narrowed inclusion."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "Federal credit programmes expanded late in the period to support banks, firms, and public entities."}
predecessor_movements: [us_progressive_era_reform_consensus_1901_1917]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Lower taxes and a reduced direct federal role coexisted with strong protectionism and sector-specific intervention."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Federal institutions and infrastructure still shaped the economy, especially as the Depression deepened."}
references:
  - "U.S. Department of Labor, 1920s and start of the Depression: https://www.dol.gov/general/aboutdol/history/dolchp02"
  - "U.S. State Department, Protectionism 1921–1936: https://history.state.gov/milestones/1921-1936/protectionism"
  - "Federal Reserve History, Great Depression: https://www.federalreservehistory.org/essays/great-depression"
notes: "The 1933 start of the existing New Deal movement marks the break with this limited early-Depression response."
