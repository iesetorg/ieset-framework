doctrine: Following the 2020 sovereign default, Lebanon experienced continued bank deposit restrictions, currency
  collapse, high inflation, and a prolonged political impasse. A 2022 IMF staff-level agreement proposed fiscal,
  banking, exchange-rate, and governance reforms, but implementation remained limited through 2024 amid social and
  regional shocks.
