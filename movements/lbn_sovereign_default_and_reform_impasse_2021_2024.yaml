  direction: '-'
  magnitude: moderate
  rationale: The sovereign and banking crisis sharply curtailed public service delivery and fiscal capacity.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: moderate
  rationale: Political deadlock delayed agreed legal and governance reforms.
- axis: regulatory.financial_deregulation
  direction: '-'
  magnitude: moderate
  rationale: Deposit restrictions and bank paralysis constrained ordinary financial intermediation.
