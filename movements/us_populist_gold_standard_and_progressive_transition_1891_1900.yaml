movement_id: us_populist_gold_standard_and_progressive_transition_1891_1900
status: candidate
name: United States Populist challenge, monetary conflict, and turn-of-century realignment
countries: [USA]
timeframe: {start: 1891, end: 1900}
coalition: "Competing Democratic, Republican, and Populist coalitions"
leaders: ["Benjamin Harrison (President, 1889–1893)", "Grover Cleveland (President, 1893–1897)", "William McKinley (President from 1897)"]
doctrine: >
  The Panic of 1893 and depression intensified conflict over the gold standard, silver
  purchases, tariffs, and the power of concentrated industry. The Populist movement
  challenged creditor and railroad power with demands for monetary and political
  reform; the 1896 realignment strengthened the Republican programme of protection and
  gold-based money. The Sherman Silver Purchase Act was repealed in 1893, and the Gold
  Standard Act followed in 1900. The decade mixed market expansion and crisis with
  growing pressure for federal institutional responses.
policies: [us_silver_purchase_repeal_and_panic_1893]
axes_summary:
  - {axis: monetary.central_bank_independence, direction: "mixed", magnitude: weak, rationale: "The central monetary conflict concerned the gold-silver standard and Treasury obligations before the Federal Reserve existed."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: moderate, rationale: "Protectionist tariff policy prevailed in the 1890s political realignment."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "The crisis sharpened disputes over federal revenue, monetary obligations, and public intervention."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Mass political movements and the 1896 realignment broadened contest over economic policy within electoral institutions."}
predecessor_movements: [us_gilded_age_federal_market_rules_1887_1890]
position_alignments:
  - {position_id: classical_liberal, alignment: opposed, notes: "Gold-standard orthodoxy and protective tariffs conflicted with the Populists' monetary and regulatory demands."}
references:
  - "U.S. Department of the Treasury, John G. Carlisle and the 1893 silver repeal: https://home.treasury.gov/about/history/prior-secretaries/john-g-carlisle-1893-1897"
  - "U.S. Senate Committee on Finance, Committee history: https://www.finance.senate.gov/about/history"
notes: "This period follows the existing 1887–1890 federal market-rule entry and ends before the existing Progressive Era movement begins in 1901."
