# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: uk_postwar_mixed_economy_and_consensus_1952_1975
status: candidate
name: United Kingdom post-war mixed economy and cross-party settlement
countries: [GBR]
timeframe: {start: 1952, end: 1975}
coalition: "Conservative and Labour governments under the post-war settlement"
leaders: ["Winston Churchill (Prime Minister, 1951–1955)", "Harold Macmillan (Prime Minister, 1957–1963)", "Harold Wilson (Prime Minister, 1964–1970)", "Edward Heath (Prime Minister, 1970–1974)"]
doctrine: >
  After Labour's 1945–1951 nationalisations and welfare reforms, Conservative and
  Labour governments largely accepted a mixed economy, the National Health Service,
  social insurance, demand management, and continued public ownership of major
  utilities and industries. Conservatives denationalised steel and road haulage but
  did not reverse the wider settlement. By the early 1970s, inflation, industrial
  conflict, energy shocks, and the 1973 oil crisis strained the model and preceded the
  1976 IMF loan and adjustment period.
policies: [uk_cross_party_mixed_economy_1952]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "The welfare state and public services established in the post-war settlement remained durable cross-party commitments."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "Public ownership of utilities and major industries persisted despite selective denationalisation."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: weak, rationale: "Public ownership and planning constrained competition in selected sectors, while most consumer production remained private."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Competitive alternation between Labour and Conservative governments operated under stable parliamentary institutions."}
predecessor_movements: [uk_attlee_welfare_state_1945_1951]
position_alignments:
  - {position_id: social_democratic, alignment: partially_aligned, notes: "Welfare provision and public services were durable while Conservative governments retained market institutions and reversed some nationalisations."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Public ownership and demand management coexisted with private enterprise and cross-party continuity."}
references:
  - "UK Parliament, privatisation and public ownership chronology: https://researchbriefings.files.parliament.uk/documents/RP14-61/RP14-61.pdf"
  - "UK Parliament, Post-War Reconstruction debate (1943): https://hansard.parliament.uk/commons/1943-12-07/debates/25243630-b603-45f3-a497-bd715cce0ea9/Post-WarReconstruction"
notes: "Ends before the 1976 IMF programme and the explicit end-of-consensus movements already in the corpus."
