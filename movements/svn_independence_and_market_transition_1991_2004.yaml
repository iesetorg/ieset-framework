doctrine: After independence in 1991, Slovenia shifted from Yugoslav social ownership and worker management toward
  private ownership through a gradual, hybrid privatisation programme. The 1992 ownership-transformation law launched
  voucher distribution and enterprise restructuring, with EU accession following in 2004.
