  direction: +
  magnitude: moderate
  rationale: Ownership-transformation laws shifted socially-owned enterprises toward private ownership and corporate
    governance.
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  rationale: EU accession negotiations and integration redirected institutions toward the European single market.
