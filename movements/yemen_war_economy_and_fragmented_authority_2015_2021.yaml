# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: yemen_war_economy_and_fragmented_authority_2015_2021
status: candidate
name: Yemen civil war, competing authorities, and fragmented war economy
countries: [YEM]
timeframe: {start: 2015, end: 2021}
coalition: "Internationally recognised Hadi government, Houthi authorities, Southern Transitional Council, and other local forces"
leaders: ["Abdrabbuh Mansur Hadi (President of internationally recognised government through 2022)", "Abdul-Malik al-Houthi (leader of Houthi movement)"]
doctrine: >
  The 2014–2015 conflict fractured Yemen's national institutions and produced competing
  monetary, fiscal, and administrative authorities. Oil and gas production collapsed,
  public wages and services were disrupted, and armed groups and local coalitions
  controlled distinct territories and revenue sources. The nationally recognised
  government and Houthi authorities pursued different regulatory and monetary policies.
  There is no single countrywide market/state direction to assign; this period is coded
  as fragmentation, coercive wartime allocation, and severe state-capacity loss.
policies: [yem_conflict_fragmentation_and_competing_economic_authorities_2015]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "National authority fragmented across competing armed and political administrations."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: strong, rationale: "State revenues, expenditure, and service delivery collapsed unevenly across territories."}
  - {axis: monetary.central_bank_independence, direction: "-", magnitude: strong, rationale: "Competing monetary authorities and exchange-rate regimes replaced unified central-bank governance."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, rationale: "Conflict, blockade, informal control, and administrative fragmentation disrupted ordinary market exchange."}
predecessor_movements: [yemen_post_saleh_transition_and_national_dialogue_2012_2014]
position_alignments:
  - {position_id: institutionalism, alignment: opposed, notes: "Fragmented territorial rule displaced unified, accountable national institutions."}
  - {position_id: classical_liberal, alignment: opposed, notes: "Conflict and coercive controls sharply constrained voluntary exchange and secure market rules."}
references:
  - "World Bank, Yemen transformed political economy and fragmented institutions: https://documents1.worldbank.org/curated/en/099050923091537357/pdf/P17826203eb7ac0030b5540af4456d0dd7c.pdf"
  - "IMF, Yemen 2025 Article IV concluding statement: https://www.imf.org/en/news/articles/2025/10/09/imf-cs-yemen-2025-imf-article-iv-mission"
notes: "The interval ends before the Presidential Leadership Council was established in April 2022."
