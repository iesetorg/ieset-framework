# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: canada_federal_income_tax_state_1917_1948
status: candidate
name: Federal income tax established as a lasting fiscal instrument
countries: [CAN]
timeframe: {start: 1917, end: 1948, enacted_date: "1917-09-20"}
coalition: Wartime and postwar federal governments under Robert Borden, William Lyon Mackenzie King, and successors
leaders: ["Robert Borden", "Thomas White"]
doctrine: >
  The federal government introduced income taxation in 1917 to finance the
  First World War and initially described the measure as temporary. It was
  retained after the war and made permanent through the 1948 Income Tax Act.
  The movement records creation of a durable revenue instrument rather than
  estimating its later yield or the overall size of government.
policies: [ca_income_war_tax_act_1917]
axes_summary:
  - axis: fiscal.tax_progressivity
    direction: "+"
    magnitude: moderate
    rationale: A graduated federal income tax created a progressive revenue instrument that persisted after its stated wartime purpose.
    drift_attribution_year: 1917
    drift_attribution_basis: Parliament introduced the Income War Tax Act in 1917 to finance the war.
references:
  - "Canada Revenue Agency, Purpose of taxes — historical milestones: https://www.canada.ca/en/revenue-agency/services/tax/individuals/educational-programs/purpose-taxes.html"
  - "Canada Revenue Agency, 100 years of income tax: https://www.canada.ca/en/department-national-defence/corporate/reports-publications/proactive-disclosure/2017/100-years-of-income-tax.html"
notes: "The 1948 endpoint marks replacement of the wartime statute, not the end of income taxation."
