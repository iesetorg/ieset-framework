# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: algeria_chadli_market_opening_1979_1989
status: candidate
name: "Chadli period and first move away from central planning"
countries: [DZA]
timeframe: {start: 1979, end: 1989}
coalition: "National Liberation Front (FLN) government"
leaders: ["Chadli Bendjedid"]
doctrine: >
  The Chadli government inherited a hydrocarbon-funded, centrally planned
  economy dominated by public enterprises and administered prices. After the
  1986 oil-price shock, it began a gradual reform programme to decentralize
  decisions, give firms more autonomy, and create market mechanisms. The
  reforms remained partial and did not dissolve the state-led development
  model before the political opening of 1989.
policies: [dz_enterprise_autonomy_reform_1986]
axes_summary:
  - {axis: institutional.property_rights, direction: "+", magnitude: weak, rationale: "Late-1980s reforms began to allow greater enterprise autonomy but left most large productive assets under state ownership."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "The government began decentralizing the centrally planned system and introducing market mechanisms after the oil shock."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, rationale: "The crisis prompted reconsideration of oil-funded enterprise support, although the broader public enterprise model remained."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The FLN retained a public enterprise and hydrocarbon-financed development model while making limited efficiency reforms."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Some market mechanisms were introduced, but the reforms were gradual and state-led."}
references:
  - "IMF, Setting of Economic Reform in Algeria: https://www.elibrary.imf.org/display/book/9781557756916/ch02.xml"
  - "IMF, National Approach to Market-Oriented Tax Reform: https://www.elibrary.imf.org/display/book/9781557752758/ch017.xml"
notes: "This is the late stage of the FLN-led state-led model, not a claim that the 1980s were a market economy."
