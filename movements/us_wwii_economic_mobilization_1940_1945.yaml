# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_wwii_economic_mobilization_1940_1945
status: candidate
name: US World War II economic mobilization
countries: [USA]
timeframe: {start: 1940, end: 1945}
coalition: Roosevelt administration, Congress, and wartime production agencies
leaders:
  - Franklin D. Roosevelt (President)
  - Donald M. Nelson (War Production Board chair)
doctrine: >
  The wartime coalition redirected industrial capacity and scarce consumer
  goods toward military production while seeking to restrain inflation and
  distribute shortages through national administration. The Office of Price
  Administration set price and rent ceilings and administered civilian
  rationing; production agencies assigned priorities and materials. These
  emergency controls were broad but temporary and were dismantled after the
  war.
policies:
  - us_two_ocean_navy_act_1940
  - us_wwii_price_controls_rationing_1942
  - us_war_production_board_1942
axes_summary:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    rationale: The 1940 naval expansion authorized a large federal shipbuilding program supported by appropriations and private-yard investment.
    drift_attribution_year: 1940
    drift_attribution_basis: Congress authorized a major naval expansion in 1940, including the Naval Expansion Act and the Two-Ocean Navy program enacted that summer.
  - axis: regulatory.price_control_intensity
    direction: "+"
    magnitude: strong
    rationale: Wartime price ceilings and rationing became economy-wide controls over essential goods and rents.
    drift_attribution_year: 1942
    drift_attribution_basis: The Emergency Price Control Act was enacted on 1942-01-30 and civilian rationing was administered nationally during the war.
  - axis: regulatory.product_market_competition
    direction: "-"
    magnitude: moderate
    rationale: Production priorities and scarce-goods allocation restricted ordinary civilian availability and decentralized market allocation during the emergency.
    drift_attribution_year: 1942
    drift_attribution_basis: Executive Order 9024 established the War Production Board on 1942-01-16 to direct war procurement and production.
references:
  - "https://www.archives.gov/research/guide-fed-records/groups/188.html"
  - "https://www.archives.gov/boston/exhibits/homefront"
notes: >
  The timeframe captures the wartime emergency regime; it should not be read as
  a permanent peacetime baseline or as an outcome measure.
