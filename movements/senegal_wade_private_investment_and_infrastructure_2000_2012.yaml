# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: senegal_wade_private_investment_and_infrastructure_2000_2012
status: candidate
name: "Wade government, private investment, and infrastructure PPPs"
countries: [SEN]
timeframe: {start: 2000, end: 2012}
coalition: "Sopi Coalition / Senegalese Democratic Party"
leaders: ["Abdoulaye Wade"]
doctrine: >
  Wade's government succeeded the Socialist Party after the 2000 democratic
  transfer and emphasized private investment, infrastructure, and major works.
  The Dakar-Diamniadio toll road embodied a hybrid market/state approach: a
  private concessionaire financed and operated part of the project, while
  government and development partners supplied substantial public financing.
policies: [sn_dakar_toll_highway_ppp_2003]
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Infrastructure delivery used a private concession alongside public project finance."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "The highway blended public and private funding, so the net change in state spending is not inferred."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Large infrastructure projects and national development priorities remained central."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private participation expanded through concessions, but public financing and state coordination remained substantial."}
references:
  - "IMF, Senegal Article IV and PRGF review, 2001: https://www.elibrary.imf.org/view/journals/002/2001/186/article-A001-en.xml"
  - "World Bank PPP Reference Guide case study: https://ppp.worldbank.org/library/new-route-development-senegal-s-toll-highway-ppp-2003-2013"
notes: "The toll-road programme began under Wade but construction and opening continued after his 2012 departure."
