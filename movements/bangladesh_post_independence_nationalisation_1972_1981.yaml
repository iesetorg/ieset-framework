movement_id: bangladesh_post_independence_nationalisation_1972_1981
status: candidate
name: Bangladesh post-independence nationalisation and reconstruction
countries: [BGD]
timeframe: {start: 1972, end: 1981}
coalition: Awami League government under Sheikh Mujibur Rahman, followed by successor governments
leaders: ["Sheikh Mujibur Rahman (Prime Minister, 1972-1975)", "Ziaur Rahman (President, 1977-1981)"]
doctrine: >
  After independence, the government adopted a constitutionally socialist
  development orientation and placed major industrial enterprises under public
  ownership while rebuilding a war-damaged economy. Public corporations were
  tasked with managing nationalised enterprises and developing new industry.
  The period ended with the 1982 New Industrial Policy, which began a marked
  shift toward private investment and export-oriented manufacturing.
policies: [bangladesh_industrial_nationalisation_order_1972]
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, drift_attribution_year: 1972, drift_attribution_basis: "President's Order No. 27 of 1972 vested scheduled enterprises in government ownership."}
references:
  - "Bangladesh Industrial Enterprises (Nationalisation) Order, 1972: https://bdlaws.minlaw.gov.bd/act-print-378.html"
  - "World Bank, Bangladesh: Strategy for Sustained Growth (1980): https://documents1.worldbank.org/curated/en/375571468152966660/pdf/527080PUB0lead101Official0Use0Only1.pdf"
successor_movements: [bangladesh_garments_export_industrial_policy_1980s_present]
