movement_id: can_borden_wartime_government_1912_1916
status: candidate
name: Borden government and wartime mobilisation, 1912–1916
countries:
- CAN
timeframe:
  start: 1912
  end: 1916
coalition: Robert Borden Conservative government
leaders:
- Robert Borden
doctrine: Borden’s government expanded federal mobilisation for the First World War, raised wartime finance, and
  introduced conscription in 1917 after this interval. Through 1916, Canada’s industrial and fiscal capacity was
  redirected toward the imperial war effort while the federal government’s role in national coordination grew.
