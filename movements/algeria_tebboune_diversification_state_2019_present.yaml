# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: algeria_tebboune_diversification_state_2019_present
status: candidate
name: "Tebboune development, social-support, and economic-diversification programme"
countries: [DZA]
timeframe: {start: 2019, end: ongoing}
coalition: "Presidency of Abdelmadjid Tebboune and successive governments"
leaders:
  - "Abdelmadjid Tebboune (President from 2019)"
policies: [dz_tebboune_investment_diversification_reforms]
doctrine: >
  The Tebboune-era programme retains hydrocarbon-centred state direction,
  public investment, wages, and household support while declaring economic
  diversification and non-hydrocarbon exports as priorities. Investment and
  land laws and digital business procedures seek to attract private activity,
  but the IMF's 2025–2026 assessments describe a large public-sector role,
  subsidies, and continuing constraints on private competition. The movement
  is therefore coded as a mixed, state-led diversification strategy rather
  than a completed transition to a private-sector-led economy.
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "Public investment, wages, and household-support spending rose substantially in 2024 and remained central to the state-led development model."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: moderate, rationale: "Household support and broad energy subsidies remain important; the available sources do not establish a fully targeted transfer-system expansion."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, rationale: "Investment laws and business-climate measures seek greater private activity, while state-owned enterprises, import restrictions, and regulatory barriers remain substantial."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: moderate, rationale: "Authorities promote non-hydrocarbon exports and diversification alongside import substitution and continuing trade restrictions."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Budget-law implementation, public-enterprise oversight, and fiscal-management reforms add formal governance tools, with effectiveness still under review."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Public investment, industrial diversification, and hydrocarbon-rent mobilisation are directed through state plans."}
  - {position_id: social_democracy, alignment: partially_aligned, notes: "The programme sustains broad household support, but the policy architecture is not principally organised around social-democratic bargaining or universal insurance."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private investment and export growth are stated goals, but are constrained by the continuing state-led model and trade restrictions."}
references:
  - "Algerian Prime Minister's Office, Government Action Plan and economic renewal, 2021: https://premier-ministre.gov.dz/fr/post/pour-une-relance-et-un-renouveau-economiques"
  - "IMF, Algeria: 2025 Article IV Consultation: https://www.imf.org/en/publications/cr/issues/2025/09/18/algeria-2025-article-iv-consultation-press-release-and-staff-report-570472"
  - "IMF, Algeria: 2026 Article IV Consultation: https://www.imf.org/en/news/articles/2026/07/06/pr26236-algeria-imf-staff-completes-2026-article-iv-mission"
notes: "The first coded year is the 2019 start of the Tebboune presidency; the record describes declared and observed policy direction through the latest cited 2026 review, not outcomes inferred from the programme's stated objectives. Earlier post-1978 regimes remain uncoded."
