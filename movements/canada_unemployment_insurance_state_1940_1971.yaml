# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: canada_unemployment_insurance_state_1940_1971
status: candidate
name: Federal unemployment insurance established and broadened
countries: [CAN]
timeframe: {start: 1940, end: 1971, enacted_date: "1940-08-07"}
coalition: Federal governments following provincial constitutional agreement
leaders: ["William Lyon Mackenzie King", "Louis St. Laurent", "Pierre Elliott Trudeau"]
doctrine: >
  Following the Depression-era constitutional dispute, the provinces agreed
  to amend the division of powers so Parliament could create unemployment
  insurance. The 1940 Act established a contributory federal program, initially
  for selected industrial workers; 1971 reforms greatly widened coverage and
  added sickness and maternity benefits. The arc concerns social insurance and
  federal-provincial authority, not a claim that coverage began universally.
policies: [ca_unemployment_insurance_act_1940]
axes_summary:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: moderate
    rationale: The federal contributory insurance program created and later broadened income support during unemployment.
    drift_attribution_year: 1940
    drift_attribution_basis: The Unemployment Insurance Act received Royal Assent on 7 August 1940; contributions and benefits followed in 1941–42.
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: A negotiated constitutional amendment clarified Parliament's authority over unemployment insurance.
    drift_attribution_year: 1940
    drift_attribution_basis: The British North America Act was amended in June 1940 to add unemployment insurance to federal powers.
references:
  - "Government of Canada, Federal-provincial agreements and the 1941 Unemployment Insurance Program: https://www.canada.ca/en/intergovernmental-affairs/services/federation/unemployment-insurance-program.html"
  - "Department of Justice Canada, British North America Act, 1940: https://justice.canada.ca/eng/rp-pr/csj-sjc/constitution/lawreg-loireg/p1t181.html"
  - "Employment and Social Development Canada, EI history and 1971 reforms: https://www.canada.ca/en/employment-social-development/programs/ei/ei-list/reports/monitoring2019/intro.html"
notes: "The late endpoint reflects the major 1971 expansion; the unemployment-insurance institution continued after this movement period."
