movement_id: jpn_allied_occupation_and_democratic_reconstruction_1945_1951
status: candidate
name: Japanese occupation reforms and democratic reconstruction, 1945–1951
countries:
- JPN
timeframe:
  start: 1945
  end: 1951
coalition: Japanese cabinets under Allied occupation
leaders:
- Kijūrō Shidehara
- Shigeru Yoshida
- Tetsu Katayama
doctrine: Allied occupation dismantled the military state and introduced constitutional government, broader political
  participation, land reform, labour rights, and dissolution of the zaibatsu. The 1947 constitution established
  popular sovereignty and pacifism; reconstruction and the 1951 peace treaty brought the occupation toward its end.
policies:
- jpn_allied_occupation_and_democratic_reconstruction_1945_1951_policy
axes_summary:
- axis: institutional.rule_of_law
  direction: +
  magnitude: strong
  rationale: The new constitution established popular sovereignty, parliamentary institutions, and legal protections.
- axis: institutional.property_rights
  direction: mixed
  magnitude: moderate
  rationale: Land reform redistributed landlord holdings; the zaibatsu were dissolved and reorganised.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  rationale: Antimonopoly reform and economic restructuring reduced some concentrated ownership.
references:
