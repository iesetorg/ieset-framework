- 'National Diet Library of Japan; U.S. Office of the Historian: https://www.ndl.go.jp/constitution/e/outline/05outline.html'
- 'National Diet Library of Japan; U.S. Office of the Historian: https://history.state.gov/milestones/1945-1952/japan-reconstruction'
