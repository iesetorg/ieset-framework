# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: costa_rica_cafta_and_fiscal_rule_2007_2025
status: candidate
name: "CAFTA-DR integration and post-2018 fiscal-rule era"
countries: [CRI]
timeframe: {start: 2007, end: 2025}
coalition: "Alternating democratic administrations"
leaders: ["Óscar Arias Sánchez", "Laura Chinchilla Miranda", "Luis Guillermo Solís Rivera", "Carlos Alvarado Quesada", "Rodrigo Chaves Robles"]
doctrine: >
  Costa Rica deepened trade and investment integration through CAFTA-DR, which
  took effect in 2009, while retaining a mixed economy and the institutions of
  the Second Republic. The 2018 fiscal law introduced a spending-growth rule
  and tax changes, and later IMF-supported programmes sustained consolidation.
  This period combines trade opening with tighter fiscal constraints rather
  than a uniform reduction of the state's role in social provision.
policies: [cr_cafta_and_fiscal_rule_2007]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "CAFTA-DR bound Costa Rica to a further phase of trade and investment integration from 2009."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "The 2018 fiscal rule constrained spending growth and later programmes consolidated public finances."}
  - {axis: fiscal.tax_progressivity, direction: "+", magnitude: weak, rationale: "Tax changes were intended to improve progressivity, but actual incidence depends on the details of implementation."}
  - {axis: fiscal.transfer_expansion, direction: "mixed", magnitude: weak, rationale: "Fiscal consolidation operated alongside continued public social services and protected social spending."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Trade integration and spending rules expanded market discipline, while the country retained public services and regulation."}
  - {position_id: social_democratic, alignment: partially_aligned, notes: "Costa Rica preserved its broad social institutions while reforming taxation and fiscal rules."}
references:
  - "WTO, CAFTA-DR agreement record: https://rtais.wto.org/UI/PublicShowRTAIDCard.aspx?rtaid=27"
  - "IMF, Costa Rica 2023 Article IV and programme review: https://www.imf.org/-/media/files/publications/cr/2023/english/1criea2023005.pdf"
notes: "The 2026 PPSD/Laura Fernández administration is a separate movement record and is not inferred from this period."
