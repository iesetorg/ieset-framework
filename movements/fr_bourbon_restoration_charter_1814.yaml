# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_bourbon_restoration_charter_1814
status: candidate
name: French Bourbon Restoration Charter of 1814
countries: [FRA]
scope: national
timeframe:
  start: 1814
  end: 1814
coalition: Louis XVIII's Bourbon Restoration government
leaders:
- Louis XVIII
doctrine: >
  The Restoration government granted a constitutional charter that preserved
  selected revolutionary civil rights and created formal judicial and
  legislative constraints within a monarchy. This episode is limited to the
  1814 Charter; it does not score the later July Monarchy or the full period
  through 1848.
policies:
- fr_charter_1814
axes_summary:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  rationale: >
    The Charter formally affirmed equality before law, judicial independence,
    and legislative approval of taxation, while leaving broad royal powers
    and a narrowly qualified electorate.
  drift_attribution_year: 1814
  drift_attribution_basis: >
    The French National Assembly dates the Charter's promulgation to
    4 June 1814.
references:
- 'French National Assembly, Constitutional Charter of 4 June 1814: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/restauration/la-charte-constitutionnelle'
notes: >
  Focused successor to origin/main's broader
  fr_restoration_july_monarchy_1814_1848 candidate. Only the 1814 Charter
  child and one weak formal-constraint step are imported. The score is a
  coded legal direction, not measured enforcement or political freedom.
