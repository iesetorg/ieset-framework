# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_convention_directory_1792_1799
status: candidate
name: National Convention and Directory
countries: [FRA]
timeframe: {start: 1792, end: 1799}
coalition: National Convention followed by the Directory after the fall of the monarchy
leaders:
  - Maximilien Robespierre
  - Paul Barras
  - Emmanuel Joseph Sieyès
doctrine: >
  The Convention abolished the monarchy and established the First Republic,
  briefly adopting broad male electoral principles, then governed through a
  period of war, revolutionary emergency, political violence, and shifting
  constitutional forms. The Directory restored a more restricted suffrage;
  the period ended with Bonaparte's coup in 1799. The breadth of these changes
  makes this a historical coverage anchor, not one stable ideological program.
policies:
  - fr_abolition_monarchy_1792
  - fr_directory_constitution_1795
axes_summary:
  - axis: institutional.rule_of_law
    direction: "mixed"
    magnitude: moderate
    rationale: The Convention abolished monarchy and established republican institutions, while emergency government, political repression, and repeated constitutional breaks undermined stable legal constraints; the Directory then restored restricted suffrage.
references:
  - "French National Assembly, Convention and end of the monarchy: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/la-convention-nationale-et-la-fin-de-la-royaute"
  - "French National Assembly, Constitution of Year III and the Directory: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/constitution-de-l-an-iii-le-directoire"
notes: Candidate backfill for a turbulent period with sharply changing institutions; mixed direction is intentional.
