# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: bangladesh_tarique_rahman_bnp_2026_present
status: candidate
name: "Tarique Rahman BNP post-interim government (Bangladesh, 2026-present)"
countries: [BGD]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-02-17"
coalition: "Bangladesh Nationalist Party-led parliamentary majority with allied smaller parties"
leaders:
  - "Tarique Rahman (Prime Minister, from 17 February 2026)"
  - "Mohammed Shahabuddin (President)"
doctrine: >
  BNP return to elected government after the Yunus interim period and the
  first post-Hasina election. The platform emphasises restoring public
  order, lowering inflation, reviving investment and employment, continued
  banking-sector repair, constitutional and judicial reforms inherited from
  the interim process, and a foreign-policy rebalance seeking better ties
  with India, China, the United States, and regional neighbours while
  managing Jamaat-e-Islami's strengthened parliamentary presence.
policies:
  - bd_bnp_inflation_jobs_program_2026
  - bd_post_interim_constitutional_reform_2026
  - bd_banking_sector_repair_continuation_2026
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "Post-interim election and reform pledges preserve the restoration agenda after Hasina's fall."}
  - {axis: institutional.judicial_independence, direction: "+", magnitude: weak, rationale: "Judicial-reform continuation is pledged but requires implementation review."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "Family-card/job programmes imply spending expansion while IMF macro constraints remain."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "Trade and investment reset with India/US/China posture points toward openness, pending enacted measures."}
  - {axis: regulatory.financial_deregulation, direction: "0", magnitude: weak, rationale: "Bank repair is supervisory/cleanup rather than deregulation."}
predecessor_movements:
  - bangladesh_yunus_interim_2024_present
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned}
  - {position_id: empirical_pragmatist, alignment: partially_aligned}
  - {position_id: social_democratic, alignment: partially_aligned}
references:
  - "IPU Parline, February 2026 election and 17 February handover, checked 2026-10-09: https://data.ipu.org/parliament/BD/BD-LC01/election/BD-LC01-E20260212/"
  - "Guardian, 17 February 2026, Tarique Rahman sworn in as Bangladesh prime minister."
  - "Le Monde, 13 February 2026, BNP parliamentary majority after post-Hasina election."
  - "DW / Bangladesh election results coverage, February 2026."
notes: >
  Replaces the Yunus interim movement after the 17 February 2026 handover.
  Candidate-coded until the BNP government's reform and macro package is
  visible in legislation and budget execution.
  The 2026-10-09 atlas review verified the election and actual swearing-in;
  this does not validate the unresolved policy references or the provisional
  axis and school assignments above.
