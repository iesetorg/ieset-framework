# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: uganda_museveni_nrm_seventh_2026_present
status: candidate
name: "Museveni NRM seventh elected term (Uganda, 2026-present)"
countries: [UGA]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-05-12"
coalition: "National Resistance Movement (NRM)"
leaders:
  - "Yoweri Kaguta Museveni (President, seventh elected term)"
  - "Robert Kyagulanyi / Bobi Wine (main opposition challenger, NUP)"
doctrine: >
  Continuation of Museveni's long-running NRM developmental-security state
  after the disputed January 2026 election. The term extends the Parish
  Development Model, Lake Albert oil/EACOP resource-development strategy,
  coercive treatment of opposition, and security-state control. Election
  conditions featured opposition suppression, internet restrictions, and
  fraud allegations, making institutional coding central even where policy
  content is continuous with the 2021-2026 term.
policies:
  - ug_2026_disputed_election_security_controls
  - ug_parish_development_model_continuation_2026
  - ug_lake_albert_oil_continuation_2026
axes_summary:
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: moderate, rationale: "Parish Development Model revolving funds and household-enterprise support continue."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Oil, household-enterprise, and parish-level credit support remain targeted state programmes."}
  - {axis: regulatory.energy_supply_security, direction: "+", magnitude: moderate, rationale: "Lake Albert oil and EACOP strategy continue to expand hydrocarbon production/export capacity."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "2026 election marked by repression, internet restrictions, opposition intimidation, and disputed results."}
  - {axis: institutional.judicial_independence, direction: "-", magnitude: weak, rationale: "Long-running executive dominance and election-dispute handling remain unresolved."}
predecessor_movements:
  - uganda_museveni_nrm_2021_2026
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned}
  - {position_id: institutionalism, alignment: opposed}
  - {position_id: classical_liberal, alignment: opposed}
references:
  - "Uganda Electoral Commission reported Museveni victory in January 2026."
  - "Washington Post, 16 January 2026, Museveni wins seventh term amid opposition suppression."
  - "El Pais, 16 January 2026, election-count and Bobi Wine repression reporting."
notes: >
  Continuity movement added so Uganda remains current after the 2021-2026
  file expires. Candidate status because no separate first-year policy
  package has been fully materialised.
