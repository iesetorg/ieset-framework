notes: >
  First-term movement ended Jun 1 2024 at the start of the second
  term. Coding separates policy-content movements from
  institutional-quality deterioration. Ongoing review of
  homicide-series robustness as Cristosal and Human Rights Watch
  publish detention-dataset updates. The speculative property-rights
  reduction formerly inferred from arbitrary detention is not scored:
  detention is captured by the rule-of-law axis, while direct evidence
  for a separate property-rights decision is absent.
