movement_id: singapore_knowledge_economy_restructuring_1990_2004
status: candidate
name: Singapore financial, services, and knowledge-economy expansion
countries:
- SGP
timeframe:
  start: 1990
  end: 2003
coalition: People's Action Party government
leaders:
- Goh Chok Tong
- Lee Kuan Yew
doctrine: 'After the 1985 recession, the government diversified toward financial services, tourism, overseas investment,
  and higher-value production. The late-1990s and early-2000s strategy promoted knowledge-intensive activity, research
  capability, and regional integration while retaining an active state role in infrastructure and investment coordination.
  It combined private-sector development with state-led economic planning.

  '
