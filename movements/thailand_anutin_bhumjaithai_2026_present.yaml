# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: thailand_anutin_bhumjaithai_2026_present
status: candidate
name: "Anutin Bhumjaithai conservative coalition (Thailand, 2026-present)"
countries: [THA]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-04-06"
coalition: "Bhumjaithai-led coalition after the February 2026 election, including Pheu Thai and smaller parties"
leaders:
  - "Anutin Charnvirakul (Prime Minister)"
  - "Natthaphong Ruengpanyawut (Opposition leader, People's Party)"
doctrine: >
  Conservative-nationalist Bhumjaithai-led government consolidated after
  the February 2026 snap election and the Second Anutin cabinet swearing-in
  on 6 April 2026. The programme blends royalist/military accommodation,
  Cambodia-border nationalism, infrastructure and health-sector patronage,
  pragmatic business policy, and management of a voter-approved process
  toward constitutional replacement. It marks a break from the Pheu Thai
  Shinawatra-family restoration and a defeat for the reformist People's
  Party, while retaining coalition links with Pheu Thai.
policies:
  - th_2026_constitutional_rewrite_referendum
  - th_anutin_bhumjaithai_coalition_2026
  - th_border_security_nationalism_2026
axes_summary:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "Referendum approved a constitutional rewrite process, but coalition remains embedded in royalist-military veto structure."}
  - {axis: institutional.judicial_independence, direction: "0", magnitude: weak, rationale: "No early reversal of Constitutional Court political-party veto role."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: weak, rationale: "Business-pragmatic posture offset by patronage-heavy licensing and sector concessions."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Bhumjaithai infrastructure, health, and regional patronage policies expand targeted support."}
  - {axis: regulatory.trade_openness, direction: "0", magnitude: weak, rationale: "No major trade-regime change observed in first months."}
predecessor_movements:
