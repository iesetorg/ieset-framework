  - {position_id: institutionalism, alignment: opposed, notes: "Constitution rewrite path positive, but reformist People's Party remains outside power and court vetoes persist."}
  - {position_id: classical_liberal, alignment: opposed}
references:
  - "2026 Thai general election: Bhumjaithai won the largest bloc; Anutin re-elected prime minister."
  - "AP / Guardian, 8 February 2026, Bhumjaithai election lead and People's Party concession."
  - "Second Anutin cabinet sworn in 6 April 2026."
  - "2026 Thai constitutional referendum approved process for a new constitution."
notes: >
  Candidate-coded because the cabinet is new and the constitutional rewrite
  path is unresolved. Replaces the stale Paetongtarn current-government code.
