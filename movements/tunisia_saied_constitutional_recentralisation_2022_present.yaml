# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: tunisia_saied_constitutional_recentralisation_2022_present
status: candidate
name: "Saied constitutional reorganisation and state-led adjustment programme"
countries: [TUN]
timeframe: {start: 2022, end: ongoing}
coalition: "Presidency of Kais Saied and successive governments"
leaders:
  - "Kais Saied (President)"
  - "Najla Bouden (Head of Government, 2021–2023)"
  - "Kamel Maddouri (Head of Government, 2024–2025)"
policies: [tun_2022_constitution_presidential_system]
doctrine: >
  The 2022 constitution reorganised the political system around a stronger
  presidency after the 2021 suspension and dissolution of parliament. The
  contemporary economic programme combined wage-bill restraint, subsidy
  reform and state-enterprise restructuring proposals with targeted social
  transfers and calls to preserve purchasing power. The government also
  resisted externally imposed conditions and framed its economic approach in
  terms of national sovereignty. The resulting direction is coded as
  institutional recentralisation and mixed fiscal adjustment, not a unified
  statist or market-liberal programme.
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "The 2022 constitution concentrated executive authority in the presidency and reduced the institutional role of parliament and government relative to the 2014 system."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "The economic reform programme proposed containment of the public wage bill and generalized subsidies to restore fiscal balance; adoption and implementation were uneven and are not treated as verified outcomes."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "The programme also proposed expanded targeted cash transfers and social-safety-net protection for vulnerable households."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Reform proposals sought state-enterprise restructuring, streamlined investment incentives, and a more competitive investment environment, but implementation remained uncertain."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: weak, rationale: "The administration sought external financing while publicly emphasising economic sovereignty and opposition to imposed conditions."}
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "The new constitution formalises public authority in a legal text but shifts institutional checks and executive powers toward the presidency."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The government retains a large public role and social-protection commitments while pursuing fiscal adjustment and reform of state enterprises."}
  - {position_id: social_democracy, alignment: partially_aligned, notes: "Social transfers and purchasing-power protection are part of the programme, alongside fiscal restraint and subsidy changes."}
references:
  - "Tunisia, Constitution promulgated 17 August 2022: https://pm.gov.tn/sites/default/files/2023-03/constitution-2022.pdf"
  - "Presidency of the Government of Tunisia, constitutional allocation of powers: https://pm.gov.tn/en/les-attributions-du-chef-de-gouvernement-selon-le-constitution"
  - "IMF, Tunisia staff-level agreement and policy programme, 15 October 2022: https://www.imf.org/en/news/articles/2022/10/15/pr22353-tunisia-imf-staff-reaches-staff-level-agreement-on-an-extended-fund-facility-with-tunisia"
  - "IMF, Tunisia reform priorities and social protection, 19 July 2022: https://www.imf.org/en/News/Articles/2022/07/19/pr22267-tunisia-imf-staff-concludes-mission-to-tunisia"
notes: "The start year follows the promulgation of the new constitution, not the 2021 suspension. Direction coding distinguishes the institutional settlement from the unresolved fiscal programme."
