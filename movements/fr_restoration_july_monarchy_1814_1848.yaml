# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_restoration_july_monarchy_1814_1848
status: candidate
name: Bourbon Restoration and July Monarchy
countries: [FRA]
timeframe: {start: 1814, end: 1848}
coalition: Bourbon Restoration and Orléanist constitutional monarchy
leaders:
  - Louis XVIII
  - Charles X
  - Louis-Philippe I
doctrine: >
  The Restoration introduced a constitutional charter and two legislative
  chambers under a monarch, with a highly restricted property-qualified
  electorate. The July Monarchy strengthened parliamentary practices and
  national sovereignty but retained a narrow franchise, contributing to its
  overthrow in 1848. This interval covers two related constitutional
  monarchies, not a single unchanged cabinet or stable franchise.
policies:
  - fr_charter_1814
  - fr_charter_revised_1830
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    rationale: Constitutional charters and growing parliamentary practice constrained royal authority, though sovereignty remained monarchical and electoral participation was restricted to a small tax-qualified electorate.
    drift_attribution_year: 1814
    drift_attribution_basis: Louis XVIII granted the Constitutional Charter on 4 June 1814.
references:
  - "French National Assembly, Charter of 1814: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/restauration/la-charte-constitutionnelle"
  - "French National Assembly, Restoration to July Monarchy: https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/juniors/histoire/1814-1848-de-la-restauration-a-la-monarchie-de-juillet/les-faits"
notes: Candidate historical backfill. Franchise, rights, and ministerial accountability shifted during this interval.
