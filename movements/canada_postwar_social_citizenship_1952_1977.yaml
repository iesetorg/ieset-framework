# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: canada_postwar_social_citizenship_1952_1977
status: candidate
name: Postwar social citizenship — pensions, hospital insurance, and Medicare
countries: [CAN]
timeframe: {start: 1952, end: 1977}
coalition: Cross-party federal and provincial governments
leaders: ["Louis St. Laurent", "John Diefenbaker", "Lester B. Pearson", "Pierre Elliott Trudeau", "Tommy Douglas"]
doctrine: >
  From the Old Age Security Act through public hospital and medical insurance,
  Canada built national social programs through federal legislation and
  province-level administration and cost-sharing. The Canada Pension Plan,
  Canada Assistance Plan, and later Established Programs Financing changed
  both the scope of social protection and the funding relationship between
  orders of government. The record captures this multi-party institutional
  settlement and does not attribute it to one leader or treat the 1977 block
  funding change as an unqualified expansion in every fiscal dimension.
policies: [ca_postwar_social_programs_1952_1977]
axes_summary:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: strong
    rationale: Old-age security, contributory pensions, public health insurance, and social assistance transfers expanded the federal social-protection framework.
    drift_attribution_year: 1952
    drift_attribution_basis: The Old Age Security Act came into force in 1952, establishing a federal pension program; later major expansions are part of this movement arc.
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: moderate
    rationale: Cost-sharing for hospital and physician services expanded federal financial participation before the 1977 shift to block transfers.
    drift_attribution_year: 1957
    drift_attribution_basis: The Hospital Insurance and Diagnostic Services Act established federal-provincial cost-sharing in 1957.
references:
  - "Library of Parliament, Old Age Security Act chronology: https://lop.parl.ca/staticfiles/PublicWebsite/Home/ResearchPublications/LegislativeSummaries/PDF/39-1/c36-e.pdf"
  - "Health Canada, Canada Health Act Annual Report 2016–17: https://www.canada.ca/en/health-canada/services/publications/health-system-services/canada-health-act-annual-report-2016-2017.html"
  - "Department of Finance Canada, History of Health and Social Transfers: https://www.canada.ca/en/department-finance/programs/federal-transfers/history-health-social-transfers.html"
notes: "Cross-party and federal-provincial institutional arc; the chart's event dates denote selected policy changes, not annual expenditure measurements."
