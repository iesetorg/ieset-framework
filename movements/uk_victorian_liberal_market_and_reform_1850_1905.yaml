# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: uk_victorian_liberal_market_and_reform_1850_1905
status: candidate
name: "Victorian liberal-market settlement and incremental reform"
countries: [GBR]
timeframe: {start: 1850, end: 1905}
coalition: "Alternating Liberal and Conservative governments at Westminster"
leaders: ["Henry John Temple, Viscount Palmerston", "Benjamin Disraeli", "William Ewart Gladstone", "Robert Gascoyne-Cecil, Marquess of Salisbury"]
doctrine: >
  Britain alternated between Liberal and Conservative ministries during this
  period, but retained a predominantly private, internationally open economy
  and a limited central state. Parliament gradually widened the franchise and
  expanded public responsibilities in elementary schooling and labour law.
  Trade-union recognition and electoral reform strengthened organized
  participation, while the main prewar welfare-state turn came later, under
  New Liberal governments after 1906. This broad bridge records the shared
  institutional settlement without treating its governments as ideologically
  uniform.
policies: [uk_victorian_franchise_education_labour_reform_1867]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "The Victorian economy retained the free-trade orientation established after the repeal of the Corn Laws, with no return to broad protectionism in this period."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "The 1867 and 1884 franchise reforms and laws recognizing trade unions broadened institutional participation and association."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "Elementary education and local public institutions grew incrementally, while central welfare spending remained limited before 1906."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Markets and free trade remained central, alongside gradual electoral, educational, and labour-law reforms."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "Parliament extended representative and administrative institutions through incremental legislation."}
references:
  - "UK Parliament, nineteenth-century social and political reform: https://www.parliament.uk/about/living-heritage/transformingsociety/livinglearning/19thcentury/"
  - "UK House of Commons Library, history of the parliamentary franchise: https://commonslibrary.parliament.uk/research-briefings/rp13-14/"
  - "UK Parliament, 1867 Reform Act: https://www.parliament.uk/about/living-heritage/transformingsociety/electionsvoting/chartists/case-study/the-right-to-vote/joseph-sturge-and-john-bright/john-bright-mp-and-the-1867-reform-act/"
notes: "This is a broad continuity episode across alternating governments; its internal reforms and reversals are represented by dated policy and movement records where authored."
