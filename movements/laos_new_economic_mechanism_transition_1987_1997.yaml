# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: laos_new_economic_mechanism_transition_1987_1997
status: candidate
name: Lao PDR New Economic Mechanism and market transition
countries: [LAO]
timeframe: {start: 1987, end: 1997}
coalition: "Lao People's Revolutionary Party government"
leaders: ["Kaysone Phomvihane (Party General Secretary and President through 1992)", "Khamtai Siphandone (senior party leader and later President)"]
doctrine: >
  Following the 1986 New Economic Mechanism, Laos moved away from central planning
  through broad price liberalisation, exchange-rate unification, reduced state trade
  monopoly, opening to foreign and inter-provincial trade, and permission for private
  firms and family farming. Structural-adjustment credits supported enterprise and
  public-sector reform. The party-state retained political monopoly and strategic
  direction, making this a gradual market transition rather than political
  liberalisation or a full withdrawal of the state.
policies: [lao_new_economic_mechanism_1986]
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: strong, rationale: "The NEM legalised private entry and liberalised most administered prices."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "The government removed its trade monopoly and opened cross-border and internal trade."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, rationale: "The number and commercial role of state enterprises were reduced, while party-state control persisted."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Market reforms did not alter one-party political control."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Price, trade, and private-entry reforms expanded markets without political pluralism or a minimal state."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Reform remained directed by the ruling party and used state institutions to sequence transition."}
references:
  - "World Bank, Lao PDR economic transition and growth: https://documents1.worldbank.org/curated/en/250731468277466031/pdf/317640corr.pdf"
  - "World Bank, Lao PDR Economic Reforms Completed to Date: https://documents1.worldbank.org/curated/en/507991468090580507/pdf/multi-page.pdf"
notes: "Starts with the first full year after NEM adoption; later recovery and regional-integration phases are separate."
