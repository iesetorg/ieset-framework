movement_id: seychelles_monetary_authority_reform_1978
status: candidate
name: Seychelles monetary authority reform
countries:
- SYC
scope: national
timeframe:
  start: 1978
  end: 1978
doctrine: The Seychelles Monetary Authority Decree was enacted on 24 November 1978 and the authority opened
  on 1 December. Compared with the currency board, it received monetary-policy responsibilities, bank-inspection
  powers, and lender-of-last-resort functions. Its board remained closely tied to the finance administration.
  The entry codes added financial oversight, not increased independence or a measured expansion of money.
policies:
- syc_monetary_authority_decree_1978
axes_summary:
- axis: regulatory.financial_deregulation
  direction: +
  magnitude: weak
  rationale: Bank inspection and monetary control powers were added relative to the predecessor currency
    board, which lacked a banking-supervision mandate.
  drift_attribution_year: 1978
  drift_attribution_basis: The documented reform was adopted in 1978; this marks the policy event rather
    than an entire government term.
references:
- 'Central Bank of Seychelles, History of the Bank: https://www.cbs.sc/Aboutus/HistoryOfBank.html'
notes: A bounded reform episode, not a full governing-era classification. The direction is an interpretation
  of the documented instrument, with no ideological school assigned. Years outside this event remain uncovered
  unless supported by other records.
