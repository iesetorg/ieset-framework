# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: senegal_diouf_adjustment_1981_1993
status: candidate
name: "Diouf-era stabilization and New Industrial Policy"
countries: [SEN]
timeframe: {start: 1981, end: 1993}
coalition: "Socialist Party government"
leaders: ["Abdou Diouf"]
doctrine: >
  The Diouf government retained the Socialist Party's governing framework but
  increasingly pursued stabilization, structural adjustment, and selective
  market opening under fiscal and external pressure. The 1986 New Industrial
  Policy reduced trade barriers and sought enterprise restructuring, but
  reversals and persistent protection make this a partial liberalizing turn
  rather than a clean transition to a market-led state.
policies: [sn_new_industrial_policy_1986]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "The 1986-88 measures lowered tariffs and removed most quantitative restrictions, though some were reversed by 1989."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "Adjustment and enterprise restructuring sought lower public costs amid continued state involvement."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The state remained central while pursuing productivity and industrial restructuring."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Trade and price opening moved toward market allocation, but implementation was incomplete and policy remained state-directed."}
references:
  - "IMF, Senegal 1978-93: https://www.elibrary.imf.org/display/book/9781557755667/C4.xml"
notes: "The movement ends in 1993 before the separate 1994 CFA-zone devaluation and adjustment episode."
