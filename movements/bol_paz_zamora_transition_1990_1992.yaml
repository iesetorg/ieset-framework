movement_id: bol_paz_zamora_transition_1990_1992
status: candidate
name: Bolivian stabilisation and market transition under Paz Zamora, 1990–1992
countries:
- BOL
timeframe:
  start: 1990
  end: 1992
coalition: Jaime Paz Zamora government under the ADN-MIR pact
leaders:
- Jaime Paz Zamora
doctrine: The Paz Zamora government continued the post-1985 stabilisation and market transition. It decentralized
  state petroleum and mining firms, established equal treatment for domestic and foreign investment, liquidated
  several public banks, and enacted a 1992 privatisation framework while maintaining social programmes amid unemployment
  and adjustment pressures.
policies:
- bol_paz_zamora_transition_1990_1992_policy
axes_summary:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  rationale: Decentralisation and privatisation expanded private participation in former public-enterprise sectors.
- axis: institutional.property_rights
  direction: +
  magnitude: weak
  rationale: The 1990 foreign investment law provided equal treatment for domestic and foreign investors.
references:
- 'IMF Bolivia Ex-Post Assessment (2005): https://www.elibrary.imf.org/view/journals/002/2005/139/article-A001-en.xml'
