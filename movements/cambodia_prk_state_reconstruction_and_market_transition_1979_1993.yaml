# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: cambodia_prk_state_reconstruction_and_market_transition_1979_1993
status: candidate
name: "PRK and State of Cambodia reconstruction and market transition"
countries: [KHM]
timeframe: {start: 1979, end: 1993}
coalition: "People's Republic of Kampuchea / State of Cambodia government"
leaders: ["Heng Samrin", "Hun Sen"]
doctrine: >
  The post-1979 government rebuilt an economy whose private property records
  and productive assets had been devastated, initially keeping substantial
  enterprises and real estate in state ownership. It gradually loosened
  collective agriculture, recognized private enterprise in 1985, and launched
  major property and market reforms in 1989. The transition was gradual and
  politically constrained, rather than a rapid conversion to a liberal market
  order.
policies: [khm_property_and_market_reforms_1989]
axes_summary:
  - {axis: institutional.property_rights, direction: "+", magnitude: strong, rationale: "Private initiative and privatization of state assets were formally reintroduced after the destruction and abolition of property rights under Democratic Kampuchea."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Private firms, enterprise autonomy, and local and foreign investment were progressively allowed, though large sectors remained state owned."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "Enterprise reform sought hard budget constraints, but the fiscal outcome is not quantified here."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The government directed reconstruction and retained state ownership while selectively allowing market exchange."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private property and investment were restored in stages, without a wholesale retreat of the state."}
references:
  - "World Bank, Cambodia: From Recovery to Development, Volume II: https://documents1.worldbank.org/curated/en/120711468017956356/pdf/multi0page.pdf"
  - "World Bank, Land and State Property Rights in Cambodia: https://documents1.worldbank.org/curated/en/809851468213260073/pdf/398090KH.pdf"
notes: "The record ends with the 1993 constitutional transition; the subsequent CPP-led period is coded separately."
