movement_id: hrv_postwar_reform_eu_accession_2000_2015
status: candidate
name: Croatia’s democratic transition and European integration, 2000–2015
countries:
- HRV
timeframe:
  start: 2000
  end: 2015
coalition: Croatian coalition governments under Ivica Račan, Ivo Sanader, and Jadranka Kosor
leaders:
- Ivica Račan
- Ivo Sanader
- Jadranka Kosor
doctrine: After the 2000 transition, Croatia pursued institutional normalisation, EU candidacy and accession negotiations,
  fiscal and judicial reforms, and postwar reconstruction. EU accession in July 2013 anchored regulatory alignment,
  while the country experienced a deep recession after the global financial crisis and returned to growth in 2015.
policies:
- hrv_postwar_reform_eu_accession_2000_2015_policy
axes_summary:
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  rationale: Democratic transition, cooperation with European institutions, and anti-corruption reforms strengthened
    legal accountability.
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  rationale: EU accession and single-market alignment increased external integration.
- axis: fiscal.spending_level
  direction: '-'
  magnitude: weak
  rationale: Post-crisis adjustment followed an extended recession and rising public financing pressure.
