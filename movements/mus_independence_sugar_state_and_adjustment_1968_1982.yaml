movement_id: mus_independence_sugar_state_and_adjustment_1968_1982
status: candidate
name: Mauritius independence, sugar dependence, and stabilisation, 1968–1982
countries:
- MUS
timeframe:
  start: 1968
  end: 1982
coalition: Successive Mauritian coalition governments after independence
leaders:
- Seewoosagur Ramgoolam
- Anerood Jugnauth
doctrine: At independence, Mauritius relied heavily on sugar exports and faced high unemployment. Government strategy
  initially pursued industrial protection and public programmes, but the late-1970s sugar and oil shocks produced
  severe fiscal and external imbalances. IMF and World Bank-supported stabilisation in 1981–82 liberalised trade
  and exchange systems and redirected policy toward export-oriented diversification.
policies:
- mus_independence_sugar_state_and_adjustment_1968_1982_policy
axes_summary:
- axis: fiscal.spending_level
  direction: mixed
  magnitude: moderate
  rationale: An early expansionary public programme was followed by IMF and World Bank-supported fiscal restraint.
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  rationale: Adjustment in 1981–82 liberalised trade and foreign-exchange arrangements.
