movement_id: mus_export_processing_zone_and_diversification_1983_2016
status: candidate
name: Mauritius export-led diversification and services growth, 1983–2016
countries:
- MUS
timeframe:
  start: 1983
  end: 2016
coalition: Successive Mauritian governments during export-led diversification
leaders:
- Anerood Jugnauth
- Navin Ramgoolam
- Paul Bérenger
doctrine: From the early 1980s, export processing zones powered a shift from sugar toward textiles, tourism, and
  later financial and professional services. Manufacturing exports expanded quickly, employment rose, and Mauritius
  maintained democratic alternation while using public investment, education, and trade preferences to diversify
  its economic base before the 2017 movement period.
policies:
- mus_export_processing_zone_and_diversification_1983_2016_policy
axes_summary:
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  rationale: Export-processing zones and preferential market access supported manufactured exports and international
    trade.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  rationale: Private export manufacturing, tourism, and later financial services expanded the market economy.
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  rationale: Public investment in infrastructure and education supported diversification and social development.
references:
- 'World Bank Mauritius economic studies and Systematic Country Diagnostic: https://documents1.worldbank.org/curated/en/752011468203980987/pdf/638440PUB0Exto00Box0361527B0PUBLIC0.pdf'
- 'World Bank Mauritius economic studies and Systematic Country Diagnostic: https://www.worldbank.org/en/country/mauritius/publication/mauritius-addressing-inequality-through-more-equitable-labor-markets'
- 'World Bank Mauritius economic studies and Systematic Country Diagnostic: https://documents1.worldbank.org/curated/en/866371646406360210/pdf/Mauritius-Systematic-Country-Diagnostic-Update.pdf'
notes: Candidate historical backfill based on the cited institutional analysis; boundaries are periodisation choices
  for source review, not a claim that national policy was uniform throughout the interval.
