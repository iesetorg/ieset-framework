doctrine: The 1974 constitution extended worker self-management into macroeconomic decision-making and reorganised
  the federation, while Yugoslavia continued to rely on large external credits for investment. The period captures
  the constitutional and economic arrangements in place immediately before the first currently coded movement in
  1976.
