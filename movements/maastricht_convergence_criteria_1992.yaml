# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: maastricht_convergence_criteria_1992
status: candidate
name: "Maastricht Treaty convergence criteria + monetary union preparation"
scope: supranational
countries: [BEL, DNK, DEU, GRC, ESP, FRA, IRL, ITA, LUX, NLD, PRT, GBR]
timeframe: {start: 1992, end: 1999}
coalition: "EU member state intergovernmental consensus"
leaders: ["Helmut Kohl", "François Mitterrand", "Jacques Delors", "Theo Waigel (German Finance)"]
doctrine: >
  The 12 then-member states signed the Treaty on European Union at Maastricht
  in 1992; it entered force in 1993 and set convergence criteria for eventual
  monetary union. The later Stability and Growth Pact and ECB establishment
  were distinct EU-level decisions in 1997 and 1998. National central-bank
  legal changes and euro adoption occurred on country-specific dates. This
  umbrella treaty record does not establish a common 1992 national axis step.
policies: [maastricht_treaty_1992, stability_growth_pact_1997, ecb_statute_1998]
axes_summary:
  - {axis: monetary.central_bank_independence, direction: "+", magnitude: strong, rationale: "ECB independence is treaty-protected; member central banks required to achieve statutory independence."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "SGP disciplines constrain spending."}
outcome_hypotheses: [monetary_union_benefits_and_costs, italy_euro_entry_non_reform_1999]
position_alignments:
  - {position_id: ordoliberal, alignment: aligned}
  - {position_id: chicago_monetarism, alignment: partially_aligned}
references:
  - "Treaty on European Union, signed 7 February 1992 and in force 1 November 1993: https://eur-lex.europa.eu/legal-content/EN/LSU/?uri=CELEX:11992M/TXT"
  - "ECB chronology of EMU, the 1997 Pact, ECB establishment and initial euro participants: https://www.ecb.europa.eu/ecb/history-arts-culture/history/emu/html/index.en.html"
