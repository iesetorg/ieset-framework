doctrine: The 2003 Comprehensive Peace Agreement established a transitional government and a route to
  elections by 2005. Competitive elections and postwar rebuilding followed under successive governments.
  This broad period captures institutional reconstruction and electoral competition; it does not imply
  uninterrupted stability or a single economic-policy direction.
