# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: cote_divoire_ouattara_development_planning_2011_present
status: candidate
name: "Ouattara-led national development planning and private-investment strategy"
countries: [CIV]
timeframe: {start: 2011, end: ongoing}
coalition: "Rassemblement des Houphouetistes pour la Democratie et la Paix (RHDP) governments"
leaders:
  - "Alassane Ouattara (President from 2011)"
  - "Successive RHDP governments"
policies: [ci_pnd_2026_2030]
doctrine: >
  Since 2011 the government has organised its economic and social programme
  through successive national development plans, combining public
  infrastructure and industrial-policy investment with an explicit role for
  private investment, human-capital development, social inclusion, and state
  modernisation. The 2026–2030 plan continues this planning model and assigns
  most projected investment to private sources while retaining a substantial
  public investment programme.
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "The successive plans include large public infrastructure and service investments, including a 2026–2030 public investment envelope; these are programme commitments rather than realised expenditure effects."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Planning prioritises industrial clusters, agro-industry, infrastructure, and selected strategic sectors through coordinated investment."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "The plans explicitly seek a stronger private-sector role and improved business climate; the coded direction concerns stated market-opening orientation, not a measured competition outcome."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "National plans include human-capital, inclusion, solidarity, and social-action pillars, though these do not imply a quantified transfer expansion by themselves."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The strategy combines public planning and infrastructure with industrialisation and sectoral coordination."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Successive plans assign a major role to private investment and business-climate improvements, while retaining large state-led investment and industrial priorities."}
references:
  - "Government of Côte d'Ivoire, National Development Plan 2021–2025: https://www.gouv.ci/_conseil-ministre-details.php?recordID=429"
  - "Government of Côte d'Ivoire, 2026–2030 National Development Plan: https://www.gouv.ci/index.php/actualite/pnd-2026-2030-la-cote-divoire-accelere-sa-transformation-pour-batir-une-grande-nation-stable-ambitieuse-et-solidaire-0846"
  - "Ministry of Planning and Development, PND 2026–2030 adopted by the National Assembly, 14 April 2026: https://www.plan.gouv.ci/actualite/947"
notes: "This movement covers the Ouattara development-planning phase from the 2011 post-crisis government onward; it does not fill the 1993–2010 transition and conflict interval. Plan targets are not treated as realised outcomes."
