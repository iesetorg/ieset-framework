# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_merkel_iv_2017_2021
status: candidate
name: "Merkel IV CDU/CSU-SPD Grand Coalition 2018-2021"
countries: [DEU]
timeframe: {start: 2018, end: 2021, enacted_date: "2018-03-14"}
coalition: "CDU/CSU (246) + SPD (153) GroKo III (formed after failed Jamaica talks)"
leaders:
  - "Angela Merkel (Chancellor, final term)"
  - "Olaf Scholz (SPD, Finance Minister and Vice-Chancellor)"
  - "Peter Altmaier (Economy Minister)"
doctrine: >
  Transitional final Merkel term — delayed 171 days by failed CDU/CSU-FDP-Greens
  'Jamaica' talks — defined by COVID-19 response and Next Generation EU
  negotiation. Economic school: ordoliberal fiscal orthodoxy suspended under
  emergency clause (Notlage, Art. 115 GG) allowing debt-brake derogation for
  2020-21. Signature measures: Corona-Sondervermögen / KfW credit lines
  (Mar 2020 €1.2tn envelope), Kurzarbeit re-expansion, VAT cut (Jul-Dec 2020
  19%→16%), €130bn stimulus package (Jun 2020), and decisive role in NGEU
  agreement (Jul 2020 €750bn) with Macron — the first joint EU debt issuance.
  Domestically: CO2-Bepreisung launched Jan 2021 (€25/t), coal-exit law (2020,
  Kohleausstieg by 2038), and Nord Stream 2 completion (pipeline finished
  Sep 2021, never certified). Left-right: centrist, visibly shifted toward
  state activism under COVID. Popularity: CDU/CSU 32.9% (2017 election that
  produced this government), collapsed to 24.1% in 2021 post-Merkel. Coherence:
  moderate — energy strategy (Russia-gas + coal-exit + nuclear-exit) increasingly
  visibly contradictory in the run-up to Feb 2022.
policies:
  - de_corona_sondervermoegen_2020
  - de_ngeu_agreement_2020
  - de_vat_cut_covid_2020
  - de_kohleausstieg_2020
  - de_co2_bepreisung_2021
axes_summary:
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: strong
    rationale: COVID emergency debt-brake suspension and supplementary budgets expanded federal
      spending commitments in 2020.
    drift_attribution_year: 2020
    drift_attribution_basis: Bundestag approval of the first COVID supplementary budget on
      25 March 2020 (Bundesregierung fiscal report).
  - axis: regulatory.environmental_stringency
    direction: "+"
    magnitude: strong
    rationale: The 2019 Climate Action Programme and Federal Climate Action Act imposed binding
      sectoral emissions targets and established national carbon pricing for 2021 onward.
    drift_attribution_year: 2019
    drift_attribution_basis: Federal Climate Action Act of 12 December 2019, effective
      18 December 2019 (BGBl. I 2513).
  - axis: regulatory.energy_supply_security
    direction: "-"
    magnitude: moderate
    rationale: The 2020 coal phase-out law scheduled further firm-capacity withdrawals before
      replacement capacity was secured; Nord Stream 2 permitting is coded in the broad movement.
    drift_attribution_year: 2020
    drift_attribution_basis: Kohleausstiegsgesetz of 8 August 2020, effective 14 August 2020
      (BGBl. I 1818).
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    rationale: 2020 KfW liquidity facilities and the Lufthansa stabilisation package directed
      exceptional support to firms during the pandemic.
    drift_attribution_year: 2020
    drift_attribution_basis: Bundesregierung, Lufthansa stabilisation package announced
      25 May 2020 and COVID business-stabilisation measures of March 2020.
predecessor_movements: [germany_merkel_iii_2013_2017]
successor_movements: [germany_scholz_ampel_2021_2025]
