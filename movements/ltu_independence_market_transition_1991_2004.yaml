movement_id: ltu_independence_market_transition_1991_2004
status: candidate
name: Lithuanian independence and market transition, 1991–2004
countries:
- LTU
timeframe:
  start: 1991
  end: 2004
coalition: Successive Lithuanian governments after restoration of independence
leaders:
- Vytautas Landsbergis
- Algirdas Brazauskas
- Valdas Adamkus
- Rolandas Paksas
doctrine: After regaining independence in 1991, Lithuania moved from Soviet central planning toward a market economy
  through price and trade liberalisation, a voucher-based privatisation programme, currency reform, and later EU
  accession. The transition imposed severe output and wage losses before recovery and European integration.
policies:
- ltu_independence_market_transition_1991_2004_policy
axes_summary:
- axis: regulatory.product_market_competition
  direction: +
  magnitude: strong
  rationale: Price liberalisation, private-sector development, and large-scale enterprise privatisation dismantled
    central planning.
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  rationale: Trade and currency reforms redirected the economy toward European markets.
references:
- 'World Bank Lithuania: The Transition to a Market Economy; IMF Lithuania Article IV (1996); European Commission
  Lithuania and the Euro: https://documents.worldbank.org/en/publication/documents-reports/documentdetail/440411468757199694'
- 'World Bank Lithuania: The Transition to a Market Economy; IMF Lithuania Article IV (1996); European Commission
  Lithuania and the Euro: https://www.elibrary.imf.org/view/journals/002/1996/072/article-A001-en.xml'
- 'World Bank Lithuania: The Transition to a Market Economy; IMF Lithuania Article IV (1996); European Commission
  Lithuania and the Euro: https://economy-finance.ec.europa.eu/euro/eu-countries-and-euro/lithuania-and-euro_en'
