# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_constituent_assembly_legal_reordering_1789_1791
status: candidate
name: French Constituent Assembly legal reordering
countries: [FRA]
timeframe: {start: 1789, end: 1791}
coalition: National Constituent Assembly during the opening constitutional phase of the French Revolution
leaders:
  - Honoré Gabriel Riqueti, comte de Mirabeau
  - Emmanuel Joseph Sieyès
  - Gilbert du Motier, marquis de Lafayette
doctrine: >
  The Constituent Assembly sought to replace inherited estate privileges and
  fragmented legal statuses with a national constitutional order grounded in
  popular sovereignty, civil equality, and general law. These principles were
  contested and unevenly extended; this record captures the Assembly's major
  institutional acts in its opening constitutional phase rather than the full
  revolutionary decade or the lived outcomes for every population.
policies:
  - fr_august_decrees_1789
  - fr_declaration_rights_man_citizen_1789
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: strong
    rationale: The August Decrees and Declaration made a decisive formal break with estate-based privileges in favor of general national law, subject to contested limits and implementation.
    drift_attribution_year: 1789
    drift_attribution_basis: The Assembly adopted the August Decrees on 4 August and the Declaration of Rights on 26 August 1789.
  - axis: institutional.property_rights
    direction: "+"
    magnitude: weak
    rationale: The Declaration protected property in its general rights framework, without establishing equal security or access for all groups under French rule.
    drift_attribution_year: 1789
    drift_attribution_basis: Article 17 of the Declaration adopted on 26 August 1789 stated property as an inviolable and sacred right.
references:
  - "French National Assembly, Night of 4 August: Abolition of Privileges: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/nuit-du-4-aout-abolition-des-privileges"
  - "French Constitutional Council, Declaration of the Rights of Man and the Citizen: https://qpc360.conseil-constitutionnel.fr/constitutional-block"
notes: >
  Candidate historical backfill. The movement is limited to 1789–1791 and does
  not summarize the later Convention, Terror, Directory, Consulate, or Empire.
