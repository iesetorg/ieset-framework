# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_antebellum_sectional_law_1820_1857
status: candidate
name: Antebellum sectional settlements and slavery jurisprudence
countries: [USA]
timeframe: {start: 1820, end: 1857}
coalition: Successive national coalitions and courts negotiating slavery, territorial expansion, and the balance of free and slave states
leaders:
  - Henry Clay
  - Roger B. Taney
doctrine: >
  Repeated compromises over territorial slavery attempted to preserve the
  Union while protecting slavery's expansion and slaveholders' claims. The
  Supreme Court's 1857 Dred Scott ruling denied national citizenship to Black
  people and denied Congress authority to prohibit slavery in federal
  territories. This record codes the exclusionary constitutional settlement,
  not the anti-slavery movement or the full diversity of political positions.
policies:
  - us_missouri_compromise_1820
  - us_dred_scott_decision_1857
axes_summary:
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: strong
    rationale: Federal compromises and the Dred Scott ruling used national law to protect slavery and restrict Black citizenship, sharply contradicting equal legal standing.
    drift_attribution_year: 1857
    drift_attribution_basis: The Supreme Court issued its Dred Scott decision on March 6, 1857.
references:
  - "U.S. Senate, The Civil War: The Senate's Story: https://www.senate.gov/artandhistory/history/common/civil_war/RoadtoWar.htm"
  - "U.S. National Archives, Dred Scott v. Sandford: https://www.archives.gov/milestone-documents/dred-scott-v-sandford"
notes: Candidate historical backfill. The interval is a broad movement-family proxy; the scored change is dated to the documented 1857 ruling. It does not imply annual movement activity.
