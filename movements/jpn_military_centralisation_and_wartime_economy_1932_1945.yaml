status: candidate
name: Japanese militarist centralisation and wartime planning, 1932–1945
countries:
- JPN
timeframe:
  start: 1932
  end: 1945
coalition: Imperial Japanese governments under military ascendancy
leaders:
- Fumimaro Konoe
- Hideki Tōjō
