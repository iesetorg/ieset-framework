# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_world_war_one_wartime_mobilisation_1915_1917
status: candidate
name: German Empire wartime mobilisation and military direction
countries: [DEU]
timeframe: {start: 1915, end: 1917}
coalition: "German Imperial government and Supreme Army Command"
leaders: ["Wilhelm II (German Emperor)", "Paul von Hindenburg and Erich Ludendorff (Supreme Army Command from 1916)"]
doctrine: >
  As the First World War became a total war, the Imperial government increased controls
  over labour, food, industrial capacity, and military production. The War Office was
  established in 1916, and the Hindenburg Programme demanded a major increase in arms
  output, backed by labour mobilisation and coercive measures. Political authority
  shifted toward the military leadership while shortages and social protest intensified.
policies: [deu_hindenburg_programme_and_war_economy_1916]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "War spending and arms procurement dominated fiscal and industrial allocation."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: strong, rationale: "The state directed scarce resources and labour toward military production."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, rationale: "War controls and compulsory mobilisation displaced ordinary market allocation."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: moderate, rationale: "Military command acquired extensive influence and civil and political constraints tightened during total war."}
predecessor_movements: [germany_imperial_tariff_social_insurance_state_1902_1914]
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "State coordination expanded sharply but served military mobilisation under an authoritarian imperial system."}
  - {position_id: institutionalism, alignment: opposed, notes: "Military authority and emergency restrictions weakened parliamentary and civil constraints."}
references:
  - "German Federal Agency for Civic Education, war economy: https://www.bpb.de/themen/erster-weltkrieg-weimar/ersterweltkrieg/177509/oekonomie-des-krieges/"
  - "German History in Documents and Images, Hindenburg Programme (1916): https://germanhistorydocs.ghi-dc.org/pdf/eng/811_Hindenburg%20Program_150.pdf"
notes: "Covers the wartime phase before the 1918 revolution and Weimar constitutional transition."
