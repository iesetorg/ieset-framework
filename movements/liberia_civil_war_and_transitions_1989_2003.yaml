status: candidate
name: Civil war, interim governments, and the Taylor presidency
countries:
- LBR
timeframe:
  start: 1989
  end: 2003
coalition: Competing armed factions, interim governments, and National Patriotic Party government
leaders:
- Charles Taylor
- Samuel K. Doe
- Amos Sawyer
doctrine: The 1989 rebellion became a prolonged civil war, with state authority fragmented among armed
  factions and successive interim arrangements. The 1997 election brought Charles Taylor to the presidency,
  but renewed fighting followed from 2000 until the 2003 peace agreement. The episode represents collapse
  and reconstruction of state institutions, not a coherent single economic programme.
