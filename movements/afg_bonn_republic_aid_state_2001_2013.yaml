# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: afg_bonn_republic_aid_state_2001_2013
status: candidate
name: Bonn-era Islamic Republic and aid-financed reconstruction
countries: [AFG]
timeframe: {start: 2001, end: 2013}
coalition: Islamic Republic governments under the Bonn framework
leaders: [Hamid Karzai]
doctrine: >
  After the 2001 intervention, the Bonn process rebuilt central institutions,
  established a new constitution and elected government, and expanded public
  services under exceptional international grant support. The 2004 Constitution
  recognised private property and a market economy. Rapid growth and state
  capacity depended heavily on aid, while insecurity and illicit activity
  remained major constraints.
policies: [afg_bonn_republic_aid_state_2001_2013_policy]
axes_summary:
  - {axis: fiscal.spending_level, direction: +, magnitude: strong, rationale: International grants financed a very large share of public spending and reconstruction.}
  - {axis: institutional.property_rights, direction: +, magnitude: moderate, rationale: The 2004 Constitution established legal protections for private property and a market economy.}
references:
  - "World Bank, Afghanistan economic development from 2001 to 2021: https://thedocs.worldbank.org/en/doc/5f01165822f3639224e0d483ba1861fc-0310062022/original/ADU-2022-FINAL-CLEARED.pdf"
  - "Afghanistan National Development Strategy: https://documents1.worldbank.org/curated/en/533851467994667485/pdf/434310PRSP0P1117376B01OFF0USE0ONLY1.pdf"
notes: "Fiscal expansion includes donor-financed security and civilian spending, not solely domestic revenue."
