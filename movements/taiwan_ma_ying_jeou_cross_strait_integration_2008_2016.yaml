# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: taiwan_ma_ying_jeou_cross_strait_integration_2008_2016
status: candidate
name: Taiwan Ma Ying-jeou government and cross-strait economic opening
countries: [TWN]
timeframe: {start: 2008, end: 2016}
coalition: "Kuomintang (KMT) government"
leaders: ["Ma Ying-jeou (President, 2008–2016)"]
doctrine: >
  The Ma administration prioritised détente with the People's Republic of China and
  negotiated the 2010 Economic Cooperation Framework Agreement (ECFA), lowering trade
  barriers in selected sectors. It retained Taiwan's competitive market economy and
  democratic institutions. The agreement's scope was limited and politically contested;
  this phase represents selective cross-strait market integration, not reunification
  or removal of all trade restrictions.
policies: [tw_ecfa_early_harvest_trade_opening_2010]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "ECFA created staged tariff reductions and economic cooperation in selected goods and services."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Regular competitive elections continued while the cross-strait policy prompted substantial domestic contestation."}
predecessor_movements: [taiwan_chen_shui_bian_dpp_government_2000_2008]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Selective trade opening increased market access but was negotiated and politically bounded."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "The policy was implemented through a formal cross-strait agreement within Taiwan's democratic system."}
references:
  - "Taiwan Ministry of Economic Affairs, ECFA text: https://www.trade.gov.tw/Files/PageFile/651641/ECFA.pdf"
notes: "The period ends with the 2016 change of governing party; ECFA effects and later political responses remain distinct."
