# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: cambodia_hun_manet_pentagonal_strategy_2023_present
status: candidate
name: "Hun Manet government and Pentagonal Strategy Phase I"
countries: [KHM]
timeframe: {start: 2023, end: ongoing}
coalition: "Cambodian People's Party-led Seventh Legislature government"
leaders:
  - "Hun Manet (Prime Minister from 2023)"
  - "Hun Sen (CPP president and former Prime Minister)"
policies: [khm_pentagonal_strategy_phase_i_2023]
doctrine: >
  The government introduced the Pentagonal Strategy Phase I as its
  socio-economic agenda for the Seventh Legislature. It combines public
  investment in people, roads, water, electricity, and technology with
  industrial upgrading, social protection, private investment, business and
  trade facilitation, and public-sector governance reforms. The strategy
  continues the CPP's long-run development model under a new prime minister;
  its targets are not treated as realised outcomes.
axes_summary:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "The strategy coordinates investment in infrastructure, human capital, technology, and selected productive sectors."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Public infrastructure and social-capital investment are central priorities, without implying the plan's targets were fully executed."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "The agenda includes social-protection and human-capital priorities, but the cited strategy does not establish the net change in cash transfers."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "The plan explicitly seeks a favourable environment for private business, investment, and trade, while leaving the governing party's state role intact."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Governance reform and stronger public institutions are stated core priorities; this codes programme direction only."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The programme uses national planning, infrastructure investment, and targeted productive-sector development."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private-sector development and business facilitation sit alongside a strong government-coordinated development agenda."}
references:
  - "Royal Government of Cambodia, Pentagonal Strategy Phase I, 24 August 2023: https://pressocm.gov.kh/wp-content/uploads/2023/08/ENG-Royal-Government-Pentagonal-Strategy-Phase-I.pdf"
  - "Council for the Development of Cambodia, Pentagonal Strategy Phase I and Development Cooperation Strategy: https://cdc-crdb.gov.kh/en/strategy.php?id=13"
  - "Cambodia Ministry of Information, Pentagonal Strategy Phase I announcement: https://www.information.gov.kh/articles/111673"
notes: "This adds the current Seventh Legislature programme. The long 1980–2022 interval after the authored Khmer Rouge-era movement remains open and should be split into distinct post-1979 governing phases."
