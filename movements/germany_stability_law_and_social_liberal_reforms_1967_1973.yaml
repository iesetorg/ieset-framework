# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_stability_law_and_social_liberal_reforms_1967_1973
status: candidate
name: West Germany stabilization law, Grand Coalition, and social-liberal reforms
countries: [DEU]
timeframe: {start: 1967, end: 1973}
coalition: "CDU/CSU-SPD Grand Coalition, followed by SPD-FDP social-liberal coalition"
leaders: ["Kurt Georg Kiesinger (Chancellor, 1966–1969)", "Willy Brandt (Chancellor, 1969–1974)"]
doctrine: >
  The 1967 Stability and Growth Act institutionalised countercyclical macroeconomic
  steering and cooperation between federal, state, and local governments. The 1969
  SPD-FDP coalition broadened civil and social reforms and pursued Ostpolitik while
  retaining the social-market economy. Expansionary social commitments and active
  demand management operated inside a private-market order; the 1973 oil shock
  exposed the limits of steering and preceded the existing Schmidt-era movement.
policies: [deu_stability_and_growth_act_1967]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "The Stability and Growth Act created a framework for countercyclical fiscal coordination and the Brandt government expanded social reforms."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "The social-liberal government expanded political participation and liberalised several areas of civil law."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "Social policy reforms broadened benefits and public protections."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: weak, rationale: "Macroeconomic coordination increased while the competitive social-market framework remained."}
predecessor_movements: [germany_wirtschaftswunder_erhard_1948_1966]
position_alignments:
  - {position_id: social_democratic, alignment: aligned, notes: "The Brandt-era coalition combined expanded social policy with political and civil liberalisation."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Macroeconomic coordination increased within a market economy rather than replacing private production."}
references:
  - "German Bundestag, Stability and Growth Act adopted 1967: https://www.bundestag.de/dokumente/textarchiv/1967-05-10-stabilitaetsgesetz-505290"
  - "German Federal Foundation for the Reappraisal of the SED Dictatorship, Social-liberal reforms: https://www.hdg.de/lemo/kapitel/geteiltes-deutschland-modernisierung/bundesrepublik-im-wandel/sozialliberale-reformen.html"
  - "German Federal Chancellor, Willy Brandt: https://www.bundeskanzler.de/bk-en/willy-brandt-1969-1974--1850180"
notes: "Ends before the 1973 oil shock and the Schmidt coalition movement that begins in 1974."
