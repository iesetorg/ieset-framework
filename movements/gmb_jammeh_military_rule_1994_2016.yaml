movement_id: gmb_jammeh_military_rule_1994_2016
status: candidate
name: Gambian Jammeh governments and authoritarian rule, 1994–2016
countries:
- GMB
timeframe:
  start: 1994
  end: 2016
coalition: Armed Forces Provisional Ruling Council followed by Alliance for Patriotic Reorientation and Construction
leaders:
- Yahya Jammeh
doctrine: Yahya Jammeh took power in a 1994 coup and remained in office until losing the 2016 election. The period
  combined an initial transition to civilian elections in 1996–97 with increasingly concentrated executive rule,
  weakened democratic checks, and repeated IMF-supported stabilisation efforts; severe fiscal and external imbalances
  accumulated before the 2017 transfer of power.
policies:
- gmb_jammeh_military_rule_1994_2016_policy
axes_summary:
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  rationale: The 1994 coup displaced constitutional government; executive power remained concentrated through 2016.
- axis: fiscal.spending_level
  direction: mixed
  magnitude: moderate
  rationale: Public spending and revenue practices shifted across adjustment episodes, while debt and arrears accumulated.
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: weak
  rationale: State intervention in agricultural credit and markets persisted in the 1990s.
references:
