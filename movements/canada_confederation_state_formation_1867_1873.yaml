# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: canada_confederation_state_formation_1867_1873
status: candidate
name: Canadian Confederation and federal state formation
countries: [CAN]
timeframe: {start: 1867, end: 1873}
coalition: Fathers of Confederation and the first Dominion government under John A. Macdonald
leaders:
  - John A. Macdonald
  - George-Étienne Cartier
doctrine: >
  Confederation united several British North American colonies in a Dominion
  with a federal Parliament and constitutionally divided federal and
  provincial responsibilities. It created a durable national framework
  within the British Empire; Indigenous peoples and territories were not
  parties to the bargain and were subjected to subsequent federal expansion.
policies:
  - ca_british_north_america_act_1867
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The British North America Act established a constitutional federal government and allocated legislative powers between Parliament and provinces; it did not establish full sovereignty from Britain or equal political inclusion.
    drift_attribution_year: 1867
    drift_attribution_basis: The British North America Act took effect on 1 July 1867.
references:
  - "Library of Parliament, Parliamentary Primer timeline: https://lop.parl.ca/staticfiles/Learn/Documents/ParliamentaryPrimer/LOP_TimelineBrochEN.pdf"
notes: Candidate backfill for federal state formation, not a numeric estimate of the size of government or market institutions.
