# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_nazi_dictatorship_war_economy_1933_1945
status: candidate
name: Nazi dictatorship, coercive economic control, rearmament, and war economy
countries: [DEU]
timeframe: {start: 1933, end: 1945}
coalition: "National Socialist dictatorship under Adolf Hitler"
leaders: ["Adolf Hitler (Chancellor and dictator, 1933–1945)", "Hjalmar Schacht (Economics Minister, 1934–1937)"]
doctrine: >
  The regime destroyed democratic institutions, outlawed independent unions and parties,
  and subordinated economic life to dictatorship, racial persecution, rearmament, and
  conquest. Private ownership formally persisted in many firms, but investment, labour,
  trade, and production were increasingly controlled through coercion and state
  priorities. From 1939, plunder, forced labour, and total war reshaped the economy.
  This is an authoritarian and coercive state-commanded war economy, not evidence that
  the regime was a democratic welfare or egalitarian socialist system.
policies: [deu_nazi_rearmament_and_war_economy_1933]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "The dictatorship dismantled elections, civil liberties, independent courts, and parliamentary government."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "Massive rearmament and war expenditure displaced civilian priorities."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: strong, rationale: "The state directed credit, procurement, labour, and industrial production toward rearmament and war."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, rationale: "Coercive allocation, controls, forced labour, and state priorities sharply displaced free market coordination."}
predecessor_movements: [germany_weimar_republic_and_economic_crises_1918_1932]
position_alignments:
  - {position_id: institutionalism, alignment: opposed, notes: "Dictatorship and persecution destroyed legal constraints and political pluralism."}
  - {position_id: classical_liberal, alignment: opposed, notes: "Coercive controls and state-directed war production displaced economic liberty and ordinary competition."}
references:
  - "German Federal Agency for Civic Education, Economic policy and economic constitution under National Socialism: https://www.bpb.de/shop/zeitschriften/apuz/archiv/528695/wirtschaftspolitik-und-wirtschaftsverfassung-im-dritten-reich/"
  - "German Federal Agency for Civic Education, 1933–2023 economic recovery and its historical context: https://www.bpb.de/shop/zeitschriften/apuz/deutschland-1933-2023/517474/der-aufschwung-der-anderen/"
notes: "Axis directions describe coercion, public allocation, and destruction of market institutions and civil rights; they do not confer ideological legitimacy."
