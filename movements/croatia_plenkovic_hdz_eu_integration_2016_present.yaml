# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: croatia_plenkovic_hdz_eu_integration_2016_present
status: candidate
name: "Croatia Plenkovic HDZ EU-integration reform 2016-present"
countries: [HRV]
timeframe: {start: 2016, end: ongoing}
coalition: "HDZ-led governments under Andrej Plenkovic"
leaders:
  - "Andrej Plenkovic (Prime Minister, 2016-present)"
doctrine: >
  Croatia's Plenkovic-era governing programme has emphasised deep EU
  integration, macro-institutional convergence, and incremental labour-market
  modernisation. The visible recent policy cluster is Croatia's entry into the
  euro area and Schengen zone in 2023, alongside Labour Act amendments covering
  fixed-term contracts, remote work, platform work, and employee information
  rights.
policies:
  - hr_euro_adoption_2023
  - hr_schengen_accession_2023
  - hr_labour_act_amendments_2023
axes_summary:
  - axis: regulatory.immigration_openness
    direction: "+"
    magnitude: moderate
    rationale: Full Schengen application lifted internal border checks on persons without changing residence or work rights.
    drift_attribution_year: 2023
    drift_attribution_basis: Council Decision (EU) 2022/2451, Article 1, lifted land and sea checks from 1 January 2023 and air checks from 26 March 2023.
  - axis: regulatory.labour_market_flexibility
    direction: mixed
    magnitude: moderate
    rationale: Labour Act amendments tightened fixed-term rules while formalising remote and additional work; later platform provisions have a separate 2024 commencement.
    drift_attribution_year: 2023
    drift_attribution_basis: Official Gazette NN 151/2022, Article 67, generally commenced the Labour Act amendments on 1 January 2023.
references:
  - "Council Decision (EU) 2022/1211 on euro adoption: https://eur-lex.europa.eu/eli/dec/2022/1211/oj"
  - "Council Decision (EU) 2022/2451 on Schengen application: https://eur-lex.europa.eu/eli/dec/2022/2451/oj"
  - "Croatia Labour Act amendments, Official Gazette NN 151/2022: https://narodne-novine.nn.hr/clanci/sluzbeni/2022_12_151_2343.html"
notes: >
  The euro and Schengen decisions do not move the trade-policy axis, and
  verification of Schengen conditions or codification of employment rules does
  not establish a general rule-of-law gain. The remaining border and labour
  steps are attributed to their 2023 operative year, not the government's
  2016 start.
