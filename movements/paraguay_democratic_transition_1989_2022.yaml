# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: paraguay_democratic_transition_1989_2022
status: candidate
name: Paraguay democratic transition and Colorado Party continuity
countries: [PRY]
timeframe: {start: 1989, end: 2022}
coalition: Colorado Party governments and successive elected administrations
leaders: ["Andrés Rodríguez (President, 1989-1993)", "Juan Carlos Wasmosy (President, 1993-1998)", "Fernando Lugo (President, 2008-2012)", "Horacio Cartes (President, 2013-2018)", "Mario Abdo Benítez (President, 2018-2023)"]
doctrine: >
  After the 1989 coup ended Stroessner's rule, Paraguay moved toward electoral
  democracy, adopted a new constitution in 1992, and joined Mercosur as a
  founding member in 1991. Colorado Party governments continued to dominate
  national politics, while elected administrations pursued varied economic
  agendas and institutional reforms. This broad transition period records the
  change in governing rules and regional market integration without implying
  a uniform policy direction across successive governments.
policies: [paraguay_democratic_transition_1989]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, drift_attribution_year: 1989, drift_attribution_basis: "The 1989 coup ended the 34-year dictatorship and began the transition to democratic constitutional government documented by the OECD."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, drift_attribution_year: 1991, drift_attribution_basis: "Paraguay became a founding member of Mercosur in 1991, establishing a discrete regional trade integration event."}
references:
  - "OECD, Setting the scene: Good governance for a more sustainable and inclusive Paraguay: https://www.oecd.org/en/publications/oecd-public-governance-reviews-paraguay_9789264301856-en/full-report/component-5.html"
successor_movements: [paraguay_pena_colorado_2023_present]
predecessor_movements: [paraguay_stroessner_regime_1954_1989]
