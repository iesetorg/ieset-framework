# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: benin_wadagni_pag_2026_present
status: candidate
name: "Wadagni pro-Talon technocratic continuity government (Benin, 2026-present)"
countries: [BEN]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-05-24"
coalition: "Pro-Talon Progressive Union Renewal / Republican Bloc majority coalition"
leaders:
  - "Romuald Wadagni (President, from May 2026)"
  - "Mariam Chabi Talata (Vice President)"
doctrine: >
  Technocratic succession from Patrice Talon to his long-serving finance
  minister Romuald Wadagni after the April 2026 presidential election.
  The doctrine is continuity of the Programme d'Actions du Gouvernement:
  fiscal discipline, infrastructure, Glo-Djigbe industrial-zone expansion,
  social-protection rollout, investor-facing administration, and a highly
  controlled party system in which the pro-government blocs dominate the
  legislature.
policies:
  - bj_wadagni_pag_continuity_2026
  - bj_arch_social_protection_continuation_2026
  - bj_controlled_party_system_continuity_2026
axes_summary:
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "Infrastructure and social spending continue under a finance-minister president committed to fiscal control."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Industrial-zone and agro-processing support remains central to the PAG model."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "Export-processing and logistics policy continue Talon-era investor-facing posture."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: moderate, rationale: "Election followed restrictive ballot-access and party-sponsorship rules; opposition representation remains sharply narrowed."}
predecessor_movements:
  - benin_talon_pag_reform_state_2016_2026
position_alignments:
  - {position_id: developmentalism, alignment: aligned}
  - {position_id: empirical_pragmatist, alignment: partially_aligned}
  - {position_id: institutionalism, alignment: opposed}
references:
  - "2026 Beninese presidential election: Romuald Wadagni won with over 94 percent of the vote."
  - "AP, 16 April 2026, Benin court confirmed Wadagni's election."
  - "Reuters, 13 April 2026, Wadagni landslide and opposition concession."
notes: >
  Current-government update for Benin after Talon's final term. Candidate
  status because this is mostly continuity coding until a first Wadagni
  budget and policy package are observable.
