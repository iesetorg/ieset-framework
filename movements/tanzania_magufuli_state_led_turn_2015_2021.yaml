# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: tanzania_magufuli_state_led_turn_2015_2021
status: candidate
name: Tanzania Magufuli-era state-led industrialisation and resource nationalism
countries: [TZA]
timeframe: {start: 2015, end: 2021}
coalition: "Chama Cha Mapinduzi (CCM) government under John Magufuli"
leaders: ["John Magufuli (President, 2015–2021)"]
doctrine: >
  The administration renewed state direction of development, prioritised public
  infrastructure and industrialisation, and used assertive resource-nationalist
  measures in mining. Public investment expanded while the government increased
  pressure on private investors and civic institutions. This phase is a state-led
  turn within the long-running CCM system; its scope varies across sectors and policy
  execution, so it should not be read as a return to full Ujamaa nationalisation.
policies: [tz_magufuli_state_led_industrialisation_2016]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Public investment in major infrastructure became a prominent growth strategy."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "State direction and resource-nationalist rules increased government control over strategic sectors."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: weak, rationale: "More confrontational investment and trade policy raised uncertainty for some private operators."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: moderate, rationale: "Civic and political constraints tightened during the period."}
predecessor_movements: [tanzania_mkapa_kikwete_structural_reform_1995_2015]
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Infrastructure-led growth and state direction of investment were central policy tools."}
  - {position_id: national_conservatism, alignment: partially_aligned, notes: "Resource sovereignty rhetoric accompanied stronger executive control, though the period is principally coded for state economic direction."}
references:
  - "World Bank IEG, Tanzania Country Program Evaluation: https://ieg.worldbankgroup.org/evaluations/world-bank-group-tanzania/overview"
  - "IMF, Tanzania 2017 Article IV Consultation: https://www.elibrary.imf.org/view/journals/002/2017/013/article-A001-en.xml"
notes: "Ends with Magufuli's death and the March 2021 succession; the successor administration is separately recorded."
