# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: laos_nsedp_development_and_diversification_2021_present
status: candidate
name: "Lao PDR's Ninth and Tenth Socio-Economic Development Plan cycle"
countries: [LAO]
timeframe: {start: 2021, end: ongoing}
coalition: "Lao People's Revolutionary Party government"
leaders:
  - "Thongloun Sisoulith (Party General Secretary and President from 2021)"
  - "Sonexay Siphandone (Prime Minister from 2022)"
policies: [lao_tenth_national_socioeconomic_plan_2026]
doctrine: >
  The Ninth Five-Year National Socio-Economic Development Plan implemented
  the Eleventh Party Congress resolution and prioritised productive sectors,
  services, well-being, trade, and graduation from least-developed-country
  status. The Tenth Plan for 2026–2030 continues this state-planning approach
  with growth and diversification targets. The plans seek private investment
  and productivity while retaining party-led development direction and a
  substantial role for public infrastructure and state institutions.
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Multi-year plans coordinate state priorities, public infrastructure, and productive-sector investment; targets are not treated as executed expenditure."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "The plans steer development toward productive sectors, infrastructure, and services through state-led planning."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "The plans seek productivity, trade, private investment, and smoother LDC graduation while preserving a party-directed economic system."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "The Ninth Plan explicitly seeks balanced international trade and settlement and integration with regional markets."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "The plans formalise medium-term national objectives and government coordination, without implying competitive political pluralism."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The party-state coordinates multi-year development priorities and investment."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private investment and market integration are development tools inside a one-party state-planning framework."}
references:
  - "Lao PDR, Ninth Five-Year National Socio-Economic Development Plan 2021–2025: https://nipn.lsb.gov.la/document/the-9th-national-socio-economic-development-plan-2021-2025/"
  - "Lao News Agency, Tenth National Socio-Economic Development Plan 2026–2030 targets: https://kpl.gov.la/asean2024/en/detail.aspx?id=97147"
  - "Lao News Agency, draft Tenth Five-Year NSEDP review: https://kpl.gov.la/asean2024/En/detail.aspx?id=91910"
notes: "This adds the 2021–2030 planning cycle only. The prior New Economic Mechanism and later policy phases from 1986–2020 remain uncoded."
