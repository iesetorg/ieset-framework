# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: sweden_hansson_crisis_reforms_1933_1935
status: candidate
name: Hansson minority government's crisis and unemployment-insurance reforms
countries: [SWE]
timeframe: {start: 1933, end: 1935}
coalition: Social Democratic minority government with Farmers' League support for the 1933 crisis settlement
leaders:
  - Per Albin Hansson (prime minister)
  - Ernst Wigforss (finance minister)
  - Gustav Möller (social affairs minister)
doctrine: >
  The Hansson Social Democratic minority government pursued unemployment
  relief through additional publicly financed work during the Depression
  and introduced state support for voluntary unemployment funds. Its 1933
  crisis settlement with the Farmers' League combined unemployment and
  agricultural measures, but these two linked policies code only the
  documented public-works and unemployment-fund decisions. This is a
  bounded early reform episode, not a single score for the full 1932-1976
  period of Social Democratic government or for Sweden's welfare-state level.
policies:
  - se_hansson_public_works_1933
  - se_unemployment_funds_state_support_1934
axes_summary:
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: weak
    rationale: Documented 1933/34 public-works appropriations; no claim about measured total spending share.
    drift_attribution_year: 1933
    drift_attribution_basis: Riksdag's 1933 budget decision for state and municipal contingency works.
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: weak
    rationale: 1934 adoption of state grants for recognized voluntary unemployment funds, effective 1935.
    drift_attribution_year: 1934
    drift_attribution_basis: Riksdag adopted the unemployment-fund ordinances in 1934; implementation began in 1935.
predecessor_movements: []
successor_movements: []
references:
  - "Riksdag historical account of the 1933 Hansson-Farmers' League crisis bargain: https://data.riksdagen.se/fil/C790C326-7039-4376-BF79-30095B7BC3E7"
  - "Riksdag 1933, Special Committee Report No. 17: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/utlatande/sarskilda-utskottets-utlatande-nr-17_du10s%C3%A4ru17/"
  - "Swedish Government Official Report SOU 2008:54, section 2.2: https://www.regeringen.se/contentassets/c8ac7b3b1e5e47f693658714cd354db7/obligatorisk-arbetsloshetsforsakring-sou-200854/"
notes: >
  Candidate coding is confined to two discrete decisions. The intervening
  1936-1975 years are not asserted to be stable or comprehensively coded.
