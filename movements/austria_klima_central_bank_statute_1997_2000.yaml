# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: austria_klima_central_bank_statute_1997_2000
status: candidate
name: Klima coalition and the 1998 Austrian central-bank statute
countries: [AUT]
timeframe: {start: 1997, end: 2000}
coalition: SPÖ-ÖVP grand coalition
leaders:
  - Viktor Klima (Chancellor)
  - Wolfgang Schüssel (Vice-Chancellor)
doctrine: >
  The Klima coalition completed Austria's legal preparation for monetary union.
  Parliament amended the Nationalbank Act in 1998 to protect the Oesterreichische
  Nationalbank's independence from national fiscal authorities before monetary
  powers transferred to the Eurosystem in 1999. This record codes the national
  statutory change and does not treat euro membership as another independence step.
policies:
  - at_nationalbank_independence_amendment_1998
axes_summary:
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: moderate
    rationale: Nationalbank Act amendment made OeNB independence provisions effective on 3 May 1998.
    drift_attribution_year: 1998
    drift_attribution_basis: "OeNB Annual Report 1998 dates its domestic independence provisions to 3 May 1998; https://www.oenb.at/dam/jcr%3A93070658-de80-4c76-81dd-83597697b827/ar_1998_tcm16-8010.pdf"
predecessor_movements: [austria_vranitzky_grand_coalition_1986_1997]
successor_movements: [austria_schussel_ovp_fpo_2000_2007]
references:
  - https://www.oenb.at/dam/jcr%3A93070658-de80-4c76-81dd-83597697b827/ar_1998_tcm16-8010.pdf
  - https://www.bundeskanzleramt.gv.at/bundeskanzleramt/geschichte/regierungen-seit-1945.html?lang=en
notes: "Narrow legal-change record; other Klima-era fiscal and market policies are not imputed."
