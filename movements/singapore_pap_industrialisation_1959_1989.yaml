# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: singapore_pap_industrialisation_1959_1989
status: candidate
name: PAP self-government and state-led industrialisation
countries:
- SGP
timeframe:
  start: 1959
  end: 1989
coalition: People's Action Party government
leaders:
- Lee Kuan Yew
- Goh Keng Swee
doctrine: 'Following self-government in 1959 and independence in 1965, the PAP government built public institutions
  for industrialisation, public housing, education, infrastructure, and export-led growth. Singapore remained open
  to trade and multinational investment while the state coordinated land, housing, labour, and industrial development.
  This period is coded as a state-capacity and developmental-strategy shift, not as a uniform expansion of public
  ownership.

  '
policies:
- singapore_pap_industrialisation_1959_1989_policy
- singapore_medisave_1984
axes_summary:
- axis: fiscal.spending_level
  direction: +
  magnitude: moderate
  rationale: Public housing, infrastructure, and education formed major state-led development programmes.
- axis: regulatory.trade_openness
  direction: +
  magnitude: moderate
  rationale: Export-oriented industrialisation and multinational investment tied growth to external markets.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: weak
  rationale: The strategy cultivated export industries and private investment while retaining extensive state coordination.
references:
- 'Singapore Parliament, Historical Development: https://www.parliament.gov.sg/history/historical-development'
- 'SG101, 1959-1965: https://www.sg101.gov.sg/economy/surviving-our-independence/1959-1965/'
- 'SG101, 1965-1970: https://www.sg101.gov.sg/economy/surviving-our-independence/1965-1970/'
- 'SG101, 1986 to 1996: Rebounding into a Decade of Growth: https://www.sg101.gov.sg/economy/growing-our-economy/1986/'
notes: 'Candidate national-period summary. Start-year plotting is a period proxy; Singapore became self-governing
  in 1959 and independent in 1965. It does not assign all later policy changes to the opening year.

  '
