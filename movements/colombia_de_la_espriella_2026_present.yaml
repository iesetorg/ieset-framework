movement_id: colombia_de_la_espriella_2026_present
status: candidate
name: "De la Espriella Defenders of the Homeland right-populist transition (Colombia, 2026-present)"
countries: [COL]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-08-07"
coalition: "Defensores de la Patria / Salvacion Nacional presidential coalition; president-elect before the 7 August 2026 handover"
leaders:
  - "Abelardo de la Espriella (President-elect, confirmed June 2026)"
  - "Jose Manuel Restrepo (Vice-presidential running mate)"
  - "Miguel Gomez Martinez (designated Finance Minister)"
doctrine: >
  Right-populist, security-first successor to the Petro presidency. The
  campaign and transition platform combines hard-line anti-crime and
  anti-guerrilla policy, proposed prison expansion and militarised security
  measures, reversal of Petro's no-new-exploration hydrocarbon posture,
  lower business taxes and labour-market flexibility, and an explicit
  alignment with Trump-era hemispheric security rhetoric. The transition
  has also emphasised fiscal repair and public-debt reprofiling language
  amid high deficits and loss of fiscal-rule credibility.
policies:
  - co_de_la_espriella_security_prison_plan_2026
  - co_hydrocarbon_exploration_reopening_2026
  - co_fiscal_reprofiling_adjustment_2026
axes_summary:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "Transition team signalled large expenditure adjustment and debt-maturity reprofiling to restore fiscal credibility."}
  - {axis: fiscal.tax_corporate, direction: "-", magnitude: weak, rationale: "Campaign platform favoured lower business burden; legislation pending."}
  - {axis: regulatory.labour_market_flexibility, direction: "+", magnitude: weak, rationale: "Campaign signalled rollback of Petro labour-rigidity agenda, pending enacted package."}
  - {axis: regulatory.energy_supply_security, direction: "+", magnitude: strong, rationale: "Platform favours renewed oil/gas exploration and fracking after Petro moratorium posture."}
  - {axis: regulatory.environmental_stringency, direction: "-", magnitude: moderate, rationale: "Hydrocarbon reopening and fracking posture reduce fossil-fuel restriction relative to Petro."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Law-and-order claims run through formal election result but proposed coercive security expansion warrants close review."}
outcome_hypotheses:
