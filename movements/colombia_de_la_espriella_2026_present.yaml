  - {position_id: austrian, alignment: partially_aligned, notes: "Anti-statist economic rhetoric but not a clean libertarian programme."}
  - {position_id: social_democratic, alignment: opposed}
  - {position_id: eco_socialist, alignment: opposed}
references:
