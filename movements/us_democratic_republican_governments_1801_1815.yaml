# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_democratic_republican_governments_1801_1815
status: candidate
name: Jefferson and Madison Democratic-Republican governments
countries: [USA]
timeframe: {start: 1801, end: 1815}
coalition: Democratic-Republican administrations of Thomas Jefferson and James Madison
leaders: ["Thomas Jefferson", "James Madison", "Albert Gallatin"]
doctrine: >
  The Jefferson and Madison administrations inherited a federal republic still
  defining the scope of national power. The Louisiana Purchase expanded the
  territory under federal jurisdiction; Jefferson's 1807 embargo temporarily
  restricted foreign trade; and the War of 1812 brought sharply higher federal
  military and borrowing demands. This interval includes shifts in opposite
  directions and is not represented by a single ideological label or a
  continuous trend.
policies:
  - us_louisiana_purchase_1803
  - us_embargo_act_1807
  - us_war_of_1812_federal_financing
axes_summary:
  - axis: regulatory.trade_openness
    direction: "-"
    magnitude: strong
    rationale: The Embargo Act substantially restricted foreign commerce from 1807 until repeal in 1809.
    drift_attribution_year: 1807
    drift_attribution_basis: Congress passed the Embargo Act on 22 December 1807.
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: moderate
    rationale: The War of 1812 expanded federal military outlays and borrowing; debt is cited as context, not a spending-share estimate.
    drift_attribution_year: 1812
    drift_attribution_basis: Congress declared war in June 1812, initiating the major federal wartime mobilization.
references:
  - "U.S. National Archives, Louisiana Purchase Treaty (1803): https://www.archives.gov/milestone-documents/louisiana-purchase-treaty"
  - "U.S. Treasury, Historical Debt Outstanding — history of the debt: https://treasurydirect.services.treasury.gov/government/historical-debt-outstanding/"
  - "U.S. Department of the Treasury, Albert Gallatin (1801–1814): https://home.treasury.gov/about/history/prior-secretaries/albert-gallatin-1801-1814"
  - "U.S. Senate, Declaration of War with Great Britain, 1812: https://www.senate.gov/about/images/documents/war-of-1812-senate-amendments.htm"
notes: "The U.S. national drift record intentionally excludes California's subnational climate movement; this federal episode is based on national actions only."
