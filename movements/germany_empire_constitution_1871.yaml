# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_empire_constitution_1871
status: candidate
name: German Empire constitutional unification
countries: [DEU]
timeframe: {start: 1871, end: 1871}
coalition: Prussian-led German Empire under Wilhelm I and Chancellor Otto von Bismarck
leaders:
  - Wilhelm I
  - Otto von Bismarck
doctrine: >
  The 1871 constitution unified the German states in a federal empire. The
  Bundesrat represented member states and the Reichstag legislated and
  approved budgets, but the Kaiser-appointed Chancellor and monarchic
  executive retained extensive power over government, military, and foreign
  affairs. The new state was therefore federal and parliamentary in part, not
  a parliamentary democracy.
policies:
  - germany_imperial_constitution_1871
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: A written imperial constitution and Reichstag established common legislative institutions, while the monarchic executive was not accountable to a parliamentary majority.
    drift_attribution_year: 1871
    drift_attribution_basis: The Imperial Constitution was promulgated on 16 April 1871.
references:
  - "German Bundestag, The Empire (1871–1918): https://www.bundestag.de/en/parliament/history/parliamentarism/empire"
  - "German Bundestag, Constitution of 1871: https://www.bundestag.de/besuche/ausstellungen/verfassung/tafel12"
notes: Candidate historical backfill; the federal and parliamentary features should not be read as democratic executive accountability.
