doctrine: The 1980 coup ended the long True Whig Party era and installed military rule, followed by a
  controlled constitutional transition and the contested 1985 election. The period combined concentrated
  political authority and patronage with an economy still dependent on private firms, foreign investment,
  and commodity exports; political authoritarianism should not be read as comprehensive state ownership.
