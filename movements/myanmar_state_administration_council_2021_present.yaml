movement_id: myanmar_state_administration_council_2021_present
status: candidate
name: State Administration Council military rule and contested state economy
countries: [MMR]
timeframe: {start: 2021, end: ongoing, enacted_date: "2021-02-01"}
coalition: State Administration Council and Myanmar armed forces
leaders: [Min Aung Hlaing]
policies: [mmr_state_administration_council_military_takeover_2021]
doctrine: >
  The military takeover dissolved the elected political order and concentrated
  executive authority in the State Administration Council. The junta has
  sought to govern through military administration while facing nationwide
  resistance and territorial fragmentation; this record describes the
  governing project, not uncontested control of Myanmar.
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "The coup detained elected leaders, displaced the elected legislature, and was followed by repression and armed conflict."}
references:
  - "UN Secretary-General, report on Myanmar, S/2025/81: https://myanmar.un.org/sites/default/files/2025-04/n2506635%20%281%29.pdf"
notes: "The junta's authority is contested and fragmented. The movement line represents the coup regime, not a claim of nationwide effective control. No market-policy direction is inferred from the coup alone."
