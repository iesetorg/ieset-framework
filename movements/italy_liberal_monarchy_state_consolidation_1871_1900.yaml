# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: italy_liberal_monarchy_state_consolidation_1871_1900
status: candidate
name: Liberal Kingdom of Italy — territorial and parliamentary consolidation
countries: [ITA]
timeframe: {start: 1871, end: 1900}
coalition: Liberal parliamentary governments under the House of Savoy
leaders: ["Victor Emmanuel II", "Umberto I"]
doctrine: >
  After Rome's annexation, Parliament transferred the government to the new
  national capital in 1871. The Kingdom operated through a constitutional
  monarchy and bicameral Parliament, but political power and voting remained
  restricted by property, literacy, and gender barriers. This entry records
  state consolidation, not universal democratic inclusion or an inference
  about the market/state balance.
policies: [it_rome_capital_and_liberal_state_1871]
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    rationale: Central institutions were consolidated in Rome under the constitutional monarchy; electoral inclusion remained narrow.
    drift_attribution_year: 1871
    drift_attribution_basis: Parliament enacted the transfer of the seat of government to Rome in February 1871.
references:
  - "Italian Senate, 11th Legislature (1870–1874), Rome annexation and transfer of the seat of government: https://www.senato.it/node/84617/printable/print"
notes: "The movement is a thinly coded political interval pending deeper policy evidence; it carries only one conservative institutional attribution."
