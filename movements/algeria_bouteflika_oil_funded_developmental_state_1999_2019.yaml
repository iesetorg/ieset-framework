# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: algeria_bouteflika_oil_funded_developmental_state_1999_2019
status: candidate
name: "Bouteflika-era oil-funded developmental state"
countries: [DZA]
timeframe: {start: 1999, end: 2019}
coalition: "FLN-led administrations"
leaders: ["Abdelaziz Bouteflika"]
doctrine: >
  Following the 1990s civil conflict, rising hydrocarbon revenues financed a
  return to growth through large public investment programmes and transfers.
  The government retained a prominent public-enterprise and public-bank
  sector, while pursuing selective business-climate and private-sector reforms.
  Lower oil prices after 2014 triggered fiscal consolidation and, by 2018, a
  turn to monetary financing and import restrictions. The period is a
  state-led recovery with late-stage fiscal and trade reversals.
policies: [dz_oil_funded_public_investment_2000]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "Oil-funded investment programmes and transfers expanded the public spending role, despite post-2014 consolidation and a 2018 spending reversal."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "State investment and enterprise programmes channelled hydrocarbon revenue into infrastructure and public services."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: weak, rationale: "Public enterprises and state banks remained dominant despite selective efforts to improve the business climate."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: weak, rationale: "Import barriers hardened by 2018 after a period of gradual liberalization."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Oil revenues were channelled through national public investment and state institutions."}
  - {position_id: classical_liberal, alignment: opposed, notes: "The public sector remained dominant, particularly in hydrocarbons, finance, and major infrastructure."}
references:
  - "World Bank, Algeria country economic memorandum: https://documents1.worldbank.org/curated/en/155121468742836006/pdf/multi0page.pdf"
  - "IMF, Algeria 2018 Article IV Consultation: https://www.elibrary.imf.org/view/journals/002/2018/168/article-A001-en.xml"
  - "World Bank, Algeria fiscal developments: https://documents1.worldbank.org/curated/en/099514310252319658/pdf/IDU0a007dcea0411604dc009a830ad4ea8f93962.pdf"
notes: "The 2019 protest movement and subsequent political transition begin a distinct coded period."
