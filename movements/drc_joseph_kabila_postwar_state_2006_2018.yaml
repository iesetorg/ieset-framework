# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: drc_joseph_kabila_postwar_state_2006_2018
status: candidate
name: Post-transition Joseph Kabila governments and resource-led growth
countries: [COD]
timeframe: {start: 2006, end: 2018}
coalition: Presidential and coalition governments under Joseph Kabila
leaders: [Joseph Kabila]
doctrine: >
  The 2006 elections ended the formal political transition and installed the
  first elected postwar government. Macroeconomic stabilisation, mining-sector
  reform, infrastructure rebuilding, and oil and mineral investment were paired
  with weak public-service delivery, continuing conflict in the east, and
  increasingly disputed elections before the delayed transfer of power in 2019.
policies: [drc_joseph_kabila_postwar_state_2006_2018_policy]
axes_summary:
  - {axis: regulatory.sectoral_licensing, direction: +, magnitude: moderate, rationale: Mining and resource extraction remained central to investment and public revenue.}
  - {axis: fiscal.spending_level, direction: +, magnitude: weak, rationale: "Public reconstruction and infrastructure spending expanded from the postwar baseline, with limited service reach."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: weak, rationale: Repeated election delays and constraints on political accountability weakened institutional checks.}
references:
  - "IMF, DRC 2007 Article IV: https://www.elibrary.imf.org/view/journals/002/2007/327/article-A001-en.xml"
  - "UN MONUSCO, DRC mission background and mandate: https://peacekeeping.un.org/en/mission/monusco"
notes: "The period contains major election and conflict episodes; the summary is a national-level proxy."
