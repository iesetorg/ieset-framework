# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_reconstruction_civil_rights_1865_1877
status: candidate
name: US Reconstruction federal civil-rights settlement
countries: [USA]
timeframe: {start: 1865, end: 1877}
coalition: Republican congressional Reconstruction coalition and federal enforcement administrations
leaders:
  - Ulysses S. Grant (President 1869-1877)
  - Thaddeus Stevens (House Republican leader during congressional Reconstruction)
doctrine: >
  Reconstruction sought to define the legal and political status of formerly
  enslaved people after the Civil War. Constitutional amendments ended slavery,
  established national citizenship and equal-protection guarantees, and barred
  race-based denial of voting rights; Congress also authorized federal action
  against organized violence and voter intimidation. These formal changes
  expanded the federal role in enforcing civil and political rights, although
  protection was uneven and the national enforcement effort contracted sharply
  after the 1877 political settlement.
policies:
  - us_reconstruction_amendments_1865_1870
  - us_enforcement_acts_1870_1871
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The Thirteenth Amendment abolished slavery and authorized congressional enforcement.
    drift_attribution_year: 1865
    drift_attribution_basis: The Thirteenth Amendment was ratified on 1865-12-06.
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The Fourteenth Amendment established national citizenship and equal-protection and due-process guarantees.
    drift_attribution_year: 1868
    drift_attribution_basis: The Fourteenth Amendment was ratified on 1868-07-09.
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The Fifteenth Amendment barred race-based denial of voting rights and gave Congress enforcement authority.
    drift_attribution_year: 1870
    drift_attribution_basis: The Fifteenth Amendment was ratified on 1870-02-03.
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: weak
    rationale: The Enforcement Acts supplied federal criminal and election-supervision tools, although effective protection remained partial.
    drift_attribution_year: 1871
    drift_attribution_basis: The Third Enforcement Act, commonly called the Ku Klux Klan Act, was enacted on 1871-04-20.
references:
  - "https://www.archives.gov/exhibits/documented-rights/exhibit/section2/index.html"
  - "https://www.archives.gov/research/african-americans/vote/laws-and-courts"
  - "https://www.archives.gov/milestone-documents/15th-amendment"
notes: >
  The 1865-1877 span denotes the Reconstruction political period. The coded
  axis steps are tied to the dates of constitutional and statutory decisions;
  the timeframe does not imply continuous or successful enforcement in every
  year or region.
