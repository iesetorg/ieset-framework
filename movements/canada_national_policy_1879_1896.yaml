# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: canada_national_policy_1879_1896
status: candidate
name: Macdonald's National Policy — protective tariff and industrial nation-building
countries: [CAN]
timeframe: {start: 1879, end: 1896, enacted_date: "1879-03-14"}
coalition: Conservative governments under John A. Macdonald
leaders: ["John A. Macdonald", "Thomas White"]
doctrine: >
  The Conservative government combined a protective customs tariff with
  transcontinental railway construction and western settlement as a program of
  national economic integration. The tariff was explicitly presented as a way
  to raise revenue and protect selected manufacturers. This record isolates
  the documented tariff direction rather than assigning the whole national
  development program one undifferentiated score.
policies: [ca_national_policy_tariff_1879]
axes_summary:
  - axis: regulatory.trade_openness
    direction: "-"
    magnitude: moderate
    rationale: The 1879 tariff raised duties on selected imports under a protective national policy.
    drift_attribution_year: 1879
    drift_attribution_basis: The tariff program was introduced in the 14 March 1879 budget.
references:
  - "House of Commons of Canada, Budget speech, 14 March 1879: https://lop.parl.ca/staticfiles/ParlInfo/Documents/Budgets/En/1879-03-14.pdf"
  - "John H. Young, Canadian Commercial Policy, Royal Commission on Canada's Economic Prospects (1957): https://publications.aws.tpsgc-pwgsc.cloud-nuage.canada.ca/site/eng/9.894071/publication.html"
notes: "The movement describes federal policy, not the experience of Indigenous peoples, whose lands and political rights were excluded from this nation-building settlement."
