# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: algeria_transition_and_civil_conflict_1989_1999
status: candidate
name: "Algerian political opening, market transition, and civil conflict"
countries: [DZA]
timeframe: {start: 1989, end: 1999}
coalition: "FLN governments and 1990s transitional authorities"
leaders: ["Chadli Bendjedid", "Liamine Zeroual"]
doctrine: >
  The 1989 constitution introduced political pluralism as the government
  pursued market-oriented reforms after the 1986 oil shock. Liberalization
  included price and trade reform, public-enterprise restructuring, and
  subsidy changes. The interruption of the 1991-92 electoral process and the
  ensuing civil conflict constrained institutions and economic recovery;
  stabilization and structural reform resumed from 1994 but remained uneven.
policies: [dz_market_transition_and_stabilization_1989]
axes_summary:
  - {axis: regulatory.price_control_intensity, direction: "-", magnitude: strong, rationale: "By the mid-1990s most price and margin controls had been removed, with selected essentials retaining controls or subsidies."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Trade and foreign-exchange regimes opened in stages, though execution slowed during political turmoil."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Competition rules and restructuring opened space for private enterprise, while public firms continued to dominate key sectors."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "The 1989 pluralist constitution was followed by the suspension of elections and prolonged civil conflict."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Economic liberalization and the political opening were significant, but were interrupted and did not produce a stable liberal order."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "State ownership remained extensive and reform was guided by the central government."}
references:
  - "World Bank, Algeria country economic memorandum: https://documents1.worldbank.org/curated/en/807171468766175611/pdf/multi0page.pdf"
  - "IMF, Algeria institutional reforms during the 1990s: https://www.elibrary.imf.org/view/journals/002/1996/071/article-A001-en.xml"
  - "World Bank, Algeria transition to a market economy: https://documents1.worldbank.org/curated/en/465181468164057191/pdf/31105.pdf"
notes: "The movement separates the 1989 political opening from its interruption and from the post-conflict Bouteflika period."
