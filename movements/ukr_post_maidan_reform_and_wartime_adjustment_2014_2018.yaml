doctrine: After the 2014 political rupture and onset of war in the east, governments floated the currency, restructured
  banks, raised energy tariffs, and sought fiscal stabilisation and governance reform under IMF support. Output
  contracted severely in 2014–2015 before a gradual recovery, while implementation remained uneven.
