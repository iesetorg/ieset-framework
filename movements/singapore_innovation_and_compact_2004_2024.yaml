movement_id: singapore_innovation_and_compact_2004_2024
status: candidate
name: Singapore innovation-led growth and social compact renewal
countries:
  - SGP
timeframe:
  start: 2004
  end: 2023
coalition: People's Action Party government
leaders:
  - Lee Hsien Loong
doctrine: >
  The 2004–24 government continued an open, export-oriented economy while
  investing in research, skills, digital infrastructure, and higher-value
  industries. Fiscal policy emphasized long-run sustainability and reserves;
  social policy used targeted supports and the Forward Singapore exercise to
  refresh the social compact. These policies joined market integration to
  active public investment and selective redistribution.
policies:
  - singapore_innovation_and_compact_2004_2024_policy
axes_summary:
  - axis: regulatory.trade_openness
    direction: +
    magnitude: weak
    rationale: The government maintained Singapore's role in global trade and investment networks.
  - axis: fiscal.spending_level
    direction: +
    magnitude: moderate
    rationale: Public investment supported research, skills, digital infrastructure, and industrial upgrading.
  - axis: fiscal.transfer_expansion
    direction: +
    magnitude: weak
    rationale: Targeted social support and social-compact renewal expanded selected assistance.
