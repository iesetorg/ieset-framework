doctrine: Following Ali Bongo’s 2009 election, the government pursued an economic-emergence and diversification
  agenda in an oil-dependent economy. The 2014 oil-price shock and later COVID-19 shock weakened public finances;
  successive IMF-supported programmes targeted fiscal adjustment, arrears, and diversification before the 2023 military
  transition.
