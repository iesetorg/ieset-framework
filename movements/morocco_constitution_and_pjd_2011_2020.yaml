# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: morocco_constitution_and_pjd_2011_2020
status: candidate
name: Constitutional reform, PJD-led government, and social-policy expansion
countries: [MAR]
timeframe: {start: 2011, end: 2020}
coalition: Constitutional monarchy with PJD-led governing coalitions
leaders: [Mohammed VI, Abdelilah Benkirane, Saadeddine Othmani]
doctrine: >
  Following regional protest in 2011, a revised constitution strengthened the
  formal role of parliament and the head of government and expanded provisions
  for decentralisation and rights. The PJD led governing coalitions after the
  2011 election, while the monarchy retained extensive executive powers.
  Economic policy combined public investment and sector strategies with fuel
  subsidy removal, private-enterprise promotion, and the preparation of a
  universal social protection expansion in 2020.
policies: [morocco_constitution_and_pjd_2011_2020_policy]
axes_summary:
  - {axis: institutional.rule_of_law, direction: +, magnitude: weak, rationale: "The 2011 constitution modestly strengthened formal parliamentary and judicial institutions, though royal powers remained extensive."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, rationale: Most petroleum price subsidies were phased out from 2012 to 2015.}
  - {axis: fiscal.transfer_expansion, direction: +, magnitude: weak, rationale: The government prepared a broader social protection and health coverage reform by 2020.}
references:
  - "World Bank, Morocco political and economic transition overview: https://documents1.worldbank.org/curated/en/099445305182323280/pdf/SECBOS0941e8cb0520b7060244f58dca781.pdf"
  - "World Bank, Morocco social protection reform 2020: https://www.worldbank.org/en/news/press-release/2020/12/03/world-bank-supports-moroccos-social-protection-response-and-reform"
  - "IMF, Morocco 20 Years of Reforms: https://www.elibrary.imf.org/display/book/9798400225406/CH001.xml"
notes: "This represents an incremental constitutional change within a continuing monarchy, not a transition to parliamentary sovereignty."
