# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: hungary_magyar_tisza_2026_present
status: candidate
name: "Peter Magyar Tisza democratic restoration government (Hungary, 2026-present)"
countries: [HUN]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-05-09"
coalition: "Tisza Party two-thirds parliamentary majority"
leaders:
  - "Peter Magyar (Prime Minister, from May 2026)"
  - "Anita Orban (Deputy Prime Minister / Foreign Affairs)"
  - "Andras Karman (Finance Minister)"
doctrine: >
  Pro-European conservative-centrist restoration government after Tisza's
  April 2026 landslide ended the 16-year Orban era. The programme combines
  anti-corruption asset recovery, restoration of public-media independence,
  judicial and prosecution reforms aimed at unfreezing EU funds, EU/NATO
  alignment, and a market-friendly but socially moderate fiscal posture.
  Its two-thirds majority gives constitutional-reform capacity, making
  institutional-axis coding unusually high-leverage.
policies:
  - hu_tisza_asset_recovery_office_2026
  - hu_public_media_independence_reset_2026
  - hu_eu_funds_rule_of_law_reform_2026
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: strong, rationale: "Mandate explicitly targets reversal of Orban-era rule-of-law backsliding and recovery of frozen EU funds."}
  - {axis: institutional.judicial_independence, direction: "+", magnitude: strong, rationale: "Judicial/prosecution independence reforms are core to the EU-funds and anti-corruption agenda."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "EU/NATO recommitment and restoration of EU relations reduce political frictions with single-market partners."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "EU-funds restoration may expand investment while anti-corruption and fiscal repair restrain discretionary spending."}
  - {axis: fiscal.tax_corporate, direction: "0", magnitude: weak, rationale: "No early major corporate-tax reset observed."}
predecessor_movements:
  - hungary_orban_fourth_term_2022_present
position_alignments:
  - {position_id: institutionalism, alignment: aligned}
  - {position_id: ordoliberal, alignment: aligned}
  - {position_id: classical_liberal, alignment: partially_aligned}
  - {position_id: social_democratic, alignment: partially_aligned}
references:
  - "2026 Hungarian parliamentary election: Tisza won 141/199 seats and Orban conceded."
  - "AP, May 2026, Peter Magyar sworn in as prime minister."
  - "Guardian, 9 May 2026, Magyar inauguration and democratic-restoration programme."
  - "Le Monde, 10 May 2026, inauguration and EU-rule-of-law agenda."
notes: >
  Candidate status because institutional reforms are still being enacted.
  The election result is nonetheless a clear current-government turnover and
  must replace Orban as Hungary's active executive movement.
