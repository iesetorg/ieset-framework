# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: iraq_oil_shock_conflict_adjustment_and_reform_2014_2022
status: candidate
name: "Iraq conflict, oil shock, and fiscal/banking adjustment"
countries: [IRQ]
timeframe: {start: 2014, end: 2022}
coalition: "Successive federal governments after the 2014 ISIS offensive"
leaders: ["Haider al-Abadi", "Adel Abdul Mahdi", "Mustafa al-Kadhimi"]
doctrine: >
  The ISIS offensive, displacement, and collapse in oil prices intensified
  Iraq's dependence on oil revenues and the public sector. The government
  entered an IMF Stand-By Arrangement in 2016 that targeted fiscal balance,
  stronger public financial management, social protection, and reform of
  state-owned banks. Implementation was mixed and conflict continued to shape
  policy, so the period is coded as crisis-driven adjustment within a
  state-dominant economy.
policies: [irq_imf_standby_fiscal_adjustment_2016]
axes_summary:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "The IMF programme targeted fiscal consolidation and lower spending while prioritizing selected public services."}
  - {axis: fiscal.transfer_expansion, direction: "mixed", magnitude: weak, rationale: "Social safety-net and displacement assistance were explicitly protected amid overall spending restraint."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Restructuring of state-owned banks and enterprises was intended to reduce state dominance, with mixed implementation."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The state remained dominant, while fiscal reform and enterprise restructuring were pursued under crisis conditions."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Some reforms aimed to expand private-sector activity, but were limited by conflict and public-sector dependence."}
references:
  - "IMF, Iraq Gets $5.34 Billion Loan to Support Economic Stability, July 2016: https://www.imf.org/en/news/articles/2016/07/12/14/31/na071416-iraq-gets-imf-loan-to-support-economic-stability"
  - "World Bank, Iraq Public Expenditure Review: https://documents1.worldbank.org/curated/en/611781468253505876/pdf/899160PUB0978100Box385216B00PUBLIC0.pdf"
notes: "This period ends as the 2022 Sudani government movement begins."
