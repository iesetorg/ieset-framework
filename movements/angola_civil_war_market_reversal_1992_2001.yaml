# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: angola_civil_war_market_reversal_1992_2001
status: candidate
name: Contested elections, renewed civil war, and interrupted market transition
countries: [AGO]
timeframe: {start: 1992, end: 2001}
coalition: MPLA government and UNITA opposition during renewed conflict
leaders: [José Eduardo dos Santos, Jonas Savimbi]
doctrine: >
  The 1991 Bicesse accords introduced a ceasefire, multiparty elections, and
  military integration plans. After the September 1992 election results were
  contested, war resumed at greater intensity. The conflict and recurrent
  inflation interrupted price, exchange, and enterprise reforms and divided
  the country, leaving oil revenues as a major enclave resource.
policies: [angola_civil_war_market_reversal_1992_2001_policy]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: Renewed civil war displaced peaceful political competition and fragmented state authority.}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: moderate, rationale: War and administrative disruption weakened the implementation of market-transition reforms.}
references:
  - "UN Peacemaker, Bicesse Accords: https://peacemaker.un.org/en/node/9614"
  - "IMF, Angola staff report 1995: https://www.elibrary.imf.org/view/journals/002/1995/122/article-A001-en.xml"
notes: >
  Market reforms began before this period; this record captures their wartime
  interruption, not a claim that every reform was formally repealed.
