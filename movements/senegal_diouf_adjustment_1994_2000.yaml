# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: senegal_diouf_adjustment_1994_2000
status: candidate
name: "Diouf government and post-devaluation market reforms"
countries: [SEN]
timeframe: {start: 1994, end: 2000}
coalition: "Socialist Party government"
leaders: ["Abdou Diouf"]
doctrine: >
  After the CFA-franc zone's 1994 devaluation, the government combined fiscal
  stabilization with broad price, trade, and public-enterprise reforms intended
  to foster private investment. The adjustment programme substantially changed
  the market/state balance, while social programmes and uneven implementation
  complicate any simple characterization as wholesale withdrawal of the state.
policies: [sn_cfa_devaluation_structural_adjustment_1994]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Tariffs were simplified and most import and export licenses removed."}
  - {axis: regulatory.price_control_intensity, direction: "-", magnitude: moderate, rationale: "Price controls and direct public-enterprise roles were reduced across multiple sectors."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Price controls and direct public-enterprise roles were reduced across multiple sectors."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "The programme liberalized markets and reduced direct state participation, while retaining public policy and social objectives."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The state continued to guide reforms and provide public services even as commercial roles were reduced."}
references:
  - "IMF, Senegal Policy Framework Paper 1998-2000: https://www.imf.org/external/np/pfp/senegal/seng-01.htm"
notes: "Abdou Diouf lost the 2000 presidential election; the succeeding Wade period is recorded separately."
