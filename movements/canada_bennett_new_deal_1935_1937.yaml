movement_id: canada_bennett_new_deal_1935_1937
status: candidate
name: Bennett New Deal — Depression-era federal reform attempt
countries: [CAN]
timeframe: {start: 1935, end: 1937}
coalition: Conservative government under R. B. Bennett
leaders: ["R. B. Bennett"]
doctrine: >
  Facing mass unemployment and economic distress, Bennett's government proposed
  federal relief, labour, and social-insurance measures in a 1935 New Deal.
  The Employment and Social Insurance Act was invalidated because compulsory
  contributions intruded on provincial jurisdiction. This entry distinguishes
  an important political reform attempt from policies that became an enduring
  national program; it carries no scored country-level axis shift.
policies: [ca_bennett_new_deal_1935]
references:
  - "Government of Canada, Federal-provincial agreements and the 1941 Unemployment Insurance Program: https://www.canada.ca/en/intergovernmental-affairs/services/federation/unemployment-insurance-program.html"
  - "Department of Justice Canada, British North America Act, 1940: https://justice.canada.ca/eng/rp-pr/csj-sjc/constitution/lawreg-loireg/p1t181.html"
notes: "Context event only for drift: the failed insurance law is not coded as implemented federal coverage or spending."
