# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: morocco_mohammed_vi_opening_2000_2010
status: candidate
name: Mohammed VI-era trade opening and sectoral modernisation
countries: [MAR]
timeframe: {start: 2000, end: 2010}
coalition: Moroccan monarchy and successive governments
leaders: [Mohammed VI, Abderrahmane Youssoufi, Driss Jettou, Abbas El Fassi]
doctrine: >
  During the 2000s Morocco pursued trade agreements, privatisation, financial
  sector and labour reforms, and large public infrastructure investment. These
  policies attracted foreign investment and expanded export-oriented links,
  while public enterprises retained a significant economic role and the
  monarchy remained the central political authority.
policies: [morocco_mohammed_vi_opening_2000_2010_policy]
axes_summary:
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, rationale: Trade agreements and reduced import protection deepened external economic integration.}
  - {axis: regulatory.product_market_competition, direction: +, magnitude: weak, rationale: Privatisation and competition reforms broadened private-sector participation while large state enterprises remained.}
  - {axis: fiscal.spending_level, direction: +, magnitude: weak, rationale: Public investment in transport and infrastructure supported sectoral strategies and private investment.}
references:
  - "IMF, Morocco 2005 Article IV consultation: https://www.imf.org/en/news/articles/2015/09/28/04/53/pn05125"
  - "IMF, Morocco 2004 Article IV report: https://www.elibrary.imf.org/view/journals/002/2004/162/article-A001-en.xml"
  - "IMF, Morocco 20 Years of Reforms: https://www.elibrary.imf.org/display/book/9798400225406/CH001.xml"
notes: "Market-opening reforms coexisted with extensive public enterprise and state investment."
