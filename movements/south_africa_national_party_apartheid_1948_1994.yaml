movement_id: south_africa_national_party_apartheid_1948_1994
status: candidate
name: National Party apartheid government
countries: [ZAF]
timeframe: {start: 1948, end: 1994}
coalition: National Party government
leaders: ["D. F. Malan (Prime Minister, 1948-1954)", "Hendrik Verwoerd (Prime Minister, 1958-1966)", "P. W. Botha (Prime Minister/State President, 1978-1989)", "F. W. de Klerk (State President, 1989-1994)"]
doctrine: >
  The National Party came to power in 1948 and made apartheid the governing
  system, extending earlier segregation through state-enforced racial
  classification, political exclusion, residential separation, and controls
  over movement and work. The regime maintained a largely private capitalist
  economy while using extensive state law, administration, and coercion to
  structure access to land, labour, and political rights. The first democratic
  election in 1994 ended this governing period.
