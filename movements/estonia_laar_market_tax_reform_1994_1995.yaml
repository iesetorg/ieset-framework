# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: estonia_laar_market_tax_reform_1994_1995
status: candidate
name: Laar government flat-tax reform
countries: [EST]
timeframe: {start: 1994, end: 1995}
coalition: Pro Patria-led coalition government
leaders:
  - Mart Laar (Prime Minister)
doctrine: >
  The Laar government replaced the prior progressive personal-income-tax
  schedule with a single-rate system in 1994 as part of Estonia's early
  post-Soviet market transition. This record codes the tax-schedule change
  only; it does not assign the government's wider currency, privatisation,
  trade, or growth outcomes to that one reform.
policies:
  - estonia_flat_tax_1994
axes_summary:
  - axis: fiscal.tax_progressivity
    direction: "-"
    magnitude: strong
    rationale: The 1994 single-rate personal income tax replaced the progressive rate schedule.
    drift_attribution_year: 1994
    drift_attribution_basis: The tax system took effect in 1994; the existing policy record dates enactment to 1994-01-01.
references:
  - "Estonia flat-tax policy record and linked source notes: policies/estonia_flat_tax_1994.yaml"
  - "Eesti Pank, Annual Report 1994, Estonia's economic environment and tax reform: https://www.eestipank.ee/en/annual-report-1994-estonian-economy-1994"
  - "Riigi Teataja, Income Tax Act (historical legal text and amendments): https://www.riigiteataja.ee/en/akt/530012014003"
notes: >
  Candidate backfill from an existing dated policy lead. This movement starts
  the Estonian plotted line in 1994; earlier transition politics and monetary
  reform are not included in this single-policy movement.
