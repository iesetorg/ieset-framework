# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: cambodia_cpp_state_led_market_integration_1993_2023
status: candidate
name: "CPP-led state-guided market integration"
countries: [KHM]
timeframe: {start: 1993, end: 2023}
coalition: "Cambodian People's Party-led governments"
leaders: ["Norodom Ranariddh", "Hun Sen"]
doctrine: >
  After the 1993 constitutional settlement and coalition period, Hun Sen and
  the Cambodian People's Party consolidated governing power while pursuing
  investment-led growth, export manufacturing, and integration into regional
  and global markets. WTO accession formalized extensive trade and regulatory
  commitments, but market integration coexisted with state-directed
  development, politically connected capital, and weak enforcement. The
  episode therefore describes a hybrid state-guided market order rather than
  a liberal-democratic transition.
policies: [khm_wto_accession_and_trade_integration_1994]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "WTO accession and regional integration commitments progressively formalized open trade rules."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Market entry and investment commitments expanded alongside state direction and uneven enforcement."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Formal transparency and WTO rule commitments advanced, but this does not claim effective or even enforcement."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Growth strategy relied on government-coordinated investment, export promotion, and infrastructure."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "External market commitments coexisted with concentrated political power and state-guided allocation."}
references:
  - "WTO, Cambodia accession commitments: https://www.wto.org/english/thewto_e/acc_e/factsheet_cambodge_e.htm"
  - "WTO, Cambodia membership timeline: https://www.wto.org/english/thewto_e/acc_e/a1_cambodge_e.htm"
  - "World Bank, Cambodia private property and reform history: https://documents1.worldbank.org/curated/en/120711468017956356/pdf/multi0page.pdf"
notes: "The movement spans the 1993 constitutional transition through the end of Hun Sen's premiership in 2023; Hun Manet's succeeding government and programme are mapped separately."
