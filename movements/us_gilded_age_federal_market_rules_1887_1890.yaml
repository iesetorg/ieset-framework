# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_gilded_age_federal_market_rules_1887_1890
status: candidate
name: US late Gilded Age federal market-rule reforms
countries: [USA]
timeframe: {start: 1887, end: 1890}
coalition: Bipartisan congressional reform majorities across the Cleveland and Harrison administrations
doctrine: >
  Federal lawmakers sought common national rules for interstate commerce while
  retaining private ownership of railroads and other businesses. The 1887
  Interstate Commerce Act addressed discriminatory railroad rates through a new
  federal commission, and the 1890 Sherman Act prohibited restraints of trade
  and monopolization. The stated aim was to make private markets fairer and more
  competitive through enforceable public rules. This was a cross-administration
  legislative reform current, not a single-party governing program; early
  commission and antitrust enforcement were limited.
policies:
  - us_interstate_commerce_act_1887
  - us_sherman_antitrust_act_1890
axes_summary:
  - axis: regulatory.product_market_competition
    direction: mixed
    magnitude: weak
    rationale: The act barred discriminatory interstate railroad rates and rebates, but it also added federal rate oversight; the enactment alone does not establish a net increase in competitive entry or price rivalry.
    drift_attribution_year: 1887
    drift_attribution_basis: The Interstate Commerce Act became law on 1887-02-04 and created the Interstate Commerce Commission.
  - axis: regulatory.product_market_competition
    direction: "+"
    magnitude: weak
    rationale: The Sherman Act prohibited interstate restraints of trade and monopolization, but vague statutory terms and limited early enforcement warrant only a weak enactment-era step.
    drift_attribution_year: 1890
    drift_attribution_basis: The Sherman Anti-Trust Act was approved on 1890-07-02; this codes its enactment, not later trust-busting effectiveness.
references:
  - "Interstate Commerce Act, 24 Stat. 379 (1887): https://www.archives.gov/milestone-documents/interstate-commerce-act"
  - "Sherman Anti-Trust Act, 26 Stat. 209 (1890): https://www.archives.gov/milestone-documents/sherman-anti-trust-act"
notes: >
  Candidate coding represents a national legislative reform pattern spanning
  two administrations. The two acts moved different axes and do not justify a
  single large pro-state or pro-market label.
