  - {axis: regulatory.environmental_stringency, direction: "+", magnitude: strong, rationale: "IRA climate provisions and emissions-enforcement funding shifted the environmental policy mix."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "CHIPS provided direct semiconductor-manufacturing grants; 2021 infrastructure spending is attributed to the broad movement."}
