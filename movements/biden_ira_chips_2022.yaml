notes: "D.3.1 content-over-coalition: the IRA/CHIPS steps begin in 2022. The 2021 infrastructure law and ARP are carried by us_biden_administration_broad_2021_2025, avoiding a second 2021 spending step for the same legislation. The duplicate us_ira_2022 policy record still has a 2021 start date and needs a separate policy-database reconciliation."
