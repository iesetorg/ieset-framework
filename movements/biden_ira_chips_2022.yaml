movement_id: biden_ira_chips_2022
status: candidate
name: "Biden IRA + CHIPS Act industrial policy"
countries: [USA]
timeframe: {start: 2022, end: 2024}
coalition: "Democratic (Biden + narrow Senate majority)"
leaders: ["Joe Biden", "Chuck Schumer", "Gina Raimondo (Commerce)", "Brian Deese (NEC)"]
doctrine: >
  Inflation Reduction Act 2022 (climate/energy tax credits and Rx drug pricing)
  and CHIPS & Science Act 2022 (direct semiconductor support and authorised
  science R&D). Stated case: industrial policy to reshore manufacturing,
  secure supply chains, climate transition. Framework codes as mixed: tax
  credits (market-mechanism) + mandates + explicit protectionism.
policies: [us_ira_2022, us_chips_act_2022]
