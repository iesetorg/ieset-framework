name: Norway’s Bratteli government and moderate-pace petroleum doctrine, 1973–1975
countries:
- NOR
timeframe:
  start: 1973
  end: 1975
coalition: Trygve Bratteli Labour government
leaders:
- Trygve Bratteli
doctrine: The Bratteli government established an explicit petroleum framework before major oil revenues arrived.
  Its 1974 report called for a moderate pace of extraction, public oversight, regional development, and domestic
  industrial capacity rather than letting short-term private returns determine the entire production path.
