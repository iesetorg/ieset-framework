  - "Ministry of Finance Japan, Overview of the Supplementary Budget for FY2026, 3 June 2026: https://www.mof.go.jp/english/policy/budget/budget/fy2026/03.pdf"
  - "House of Councillors, FY2026 initial budget passed 7 April 2026: https://www.sangiin.go.jp/eng/featurednews/2026/260407en.htm"
  - "House of Councillors, FY2026 supplementary budget passed 5 June 2026: https://www.sangiin.go.jp/eng/featurednews/2026/260605en.htm"
  - "Ministry of Finance, JFIC launched 29 June 2026: https://www.mof.go.jp/policy/international_policy/gaitame_kawase/fdi/20260618215004.html"
  - "Ministry of Finance, screening reform effective-date split: https://www.mof.go.jp/policy/international_policy/gaitame_kawase/fdi/260916_koukaiyou_gaiyou_eigo.pdf"
notes: >
  Created in the second-tranche Asia pass because the first Lane B pass
  found that official Kantei pages no longer showed Ishiba as current.
  Start year is 2025 because the Takaichi administration began then. Fiscal
  axes are dated to the 2026 Diet approvals. The February 2026 screening
  proposal was followed by the JFIC launch on 29 June, which supports only a
  weak 2026 interagency-review step. Broader statutory screening changes are
  scheduled for January 2027; no trade-openness step is inferred.
  Energy-price aid is fiscal support, not a demonstrated
  supply-security change. Exact first-cabinet date should be refined if a
  stable Kantei archive page is added later. The 2026-10-09 atlas review also
  records the February election and September cabinet reshuffle as political
  continuity, without treating either as a new policy movement.
