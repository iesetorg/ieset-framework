name: Qaddafi-era Jamahiriya and state-directed economy
countries:
- LBY
timeframe:
  start: 1969
  end: 2002
coalition: Revolutionary Command Council and Jamahiriya political system
leaders:
- Muammar al-Qaddafi
doctrine: The 1969 revolution established a new republic and later the Jamahiriya political system. Oil
  revenues financed a highly state-directed economy, with public ownership and central planning dominant
  in important sectors. Private activity was heavily constrained, but the economy was not uniformly state-owned;
  hydrocarbon production and informal private activity require distinct treatment.
