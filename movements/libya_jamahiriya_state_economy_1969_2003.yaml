axes_summary:
- axis: fiscal.spending_level
  direction: +
  magnitude: strong
  rationale: Oil-financed public investment and services made the state the dominant allocator.
- axis: regulatory.product_market_competition
  direction: '-'
  magnitude: strong
  rationale: Private enterprise was restricted and market allocation was displaced in many sectors.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: strong
  rationale: Political institutions concentrated authority outside competitive constitutional government.
