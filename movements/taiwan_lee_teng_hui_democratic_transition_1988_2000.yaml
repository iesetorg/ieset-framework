# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: taiwan_lee_teng_hui_democratic_transition_1988_2000
status: candidate
name: "Taiwan Lee Teng-hui era: democratic transition and economic upgrading"
countries: [TWN]
timeframe: {start: 1988, end: 2000}
coalition: "Kuomintang government under Lee Teng-hui"
leaders: ["Lee Teng-hui (President, 1988–2000)"]
doctrine: >
  Lee's presidency dismantled the emergency-era political order, ended martial law's
  successor restrictions, expanded direct electoral competition, and culminated in
  Taiwan's first direct presidential election in 1996 and the 2000 transfer of power.
  The export-oriented, private-enterprise economy continued alongside public support
  for strategic technology industries. This phase marks political liberalisation and
  continuity in a mixed developmental market economy, not a wholesale economic pivot.
policies: [tw_end_emergency_rule_and_direct_election_1991_1996]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: strong, rationale: "Emergency political provisions ended and competitive direct presidential elections were established."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "Export-oriented private production continued; this is continuity rather than a new liberalisation shock."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "The state continued targeted support for strategic technology capability."}
predecessor_movements: [taiwan_kmt_developmentalism_1961_2000]
position_alignments:
  - {position_id: institutionalism, alignment: aligned, notes: "The central change was the replacement of emergency-era rule with competitive constitutional elections."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Strategic technology support continued within an export-oriented market economy."}
references:
  - "Office of the President, ROC (Taiwan), Political History: https://www.president.gov.tw/qrcode/19e"
  - "Office of the President, ROC (Taiwan), Lee Teng-hui: https://english.president.gov.tw/Page/86"
notes: "Movement is dated from Lee's succession in 1988 through the first peaceful electoral transfer in 2000."
