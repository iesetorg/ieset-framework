doctrine: After declaring independence in 1991, Croatia faced war, state formation, reconstruction, and rapid ownership
  transformation. The government’s stabilisation programme halted hyperinflation in 1993; privatization proceeded
  through insider and employee buyouts while reconstruction and public-sector rebuilding expanded state responsibilities.
