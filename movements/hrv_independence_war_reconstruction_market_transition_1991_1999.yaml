  rationale: War-related spending, reconstruction, and state formation expanded public responsibilities.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  rationale: The 1991 ownership-transformation law began conversion of socially-owned enterprises into private ownership.
- axis: institutional.rule_of_law
  direction: '-'
  magnitude: moderate
  rationale: Wartime emergency governance and executive centralisation constrained ordinary democratic institutions.
