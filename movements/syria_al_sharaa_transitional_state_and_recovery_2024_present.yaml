# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: syria_al_sharaa_transitional_state_and_recovery_2024_present
status: candidate
name: Syrian transitional authorities and recovery-oriented economic opening
countries: [SYR]
timeframe: {start: 2024, end: ongoing, enacted_date: "2024-12-08"}
coalition: Syrian transitional government led by Ahmed al-Sharaa
leaders: [Ahmed al-Sharaa]
policies: [syr_transitional_recovery_and_economic_liberalisation_2025]
doctrine: >
  Following the fall of the Assad government, transitional authorities have
  pursued institutional transition, international reintegration, economic
  liberalisation, and recovery and reconstruction. The transition is taking
  place amid persistent security, inclusion, rule-of-law, and territorial
  challenges; the record does not treat announced priorities as completed
  reforms.
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "The United Nations reports economy-opening measures and renewed international reintegration and trade engagement during the transition."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "Institutional transition and international engagement coexist with concerns about appointments, inclusion, legal safeguards, and transparency."}
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "The transition seeks to rebuild state institutions, but the legal framework and inclusiveness remain contested and incomplete."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "The reported economic liberalisation is an announced direction within a transitional state-building programme."}
references:
  - "United Nations in Syria, Common Country Analysis, 31 March 2026: https://syria.un.org/en/312773-common-country-analysis-syria"
  - "UN Security Council, briefing on Syria's political transition, 12 February 2025: https://press.un.org/en/2025/sc15991.doc.htm"
notes: "The national transition remains uneven; the axis coding reflects reported direction, not a claim of settled control or completed liberalisation."
