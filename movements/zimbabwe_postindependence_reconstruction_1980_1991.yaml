doctrine: After independence in 1980, the government pursued redistribution in education and health and
  retained extensive price, exchange, and administrative controls inherited from the pre-independence
  period. Private production and markets continued to operate. The period is therefore coded as a mixed
  economy with a stronger social and administrative state, not as complete nationalisation.
