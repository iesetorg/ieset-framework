# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: angola_postwar_oil_reconstruction_2002_2016
status: candidate
name: Postwar MPLA reconstruction and oil-financed state expansion
countries: [AGO]
timeframe: {start: 2002, end: 2016}
coalition: MPLA government
leaders: [José Eduardo dos Santos]
doctrine: >
  The 2002 Luena agreement ended the civil war and enabled national
  reconstruction under continuous MPLA rule. An oil boom financed infrastructure
  and rapid public spending, while the state remained influential across major
  sectors and market institutions developed unevenly. The fall in oil prices
  after 2014 exposed fiscal and foreign-exchange vulnerabilities before the
  leadership change in 2017.
policies: [angola_postwar_oil_reconstruction_2002_2016_policy]
axes_summary:
  - {axis: fiscal.spending_level, direction: +, magnitude: strong, rationale: Oil revenues financed major reconstruction and public investment after the peace agreement.}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: weak, rationale: Political competition and accountability remained constrained under prolonged one-party dominance.}
references:
  - "IMF, Angola 2003 Article IV consultation: https://www.imf.org/en/news/articles/2015/09/28/04/53/pn03115"
  - "World Bank, Angola Country Economic Memorandum: https://www.worldbank.org/en/country/angola/publication/angola-country-economic-memorandum-moving-beyond-oil"
notes: "This separates post-conflict reconstruction from the preceding war and the 2017 reform programme."
