movement_id: mali_pluralist_democracy_market_reform_1991_2012
status: candidate
name: Third Republic, pluralist democracy, and market reform
countries:
- MLI
timeframe:
  start: 1991
  end: 2011
coalition: Transition government and successive elected governments
leaders:
- Amadou Toumani Toure
- Alpha Oumar Konare
doctrine: The 1991 transition led to the 1992 constitution and a pluralist multiparty republic. The government
  continued a decade of reforms that shifted parts of the economy from state control toward market mechanisms,
  including public-enterprise restructuring and privatisation. Political transition, social tensions,
  and uneven state capacity shaped implementation.
policies:
- mali_pluralist_democracy_market_reform_1991_2012_policy
axes_summary:
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  rationale: The 1992 constitution established multiparty democratic institutions.
- axis: regulatory.product_market_competition
  direction: +
  magnitude: moderate
  rationale: Privatisation and public-enterprise reform sought to increase private-sector activity.
- axis: fiscal.spending_level
  direction: '-'
  magnitude: weak
  rationale: Civil-service and enterprise reforms aimed to reduce fiscal burdens, while social-service
    spending continued.
