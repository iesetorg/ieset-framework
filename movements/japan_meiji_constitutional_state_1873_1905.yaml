# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: japan_meiji_constitutional_state_1873_1905
status: candidate
name: Meiji Japan — central state and constitutional legislature
countries: [JPN]
timeframe: {start: 1873, end: 1905}
coalition: Meiji oligarchic governments and the imperial court
leaders: ["Emperor Meiji", "Itō Hirobumi", "Kuroda Kiyotaka"]
doctrine: >
  Following the initial Meiji state-formation phase, the government continued
  building national institutions and promulgated a constitution in 1889. The
  Imperial Diet first convened in 1890, creating a formal national legislature
  under a sovereign Emperor and restricted franchise. This was constitutional
  state-building, not full parliamentary government or a modern democratic
  settlement.
policies: [jp_meiji_constitution_and_diet_1889_1890]
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The written constitution and Imperial Diet formalized national institutions while preserving imperial executive authority.
    drift_attribution_year: 1890
    drift_attribution_basis: The Constitution took effect and the first Imperial Diet convened in 1890.
references:
  - "National Archives of Japan, Promulgation of the Constitution of the Empire of Japan: https://www.archives.go.jp/hub/meiji/meiji02.html"
  - "National Archives of Japan, Constitution of Japan and the Imperial Diet: https://www.digital.archives.go.jp/pickup-en"
notes: "The period is a political-formation interval; the scored constitutional step is attributed to 1890 rather than to the entire 1873–1905 span."
