# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: drc_kabila_war_state_1997_2000
status: candidate
name: Laurent-Désiré Kabila government and Congo wars
countries: [COD]
timeframe: {start: 1997, end: 2000}
coalition: Alliance of Democratic Forces for the Liberation of Congo
leaders: [Laurent-Désiré Kabila]
doctrine: >
  Laurent-Désiré Kabila's forces took Kinshasa in 1997 and renamed Zaire the
  Democratic Republic of the Congo. A new rebellion against his government
  began in 1998 and grew into an internationalised war involving multiple
  neighbouring states. The period saw further centralised rule, contested
  control of mineral-rich territory, and severe disruption of public authority.
policies: [drc_kabila_war_state_1997_2000_policy]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: Regime change by armed rebellion was followed by renewed war and divided territorial authority.}
  - {axis: regulatory.sectoral_licensing, direction: +, magnitude: moderate, rationale: Control over mineral access and revenues became more centralised and contested during wartime.}
references:
  - "UN MONUC, mission background: https://peacekeeping.un.org/sites/default/files/past/monuc/background.shtml"
notes: "Conflict actors controlled different areas; this national series entry does not imply uniform territorial authority."
