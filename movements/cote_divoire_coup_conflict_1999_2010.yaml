# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: cote_divoire_coup_conflict_1999_2010
status: candidate
name: Coup, partition, and election crisis
countries: [CIV]
timeframe: {start: 1999, end: 2010}
coalition: Military authorities, Gbagbo government, and armed opposition during successive crises
leaders: [Robert Guéï, Laurent Gbagbo, Guillaume Soro]
doctrine: >
  The December 1999 coup ended the Bédié government. A 2002 rebellion split
  the country, and peace agreements produced a fragile national-reconciliation
  government while state authority and economic activity remained divided.
  The disputed 2010 presidential election led to renewed armed conflict and a
  short war before the 2011 transfer of power and recovery programme.
policies: [cote_divoire_coup_conflict_1999_2010_policy]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "The coup, territorial partition, armed conflict, and disputed 2010 election disrupted constitutional authority."}
  - {axis: institutional.property_rights, direction: "-", magnitude: moderate, rationale: Conflict and divided territorial control impaired security and enforcement of property rights.}
references:
  - "UN MINUCI background: https://peacekeeping.un.org/sites/default/files/past/minuci/background.html"
  - "UN, 2003 General Assembly statement by Côte d'Ivoire: https://www.un.org/webcast/ga/58/statements/cotefre031002.htm"
  - "World Bank, Côte d'Ivoire 2021–2030 Country Economic Memorandum: https://documents1.worldbank.org/curated/en/232621635224063141/pdf/P172646-8cc6a128-c95f-45cb-b9f3-06ce211eff15.pdf"
notes: "The map's national movement line compresses years of divided control and local conflict into a single period proxy."
