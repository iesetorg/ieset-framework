# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_weimar_republic_and_economic_crises_1918_1932
status: candidate
name: Germany Weimar Republic, social market framework, and successive crises
countries: [DEU]
timeframe: {start: 1918, end: 1932}
coalition: "Weimar coalition and successive parliamentary and presidential governments"
leaders: ["Friedrich Ebert (President, 1919–1925)", "Paul von Hindenburg (President, 1925–1934)"]
doctrine: >
  The revolution of 1918–1919 established a parliamentary republic and constitutionally
  recognised social and economic rights while preserving a mixed private economy.
  Severe inflation and political instability gave way to currency stabilisation and
  recovery in 1924–1929. The Great Depression then drove mass unemployment, emergency
  decrees, and parliamentary breakdown. State intervention and market institutions
  varied sharply across the period; the republic was not a stable single-model economic
  regime.
policies: [deu_weimar_social_economic_order_1919]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: strong, rationale: "Democratic constitutional government was created but collapsed under the crisis of 1930–1933."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: strong, rationale: "Post-war commitments and stabilisation alternated with severe deflationary adjustment and emergency rule."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, rationale: "Private production continued alongside labour protections, social policy, and crisis controls."}
  - {axis: monetary.central_bank_independence, direction: "mixed", magnitude: moderate, rationale: "Hyperinflation, currency stabilisation, reparations constraints, and Depression-era policy sharply shifted monetary institutions."}
predecessor_movements: [germany_imperial_tariff_social_insurance_state_1902_1914]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "The period began with a democratic constitution and rights framework, which failed to withstand the Depression-era political breakdown."}
  - {position_id: social_democratic, alignment: partially_aligned, notes: "Social insurance and labour protections grew, though successive coalition changes and crises produced conflicting economic policy."}
references:
  - "German Federal Agency for Civic Education, Weimar Republic crisis conditions: https://www.bpb.de/themen/erster-weltkrieg-weimar/weimarer-republik/276646/krisenbedingungen-der-weimarer-republik/"
  - "German Federal Archives, Weimar cabinet records on fiscal, social and economic policy: https://www.bundesarchiv.de/aktenreichskanzlei/1919-1933/01r/mu1/mu11p/kap1_1/para2_7.html"
notes: "Covers the Weimar period through the collapse of parliamentary government; the Nazi dictatorship and Allied occupation are coded separately."
