# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: sweden_sap_saltsjobaden_and_postwar_welfare_1936_1975
status: candidate
name: "Social Democratic labour accord and postwar welfare-state expansion"
countries: [SWE]
timeframe: {start: 1936, end: 1975}
coalition: "Social Democratic governments, with coalition and parliamentary support from agrarian parties"
leaders: ["Per Albin Hansson", "Tage Erlander", "Olof Palme"]
doctrine: >
  Sweden's Social Democratic governments developed the Folkhem welfare
  settlement alongside a market economy and powerful organized labour and
  employers. The 1938 Saltsjöbaden Agreement established negotiated labour
  relations, while postwar growth supported the expansion of social insurance,
  public services, and full-employment policy. State intervention and welfare
  provision increased without abolishing private ownership or centralized
  wage bargaining. The movement ends before the non-Social-Democratic coalition
  formed in 1976.
policies: [se_saltsjobaden_welfare_settlement_1938]
axes_summary:
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: strong, rationale: "Social insurance and welfare provision expanded over the postwar decades."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "The state assumed a larger role in social services and income security while retaining a market economy."}
  - {axis: regulatory.labour_market_flexibility, direction: mixed, magnitude: moderate, rationale: "Labour outcomes were shaped by centralized bargaining and negotiated self-regulation, not simply by statutory rigidity."}
  - {axis: regulatory.product_market_competition, direction: mixed, magnitude: weak, rationale: "Private firms and export markets remained central even as the state expanded welfare and public services."}
position_alignments:
  - {position_id: social_democratic, alignment: aligned, notes: "The movement combines strong social insurance, organized labour, and elected Social Democratic government."}
  - {position_id: market_socialist, alignment: partially_aligned, notes: "The welfare settlement expanded public responsibility while preserving private ownership and market coordination."}
references:
  - "International Review of Social History, Sweden in the European context: https://www.cambridge.org/core/journals/international-review-of-social-history/article/role-of-the-state-in-employment-and-welfare-regulation-sweden-in-the-european-context/603CADF0531B398A19EAFFD8FB6A13BB"
  - "IMF Staff Papers, Sweden's incomes and labour-market policies 1945-70: https://www.elibrary.imf.org/view/journals/024/1974/001/article-A005-en.xml"
  - "Swedish Government Official Report SOU 2008:54: https://www.regeringen.se/contentassets/c8ac7b3b1e5e47f693658714cd354db7/obligatorisk-arbetsloshetsforsakring-sou-200854/"
notes: "A broad governing era is used to bridge the deliberate 1933-35 crisis-policy entry and the 1976 centre-right government; within-period policy change remains substantial."
