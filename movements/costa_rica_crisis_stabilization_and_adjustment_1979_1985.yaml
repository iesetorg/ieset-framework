# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: costa_rica_crisis_stabilization_and_adjustment_1979_1985
status: candidate
name: "Debt crisis, democratic stabilization, and first structural adjustment"
countries: [CRI]
timeframe: {start: 1979, end: 1985}
coalition: "National Liberation Party government under Luis Alberto Monge"
leaders: ["Rodrigo Carazo Odio", "Luis Alberto Monge Álvarez"]
doctrine: >
  Costa Rica entered a severe debt and macroeconomic crisis in 1980-82 after
  years of borrowing and adverse external shocks. The elected Monge government
  restored relations with creditors, adopted an IMF-supported stabilization
  programme, and began structural adjustment with World Bank and other
  assistance. Early measures restrained public-sector costs and encouraged
  exports while the country retained its civilian democratic and social-policy
  institutions.
policies: [cr_stabilization_and_structural_adjustment_1982]
axes_summary:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "Fiscal stabilization targeted the deficit and public-sector wage bill after the debt crisis."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "The reform programme began redirecting incentives toward export growth."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, rationale: "State-enterprise losses were reduced while universal social institutions were preserved."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "The adjustment programme reduced state-enterprise burdens and encouraged exports but remained negotiated within a democratic mixed economy."}
  - {position_id: social_democratic, alignment: partially_aligned, notes: "The government pursued stabilization without abandoning Costa Rica's social institutions and civilian democratic settlement."}
references:
  - "IMF, Costa Rica recent economic developments: https://www.elibrary.imf.org/view/journals/002/1998/045/article-A002-en.xml"
  - "World Bank, Costa Rica economic adjustment review: https://documents1.worldbank.org/curated/en/772441468028450912/pdf/multi0page.pdf"
notes: "The movement ends with the first adjustment programme; the longer export-oriented reform phase is coded separately."
