# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: iraq_post_baath_reconstruction_and_market_transition_2003_2014
status: candidate
name: "Post-Ba'ath reconstruction and partial market transition"
countries: [IRQ]
timeframe: {start: 2003, end: 2014}
coalition: "Transitional authorities and post-2005 Iraqi governments"
leaders: ["Paul Bremer (CPA Administrator, 2003-2004)", "Iraqi transitional and elected governments"]
doctrine: >
  Post-invasion authorities sought to reconstruct institutions, reconnect Iraq
  to international commerce, and establish modern banking, currency, and
  investment rules. Oil remained the dominant source of public revenue and the
  state remained the main service provider, while insecurity and political
  fragmentation limited implementation. The episode records formal market
  opening within a state-dependent reconstruction model.
policies: [irq_post_2003_reconstruction_market_rules]
axes_summary:
  - {axis: monetary.central_bank_independence, direction: "+", magnitude: strong, rationale: "The 2004 law granted central-bank independence and restricted direct credit to government."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Trade and foreign-investment rules were opened and new trade-finance institutions established."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Commercial banking and investment legislation expanded formal entry, without removing state dependence."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Reconstruction and service provision expanded the government's spending role, financed primarily by oil revenues."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "State-led reconstruction and oil-financed public services were central to the governing model."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Formal trade, banking, and investment rules moved toward markets while the state remained dominant in financing and delivery."}
references:
  - "IMF, Iraq Letter of Intent and MEFP, September 2004: https://www.imf.org/External/NP/LOI/2004/irq/01/"
  - "World Bank, Iraq Public Expenditure Review: https://documents1.worldbank.org/curated/en/611781468253505876/pdf/899160PUB0978100Box385216B00PUBLIC0.pdf"
notes: "The post-2003 legal transition is not treated as proof of a functioning or fully implemented market economy."
