# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: bulgaria_currency_board_eu_accession_reforms_1997_2007
status: candidate
name: Bulgaria currency-board stabilisation and EU accession reforms
countries: [BGR]
timeframe: {start: 1997, end: 2007}
coalition: "Reform governments led by the Union of Democratic Forces and subsequent coalitions"
leaders: ["Ivan Kostov (Prime Minister, 1997–2001)", "Simeon Saxe-Coburg-Gotha (Prime Minister, 2001–2005)", "Sergei Stanishev (Prime Minister, 2005–2009)"]
doctrine: >
  After the 1996–1997 crisis, a currency board anchored monetary stability and a broad
  structural reform programme accelerated privatisation, liquidation of unviable firms,
  price liberalisation, and EU-aligned institutional change. EU accession negotiations
  opened in 1999 and membership followed in 2007. Macroeconomic stabilisation and
  integration proceeded alongside social adjustment costs and persistent governance
  challenges.
policies: [bg_currency_board_and_eu_transition_1997]
axes_summary:
  - {axis: monetary.central_bank_independence, direction: "+", magnitude: moderate, rationale: "The currency board constrained monetary discretion and restored nominal stability."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "EU accession and market reforms deepened integration with European markets."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, rationale: "Privatisation and liquidation reduced the role of state-owned commercial enterprises."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "EU accession required formal legal and institutional alignment, though implementation remained uneven."}
predecessor_movements: [bulgaria_postcommunist_transition_1990_1997]
position_alignments:
  - {position_id: classical_liberal, alignment: aligned, notes: "Currency discipline, privatisation, and market integration were central elements."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "EU conditionality strengthened formal rules while governance outcomes remained mixed."}
references:
  - "World Bank, Bulgaria transition and 1996–1997 crisis: https://documents1.worldbank.org/curated/en/984761468769131587/pdf/multi0page.pdf"
  - "World Bank, Bulgaria stabilization and EU accession structural reforms: https://documents1.worldbank.org/curated/en/253381468015849237/pdf/342330BG.pdf"
notes: "Ends with Bulgaria's EU accession in 2007; a subsequent EU-era movement covers later years."
