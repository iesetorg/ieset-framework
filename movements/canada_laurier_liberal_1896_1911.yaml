# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: canada_laurier_liberal_1896_1911
status: candidate
name: Laurier Liberal government — British preference within a protected market
countries: [CAN]
timeframe: {start: 1896, end: 1911, enacted_date: "1897-04-23"}
coalition: Liberal Party of Canada under Wilfrid Laurier
leaders: ["Wilfrid Laurier", "William S. Fielding"]
doctrine: >
  Laurier's Liberal government retained a customs-tariff framework while
  introducing preferential rates for British goods in 1897. The measure
  redirected some trade toward Britain without removing protection for
  Canadian producers or establishing general free trade. Its economic coding
  is therefore mixed on trade openness rather than a blanket market opening.
policies: [ca_british_preferential_tariff_1897]
axes_summary:
  - axis: regulatory.trade_openness
    direction: mixed
    magnitude: weak
    rationale: The preferential tariff lowered barriers for some British imports while retaining protection and discrimination by country of origin.
    drift_attribution_year: 1897
    drift_attribution_basis: The preferential tariff was adopted by the Laurier government in 1897.
references:
  - "House of Commons of Canada, Budget speech, 14 March 1901: https://lop.parl.ca/staticfiles/ParlInfo/Documents/Budgets/En/1901-03-14.pdf"
  - "House of Commons of Canada, Budget speech, 29 November 1906: https://lop.parl.ca/staticfiles/ParlInfo/Documents/Budgets/En/1906-11-29.pdf"
notes: "The trade step is retained as mixed; the composite statistic should not treat preferential access as full liberalization."
