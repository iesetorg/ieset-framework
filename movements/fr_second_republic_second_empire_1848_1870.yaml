# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_second_republic_second_empire_1848_1870
status: candidate
name: Second Republic and Second Empire
countries: [FRA]
timeframe: {start: 1848, end: 1870}
coalition: Second Republic followed by Louis-Napoleon Bonaparte's Second Empire
leaders:
  - Louis-Eugène Cavaignac
  - Louis-Napoleon Bonaparte (Napoleon III)
doctrine: >
  The Second Republic introduced direct universal male suffrage in 1848.
  Louis-Napoleon's 1851 coup dissolved the Assembly and the Second Empire
  concentrated executive power, before gradual liberalization in the 1860s.
  The record captures these opposing constitutional turns and does not treat
  electoral participation alone as proof of democratic accountability.
policies:
  - fr_universal_male_suffrage_1848
  - fr_second_empire_constitution_1852
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The 1848 Constitution established universal male suffrage and a directly elected legislature, while excluding women and colonial populations from equal political rights.
    drift_attribution_year: 1848
    drift_attribution_basis: The provisional government decree of 5 March 1848 established universal male suffrage for the Constituent Assembly election.
  - axis: institutional.rule_of_law
    direction: "-"
    magnitude: strong
    rationale: The 1851 coup dissolved the National Assembly; the 1852 Empire concentrated power in an executive not accountable to the elected legislature, despite universal male voting for a constrained chamber.
    drift_attribution_year: 1852
    drift_attribution_basis: The Empire was proclaimed and its constitution promulgated in 1852 after the December 1851 coup.
references:
  - "French National Assembly, 1848 universal male suffrage: https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/histoire/le-suffrage-universel/la-republique-et-le-suffrage-universel/1848-la-deuxieme-republique-met-en-place-le-suffrage-universel-masculin"
  - "French National Assembly, Second Empire 1852–1870: https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/histoire/le-suffrage-universel/la-republique-et-le-suffrage-universel/1852-1870-le-second-empire-ou-le-devoiement-du-suffrage-universel"
notes: Candidate backfill combining successive regimes only to expose their contrasting institutional movements; it should not be read as a continuous policy program.
