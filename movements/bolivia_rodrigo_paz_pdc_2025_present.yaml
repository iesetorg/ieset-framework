# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: bolivia_rodrigo_paz_pdc_2025_present
status: candidate
name: "Rodrigo Paz PDC capitalist-for-all reset (Bolivia, 2025-present)"
countries: [BOL]
timeframe:
  start: 2025
  end: ongoing
  enacted_date: "2025-11-08"
coalition: "Christian Democratic Party / Primero la Gente with legislative support from non-MAS blocs"
leaders:
  - "Rodrigo Paz (President, from 8 November 2025)"
  - "Edmand Lara (Vice President)"
doctrine: >
  Post-MAS centrist-to-centre-right reset after Rodrigo Paz won the
  October 2025 runoff and took office on 8 November 2025, ending roughly
  two decades of MAS dominance. The doctrine is "capitalism for all":
  normalise relations with the United States and Israel, restock fuel
  supply, seek multilateral financing, restore rule-of-law credibility,
  review state-led lithium and SOE arrangements, and gradually unwind
  the fixed-peg/fuel-subsidy crisis without a Milei-style immediate shock.
policies:
  - bo_paz_fuel_emergency_operation_2025
  - bo_us_israel_relations_reset_2025
  - bo_paz_macro_stabilisation_program_2025
axes_summary:
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: moderate, rationale: "Government frames the fuel-subsidy and supply crisis as a central emergency to unwind or finance sustainably."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "Multilateral-supported stabilisation and SOE review point toward consolidation, though gradualism limits early magnitude."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Visa and diplomatic resets with the US/Israel/South Korea/South Africa reopen international links after MAS restrictions."}
  - {axis: regulatory.energy_supply_security, direction: "+", magnitude: moderate, rationale: "Emergency fuel import convoys and anti-smuggling orders directly target shortages."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Rhetoric and early legal reset after MAS crisis; concrete institutional reforms pending."}
predecessor_movements:
  - bolivia_arce_mas_2020_present
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned}
  - {position_id: ordoliberal, alignment: partially_aligned}
  - {position_id: developmentalism, alignment: opposed, notes: "Reviews MAS-era state-led lithium and subsidy architecture."}
references:
  - "AP, 9 November 2025, Rodrigo Paz sworn in as Bolivia's new president."
  - "El Pais, 8 November 2025, Paz inauguration and emergency fuel-stabilisation agenda."
  - "2025 Bolivian runoff official result and 8 November 2025 inauguration."
notes: >
  Included in the 2026 current-coding audit because Bolivia still displayed
  Arce/MAS as current. Candidate status reflects that the stabilisation
  programme is early and policy-level files are not yet materialised.
