doctrine: After COVID-19 caused the first recession in decades, the government used a recovery plan, fiscal stimulus,
  social protection expansion, and public investment to restore growth. Output rebounded strongly in 2021–22, while
  the World Bank recommended rebalancing from large public investment toward human-capital development.
