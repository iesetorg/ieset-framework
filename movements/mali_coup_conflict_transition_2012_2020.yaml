status: candidate
name: 2012 coup, conflict, and transitional governments
countries:
- MLI
timeframe:
  start: 2012
  end: 2019
coalition: Military-led transitional authorities and elected governments
leaders:
- Amadou Sanogo
- Ibrahim Boubacar Keita
doctrine: 'A 2012 coup interrupted Mali''s pluralist constitutional order amid armed conflict and territorial
  crisis. A transitional framework and elections restored elected government in 2013, but security pressures
  and institutional fragility persisted until the 2020 coup. This episode captures disrupted state authority
  and transition; it does not imply a coherent economic program.

  '
