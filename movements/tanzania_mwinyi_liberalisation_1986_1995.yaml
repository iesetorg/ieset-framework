# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: tanzania_mwinyi_liberalisation_1986_1995
status: candidate
name: Tanzania Mwinyi-era economic liberalisation
countries: [TZA]
timeframe: {start: 1986, end: 1995}
coalition: "Chama Cha Mapinduzi (CCM) government under Ali Hassan Mwinyi"
leaders: ["Ali Hassan Mwinyi (President, 1985–1995)"]
doctrine: >
  Following the Ujamaa period's economic crisis, the government adopted an IMF- and
  World Bank-supported adjustment programme in 1986. Reforms liberalised trade and
  exchange arrangements, relaxed price controls, began financial-sector reform, and
  reduced the state enterprise footprint. Implementation was partial and uneven, with
  important parastatals and state direction persisting. This marks a shift toward a
  mixed market economy under CCM's continuing political dominance.
policies: [tz_economic_recovery_programme_and_market_reforms_1986]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Trade and exchange liberalisation began under the 1986 Economic Recovery Programme."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Price controls and restrictions on private entry were eased, though reform remained incomplete."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, rationale: "The state began reducing direct control of commercial activity and parastatals."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Economic opening did not end one-party CCM political dominance."}
predecessor_movements: [tanzania_nyerere_ujamaa_1967_1985]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Market reforms expanded private exchange, while political pluralism and many state functions remained constrained."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The transition was managed by the ruling party and retained a strong public-sector role."}
references:
  - "World Bank, Yes Africa Can, chronology of Tanzania's economic transformation: https://documents.worldbank.org/en/publication/documents-reports/documentdetail/304221468001788072/yes-africa-can-success-stories-from-a-dynamic-continent"
notes: "The start follows adoption of the Economic Recovery Programme; the underlying crisis and reform context are described in the source."
