# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_constituent_provincial_privilege_abolition_1789
status: candidate
name: French Constituent Assembly provincial privilege abolition
countries: [FRA]
scope: national
timeframe:
  start: 1789
  end: 1789
coalition: National Constituent Assembly
doctrine: >
  The Constituent Assembly sought to replace inherited privileges of the
  kingdom's provinces and local communities with a common national legal
  order. This focused episode covers the legally operative 1789 abolition of
  particular provincial privileges, not every August decree or the later
  revolutionary reordering of property, political rights, and colonial rule.
policies:
- fr_august_decrees_1789
axes_summary:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  rationale: >
    Article 10 removed particular provincial legal privileges into the
    common law of French people. The formal legal change is national in
    enactment but limited in subject matter and cannot establish equal
    enforcement for all persons or places.
  drift_attribution_year: 1789
  drift_attribution_basis: >
    French National Assembly dates legal-force letters patent for the
    4–11 August decrees to publication on 3 November 1789.
references:
- 'French National Assembly, Night of 4 August and the 3 November letters patent: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/nuit-du-4-aout-abolition-des-privileges'
- 'French Conseil d Etat, 11 December 1974 decision quoting and applying August Decrees Article 10: https://www.legifrance.gouv.fr/ceta/id/CETATEXT000007614920'
notes: >
  Focused successor to origin/main's broader
  fr_constituent_assembly_legal_reordering_1789_1791 candidate. Only the
  narrow Article 10 weak rule-of-law coding is imported. The 1789 Declaration
  and property-rights score remain withheld. This is a coded legal direction,
  not a measured outcome or a claim of immediate universal equality.
