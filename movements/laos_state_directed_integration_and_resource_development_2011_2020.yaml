# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: laos_state_directed_integration_and_resource_development_2011_2020
status: candidate
name: Lao PDR state-directed regional integration and resource development
countries: [LAO]
timeframe: {start: 2011, end: 2020}
coalition: "Lao People's Revolutionary Party government"
leaders: ["Choummaly Sayasone (President through 2016)", "Bounnhang Vorachith (President, 2016–2021)"]
doctrine: >
  Laos deepened regional and global integration while maintaining party-state direction
  of development. Hydropower, mining, transport corridors, and foreign-financed
  infrastructure became prominent, with private and foreign capital operating inside
  state-approved plans and concessions. The 2010s brought stronger connectivity and
  investment but also debt and fiscal risks. This phase is a market-opening,
  resource-led development model under one-party state oversight.
policies: [lao_asean_wto_and_resource_investment_2011]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "ASEAN integration, WTO accession in 2013, and foreign investment expanded external integration."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "State-directed infrastructure, hydropower, and resource concessions shaped the investment model."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "Transport and energy infrastructure formed part of the development strategy, often using external finance."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Economic integration advanced under continued one-party political control."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "State coordination directed investment toward infrastructure, energy, and resources."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Foreign and private investment played a greater role within a state-planned framework."}
predecessor_movements: [laos_recovery_and_regional_integration_1998_2010]
references:
  - "World Bank, Forging Ahead: Restoring Stability and Boosting Prosperity: https://documents1.worldbank.org/curated/en/099120123031014987/pdf/P17777009e31da0510b2ee090dc949b25e9.pdf"
  - "World Bank, Lao PDR Economic Monitor reports: https://www.worldbank.org/en/country/lao/publication/lao-pdr-economic-updates"
notes: "Covers the development phase before the Ninth National Socio-Economic Development Plan movement beginning in 2021."
