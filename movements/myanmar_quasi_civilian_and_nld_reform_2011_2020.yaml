# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: myanmar_quasi_civilian_and_nld_reform_2011_2020
status: candidate
name: Myanmar quasi-civilian transition and NLD government
countries: [MMR]
timeframe: {start: 2011, end: 2020}
coalition: "USDP-led government (2011–2016), followed by National League for Democracy (NLD) government"
leaders: ["Thein Sein (President, 2011–2016)", "Aung San Suu Kyi (State Counsellor, 2016–2021)"]
doctrine: >
  From 2011, the government began a major political and economic opening: exchange-rate
  reform, trade and investment liberalisation, financial-sector modernisation, expanded
  public services, and greater international engagement. The 2015 election brought the
  NLD to government, but the military retained constitutional authority over key
  institutions and conflict remained widespread. Reform momentum was uneven, and
  communal violence and the 2017 Rohingya crisis sharply constrained the transition.
policies: [mmr_managed_float_and_opening_reforms_2012]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Trade, investment, and exchange restrictions were progressively eased."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Financial, investment, and private-sector reforms sought to replace segmented markets."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Public spending shifted toward social services and development needs."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Competitive elections and civilian administration expanded, but the military retained substantial constitutional power."}
predecessor_movements: [myanmar_slorc_spdc_market_opening_1989_2010]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "Elections and civilian institutions expanded while constitutional military powers and conflict persisted."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Market reforms advanced, though state ownership, conflict, and weak regulatory institutions remained."}
references:
  - "IMF, Myanmar 2011 Article IV: https://www.elibrary.imf.org/view/journals/002/2012/104/article-A001-en.xml"
  - "World Bank, Myanmar Economic Transition amid Conflict: https://www.worldbank.org/en/country/myanmar/publication/myanmar-economic-transition-amid-conflict-a-systematic-country-diagnostic"
notes: "Ends before the February 2021 coup; the period includes partial civilian government rather than full military withdrawal from politics."
