# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_gilded_age_industrial_growth_1878_1886
status: candidate
name: United States Gilded Age industrial expansion and contested federal regulation
countries: [USA]
timeframe: {start: 1878, end: 1886}
coalition: "Post-Reconstruction Republican and Democratic administrations"
leaders: ["Rutherford B. Hayes (President, 1877–1881)", "James A. Garfield (President, 1881)", "Chester A. Arthur (President, 1881–1885)", "Grover Cleveland (President from 1885)"]
doctrine: >
  The post-Reconstruction federal government operated within a rapidly industrialising,
  private-enterprise economy, with high tariff protection, hard-money commitments, and
  a limited federal welfare role. Farmers' and labor movements challenged railroad
  power and unequal market access. The 1886 Wabash decision constrained state regulation
  of interstate railroads; Congress responded in 1887 with the Interstate Commerce Act.
  This phase records a market-led industrial order and the early political demand for
  federal rules, rather than a settled regulatory regime.
policies: [us_bland_allison_and_specie_resumption_1878]
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: weak, rationale: "Railroad concentration and limited federal oversight shaped a highly unequal industrial market."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: moderate, rationale: "High protective tariffs remained a central feature of federal economic policy."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "The federal state remained comparatively small outside debt service and land, postal, and military functions."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Federal constitutional authority constrained state rail regulation, prompting a new national policy debate."}
predecessor_movements: [us_reconstruction_civil_rights_1865_1877]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private enterprise expanded with limited regulation, while tariff protection and railroad concentration qualify a simple laissez-faire reading."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Protective tariffs and public land policy supported industrial expansion, though direct federal planning remained limited."}
references:
  - "National Archives, Interstate Commerce Act: https://www.archives.gov/milestone-documents/interstate-commerce-act"
notes: "The map's earliest U.S. movement is Reconstruction (1865); the 1878 start follows the post-Reconstruction change in federal economic direction."
