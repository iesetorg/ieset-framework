- axis: regulatory.trade_openness
  direction: +
  magnitude: strong
  rationale: Trade and external economic relations were liberalised during EU-oriented transition.
- axis: institutional.rule_of_law
  direction: +
  magnitude: moderate
  rationale: Constitutional independence and new market institutions were rebuilt.
