# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_civil_war_republican_economic_state_building_1862_1864
status: candidate
name: US Civil War Republican economic institution building
countries: [USA]
timeframe: {start: 1862, end: 1864}
coalition: Lincoln administration and Republican congressional majorities during the Civil War
leaders:
  - Abraham Lincoln (President)
  - Salmon P. Chase (Treasury Secretary)
doctrine: >
  This governing coalition used federal legislation to build national markets and
  finance the Civil War. It granted land and credit support to a transcontinental
  railway, offered surveyed federal land to eligible individual settlers, and
  created a uniform national bank charter and currency supervised by a federal
  comptroller. Proponents argued that public coordination and common rules could
  mobilize capital, settlement, and commerce across state borders while preserving
  privately owned farms, railroads, and banks. The land program also contributed
  to Indigenous dispossession, so gains in settler title are not coded as an
  unqualified national improvement in property rights.
policies:
  - us_homestead_act_1862
  - us_pacific_railway_act_1862
  - us_national_banking_acts_1863_1864
axes_summary:
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    rationale: Federal land grants and railway bond support favored settler agriculture and railway construction through public resources.
    drift_attribution_year: 1862
    drift_attribution_basis: The Homestead Act was signed on 1862-05-20 and the Pacific Railway Act on 1862-07-01; both authorized federal land transfers, and the railway act also authorized bond support.
  - axis: regulatory.financial_deregulation
    direction: "+"
    magnitude: moderate
    rationale: National bank charters, reserve requirements, and federal supervision replaced a patchwork of state bank-note arrangements with tighter national banking rules.
    drift_attribution_year: 1864
    drift_attribution_basis: The 1863 National Currency Act created the OCC and national charters; the National Banking Act of 1864 established the durable capital and reserve requirements summarized here.
references:
  - "Homestead Act, 12 Stat. 392 (1862): https://www.archives.gov/milestone-documents/homestead-act"
  - "Pacific Railway Act, 12 Stat. 489 (1862): https://www.archives.gov/milestone-documents/pacific-railway-act"
  - "National Currency Act (1863) and National Banking Act (1864): https://occ.gov/about/who-we-are/history/history-of-the-occ/founding-occ-national-bank-system/index-founding-occ-national-banking-system.html"
  - "Native Americans and the Homestead Act, National Park Service: https://www.nps.gov/home/learn/historyculture/native-americans-and-the-homestead-act.htm"
notes: >
  Candidate historical backfill, not an absolute market/state starting score.
  The 1862 opening marks the first newly coded national decision in this batch;
  earlier federal, state, and Indigenous institutions remain outside coverage.
