# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_imperial_state_building_social_insurance_1871_1901
status: candidate
name: German Empire — imperial consolidation and Bismarckian social insurance
countries: [DEU]
timeframe: {start: 1871, end: 1901}
coalition: Imperial governments under Otto von Bismarck and parliamentary parties in the Reichstag
leaders: ["Otto von Bismarck", "Wilhelm I", "Wilhelm II"]
doctrine: >
  The German Empire built a national legal and economic area under a federal
  constitution in which the Reichstag legislated and approved budgets but the
  Emperor and Chancellor retained control of the executive. In the 1880s,
  Parliament created national sickness, accident, and old-age insurance. This
  movement combines imperial institutional consolidation with social
  insurance while making the authoritarian limit on parliamentary government
  explicit.
policies: [deu_bismarck_social_insurance_1883_1889]
axes_summary:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: strong
    rationale: National contributory insurance laws added durable social-protection programs.
    drift_attribution_year: 1883
    drift_attribution_basis: The first of the national sickness, accident, and old-age insurance statutes was enacted in 1883.
references:
  - "German Bundestag, The Empire (1871–1918): https://www.bundestag.de/en/parliament/history/parliamentarism/empire"
notes: "The movement's constitutional description does not code the Empire as a parliamentary democracy."
