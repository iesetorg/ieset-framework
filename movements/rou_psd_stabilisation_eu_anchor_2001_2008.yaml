doctrine: From 2001, fiscal and monetary stabilisation, privatisation, and EU accession commitments supported rapid
  growth. EU membership in 2007 anchored further institutional alignment, while credit expansion, procyclical fiscal
  policy, and capital inflows generated overheating and external imbalances by 2008.
