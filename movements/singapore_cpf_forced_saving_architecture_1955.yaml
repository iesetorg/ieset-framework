# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: singapore_cpf_forced_saving_architecture_1955
status: candidate
country_drift_role: context_only
country_drift_primary_movement: singapore_pap_industrialisation_1959_1989
name: "Singapore CPF + MediShield forced-saving welfare architecture"
countries: [SGP]
timeframe: {start: 1955, end: ongoing}
coalition: "Colonial administration at CPF commencement; PAP governments expanded the architecture from 1959"
leaders: ["Lee Kuan Yew (founding PM)", "Goh Chok Tong", "Lee Hsien Loong", "Khaw Boon Wan (health reforms)"]
doctrine: >
  Central Provident Fund (1955) + 3M framework
  (MediSave 1984, MediShield 1990, MediFund 1993) constitute a
  distinctive welfare architecture: mandatory individual savings
  accounts + catastrophic-coverage insurance + safety net. Produces
  higher retirement adequacy and lower healthcare costs (as % GDP)
  than transfer-based universal welfare systems while retaining
  universal coverage. Cited in mega-spec D.2.9 and D.2.10 as the
  canonical alternative to Nordic transfer-based welfare, and in
  US healthcare context (D.2.10) as the market-respecting reform
  US political economy has been unable to implement.
policies: [singapore_cpf_1955, singapore_medisave_1984, singapore_medishield_1990, singapore_medifund_1993]
axes_summary:
  - {axis: institutional.property_rights, direction: "+", magnitude: weak, rationale: "The 1955 CPF scheme established member-specific savings claims, though withdrawal was restricted; no removal of an existing transfer programme or spending cut is inferred."}
outcome_hypotheses: [welfare_architecture_comparative_effectiveness, us_healthcare_underperformance_political_economy_not_market_failure]
position_alignments:
  - {position_id: empirical_pragmatist, alignment: aligned}
  - {position_id: chicago_monetarism, alignment: partially_aligned}
references:
  - "Asher (2002), 'Social Security Reform in Singapore'"
  - "Phua (2017), 'Singapore's healthcare system'"
  - "CPF Board annual reports"
  - "Singapore Statutes Online, legislative history of the 1953 CPF Ordinance and 1 July 1955 commencement: https://sso.agc.gov.sg/Act/CPFA1953"
  - "CPF Board 70th-anniversary history: https://www.cpf.gov.sg/member/infohub/news/news-releases/cpf-board-marks-70th-anniversary-with-launch-of-plan-with-cpf-and-commemorative-book"
notes: >
  The original CPF law predates PAP government. Mandatory personal saving
  does not itself demonstrate a reduction in tax-financed transfers or public
  spending, so neither fiscal axis is scored at 1955. Later health-system
  measures need their own decision years before any competition step is added.
