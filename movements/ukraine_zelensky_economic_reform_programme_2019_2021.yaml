# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: ukraine_zelensky_economic_reform_programme_2019_2021
status: candidate
name: "Zelensky government's early liberalisation and investment-reform programme"
countries: [UKR]
timeframe: {start: 2019, end: 2021}
coalition: "Servant of the People-led Zelensky government"
leaders:
  - "Volodymyr Zelenskyy (President from 2019)"
  - "Oleksiy Honcharuk (Prime Minister, 2019–2020)"
  - "Denys Shmyhal (Prime Minister from 2020)"
policies: [ua_zelensky_economic_reform_decree_2019]
doctrine: >
  The new government set out to stimulate investment and reduce barriers to
  private business, including through large-scale privatisation, land-market
  preparation, labour-law liberalisation, and restructuring of state
  monopolies. This movement covers the programme's initial reform phase; it
  does not assume every announced measure was implemented as intended.
axes_summary:
  - {axis: institutional.property_rights, direction: "+", magnitude: moderate, rationale: "The government prepared and introduced a market for agricultural land, changing restrictions on land ownership and transfers."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "The programme targeted state monopolies, large-scale privatisation, concessions, and a more competitive railway market."}
  - {axis: regulatory.labour_market_flexibility, direction: "+", magnitude: moderate, rationale: "Official reform directives called for liberalising labour relations and modernising labour legislation."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, rationale: "The programme's privatisation and private-investment orientation reduced the intended role of direct state ownership and allocation in selected sectors."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "The programme emphasised investment, liberalisation, competition, and private ownership, alongside a continuing role for the state in development and social policy."}
  - {position_id: empirical_pragmatist, alignment: partially_aligned, notes: "The movement bundled market reforms with administrative and public-sector measures rather than applying a single ideological doctrine."}
references:
  - "President of Ukraine, Decree No. 837/2019 on urgent reform measures: https://www.president.gov.ua/en/news/volodimir-zelenskij-pidpisav-ukaz-pro-nevidkladni-z-p-58289"
  - "President of Ukraine, government priorities for investment and business climate, 2 September 2019: https://www.president.gov.ua/en/news/volodimir-zelenskij-onovlena-vlada-maye-stimulyuvati-investi-57097"
  - "President of Ukraine, 2019 address on economic liberalisation: https://www.president.gov.ua/en/news/zmicnennya-bezpeki-ta-oboroni-liberalizaciya-ekonomiki-j-ene-56993"
notes: "The record ends in 2021 at the start of the full-scale-war period, treated separately. The 1999–2018 interval remains undercovered."
