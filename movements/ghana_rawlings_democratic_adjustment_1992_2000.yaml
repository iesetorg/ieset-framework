# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: ghana_rawlings_democratic_adjustment_1992_2000
status: candidate
name: Ghana Rawlings-era electoral government and contested adjustment
countries: [GHA]
timeframe: {start: 1992, end: 2000}
coalition: "National Democratic Congress (NDC), led by Jerry Rawlings"
leaders: ["Jerry John Rawlings (President, 1993–2001)"]
doctrine: >
  Ghana's return to multiparty constitutional rule overlapped with the later years of
  the Economic Recovery Program. Elections made parts of adjustment more politically
  contested: fiscal expansion and reversals of some price and tax measures contributed
  to instability in the mid-1990s, while privatisation and cocoa-sector reforms
  continued unevenly. This phase combines electoral institutional change with a
  stop-start market reform trajectory and a substantial public role.
policies: [gha_democratic_transition_and_contested_adjustment_1992]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "Multiparty constitutional elections replaced the preceding military-led order, though competition remained uneven."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Fiscal expenditure pressures increased and some earlier adjustments were reversed."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Market reforms continued but were interrupted and politically contested."}
predecessor_movements: [ghana_erp_stabilisation_1983_1991]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "Competitive constitutional politics expanded, but democratic consolidation remained incomplete."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "State-led development remained important as structural adjustment was adapted and contested."}
references:
  - "World Bank, Ghana adjustment lending and reform setbacks, 1992–1997: https://documents1.worldbank.org/curated/en/988621468030626957/pdf/596200NWP01pub158288B0prsc1ghana1cs.pdf"
notes: "Movement covers the period through the 2000 election; transition to the NPP government is dated to 2001."
