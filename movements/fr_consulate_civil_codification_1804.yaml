# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_consulate_civil_codification_1804
status: candidate
name: French Consulate civil-law codification in 1804
countries: [FRA]
scope: national
timeframe:
  start: 1804
  end: 1804
coalition: Bonaparte's Consulate and the Legislative Body
leaders:
- Napoleon Bonaparte
- Jean-Jacques-Regis de Cambaceres
doctrine: >
  The Consulate sought a national civil-law framework to replace regional
  sources of private law and make governing rules more uniform. This episode
  is limited to the 1804 consolidation of the Civil Code, rather than a score
  for the Consulate, Empire, or all dimensions of legal equality.
policies:
- fr_civil_code_1804
axes_summary:
- axis: institutional.rule_of_law
  direction: '+'
  magnitude: weak
  rationale: >
    The Civil Code provides a narrow, source-backed move toward formal legal
    uniformity. Unequal family law and the authoritarian political setting
    preclude a broader or stronger rule-of-law claim.
  drift_attribution_year: 1804
  drift_attribution_basis: >
    The French National Assembly dates the law consolidating the Code to
    21 March 1804; component civil laws had separate executory dates.
references:
- 'French National Assembly, legal codification under the Consulate and Empire: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/consulat-et-premier-empire/la-codification-juridique'
- 'French National Assembly, original Civil Code consolidation law: https://www.assemblee-nationale.fr/evenements/code-civil/cc1804-loi.pdf'
- 'French National Assembly, parliamentary report on gender equality and the 1804 Civil Code: https://www.assemblee-nationale.fr/11/rapports/r1240.asp'
notes: >
  Focused successor to origin/main's broader
  fr_consulate_empire_legal_state_1799_1815 candidate. Only the Civil Code
  child and one weak institutional step are imported. This candidate is
  legal-content coding, not an observed country-year outcome.
