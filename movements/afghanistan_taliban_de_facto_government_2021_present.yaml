# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: afghanistan_taliban_de_facto_government_2021_present
status: candidate
name: Taliban de facto government and self-reliance economic programme
countries: [AFG]
timeframe: {start: 2021, end: ongoing, enacted_date: "2021-08-15"}
coalition: Taliban de facto authorities
leaders: [Hibatullah Akhundzada, Abdul Ghani Baradar]
policies: [afg_taliban_de_facto_revenue_and_economic_administration_2021]
doctrine: >
  After taking control in August 2021, the Taliban authorities consolidated
  national revenue collection and budget management, promoted self-reliance,
  and prioritised agriculture, infrastructure, water, mining, and private
  investment. These economic goals operate alongside severe restrictions on
  women and girls and outside normal international recognition and financing.
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "The takeover replaced the prior constitutional order with de facto rule, while UN reporting documents restrictions on rights and opaque public-finance decisions."}
  - {axis: regulatory.sectoral_licensing, direction: "+", magnitude: moderate, rationale: "Revenue collection, customs, fees, and business regulation are administered through centralised de facto authorities; the reported legal and property framework remains unclear."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The authorities prioritise infrastructure, agriculture, and self-reliance, but this does not imply inclusive development or international recognition."}
references:
  - "UN Security Council, report on the situation in Afghanistan, 13 June 2024: https://digitallibrary.un.org/record/4053880/files/S_2024_499-EN.pdf"
  - "United Nations in Afghanistan, 2025 Country Results Report: https://afghanistan.un.org/sites/default/files/2026-04/AFG_AR_2025_HiRes_Final%20for%20print%20and%20website%20posting-20AP26.pdf"
notes: "The UN describes these authorities as de facto; this record does not imply international recognition. The country remains outside normal development-finance channels."
