# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: luxembourg_eu_integrated_social_market_governance_2008_present
status: candidate
name: Luxembourg EU-integrated social-market governance 2008-present
countries: [LUX]
timeframe:
  start: 2008
  end: ongoing
coalition: Successive Luxembourg coalition governments, including Bettel II and Frieden CSV-DP
leaders:
- "Jean-Claude Juncker (Prime Minister, 1995-2013)"
- "Xavier Bettel (Prime Minister, 2013-2023)"
- "Luc Frieden (Prime Minister, 2023-present)"
doctrine: >
  Luxembourg's recent economic-policy regime combines small-state financial
  stability, EU single-market integration, tax-financed mobility and climate
  measures, and coalition-based social-market adjustment. The policy cluster
  runs from the Dexia crisis response through free nationwide public transport
  and carbon pricing to post-2023 CSV-DP positioning around housing,
  competitiveness, climate, energy security, and EU regulatory implementation.
policies:
- be_dexia_rescue_2008
- lux_free_public_transport_2020
- lux_climate_law_carbon_tax_2020
axes_summary:
- axis: fiscal.spending_level
  direction: +
  magnitude: weak
  rationale: The 2020 free-fare decision replaced standard-class passenger fares with state financing.
  drift_attribution_year: 2020
  drift_attribution_basis: Luxembourg government confirms the national free-fare start on 1 March 2020.
- axis: fiscal.sectoral_subsidy
  direction: +
  magnitude: moderate
  rationale: State-funded free public transport replaced standard-class fares nationwide.
  drift_attribution_year: 2020
  drift_attribution_basis: Luxembourg government confirms state-funded national free transport from 1 March 2020.
- axis: regulatory.environmental_stringency
  direction: +
  magnitude: moderate
  rationale: Luxembourg's December 2020 climate law established national decarbonisation duties.
  drift_attribution_year: 2020
  drift_attribution_basis: Legilux dates the national climate law to 15 December 2020.
references:
- "Luxembourg government, Accord de coalition 2023-2028: https://gouvernement.lu/fr/publications/accord-coalition/accord-de-coalition-2023-2028.html"
- "Legilux, Loi du 15 decembre 2020 relative au climat: https://legilux.public.lu/eli/etat/leg/loi/2020/12/15/a994/jo"
- "Luxembourg government, state-funded national free transport from 1 March 2020: https://sip.gouvernement.lu/en/actualites.gouvernement2024%2Ben%2Bactualites%2Btoutes_actualites%2Barticles%2B2019%2B12-decembre%2B31-nouveauts-2020.html"
- "European Commission, Luxembourg's 2008 Dexia contribution: https://ec.europa.eu/competition/state_aid/cases/227704/227704_944159_114_1.pdf"
- "EUR-Lex, Directive (EU) 2024/2831 Article 29, national transposition due 2 December 2026: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024L2831"
notes: >
  The 2008 joint Dexia rescue remains contextual: Luxembourg contributed, but
  the original strong national financial-regulation and spending steps were
  copied from a cross-border intervention without an isolated Luxembourg
  policy magnitude, so they are withheld pending a separate source review.
  EU-wide electricity reform and the platform-work directive are not national
  Luxembourg decisions and supply no scored axis here. The platform directive
  requires national transposition by December 2026; no Luxembourg
  implementation date is inferred. Only the dated 2020 national transport and
  climate decisions are scored, without claiming their outcomes were measured.
