movement_id: dprk_workers_party_economic_plans_2021_present
status: candidate
name: Workers' Party five-year economic plans and self-reliance programme
countries: [PRK]
timeframe: {start: 2021, end: ongoing}
coalition: Workers' Party of Korea and DPRK government
leaders: [Kim Jong Un]
policies: [dprk_ninth_workers_party_five_year_plan_2026]
doctrine: >
  The Workers' Party has continued a five-year national economic planning
  programme focused on self-reliance, industrial and agricultural production,
  defence, construction, and state-led development. The 2026 plan adds a
  renewed regional industrialisation programme and priorities in metallurgy,
  chemicals, power, coal, machinery, information technology, and artificial
  intelligence.
axes_summary:
  - {axis: institutional.property_rights, direction: "-", magnitude: moderate, rationale: "The national programme places production and investment priorities within a centrally directed party-state planning framework."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "The plan makes public investment and construction central to economic and regional development, though comparable spending totals are unavailable."}
position_alignments:
  - {position_id: marxist_leninist, alignment: partially_aligned, notes: "The party-state retains central planning and self-reliance commitments, but its governing doctrine is locally specific and includes military-first priorities."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The plan targets industrial capacity and regional infrastructure through state direction; its outcomes are not evaluated here."}
references:
  - "United Nations in DPRK, 9th Workers' Party Congress unveils new Five-Year Plan 2026–2030, 25 February 2026: https://dprk.un.org/en/310999-9th-workers-party-congress-unveils-new-five-year-plan-2026-2030"
notes: "A broad plan cycle is used to capture the 8th and 9th Party Congress economic programmes. Spending direction describes announced public priorities; comparable fiscal accounts are unavailable."
