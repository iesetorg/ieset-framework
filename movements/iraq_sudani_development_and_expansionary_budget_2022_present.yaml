# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: iraq_sudani_development_and_expansionary_budget_2022_present
status: candidate
name: "Al-Sudani coalition, expansionary budget, and diversification plans"
countries: [IRQ]
timeframe: {start: 2022, end: ongoing}
coalition: "Coordination Framework-led coalition government"
leaders:
  - "Mohammed Shia' al-Sudani (Prime Minister from 2022)"
doctrine: >
  The coalition government formed in October 2022 ended a prolonged political
  impasse and adopted Iraq's first three-year budget, with a large fiscal
  expansion, salary and pension commitments, and major public investment.
  Government plans also call for diversifying beyond oil through a leading
  private sector, public-private partnerships, infrastructure, and the
  Development Road. This remains a state-centred oil economy, and planned
  diversification should not be read as an achieved structural transition.
policies:
  - irq_iraq_development_fund_2023
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "The 2023–2025 budget was a large fiscal expansion, including salary, pension, and investment spending."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: moderate, rationale: "The budget raises salary and pension commitments and the programme emphasises social safety-net support; distributional effects are not inferred."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, rationale: "The national plan seeks private-sector development and public-private partnerships, while oil revenue and public employment leave the state dominant."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Large infrastructure and strategic-project investment is coordinated by government and the Development Fund."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "The national development plan formalises multi-year programme and performance budgeting goals, while implementation capacity and governance remain constraints."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The government directs oil revenues into infrastructure and sectoral diversification, while seeking private-sector participation."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private-sector development is a stated objective, but the budget and employment model remain strongly state-centred."}
references:
  - "Iraq Ministry of Planning, National Development Plan 2024–2028: https://www.mop.gov.iq/documents/economic-policies/development-plans/National%20Development%20Plan%202024-2028.pdf"
  - "IMF, Iraq: 2024 Article IV Consultation: https://www.imf.org/en/publications/cr/issues/2024/05/15/iraq-2024-article-iv-consultation-press-release-staff-report-and-statement-by-the-executive-549028"
  - "Iraq Development Fund, About Us: https://ifd.gov.iq/en/about-us"
  - "Iraqi News Agency, Al-Sudani leads Development Road project committee, 2 October 2023: https://ina.iq/en/politics/28967-al-sudani-leads-higher-committee-meeting-for-development-road-project.html"
notes: "Movement begins with the coalition's formation in October 2022. Budget projections, national-plan targets, and intended private-sector gains are not treated as realised outcomes. Iraq's long 1980–2021 gap remains open."
