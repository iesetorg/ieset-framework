# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: tunisia_ben_ali_adjustment_and_export_led_growth_1988_2011
status: candidate
name: Tunisia Ben Ali-era adjustment and export-led growth
countries: [TUN]
timeframe: {start: 1988, end: 2011}
coalition: "Constitutional Democratic Rally (RCD) government under Zine El Abidine Ben Ali"
leaders: ["Zine El Abidine Ben Ali (President, 1987–2011)"]
doctrine: >
  Following the 1986 crisis, Tunisia continued structural adjustment and outward
  orientation: prices, trade, investment and finance were liberalised in stages,
  public enterprises were restructured and some privatised, and export manufacturing
  and European market integration expanded. Strategic sectors and substantial state
  influence remained, while political power became increasingly concentrated and
  competitive political rights were restricted. Economic marketisation therefore
  coexisted with authoritarian rule and selective state-business connections.
policies: [tun_structural_adjustment_and_privatization_1987]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Trade liberalisation and export orientation expanded through successive reforms and European integration."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Price, investment, and public-enterprise reforms increased scope for private production, unevenly across sectors."}
  - {axis: fiscal.sectoral_subsidy, direction: "-", magnitude: weak, rationale: "Privatisation reduced some state commercial activity while strategic enterprises and support remained."}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "Political competition and civil liberties were tightly constrained under Ben Ali."}
predecessor_movements: [tunisia_bourguiba_state_modernisation_1956_1987]
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Trade and private-sector reforms advanced without open political competition or comprehensive withdrawal of state influence."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Export upgrading and state coordination remained part of the governing model."}
references:
  - "IMF, Tunisia structural reform programme launched in 1986: https://www.elibrary.imf.org/display/book/9781557753571/ch005.xml"
  - "IMF, Tunisia privatization and public enterprise reform: https://www.elibrary.imf.org/view/journals/002/2000/037/article-A001-en.xml"
notes: "Ends with the January 2011 revolution. Economic reform and political liberalisation are treated as separate dimensions."
