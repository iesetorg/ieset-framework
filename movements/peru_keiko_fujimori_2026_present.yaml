# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: peru_keiko_fujimori_2026_present
status: candidate
name: "Keiko Fujimori government (Peru, 2026-present; policy coding provisional)"
countries: [PER]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-07-28"
coalition: "Fuerza Popular-led presidency; in office from 28 July 2026"
leaders:
  - "Keiko Fujimori (President from 28 July 2026)"
  - "Luis Galarreta (First Vice President, credential issued by JNE on 15 July 2026)"
doctrine: >
  Conservative security-market successor to the post-Castillo/Boluarte
  caretaker-congressional cycle. The campaign and transition platform
  stresses private investment, policy stability, hard-line anti-crime
  measures, prison expansion, militarised border/security responses, and
  a pro-business macro posture under Peru's independent central bank and
  1993 constitutional architecture. Anti-Fujimori mobilisation and a
  razor-thin runoff result make legitimacy and rule-of-law monitoring
  central to the coding.
policies:
  - pe_fujimori_security_prison_package_2026
  - pe_fujimori_private_investment_push_2026
  - pe_fujimori_transition_dialogue_2026
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Private-investment and permitting-friendly posture, pending enacted package."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "Security/prison spending expansion likely offsets pro-market fiscal-restraint rhetoric."}
  - {axis: regulatory.immigration_openness, direction: "-", magnitude: weak, rationale: "Campaign signalled tougher border and expulsion measures for criminal migrants."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "Formal JNE proclamation follows close count; Fujimorismo legacy and security proposals require civil-liberty scrutiny."}
  - {axis: monetary.central_bank_independence, direction: "0", magnitude: weak, rationale: "No announced change to BCRP autonomy."}
predecessor_movements:
  - peru_boluarte_post_castillo_2022_present
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned}
  - {position_id: ordoliberal, alignment: partially_aligned, notes: "Macro stability and formal institutions align; rule-of-law risks remain first-order."}
  - {position_id: institutionalism, alignment: partially_aligned}
  - {position_id: social_democratic, alignment: opposed}
references:
  - "JNE, 3 July 2026, proclamation of the presidential result: https://www.gob.pe/institucion/jne/noticias/1414770-jne-proclama-a-keiko-fujimori-higuchi-como-presidenta-electa-de-la-republica"
  - "Congress of Peru, 28 July 2026, presidential inauguration: https://comunicaciones.congreso.gob.pe/noticias/keiko-fujimori-juro-como-presidenta-constitucional-de-la-republica/"
  - "AP, 4 July 2026, Keiko Fujimori declared winner of Peru presidential runoff."
  - "El Pais, 4 July 2026, JNE proclamation and president-elect transition."
  - "Financial Times, 4 July 2026, Fujimori runoff victory and 28 July inauguration."
notes: >
  Election and office status checked on 2026-10-09: the JNE proclaimed the
  result on 3 July and Congress confirms inauguration on 28 July 2026.
  This replaces the July snapshot's president-elect status. The pre-existing
  doctrine, axes and unresolved policy IDs describe campaign/transition
  proposals, not verified enacted policies; policy-content review remains
  pending. Boluarte is a coded earlier predecessor, not the immediate
  outgoing president: her presidency ended in October 2025. The intervening
  administrations remain a movement-coverage gap and are not imputed to her.
