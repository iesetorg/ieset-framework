# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: drc_tshisekedi_action_programme_2024_present
status: candidate
name: "Tshisekedi second-term government action programme"
countries: [COD]
timeframe: {start: 2024, end: ongoing}
coalition: "Union Sacree-led government under Felix Tshisekedi"
leaders:
  - "Felix-Antoine Tshisekedi Tshilombo (President)"
  - "Judith Suminwa Tuluka (Prime Minister from 2024)"
policies: [cd_national_strategic_development_plan_2024_2028]
doctrine: >
  The second-term programme and National Strategic Development Plan combine
  state-building and security priorities with social-solidarity commitments,
  infrastructure, and economic diversification. The government seeks to
  expand public services and connect regions while using public investment
  and mineral resources to support development. The IMF programme is aligned
  to these government objectives but also imposes fiscal and governance
  constraints. The record excludes the separate Rwandan intervention policy
  from the DRC's domestic movement.
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "The 2024–2028 programme budgets rising public expenditure for state authority, infrastructure, and social services, although delivery and financing remain uncertain."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Infrastructure, regional connectivity, mineral value chains, and diversification are planned as public strategic priorities."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "The programme's people-first and social-solidarity goals imply greater service commitments, but the sources do not establish a quantified transfer expansion."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: weak, rationale: "The government promotes private investment and diversification while maintaining a central state role in strategic development and resource allocation."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "The national strategy states rule of law and state capacity as governing foundations; this is a programme statement rather than an observed implementation score."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The programme assigns the state a leading role in national infrastructure, services, and diversification."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "State modernisation and rule-of-law goals are explicit, while insecurity and governance constraints remain substantial."}
references:
  - "Government of DRC, National Strategic Development Plan 2024–2028: https://plan.gouv.cd/plan-national-strategique-de-developpement-2024-2028/"
  - "Government of DRC, National Strategic Development Plan overview: https://plan.gouv.cd/projet_programmes/plan-national-strategique-de-developpement-pnsd/"
  - "IMF, 2025 ECF and Resilience and Sustainability Facility programme for DRC: https://www.elibrary.imf.org/view/journals/002/2025/023/article-A001-en.xml"
notes: "Covers the second-term programme, not the country's prior political movements. Domestic movement coding deliberately excludes cross-border military policy attributed to another country."
