# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: japan_meiji_state_formation_1868_1872
status: candidate
name: Meiji Restoration and centralized state formation
countries: [JPN]
timeframe: {start: 1868, end: 1872}
coalition: Meiji government led by former Satsuma, Choshu, Tosa, and Hizen domains
leaders:
  - Mutsuhito (Emperor Meiji)
  - Ōkubo Toshimichi
  - Kido Takayoshi
doctrine: >
  The Meiji government proclaimed deliberative assemblies and public discussion
  as principles, built a central administration, and replaced hereditary
  domains with prefectures in 1871. This consolidated fiscal and territorial
  authority, while political power remained concentrated and the promised
  representative institutions were not yet established.
policies:
  - japan_charter_oath_1868
  - japan_prefecture_reorganization_1871
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The Charter Oath stated a new national governing framework and domain abolition replaced hereditary territorial administrations with centrally appointed prefectures; representative government remained limited.
    drift_attribution_year: 1868
    drift_attribution_basis: The Charter Oath was promulgated in 1868 as the new government's foundational statement.
  - axis: fiscal.spending_level
    direction: "+"
    magnitude: weak
    rationale: Centralizing administration and replacing domain governments expanded national administrative responsibilities; this is a qualitative institutional direction, not a measured spending share.
    drift_attribution_year: 1871
    drift_attribution_basis: The abolition of domains and establishment of prefectures took effect in July 1871.
references:
  - "National Diet Library, Initial Steps toward a Constitutional State: https://www.ndl.go.jp/modern/e/cha1/"
  - "National Archives of Japan, Return of lands and abolition of domains: https://www.archives.go.jp/exhibition/digital/modean_state/contents/return/index.html"
notes: Candidate historical backfill. The start context describes a transition from domain rule to a centralized state, not a numerical market/state score.
