doctrine: Iran’s post-1973 oil windfall financed an ambitious Fifth Development Plan with rapidly rising state investment.
  In March 1975 the Shah dissolved the remaining political parties into the Rastakhiz one-party system, further
  centralising political authority during the oil-led development push.
