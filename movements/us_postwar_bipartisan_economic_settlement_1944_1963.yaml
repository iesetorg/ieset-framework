# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_postwar_bipartisan_economic_settlement_1944_1963
status: candidate
name: US postwar bipartisan economic settlement
countries: [USA]
timeframe: {start: 1944, end: 1963}
coalition: Bipartisan congressional coalitions and successive Democratic and Republican administrations
leaders:
  - Franklin D. Roosevelt (President through 1945)
  - Harry S. Truman (President 1945-1953)
  - Dwight D. Eisenhower (President 1953-1961)
  - John F. Kennedy (President 1961-1963)
doctrine: >
  The postwar settlement combined expanded federal support for veterans,
  education, and national infrastructure with a statutory commitment to promote
  employment within a competitive-enterprise economy. It also included a
  countervailing restriction on union tactics and a 1951 agreement that restored
  greater Federal Reserve control over monetary policy. The period is therefore
  coded as a mixed, cross-party institutional settlement, with separate axis
  steps for identifiable policy decisions rather than a single uniform left or
  right direction.
policies:
  - us_gi_bill_1944
  - us_employment_act_1946
  - us_taft_hartley_act_1947
  - us_treasury_federal_reserve_accord_1951
  - us_federal_aid_highway_act_1956
  - us_national_defense_education_act_1958
axes_summary:
  - axis: fiscal.transfer_expansion
    direction: "+"
    magnitude: moderate
    rationale: Federal tuition, subsistence, unemployment, and housing support for veterans substantially broadened postwar transfers and benefits.
    drift_attribution_year: 1944
    drift_attribution_basis: The Servicemen's Readjustment Act was signed on 1944-06-22 and authorized veteran education, unemployment, and housing assistance.
  - axis: regulatory.labour_market_flexibility
    direction: "+"
    magnitude: weak
    rationale: The Taft-Hartley Act narrowed some union bargaining and organizing tools, shifting the statutory balance toward employer flexibility.
    drift_attribution_year: 1947
    drift_attribution_basis: The Labor-Management Relations Act was enacted on 1947-06-23; this codes statutory changes, not their measured labor-market effects.
  - axis: monetary.central_bank_independence
    direction: "+"
    magnitude: moderate
    rationale: The Treasury-Federal Reserve Accord ended the wartime interest-rate peg and separated monetary policy from routine federal debt management.
    drift_attribution_year: 1951
    drift_attribution_basis: The Treasury and Federal Reserve announced their agreement on 1951-03-04.
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: moderate
    rationale: Federal highway cost-sharing and education loans/grants expanded federal support for transport infrastructure and human capital.
    drift_attribution_year: 1956
    drift_attribution_basis: The Federal-Aid Highway Act was signed on 1956-06-29, authorizing major federal participation in a national interstate system.
  - axis: fiscal.sectoral_subsidy
    direction: "+"
    magnitude: weak
    rationale: The National Defense Education Act added federal loans, grants, and institutional support for selected education and research fields.
    drift_attribution_year: 1958
    drift_attribution_basis: The National Defense Education Act was signed on 1958-09-02.
references:
  - "https://www.archives.gov/milestone-documents/servicemens-readjustment-act"
  - "https://www.federalreservehistory.org/essays/treasury-fed-accord"
  - "https://www.archives.gov/milestone-documents/national-interstate-and-defense-highways-act"
  - "https://www.presidency.ucsb.edu/sites/default/files/books/presidential-documents-archive-guidebook/the-economic-report-of-the-president-truman-1947-obama-2017/1966.pdf"
notes: >
  This cross-party political settlement spans multiple administrations and
  includes countervailing policy directions. The movement interval marks the
  era of the coded policies, not uninterrupted continuity or a single governing
  party program.
