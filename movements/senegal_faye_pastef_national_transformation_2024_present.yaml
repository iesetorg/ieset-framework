# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: senegal_faye_pastef_national_transformation_2024_present
status: candidate
name: "Faye government and Senegal 2050 national transformation agenda"
countries: [SEN]
timeframe: {start: 2024, end: ongoing}
coalition: "PASTEF-led government"
leaders:
  - "Bassirou Diomaye Faye (President from 2024)"
  - "Ousmane Sonko (Prime Minister from 2024)"
policies: [sn_vision_senegal_2050_agenda_2024]
doctrine: >
  The new government launched Senegal 2050 as a national transformation
  agenda organised around a competitive economy, human capital and social
  equity, sustainable development, and good governance. It is implemented
  through a ten-year master plan and a 2025–2029 five-year plan and seeks
  greater sovereignty, diversification, domestic value creation, and
  public-private investment. The map codes the adopted agenda's stated
  direction; it does not assume those targets have been achieved.
axes_summary:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "The agenda identifies strategic domestic sectors and national transformation priorities for coordinated public and private investment."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "The five-year plan includes state investment and social-capital priorities, but its net effect on total expenditure is not established by the plan announcement."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: weak, rationale: "The agenda stresses national sovereignty and domestic value chains while also welcoming private investment and partnerships; no uniform trade restriction is inferred."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Good governance and accountable public institutions are explicit pillars of the national transformation agenda."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "Human capital and social equity are core plan pillars, but the available source does not specify a quantified transfer expansion."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The programme uses long-term state planning, sectoral prioritisation, and investment coordination to pursue national transformation."}
  - {position_id: social_democracy, alignment: partially_aligned, notes: "Social equity and human capital are explicit goals, but the programme does not by itself establish a social-democratic model of labour relations or welfare delivery."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "The agenda includes private investment and public-private partnerships while placing these within a national-sovereignty strategy."}
references:
  - "Presidency of Senegal, launch of National Transformation Agenda Senegal 2050, 14 October 2024: https://www.presidence.sn/en/actualites/the-launch-of-the-national-transformation-agenda-senegal-2050-1/"
  - "Presidency of Senegal, Vision Senegal 2050 strategic plan document: https://bo-admin.presidence.sn/storage/documents/5md5fMAh2Ti99EfAqRNMpLQwxCkKKJN94r8n9fDN.pdf"
  - "Presidency of Senegal, Cabinet statement on implementation and five-year start, 16 October 2024: https://www.presidence.sn/fr/actualites/communique-du-conseil-des-ministres-du-mercredi-16-octobre-2024-1/"
notes: "The episode begins with the 2024 transfer of national executive power and the launch of Vision Senegal 2050. Earlier post-1980 governments remain outside this movement."
