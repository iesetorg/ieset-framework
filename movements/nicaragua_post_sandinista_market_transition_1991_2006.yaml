# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: nicaragua_post_sandinista_market_transition_1991_2006
status: candidate
name: Post-Sandinista market transition and debt relief
countries: [NIC]
timeframe: {start: 1991, end: 2006}
coalition: Chamorro, Alemán, and Bolaños administrations
leaders: [Violeta Barrios de Chamorro, Arnoldo Alemán, Enrique Bolaños]
doctrine: >
  Following the 1990 election and end of the Contra war, successive governments
  stabilised a devastated economy through fiscal and monetary restraint, price
  and trade liberalisation, public-enterprise privatisation, demobilisation,
  and debt relief. The administrations restored private financial intermediation
  and pursued IMF-supported adjustment, while contested property claims,
  inequality, and limited institutional capacity shaped the transition.
policies: [nicaragua_post_sandinista_market_transition_1991_2006_policy]
axes_summary:
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, rationale: "The government liberalised trade and foreign-exchange systems and reduced price controls."}
  - {axis: institutional.property_rights, direction: +, magnitude: moderate, rationale: "Privatisation and private financial intermediation restored private ownership and market activity, although property disputes persisted."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "Stabilisation programmes cut public employment, military outlays, and fiscal imbalances."}
references:
  - "IMF, Nicaragua recent economic developments 1990-1996: https://www.imf.org/en/publications/cr/issues/2016/12/30/nicaragua-recent-economic-developments-1732"
  - "IMF, Nicaragua 2005 Article IV: https://www.imf.org/en/news/articles/2015/09/28/04/53/pn0655"
  - "World Bank, Nicaragua private-sector transition: https://documents1.worldbank.org/curated/en/792361468775605076/pdf/279670NI.pdf"
notes: "Market transition was neither uniform nor distributionally neutral; the record does not imply that privatisation created competitive markets in every sector."
