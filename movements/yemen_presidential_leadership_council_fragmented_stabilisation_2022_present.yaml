# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: yemen_presidential_leadership_council_fragmented_stabilisation_2022_present
status: candidate
name: Yemen Presidential Leadership Council and continued economic fragmentation
countries: [YEM]
timeframe: {start: 2022, end: ongoing, enacted_date: "2022-04-07"}
coalition: "Presidential Leadership Council (PLC), internationally recognised government; Houthi authorities retain control of the northwest"
leaders: ["Rashad al-Alimi (PLC chairman from April 2022)"]
doctrine: >
  The PLC replaced President Hadi and brought several anti-Houthi factions into a
  formal leadership structure, while Houthi authorities retained control of the
  largest population centres. The 2022 UN truce reduced active front-line fighting
  for a period but did not unify institutions or produce a comprehensive peace.
  Separate monetary authorities, exchange rates, and economic zones persist; oil export
  blockades and declining aid constrain the recognised government's fiscal capacity.
  The World Bank identifies fragmentation as the central feature of current economic
  conditions. This movement denotes fragile, partial stabilisation amid divided rule.
policies: [yem_plc_formation_and_un_truce_2022]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: strong, rationale: "The PLC consolidated some non-Houthi factions but did not reunify Yemen's political and legal institutions."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "Oil export blockades, falling external support, and fiscal adjustment constrained recognised-government spending."}
  - {axis: monetary.central_bank_independence, direction: "mixed", magnitude: strong, rationale: "Competing monetary authorities and exchange rates remain across separate economic zones."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: weak, rationale: "Conflict-related port, oil-export, and Red Sea disruptions have constrained trade."}
predecessor_movements: [yemen_war_economy_and_fragmented_authority_2015_2021]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "A collective executive was established for the internationally recognised government, while national institutional unity remains absent."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Stabilisation and reconstruction require public institutional capacity, which remains severely constrained."}
references:
  - "World Bank, Yemen Economic Monitor, Spring 2026: https://www.worldbank.org/en/news/press-release/2026/05/21/economic-strain-deepens-in-yemen-as-regional-risks-intensify"
  - "World Bank, Yemen Economic Monitor, Spring 2025: https://www.worldbank.org/en/news/press-release/2025/06/02/economic-fragmentation-and-external-shocks-hamper-yemen-s-recovery-path"
  - "World Bank, Yemen Economic Monitor, Fall 2025: https://www.worldbank.org/en/news/press-release/2025/11/17/economic-hardship-deepens-in-yemen"
  - "UN Security Council Panel of Experts on Yemen, report S/2023/833: https://digitallibrary.un.org/record/4028446/files/S_2023_833-EN.pdf"
notes: "Ongoing label describes the divided governing arrangement documented at the 2025 reporting cutoff; national control remains contested."
