# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: fr_consulate_empire_legal_state_1799_1815
status: candidate
name: Consulate and First Empire legal-administrative consolidation
countries: [FRA]
timeframe: {start: 1799, end: 1815}
coalition: Consulate and Napoleonic Empire, with shifting constitutional forms and imperial rule
leaders:
  - Napoleon Bonaparte
doctrine: >
  The Consulate and Empire consolidated central administration and national
  legal codes after the revolutionary decade. The Civil Code of 1804 unified
  major areas of private law while securing civil equality for men and
  property rights; it also entrenched patriarchal authority and coexisted
  with authoritarian government and imperial coercion. This is a bounded
  legal-state movement, not a claim of liberal democracy or uniform lived
  equality.
policies:
  - fr_civil_code_1804
axes_summary:
  - axis: institutional.rule_of_law
    direction: "+"
    magnitude: moderate
    rationale: The Civil Code replaced multiple regional legal traditions with a national codification, while the wider regime remained authoritarian and the Code itself institutionalized unequal family status.
    drift_attribution_year: 1804
    drift_attribution_basis: The Civil Code was adopted in 1804 and promulgated on 21 March.
references:
  - "French National Assembly, Legal codification under the Consulate and Empire: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/consulat-et-premier-empire/la-codification-juridique"
notes: >
  Candidate historical backfill. The movement describes legal-administrative
  consolidation and does not code the full revolutionary or imperial political
  economy.
