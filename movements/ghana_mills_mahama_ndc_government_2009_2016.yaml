# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: ghana_mills_mahama_ndc_government_2009_2016
status: candidate
name: Ghana Mills and Mahama NDC governments
countries: [GHA]
timeframe: {start: 2009, end: 2016}
coalition: "National Democratic Congress (NDC) governments"
leaders: ["John Atta Mills (President, 2009–2012)", "John Dramani Mahama (President, 2012–2017)"]
doctrine: >
  The NDC returned to office after a close election and combined social investment,
  public infrastructure, and expanded energy production with market institutions and
  oil-sector development. Production began at Jubilee oilfield in 2010. Fiscal
  imbalances and energy shortages became acute, prompting an IMF programme in 2015.
  The period is therefore mixed: public investment and transfers rose while fiscal
  stabilisation and private investment reforms became increasingly salient.
policies: [gha_oil_production_and_imf_programme_2010]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Public infrastructure and social programmes expanded, with fiscal deficits later requiring stabilisation."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "Oil and energy investment increased the role of public institutions and resource revenues."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Private sector growth remained a policy aim, though energy and macroeconomic constraints weighed on activity."}
predecessor_movements: [ghana_kufuor_market_reforms_2001_2008]
position_alignments:
  - {position_id: social_democratic, alignment: partially_aligned, notes: "Social programmes and public services were central, alongside market institutions and fiscal adjustment."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Oil and infrastructure investment supported a state-guided development approach."}
references:
  - "World Bank, Ghana adjustment and growth context: https://documents1.worldbank.org/curated/en/988621468030626957/pdf/596200NWP01pub158288B0prsc1ghana1cs.pdf"
notes: "The current gap closes with the 2017 NPP government already represented in the corpus."
