# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: tunisia_post_revolution_transition_2011_2021
status: candidate
name: Tunisia post-revolution pluralist transition and state-centred economic adjustment
countries: [TUN]
timeframe: {start: 2011, end: 2021}
coalition: "Constituent Assembly and successive coalition governments"
leaders: ["Moncef Marzouki (President, 2011–2014)", "Beji Caid Essebsi (President, 2014–2019)", "Kais Saied (President from 2019)"]
doctrine: >
  The revolution ended Ben Ali's presidency and opened a decade of competitive elections,
  coalition governments, constitution-making, and expanded political pluralism. Economic
  recovery was constrained by unemployment, regional inequalities, declining tourism,
  and fiscal pressures. Successive governments retained a large state role, expanded
  public wages and transfers, and pursued uneven efforts to improve private investment
  and state-enterprise performance. In 2021 President Kais Saied suspended parliament,
  initiating a later institutional rupture coded separately from this transition.
policies: [tunisia_post_revolution_transition_and_reform_2011]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "Elections, coalition government, and constitution-making replaced the prior authoritarian presidency for much of the period."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Public wages and transfers increased amid social demands and weak growth."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Reform agendas sought private investment and job creation, but structural changes advanced unevenly."}
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: weak, rationale: "Governments maintained and expanded social support in response to economic and regional hardship."}
predecessor_movements: [tunisia_ben_ali_adjustment_and_export_led_growth_1988_2011]
position_alignments:
  - {position_id: social_democratic, alignment: partially_aligned, notes: "Social inclusion and public provision became more prominent while fiscal constraints and coalition compromises limited a coherent social-democratic programme."}
  - {position_id: institutionalism, alignment: aligned, notes: "Constitution-making and competitive elections defined much of the post-revolution settlement until the 2021 suspension."}
references:
  - "IMF, Tunisia 2012 Article IV: https://www.elibrary.imf.org/abstract/journals/002/2012/255/article-A001-en.xml"
  - "IMF, Tunisia 2013 Article IV and post-revolution reforms: https://www.elibrary.imf.org/view/journals/002/2013/161/article-A001-en.xml"
  - "World Bank, Tunisia Economic Update October 2021: https://www.worldbank.org/en/country/tunisia/publication/economic-update-october-2021"
notes: "The period ends with Saied's July 2021 suspension of parliament; constitutional recentralisation is a distinct later movement from 2022."
