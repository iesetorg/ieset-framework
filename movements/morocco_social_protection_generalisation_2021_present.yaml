# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: morocco_social_protection_generalisation_2021_present
status: candidate
name: "Morocco social-protection generalisation programme"
countries: [MAR]
timeframe: {start: 2021, end: ongoing}
coalition: "Royal programme implemented across the Othmani and Akhannouch governments"
leaders:
  - "Mohammed VI (King)"
  - "Saadeddine Othmani (Head of Government through 2021)"
  - "Aziz Akhannouch (Head of Government from 2021)"
doctrine: >
  The national programme launched in 2021 sought to extend compulsory health
  insurance, family allowances, pensions, and unemployment protection beyond
  the previous narrower contributory coverage. It is a monarchy-led
  social-protection programme implemented by successive governments, not a
  claim that the 2021 election itself created the policy direction.
policies:
  - mar_social_protection_generalisation_framework_2021
axes_summary:
  - {axis: fiscal.transfer_expansion, direction: "+", magnitude: strong, rationale: "The staged programme extends health and family benefits, pensions, and unemployment-related protection toward broad population coverage."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, rationale: "Broader coverage creates recurrent financing and service-delivery obligations, although the ultimate spending effect depends on financing and implementation."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "The framework formalises eligibility, social registries, and staged implementation rules."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "A state-coordinated expansion of social coverage is developmentalist, but the programme operates within a mixed economy and monarchy-led institutional framework."}
  - {position_id: social_democracy, alignment: partially_aligned, notes: "Broad social insurance and family benefits expand social protection, while programme delivery remains gradual and contribution/registry based."}
references:
  - "King Mohammed VI, Throne Day Speech, 29 July 2020: https://www.maroc.ma/en/royal-speeches-and-messages/royal-speeches/speech-throne-day-2020"
  - "King Mohammed VI, Parliament Opening Speech, 9 October 2020: https://www.maroc.ma/en/royal-speeches-and-messages/royal-speeches/hm-king-delivers-speech-occasion-parliament-opening-full-text"
  - "Morocco Framework Law No. 09-21 on social protection (2021)."
notes: "The start year follows the national rollout date in the royal programme and the framework law. The line represents the programme's coded policy direction, not verified implementation or measured annual effects."
