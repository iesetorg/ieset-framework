# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: taiwan_chen_shui_bian_dpp_government_2000_2008
status: candidate
name: Taiwan Chen Shui-bian DPP government
countries: [TWN]
timeframe: {start: 2000, end: 2008}
coalition: "Democratic Progressive Party (DPP), minority government after 2004"
leaders: ["Chen Shui-bian (President, 2000–2008)"]
doctrine: >
  The first non-KMT government consolidated electoral alternation and pursued
  constitutional and administrative reform while retaining a market-based export
  economy. Taiwan joined the WTO in 2002. Cross-strait economic integration remained
  politically contested, and the government promoted domestic infrastructure and
  financial-sector reform. The period combines democratic institutional continuity,
  international trade integration, and active but selective state development policy.
policies: [tw_wto_accession_and_public_infrastructure_2002]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, rationale: "The 2000 transfer confirmed competitive alternation, though constitutional and cross-strait disputes continued."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "WTO accession in 2002 deepened rules-based integration into world trade."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "Public infrastructure remained an active policy instrument; no claim is made that all announced plans were executed."}
predecessor_movements: [taiwan_lee_teng_hui_democratic_transition_1988_2000]
position_alignments:
  - {position_id: institutionalism, alignment: aligned, notes: "Competitive government and rules-based international integration remained central."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Selective infrastructure and industrial support continued alongside private export production."}
references:
  - "Office of the President, ROC (Taiwan), Chen Shui-bian: https://english.president.gov.tw/Page/87"
  - "WTO, Chinese Taipei membership profile: https://www.wto.org/english/thewto_e/countries_e/chinese_taipei_e.htm"
notes: "Economic direction is coded as a mixed-market continuity rather than a categorical change of regime."
