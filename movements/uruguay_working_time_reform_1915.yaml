movement_id: uruguay_working_time_reform_1915
status: candidate
name: Uruguay working-time reform
countries:
- URY
scope: national
timeframe:
  start: 1915
  end: 1915
doctrine: Law No. 5350, promulgated on 17 November 1915, set an eight-hour daily limit for specified workers
  and employees and a maximum of 48 hours over six working days. It also provided for regulation of daily
  rest periods. The policy describes statutory limits for covered employment, not uniform enforcement
  across every occupation or a measured employment effect.
policies:
- ury_eight_hour_workday_law_1915
axes_summary:
- axis: regulatory.labour_market_flexibility
  direction: '-'
  magnitude: weak
  rationale: The statutory hours limit constrains working-time arrangements for covered employers; the
    direction describes stronger employment protection, not net welfare.
  drift_attribution_year: 1915
  drift_attribution_basis: The documented reform was adopted in 1915; this marks the policy event rather
    than an entire government term.
references:
- 'Uruguay IMPO, Law No. 5350 of 1915: https://www.impo.com.uy/bases/leyes/5350-1915'
notes: A bounded reform episode, not a full governing-era classification. The direction is an interpretation
