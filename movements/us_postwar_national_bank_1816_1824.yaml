# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_postwar_national_bank_1816_1824
status: candidate
name: Postwar national consolidation and Second Bank
countries: [USA]
timeframe: {start: 1816, end: 1824}
coalition: Madison and Monroe administrations with congressional national-bank supporters
leaders:
  - James Madison
  - James Monroe
  - Henry Clay
doctrine: >
  The post-War of 1812 period renewed national institution-building after the
  First Bank's charter lapsed. Congress chartered the Second Bank in 1816 to
  support federal finance and a more uniform currency, while disputes over
  federal power, state sovereignty, and banking continued. This movement
  captures the bank's establishment, not an economy-wide change in public
  spending or market freedom.
policies:
  - us_second_bank_1816
axes_summary:
  - axis: regulatory.financial_deregulation
    direction: "-"
    magnitude: moderate
    rationale: The federal charter restored a national banking institution and fiscal agent, adding a stronger layer of federal financial governance to a state-centered banking system.
    drift_attribution_year: 1816
    drift_attribution_basis: Congress chartered the Second Bank of the United States in 1816.
references:
  - "U.S. Senate Committee on Finance, History: https://www.finance.senate.gov/about/history"
notes: Candidate historical backfill. The Second Bank was a contested federal corporation and fiscal agent, not a modern central bank.
