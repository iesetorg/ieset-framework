# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: australia_hawke_alp_reform_1983_1991
status: candidate
name: Hawke Labor economic opening — dollar float, bank reform, tariff cuts
countries: [AUS]
scope: national
timeframe: {start: 1983, end: 1991}
coalition: Australian Labor Party majority government
leaders:
  - Bob Hawke (Prime Minister 1983-1991)
  - Paul Keating (Treasurer 1983-1991)
doctrine: >
  The Hawke government pursued a more open and competitive Australian economy
  through a negotiated Labor reform programme. It floated the Australian dollar
  and removed most exchange controls in December 1983, relaxed bank deposit
  and lending restrictions in 1984-85, permitted foreign-bank entry in 1985,
  and began a phased reduction in import tariffs in July 1988. These market
  reforms sat alongside the government's Prices and Incomes Accord and social
  wage commitments; the axes below code only the documented financial and
  trade-policy changes within Hawke's 1983-91 term. Keating's 1991-96 reforms
  are represented by a separate successor movement.
policies:
  - australia_hawke_keating_reforms_1983_1996
axes_summary:
  - axis: regulatory.financial_deregulation
    direction: "-"
    magnitude: strong
    drift_attribution_year: 1983
    drift_attribution_basis: The Australian dollar was floated and most exchange controls were removed in December 1983; later bank-entry reforms followed in 1984-85.
    rationale: >
      The Reserve Bank dates the dollar float and abolition of most exchange
      controls to December 1983, removal of remaining deposit controls to
      August 1984, and foreign-bank entry approvals to February 1985.
  - axis: regulatory.trade_openness
    direction: "+"
    magnitude: strong
    drift_attribution_year: 1988
    drift_attribution_basis: >
      The May 1988 Economic Statement announced phased tariff reductions
      beginning 1 July 1988; the Bureau of Industry Economics documents the
      decision and schedule in Monitoring Micro Reform, section 3.2.1.
    rationale: >
      The 1988 tariff programme reduced general protection in annual steps;
      its 1988 announcement is the coded decision year, not a claim that every
      scheduled cut had taken effect immediately.
predecessor_movements: [australia_fraser_liberal_1975_1983]
successor_movements: [australia_keating_alp_1991_1996]
references:
  - "Reserve Bank of Australia, The Australian Dollar: Thirty Years of Floating (2013), https://www.rba.gov.au/speeches/2013/sp-gov-211113.html"
  - "Reserve Bank of Australia, RDP 8904, section 3: The Deregulation of the Early 1980s and Re-Intermediation (1989), https://www.rba.gov.au/publications/rdp/1989/8904/deregulation-of-the-early-1980s-and-re-intermediation.html"
  - "Reserve Bank of Australia, RDP 8807, Appendix I: Some Regulatory Changes Relevant to the Cost of Capital (1988), https://www.rba.gov.au/publications/rdp/1988/8807/appendix-1.html"
  - "Bureau of Industry Economics, Monitoring Micro Reform: Setting the Scene, section 3.2.1 (1996), Productivity Commission archive, https://assets.pc.gov.au/2025-05/96-01.pdf"
notes: >
  This candidate fills the national 1984-90 movement gap. The linked policy
  record is an umbrella spanning Hawke and Keating (1983-96); this movement
  codes only Hawke-era decisions. It does not reuse the policy's later
  central-bank-independence or 1995 competition-policy content.
