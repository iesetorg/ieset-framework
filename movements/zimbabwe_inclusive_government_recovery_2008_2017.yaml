movement_id: zimbabwe_inclusive_government_recovery_2008_2017
status: candidate
name: Inclusive government, dollarisation, and recovery
countries:
- ZWE
timeframe:
  start: 2008
  end: 2016
coalition: Government of National Unity followed by ZANU–PF government
leaders:
- Morgan Tsvangirai
- Robert Mugabe
doctrine: The 2008 power-sharing settlement preceded adoption of a multicurrency system that halted hyperinflation
  and enabled a recovery in transactions and output. Fiscal and monetary room was constrained by dollarisation,
  while the coalition government shared authority until 2013. The period ended with the 2017 change in
  political leadership.
policies:
- zimbabwe_inclusive_government_recovery_2008_2017_policy
axes_summary:
- axis: monetary.monetary_expansion_direction
  direction: '-'
  magnitude: strong
  rationale: Use of foreign currencies sharply constrained domestic money creation and ended hyperinflation.
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  rationale: Multicurrency use facilitated import and payment transactions, though it was not a full trade-policy
    reform.
- axis: institutional.rule_of_law
  direction: +
  magnitude: weak
  rationale: The 2008 power-sharing settlement created a temporary institutional opening; durable constraints
    remained.
references:
- 'IMF, Zimbabwe Article IV consultation (2010): https://www.elibrary.imf.org/view/journals/002/2010/186/article-A001-en.xml'
