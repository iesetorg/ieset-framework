# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: ukraine_wartime_mobilisation_and_recovery_2022_present
status: candidate
name: "Ukraine wartime mobilisation and externally supported recovery"
countries: [UKR]
timeframe: {start: 2022, end: ongoing, enacted_date: "2022-02-24"}
coalition: "Zelensky presidency and Verkhovna Rada under martial law"
leaders:
  - "Volodymyr Zelenskyy (President)"
  - "Denys Shmyhal (Prime Minister through 2025)"
  - "Yuliia Svyrydenko (Prime Minister from 2025)"
policies: [ua_martial_law_wartime_economic_regime_2022]
doctrine: >
  Russia's full-scale invasion led Ukraine to impose martial law and redirect
  government capacity toward defence, public safety, essential services, and
  wartime economic administration. The authorities have paired this emergency
  state role with IMF-supported fiscal, governance, financial-sector, and
  recovery reforms and an EU-accession objective. The trajectory is coded as
  wartime state expansion with stabilisation reforms, not as a settled
  post-war policy model.
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "Martial-law budgets prioritise defence, security, and essential services; the IMF describes the wartime fiscal expansion and elevated financing needs."}
  - {axis: regulatory.sectoral_licensing, direction: "+", magnitude: moderate, rationale: "Martial law expands temporary public powers and restrictions over economic and legal activity."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "Emergency authority restricts some rights, while IMF-supported requirements restore declarations, strengthen anti-corruption institutions, and improve fiscal transparency."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: weak, rationale: "Wartime controls coexist with a longer-term EU accession and recovery orientation; no single uniform trade-policy direction is asserted."}
  - {axis: monetary.central_bank_independence, direction: "mixed", magnitude: moderate, rationale: "Emergency monetary financing and controls initially expanded under war pressure, while later programmes aim to preserve monetary stability and reduce monetary financing."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "The state directs emergency resources and recovery planning, but this reflects wartime necessity rather than a general peacetime development doctrine."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "The programme combines emergency legal authority with governance, transparency, and EU-alignment reforms."}
references:
  - "President of Ukraine, martial law decree signed and approved, 24 February 2022: https://www.president.gov.ua/en/news/prezident-pidpisav-ukaz-pro-zaprovadzhennya-voyennogo-stanu-73109"
  - "Verkhovna Rada, 2022 parliamentary results under martial law: https://www.rada.gov.ua/en/news/News/top_news/231895.html"
  - "IMF, 2023 Extended Fund Facility programme for Ukraine: https://www.imf.org/en/news/articles/2023/06/29/pr23249-ukraine-imf-exec-board-completes-1st-review-eff-arrangement"
  - "IMF, 2026 Extended Fund Facility arrangement: https://www.imf.org/en/news/articles/2026/02/26/pr-26066-ukraine-imf-executive-board-approves-usd-8point1-billion-under-an-eff-arrangement"
notes: "The 2022 start is the dated martial-law decree. The movement describes a wartime policy regime and its reform framework, not the invasion as a domestic political movement or an estimate of policy outcomes."
