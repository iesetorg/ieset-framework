movement_id: ven_perez_government_and_multiple_exchange_rates_1985_1988
status: candidate
name: Venezuela’s exchange controls and late oil-boom adjustment, 1985–1988
countries:
- VEN
timeframe:
  start: 1985
  end: 1988
coalition: Jaime Lusinchi Democratic Action government
leaders:
- Jaime Lusinchi
doctrine: The Lusinchi government maintained price and exchange controls after the 1983 balance-of-payments shock,
  with multiple exchange rates, subsidised credit, and oil-price exposure. The late-1980s system accumulated macroeconomic
  distortions that the incoming 1989 government attempted to address through exchange-rate unification and market-based
  monetary controls.
policies:
- ven_perez_government_and_multiple_exchange_rates_1985_1988_policy
axes_summary:
- axis: regulatory.price_control_intensity
  direction: +
  magnitude: moderate
  rationale: Administrative exchange and price controls remained important.
- axis: fiscal.sectoral_subsidy
  direction: +
  magnitude: moderate
  rationale: Subsidised credit and below-market domestic energy prices supported priority sectors and consumers.
- axis: monetary.monetary_expansion_direction
  direction: +
  magnitude: weak
  rationale: Fiscal and monetary policy remained vulnerable to oil revenue and exchange-rate pressures.
