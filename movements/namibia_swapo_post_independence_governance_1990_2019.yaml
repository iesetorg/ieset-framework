movement_id: namibia_swapo_post_independence_governance_1990_2019
status: candidate
name: SWAPO-led post-independence government
countries: [NAM]
timeframe: {start: 1990, end: 2019}
coalition: SWAPO-led governments
leaders: ["Sam Nujoma (President, 1990-2005)", "Hifikepunye Pohamba (President, 2005-2015)", "Hage Geingob (President, 2015-2019)"]
doctrine: >
  Following independence in 1990, SWAPO governed within a multiparty
  constitutional republic and pursued national reconciliation, expanded access
  to education, health, and infrastructure, and gradual land reform. The
  constitution protected private property while permitting public-interest
  expropriation with compensation. The inherited economy remained highly
  unequal, so this period is best described as a mixed market economy with an
  active developmental state rather than an economy-wide nationalisation
  programme.
policies: [namibia_independence_constitution_1990]
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: moderate, drift_attribution_year: 1990, drift_attribution_basis: "The post-independence government expanded public education, health, housing, and water services from racially restricted provision, documented by the World Bank."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: moderate, drift_attribution_year: 1990, drift_attribution_basis: "The 1990 Constitution established a multiparty republic and a rights-based constitutional framework at independence."}
references:
