  or growth effect.
policies:
- lso_central_bank_autonomy_act_2000
axes_summary:
- axis: monetary.central_bank_independence
  direction: +
  magnitude: weak
  rationale: The bank's historical account explicitly reports greater autonomy under the 2000 Act; this
    is de jure institutional coding only.
  drift_attribution_year: 2000
  drift_attribution_basis: The documented reform was adopted in 2000; this marks the policy event rather
    than an entire government term.
references:
- 'Central Bank of Lesotho, Background: https://centralbank.org.ls/background/'
notes: A bounded reform episode, not a full governing-era classification. The direction is an interpretation
