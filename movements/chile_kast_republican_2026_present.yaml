# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: chile_kast_republican_2026_present
status: candidate
name: "Kast Republican emergency government (Chile, 2026-present)"
countries: [CHL]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-03-11"
coalition: "Jose Antonio Kast-aligned Republican right with Chile Vamos and independent technocrats; minority/coalition bargaining in Congress"
leaders:
  - "Jose Antonio Kast (President, from 11 March 2026)"
  - "Jorge Quiroz (Finance Minister)"
  - "Claudio Alvarado (Interior Minister)"
doctrine: >
  Right-wing national-conservative government elected in the December
  2025 runoff against Jeannette Jara and inaugurated on 11 March 2026.
  Stated doctrine is an "emergency government" centred on security,
  irregular-migration control, administrative austerity, faster growth,
  and rollback/review of late-Boric regulatory commitments. Early policy
  content includes a cross-ministry 3 percent spending cut plan framed as
  a US$6bn fiscal adjustment, a hard-border "Plan Escudo Fronterizo",
  accelerated deportation and exclusion-zone measures for irregular
  migrants, review/withdrawal of pending decrees from the previous
  administration, and a pro-investment tax/regulatory posture constrained
  by a divided Congress.
policies:
  - cl_kast_fiscal_adjustment_plan_2026
  - cl_plan_escudo_fronterizo_2026
  - cl_kast_pending_decree_review_2026
axes_summary:
  - {axis: fiscal.spending_level, direction: "-", magnitude: moderate, rationale: "Finance Ministry announced a broad ministry-budget reduction plan soon after inauguration."}
  - {axis: fiscal.tax_corporate, direction: "-", magnitude: weak, rationale: "Campaign and early governing posture point toward business-tax relief, though major legislation remains pending."}
  - {axis: regulatory.immigration_openness, direction: "-", magnitude: strong, rationale: "Border Shield plan and immediate-deportation rhetoric materially tighten irregular-migration treatment."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Pro-investment deregulation and review of pending Boric decrees tilt toward lower entry/regulatory burdens, pending enactment."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Security-first agenda raises civil-liberties scrutiny while operating through formal executive and congressional channels."}
predecessor_movements:
  - chile_boric_ad_2022_present
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Fiscal restraint and deregulation align; hard security and migration posture is outside the economic school core."}
  - {position_id: ordoliberal, alignment: partially_aligned, notes: "Law-and-order and fiscal discipline rhetoric align, but institutional/civil-liberty effects require review."}
  - {position_id: social_democratic, alignment: opposed}
references:
  - "2025 Chilean presidential runoff: Kast defeated Jeannette Jara and took office 11 March 2026."
  - "El Pais Chile, 11 March 2026, cabinet and inauguration reporting."
  - "Guardian, 15 December 2025, Kast election and 11 March 2026 handover."
  - "Chilevision / Chilean press, March 2026, Plan Escudo Fronterizo and MEPCO/fiscal adjustment coverage."
notes: >
  Candidate-coded because only the first months of governing content are
  observable as of 4 July 2026. The atlas is year-granular, so the movement
  starts in 2026 while enacted_date records the March handover.
