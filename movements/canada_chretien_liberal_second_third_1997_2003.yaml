notes: >
  Second and third majority terms combined; covers sponsorship-era trigger but
  scandal crystallised under Martin. The FY1997-98 balanced budget and falling
  debt ratio were outcomes of the earlier Program Review and transfer decisions,
  already attributed to the first Chrétien term in 1995 and 1996; they are not
  a second fiscal.spending_level decision in 1997.
