# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: bulgaria_radev_progressive_bulgaria_2026_present
status: candidate
name: "Radev Progressive Bulgaria majority government (Bulgaria, 2026-present)"
countries: [BGR]
timeframe:
  start: 2026
  end: ongoing
  enacted_date: "2026-05-08"
coalition: "Progressive Bulgaria single-party/coalition parliamentary majority"
leaders:
  - "Rumen Radev (Prime Minister, from 8 May 2026)"
  - "Iliana Iotova (President)"
doctrine: >
  Former president Rumen Radev's Progressive Bulgaria government formed
  after the April 2026 snap election, ending the caretaker/fragmentation
  cycle with an outright parliamentary majority. The programme combines
  anti-corruption and prosecutorial reform rhetoric with a more nationalist
  and Russia-accommodating foreign-policy posture than the preceding
  pro-Schengen/reform coalitions. Bulgaria remains in the EU, NATO, and
  eurozone, but the new government may challenge EU sanctions and Ukraine
  support lines while pursuing domestic judicial reforms.
policies:
  - bg_radev_anticorruption_judicial_package_2026
  - bg_radev_russia_eu_rebalance_2026
  - bg_progressive_bulgaria_majority_program_2026
axes_summary:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "Anti-corruption/judicial-reform mandate is positive, but foreign-influence and majoritarian risks require review."}
  - {axis: institutional.judicial_independence, direction: "+", magnitude: weak, rationale: "Prosecutorial reform and resignation pressure on compromised officials point positive if enacted."}
  - {axis: regulatory.trade_openness, direction: "mixed", magnitude: weak, rationale: "EU/eurozone membership remains, while Russia-accommodating posture could create EU-policy frictions."}
  - {axis: regulatory.energy_supply_security, direction: "mixed", magnitude: weak, rationale: "Potential Russian-energy accommodation may reduce short-run price pressure but increase supplier/geopolitical exposure."}
predecessor_movements:
  - bulgaria_rule_of_law_schengen_push_2023_present
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned}
  - {position_id: developmentalism, alignment: partially_aligned}
  - {position_id: ordoliberal, alignment: opposed, notes: "Foreign-policy and EU-rule tensions limit alignment despite reform rhetoric."}
references:
  - "2026 Bulgarian parliamentary election: Progressive Bulgaria won a parliamentary majority."
  - "El Pais, 19 April 2026, Radev victory and prime-minister path."
  - "Le Monde, 20 April 2026, former president wins parliamentary majority."
  - "National Assembly elected Radev cabinet on 8 May 2026."
notes: >
  Candidate-coded because the Radev government is weeks old in the July 2026
  audit window. This adds a current executive movement while leaving the
  Schengen/rule-of-law policy-continuity entry in place for its own policy
  surface.
