doctrine: After independence, Banda consolidated a one-party authoritarian system and concentrated political
  authority in the presidency. The state directed important parts of the formal economy and agricultural
  marketing, while private enterprise and estate agriculture remained present. This is a mixed state-directed
  market order, not a claim that Malawi had a fully state-owned economy.
