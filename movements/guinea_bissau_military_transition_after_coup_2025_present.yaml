# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: guinea_bissau_military_transition_after_coup_2025_present
status: candidate
name: Guinea-Bissau military transition after the November 2025 coup
countries: [GNB]
timeframe: {start: 2025, end: ongoing, enacted_date: "2025-11-26"}
coalition: Military leadership and transitional authorities
leaders: [Horta N'Tam]
policies: [gnb_military_takeover_and_transition_2025]
doctrine: >
  Military officers seized power after the November 2025 elections and
  announced a transition programme, interrupting the electoral process. The
  military authorities' programme has been rejected by ECOWAS, which called for
  constitutional order to be restored; regional stabilisation forces remained
  deployed in 2026.
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "The coup interrupted the election result and constitutional transfer of authority; ECOWAS rejected the military's transition programme."}
references:
  - "UN Secretary-General, statement on Guinea-Bissau, 27 November 2025: https://www.un.org/sg/en/content/sg/statements/2025-11-27/statement-attributable-the-spokesperson-for-the-secretary-general-guinea-bissau"
  - "ECOWAS, 68th Summit communiqué, 14 December 2025: https://www.ecowas.int/ecowas-heads-of-state-reaffirm-commitment-to-democracy-peace-and-regional-stability-at-their-68th-summit-in-abuja/"
  - "ECOWAS, Stabilization Support Mission in Guinea-Bissau, 3 August 2026: https://www.ecowas.int/handing-and-taking-over-ceremony-between-the-commanding-officers-of-nigerian-company-4-and-nigerian-company-5-essmgb/"
notes: "The coup and ongoing transition are coded as institutional changes. No economic policy direction is inferred without reliable primary evidence."
