# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: uk_wartime_planning_and_interwar_adjustment_1915_1944
status: candidate
name: United Kingdom wartime controls, interwar adjustment, and mobilisation
countries: [GBR]
timeframe: {start: 1915, end: 1944}
coalition: "Successive Liberal, Conservative, Labour, National, and wartime coalition governments"
leaders: ["David Lloyd George (Prime Minister, 1916–1922)", "Ramsay MacDonald (Prime Minister, 1924 and 1929–1935)", "Neville Chamberlain (Prime Minister, 1937–1940)", "Winston Churchill (Prime Minister from 1940)"]
doctrine: >
  The UK moved between large wartime controls, interwar fiscal and monetary adjustment,
  and renewed state-directed mobilisation. The First World War expanded procurement
  and control of labour and production. The 1920s restored market coordination but
  included deflation, industrial conflict, and weak growth; the 1930s saw uneven public
  intervention. From 1939, coalition government again directed labour, materials, and
  production on a national scale. This entry records the pre-1945 sequence as a period
  of recurrent state expansion and retrenchment, not a single continuous doctrine.
policies: [uk_wartime_controls_interwar_adjustment_1915]
axes_summary:
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: strong, rationale: "Major wartime expenditure and controls alternated with post-war fiscal retrenchment and interwar adjustment."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: moderate, rationale: "War controls and industrial coordination repeatedly displaced ordinary market allocation, while controls eased between wars."}
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: weak, rationale: "Parliamentary institutions persisted while emergency wartime powers expanded executive authority."}
predecessor_movements: [uk_new_liberalism_1906_1914]
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "State capacity and public coordination expanded during war, then receded unevenly in peacetime."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private markets remained dominant between wars despite repeated periods of controls and public coordination."}
references:
  - "UK Parliament, post-war consensus and nationalisation chronology: https://researchbriefings.files.parliament.uk/documents/RP14-61/RP14-61.pdf"
  - "UK Parliament, Post-War Reconstruction debate (1943): https://hansard.parliament.uk/commons/1943-12-07/debates/25243630-b603-45f3-a497-bd715cce0ea9/Post-WarReconstruction"
notes: "Broad coverage is split from the 1945–1951 Attlee movement and the 1945–1979 post-war ownership settlement; start-year proxy means it does not encode every reversal in between."
