# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: germany_allied_occupation_and_diverging_economic_systems_1945_1947
status: candidate
name: Germany Allied occupation, demilitarisation, and emerging economic division
countries: [DEU]
timeframe: {start: 1945, end: 1947}
coalition: "Allied Control Council and occupation administrations"
leaders: ["Allied occupation authorities in the US, British, French, and Soviet zones"]
doctrine: >
  After military defeat, the occupying powers dismantled Nazi institutions and pursued
  demilitarisation, reparations, denazification, and economic reconstruction. The
  economy remained rationed and heavily controlled. Different approaches to ownership,
  planning, currency, and reconstruction emerged between the Soviet zone and western
  occupation zones, setting the stage for separate German states and economic systems.
policies: [deu_allied_occupation_economic_reconstruction_1945]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "mixed", magnitude: moderate, rationale: "The dictatorship was dismantled, but sovereign German democratic institutions had not yet been restored."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Occupation authorities directed reconstruction, reparations, and the allocation of scarce resources."}
  - {axis: regulatory.product_market_competition, direction: "mixed", magnitude: moderate, rationale: "Rationing and controls persisted as western and Soviet-zone economic structures diverged."}
predecessor_movements: [germany_nazi_dictatorship_war_economy_1933_1945]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "Denazification and reconstruction prepared democratic institutions, but occupation administration temporarily replaced sovereign government."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Authorities directed reconstruction and resource allocation, with different models emerging by zone."}
references:
  - "German Federal Agency for Civic Education, German economic development 1945–1949: https://www.bpb.de/shop/zeitschriften/izpb/deutschland-1945-1949-259/10077/wirtschaftsentwicklung-von-1945-bis-1949/"
  - "German Federal Agency for Civic Education, from surrender to two states, 1945–1949: https://www.bpb.de/shop/zeitschriften/izpb/548470/von-der-kapitulation-zur-doppelten-staatsgruendung-1945-1949/"
notes: "This short transitional record bridges to the existing West German Social Market Economy movement beginning in 1948."
