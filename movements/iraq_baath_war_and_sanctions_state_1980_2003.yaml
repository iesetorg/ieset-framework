# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: iraq_baath_war_and_sanctions_state_1980_2003
status: candidate
name: "Late Ba'athist state, war economy, and sanctions"
countries: [IRQ]
timeframe: {start: 1980, end: 2003}
coalition: "Ba'ath Party government"
leaders: ["Saddam Hussein"]
doctrine: >
  Late Ba'athist Iraq retained a highly centralized, oil-financed state with
  extensive ownership and planning. The Iran-Iraq war, invasion of Kuwait, and
  ensuing international sanctions radically altered material conditions and
  constrained trade. The drift coding separates the regime's statist economic
  organization from the sanctions environment imposed by the UN system.
policies: [irq_baath_state_control_and_sanctions_1980]
axes_summary:
  - {axis: institutional.property_rights, direction: "-", magnitude: strong, rationale: "The government maintained extensive state ownership over oil, industry, and other productive assets."}
  - {axis: regulatory.product_market_competition, direction: "-", magnitude: strong, rationale: "Central planning and state control limited private competition and market allocation."}
  - {axis: regulatory.trade_openness, direction: "-", magnitude: strong, rationale: "International sanctions constrained trade from 1990 to 2003; this external condition is not coded as an Iraqi government choice."}
position_alignments:
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Oil-funded state ownership and centralized planning sought national development but operated under authoritarian control and prolonged war."}
  - {position_id: marxist_leninist, alignment: partially_aligned, notes: "Ba'athist rule used state planning and ownership but was Arab nationalist and not identical to a Marxist-Leninist party state."}
references:
  - "World Bank, Transition to the Market in a Post-Conflict State: Iraq: https://documents1.worldbank.org/curated/en/386761468253198087/pdf/284250English0Transition014014161.pdf"
  - "IMF, Iraq Macroeconomic Assessment: https://www.imf.org/external/np/oth/102103.htm"
notes: "The 1990-2003 sanctions are external conditions, not attributed to Baghdad as a policy preference."
