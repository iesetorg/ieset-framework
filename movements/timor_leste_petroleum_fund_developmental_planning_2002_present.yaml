# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: timor_leste_petroleum_fund_developmental_planning_2002_present
status: candidate
name: "Timor-Leste petroleum-funded state-building and development planning"
countries: [TLS]
timeframe: {start: 2002, end: ongoing}
coalition: "Successive constitutional governments of independent Timor-Leste"
leaders:
  - "Kay Rala Xanana Gusmão (Prime Minister in 2007–2015 and from 2023)"
  - "Successive constitutional prime ministers and governing coalitions"
policies: [tls_ninth_government_productive_sector_social_capital_2023]
doctrine: >
  Since independence, successive governments have used petroleum revenues and
  the Petroleum Fund to finance state-building, infrastructure, social
  capital, and economic diversification. The 2011 Strategic Development Plan
  set a long-term public-investment framework and the 2023–2024 government
  programme renewed emphasis on productive sectors and social capital. The
  2027–2030 medium-term plan continues the diversification, infrastructure,
  and institutional-development model. The movement represents a durable
  cross-government governing orientation, not one uninterrupted party
  administration; high petroleum-fund withdrawals and budget execution risks
  complicate the sustainability of this model.
axes_summary:
  - {axis: fiscal.spending_level, direction: "+", magnitude: strong, rationale: "Petroleum revenues have financed repeated large public budgets and infrastructure programmes, with withdrawals frequently above the long-term sustainable-income benchmark."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Government plans direct public investment toward infrastructure, agriculture, tourism, petroleum-linked activity, and other productive sectors."}
  - {axis: institutional.property_rights, direction: "mixed", magnitude: weak, rationale: "The state retains ownership and commercial roles in strategic petroleum and utility enterprises while also seeking private investment and jobs."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Current plans seek private-sector job creation and a broader productive economy, but state funding and public investment remain central."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "The Petroleum Fund's legal and audited framework formalises intergenerational stewardship, while withdrawals and expenditure sustainability remain contested policy issues."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The state channels resource rents through long-term plans and public investment to build infrastructure and diversify productive sectors."}
  - {position_id: institutionalism, alignment: partially_aligned, notes: "A statutory, audited sovereign fund anchors resource governance, while fiscal sustainability depends on budget and withdrawal discipline."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Private-sector growth is a stated goal, but the state remains the principal investor and petroleum rent allocator."}
references:
  - "Government of Timor-Leste, Strategic Development Plan 2011–2030: https://timor-leste.gov.tl/?lang=en&p=2696"
  - "Government of Timor-Leste, 9th Constitutional Government Programme: https://timor-leste.gov.tl/?lang=en&p=7213"
  - "Government of Timor-Leste, 2024 General State Budget investment priorities: https://timor-leste.gov.tl/?lang=en&n=1&p=35468"
  - "Government of Timor-Leste, National Medium-Term Plan 2027–2030, launched 1 October 2026: https://timor-leste.gov.tl/?lang=en&n=1&p=52465"
notes: "Uses independence in 2002 as the state-building start and subsequent cross-party development planning as a continuity episode. Public-plan targets are not coded as realised outcomes. The timeframe is broad and should be subdivided when evidence supports distinct changes in policy direction."
