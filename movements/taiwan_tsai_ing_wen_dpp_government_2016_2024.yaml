# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: taiwan_tsai_ing_wen_dpp_government_2016_2024
status: candidate
name: Taiwan Tsai Ing-wen DPP government and strategic industrial policy
countries: [TWN]
timeframe: {start: 2016, end: 2024}
coalition: "Democratic Progressive Party (DPP) government"
leaders: ["Tsai Ing-wen (President, 2016–2024)"]
doctrine: >
  Tsai's two terms maintained a competitive market economy and democratic institutions
  while increasing strategic industrial policy around semiconductors, digital sectors,
  and energy transition. The New Southbound Policy diversified regional engagement;
  the 2017–2024 Forward-looking Infrastructure Development Program funded selected
  transport, digital, water, and green-energy projects. Support for industry and
  infrastructure expanded, but private firms remained central to production and export.
policies: [tw_forward_looking_infrastructure_2017]
axes_summary:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: moderate, rationale: "Industrial innovation and targeted infrastructure programs directed public support toward strategic sectors."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "Multi-year infrastructure appropriations expanded selected public investment."}
  - {axis: regulatory.trade_openness, direction: "+", magnitude: weak, rationale: "External diversification and continued supply-chain integration supported market access."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Competitive elections and peaceful party alternation continued."}
predecessor_movements: [taiwan_ma_ying_jeou_cross_strait_integration_2008_2016]
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Semiconductor capability, industrial innovation, and public infrastructure remained deliberate state priorities."}
  - {position_id: empirical_pragmatist, alignment: partially_aligned, notes: "Market production and export competition remained central while government targeted strategic externalities."}
references:
  - "Taiwan Executive Yuan, Forward-looking Infrastructure Development Program: https://english.ey.gov.tw/Page/61BF20C3E89B856/e7169ec6-f889-48d0-82ea-04bc0f001712"
  - "Taiwan Ministry of Economic Affairs, Five Plus Two Industrial Innovation Plan: https://www.moea.gov.tw/MNS/english/Policy/Policy.aspx?menu_id=32904&policy_id=13"
notes: "The 2016–2024 interval covers the Tsai administrations; Lai's administration is already represented separately from May 2024."
