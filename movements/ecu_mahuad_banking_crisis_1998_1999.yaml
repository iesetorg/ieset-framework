  direction: +
  magnitude: moderate
  rationale: Bank rescues and fiscal pressures intensified monetary and exchange-rate instability.
- axis: regulatory.financial_deregulation
  direction: '-'
  magnitude: moderate
  rationale: Bank intervention and emergency controls followed a supervisory and banking crisis.
