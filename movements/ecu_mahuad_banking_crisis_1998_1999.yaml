doctrine: The 1998–99 banking and currency crisis followed El Niño shocks, weak supervision, and fiscal pressures.
  The government froze deposits and intervened in banks, while a sharp depreciation and recession culminated in
  dollarisation legislation in March 2000. The span records crisis management before the formal currency change.
