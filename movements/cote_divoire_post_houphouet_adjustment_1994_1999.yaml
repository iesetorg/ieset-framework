# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: cote_divoire_post_houphouet_adjustment_1994_1999
status: candidate
name: Bédié-era CFA adjustment and export recovery
countries: [CIV]
timeframe: {start: 1994, end: 1998}
coalition: PDCI government under Henri Konan Bédié
leaders: [Henri Konan Bédié]
doctrine: >
  After Félix Houphouët-Boigny's death in 1993, the Bédié government inherited
  severe fiscal and external pressures. The 1994 CFA franc devaluation was
  accompanied by structural adjustment and renewed export growth, while
  privatisation and trade reforms sought to attract investment. Political
  contestation grew around citizenship, land access, and exclusionary
  Ivoirité, contributing to instability before the 1999 coup.
policies: [cote_divoire_post_houphouet_adjustment_1994_1999_policy]
axes_summary:
  - {axis: regulatory.trade_openness, direction: +, magnitude: moderate, rationale: Exchange-rate adjustment and structural reforms supported export competitiveness and market access.}
  - {axis: institutional.rule_of_law, direction: "-", magnitude: weak, rationale: Political exclusion and rising contestation weakened the inclusion and stability of formal institutions.}
references:
  - "UN MINUCI background: https://peacekeeping.un.org/sites/default/files/past/minuci/background.html"
  - "World Bank, Côte d'Ivoire country economic strategy: https://documents1.worldbank.org/curated/en/751081468261264291/pdf/625720P10958500rces0of0Growth0Engl.pdf"
  - "World Bank, Côte d'Ivoire 2021–2030 Country Economic Memorandum: https://documents1.worldbank.org/curated/en/232621635224063141/pdf/P172646-8cc6a128-c95f-45cb-b9f3-06ce211eff15.pdf"
notes: "This period contains both macroeconomic adjustment and growing political exclusion; neither is treated as a simple market-versus-state shift."
