# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: senegal_sall_emerging_senegal_plan_2012_2024
status: candidate
name: "Sall government and Plan Sénégal Émergent"
countries: [SEN]
timeframe: {start: 2012, end: 2024}
coalition: "Benno Bokk Yakaar coalition"
leaders: ["Macky Sall"]
doctrine: >
  The Sall administration adopted the Plan Sénégal Émergent as a long-term
  framework combining structural economic transformation, social services and
  protection, sustainable development, and governance. Its priority plans
  coordinated public investment, while the framework also sought private
  investment and growth. This codes the government's stated direction rather
  than treating announced targets as achieved outcomes.
policies: [sn_plan_senegal_emergent_2014]
axes_summary:
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "The plan directs coordination toward priority sectors without specifying a measurable net subsidy increase."}
  - {axis: fiscal.spending_level, direction: "+", magnitude: weak, rationale: "Priority action plans coordinate investment and social services; no net spending outcome is assumed."}
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "Governance and institutional strengthening are explicit pillars."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "Long-term national planning and coordinated sectoral investment are central instruments."}
  - {position_id: social_democracy, alignment: partially_aligned, notes: "Social-service expansion is a stated pillar, though the framework alone does not establish a particular welfare regime."}
references:
  - "World Bank, Senegal Country Partnership Framework FY20-FY24: https://documents1.worldbank.org/curated/en/608781583719225540/pdf/Senegal-Country-Partnership-Framework-for-the-Period-FY20-FY24.pdf"
notes: "The 2024 transition to the Faye/PASTEF government is represented by a separate movement record."
