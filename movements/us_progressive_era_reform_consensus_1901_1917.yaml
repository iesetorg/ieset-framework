notes: >
  Historical umbrella covering 1901–1917. The four signed axis decisions
  occur in 1913 and 1914. The 1906 food/drug and railroad laws remain
  linked policy records, but neither warrants a sectoral-entry-licensing
  score under the present taxonomy. These are constructed legal-decision
  steps, not measured policy effects.
