# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: us_progressive_era_reform_consensus_1901_1917
status: candidate
name: "US Progressive Era reform consensus"
countries: [USA]
timeframe: {start: 1901, end: 1917}
coalition: "Republican progressives under Roosevelt and Taft, followed by Wilsonian Democrats sharing administrative-state reform goals"
leaders:
  - "Theodore Roosevelt (President 1901-1909)"
  - "William Howard Taft (President 1909-1913)"
  - "Woodrow Wilson (President 1913-1921; prewar Progressive phase through 1917)"
  - "Robert M. La Follette (Progressive Republican organiser)"
  - "Louis Brandeis (anti-monopoly reform advocate; Supreme Court from 1916)"
doctrine: >
  The Progressive Era reform consensus aimed to replace late-Gilded-Age patronage,
  railroad concentration, financial fragility, and weak consumer protection with a
  more capable federal state. Across Roosevelt, Taft, and Wilson, the common thread
  was not party continuity but administrative reform: stronger federal oversight of
  rail and food/drug markets, anti-monopoly enforcement, a modern central-bank and
  payments architecture, and a new fiscal base through the federal income tax. The
  proponent case was that industrial capitalism had outgrown the 19th-century state,
  so competition and liberty now required public rules, expert administration, and
  national coordinating institutions rather than laissez-faire abstention.
policies:
  - us_pure_food_drug_act_1906
  - us_hepburn_act_1906
  - us_federal_reserve_act_1913
  - us_16th_amendment_income_tax_1913
  - us_ftc_clayton_competition_package_1914
axes_summary:
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, drift_attribution_year: 1914, drift_attribution_basis: "Federal Trade Commission Act signed 26 September 1914 (FTC); Clayton Antitrust Act enacted 15 October 1914 (FTC). This codes the statutory package, not later competitive outcomes.", rationale: "FTC + Clayton package strengthened anti-monopoly enforcement even as some sectoral regulation became more rule-bound."}
  - {axis: regulatory.financial_deregulation, direction: "+", magnitude: moderate, drift_attribution_year: 1913, drift_attribution_basis: "Federal Reserve Act signed 23 December 1913 (Federal Reserve History); the Reserve Banks opened in November 1914. This codes enactment, not full operation.", rationale: "Federal Reserve creation regularised reserve management and crisis response relative to the fragmented National Banking era."}
  - {axis: monetary.central_bank_independence, direction: "+", magnitude: moderate, drift_attribution_year: 1913, drift_attribution_basis: "Federal Reserve Act signed 23 December 1913 (Federal Reserve History); initial independence was partial because Treasury officials served on the Board (Federal Reserve Board history). This codes the legal institution, not later de facto independence.", rationale: "Federal Reserve System created a more autonomous monetary authority than ad hoc Treasury-centered crisis management, though independence remained partial."}
  - {axis: fiscal.tax_progressivity, direction: "+", magnitude: strong, drift_attribution_year: 1913, drift_attribution_basis: "Sixteenth Amendment ratified 3 February 1913 (National Archives); graduated federal income tax enacted 3 October 1913 (IRS). This codes legal adoption, not tax incidence.", rationale: "The 16th Amendment and 1913 income tax created a durable progressive federal-revenue instrument."}
position_alignments:
- position_id: institutionalism
  alignment: aligned
  notes: The Progressive Era built regulatory agencies, antitrust enforcement, public administration, and rule systems to discipline concentrated economic power.
- position_id: empirical_pragmatist
  alignment: partially_aligned
  notes: Expert commissions, experimentation, and evidence-oriented administration overlapped strongly with empirical-pragmatist method.
- position_id: ordoliberal
  alignment: partially_aligned
  notes: Antitrust and rule-bound competition goals resemble ordoliberal concerns, though the movement was American progressive rather than German ordoliberal.
- position_id: classical_liberal
  alignment: partially_aligned
  notes: Reformers often aimed to preserve competitive markets against monopoly, while accepting a much larger regulatory state than classical liberalism prefers.

