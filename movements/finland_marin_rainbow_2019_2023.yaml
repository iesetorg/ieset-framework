notes: >
  Coded from Rinne cabinet formation (June 2019) through Marin premiership
  to April 2023 defeat; the Rinne-to-Marin transition is treated as
  intra-movement continuity since the coalition composition and programme
  were unchanged. NATO accession is coded here (application, ratification
  trajectory under Marin) with formal accession on 4 April 2023, while Marin
  still held office. Orpo's government was appointed on 20 June 2023. Review
  any duplicate policy link in the Orpo movement before scoring it again.
