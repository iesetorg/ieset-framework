movement_id: omn_qaboos_state_formation_oil_development_1970_2019
status: candidate
name: Oman’s Qaboos-era state-building and oil-financed development, 1970–2019
countries:
- OMN
timeframe:
  start: 1970
  end: 2019
coalition: Sultan Qaboos bin Said government
leaders:
- Sultan Qaboos bin Said
doctrine: Qaboos’s accession in 1970 began a long state-building and development period. Petroleum revenues financed
  roads, schools, health services, utilities, and administrative institutions, while the government preserved an
  open-door trade and labour system and gradually developed non-oil activity. This period ends at the 2020 succession
  to Sultan Haitham.
policies:
- omn_qaboos_state_formation_oil_development_1970_2019_policy
axes_summary:
- axis: fiscal.spending_level
  direction: +
  magnitude: strong
  rationale: Oil revenues financed large-scale public infrastructure and social services.
- axis: regulatory.trade_openness
  direction: +
  magnitude: weak
  rationale: The state development model retained an open trade and payments system and foreign labour access.
- axis: regulatory.product_market_competition
  direction: mixed
  magnitude: weak
  rationale: Private activity and non-oil sectors grew alongside state-led development and hydrocarbon ownership.
references:
- 'IMF Oman Beyond the Oil Horizon; IMF Finance & Development on Oman: https://www.elibrary.imf.org/abstract/book/9781557758330/ch01.xml'
- 'IMF Oman Beyond the Oil Horizon; IMF Finance & Development on Oman: https://www.elibrary.imf.org/view/journals/023/0030/015/article-A007-en.xml'
notes: Candidate historical backfill based on the cited institutional analysis; boundaries are periodisation choices
  for source review, not a claim that national policy was uniform throughout the interval.
