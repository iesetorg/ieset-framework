# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: laos_recovery_and_regional_integration_1998_2010
status: candidate
name: Lao PDR post-crisis recovery and regional market integration
countries: [LAO]
timeframe: {start: 1998, end: 2010}
coalition: "Lao People's Revolutionary Party government"
leaders: ["Khamtai Siphandone (President, 1998–2006)", "Choummaly Sayasone (President from 2006)"]
doctrine: >
  After the late-1990s regional crisis slowed reforms, the government resumed market
  transition through exchange-rate and fiscal reforms, state-enterprise restructuring,
  regional trade integration, and efforts to attract foreign investment. The Lao PDR
  joined ASEAN in 1997 and the WTO in 2013 (after this period). The government retained
  one-party rule and substantial state planning; hydropower and natural resources grew
  in importance as investment and export sectors.
policies: [lao_market_recovery_and_regional_integration_2000]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: moderate, rationale: "Resumed reforms and regional integration expanded trade and investment links."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "Enterprise reform continued unevenly after the Asian crisis."}
  - {axis: fiscal.sectoral_subsidy, direction: "+", magnitude: weak, rationale: "The state retained planning authority and directed infrastructure and resource-sector development."}
position_alignments:
  - {position_id: developmentalism, alignment: aligned, notes: "The party-state used planning and infrastructure to direct resource-led development."}
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Trade and private investment grew within a party-led system with substantial state direction."}
predecessor_movements: [laos_new_economic_mechanism_transition_1987_1997]
references:
  - "World Bank, Lao PDR Economic Reforms Completed to Date: https://documents1.worldbank.org/curated/en/507991468090580507/pdf/multi-page.pdf"
  - "World Bank, Third Structural Adjustment Credit completion report: https://documents1.worldbank.org/curated/en/120551468300561706/pdf/multi-page.pdf"
notes: "The 1998–2010 interval captures post-crisis resumed reforms and investment-led integration; exact measures are individually dated in linked and reference records."
