# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: slovakia_fico_smer_first_term_2006_2010
status: candidate
name: "Fico Smer first-term euro-adoption social democracy 2006-2010"
countries: [SVK]
timeframe: {start: 2006, end: 2010, enacted_date: "2006-07-04"}
coalition: "Smer-SD - SNS - LS-HZDS"
leaders:
  - "Robert Fico (Prime Minister, Smer-SD, 2006-2010)"
  - "Jan Pociatek (Finance Minister, Smer, 2006-2010)"
  - "Jan Slota (SNS leader, coalition partner)"
  - "Vladimir Meciar (HZDS leader, coalition partner)"
doctrine: >
  Fico Smer first-term — populist-left reversal of parts of the Dzurinda
  agenda but retention of the flat tax and euro-adoption path.
  Economic school: Slovak social-populist — set outpatient and certain inpatient
  patient charges to zero (Sep 2006), renationalised elements of health
  insurance (public insurer monopoly path, partially), introduced 13th and 14th-month
  pension indexation tweaks, but kept 19% flat tax through most of the
  term. Left-right axis: centre-left with national-populist coalition
  partners (SNS, HZDS). Dated policies: euro adoption 1 January 2009
  (ERM-II entered Nov 2005, conversion rate 30.126 SKK/EUR set July
  2008), patient-fee waiver 1 September 2006, global financial
  crisis response (scrappage scheme, employment subsidies 2009).
  Popularity: Smer became dominant party (29.1% 2006, 34.8% 2010 but
  lost coalition math). Coherence: moderate — SNS/HZDS drag but Fico
  personally dominant.
policies:
  - sk_euro_adoption_2009
  - sk_healthcare_user_fee_abolition_2006
  - sk_crisis_scrappage_scheme_2009
predecessor_movements: [slovakia_dzurinda_sdku_1998_2006]
references:
  - "Council Decision 2008/608/EC of 8 July 2008: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32008D0608"
  - "Government Regulation 485/2006 on patient fees: https://static.slov-lex.sk/static/SK/ZZ/2006/485/20060901.print.html"
notes: >
  No movement-level axis step is scored here. Euro adoption is a currency-regime
  change rather than a trade-policy or measured CBI change; the 2006 patient-fee
  waiver is outside the cash/near-cash transfer axis. Retention of the earlier
  flat personal-income-tax schedule is not a new scored decision. The 2009
  crisis-scrappage child remains a separate policy requiring source and event-year
  review before it can be added to country drift. Earlier mechanical
  position-alignment scores were derived entirely from the withdrawn axis
  summary and are withheld pending independently supported coding.
