# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: afg_mujahideen_and_first_emirate_1992_2001
status: candidate
name: Civil war and first Taliban Emirate
countries: [AFG]
timeframe: {start: 1992, end: 2000}
coalition: Mujahideen factions followed by Taliban authorities
leaders: [Burhanuddin Rabbani, Mohammad Omar]
doctrine: >
  Following the collapse of the PDPA government in 1992, competing Mujahideen
  factions formed a fragile Islamic State, then fought for control in a civil
  war. The Taliban took Kabul in 1996 and imposed a highly centralised Islamic
  Emirate, while large regions remained contested. State institutions,
  property protection, public services, and market regulation were fragmented
  by conflict and restrictive social rules.
policies: [afg_mujahideen_and_first_emirate_1992_2001_policy]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, rationale: "State authority was contested through civil war and the Taliban emirate imposed rule outside the prior constitutional order."}
  - {axis: institutional.property_rights, direction: "-", magnitude: moderate, rationale: "Conflict, weak formal institutions, and fragmented authority undermined consistent property enforcement."}
references:
  - "World Bank, Afghanistan economic development from 2001 to 2021: https://thedocs.worldbank.org/en/doc/5f01165822f3639224e0d483ba1861fc-0310062022/original/ADU-2022-FINAL-CLEARED.pdf"
  - "UN Security Council, Afghanistan reporting archive: https://www.un.org/securitycouncil/sanctions/1988/panel-of-experts/reports"
notes: "Candidate period coding; it records institutional breakdown, not uniform Taliban control."
