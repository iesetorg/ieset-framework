# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: costa_rica_export_led_reform_and_opening_1986_2006
status: candidate
name: "Costa Rica export-led reform and gradual market opening"
countries: [CRI]
timeframe: {start: 1986, end: 2006}
coalition: "Alternating PLN and PUSC administrations"
leaders: ["Óscar Arias Sánchez", "Rafael Ángel Calderón Fournier", "José María Figueres Olsen", "Miguel Ángel Rodríguez Echeverría", "Abel Pacheco de la Espriella"]
doctrine: >
  Successive democratic governments pursued export diversification, foreign
  investment, tariff reduction, and gradual financial reform after the
  stabilization phase. Export-processing zones and non-traditional exports
  became key instruments; the state retained major social institutions and
  utilities, while the reforms shifted economic incentives toward globally
  integrated private production.
policies: [cr_export_led_trade_and_financial_reform_1986]
axes_summary:
  - {axis: regulatory.trade_openness, direction: "+", magnitude: strong, rationale: "Trade reform and export promotion reduced protection and removed most import licences and quotas."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: moderate, rationale: "Foreign investment and export processing zones expanded private production and market entry."}
  - {axis: regulatory.financial_deregulation, direction: "+", magnitude: moderate, rationale: "Interest-rate and credit allocation controls were relaxed and private banks expanded."}
  - {axis: fiscal.spending_level, direction: "mixed", magnitude: weak, rationale: "Structural adjustment sought to contain state-enterprise and public-sector costs while retaining extensive social services."}
position_alignments:
  - {position_id: classical_liberal, alignment: partially_aligned, notes: "Trade, investment, and banking were liberalized incrementally within a mixed economy."}
  - {position_id: social_democratic, alignment: partially_aligned, notes: "Core social institutions remained even as the export and investment model opened further."}
references:
  - "World Bank, Costa Rica economic reforms and export-led growth: https://documents1.worldbank.org/curated/en/433001468023660146/pdf/36180.pdf"
  - "WTO, Costa Rica 2007 Trade Policy Review: https://www.wto.org/english/tratop_e/tpr_e/tp282_e.htm"
notes: "The movement tracks the economic reform direction across alternating administrations and does not treat them as one governing coalition."
