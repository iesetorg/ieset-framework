movement_id: paraguay_stroessner_regime_1954_1989
status: candidate
name: Stroessner regime and Colorado Party rule
countries: [PRY]
timeframe: {start: 1954, end: 1989}
coalition: Colorado Party and armed forces
leaders: ["Alfredo Stroessner (President, 1954-1989)"]
doctrine: >
  A 1954 coup brought General Alfredo Stroessner to power and established a
  Colorado Party and military dictatorship that lasted until 1989. The regime
  sought political order and economic growth through foreign investment,
  private enterprise, infrastructure development, and monetary stabilisation,
  while political power remained concentrated in the ruling party and armed
  forces. This authoritarian regime therefore combined a coercive state with
  a substantially private-enterprise economy; it should not be read as a
  simple statist economic programme.
policies: [paraguay_stroessner_regime_1954_1989]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "-", magnitude: strong, drift_attribution_year: 1954, drift_attribution_basis: "The 1954 coup initiated the Colorado Party and military dictatorship documented by the OECD."}
references:
  - "OECD, Setting the scene: Good governance for a more sustainable and inclusive Paraguay: https://www.oecd.org/en/publications/oecd-public-governance-reviews-paraguay_9789264301856-en/full-report/component-5.html"
  - "World Bank, Paraguay: The Role of the State (Report No. 15044-PA): https://documents1.worldbank.org/curated/en/348711468757777070/pdf/multi_page.pdf"
successor_movements: [paraguay_democratic_transition_1989_2022]
