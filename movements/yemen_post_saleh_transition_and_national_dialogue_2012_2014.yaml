# yaml-language-server: $schema=../schemas/movement.schema.json
movement_id: yemen_post_saleh_transition_and_national_dialogue_2012_2014
status: candidate
name: Yemen post-Saleh transition and National Dialogue process
countries: [YEM]
timeframe: {start: 2012, end: 2014}
coalition: "Internationally recognised transitional government under Abdrabbuh Mansur Hadi"
leaders: ["Abdrabbuh Mansur Hadi (President, 2012–2015)"]
doctrine: >
  Following Ali Abdullah Saleh's transfer of power, Yemen entered a UN-supported
  transition and National Dialogue process. The government sought to restructure
  security institutions and negotiate a federal constitutional settlement while
  pursuing fuel-subsidy reform and macroeconomic stabilisation. State capacity remained
  weak, the political settlement incomplete, and reform implementation contested.
policies: [yem_national_dialogue_transition_and_subsidy_reform_2012]
axes_summary:
  - {axis: institutional.rule_of_law, direction: "+", magnitude: weak, rationale: "The transition opened a negotiated political process but did not resolve competing armed and regional claims."}
  - {axis: fiscal.spending_level, direction: "-", magnitude: weak, rationale: "Fuel-subsidy reform aimed to reduce fiscal pressure, while donor grants and social protection remained important."}
  - {axis: regulatory.product_market_competition, direction: "+", magnitude: weak, rationale: "The transition agenda included economic reform, but implementation and state capacity were limited."}
predecessor_movements: [yemen_saleh_gpc_unification_adjustment_1990_2011]
position_alignments:
  - {position_id: institutionalism, alignment: partially_aligned, notes: "The National Dialogue was an inclusive constitutional process, but it did not produce a durable, enforceable settlement."}
  - {position_id: developmentalism, alignment: partially_aligned, notes: "Economic and security reforms required a capable coordinating state that remained fragile."}
references:
  - "UN Human Rights Council, Yemen transition and National Dialogue background: https://yemen.un.org/en/download/4043/21008"
  - "IMF, Yemen programme note: https://www.imf.org/external/np/country/notes/yemen.htm"
notes: "Ends with the 2014 breakdown of the transition and escalation of conflict."
