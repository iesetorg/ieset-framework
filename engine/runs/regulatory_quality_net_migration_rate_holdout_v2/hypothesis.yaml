# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: regulatory_quality_net_migration_rate_holdout_v2
version: 1
status: pre_registered
topic: housing
claim_direction: +
claim: Among countries excluded from the old migration study, a higher WGI regulatory-quality estimate
  at year t predicts a higher net-migration rate per 1,000 residents at t+1, conditional on real
  income per person, WGI rule of law, country effects, and treatment-year effects.
methodology_note: New-ID country-disjoint measured-association follow-up to market_housing_supply_migration_opportunity.
  Its same-commit PARTIAL old result was known before this registration. The historical runner restricted
  its fit to the explicit old country roster, all of which is excluded here. This design tests only
  the stated measured pair, not the old policy mechanism. Four tests share a two-sided Bonferroni
  cutoff of 0.025. No school score credit.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period: &id001
  - 1996
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all countries in the historical old specification: ARG AUS BGD BRA CAN CHL CHN COL DEU
    DNK EGY ESP EST FIN FRA GBR IDN IND ITA JPN KEN KOR LKA MAR MEX MYS NGA NLD NOR NZL PAK PER PHL
    POL SWE THA TUR USA VNM ZAF.'
  - Retain ISO 3166-1 alpha-3 countries and XKX only; exclude aggregates and every old-roster row
    before fitting.
  - Use exact treatment-year and next-year observations, at least five usable treatment years per
    country, and no interpolation, imputation, nearest-year substitution, country replacement, or
    vintage switch.
  - Require nonnegative tariffs or patent applications where used, positive log-growth endpoints
    and income where used, positive population denominator where used, and poverty percentages within
    0 to 100.
variables:
  outcome:
  - name: next_year_net_migration_per_1000_residents
    source: world_bank_wdi:SM.POP.NETM
    transformation: 1,000 times net migration count at exact t+1 divided by positive population at
      exact t+1.
  - name: population_denominator
    source: world_bank_wdi:SP.POP.TOTL
    transformation: Positive population at exact t+1, used only as the net-migration-rate denominator.
  treatment:
  - name: regulatory_quality_estimate
    source: wgi:GOV_WGI_RQ.EST
    transformation: WGI regulatory quality estimate at treatment year t.
  controls:
  - name: log_income
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
  - name: rule_of_law
    source: wgi:RL.EST
    transformation: WGI rule-of-law estimate at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One fixed primary coefficient with country and treatment-year effects and country-clustered
    uncertainty. No model or covariate search.
falsification:
  rule: If fewer than 500 complete treatment-year pairs or 40 countries survive the five-year rule,
    or the primary estimate or clustered uncertainty is unidentified or nonfinite, return INCONCLUSIVE.
    Otherwise SUPPORT requires the expected-sign coefficient at two-sided p<=0.10/4=0.025; REFUTATION
    requires the opposite-sign coefficient at the same cutoff. Every other estimable result is PARTIAL.
    All four fixed tests count in this Bonferroni family even if a test is inconclusive.
  test: country_disjoint_fourth_legacy_panel_fe
  threshold:
    family_id: fourth_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 4
    family_alpha: 0.1
    family_p_max: 0.025
    expected_sign: +
    min_observations: 500
    min_countries: 40
    min_pairs_per_country: 5
    old_hypothesis_id: market_housing_supply_migration_opportunity
    old_result_bucket: PARTIAL
    old_claim_direction: +
    old_n_obs: 1000
    old_n_countries: 40
    old_run_commit: e786a95e676c9d6283c123682d43bf54dbacd73b
    old_country_count: 40
