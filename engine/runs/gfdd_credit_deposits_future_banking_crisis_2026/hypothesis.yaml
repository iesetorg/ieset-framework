  temporal_structure: panel
  exclusion_rules:
  - Use only the frozen key-only GFDD country/indicator/anchor roster at t=2000, 2005, 2010. Require exact
    GFDD source columns at predictor t, private-credit/GDP t−5/t and banking-crisis dummy t..t+5, plus
    WDI GDP per capita at t.
  - After registration and all source locks, retain only at-risk windows with baseline crisis dummy exactly
    0 and all five future crisis flags present and binary 0/1. A future onset is a 0-to-1 transition across
    the t through t+5 sequence; missing future flags never become non-events.
  - Predictor must be finite in [0,500.0]; private-credit/GDP endpoints finite in [0,400.0] and absolute
    five-year change <= 150.0; real GDP per capita finite and positive. Keep countries with at least two
    complete anchors.
  - No interpolation, missing-as-zero crisis recoding, winsorization, outcome-driven country selection,
    source substitution or post-result model, threshold or window change.
variables:
  treatment:
  - name: baseline_credit_deposits_standardized
    source: gfdd:GFDD.SI.04
    transformation: GFDD Bank credit to bank deposits level at t, standardized by complete-case pooled
      mean and population SD after the frozen [0,500.0] admissibility bound; +1 unit is +1 SD.
    notes: Country-level banking-system signal, not a policy intervention.
  outcome:
  - name: systemic_banking_crisis_onset_next_five_years
    source: gfdd:GFDD.OI.19
    transformation: Binary 0-to-1 transition from t through t+5, with all five future annual flags required
      and baseline t equal to 0.
    notes: GFDD mirrors Laeven–Valencia systemic-crisis year coding; one or more later crisis spells in
      a window count once.
  controls:
  - name: baseline_private_credit_gdp_share
    source: gfdd:GFDD.DI.14
    transformation: Percent of GDP at t.
  - name: prior_private_credit_gdp_change
    source: gfdd:GFDD.DI.14
    transformation: Credit/GDP percentage-point difference t minus t−5.
  - name: baseline_log_real_gdp_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log constant-2015-dollar GDP per person at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - anchor_year
  clustering: country
  notes: Equal country-window linear-probability OLS on one standardized bank indicator, baseline credit
    level/change, log real income, country and anchor-year fixed effects. Country-cluster CR1 uncertainty
    with two-sided Student t(G−1); eight-cell Holm correction. Five fixed country hash-fold omissions
    test sign stability. No causal estimate.
falsification:
  test: gfdd_bank_resilience_crisis_2026_10_10
  rule: INCONCLUSIVE if source chronology, complete at-risk outcome, rows/countries/anchor/event, variation,
    influence, rank, cluster-uncertainty or fold-coverage gates fail. SUPPORTED iff coefficient has registered
    + sign, at least 0.03 absolute crisis probability points per +1 predictor SD, Holm-adjusted two-sided
    p<=0.05 across all eight cells (inconclusive cells count p=1), and at least four of five fixed omitted-country
    folds share the registered sign. REFUTED iff the same requirements hold in the opposite direction.
    Otherwise PARTIAL.
  threshold:
    family_id: gfdd_bank_resilience_future_crisis_2026_10_10
    family_size: 8
    family_alpha: 0.05
    holm_alpha: 0.05
    p_max_two_sided: 0.05
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.03
