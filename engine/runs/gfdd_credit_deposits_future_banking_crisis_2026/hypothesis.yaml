hypothesis_id: gfdd_credit_deposits_future_banking_crisis_2026
version: 1
status: pre_registered
topic: regulatory
claim_direction: +
claim: Across frozen country windows anchored in 2000, 2005 and 2010, a higher baseline bank credit to
  bank deposits predicts higher probability of a new systemic banking-crisis onset during t+1..t+5, conditional
  on prior private-credit/GDP level and five-year change, baseline real income, and country/anchor effects.
evidence_type: associational
methodology_note: One cell of a prospective eight-signal GFDD bank-balance-sheet family. Before registration,
  only file hashes, official metadata, categorical indicator/country identities and year-column keys were
  inspected. Selected values, null masks, crisis flags, signs and estimates remain sealed until eight
  separate source-lock commits.
