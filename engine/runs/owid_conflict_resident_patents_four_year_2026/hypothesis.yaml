# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: owid_conflict_resident_patents_four_year_2026
version: 1
status: pre_registered
topic: growth
claim_direction: '-'
claim: Across fixed nonoverlapping four-year country windows, recorded state-based conflict during the
  window coincides with a smaller change in resident patent filings per million from its start to its
  end, conditional on baseline outcome, prior recorded conflict, country effects, and window effects.
methodology_note: Eight-cell retrospective descriptive family. The source-key roster and full family denominator
  were fixed before any selected outcome values or null masks were opened for this family. Existing IESET
  conflict and some outcome analyses were visible; the local family correction does not adjust corpus-wide
  selection. Registration, then a separate exact source lock, must precede measurement.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period:
  - 1995
  - 2023
  temporal_structure: panel
  exclusion_rules:
  - Only the committed case-specific ISO3 and anchor roster is eligible; anchors are 1995, 1999, 2003,
    2007, 2011, 2015, and 2019.
  - For every row, all eight recorded annual conflict-count category vectors from t-3 through t+4 must
    be complete, finite, nonnegative integers no greater than 100 per category. Missing counts never become
    zero.
  - Outcome endpoints at exact t and t+4 must be finite and pass the predeclared bounds or positivity
    and status rules. No interpolation, winsorization, country replacement, or vintage switching.
  - WIPO resident applications must be finite and nonnegative with blank/null or A observation status;
    WDI population at both endpoints must be finite and strictly positive with blank/null or A status.
  - Retain only countries with at least four complete windows, and apply all frozen sample, switching,
    influence, rank, and uncertainty gates before verdict.
variables:
  treatment:
  - name: any_state_based_conflict_window
    source: owid:number-of-state-based-conflicts
    transformation: Binary one if the sum of the four recorded state-based conflict categories in t+1
      through t+4 is positive; otherwise zero. This is a contemporaneous descriptive exposure, not a policy
      treatment.
  outcome:
  - name: resident_patents_four_year_change
    source: wipo:patent_applications_resident
    transformation: Log(1+resident patent filings per million de facto residents) at t+4 minus t; WDI
      population supplies the denominator.
  controls:
  - name: baseline_outcome_transformed
    source: wipo:patent_applications_resident
    transformation: Outcome transformed value at t, using the same fixed transform as the change.
  - name: prior_conflict_log1p_count
    source: owid:number-of-state-based-conflicts
    transformation: Log(1 + sum of all four conflict categories during t-3 through t).
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - four_year_anchor
  clustering: country
  notes: One OLS conflict coefficient per endpoint with baseline transformed outcome and prior log conflict
    count, country and anchor fixed effects. CR1 country-cluster standard error and two-sided Student
    t(G-1). No causal interpretation.
falsification:
  rule: INCONCLUSIVE if any frozen completeness, country, window, exposure, switching, influence, rank,
    or uncertainty gate fails. Otherwise a coefficient in the predicted direction with absolute magnitude
    at least the case threshold and two-sided p at most 0.00125 SUPPORTS; a coefficient of the opposite
    sign meeting the same magnitude and p REFUTES; all other estimable results are PARTIAL. All eight
    cells remain in the denominator even if archived.
  test: owid_conflict_multidomain_four_year_2026_10_10
  threshold:
    family_id: owid_conflict_multidomain_four_year_2026_10_10
    family_size: 8
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.00125
    min_complete_rows: 450
    min_complete_countries: 70
    min_anchors: 5
    min_rows_per_country: 4
    min_conflict_rows: 70
    min_conflict_countries: 20
    min_no_conflict_rows: 150
    min_no_conflict_countries: 60
    min_within_country_switchers: 25
    max_top_one_percent_residual_x_share: 0.25
    max_one_country_residual_x_share: 0.15
    max_one_anchor_residual_x_share: 0.25
    key_roster_sha256: 8046e224ad39cb787ff95416ab5d3c3ab0714ce02e3e4a7b79bae6df485d831d
    causal_credit: 0
    policy_score_eligible: false
