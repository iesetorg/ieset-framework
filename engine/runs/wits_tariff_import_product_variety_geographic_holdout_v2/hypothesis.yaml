prior_confidence: 0.40
disclosure: >
  The old PARTIAL result was seen before this registration. A tariff and
  imported-line association cannot establish consumer welfare, firm entry, or
  a causal trade policy effect. Customs reporting and HS classification can
  change the count. Other IESET tests may share sources or eligible countries.
  Any result is descriptive calibration with zero school credit.
