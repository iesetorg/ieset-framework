hypothesis_id: findex_mobile_formal_saving_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Across the fixed Findex waves, economies with more adults holding mobile-money accounts at baseline
  will show larger next-wave gains in the share saving at a bank, similar institution, or mobile-money
  account, conditional on baseline formal saving and economy and transition effects.
methodology_note: One of six correlated direct-survey descriptive calibrations. The fixed Findex source-key
  roster and indicator labels were screened without selected indicator values or null masks. The original
  frozen contract is engine/audits/findex_financial_pathways_prereg_2026-10-10.md.
