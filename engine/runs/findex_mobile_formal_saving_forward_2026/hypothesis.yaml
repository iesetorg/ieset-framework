  exclusion_rules:
  - Only the fixed 75 lower/middle-income economy IDs and two 2017→2021, 2021→2024 transitions in the
    frozen key roster; require both complete transitions per economy.
  - Only exact Findex indicator codes and demographic groups; proportion cells must be finite in [0,1].
    No interpolation, imputation, alternate wave, winsorization, geography substitution, or 2022 observations.
variables:
  treatment:
  - name: mobileaccount.t.d
    source: world_bank_global_findex_2025:mobileaccount.t.d
    transformation: Baseline mobileaccount.t.d for demographic group all/all; workbook proportion ×100,
      then divide percentage points by 10 for the regression coefficient.
  outcome:
  - name: fin17a.17a1.d_next_wave_change
    source: world_bank_global_findex_2025:fin17a.17a1.d
    transformation: Next-wave minus baseline percentage points for exact subgroup all/all.
  controls:
  - name: baseline_outcome
    source: world_bank_global_findex_2025:fin17a.17a1.d
    transformation: Same outcome at exposure wave in percentage points, divided by 10.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - transition
  clustering: country
  notes: OLS Δoutcome on exposure/10, baseline outcome/10, economy and transition effects; country-cluster
    CR1 standard errors; two-sided Student t(G−1). Only complete two-transition economies enter.
falsification:
  test: findex_financial_pathways_2026_10_10
  rule: INCONCLUSIVE if source/roster/registration chronology, 100-pair/50-economy/two-transition sample,
    20-economy 5-point exposure-change, full-rank, cluster-SE, or frozen exposure-concentration gate fails.
    Otherwise SUPPORTED for a coefficient in the expected sign with absolute size ≥0.5 outcome point per
    10 exposure points and two-sided p≤0.0016666666666666668; REFUTED for an equally strong opposite sign;
    all other estimable results PARTIAL. The six cells share one Bonferroni denominator.
  threshold:
    family_id: findex_financial_pathways_2026_10_10
    family_size: 6
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0016666666666666668
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.5
    min_complete_pairs: 100
    min_complete_countries: 50
    min_material_exposure_countries: 20
    material_exposure_change_pp: 5.0
    max_country_residualized_exposure_share: 0.2
    max_top_one_percent_residualized_exposure_share: 0.2
    max_transition_residualized_exposure_share: 0.6
    expected_key_pairs: 150
    expected_key_countries: 75
    source_key_roster_sha256: 767cdc617b9d210a4ddaa088ece47bbb22a1f73a573a5fb748485554314ad777
    source_lock_path: data/pinned_evidence/findex_mobile_formal_saving_forward_2026.source.json
    source_path: data/vintages/world_bank_findex/global_findex_2025@2026-10-10.xlsx
    source_sha256: b6c991f8e46bcbd4b6423cc962d5b2fa030e3db99832b9016bb4f400f57c772f
