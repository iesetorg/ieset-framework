limitations:
- 2022 EU-SILC income outcomes refer mainly to 2021 income; 2025 income outcomes refer
  to 2024 income.
- These are 24-28-country ecological associations, not effects of tax legislation
  or transfers. Tax receipts, rates, and social outcomes share economic, demographic,
  energy-price, and survey confounding.
- Total tax receipts do not isolate transfer generosity or tax progressivity; the
  top statutory PIT rate does not measure effective tax burdens or enforcement.
