limitations:
- The GFDD crisis dummy records years of Laeven–Valencia systemic banking crises; requiring five complete
  future years avoids treating missing years as non-events.
- Bank ratios are observational signals, not randomized prudential interventions; crisis risk, deleveraging
  and policy responses can affect measured ratios before the recorded onset.
- Seven indicators come from the GFDD Stability topic and cost-to-income from Efficiency; they share banking
  systems, countries and outcome, so eight cells form one correlated Holm family.
- The frozen 2000, 2005 and 2010 anchors end in 2015 and avoid the 2015 Bankscope-to-Orbis switch for
  some baseline predictors; source methods can still differ across countries.
- Country and anchor effects, baseline private-credit level/change and baseline real income do not isolate
  causal bank resilience or policy effects.
- The local GFDD parquet hashes and official World Bank metadata are pinned, but this older corpus has
  no tracked fetch manifest; raw source custody cannot be independently reconstructed from a manifest.
- Holm corrects this eight-cell family, not the entire previously visible IESET banking-crisis literature.
- No causal, policy, school, position or featured credit is assigned.
