disclosure: The old PARTIAL label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Total tax revenue does not measure tax neutrality or exemptions; the two ratios share GDP and fixed investment includes public as well as private capital. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
