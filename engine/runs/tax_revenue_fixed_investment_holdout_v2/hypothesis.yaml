# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: tax_revenue_fixed_investment_holdout_v2
version: 1
status: pre_registered
topic: fiscal
claim_direction: '-'
claim: Among countries excluded from the old sector-neutral-tax screen, higher total tax revenue as a share of GDP at year t predicts lower gross fixed capital formation as a share of GDP at exact year t+1, conditional on real income per person and country and treatment-year effects.
methodology_note: New-ID country-disjoint measured-association follow-up to sector_neutral_tax_vs_exemption_cumulation. The old same-commit PARTIAL result was known before this design and is not prospective evidence. The old runner filtered fitted rows to the explicit old country roster, all excluded here. This eleven-test family fixes the two-sided Bonferroni cutoff at 0.10/11 before outcome magnitudes are inspected. Feasibility selection inspected candidate null masks but no outcome magnitudes, signs, or fits; this limits prospective strength. The claim is narrowed to measured variables, with no school score credit.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period:
  - 2000
  - 2022
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all countries in the historical old specification: ARG AUS BRA CAN CHL CHN DEU DNK ESP EST FIN FRA GBR IDN IND ITA JPN KOR MEX MYS NLD NOR NZL POL SWE THA TUR USA VNM ZAF.'
  - Retain ISO 3166-1 alpha-3 countries and XKX only; exclude aggregates and the full old roster before fitting.
  - Join treatment year t to exact calendar year t+1; require at least five usable treatment years per country; no interpolation, imputation, nearest-year substitution, country replacement, or vintage switch.
  - Require positive real income wherever logged and finite treatment, outcome, and control inputs.
variables:
  outcome:
  - name: next_year_gross_fixed_capital_formation_pct_gdp
    source: world_bank_wdi:NE.GDI.FTOT.ZS
    transformation: Observed level at exact calendar year t+1.
  treatment:
  - name: tax_revenue_pct_gdp
    source: world_bank_wdi:GC.TAX.TOTL.GD.ZS
    transformation: Observed level at treatment year t.
  controls:
  - name: log_real_gdp_pc_at_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One prespecified OLS coefficient with country and treatment-year effects and country-clustered uncertainty. Fixed complete-case sample; no automatic control dropping, model search, or post-result sign change.
falsification:
  rule: Return INCONCLUSIVE if fewer than 400 complete treatment-year pairs or 35 countries survive the five-year rule, or if the coefficient or country-clustered uncertainty is unidentified or nonfinite. Otherwise SUPPORT requires the expected-sign coefficient at two-sided p<=0.10/11; REFUTATION requires the opposite-sign coefficient at that same cutoff. Every other estimable result is PARTIAL. All eleven registered tests remain in the correction family even if a test is inconclusive.
  test: country_disjoint_sixth_legacy_panel_fe
  threshold:
    family_id: sixth_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 11
    family_alpha: 0.1
    family_p_max: 0.009090909090909092
    expected_sign: '-'
    min_observations: 400
    min_countries: 35
    min_pairs_per_country: 5
    old_hypothesis_id: sector_neutral_tax_vs_exemption_cumulation
    old_result_bucket: PARTIAL
    old_n_obs: 644
    old_n_countries: 28
    old_spec_commit: e786a95e676c9d6283c123682d43bf54dbacd73b
    old_run_commit: e786a95e676c9d6283c123682d43bf54dbacd73b
    old_runner_filter_proof: At old_run_commit, scripts/run_panel_fe.py filter_sample restricts country_iso3 to spec.sample.countries before run_panel_ols. The entire old roster below is excluded, including any old countries without fitted rows.
    old_country_count: 30
    old_country_ids:
    - ARG
    - AUS
    - BRA
    - CAN
    - CHL
    - CHN
