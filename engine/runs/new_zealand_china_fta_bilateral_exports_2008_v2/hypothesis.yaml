# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: new_zealand_china_fta_bilateral_exports_2008_v2
version: 1
status: pre_registered
topic: trade
claim_direction: +
claim: After the NZL-CHN trade agreement became effective on 2008-10-01, NZL-origin merchandise exports
  to CHN grew at least 15 percent more in log terms between the four fixed pre years and the four fixed
  post years than the median change in the fixed same-destination donor origins, conditional on an aligned
  pretrend. This is a descriptive bilateral-flow claim, not a treaty causal effect.
evidence_type: descriptive
methodology_note: No direct old case was found; the same CEPII publisher family has been used elsewhere
  in IESET, so global source blindness is not asserted. The new design freezes the direct directed-dyad
  endpoint, source ZIP hash, complete country/year key grid, donor origins and four-year windows before
  reading candidate trade magnitudes. The five treaty cases share one family and one source. A complete-case
  or pretrend failure produces INCONCLUSIVE, not a tuned replacement.
sample:
  countries:
  - NZL
  - CHN
  - AUS
  - USA
  - CAN
  - JPN
  - KOR
  - IND
  - DEU
  period:
  - 2004
  - 2012
  temporal_structure: panel
  exclusion_rules:
  - Only directed NZL>CHN and donor origins AUS, USA, CAN, JPN, KOR, IND, DEU to CHN; no reverse direction
    or donor substitution.
  - Pre 2004-2007, post 2009-2012; event year 2008 excluded from means but required as an intact source
    cell.
  - Require one unique source row with both country-existence flags equal to one, a finite nonnegative
    BACI flow, and exact registered FTA-status schedule for every fixed dyad-year.
  - No interpolation, winsorisation, source replacement, post hoc endpoint or comparator changes.
variables:
  outcome:
  - name: directed_nzl_goods_exports_to_chn
    source: cepii:Gravity_V202211.tradeflow_baci
    transformation: natural log of 1 plus nominal thousands of current US dollars
    notes: Direct BACI merchandise flow; no real-volume, tariff-intensity, sectoral, welfare, or causal
      interpretation.
  treatment:
  - name: new_zealand_china_fta_bilateral_exports_2008_v2_agreement_status
    source: cepii:Gravity_V202211.fta_wto
    transformation: NZL>CHN off in pre 2004-2007, 0 in event year, on in post 2009-2012; all fixed donor
      dyads off throughout the nine-year grid
    notes: Status cross-check against official effective date 2008-10-01; agreement status is not tariff
      intensity.
intervention_channel: regulatory
intervention_channel_justification: The treaty changes a bilateral trade-policy regime; the measured endpoint
  is a flow.
estimator:
  template: descriptive
  event_year: 2008
  clustering: none
  notes: 'For every origin to CHN, calculate mean log1p(BACI) in 2009-2012 less the mean in 2004-2007.
    Primary contrast: NZL change minus median of AUS, USA, CAN, JPN, KOR, IND, DEU donor changes. Pretrend:
    absolute difference between treated OLS pre-year log-flow slope and median fixed-donor OLS slope at
    most 0.03 log units/year. No p-value or causal interpretation.'
falsification:
  test: new_zealand_china_fta_bilateral_exports_2008_v2_fixed_destination_baci_prepost
  rule: First require byte-pinned official source and immutable two-commit registration/source custody.
    Missing/duplicate key, country-existence, FTA-status, finite-nonnegative-flow, or pretrend failure
    yields INCONCLUSIVE. With gates passed, SUPPORTED if primary log contrast >= ln(1.15), REFUTED if
    <= -ln(1.15), PARTIAL otherwise. The five cases are a closed family; no p-value, causal, school, or
    policy-score credit follows.
  threshold: absolute pretrend slope gap <=0.03 log units/year; directional contrast thresholds +/-ln(1.15);
    family size 5
prior_confidence: 0.5
disclosure: No direct old case was found; the same CEPII publisher family has been used elsewhere in IESET,
  so global source blindness is not asserted. The 2009 global crisis and dairy or timber demand can move
  New Zealand-China trade; the agreement began late in 2008. The same-destination donors control a subset
  of destination-wide shocks but cannot identify a causal treaty effect. CEPII nominal BACI values mix
  prices and quantities. One treaty is one test, and all five cases are registered together before any
  selected trade-flow magnitude is read. Public ceiling is descriptive calibration only with zero featured,
  school, or policy-score credit.
scope:
  period:
  - 2004
  - 2012
  countries:
  - NZL
  - CHN
  outcome_dim:
  - trade_liberalisation
  policy_family:
  - trade_policy
  treatment_tags:
  - new_zealand_china_fta_2008_v2
steelman: hypotheses/steelman/new_zealand_china_fta_bilateral_exports_2008_v2.md
covers_claims: []
linked_hypotheses: []
linked_conditions: []
notes: 'Policy record nz_china_fta_2008; official effective-date source https://www.mfat.govt.nz/assets/Trade-agreements/China-NZ-FTA-Upgrade/China-FTA-Upgrade-NIA.pdf.
  Source and extraction contract: engine/audits/fta_baci_five_event_family_2026_source_plan.md. No reverse-flow,
  sector, window, or donor variants count as separate hypotheses in this family.'
