  id: milei_reforms_reduce_argentine_inflation
  legacy_id: null
  path: hypotheses/monetary/milei_reforms_reduce_argentine_inflation.yaml
  school: null
  topic: monetary
  claim: 'Argentine monthly CPI inflation declines from its late-2023 peak (around
    25% month-on-month in December 2023 following the 54% peso devaluation) to below
    5% month-on-month within 12 months of Milei''s December 2023 inauguration, and
    below 3% month-on- month within 18 months. The decline is faster and deeper than
    in any prior Argentine stabilisation episode since the 1989-1991 Austral/Convertibility
    period (Menem), and faster than in any of the Latin American stabilisation episodes
    in the IMF''s post- 1990 catalogue that did not adopt dollarisation, controlling
    for initial inflation level. The pre-registered primary outcome is monthly CPI
    inflation as published by INDEC.

    '
