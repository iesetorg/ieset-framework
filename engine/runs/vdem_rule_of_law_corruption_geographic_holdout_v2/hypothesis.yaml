# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: vdem_rule_of_law_corruption_geographic_holdout_v2
version: 1
status: pre_registered
topic: institutional_quality
claim: In the 132 fixed countries absent from the old 40-country screen, stronger
  V-Dem rule of law in year t predicts lower V-Dem political corruption in year t+1,
  conditional on initial real income, country effects and year effects.
claim_direction: +
methodology_note: Prospective new-ID, geography-disjoint holdout of economic_freedom_corruption_decline.
  The old same-commit result was labelled SUPPORTED and is known before this registration;
  its 40 countries are excluded. This test uses a following-year outcome and pre-frozen
  source files. It tests only a descriptive within-country association, not economic
  freedom as a whole or institutional causality. The country roster was selected using
  only country/year keys in the two source files, without inspecting selected outcome
  values or null masks. No school, policy, causal, position or featured credit is
  requested.
evidence_type: associational
