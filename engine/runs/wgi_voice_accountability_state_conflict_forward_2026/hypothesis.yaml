disclosure: WGI voice and accountability is a perception-based composite, not a measured constitutional
  change. OWID/UCDP counts only state-based conflicts meeting source definitions. Conflict may itself
  alter perceived voice; transitions, conflict settlement, repression, neighboring wars, income and outside
  intervention confound the lagged association. The fit is not causal or independent replication; cite
