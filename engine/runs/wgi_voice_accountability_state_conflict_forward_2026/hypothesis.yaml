hypothesis_id: wgi_voice_accountability_state_conflict_forward_2026
version: 1
status: pre_registered
topic: institutional_quality
claim_direction: '-'
claim: Across five fixed four-year windows, a larger prior increase in WGI Voice and Accountability estimates
  predicts a lower probability of any OWID/UCDP-recorded state-based conflict in the following four years,
  conditional on prior conflict, baseline voice, real income, and country and anchor effects.
methodology_note: Retrospective one-test descriptive registration. WGI voice exposure and WDI income values
  were inspected; only OWID conflict country/year keys, not conflict counts or null masks, were read before
  first-addition registration and later committed source lock. The local p<=.01 threshold does not adjust
  archive-wide question selection.
evidence_type: associational
