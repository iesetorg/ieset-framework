  period:
  - 2004
  - 2024
  temporal_structure: panel
  exclusion_rules:
  - Use only the 939 country/anchor rows in the frozen key roster; OWID conflict keys must be present
    for each year t-3 through t+4, but key presence does not reveal valid counts.
  - Keep ISO3/XKX countries with WGI Voice and Accountability estimate in [-3,3] and positive WDI real
    GDP per person at t-4 and t, blank/null WDI observation status, and absolute four-year WGI change
    no more than 2 points.
  - After the separately committed source lock, require each of four OWID state-based conflict count categories
    to be a finite nonnegative integer <=100 at every selected year; do not impute missing counts as zero.
  - Retain countries with at least four complete anchor rows; no post-result category, control, country,
    anchor, threshold or vintage switch.
variables:
  outcome:
  - name: any_state_based_conflict_next_four_years
    source: owid:number-of-state-based-conflicts
    transformation: Indicator equal to one if the sum across the four named OWID state-based conflict
      count categories and years t+1 through t+4 is positive, else zero; invalid annual categories exclude
      the window.
  treatment:
  - name: prior_four_year_voice_accountability_gain
    source: wgi:GOV_WGI_VA.EST
    transformation: WGI Voice and Accountability estimate at t minus t-4, in standard-estimate points;
      not a policy reform or assigned intervention.
  controls:
  - name: prior_voice_accountability_estimate
    source: wgi:GOV_WGI_VA.EST
    transformation: WGI estimate at t-4.
  - name: prior_any_state_based_conflict
    source: owid:number-of-state-based-conflicts
    transformation: Indicator of any state-based conflict in years t-3 through t.
  - name: prior_log_state_based_conflict_burden
    source: owid:number-of-state-based-conflicts
    transformation: Natural log of one plus the sum of named category counts over t-3 through t.
  - name: log_real_income_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
  - name: prior_log_real_income_change
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Log real GDP per person at t minus t-4.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Country/anchor fixed-effects linear probability projection, country-cluster CR1 with small-sample
    correction and two-sided Student t on G-1 degrees of freedom. Five outcome windows are adjacent and
    do not overlap; fitted probabilities can be outside [0,1]. No model search.
falsification:
  rule: INCONCLUSIVE if any frozen source, chronology, complete-case, exposure/outcome support, rank,
    concentration, or clustered-uncertainty gate fails. Otherwise beta <= -0.15 conflict-incidence probability
    point per +1 WGI estimate point and two-sided p<=0.01 SUPPORTS only a narrow descriptive association;
    comparably positive beta REFUTES it. Other estimable results are PARTIAL. Gate-cleared records are
    public descriptive calibrations only; INCONCLUSIVE is archived. Zero causal, policy, school, position
    and featured credit.
  test: voice_accountability_conflict_forward_2026_10_10
