limitations:
- World Bank WGI voice and accountability is a perception-based composite estimate;
  score revisions and survey sources can change apparent gains.
- OWID's UCDP/PRIO state-based conflict count records conflicts meeting the source
  definition, not all political violence or an armed-death rate.
- Conflict can itself shift perceived voice and accountability; transitions, repression,
  conflict settlement, neighboring wars, and outside intervention can confound the
  lagged association.
- Country/anchor effects, prior recorded conflict, voice baseline and income controls
  do not identify an intervention or a causal peace effect.
- This retrospectively selected single test does not correct selection across the
  wider IESET archive or supply independent replication.
- WGI and OWID manifests record CC-BY-4.0; cite both and their underlying UCDP/PRIO
  provenance in derived displays.
- Zero causal, policy, school, position, and featured credit for all outcomes.
