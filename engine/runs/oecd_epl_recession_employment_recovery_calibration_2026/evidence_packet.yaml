limitations:
- OECD EPR_V1 measures regular-worker dismissal protection, not every dimension of
  labour-market flexibility.
- OECD employment-to-population ratio, ages 20-64, is not a re-employment duration
  or cohort measure.
- Country event selection uses the deepest negative WDI real-GDP-growth year of each
  recession spell; 2009 and 2020 dominate the key-only roster.
- Cross-country EPL differences and recession severity may reflect omitted institutions
  and pandemic responses; this is not causal.
- Bonferroni correction covers these two prospectively registered calibrations only,
  not the historical IESET research search.
- The archived Fraser/GDP-per-capita placeholder remains archived; no score or causal
