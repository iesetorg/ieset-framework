hypothesis_id: wgi_ge_exported_hs6_breadth_forward_2026
version: 1
status: pre_registered
topic: trade
claim_direction: '+'
claim: Across the fixed 153-reporter pre-pandemic panel, a larger three-year improvement in the World Bank government-effectiveness estimate predicts a larger subsequent three-year increase in the WITS count of exported HS6 product categories.
methodology_note: A new descriptive WGI-to-WITS directed source pair. The roster was fixed from WGI treatment and WDI control values and WITS dimension/reporter/year keys only. No selected WITS outcome value, value-null pattern, coefficient, or existing WITS result card was inspected for this design. A prior CEPII-to-WITS preregistration was read for source selectors and overlap; it mentions broad verdict labels from other studies. No archive-wide independent holdout is claimed.
evidence_type: associational
sample:
  countries: [ABW, AFG, AGO, ALB, AND, ARE, ARG, ARM, ATG, AUS, AUT, AZE, BDI, BEL, BEN, BFA, BGD, BGR, BHR, BHS, BIH, BLR, BLZ, BOL, BRA, BRB, BRN, BWA, CAF, CAN, CHE, CHL, CHN, CIV, CMR, COG, COL, COM, CPV, CRI, CYP, CZE, DEU, DMA, DNK, DOM, DZA, ECU, EGY, ESP, EST, ETH, FIN, FJI, FRA, GAB, GBR, GEO, GHA, GMB, GRC, GRD, GTM, GUY, HKG, HND, HRV, HUN, IDN, IND, IRL, ISL, ISR, ITA, JAM, JOR, JPN, KAZ, KEN, KGZ, KHM, KIR, KNA, KOR, KWT, LBN, LCA, LKA, LSO, LTU, LUX, LVA, MAC, MAR, MDA, MDG, MDV, MEX, MKD, MLT, MOZ, MRT, MUS, MWI, MYS, NAM, NER, NGA, NIC, NLD, NOR, NZL, OMN, PAK, PAN, PER, PHL, POL, PRT, PRY, PSE, QAT, RUS, RWA, SAU, SEN, SGP, SLB, SLV, STP, SUR, SVK, SVN, SWE, SWZ, SYC, TGO, THA, TTO, TUN, TUR, TZA, UGA, UKR, URY, USA, VCT, VNM, WSM, YEM, ZAF, ZMB, ZWE]
  period: [2003, 2016]
  temporal_structure: panel
  exclusion_rules:
    - Retain only the exact committed reporter-year key roster and reporters with at least six candidate years before outcome access; current ISO3 codes used to make the roster are frozen in that CSV.
    - Require unique annual WGI government-effectiveness keys with finite point estimates in [-2.5,2.5] at t-3 and t. Exposure is the difference t minus t-3; small and zero changes stay in the regression.
    - Require unique WDI real GDP-per-person keys with positive finite values and blank WDI observation status at t-3 and t. Controls are log GDP per person at t and its prior three-year log change.
    - Require unique WITS keys at t-3, t, and t+3 with freq_id=A, partner_iso3=WLD, product_code=999999, indicator_id=NMBR-XPRT-HS6-PRDCT, and series_id=unique_hs6_products.
    - Use treatment years 2003 through 2016 only; t+3 ends no later than 2019.
    - Only after a separate committed source lock, require all three selected WITS counts to be finite nonnegative integers. Drop invalid selected triples only, then reporters with fewer than six complete triples. The pinned WITS schema has no observation-status or method-break field; do not infer normal status.
    - No interpolation, outcome-based trimming, new vintage, alternate lag, geography substitution, model change, or threshold change after outcome access.
variables:
  treatment:
    - name: wgi_government_effectiveness_three_year_change
      source: wgi:GOV_WGI_GE.EST
      transformation: WGI government-effectiveness point estimate at t minus its estimate at t-3.
      notes: Composite governance estimate, not a policy treatment or direct customs measure.
  outcome:
    - name: forward_exported_hs6_count_log1p_change
      source: wits:unique_hs6_products
      transformation: log1p of the selected exported-HS6 product count at t+3 minus log1p of that count at t.
      notes: Count of reported export product categories, not export value, complexity, domestic content, or welfare.
  controls:
    - name: baseline_exported_hs6_log1p_count
      source: wits:unique_hs6_products
      transformation: log1p of the selected count at t, read only after source lock.
    - name: prior_exported_hs6_log1p_change
      source: wits:unique_hs6_products
      transformation: log1p count at t minus log1p count at t-3, read only after source lock.
    - name: log_real_gdp_per_person_at_t
      source: world_bank_wdi:NY.GDP.PCAP.KD
      transformation: Natural log of positive constant-price GDP per person at t.
    - name: prior_three_year_log_gdp_per_person_change
      source: world_bank_wdi:NY.GDP.PCAP.KD
      transformation: Natural log GDP per person at t minus its log at t-3.
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: OLS of t-to-t+3 log1p exported-HS6-count change on t-3-to-t WGI government-effectiveness change, baseline log1p count, prior log1p-count change, baseline log real GDP per person, prior log real GDP-per-person change, and reporter and treatment-year fixed effects. Reporter-cluster CR1 covariance, two-sided Student t with G-1 degrees of freedom, and 99% confidence interval. No model search.
falsification:
