limitations:
- WDI IC.BUS.NREG counts formal newly registered limited-liability corporations, not
  active firms, sole proprietors, informal firms, net firm creation, or jobs; registry
  coverage and procedures can change.
- WDI ST.INT.ARVL counts inbound arrival trips, not unique people or domestic tourism.
  Where overnight-visitor counts are unavailable, broader visitor counts may be used;
  border, survey, air-only, and accommodation methods differ.
- Both WDI treatment files have blank observation-status fields, so within-country
  method breaks are not identified by a quality flag; frozen log-change caps cannot
  repair undetected breaks.
- OECD 15-24 employment-to-population ratios are based on labour-force surveys; only
  exact normal-status A country-year endpoints are used and B series breaks or unlabeled
  statuses are excluded.
- Country/year fixed effects and one-year ordering do not identify policy or causal
  effects. Macroeconomic demand, migration, demography, survey changes, anticipation,
  and reverse timing can move treatment and employment together.
- Prior IESET business-entry/growth, business-freedom/employment, tourism-development,
  and youth-wage-gap/youth-employment studies are thematically related; this local
  two-test correction does not cover archive-wide selection.
- No causal, policy, school-score, or featured credit is permitted for either result.
