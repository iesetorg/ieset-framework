# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
version: 1
status: pre_registered
topic: energy
evidence_type: descriptive
sample:
  countries:
  - GLOBAL
  period:
  - 1995
  - 2023
  temporal_structure: cross_section_with_justification
  cross_section_justification: One fixed 2005–2015 protected-area change per eligible economy followed by one
    2015–2023 outcome interval; 1995–2005 cereal-yield growth defines a prior condition.
  exclusion_rules:
  - 'Candidate roster is the ISO 3166 alpha-3 or XKX intersection of required country/year source keys: protected-area
    share in 2005 and 2015; forest share, food-production index, and population in 2005, 2015, and 2023; real
    GDP per capita in 2015; and FAOSTAT Cereals; primary yield in 1995 and 2005. The key-only roster is committed
    in the later source lock before values or null masks are opened.'
  - The FAOSTAT yield selector is Item Code 1717, Element Code 5412, Unit kg/ha. Convert Area Code (M49) by
    stripping the leading apostrophe, padding to three digits, and mapping the M49 numeric code to pycountry
    ISO3. Drop aggregate and unmapped geography. Duplicate selected country/year keys fail the run.
  - Use one shared complete-case sample for both endpoints. Require finite protected-area and forest percentages
    in [0,100], strictly positive finite food-production index, population, 2015 real GDP per person, and cereal
    yield at the exact required years. Include only economies with 1995–2005 annualized cereal-yield log growth
    at least 0.5 percentage points. Missing/invalid values are excluded; no interpolation, imputation, alternate
    endpoint, country substitution, winsorization, or outcome-based subgroup.
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: Equal-economy OLS with intercept and fixed endpoint-specific baseline controls. HC3 standard errors
    and Student-t reference with N minus parameter-count degrees of freedom. Both outcomes share one complete-case
    sample and one family. Forest uses two-sided alpha 0.025; food uses one-sided noninferiority alpha 0.025.
    No model or sample search.
prior_confidence: 0.35
disclosure: The archived proxy result is known but did not measure protected land, forest cover, or food output
  per person. The new forward tests are descriptive, vulnerable to designation measurement changes, land-quality
  selection, forest accounting, and concurrent development. The two endpoints are one family; no identified
  policy, causal, school, position, or featured credit.
covers_claims: []
linked_hypotheses: []
linked_conditions: []
hypothesis_id: wdi_protected_land_2005_2015_forward_food_per_person_v2
claim_direction: +
methodology_note: New-ID prospective direct-measure replacement for archived protected_land_food_security_emissions_panel.
  The old generic WGI government-effectiveness to OWID CO2-intensity screen was a proxy and does not test the
  archived protected-area/forest/food claim. These two non-nested endpoints form one descriptive family.
steelman: hypotheses/steelman/wdi_protected_land_2005_2015_forward_food_per_person_v2.md
notes: 'Pre-registration plan: engine/audits/wdi_protected_land_forward_forest_food_2026_family_prereg_2026-10-10.md.
  Exact runner: scripts/run_wdi_protected_land_forward_forest_food_2026_family.py. Forest outcome means net
  cover change, not gross deforestation or land-use emissions.'
scope:
  period:
  - 1995
  - 2023
  countries:
  - GLOBAL
  outcome_dim:
  - productivity
  policy_family:
  - none
  treatment_tags:
  - protected_land_share_expansion
variables:
  treatment:
  - name: protected_land_share_gain_per_5pp
    source: world_bank_wdi:ER.LND.PTLD.ZS
    transformation: (2015 percentage share minus 2005 percentage share) / 5
  outcome:
  - name: forward_annual_food_production_per_person_log_growth_pp
    source: world_bank_wdi:AG.PRD.FOOD.XD; world_bank_wdi:SP.POP.TOTL
    transformation: 100 * [log(food index 2023 / index 2015) - log(population 2023 / population 2015)] / 8
  controls:
  - name: protected_share_2005
    source: world_bank_wdi:ER.LND.PTLD.ZS
    transformation: 2005 percentage share
  - name: log_real_income_2015
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of 2015 level
  - name: prior_cereal_yield_growth_condition
    source: faostat:Production_Crops_Livestock
    transformation: 1995–2005 annualized log growth in Cereals; primary yield, Item 1717, Element 5412, kg/ha;
      >=0.5 log percentage points per year; eligibility only
  - name: log_food_index_2015
    source: world_bank_wdi:AG.PRD.FOOD.XD
    transformation: natural log of positive 2015 food production index
  - name: log_population_2015
    source: world_bank_wdi:SP.POP.TOTL
    transformation: natural log of positive 2015 population
  - name: prior_food_per_person_growth
    source: world_bank_wdi:AG.PRD.FOOD.XD; world_bank_wdi:SP.POP.TOTL
    transformation: 100 * [log(food index 2015 / index 2005) - log(population 2015 / population 2005)] / 10
claim: Among the same earlier cereal-yield-growth economies, larger 2005–2015 increases in terrestrial protected-area
  share predict no material penalty in 2015–2023 food-production-index growth per person, conditional on initial
  protected share, baseline food index and population, their prior per-person trend, and 2015 real income.
  The prespecified noninferiority limit is minus 0.5 annual log percentage point per 5-point protected-share
  gain; this is a descriptive bounded-penalty test, not proof of zero harm or an identified protection effect.
falsification:
  test: fixed_wdi_protected_land_forward_forest_food_2026_family
  rule: INCONCLUSIVE if any shared sample, exposure-variation, rank, HC3, concentration, or leave-one-out gate
    fails. With margin -0.5 annual log percentage point per 5-point protected-share gain, SUPPORTED means the
    one-sided 97.5% lower Student-t confidence bound exceeds -0.5 and >=75% of successful leave-one-out fits
    also clear that margin. REFUTED means the one-sided 97.5% upper bound lies below -0.5 and >=75% of leave-one-out
    fits also show material harm. Other estimable results are PARTIAL. The margin allows up to roughly 4% cumulative
    eight-year reduction per 5-point gain; it cannot establish literal zero food loss. Zero causal, policy,
    school, position, and featured credit.
  threshold:
    family_id: wdi_protected_land_forward_forest_food_2026_family
    family_size: 2
    outcome_role: food
    prior_yield_years:
    - 1995
    - 2005
    treatment_years:
    - 2005
    - 2015
    outcome_years:
    - 2015
    - 2023
    min_prior_yield_growth_annual_log_pp: 0.5
    min_shared_complete_economies: 50
    min_protected_gain_2pp_economies: 15
    min_protected_gain_iqr_pp: 1.0
    max_single_economy_residualized_exposure_share: 0.2
    max_loo_failures: 2
    min_loo_direction_share: 0.75
    noninferiority_margin_annual_log_pp_per_5pp: 0.5
    one_sided_alpha: 0.025
    source_files:
      protected:
