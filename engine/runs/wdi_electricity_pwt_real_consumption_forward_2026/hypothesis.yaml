hypothesis_id: wdi_electricity_pwt_real_consumption_forward_2026
version: 1
status: pre_registered
topic: energy
claim_direction: +
claim: Across the fixed national-area roster, a larger 2000–2010 rise in electricity access predicts
  faster 2010–2019 growth in real household-plus-government consumption per resident at constant 2017
  national prices.
methodology_note: Prospective descriptive WDI/PWT calibration. Original pwt100.dta defines rconna as
  real consumption at constant 2017 national prices, in millions of 2017 US dollars; PWT documentation
  says household-plus-government consumption. The derived manifest has an inconsistent generic PPP currency
  tag; the original variable label governs within-country growth. Only source metadata and geography/year
  keys were opened before registration.
evidence_type: descriptive
