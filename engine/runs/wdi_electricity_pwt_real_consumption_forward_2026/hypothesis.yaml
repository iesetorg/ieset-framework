  period: &id001
  - 2000
  - 2019
  temporal_structure: cross_section_with_justification
  cross_section_justification: One earlier exposure change and one later outcome change per national
    area; annual source rows are not independent observations.
  exclusion_rules:
  - Fixed 180-area ISO3 key roster; exact access years 2000/2010 and PWT rconna plus WDI population
    years 2000/2010/2019.
  - Access must be finite in [0,100] percent; PWT rconna positive and at most 1000000000 million 2017
    US dollars; WDI population positive at every endpoint.
  - No imputation, interpolation, nearest-year join, geography replacement, status-based reselection,
    winsorization, or vintage switch; key presence is not numeric completeness.
variables:
  outcome:
  - name: real_consumption_per_resident_log_change_2010_2019
    source: pwt:rconna
    transformation: log(rconna_2019 times 1000000 divided by WDI population_2019) minus 2010 value;
      combined household-plus-government consumption at constant 2017 national prices.
  treatment:
  - name: electricity_access_change_2000_2010_pp
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: 2010 minus 2000 share with electricity access, percentage points.
  controls:
  - name: electricity_access_2000
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: 2000 electricity-access share.
  - name: real_consumption_per_resident_log_2010
    source: pwt:rconna
    transformation: 2010 log real household-plus-government consumption per WDI resident.
  - name: prior_real_consumption_log_change_2000_2010
    source: pwt:rconna
    transformation: 2010 minus 2000 log real household-plus-government consumption per WDI resident.
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: Equal-country OLS with intercept and three fixed controls, HC3 robust standard error, and two-sided
    Student t reference with N minus 5 degrees of freedom. No model, subgroup, weighting, or covariate
    search.
falsification:
  rule: Any sample, material-change, IQR, rank, residual-variation, HC3, single-area concentration,
    or leave-one-out gate failure is INCONCLUSIVE with no public coefficient. Otherwise SUPPORTED requires
    beta at least +0.002 log units per access point, two-sided p at most 0.005, and positive sign in
    at least 80% of successful leave-one-out fits. REFUTED uses beta at most -0.002 and corresponding
    significance and negative sign stability. Other estimable results are PARTIAL.
  test: ieset_credit_access_economic_2026_10_10
  threshold:
    family_id: ieset_credit_access_economic_2026_10_10
    family_size: 2
    family_alpha: 0.01
