limitations:
- Eurostat nrg_pc_204 is the semiannual end-user price for medium household consumers
  (2500-4999 kWh), converted to EUR/kWh including taxes. It is not an industrial price
  or wholesale generation cost.
- The 2021-2022 crisis, taxes, subsidies, network charges, retail market rules, exchange-rate
  conversion, natural gas, and demand can move prices independently of renewable output
  share.
- WDI renewable electricity output share is a measured generation mix, not a renewable
  policy treatment or installed capacity.
- The pinned Parquet files carry no Eurostat provisional/break flags; missing source
  status is not proof of ordinary observation quality.
- Country/year fixed effects and a pre-2018 diagnostic do not identify causal policy
  effects. No policy, causal, school-score, or featured credit is assigned.
