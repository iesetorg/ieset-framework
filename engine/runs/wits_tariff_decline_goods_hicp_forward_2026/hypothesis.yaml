disclosure: All-merchandise import-weighted tariffs are an imperfect exposure for selected consumer categories
  and can shift through import composition. Shared EU external tariffs, exchange rates, VAT, commodity costs,
  demand, distribution margins, accession and price methodology confound interpretation. Earlier tariff and
  HICP studies mean archive-wide selection is not corrected by the six-test Bonferroni rule. Six correlated
  components are one descriptive calibration, never six graduations. No causal, policy-effect, school-score,
  position or featured credit.
