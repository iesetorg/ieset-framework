limitations:
- The WITS series is an import-weighted applied merchandise tariff across all products,
  not a category-specific tariff, policy event, or exogenous reform. A change can
  reflect import composition and data revision.
- The six Eurostat COICOP groups are distinct goods-heavy spending groups, but their
  actual import shares were not measured. They share the same tariff panel, macro
  shocks, HICP methodology, and national price regimes; they count as one omnibus
  claim.
- Euro-area members share an external tariff; remaining country variation may reflect
  import weights rather than national tariff policy. Exchange rates, commodity costs,
  VAT, distribution margins, demand, and accession can confound the association.
- A three-year tariff change and next-year annual-average HICP inflation establish
  ordering but cannot identify when costs passed through. The annual-average rate
  is not December-to-December inflation.
- The pinned HICP Parquet lacks retained cell flags; finite values are not claimed
  break-screened or method-continuous. The pinned prc_hicp_aind table was later superseded
  by an ECOICOP 2 table.
- The six-test Bonferroni correction is local; prior IESET tariff and HICP archive
  exploration is not corrected. No causal, policy-effect, school-score, position,
  or featured credit is permitted.
