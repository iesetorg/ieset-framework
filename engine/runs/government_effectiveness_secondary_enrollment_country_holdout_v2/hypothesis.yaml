prior_confidence: 0.4
disclosure: The old PARTIAL result was seen before this new design. Feasibility checked null masks and country/year
  keys only, never candidate magnitudes, signs, or estimates. WGI government effectiveness is not school autonomy
  or education spending; gross secondary enrollment can exceed 100 percent and is not learning quality. This is
  descriptive calibration, not causal validation of the old mechanism, and grants no policy or school-score credit.
