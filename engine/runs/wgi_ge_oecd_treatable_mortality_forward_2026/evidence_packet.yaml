- WGI is a perceptions-based governance composite, not a health-policy intervention.
- The one-year lead and fixed effects do not identify a causal effect or remove country-specific
  time-varying confounding.
- OECD mortality cause coding and WGI methods may change despite the selected status
  screen.
- The same OECD mortality vintage appears in earlier IESET studies; this is not an
  independent archive holdout.
- No causal, policy, school, position, or featured credit is permitted.
