limitations:
- This is value-blind retrospective calibration of already published observations,
  not a future-data holdout.
- Wage-level quartiles are based on the mean of current and year-earlier hourly wages;
  outcomes are medians of individual nominal growth.
- Three-month smoothing, twelve-month matching, and just 32 monthly points limit HAC
  tail-probability precision.
- October 2025 is absent; the publisher substituted months in its November and December
  2025 moving averages.
- The publisher reported a smaller CPS sample in late 2025, a 2024 topcoding change,
  and minor 2023-2025 revisions.
- The result is not a wage-level inequality, real-wage, minimum-wage, policy, or causal
  estimate.
- No old-hypothesis graduation, policy link, or school-score credit follows from this
  descriptive result.
