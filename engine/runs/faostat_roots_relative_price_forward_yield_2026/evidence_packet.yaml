limitations:
- The predictor is a relative producer-price change, not a randomized price incentive
  or policy treatment.
- Harvests can change prices and farmers may anticipate shocks; a one-year lead does
  not identify a causal response.
- FAOSTAT's crop-group indices and aggregate yields can change when the crop mix changes;
  harvested area may count multiple harvests of a parcel.
- Official, estimated, and external-organization observations are admitted and reported
  separately; imputed and break flags are excluded.
- Country/year effects and prior outcome growth do not remove weather, trade, input-cost,
  exchange-rate, or subsidy confounding.
- Eight correlated tests use one Bonferroni family; this does not adjust the wider
  IESET archive search and they are not independent replications.
- Raw FAOSTAT archives and derived parquets are hash-pinned in a local source cache,
  not copied into Git; the derived-parquet transformation lacks a tracked fetch manifest.
- No causal, policy, school, position, or featured credit is assigned.
