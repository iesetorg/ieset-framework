limitations:
- Three sectors share the same productivity source, CPI deflator, countries, years and model; this is
  one correlated family, not three replications.
- OECD PDB LCEMP is nominal labour compensation per employee; national WDI CPI is a broad consumer basket,
  not each sector's output deflator or a measure of median wages.
- Compensation per employee can change with worker composition and hours; employment and wage bargaining
  can respond jointly to demand and productivity.
- Country/year effects, prior real-pay growth and a one-year lead do not identify causal productivity
  pass-through or a policy effect.
- The frozen OECD core and moderate-growth/inflation bounds limit generalization; no post-result source
  or threshold change is permitted.
- Sectors and signs were selected after related archive visibility. Holm controls this three-cell family
  only, not archive-wide selection.
- No causal, policy, school, position or featured credit is assigned.
