hypothesis_id: oecd_cit_cut_business_registration_forward_2026
version: 1
status: pre_registered
topic: fiscal
claim_direction: +
claim: Across the fixed 2007–2018 tax-year panel, a cut of at least one percentage point in the OECD combined statutory corporate income-tax rate from t−1 to t predicts a higher log change in World Bank new limited-liability business registrations from t to t+1 than a tax-stable year, conditional on a separate tax-hike indicator and country/year effects.
methodology_note: 'Prospective two-test descriptive family; treatment values and outcome country/year keys alone informed registration. No WDI registration values, null masks, or status fields were opened. Frozen contract: engine/audits/oecd_tax_registration_family_prereg_2026-10-10.md.'
