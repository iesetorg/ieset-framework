  exclusion_rules:
  - Use only the fixed key-only roster with exact OECD tax keys at t−1,t and WDI registration keys at t,t+1; no nearest-year join, imputation, country substitution, or window extension.
  - OECD rate at both tax endpoints must be finite and in [0,100]; this excludes the impossible France 2013 top PIT value and adjacent annual changes in the PIT case.
  - Use countries with at least five key-only candidate years and, after the separate source-lock commit, at least five complete measured pairs.
  - WDI new registrations at both endpoints must be finite, strictly positive and have blank observation status; drop aggregate blank-country-code rows. No outcome winsorization or cap.
  - Retain every otherwise valid tax change, including large reforms. Code cut as Δrate≤−1 pp, hike as Δrate≥+1 pp, stable as |Δrate|<1 pp.
variables:
  treatment:
  - name: cit_cut_at_least_one_pp
    source: oecd_taxstruct:combined_corporate_income_tax_rate
    transformation: Indicator of statutory rate at t minus t−1 ≤ −1 percentage point.
    notes: Lower headline corporate tax may increase after-tax returns to formal incorporation, though the rate is not an effective tax and cannot establish reform effects.
  - name: cit_hike_at_least_one_pp
    source: oecd_taxstruct:combined_corporate_income_tax_rate
    transformation: Indicator of statutory rate at t minus t−1 ≥ +1 percentage point, included as a prespecified nuisance covariate.
  outcome:
  - name: next_year_log_new_business_registration_change
    source: world_bank_wdi:IC.BUS.NREG
    transformation: ln(new limited-liability registrations at t+1) minus ln(registrations at t).
    notes: Raw counts, not registrations per person, active firms, sole proprietorships, jobs or a causal response.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One OLS cut coefficient versus tax-stable years, with hike indicator, country and tax-year fixed effects; country-cluster CR1 and two-sided Student t(G−1). No outcome-conditioned search, controls, alternate lags or country substitutions.
falsification:
