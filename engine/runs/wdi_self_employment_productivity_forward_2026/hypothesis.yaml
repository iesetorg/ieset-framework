hypothesis_id: wdi_self_employment_productivity_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: +
claim: Larger 2000-to-2010 declines in the self-employment share predict greater 2010-to-2020
  growth in GDP per person employed across the frozen country roster.
evidence_type: descriptive
methodology_note: One of a closed three-test descriptive family, fixed before selected
  values. Family alpha 0.01 with Bonferroni denominator three; source-key rows do
