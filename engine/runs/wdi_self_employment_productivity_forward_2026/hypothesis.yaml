  cross_section_justification: One fixed prior exposure change and one subsequent
    outcome change per country.
  exclusion_rules:
  - Only the frozen 215-country source-key intersection; complete values, admissible
    statuses and ranges required.
  - No aggregate geography, duplicate key, alternate endpoint, interpolation, imputation,
    post-result covariate or country replacement.
scope:
  period:
  - 2000
  - 2020
  countries: *id001
  outcome_dim:
  - productivity
  policy_family:
  - none
  treatment_tags: []
variables:
  treatment:
  - name: prior_exposure_gain
    source: world_bank_wdi:SL.EMP.SELF.ZS
    transformation: self-employed share in 2000 minus 2010 percentage points
  outcome:
  - name: later_outcome_improvement
    source: world_bank_wdi:SL.GDP.PCAP.EM.KD
    transformation: log(GDP per employed person in 2020) minus log(level in 2010)
  controls:
  - name: baseline_exposure
    source: world_bank_wdi:SL.EMP.SELF.ZS
    transformation: fixed first exposure endpoint
  - name: baseline_outcome
    source: world_bank_wdi:SL.GDP.PCAP.EM.KD
    transformation: fixed first outcome endpoint, logged where positive
estimator:
  template: descriptive
  notes: Equal-country OLS with intercept, prior exposure change, baseline exposure
    and baseline outcome; HC3 two-sided Student t. Five fixed SHA256(ISO3) hash-fold
    omissions. No post-result controls.
falsification:
  test: fixed_wdi_self_employment_productivity_forward_2026
  rule: Any failed frozen complete-case, material-gain, variation, rank, positive
    finite HC3 uncertainty, residualized-exposure concentration or holdout gate means
    INCONCLUSIVE. Otherwise SUPPORTED requires positive meaningful slope, two-sided
    Bonferroni p<=0.01/3 and >=4 positive holdout signs; REFUTED symmetrically requires
    a negative meaningful slope and >=4 negative holdout signs. Other estimable cases
    PARTIAL. All three remain in the denominator. Zero causal, policy, school, position
    and featured credit.
  threshold:
    family_id: three_domain_forward_calibration_2026
    family_size: 3
    family_alpha: 0.01
    bonferroni_p_max_two_sided: 0.0033333333333333335
    meaningful_beta_min_abs: 0.005
    min_complete_countries: 150
    min_material_exposure_gain_countries: 35
    material_exposure_gain: 3.0
    min_exposure_p90_p10_spread: 8.0
    max_top_country_residualized_exposure_share: 0.12
    max_top_10_residualized_exposure_share: 0.5
    min_leave_one_hash_fold_out_countries: 120
    min_concordant_holdouts_for_directional_verdict: 4
    roster_sha256: 8e1b06016aec18f323571785edbe91c228f931744c234e6822a6e2f52cbf62cc
    source_lock_path: data/pinned_evidence/three_domain_family_2026.manifest.json
    causal_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.3
disclosure: The modeled self-employment share includes employers and own-account work
  and does not measure formal employment. Sector mix, capital deepening and GDP accounting
  can drive both series. This test is a descriptive association and provides no identified
  policy or causal effect.
