limitations:
- Union density is a share of employees in trade unions, not a policy intervention
  or collective-bargaining coverage.
- The OECD outcome is the unemployment rate among adults aged 25–64 with low educational
  attainment, not youth unemployment or wage compression.
- The design uses two-year nonoverlapping windows and country/anchor-year effects,
  but time-varying labour demand, institutions, and reverse causation remain.
- Baseline unemployment and GDP per capita adjust observed starting conditions but
  do not establish a causal effect.
- The one-test p threshold is local to this prospective calibration; it does not correct
  the historical IESET search across 131 placeholders.
- The old Fraser/GDP-per-capita placeholder stays archived with no score or verdict
