limitations:
- WDI internet use measures people using the Internet, not broadband quality or productive
  digital use; estimates, survey modes, and mobile access change over time.
- Eurostat GOV+HES is R&D performed in government and higher-education sectors, not
  funding by government; the selected raw slice lacks observation-status or break
  flags.
- Resident patent applications are WIPO-origin counts delivered by the WDI API, not
  independent WIPO records or patent quality; filing law, office practices, and population
  denominators vary.
- Temporal ordering, country/year fixed effects, baseline patent intensity and income
  controls do not identify causal or policy effects. Reverse timing, anticipation,
  industrial composition, and common technology shocks remain.
- A prior IESET business-enterprise R&D to resident-patent study and older patent
  candidates were visible before selection of this family. The two-test Bonferroni
  gate is local, not corpus-wide selection control or independent replication.
- High-tech export share was screened from treatment values only and rejected for
  concentrated residual variation; no patent outcome values or null masks were used
  to choose this family.
- No causal, policy, school-score, position, or featured credit is permitted.
