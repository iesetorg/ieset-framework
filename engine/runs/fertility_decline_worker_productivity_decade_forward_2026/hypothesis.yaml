version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: In the fixed country/anchor sample, a one-birth-per-woman larger fertility decline in the preceding
  decade predicts at least a 0.03 ten-year log points increase in real output per employed person during
  the following decade, conditional on earlier real income and country/anchor effects.
methodology_note: Six-outcome demographic-transition descriptive family. Source keys, treatment/income
  preflight, complete-case, influence, and multiplicity rules were fixed in engine/audits/demographic_transition_followthrough_prereg_2026-10-10.md
  before selected outcome values or null masks were opened.
