  exclusion_rules:
  - Only frozen 1995 and 2005 anchor country keys; require both complete windows per country.
  - Treat missing, nonfinite, flagged, out-of-range or nonpositive log-input endpoints as absent; no interpolation,
    winsorization, replacement source, or country substitution.
  - Only two-window complete countries enter country/anchor fixed-effects fits; no post-outcome threshold
    changes.
variables:
  treatment:
  - name: preceding_decade_fertility_decline
    source: world_bank_wdi:SP.DYN.TFRT.IN
    transformation: Fertility at t-10 minus fertility at t, births per woman; positive means declining
      fertility.
    notes: Observed national demographic transition, not a policy intervention.
  outcome:
  - name: worker_productivity
    source: world_bank_wdi:SL.GDP.PCAP.EM.KD
    transformation: real output per employed person at t+10 minus t; natural-log ratio.
    notes: Distinct aggregate response margin; no individual-level effect is identified.
  controls:
  - name: baseline_log_real_income_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log real GDP per resident at t.
  - name: preceding_decade_log_income_growth
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log real GDP per resident at t divided by t-10.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - anchor_year
  clustering: country
  notes: OLS of next-decade outcome change on prior-decade fertility decline, baseline log income, prior
    log income growth, country and anchor effects. Country-cluster CR1 small-sample correction; two-sided
    Student t(G-1).
falsification:
  test: demographic_transition_followthrough_2026_10_10
  rule: INCONCLUSIVE if a frozen source, chronology, complete-case, material-exposure, rank, influence,
    or finite-uncertainty gate fails. Otherwise SUPPORTED for a + oriented beta of at least 0.03 ten-year
    log points and two-sided p<=0.0016666666666666668; REFUTED for equally large opposite beta at the
    same p; all other estimable results PARTIAL. Six tests share one family denominator.
  threshold:
    family_id: demographic_transition_followthrough_2026_10_10
    family_size: 6
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0016666666666666668
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.03
    meaningful_beta_unit: ten-year log points
    min_complete_rows: 250
    min_complete_countries: 120
    min_material_rows: 100
    min_material_countries: 65
    material_fertility_decline_births_per_woman: 0.5
    min_complete_anchors_per_country: 2
