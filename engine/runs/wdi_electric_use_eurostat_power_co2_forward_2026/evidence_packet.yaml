limitations:
- WDI renewable output share and electric-power consumption are IEA-origin energy
  series; electricity generated, used, traded, and lost are different quantities.
- Eurostat env_air_gge republishes EEA/UNFCCC territorial inventories. CRF1A1A includes
  public electricity and heat production; it is not all electricity generation or
  all territorial emissions.
- The pinned Eurostat Parquet retains no observation flags, so provisional, revised,
  or break annotations cannot be screened from this vintage. The WDI status columns
  are blank; method breaks are likewise not identified.
- Coal-to-gas switching, nuclear dispatch, weather, imports, heat production, ETS,
  fuel prices, demand, and early-1990s transition can confound these forward associations.
- Pre-2019 sensitivity excludes 2019-2022 treatment years and 2020-2023 forward endpoints;
  it cannot remove earlier shocks or identify a causal effect.
- These are two source-overlapping local tests, not independent replications or renewable-policy
  interventions. No causal, policy, school-score, or featured credit is permitted.
