prior_confidence: 0.4
disclosure: Earlier rule-of-law/growth results were known before this registration.
  WGI rule of law is a governance perception index, not a randomized reform; faster
  growth can improve WGI ratings, and shared determinants may affect both. Non-overlapping
  blocks, a disjoint country roster, controls and fixed effects do not establish causality.
  The capital-formation endpoint is total rather than private investment. Two endpoints
  share one family and cannot be counted as independent evidence for the broad old
  claim.
