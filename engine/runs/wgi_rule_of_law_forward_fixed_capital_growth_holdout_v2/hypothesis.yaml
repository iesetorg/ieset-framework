hypothesis_id: wgi_rule_of_law_forward_fixed_capital_growth_holdout_v2
version: 1
status: pre_registered
topic: institutional_quality
claim: In the same disjoint 131-country roster, stronger WGI rule of law at the start
  of a five-year block predicts faster real gross fixed capital formation growth over
  the following five years, conditional on starting income, investment share, trade
  share, dependency ratio, country effects, and block-year effects.
claim_direction: +
methodology_note: Prospective new-ID geographic holdout of the distinct five-year
  real fixed capital formation growth endpoint in archived rule_of_law_institutional_growth.
  Its old same-commit run was PARTIAL with an effectively zero generic coefficient;
  the separate market_order_rule_of_law_gdp_pc_growth_panel was also PARTIAL. Both
  country rosters are entirely excluded. A single two-outcome family is registered
  before selected outcome magnitudes or null masks are read; shared treatment, period
  and countries do not create two independent institutional replications. Only descriptive
  calibration is possible.
