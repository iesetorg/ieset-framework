  temporal_structure: panel
  exclusion_rules:
  - Only the 131 listed country codes qualify. All 60 countries from rule_of_law_institutional_growth
    and all 53 from market_order_rule_of_law_gdp_pc_growth_panel are excluded; their
    union is 62. Fourteen territorial or nonuniform geographies are also excluded
    before selected values are read.
  - Use only non-overlapping treatment years t=2002, 2007, 2012, 2017 and exact five-year
    windows t+1 through t+5. Do not interpolate, forward-fill, alter block endpoints,
    or select alternate vintages.
  - Require finite treatment and controls at t; positive finite real GDP per person
    at t; at least three complete blocks per country for the specified outcome. No
    post-result sample changes.
variables:
  outcome:
  - name: mean_real_fixed_capital_growth_next_five_years
    source: world_bank_wdi:NE.GDI.FTOT.KD.ZG
    transformation: Arithmetic mean of published annual real gross fixed capital formation
      growth in each exact year t+1 through t+5; all five years required
  treatment:
  - name: rule_of_law_t
    source: wgi:RL.EST
    transformation: published WGI rule-of-law estimate at block start t; higher means
      stronger rule of law
  controls:
  - name: log_real_gdp_pc_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive real GDP per person at t
  - name: investment_share_t
    source: world_bank_wdi:NE.GDI.TOTL.ZS
    transformation: published gross capital formation share of GDP at t
  - name: trade_share_t
    source: world_bank_wdi:NE.TRD.GNFS.ZS
    transformation: published trade share of GDP at t
  - name: dependency_ratio_t
    source: world_bank_wdi:SP.POP.DPND
    transformation: published age-dependency ratio at t
  - name: government_effectiveness_sensitivity_t
    source: wgi:GE.EST
    transformation: published WGI government effectiveness at t; sensitivity estimator
      only, not a primary-model control
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS with country and block-start-year fixed effects and country-clustered
    uncertainty. Sole primary term is rule_of_law_t. Fit one sensitivity with WGI
    government effectiveness added to the same primary sample, reporting attenuation,
    but do not use it to select a verdict. Do not replace a failed primary fit with
    a pooled model.
falsification:
  rule: INCONCLUSIVE if fewer than 280 complete non-overlapping blocks or 80 countries
    with at least three blocks survive, if the primary coefficient/clustered uncertainty
    is nonfinite or unidentified, if fewer than 50 countries have a within-sample
    rule-of-law range of at least 0.05 WGI units, or if any one country supplies over
    15 percent of residualized within-country/year treatment variation. Otherwise
    SUPPORTED only for a positive primary coefficient with two-sided country-clustered
    p<=0.025; REFUTED only for a negative coefficient with p<=0.025; otherwise PARTIAL.
    The two registered endpoints form one Bonferroni family (family-wise alpha<=0.05).
    Only measured associational calibration can receive public visibility.
  test: wgi_rule_of_law_forward_fixed_capital_growth_holdout_v2
  threshold:
    expected_sign: +
    family_id: wgi_rule_of_law_five_year_geographic_holdout_2026_10_10
    family_size: 2
    family_alpha_max: 0.05
    p_max: 0.025
    min_blocks: 280
    min_countries: 80
    min_blocks_per_country: 3
    min_countries_with_treatment_range_0_05: 50
    max_country_residualized_treatment_share: 0.15
