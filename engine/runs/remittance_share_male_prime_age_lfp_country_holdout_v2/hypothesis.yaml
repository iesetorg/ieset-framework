disclosure: >-
  This is a descriptive association across broad country/economy holdouts,
  not a migrant-corridor test, causal effect, migration mechanism, reservation
  wage estimate, household-consumption test, or remittance policy evaluation.
  Reverse causation, GDP-denominator movements, country-specific time trends,
  structural change, migration selection, and modelled ILO measurement can
  account for an association despite country/year effects and two controls.
  ILO modelled estimates can use World Bank/IMF macroeconomic inputs, so
  the outcome is not an independent survey validation of WDI predictors.
  The old archived PARTIAL result mixed ILO sex and age dimensions; it is not
  a valid male-25-to-54 comparator. ILO obs_status blank and R are reported
  as supplied with no unsupported interpretation; the whole series is
  modelled, and the outcome ends in 2023 before the file's 2026-2027
  projections. This test reserves one of eight screening slots at 0.00625,
  but cannot erase the larger archive's selection/multiple-testing history.
  No school, causal, welfare, or policy-score credit.
