hypothesis_id: remittance_share_male_prime_age_lfp_country_holdout_v2
version: 1
status: pre_registered
topic: growth
claim_direction: '-'
claim: >-
  Across the fixed 148 country/economy holdouts outside the old 13-area fit,
  a higher World Bank personal-remittances-received share of GDP in year t
  predicts a lower ILO-modelled male age-25-to-54 labour-force participation
  rate in exact year t+1, conditional on real PPP GDP per capita and total
  fertility at t and country/economy and treatment-year effects.
methodology_note: >-
  This is a new-ID, country-disjoint endpoint repair and descriptive follow-up
  to demo_remittance_corridor_dependency. The archived old result is PARTIAL
  (312 observations, 13 countries, coefficient +0.079581, p=0.380169), but
  its generic runner averaged all ILO sex/age rows into country-years; the
  saved coefficient was not a male-25-to-54 estimate and is not adopted as
  evidence for that endpoint. The physical ILO `_A` annual file stores
  indicator EAP_2WAP_SEX_AGE_RT; this test selects exactly SEX_M and
  AGE_AGGREGATE_Y25-54. ILO classifies the series as modelled estimates,
  not direct survey observations. The old 13 fitted areas are excluded.
  Selection inspected source keys, categorical metadata, and Arrow value
  null masks only; no held-out magnitude, sign, or fit was inspected. The
  sole primary outcome is the t+1 level through 2023; there is no alternate
  credited outcome. This test consumes one of eight fixed simple-pair
  screening slots at family two-sided alpha 0.05/8 = 0.00625, which does
  not repair multiplicity in the wider IESET archive. No school or causal
  credit.
evidence_type: associational
