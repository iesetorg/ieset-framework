     BLR, BLZ, BOL, BRA, BRB, BTN, BWA, CAN, CHE, CHL, CHN, CIV, CMR, COD,
     COG, COL, COM, CPV, CRI, CYP, CZE, DEU, DJI, DNK, DOM, DZA, ECU, ESP,
     EST, ETH, FIN, FJI, FRA, GAB, GBR, GEO, GHA, GIN, GMB, GNB, GRC, GUY,
     HKG, HRV, HTI, HUN, IDN, IRL, IRQ, ISL, ISR, ITA, JOR, JPN, KAZ, KEN,
     KGZ, KHM, KOR, KWT, LAO, LBN, LBR, LCA, LSO, LTU, LUX, LVA, MAC, MDA,
     MDG, MDV, MKD, MLI, MLT, MMR, MNE, MNG, MOZ, MUS, MWI, MYS, NAM, NER,
     NGA, NIC, NLD, NOR, NZL, OMN, PAN, PER, PNG, POL, PRT, PRY, PSE, QAT,
     ROU, RUS, RWA, SAU, SDN, SEN, SLB, SLE, SRB, STP, SUR, SVK, SVN, SWE,
     SWZ, SYR, TGO, THA, TJK, TLS, TON, TTO, TUN, TUR, TZA, UGA, UKR, URY,
     USA, UZB, VCT, VUT, WSM, ZAF, ZMB, ZWE]
  period: [2000, 2022]
  temporal_structure: panel
  exclusion_rules:
    - >-
      Exclude all 13 old fitted countries: BGD EGY GTM HND IND JAM LKA MAR
      MEX NPL PAK PHL SLV. Use only the exact 148-area roster; no replacement
      countries, regional aggregates, or dynamic roster expansion.
    - >-
      Treatment and controls must be at exact t in 2000-2022. Outcome must
      be ILO modelled annual percentage at exact t+1 in 2001-2023. The ILO
      physical slice must have indicator EAP_2WAP_SEX_AGE_RT, sex SEX_M,
      classif1 AGE_AGGREGATE_Y25-54, source code beginning XA:, and
      obs_status blank or R. Preserve counts of blank and R; neither code
      proves survey observation or a particular imputation status.
    - >-
      Require finite remittance share at least zero, ILO participation rate
      within 0 to 100 inclusive, positive PPP GDP per capita, finite
      nonnegative fertility, and at least eight complete treatment years
      per retained area. Exclude invalid rows without clipping. No interpolation,
      imputation, nearest-year substitution, forecast-year extension, source
      switching, or outcome-based winsorization.
variables:
  outcome:
    - name: male_prime_age_lfp_pct_at_t_plus_1
      source: ilostat:EAP_2WAP_SEX_AGE_RT_A
      transformation: >-
        Exact next-year annual ILO-modelled participation percentage for
        SEX_M and AGE_AGGREGATE_Y25-54; physical indicator is
        EAP_2WAP_SEX_AGE_RT. Level in percentage points, not annual change.
  treatment:
    - name: personal_remittances_received_pct_gdp_at_t
      source: world_bank_wdi:BX.TRF.PWKR.DT.GD.ZS
      transformation: Exact-year percentage of GDP in raw percentage-point units.
  controls:
    - name: real_gdp_per_capita_ppp_at_t
      source: world_bank_wdi:NY.GDP.PCAP.PP.KD
      transformation: Natural log of positive exact-year real PPP GDP per capita.
    - name: total_fertility_rate_at_t
      source: world_bank_wdi:SP.DYN.TFRT.IN
      transformation: Exact-year births per woman, level.
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: >-
    One complete-case OLS fit of exact t+1 male prime-age LFP level on raw
    remittances received as percent of GDP at t, log real PPP GDP per capita
    at t, total fertility at t, area fixed effects, and treatment-year fixed
    effects. Use country-clustered small-sample covariance and two-sided
    Student t inference with retained area count minus one degrees of freedom.
    Never search lags, controls, subgroups, estimator, or endpoint after a fit.
falsification:
  rule: >-
    INCONCLUSIVE if fewer than 500 complete area-year pairs, fewer than 40
    retained areas, fewer than eight complete treatment years in any retained
    area, or primary coefficient/clustered uncertainty is unidentified or
    nonfinite. Otherwise SUPPORTED only if the remittance coefficient is at
    most -0.2 percentage points of LFP per one percentage point of GDP and
    its two-sided p is at most 0.00625. REFUTED if the lower endpoint of the
    99.375% country-clustered interval is greater than -0.2, excluding the
    registered meaningful-negative effect. Every other estimable result is
    PARTIAL. No other outcome can replace this primary test.
  test: fixed_country_holdout_remittance_share_next_year_male_prime_age_lfp_level_fe
  threshold:
    family_id: simple_measured_legacy_pair_screen_2026_10_09
    family_size: 8
    family_alpha: 0.05
    family_p_max: 0.00625
    meaningful_negative_pp_per_pp: -0.2
    expected_sign: '-'
