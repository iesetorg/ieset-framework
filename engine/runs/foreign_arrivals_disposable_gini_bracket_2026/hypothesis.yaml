prior_confidence: 0.4
disclosure: >
  Descriptive calibration only. FOR_STLS includes stateless people and is not
  foreign-born or net migration. Eurostat Gini is all-resident equivalised
  disposable income, and survey timing is an income-reference approximation.
  Immigration responds to economic conditions; this is not a migration,
  welfare-policy, or immigrant-specific causal effect. No position, featured,
  or school-score credit.
