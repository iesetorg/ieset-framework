hypothesis_id: wdi_secondary_enrolment_fertility_decade_followthrough_2026
version: 1
status: pre_registered
topic: labour
claim_direction: '-'
claim: Across three nonoverlapping ten-year windows, countries with a larger preceding five-year increase
  in gross secondary school enrolment predict a larger proportional decline in total fertility over the
  following decade, conditional on baseline fertility and real income per person.
methodology_note: Prospective one-test descriptive calibration selected from WDI schooling and real-income
  values plus fertility country-year keys only. Fertility values, null masks, model estimates, and coefficient
  signs were not opened before registration. The 168-row key roster is an upper bound, not a completed
  panel.
evidence_type: associational
