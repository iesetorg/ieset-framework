  period:
  - 1990
  - 2020
  temporal_structure: panel
  exclusion_rules:
  - Use only the immutable key-only roster at anchor years 1990, 2000, and 2010. Exclude non-ISO aggregate
    rows. Require exact schooling values at t−5 and t, exact real-GDP-per-person value at t, and fertility
    country-year keys at t and t+10.
  - Before fertility-value access, schooling endpoints must be finite in [0,150] percent, their five-year
    difference at most 40 points in absolute value, real GDP per person finite and positive, and each
    country must appear in at least two anchor windows.
  - Only after the separate source-lock commit, require both fertility endpoints finite and in [0.5,10]
    births per woman. Drop invalid pairs and then countries with fewer than two complete windows. No trimming
    on the observed fertility change.
  - Do not interpolate, substitute nearby years, change caps, add controls, choose windows based on fertility
    values, or recode any country after outcome access. Source files have blank observation-status cells,
    so no cell-level break-screening claim is made.
variables:
  treatment:
  - name: secondary_gross_enrolment_five_year_change_pp
    source: world_bank_wdi:SE.SEC.ENRR
    transformation: Gross both-sex secondary school enrolment percent in t minus t−5, percentage points;
      levels 0–150 and absolute change at most 40.
    notes: Education exposure proxy, not an education policy treatment, female enrolment, or completion
      measure.
  outcome:
  - name: total_fertility_ten_year_log_change
    source: world_bank_wdi:SP.DYN.TFRT.IN
    transformation: Natural log of total births per woman at t+10 divided by the level at t.
    notes: National total fertility estimate; selected values and missingness remain sealed until the
      separate source lock is committed.
  controls:
  - name: baseline_log_total_fertility
    source: world_bank_wdi:SP.DYN.TFRT.IN
    transformation: Natural log of total fertility at t.
  - name: baseline_log_real_gdp_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of constant-price real GDP per person at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - anchor_year
  clustering: country
  notes: OLS of ten-year log fertility change on prior five-year gross-secondary-enrolment change, baseline
    log fertility, baseline log real GDP per person, country effects, and anchor-year effects. Country-cluster
    CR1 covariance; two-sided Student t with G−1 country degrees of freedom; 99% confidence interval.
    The three outcome decades do not overlap.
falsification:
  test: wdi_secondary_enrolment_fertility_2026_10_10
  rule: INCONCLUSIVE if exact-source, chronology, complete-case (140 rows/60 countries), material-schooling-change
    (65 rows/45 countries), two-complete-window, residual-treatment concentration (top 1% <=30%, largest
    country <=20%), full-rank, or finite-positive country-cluster uncertainty gates fail. SUPPORTED iff
    beta <= -0.003 ten-year log fertility point per +1 gross enrolment point and two-sided p <= 0.01.
    REFUTED iff beta >= +0.003 with the same p cutoff. Otherwise PARTIAL if estimable. This is one fixed
    descriptive test and has no score credit.
  threshold:
    family_id: wdi_secondary_enrolment_fertility_2026_10_10
    family_size: 1
    family_alpha: 0.01
    p_max_two_sided: 0.01
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.003
