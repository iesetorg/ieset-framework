prior_confidence: 0.4
disclosure: The old PARTIAL label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Regulatory-quality perceptions are not observed price signals, and a services employment share does not measure reallocation speed or job quality. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
