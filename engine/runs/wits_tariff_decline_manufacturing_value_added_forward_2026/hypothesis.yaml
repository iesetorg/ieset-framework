        manifest_sha256: a571d660fd359d245176b77e595b59923a90a1e40a799ea56c13f001a7b09945
    causal_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.35
disclosure: Cheaper imported machinery and components could raise domestic manufacturing value added;
  the share also depends on other sectors. Applied import-weighted tariff changes are endogenous to import
  composition, development and existing trade performance. This cross-country association cannot be read
  as a policy effect. The prior IESET archive-wide search and correlated four-endpoint family limit independent
  evidential weight.
