limitations:
- National food availability is not individual intake and may not reach disadvantaged
  households.
- FAO child outcomes are modeled UNICEF/WHO/World Bank estimates; women’s anemia is
  a WHO estimate. Values and trend revisions are not independent direct survey observations
  at each year.
- Income, infections, water, sanitation, care, health services, demographic change,
  reverse trends and unmeasured shocks confound the association.
- The eight cases share predictors, endpoints and a single FAOSTAT vintage. They are
  correlated local calibrations, not eight independent experiments; the family correction
