hypothesis_id: nominal_eer_trade_open_inflation_holdout_v2
version: 1
status: pre_registered
topic: monetary
claim_direction: '-'
claim: In the fixed 20-country sample excluded from the old real-EER screen, a larger annual appreciation of the BIS nominal broad effective exchange-rate index at year t predicts lower consumer-price inflation at exact year t+1 more strongly where trade (exports plus imports) is a larger share of GDP at t, conditional on inflation and real GDP growth at t and country and treatment-year effects.
methodology_note: New-ID, country-disjoint measured-association follow-up to bis_reer_appreciation_trade_open_disinflation_panel. The historical REER interaction result was PARTIAL (coefficient -0.0009935, p=0.257, 1230 observations, 41 countries) and was known before this design. The historical fitted-country roster is fully excluded. BIS nominal EER is chosen to avoid placing CPI in the predictor through real-EER construction. This single-test family fixes the two-sided cutoff at 0.01 before any held-out magnitudes are examined. Screening inspected country/year keys and earlier null masks, but not held-out magnitudes, signs, or fits. No school score credit.
evidence_type: associational
sample:
  countries: &id001
  - ARE
  - ARG
  - BGR
  - BIH
  - CYP
  - DZA
  - EST
  - HRV
  - ISL
  - LTU
  - LVA
  - MAR
  - MKD
  - MLT
  - PER
  - PHL
  - ROU
  - SRB
  - SVK
  - SVN
  period:
  - 2000
  - 2022
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude every country in the historical old specification: AUS AUT BEL BRA CAN CHE CHL CHN COL CZE DEU DNK ESP FIN FRA GBR GRC HKG HUN IDN IND IRL ISR ITA JPN KOR LUX MEX MYS NLD NOR NZL POL PRT RUS SAU SGP SWE THA TUR USA ZAF.'
  - Use only the frozen 20-country roster above; no replacement countries or aggregate areas.
  - For each year t, require at least 10 finite positive monthly BIS nominal broad EER observations in t and t-1; compute each annual arithmetic mean before the 100 x log ratio.
  - Join WDI trade share, CPI inflation, and real GDP growth in exact year t to CPI inflation in exact year t+1. Require at least five complete treatment years per country; no interpolation, imputation, nearest-year substitution, or vintage switch.
  - Retain all finite CPI inflation values in the primary fit, including high-inflation years; no outcome-based trimming.
variables:
  outcome:
  - name: next_year_cpi_inflation_pct
    source: world_bank_wdi:FP.CPI.TOTL.ZG
    transformation: Observed WDI consumer-price inflation at exact calendar year t+1, in percentage points.
  treatment:
  - name: nominal_broad_eer_appreciation_pct
    source: bis:WS_EER
    transformation: 100 x log(annual mean monthly nominal broad EER index at t / annual mean at t-1); BIS M.N.B country series, at least 10 finite positive months in each year.
  - name: trade_share_pct_gdp_at_t
    source: world_bank_wdi:NE.TRD.GNFS.ZS
    transformation: Observed WDI exports plus imports as percent of GDP at t; in the interaction scale as (share - 100)/100.
  controls:
  - name: cpi_inflation_at_t
    source: world_bank_wdi:FP.CPI.TOTL.ZG
    transformation: Observed WDI consumer-price inflation at exact year t.
  - name: real_gdp_growth_at_t
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: Observed WDI real GDP annual growth percent at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Primary coefficient is nominal_broad_eer_appreciation_pct x ((trade_share_pct_gdp_at_t - 100)/100). OLS includes both main effects, contemporaneous CPI and real GDP growth, country and treatment-year fixed effects, and country-clustered standard errors. One predeclared complete-case fit; no automatic control dropping, model search, post-result sign change, or alternate source selection.
falsification:
  rule: INCONCLUSIVE if fewer than 400 complete treatment-year pairs, fewer than 20 countries, fewer than five complete years for any retained country, or the primary coefficient or country-clustered uncertainty is unidentified or nonfinite. Otherwise SUPPORTED if the interaction coefficient is negative at two-sided p<=0.01; REFUTED if positive at the same cutoff; every other estimable result is PARTIAL. The single primary test is the full family and no additional tested variants earn a verdict.
  test: country_disjoint_nominal_eer_trade_interaction_panel_fe
  threshold:
    family_id: nominal_eer_trade_open_inflation_holdout_2026_10_09
    family_size: 1
    family_alpha: 0.01
    family_p_max: 0.01
    expected_sign: '-'
    min_observations: 400
    min_countries: 20
    min_pairs_per_country: 5
    min_nonnull_months_per_eer_year: 10
