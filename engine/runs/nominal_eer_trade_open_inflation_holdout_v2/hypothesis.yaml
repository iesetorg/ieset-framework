disclosure: This tests a measured lagged association, not exchange-rate policy, import-price pass-through, or causality. The old real-EER result was known and PARTIAL; this design changes the measure to nominal EER and excludes the whole old 42-country roster. BIS nominal broad EER is a trade-weighted currency index; WDI trade share is total exports plus imports relative to GDP and is an imperfect measure of import exposure. Euro-area members share a currency, reducing independent shock variation; monetary responses, energy prices, and prior inflation may confound the association. Source vintages can overlap IESET studies other than the named old fit. Selection inspected key coverage and null masks only for held-out data; old result magnitudes were known. The test is descriptive calibration only, with no welfare, school, or policy-score credit.
