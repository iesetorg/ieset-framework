prior_confidence: 0.50
disclosure: >-
  WGI regulatory quality is a broad perception-based governance composite,
  not a housing-regulation measure. Real house-price growth can reflect
  income, credit, migration, and demand. This lagged panel association cannot
  identify zoning, affordability, a policy effect, or causal direction. The
  prior same-commit proxy results and reused BIS observations confer no
  independent support or school-score credit.
