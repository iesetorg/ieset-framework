hypothesis_id: regulatory_quality_labor_participation_geographic_holdout_v2
version: 1
status: pre_registered
topic: labour
claim: Among countries excluded from the old 40-country fit, a higher WGI regulatory-quality estimate
  at year t predicts higher labor-force participation at exact t+1, conditional on starting income,
  rule of law, and country and year effects.
claim_direction: +
methodology_note: New-ID measured-association follow-up to portable_benefits_market_flexibility. Its
  old same-commit PARTIAL result and broad mechanism claim were visible before design. The old runner
  at e786a95e676c9d6283c123682d43bf54dbacd73b restricted estimation to the fixed 40-country specification;
  all 40 are excluded here, including any with no old fitted rows. The new claim uses only the directly
  measured indicators. This fixed eight-test family uses source-pinned exact next-year outcomes and
  a Bonferroni decision rule. A country/year-key-only screen found an upper envelope of 4175 pairs
  and 167 countries for this design, without opening held-out values or null masks; complete-case
  coverage remains unknown. Vintages and eligible countries can overlap other IESET studies. No policy
  mechanism, causal effect, or school-score credit is claimed.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period: &id001
  - 1996
  - 2023
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all 40 countries in the historical old specification: ARG AUS BGD BRA CAN CHL CHN COL
    DEU DNK EGY ESP EST FIN FRA GBR IDN IND ITA JPN KEN KOR LKA MAR MEX MYS NGA NLD NOR NZL PAK PER
    PHL POL SWE THA TUR USA VNM ZAF.'
  - Retain ISO 3166-1 alpha-3 country codes only; no WDI aggregates or old-country rows.
  - Join treatment and controls at exact t to outcome at exact t+1; require complete finite values
    and at least five usable treatment years per country.
  - For natural-log measures require positive source values; do not impute, interpolate, or substitute
    a nearest year.
variables:
  outcome:
  - name: next_year_labor_force_participation_pct
    source: world_bank_wdi:SL.TLF.CACT.ZS
    transformation: level at exact t+1
  treatment:
  - name: regulatory_quality_estimate
    source: wgi:GOV_WGI_RQ.EST
    transformation: level at treatment year t
  controls:
  - name: log_income
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive real GDP per person at t
  - name: rule_of_law
    source: wgi:RL.EST
    transformation: level at t
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One fixed primary coefficient with country and treatment-year effects, country-clustered
    uncertainty, no automatic covariate dropping, and an eight-test Bonferroni rule.
falsification:
  rule: If fewer than 800 complete country-year pairs or 50 countries survive the five-year rule,
    or if the country-clustered estimate or uncertainty is unidentified or nonfinite, return INCONCLUSIVE.
    Otherwise SUPPORT requires a positive coefficient at two-sided p <= 0.10/8; REFUTATION requires
    an negative coefficient at the same threshold. Every other estimable result is PARTIAL. Apply
    this rule equally to adverse and favorable results.
  test: country_disjoint_exact_next_year_panel_fe
  threshold:
    family_id: third_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 8
    family_alpha: 0.1
    family_p_max: 0.0125
    expected_sign: +
    min_observations: 800
    min_countries: 50
    min_pairs_per_country: 5
    old_hypothesis_id: portable_benefits_market_flexibility
    old_result_bucket: PARTIAL
