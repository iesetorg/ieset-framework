  period:
  - 2006
  - 2019
  temporal_structure: panel
  exclusion_rules:
  - Use only the fixed treatment-year roster t=2007..2018, exact year t-1 and t arrivals, and exact outcome
    t and t+1. No interpolation or nearest-year joins.
  - Exclude non-ISO3 WDI aggregates; require positive arrival counts and real GDP per person, and absolute
    log arrivals growth no more than 0.30.
  - Require finite endpoint values and blank or A WDI observation status. Apply the registered outcome-specific
    plausibility bounds. Keep only countries with at least five complete treatment years.
  - Do not change countries, dates, controls, endpoint definitions, outcome bounds, sample floors, or
    estimator after selected values are read.
variables:
  outcome:
  - name: services_one_year_forward_change
    source: world_bank_wdi:NV.SRV.TOTL.ZS
    transformation: t+1 value minus t value in percentage points
    notes: Services share can rise when other sectors shrink, even if tourism activity does not expand.
  treatment:
  - name: annual_log_inbound_arrival_change
    source: world_bank_wdi:ST.INT.ARVL
    transformation: log(inbound trips at t) minus log(inbound trips at t-1)
    notes: Trips, not distinct visitors, visitor nights, receipts, or domestic tourism.
  controls:
  - name: services_baseline_t
    source: world_bank_wdi:NV.SRV.TOTL.ZS
    transformation: t-year outcome level in the same endpoint units
  - name: log_real_gdp_pc_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive t-year real GDP per person
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS of next-year outcome change on annual log arrival change, baseline outcome and log GDP per
    person, plus country and treatment-year effects. Country-cluster CR1 covariance and two-sided Student
    t(G-1). Full-rank, finite uncertainty, and residualized-exposure concentration gates apply.
falsification:
  test: wdi_tourism_response_six_outcome_family_2026_10_10_services
  rule: INCONCLUSIVE if any source, complete-case (300/25), material-exposure (60/20), five-year-country,
    full-rank, concentration, or finite-cluster-uncertainty gate fails. SUPPORTED iff beta >= +0.5 percentage
    points per one log-point arrivals growth and two-sided p <= 0.01/6. REFUTED iff beta <= -0.5 at the
    same cutoff. Otherwise PARTIAL if estimable. All six tests remain in the Bonferroni denominator.
  threshold:
    family_id: wdi_tourism_response_six_outcome_family_2026_10_10
    family_size: 6
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0016666666666666668
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.5
    meaningful_beta_unit: percentage points
    min_complete_rows: 300
    min_complete_countries: 25
    min_material_rows: 60
    min_material_countries: 20
    material_abs_log_change: 0.1
    max_abs_treatment_log_change: 0.3
    min_complete_years_per_country: 5
    max_top_country_residualized_exposure_share: 0.2
    roster_sha256: 018d735c2c6be4687db392b07e1872f6e5cb5fb6c8f50354f7a54f4dad09ff61
    source_lock_path: data/pinned_evidence/wdi_tourism_response_six_outcome_2026.manifest.json
    causal_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    featured_eligible: false
prior_confidence: 0.3
disclosure: The prior WDI-arrivals to OECD youth employment test is a separate directed pair; its verdict
  is not inherited. Services share can rise when other sectors shrink, even if tourism activity does not
  expand. Reverse timing, exchange rates, global demand, air capacity, national measurement changes and
  coincident policies can confound the response. This is descriptive calibration only, with zero causal,
  policy, school, position, or featured credit.
