hypothesis_id: tourism_arrivals_services_share_response_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: In the frozen 2007–2018 country-year roster, stronger annual growth in inbound international arrival
  trips from t-1 to t predicts a larger one-year-forward increase in services value-added share of GDP
  from t to t+1, after country and year effects, baseline outcome, and income control.
methodology_note: Prospective six-test descriptive response family. Registration uses only country/year
  source keys, schema, and fetch-manifest hashes; the WDI grid includes missing-value rows. Raw numeric
  source files are copied into the isolated checkout and committed after registration, then their selected
  values are opened for one locked run. The six endpoints are distinct response margins but share exposure,
  countries, and archive context.
evidence_type: associational
