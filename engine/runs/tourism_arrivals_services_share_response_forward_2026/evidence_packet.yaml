limitations:
- International arrivals count inbound trips, not distinct people, spending, nights,
  or domestic tourism; country methods can change.
- Global demand, currencies, airline supply, security, policies, and domestic growth
  can jointly shift arrivals and outcomes.
- The adult employment ratio is ILO-modelled, and registrations cover formal limited-liability
  entities rather than all businesses or jobs.
- Fixed-investment share includes public and private capital; a services share can
  rise because other sectors shrink.
- Country and year effects, baseline outcomes, and forward timing do not identify
  a causal effect of tourism or policy.
- Six tests share treatment and many country-years; Bonferroni is within-family and
  does not adjust the broader IESET archive search.
- The family was selected after a visible SUPPORTED OECD youth-employment tourism-arrivals
  result; this informed selection of the exposure.
- No causal, school, policy, position, or featured credit is assigned.
