# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: oecd_migrant_tertiary_employment_gap_epl_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: "+"
claim: >-
  Within the frozen 31-country OECD panel, an increase in regular-worker
  employment protection from t-1 to t predicts a larger native-born minus
  foreign-born tertiary employment-rate gap from t to t+1.
methodology_note: >-
  Prospective descriptive calibration registered before the OECD employment
  or EPL value columns and their missingness were opened for this study.
  The exact key-only roster, source pins, estimator, and gates are frozen in
  engine/audits/oecd_migrant_epl_prereg_2026-10-09.md. Related OECD migrant
  employment and EPL unemployment tests were visible before registration.
evidence_type: associational
sample:
  countries: [AUT, BEL, CAN, CHE, CZE, DEU, DNK, ESP, EST, FIN, FRA, GBR, GRC, HUN, IRL, ISL, ISR, ITA, LTU, LUX, LVA, MEX, NLD, NOR, NZL, POL, PRT, SVK, SVN, SWE, USA]
  period: [2015, 2023]
  temporal_structure: panel
  exclusion_rules:
    - Use the exact committed 265-row country-year roster and 35-name EPL country crosswalk; exclude EU aggregates and countries with fewer than three key-only candidate years.
    - Select only annual OECD migration employment rates for total sex, tertiary ISCED11_5T8, total citizenship, foreign-born and native-born, PT_POP_SUB units.
    - Require EPL EPR_V1 at t-1 and t and both birth-place employment rates at t and t+1; do not interpolate or backfill.
    - After source lock, drop only roster rows with nonfinite or out-of-range selected values, then drop countries with fewer than three complete rows.
variables:
  outcome:
    - name: next_year_native_minus_foreign_tertiary_employment_gap_change_pp
      source: oecd:OECD.ELS.IMD,DSD_MIG@DF_MIG_EMP_EDU,1.0
      transformation: (NB-FB employment rate at t+1) minus (NB-FB employment rate at t)
      notes: OECD employment-rate population comparison in percentage points; not migrant flows, an arrival-cohort effect, or tertiary attainment share.
  treatment:
    - name: regular_worker_epl_index_change
      source: oecd:OECD.ELS.EMP,DSD_EPL_OV@DF_EPL_OV,1.0
      transformation: EPR_V1 at t minus EPR_V1 at t-1
      notes: Official OECD workbook EPR Version 1, 0 to 6 and higher means stricter regular-worker protection; not immigration policy.
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: >-
    OLS of forward gap change on prior-year EPL change with country and year
    categorical effects. Country-cluster CR1 finite correction and two-sided
    Student t with G-1 degrees of freedom. One primary endpoint and model.
    A pandemic-window exclusion (t=2019-2021) is diagnostic only.
falsification:
  test: oecd_migrant_tertiary_employment_gap_epl_forward_fe
  rule: >-
    INCONCLUSIVE if source or roster custody fails, fewer than 200 valid rows
    or 25 countries remain after the predeclared complete-case and minimum
    three-year country rules, fewer than 10 countries or 20 country-years have
    |EPL change| >=0.05, or the fixed-effect design/cluster uncertainty is
    invalid. Otherwise SUPPORTED only if beta >=+1.0 percentage point of gap
    change per one full EPL index point and two-sided country-cluster p<=0.005;
    REFUTED only if beta <=-1.0 and p<=0.005. All other estimable results are
    PARTIAL. The pandemic exclusion cannot change the primary verdict.
  threshold:
    p_max_two_sided: 0.005
    absolute_pp_effect_min: 1.0
    min_valid_rows: 200
    min_valid_countries: 25
    min_years_per_country: 3
    min_changing_countries: 10
    min_change_rows: 20
    minimum_epl_change_for_variation: 0.05
    expected_key_rows: 265
    expected_key_countries: 31
    roster_sha256: ac9afc86da547c01e9dc11b73e628f5d147e1be4ef7636196f0fb253ad43b8e5
    crosswalk_sha256: 9bc900291ab4ecb0764397964ff4c762b6dfa03adb640c491a136f0c0b1253f3
    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    source_files:
      outcome:
        path: data/vintages/oecd/OECD.ELS.IMD_DSD_MIG_DF_MIG_EMP_EDU_1.0@2026-07-23T150450Z.parquet
        sha256: 96b522cb77e78684c050d96efb7412489773b735243d6ada537e757817c25536
        manifest: data/manifests/fetch_run_2026-07-23T150922Z.yaml
      treatment:
        path: data/vintages/oecd/OECD.ELS.EMP_DSD_EPL_OV_DF_EPL_OV_1.0@2026-07-23T154113Z.parquet
        sha256: 8a25f91e01153564e8db18723e69ed41298c339255a6ac41b67942dc86022fcd
        manifest: data/manifests/fetch_run_2026-07-23T154936Z.yaml
prior_confidence: 0.4
disclosure: >-
  This is an ecological country-panel association, not an identified causal
  policy effect. EPL can respond to employment conditions, foreign-born
  tertiary populations change composition, and COVID-era employment shocks
  can differ by birth place. The archived Australia foreign-born employment
  comparison and multiple EPL unemployment studies were visible. Some old
  migration specs incorrectly use this employment-rate feed as tertiary
  attainment or migrant-share data; this study uses its actual measured
  dimensions. The p<=0.005 cutoff is a conservative local screen, not a
  correction for the full visible research search. Zero causal, policy,
  school, or featured credit.
steelman: hypotheses/steelman/oecd_migrant_tertiary_employment_gap_epl_forward_2026.md
scope:
  period: [2015, 2023]
  countries: [OECD]
  outcome_dim: [demographics_migration, employment_labour]
  policy_family: [none]
  treatment_tags: []
covers_claims: []
linked_hypotheses: []
linked_conditions: []
