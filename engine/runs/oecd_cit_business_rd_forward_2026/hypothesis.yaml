disclosure: Descriptive calibration only. The prior archive includes a CIT-as-outcome tax competition
  test, FDI studies with other treatments, an R&D-as-treatment screen, a corporate-tax investment
  placeholder and proxy. Exact CIT-to-these-outcome pairings were absent, but this is not an independent
  archive-wide holdout. BERD can include publicly funded business-sector R&D, and GDP denominator
  changes can move BERD intensity without a change in R&D volume. Tax changes and outcomes may respond
  to shared macro shocks. No causal, policy, school, or featured credit.
