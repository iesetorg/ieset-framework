  - ROU
  - SRB
  - SVK
  - SVN
  - SWE
  - TUR
  - USA
  period:
  - 2001
  - 2017
  temporal_structure: panel
  exclusion_rules:
  - Use only the committed key roster, which requires tax rates at t-1 and t and the exact outcome
    series at t and t+2; no nearest-year join, imputation, country substitution, or window extension.
  - Retain countries with at least five key-only candidate years, then at least five complete measured
    pairs; keep zero-change tax years in the regression.
  - OECD treatment is combined statutory CIT_C/ST from DSD_TAX_CIT@DF_CIT with key .A.CIT_C.ST......;
    finite tax percentages in [0,100].
  - Eurostat outcome requires freq=A, sectperf=BES, unit=PC_GDP; map EL to GRC and UK to GBR, map
    other named ISO2 geos to ISO3, and exclude EA20, EA21, EU27_2020, CN_X_HK.
  - After the separate source-lock commit, keep only finite BERD values in [0,100] at both endpoints.
variables:
  treatment:
  - name: combined_statutory_cit_annual_change_pp
    source: oecd_taxstruct:combined_corporate_income_tax_rate
    transformation: OECD combined statutory CIT rate at t minus rate at t-1, in percentage points.
    notes: Headline central-plus-subcentral statutory rate, not effective tax burden or an R&D tax
      incentive.
  outcome:
  - name: business_performed_rd_share_two_year_forward_change_pp
    source: eurostat:rd_e_gerdtot
    transformation: Selected annual freq=A, sectperf=BES, unit=PC_GDP value at t+2 minus its value
      at t, in GDP-share percentage points.
    notes: BERD is R&D performed by business enterprises regardless of funder; Eurostat raw slice
      retains no observation-status flags.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One OLS coefficient for tax-rate change against two-year forward outcome change; country
    and treatment-year fixed effects, country-cluster CR1, two-sided Student t(G-1). No covariate,
    lag, window, source, or exclusion search.
falsification:
  test: oecd_cit_berd_fdi_forward_2026_10_10
  rule: INCONCLUSIVE if source/roster, complete-case, five-year-country, material-tax-change, full-rank,
    or cluster-uncertainty gate fails. SUPPORTED only if beta <= -0.02 BERD/GDP percentage point per
    +1 statutory CIT percentage point and two-sided p <= 0.005; REFUTED only if beta >= +0.02 at the
    same cutoff; otherwise PARTIAL when all estimator floors pass. Both cases remain in one Bonferroni
    family even if the other is inconclusive.
  threshold:
    family_id: oecd_cit_berd_fdi_forward_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.02
