limitations:
- The OECD combined statutory CIT rate is a headline central-plus-subcentral rate,
  not an effective marginal/average tax burden or an R&D tax incentive.
- Eurostat BERD is R&D performed in the business-enterprise sector regardless of who
  funds it; the selected raw series has no observation-status flags.
- WDI FDI net inflows as a share of GDP are balance-of-payments flows, may be negative
  or volatile, and do not isolate greenfield investment.
- Both outcomes are GDP shares, so denominator changes can create common movement
  unrelated to investment or R&D decisions.
- Country/year effects and temporal ordering do not identify a causal tax or policy
  effect; tax reforms and investment may respond to shared shocks.
- The two-test Bonferroni correction is local to this prospectively registered batch,
  not to the visible IESET archive.
- No result receives school, policy, causal, or featured credit.
