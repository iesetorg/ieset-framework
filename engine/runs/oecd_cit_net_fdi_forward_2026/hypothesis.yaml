  exclusion_rules:
  - Use only the committed key roster, which requires tax rates at t-1 and t and the exact outcome
    series at t and t+2; no nearest-year join, imputation, country substitution, or window extension.
  - Retain countries with at least five key-only candidate years, then at least five complete measured
    pairs; keep zero-change tax years in the regression.
  - OECD treatment is combined statutory CIT_C/ST from DSD_TAX_CIT@DF_CIT with key .A.CIT_C.ST......;
    finite tax percentages in [0,100].
  - WDI outcome requires indicator BX.KLT.DINV.WD.GD.ZS and nonempty three-letter country ISO3; exclude
    blank-code income aggregates; require blank obs_status at both endpoints.
  - After the separate source-lock commit, keep only finite FDI net inflow percentages at both endpoints;
    negative values remain valid, with no winsorization.
variables:
  treatment:
  - name: combined_statutory_cit_annual_change_pp
    source: oecd_taxstruct:combined_corporate_income_tax_rate
    transformation: OECD combined statutory CIT rate at t minus rate at t-1, in percentage points.
    notes: Headline central-plus-subcentral statutory rate, not effective tax burden or an R&D tax
      incentive.
  outcome:
  - name: net_fdi_inflows_share_two_year_forward_change_pp
    source: world_bank_wdi:BX.KLT.DINV.WD.GD.ZS
    transformation: Annual WDI net FDI inflows (% of GDP) at t+2 minus its value at t, in GDP-share
      percentage points.
    notes: Balance-of-payments net FDI flows may be negative and are not greenfield investment. Require
      blank observation-status at both endpoints.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One OLS coefficient for tax-rate change against two-year forward outcome change; country
    and treatment-year fixed effects, country-cluster CR1, two-sided Student t(G-1). No covariate,
    lag, window, source, or exclusion search.
falsification:
