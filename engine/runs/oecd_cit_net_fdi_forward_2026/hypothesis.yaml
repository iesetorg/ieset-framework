  rule: INCONCLUSIVE if source/roster, complete-case, five-year-country, material-tax-change, full-rank,
    or cluster-uncertainty gate fails. SUPPORTED only if beta <= -0.2 net-FDI/GDP percentage point
    per +1 statutory CIT percentage point and two-sided p <= 0.005; REFUTED only if beta >= +0.2 at
    the same cutoff; otherwise PARTIAL when all estimator floors pass. Both cases remain in one Bonferroni
    family even if the other is inconclusive.
