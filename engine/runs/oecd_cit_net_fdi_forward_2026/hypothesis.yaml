claim_direction: '-'
claim: Across the fixed pre-pandemic panel, a larger reduction in the OECD combined statutory corporate
  income tax rate from t-1 to t predicts a larger increase in WDI foreign direct investment net inflows
  as a share of GDP from t to t+2.
methodology_note: 'Prospective descriptive two-outcome family committed before Eurostat BERD or WDI
  FDI outcome values, null masks, or FDI status were opened. Only source dimensions/keys, hashes/manifests,
  OECD CIT exposure values, and visible earlier hypothesis text informed this registration. Frozen
  contract: engine/audits/oecd_cit_berd_fdi_family_prereg_2026-10-10.md.'
