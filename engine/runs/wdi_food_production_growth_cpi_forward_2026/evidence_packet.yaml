limitations:
- The FAO/WDI food index measures price-weighted production volume, not local retail
  availability or food prices.
- The outcome is broad CPI inflation, not a food-price subindex; food can be exported,
  imported, stored or wasted.
- Trade, global food and energy prices, weather, currencies, demand and policy responses
  can confound both series.
- The [-20,50] CPI and +/-30 log-point food-growth eligibility bounds limit inference
  to a moderate-inflation panel.
- Country/year effects, prior inflation and GDP growth, and forward timing do not
  identify a causal supply or policy effect.
- This family was selected after related archive results were visible; its p cutoff
  does not correct archive-wide selection.
- No causal, policy, school, position or featured credit is assigned.
