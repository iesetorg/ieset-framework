# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: trade_openness_patent_filings_holdout_v2
version: 1
status: pre_registered
topic: trade
claim_direction: +
claim: Among countries excluded from the old innovation-diffusion study, a higher goods-and-services trade share of GDP at year t predicts more resident patent applications per million people at exact year t+1, conditional on baseline real income per person and country and treatment-year effects.
methodology_note: New-ID country-disjoint measured-association follow-up to trade_openness_patent_diffusion_panel. Its archived same-commit PARTIAL result was known before this registration and is not prospective evidence. The historical old runner restricted fitted rows to the explicit old country roster, all excluded here. Five fixed tests share a two-sided Bonferroni cutoff of 0.02. The expected sign is set from this new measured claim, not the old parser. Descriptive calibration only, with zero school score credit.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period: &id001
  - 1996
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all countries in the historical old specification: ARG AUS AUT BEL BRA CAN CHE CHL CHN COL CZE DEU DNK ESP FIN FRA GBR HUN IDN IND IRL ISR ITA JPN KOR MEX MYS NLD NOR NZL PER PHL POL PRT SGP SWE THA TUR USA VNM ZAF.'
  - Retain ISO 3166-1 alpha-3 countries and XKX only; exclude aggregates and every old-roster row before fitting.
  - Use exact treatment-year and next-year records, at least five usable treatment years per country, and no interpolation, imputation, nearest-year substitution, country replacement, or vintage switch.
  - Require nonnegative patent counts or installed capacity where used, positive population and real-income values where logged, and finite primary inputs.
variables:
  outcome:
  - name: next_year_log_one_plus_resident_patent_applications_per_million
    source: wipo:patent_applications_resident
    transformation: Natural log of 1 plus nonnegative resident patent applications at exact t+1 per million positive residents at exact t+1.
  - name: population_denominator
    source: world_bank_wdi:SP.POP.TOTL
    transformation: Positive total population at exact outcome year t+1.
  treatment:
  - name: goods_and_services_trade_pct_gdp
    source: world_bank_wdi:NE.TRD.GNFS.ZS
    transformation: Level at treatment year t.
  controls:
  - name: log_real_gdp_pc_at_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One prespecified primary OLS coefficient with country and treatment-year effects and country-clustered uncertainty; baseline log real income is the only covariate. Fixed complete-case sample, no automatic control dropping, model search, or post-result sign change.
falsification:
  rule: If fewer than 400 complete treatment-year pairs or 35 countries survive the five-year rule, or the primary estimate or clustered uncertainty is unidentified or nonfinite, return INCONCLUSIVE. Otherwise SUPPORT requires the expected-sign coefficient at two-sided p<=0.10/5=0.02; REFUTATION requires the opposite-sign coefficient at the same cutoff. Every other estimable result is PARTIAL. All five fixed tests count in this Bonferroni family even if a test is inconclusive.
  test: country_disjoint_fifth_legacy_panel_fe
  threshold:
    family_id: fifth_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 5
    family_alpha: 0.1
    family_p_max: 0.02
    expected_sign: +
    min_observations: 400
    min_countries: 35
    min_pairs_per_country: 5
    old_hypothesis_id: trade_openness_patent_diffusion_panel
    old_result_bucket: PARTIAL
    old_n_obs: 917
    old_n_countries: 41
    old_spec_commit: 441b76cba266e45285ffc1e4bdc81dc303a88e29
    old_run_commit: 441b76cba266e45285ffc1e4bdc81dc303a88e29
    old_runner_filter_proof: At old_run_commit, scripts/run_panel_fe.py filter_sample restricts country_iso3 to spec.sample.countries before run_panel_ols. The entire old roster below is excluded, including any old countries without fitted rows.
    old_country_count: 41
