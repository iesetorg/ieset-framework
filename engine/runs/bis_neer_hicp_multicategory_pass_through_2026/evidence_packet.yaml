limitations:
- BIS broad nominal effective exchange rates use manufacturing-trade weights; the
  selected HICP baskets have different import shares and some include regulated or
  locally supplied items.
- Euro-area members share a currency, so national BIS EER changes are correlated despite
  different trade weights. Country and year fixed effects and two-way clustering do
  not identify an exchange-rate shock.
- Some selected groups include locally delivered services and regulated prices; they
  are distinct spending groups, not pure imported-goods baskets.
- The pinned Eurostat annual HICP Parquet retains no cell flags. Finite values are
  used without claiming break screening, method continuity, or independent price collection.
- Eurostat annual-average HICP change compares average monthly indices in year t+1
  with the prior year's average; it is not December-to-December inflation.
- A one-year lag establishes ordering, not causality. Import costs, energy and food
  commodity prices, excise taxes, domestic demand, monetary response, and pricing-to-market
  can confound the relation.
- The 20 COICOP groups do not nest each other, but their prices share shocks and source
  methodology. Bonferroni correction is local to this fixed family; archive-wide selection
  is not corrected.
- No causal, policy, school-score, position, or featured credit is permitted.
