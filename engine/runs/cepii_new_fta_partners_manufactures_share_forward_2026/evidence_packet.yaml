limitations:
- CEPII new-FTA-partner count is the positive part of a year-over-year change in coded
  active fta_wto partner count; it is not a count of newly signed treaties or tariff
  cuts.
- Partner coverage and coding can change without a policy shock, and several countries
  can share one regional agreement event.
- Manufactures share is a composition of merchandise exports; commodity prices and
  nonmanufactures exports can move its denominator.
- Selection into agreements, exchange rates, global demand, industrial policy and
  country-specific trends can confound the association.
- The baseline share is both the subtraction endpoint and a covariate; this does not
  remove regression-to-the-mean or starting-composition concerns.
- Related CEPII FTA to high-tech/WITS studies and a PDB to the same WDI outcome are
  visible; the 0.005 cutoff does not correct archive-wide selection.
- No causal, policy, school, position, or featured credit.
