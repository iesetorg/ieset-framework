hypothesis_id: regulatory_quality_electricity_access_country_holdout_v2
version: 1
status: pre_registered
topic: energy
claim_direction: '+'
claim: >-
  Among the fixed 167 country and territory codes excluded from the old
  infrastructure-pricing proxy screen, a higher WGI regulatory-quality point
  estimate at year t predicts a higher WDI population electricity-access
  percentage at exact t+1, conditional on real income per person, WGI rule of
  law, country effects, and treatment-year effects.
methodology_note: >-
  New-ID descriptive country-disjoint test of the measured WGI regulatory-quality
  and WDI electricity-access pair in infrastructure_user_pricing_quality. Its old
  same-commit PARTIAL result (988 pairs, 40 fitted countries) was visible before
  design. Regulatory quality is not a measure of user pricing or infrastructure
  maintenance; electricity access is not a maintenance-quality measure. All 40
  old-specification countries are excluded. A source-key-only screen found an
  upper envelope of 4175 exact-year pairs in the fixed 167-code roster without
  reading held-out values or null masks. The complete-case floor, source pins,
  estimator, and 84-screen Bonferroni rule are frozen before held-out fitting.
  The separate government-effectiveness/access registration shares this outcome,
  and the older natural-monopoly packet included these variables among several
  inputs; neither registered this primary RQ-to-next-year-access coefficient.
  No user-pricing, maintenance, causal, policy, or school-score credit is claimed.
evidence_type: associational
