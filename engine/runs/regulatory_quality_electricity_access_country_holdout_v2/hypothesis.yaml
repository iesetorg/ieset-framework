variables:
  outcome:
  - name: next_year_electricity_access_pct
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: population share with electricity access, percentage at exact t+1
  treatment:
  - name: regulatory_quality_estimate_t
    source: wgi:GOV_WGI_RQ.EST
    transformation: WGI regulatory-quality point estimate at exact t
  controls:
  - name: log_real_gdp_pc_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive real GDP per person at exact t
  - name: rule_of_law_t
    source: wgi:RL.EST
    transformation: WGI rule-of-law point estimate at exact t
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: >-
    One primary OLS coefficient for regulatory quality with country and treatment-year
    fixed effects, the two fixed controls, and country-clustered small-sample
    t(G-1) inference. No model search, automatic control dropping, or alternate verdict.
falsification:
  rule: >-
    INCONCLUSIVE if fewer than 800 complete pairs, fewer than 50 codes, fewer than
    five complete years for any retained code, or if the primary estimate or
    clustered uncertainty is unidentified or nonfinite. Otherwise SUPPORTED
    only for a positive coefficient at two-sided p<=0.1/84; REFUTED for a negative
    coefficient at that threshold; every other estimable result is PARTIAL.
    The Bonferroni family covers all 84 metadata-screened legacy source-pair
    opportunities, even if fewer run.
