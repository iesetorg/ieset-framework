disclosure: >-
  Electricity access is bounded and often near 100%, so ceiling effects may
  limit informative variation. The regulatory-quality estimate and access can
  respond jointly to development, geography, and institutions. A one-year lag
  and fixed effects do not identify a regulatory reform effect. The old
  user-pricing proxy result is retrospective and provides no prospective support.
