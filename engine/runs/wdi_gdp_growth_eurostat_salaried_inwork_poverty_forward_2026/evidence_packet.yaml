limitations:
- WDI real GDP growth is a national-accounts macro measure, not a policy treatment
  or exogenous shock.
- The WDI treatment obs_status column is blank and cannot certify country-specific
  method continuity.
- EU-SILC in-work poverty is relative to national median equivalised disposable income
  after transfers; absolute gains can leave the relative rate unchanged.
- The selected Eurostat parquet has no cell-status or method-break column; no result
  may be described as break-screened.
- UK and Ireland are excluded for historical income-reference-year exceptions; residual
