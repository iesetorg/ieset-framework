      outcome:
        path: data/vintages/oecd/DSD_LFS_DF_LFS_INDIC@2026-07-23T151216Z.parquet
        sha256: ac58f9ea05eb07e0d4696a81334021120cd679f58847a2fb32dc70e06074e6ae
        manifest: data/manifests/fetch_run_2026-07-23T151302Z.yaml
        manifest_sha256: 4952688fa8fbf62df91c20409bf4180b75977bc638bb33e2a00a267b3053b601
    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
prior_confidence: 0.3
disclosure: The positive Okun-type expectation is conventional, but age/sex-specific response sizes and
  a strict 20-test cutoff are uncertain. The 20 cells share the same exposure and shocks; their results
  are correlated and cannot be presented as independent replications. No causal, policy, school, position,
  or featured credit.
