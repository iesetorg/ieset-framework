limitations:
- SIPRI military expenditure and WDI gross fixed capital formation are both GDP shares; denominator changes
  can contribute to their movements.
- Gross fixed capital formation includes public and private assets and may include defense assets; it
  is not civilian public investment or a budget appropriation.
- Observed military spending changes are not exogenous budget shocks. Security threats, growth, fiscal
  capacity and accounting changes can confound the later association.
- The frozen 0–20 percent military level and 5-point change bounds focus on moderate budget movements
  and exclude some wars and crises.
- Four five-year windows share countries and data sources. One country/anchor fixed-effect test is one
  descriptive calibration, not four replications.
- The SIPRI vintage records no cell-level observation-status field; WDI observation-status cells do not
  establish within-country methodology continuity.
- The claim and negative prior follow visible fiscal crowding-out debates; the local 0.01 rule does not
  adjust for all IESET archive selection.
- No causal, policy, school, position or featured credit is assigned.
