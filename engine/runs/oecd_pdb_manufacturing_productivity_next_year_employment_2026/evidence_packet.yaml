limitations:
- Three sector cells share one OECD PDB vintage, country roster and design; they are one correlated family,
  not independent replications.
- Productivity growth uses real sector value added per hour; subsequent employment growth uses persons.
  Higher productivity can reflect demand, hours or measurement changes rather than labor-saving technology.
- The prior employment growth control and country/year effects do not identify a causal productivity effect,
  automation effect or policy intervention.
- The frozen OECD core and finite +/-50 growth bounds exclude some countries and extreme sector changes;
  no interpolation or source substitution is permitted.
- Sector choices and directional priors followed visibility of the older IESET archive; Holm adjustment
  covers only these three frozen tests, not archive-wide selection.
- No causal, policy, school, position or featured credit is assigned.
