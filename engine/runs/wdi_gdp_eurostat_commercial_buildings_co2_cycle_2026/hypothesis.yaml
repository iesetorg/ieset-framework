disclosure: Aggregate GDP growth is an imperfect proxy for activity in commercial and institutional fuel
  combustion. This same-year association cannot establish causation or a policy effect; Commercial floor
  area, building efficiency, heating weather, and electricity substitution can move on-site commercial/institutional
  fuel CO2 independently of GDP. The local Bonferroni rule does not correct archive-wide selection. No
  causal, policy, school-score, position, or featured credit.
