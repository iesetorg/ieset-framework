# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_gdp_eurostat_commercial_buildings_co2_cycle_2026
version: 1
status: pre_registered
topic: energy
claim_direction: +
claim: Among the frozen European national panel, higher WDI real GDP growth in calendar year t is associated
  with higher contemporaneous Eurostat/EEA direct-fuel CO2 emissions growth from t−1 to t in the non-nested
  CRF source category CRF1A4A (commercial and institutional fuel combustion).
methodology_note: Prospective 12-sector descriptive family. GDP-growth values and exact Eurostat categorical
  country/year keys for CRF1A4A were screened before registration; no selected Eurostat CO2 values, null
  masks, or fits were opened. The 664-row roster is a key-only upper bound. Every fixed sector stays in
  the 12-test denominator.
evidence_type: associational
sample:
  countries: &id001
  - AUT
  - BEL
  - BGR
  - CYP
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - FRA
  - GRC
  - HRV
  - HUN
  - IRL
  - ISL
  - ITA
  - LTU
  - LUX
  - LVA
  - MLT
  - NLD
  - NOR
  - POL
  - PRT
  - ROU
  - SVK
  - SVN
  - SWE
  period:
  - 1996
  - 2018
  temporal_structure: panel
  exclusion_rules:
  - Use only the immutable key roster for CRF CRF1A4A, Eurostat freq=A, unit=THS_T, airpol=CO2, and the
    frozen 29 national geo crosswalk. Require exact outcome keys in t−1 and t; no aggregate, alternate
    gas, unit, sector, or nearby-year substitution.
  - Use finite WDI real GDP-growth values for t=1996..2018 with |growth|≤15 percentage points. These are
    treatment-only eligibility rules frozen before any selected CO2 value or null is opened.
  - After the separately committed source lock, require both exact sector CO2 endpoints finite and strictly
    positive to define the log change. Do not infer that a zero means verified absence of emissions; Eurostat
    flags were not retained in this vintage. Never trim by observed CO2 change magnitude.
  - Keep only countries with at least ten complete annual pairs. Require at least 450 complete pairs in
    23 countries and 350 material |GDP growth|≥1 years in 23 countries. No interpolation, source substitution,
    adaptive controls, or post-result country exclusion.
variables:
  treatment:
  - name: real_gdp_growth_percent_t
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: Published real annual GDP growth in year t, percentage points, capped to absolute
      value at most 15.
    notes: Aggregate national growth is not sector output or a policy treatment.
  outcome:
  - name: crf1a4a_fuel_co2_log_growth_t
    source: eurostat:env_air_gge
    transformation: Natural log of positive THS_T CO2 in CRF1A4A at year t divided by positive THS_T CO2
      at year t−1.
    notes: 'UNFCCC/EEA direct fuel-combustion source category CRF1A4A: commercial and institutional fuel
      combustion; not a NACE production sector, all-sector footprint, or policy outcome attribution.'
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS of same-calendar-year sectoral log CO2 change on WDI GDP growth with country and year fixed
    effects; country-cluster CR1 covariance; two-sided Student t with G−1 country degrees of freedom and
    family-adjusted confidence interval. No adaptive control, lag, or sector-specific model search.
falsification:
  test: wdi_gdp_eurostat_sector_co2_2026_10_10
  rule: INCONCLUSIVE if pinned sources or chronology fail; if fewer than 450 complete pairs/23 countries,
    fewer than 350 material-growth pairs/23 countries, or fewer than ten complete years per retained country;
    if the top 1% of residual exposure exceeds 30% or the largest country exceeds 20%; or if rank or country-cluster
    uncertainty is invalid. SUPPORTED iff beta≥0.005 log CO2 per +1 GDP-growth point and two-sided p≤0.01/12.
    REFUTED iff beta≤−0.005 with the same cutoff. Otherwise PARTIAL if estimable. All 12 sectors remain
    in the Bonferroni family even when one is inconclusive.
  threshold:
    family_id: wdi_gdp_eurostat_sector_co2_2026_10_10
    family_size: 12
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0008333333333333334
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.005
    min_valid_rows: 450
    min_valid_countries: 23
    min_material_change_rows: 350
    min_material_change_countries: 23
    material_growth_min_abs: 1.0
    max_abs_gdp_growth: 15.0
    min_complete_years_per_country: 10
    max_top_one_percent_residual_x_share: 0.3
    max_top_country_residual_x_share: 0.2
    selected_sector: CRF1A4A
    selected_pollutant: CO2
    selected_unit: THS_T
    selected_frequency: A
    expected_key_rows: 664
    expected_key_countries: 29
    expected_material_key_rows: 575
    roster_sha256: 2c5b22762e26f303500ce5840daa5d7839f9e172c83f98b220be83323fe9e96c
    source_files:
      gdp:
        path: data/vintages/world_bank_wdi/NY.GDP.MKTP.KD.ZG@2026-05-05T194655Z.parquet
        sha256: db76a52909929c6cd3ca1dd3d1fdc4b28d28cbaea92e16cb59e88ee53d3f2e58
