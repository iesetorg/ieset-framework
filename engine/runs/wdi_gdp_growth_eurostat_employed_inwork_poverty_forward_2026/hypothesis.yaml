# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_gdp_growth_eurostat_employed_inwork_poverty_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: '-'
claim: Across the frozen 30-country panel, higher real GDP growth in year t predicts a lower change in
  the Eurostat in-work at-risk-of-poverty rate for all employed persons between survey years t+1 and t+2.
methodology_note: Prospective descriptive two-test family selected using WDI treatment values and Eurostat
  dimensions/country-year keys only. No selected Eurostat outcome values or null masks were opened before
  registration. Both tests remain in the family denominator even if one is inconclusive.
evidence_type: associational
sample:
  countries: &id001
  - AUT
  - BEL
  - BGR
  - CHE
  - CYP
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - FRA
  - GRC
  - HRV
  - HUN
  - ISL
  - ITA
  - LTU
  - LUX
  - LVA
  - MLT
  - NLD
  - NOR
  - POL
  - PRT
  - ROU
  - SVK
  - SVN
  - SWE
  - TUR
  period:
  - 2005
  - 2017
  temporal_structure: panel
  exclusion_rules:
  - Use only the immutable roster country-year keys. Require finite WDI real GDP growth in calendar year
    t with absolute growth <=15 percentage points, and exact Eurostat outcome keys at survey years t+1
    and t+2.
  - Select Eurostat freq=A, wstatus=EMP, sex=T, age=Y18-64, unit=PC; include only the frozen 30 national
    geo codes, exclude aggregates, UK and Ireland, and require at least five candidate years per country.
  - After a separately committed source lock, require both selected Eurostat values to be finite percentages
    in [0,100], then keep only countries with at least five complete endpoint pairs. Never trim based
    on outcome magnitude.
  - The frozen Eurostat parquet has no cell-status or method-break column. No flag-based exclusion can be
    made from this vintage; no country-year may be removed for a visual break or external revised flag after
    outcome access. This limitation forbids a break-screened claim.
  - Do not interpolate, forward-fill, use nearest-year matches, substitute another poverty outcome, or
    adapt the sample, lag, sign, magnitude, or covariates after outcome access.
variables:
  treatment:
  - name: real_gdp_growth_percent_t
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: Published annual percent change in constant-price GDP in calendar year t; no delta
      or log transform.
    notes: National-accounts growth is not a policy treatment. The pinned WDI obs_status column is blank
      and does not certify country-specific method continuity.
  outcome:
  - name: emp_inwork_poverty_rate_survey_t2_minus_t1_pp
    source: eurostat:ilc_iw01
    transformation: Eurostat selected EMP rate at survey year t+2 minus the same rate at t+1, percentage
      points.
    notes: EU-SILC relative poverty is below 60% of national median equivalised disposable income after
      transfers. For included countries, income generally refers to the calendar year before survey. The
      raw vintage carries no observation-status or break flag.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS of survey-year poverty-rate change on GDP growth in treatment year t with country and treatment-year
    fixed effects. Country-cluster CR1 covariance, two-sided Student t with G-1 degrees of freedom, and
    matching 99.5% CI. No controls in the primary model. The 2008-09 treatment-year exclusion and baseline-rate
    adjustment are descriptive diagnostics only and cannot change the primary verdict. Full-rank and finite-positive-uncertainty
    gates apply.
falsification:
  test: wdi_gdp_eurostat_inwork_poverty_2026_10_10
  rule: INCONCLUSIVE if source/roster chronology, complete-case floor (280/25), material-growth floor
    (200/25), five-year-country, residual-treatment concentration, full-rank, or country-cluster uncertainty
    gates fail. SUPPORTED iff beta <= -0.1 percentage point per +1 GDP-growth percentage point and two-sided
    p <= 0.005. REFUTED iff beta >= +0.1 with the same p cutoff. Otherwise PARTIAL if estimable. Both
    tests remain in the Bonferroni denominator.
  threshold:
    family_id: wdi_gdp_eurostat_inwork_poverty_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.1
    min_valid_rows: 280
    min_valid_countries: 25
    min_material_change_rows: 200
    min_material_change_countries: 25
    material_growth_min_abs: 1.0
    max_abs_gdp_growth: 15.0
    min_years_per_country: 5
    max_top_one_percent_residual_x_share: 0.3
    max_top_country_residual_x_share: 0.2
    expected_key_rows: 383
    expected_key_countries: 30
    roster_sha256: f04b873741ed2c47656989a281d9bfca59df2c80fcbdd7f43e00edbadec0f3a5
    source_files:
      gdp:
        path: data/vintages/world_bank_wdi/NY.GDP.MKTP.KD.ZG@2026-05-05T194655Z.parquet
        sha256: db76a52909929c6cd3ca1dd3d1fdc4b28d28cbaea92e16cb59e88ee53d3f2e58
        manifest: data/manifests/fetch_run_2026-05-05T200056Z.yaml
