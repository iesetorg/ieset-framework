    causal_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.25
disclosure: The Eurostat in-work poverty outcome is a relative survey measure and can remain stable even
  if absolute income rises. The EU-SILC reference-year convention makes t+1 and t+2 survey years broadly
  correspond to income years t and t+1; exposure can already affect the baseline. UK and Ireland are excluded
  for historical income-year exceptions. Prior IESET growth-poverty, redistribution-growth-poverty, and
  in-work-benefit studies are thematically related, although an exact WDI GDP-growth to Eurostat ilc_iw01
  pair was not found in a direct source/phrase scan. This local two-test correction does not cover archive-wide
  selection. No causal, policy, school, or featured credit.
