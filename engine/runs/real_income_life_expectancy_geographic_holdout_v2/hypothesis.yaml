hypothesis_id: real_income_life_expectancy_geographic_holdout_v2
version: 1
status: pre_registered
topic: healthcare
claim: Among countries excluded from the old 40-country fit, higher log real GDP per person at year t
  predicts higher measured life expectancy at birth in exact t+1, conditional on rule of law and country
  and year effects.
claim_direction: +
methodology_note: New-ID country-disjoint follow-up to market_income_channel_health_outcomes; its old
  same-commit PARTIAL result and the broader old claim were seen. The old market-enabled mechanism and
  long-window improvement claim were not directly measured. The new claim concerns only log WDI income
  at t and WDI life expectancy at exact t+1. The historical runner at e786a95e676c9d6283c123682d43bf54dbacd73b
  filtered to the old 40-country specification before fitting. All 40 are excluded, including any without
  old fitted rows. This is a five-test measured-association family with shared sources and a fixed Bonferroni
  decision rule. The minimum gate was set after the country/year-key envelope was seen; key-only preflight did not inspect held-out values or null masks. Source vintages and
  eligible countries can overlap other IESET v2 tests; only the named old fit is disjoint. No causal,
  policy-mechanism, or school-score credit is requested.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period: &id001
  - 1996
  - 2023
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all 40 countries in the historical old specification: ARG AUS BGD BRA CAN CHL CHN COL DEU
    DNK EGY ESP EST FIN FRA GBR IDN IND ITA JPN KEN KOR LKA MAR MEX MYS NGA NLD NOR NZL PAK PER PHL POL
    SWE THA TUR USA VNM ZAF.'
  - Retain ISO 3166-1 alpha-3 country codes only; no WDI aggregates or old-country rows.
  - Join treatment and controls at exact t to outcome at exact t+1; require complete finite values and
    at least five usable treatment years per country.
  - For natural-log measures require positive source values; do not impute, interpolate, or substitute
    a nearest year.
variables:
  outcome:
  - name: next_year_life_expectancy_years
    source: world_bank_wdi:SP.DYN.LE00.IN
    transformation: level at exact calendar t+1
  treatment:
  - name: log_real_income_pc
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive level at treatment year t
  controls:
  - name: rule_of_law
    source: wgi:RL.EST
    transformation: level at t
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One fixed primary coefficient with country and treatment-year effects, country-clustered uncertainty,
    no automatic covariate dropping, and a five-test Bonferroni rule.
falsification:
  rule: If fewer than 800 complete country-year pairs or 50 countries survive the five-year rule, or if
    the country-clustered estimate or uncertainty is unidentified or nonfinite, return INCONCLUSIVE. Otherwise
    SUPPORT requires a positive coefficient at two-sided p <= 0.10/5; REFUTATION requires an negative
    coefficient at the same threshold. Every other estimable result is PARTIAL. Apply this rule equally
    to adverse and favorable results.
  test: country_disjoint_exact_next_year_panel_fe
  threshold:
    family_id: second_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 5
    family_alpha: 0.1
    family_p_max: 0.02
    expected_sign: +
    min_observations: 800
    min_countries: 50
    min_pairs_per_country: 5
    old_hypothesis_id: market_income_channel_health_outcomes
    old_result_bucket: PARTIAL
    old_country_count: 40
