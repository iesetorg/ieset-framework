prior_confidence: 0.4
disclosure: Treatable mortality is a selected OECD rate; a spending share is neither
  service quality nor a policy intervention. This test is a narrow measured association,
  not a causal intervention estimate or a validation of the old broader claim. The
  old result and its countries/time are not independent holdouts; no school, position,
  or policy score credit is sought. The prior availability screen inspected finite
  masks without outcome magnitudes, signs, or estimates.
