limitations:
- Both public-spending outcomes and SIPRI military expenditure are shares of GDP; denominator changes
  can jointly move them.
- Government education expenditure and domestic government health expenditure are spending intensity proxies,
  not appropriations or proven budget substitutions.
- Security threats, recessions, fiscal capacity, tax changes and national accounting changes remain confounders
  despite controls and fixed effects.
- Overlapping annual three-year windows share observations. Country clustering addresses within-country
  covariance but does not create independent experiments.
- The SIPRI vintage lacks cell-level status; WDI observation flags do not establish stable national definitions.
- These two correlated endpoints extend the same visible SIPRI programme. The two-cell correction does
  not adjust for archive-wide selection.
- SIPRI source terms restrict raw redistribution. Only derived diagnostics are published.
- No causal, policy, school, position or featured credit is assigned.
