# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wits_tariff_decline_exported_hs6_breadth_forward_2026
version: 1
status: pre_registered
topic: trade
claim_direction: +
claim: A larger three-year fall in weighted-mean applied merchandise tariffs predicts
  larger subsequent three-year growth in the number of exported HS6 products, conditional
  on prior breadth, its prior change, and real income per person.
methodology_note: 'Prospective source-pinned descriptive three-outcome family; separate
  registration and source-lock commits, exact key-only roster, no selected export
  outcome values opened before lock. Full design: engine/audits/wits_tariff_export_diversity_prereg_2026-10-10.md.'
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period:
  - 2000
  - 2019
  temporal_structure: panel
  exclusion_rules:
  - Use only the exact committed per-outcome key roster and current ISO3 reporter
    codes; do not append countries or years after inspecting outcomes.
  - Treatment years t=2000..2016, source values at t-3 and t, export outcome at t-3,
    t, t+3; end year at most 2019.
  - For the selected outcome, drop invalid or missing values; no interpolation. A
    retained reporter must have at least five complete treatment years.
  - Source selector, case roster, source hash, source lock, or model failure makes
    the case INCONCLUSIVE.
variables:
  outcome:
  - name: exported_hs6_product_count_forward_log_change
    source: wits:unique_hs6_products
    transformation: log1p(count_t+3) minus log1p(count_t)
    notes: WITS annual reporter-to-world exported HS6 category count, not complexity
      or domestic product count.
  treatment:
  - name: three_year_weighted_mean_applied_tariff_decline
    source: wits:weighted_mean_applied_tariff
    transformation: weighted mean applied tariff at t-3 minus at t, percentage points
    notes: Import-weighted applied merchandise tariff average; endogenous composition
      and tariff reporting prevent causal attribution.
  controls:
  - name: baseline_export_level
    source: wits:unique_hs6_products
    transformation: selected outcome level at t, log1p for count
  - name: prior_export_trend
    source: wits:unique_hs6_products
    transformation: favorably oriented outcome change from t-3 to t
  - name: real_income_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: log level at t and log change t-3 to t
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Outcome from t to t+3 on tariff decline t-3 to t, own baseline and prior
    trend, real-income controls, reporter and treatment-year effects; OLS country-cluster
    CR1 with Student t(G-1) two-sided inference. Overlapping windows share observations.
falsification:
  test: wits_tariff_decline_exported_hs6_breadth_forward_2026_guarded_panel_fe
  rule: INCONCLUSIVE if frozen source, complete-case, material-movement, influence,
    rank, or uncertainty gate fails. Else SUPPORTED for positive coefficient at or
    above the outcome-specific practical threshold and p<=0.01/3; REFUTED for negative
    coefficient at or below minus that threshold and the same p cutoff; otherwise
    PARTIAL. Keep all three outcomes regardless of verdict.
  threshold:
    family_id: wits_tariff_export_diversity_2026_10_10
    family_size: 3
    family_alpha: 0.01
    p_max_two_sided: 0.0033333333333333335
    practical_beta_min: 0.01
    material_tariff_change_points: 2.0
    min_complete_rows: 1000
    min_complete_reporters: 90
    min_complete_years_per_reporter: 5
    min_material_declines: 200
    min_decline_reporters: 70
    min_material_increases: 45
    min_increase_reporters: 25
    max_top_1pct_residual_share: 0.3
    max_top_reporter_residual_share: 0.2
    key_roster_path: data/pinned_evidence/wits_tariff_export_diversity_key_roster_2026.csv
    key_roster_sha256: c0d49eac18fbc53fc1a26bb6426a7e3d090f123e1953d805fc6937c6854ce327
    source_files:
      tariff:
        path: data/vintages/wits/weighted_mean_applied_tariff@2026-07-23T151540Z.parquet
        sha256: 73520e0da6a44048e51a64671c97369aadf160130937f351f90375fb86b0e010
        manifest: data/manifests/fetch_run_2026-07-23T151550Z.yaml
      income:
        path: data/vintages/world_bank_wdi/NY.GDP.PCAP.KD@2026-05-05T194645Z.parquet
        sha256: 0cf53ee3a334988ded027fbe160a8d8c70773656772daf1c82206eb3f7c02a9f
        manifest: data/manifests/fetch_run_2026-05-05T200056Z.yaml
      exported_hs6_count:
        path: data/vintages/wits/unique_hs6_products@2026-07-23T153652Z.parquet
        sha256: 29db44b85d263bfc92307182b19f3baf4073dae446e5c3af37d82a284bfb2934
        manifest: data/manifests/fetch_run_2026-07-23T153659Z.yaml
    causal_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.35
disclosure: The three outcomes share tariff and trade-data sources and are one correlated
  family, not independent confirmations. Similar CEPII/WITS and WITS tariff/structure
  studies were visible before registration. Weighted mean tariffs respond to changing
  import composition; trade prospects, currency, resources, agreements, crises, classification
  and reporting can drive both sides. Neither outcome is a tariff-policy effect. Bonferroni
  corrects the three fixed cells only, not archive-wide model search. Every verdict
  has zero causal, policy, position, school and featured credit.
steelman: hypotheses/steelman/wits_tariff_decline_exported_hs6_breadth_forward_2026.md
scope:
  period:
  - 2000
  - 2019
  countries:
  - GLOBAL
  outcome_dim:
  - industrial_capability
  policy_family:
  - none
  treatment_tags: []
covers_claims: []
linked_hypotheses: []
