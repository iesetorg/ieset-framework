disclosure: Annual ALMP spending can rise in response to poor labour markets, and its GDP denominator moves with recessions. Low-education employment is not a programme-participant measure. The Eurostat vintage lacks cell-level status and break flags. Baseline employment adjustment can reflect regression to the mean. This is one descriptive calibration with no causal, programme-effect, policy-score, school-score, position, or featured credit.
