  - QAT
  - SLV
  - SVK
  - TTO
  - UKR
  - UZB
  period:
  - 2010
  - 2022
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all 21 countries in the historical old specification: ARG AUT CHN COL EGY FRA GBR GHA HUN IDN
    IND MEX MYS NGA PAK POL RUS SAU THA VNM ZAF.'
  - Use only the frozen 22-country roster above; no replacement countries or aggregate areas.
  - Use explicit OWID/IEA fossil-fuel consumption subsidies at exact year t, WDI population and real GDP per
    capita at t, and WDI high-technology exports as percent of manufactured exports at both t and exact t+1.
  - Require finite source values, nonnegative explicit subsidy amount, high-tech export shares at both t and
    t+1 in the inclusive 0 to 100 percent range, positive population and real GDP per capita, and at least five
    complete treatment years per retained country. Exclude invalid rows without clipping. No interpolation,
    nearest-year substitution, imputation, outcome-based trimming, or vintage switch.
variables:
  outcome:
  - name: next_year_change_hightech_manufactured_export_share_pp
    source: world_bank_wdi:TX.VAL.TECH.MF.ZS
    transformation: WDI TX.VAL.TECH.MF.ZS at exact t+1 minus at exact t, in percentage points; this is a share
      of manufactured exports, not high-tech export value.
  treatment:
  - name: fossil_consumption_subsidy_usd_per_resident_at_t
    source: owid:consumption-subsidies-for-fossil-fuels
    transformation: OWID/IEA explicit fossil-fuel consumption subsidies in constant 2023 USD at t divided by
      WDI total population at t; use asinh of the quotient in the regression.
  - name: population_at_t
    source: world_bank_wdi:SP.POP.TOTL
    transformation: WDI SP.POP.TOTL at t, exact-year positive denominator for subsidy per resident; no independent
      coefficient.
  controls:
  - name: real_gdp_per_capita_at_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Log of positive WDI NY.GDP.PCAP.KD at exact t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One complete-case OLS fit of the t-to-t+1 export-share change on asinh(subsidy USD per resident at
    t), log real GDP per capita at t, country fixed effects, and treatment-year fixed effects. Country-clustered
    small-sample covariance; two-sided Student t inference with number of retained countries minus one degrees
    of freedom. No model search, automatic control dropping, alternate source, or post-result sign change.
falsification:
  rule: INCONCLUSIVE if fewer than 200 complete country-year pairs, fewer than 20 retained countries, fewer
    than five complete treatment years in any retained country, or the primary coefficient or country-clustered
    uncertainty is unidentified or nonfinite. Otherwise SUPPORTED if the subsidy-per-resident coefficient is
    negative at two-sided p<=0.01; REFUTED if positive at the same cutoff; every other estimable result is
    PARTIAL. This is the one primary test in the family.
  test: country_disjoint_fossil_consumption_subsidy_hightech_export_share_change_panel_fe
