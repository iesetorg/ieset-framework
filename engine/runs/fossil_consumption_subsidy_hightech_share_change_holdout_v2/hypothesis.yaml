disclosure: This is a measured lagged association, not a fossil-subsidy reform, industrial-upgrading mechanism,
  innovation, or causal effect. The old export-value result was known and PARTIAL with the opposite, nonsignificant
  sign; changing to a share outcome and excluding its whole 21-country roster does not erase that prior evidence.
  The share can move because its manufactured-export denominator changes. The old WITS export-value and new
  WDI export-share measures share the World Bank/WITS trade-data family; this is country-disjoint, not independent
  source replication. OWID/IEA explicit price-gap estimates cover selected countries and can change with world
  fuel prices without a domestic policy change; the held-out roster is largely resource-exporting. Around 20
  country clusters limit precision, and source vintages can overlap other IESET studies. A reported 95 percent
  interval is descriptive; the frozen verdict uses the two-sided p<=0.01 rule. Feasibility used keys and null
  masks but not held-out magnitudes or fits. No school, welfare, or policy-score credit.
