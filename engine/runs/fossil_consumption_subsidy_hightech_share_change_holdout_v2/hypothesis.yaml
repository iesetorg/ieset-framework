hypothesis_id: fossil_consumption_subsidy_hightech_share_change_holdout_v2
version: 1
status: pre_registered
topic: energy
claim_direction: '-'
claim: In the fixed 22-country sample excluded from the old export-value fit, a higher OWID/IEA explicit fossil-fuel
  consumption subsidy amount per resident in year t predicts a smaller change from t to t+1 in WDI high-technology
  exports as a percentage of manufactured exports, conditional on real GDP per person at t and country and
  treatment-year effects.
methodology_note: New-ID, country-disjoint descriptive follow-up to owid_fossil_subsidy_hightech_export_drag_panel.
  The old test used high-technology export value, not export share; its PARTIAL positive coefficient +0.030319
  and p=0.224323 (169 observations, 21 countries) were known before this design. All old fit countries are
  excluded. This single-test family fixes a two-sided p<=0.01 before any held-out magnitudes are inspected.
  Feasibility selection inspected country/year keys and source value null masks only, without held-out magnitudes,
  signs, or fits. No school or policy-score credit.
evidence_type: associational
