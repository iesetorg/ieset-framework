limitations:
- The Internet uptake series and ILO labour outcomes are national descriptive statistics; common trends, income,
  education, institutions and labour demand can confound their association.
- Unemployment and labour-force participation series are modelled ILO estimates and are correlated; working poverty
  is also an ILO modelled indicator. Wage data use national survey sources and have narrower coverage.
- Source-code continuity is required within an outcome window, but a stable code does not rule out method breaks,
  revisions, earnings denominator changes or cross-country measurement differences.
- Gender hourly earnings ratios compare female/male earnings in the same source, country and year, canceling local
  currency units; they are not adjusted pay gaps for comparable jobs.
- The five outcomes share an Internet predictor and overlapping countries; Holm controls only this registered family,
  not the archive-wide selection history. No causal, policy, school, position or featured credit.
