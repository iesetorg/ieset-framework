disclosure: >-
  This selected descriptive association is not a policy experiment or causal
  technology-transfer estimate. FDI/GDP includes acquisitions, intracompany
  debt, reinvested earnings, disinvestment, and GDP-denominator effects;
  resident patent filings miss inventions assigned or filed abroad and can
  change with office reporting and IP law. Fixed effects and forward timing
  do not remove reverse selection or time-varying confounding. Local p<=0.01
  does not correct earlier IESET search. No causal, policy, position, school,
  or featured credit.
