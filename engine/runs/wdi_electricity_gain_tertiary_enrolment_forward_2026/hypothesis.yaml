# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_electricity_gain_tertiary_enrolment_forward_2026
version: 1
status: pre_registered
topic: energy
claim_direction: +
claim: Across WDI national country-year observations anchored 2000–2018, a ten-percentage-point larger electricity-access
  gain over the prior five years predicts at least 1.0 percentage point more tertiary gross enrolment ratio
  gain over the next exact three years, conditional on baseline outcome and access, prior real-income growth,
  real income, and country/year effects. This is a descriptive association, not a policy or causal effect.
evidence_type: descriptive
methodology_note: One member of the fixed five-test wdi_electricity_schooling_forward_2026_10_10 family. Earlier
  IESET electricity-access/child-survival and education-spending/milestone results were visible; this new pairing
  is an analysis registration within existing data, not an untouched independent holdout. Registration and
  source lock precede the selected outcome join and fit.
sample:
  countries:
  - GLOBAL
  period:
  - 1995
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - Use only the frozen 216-country ISO3-plus-XKX source-key roster; keys do not imply non-null measurements.
  - For anchor t=2000–2018 require exact t−5/t electricity and real-income values and exact t/t+3 outcome values.
    No neighboring-year joins, interpolation, or imputation.
  - 'Require WDI observation status blank or A and finite values: electricity [0,100], positive real income,
    and the prespecified outcome range.'
  - Retain countries with at least three complete pairs; apply every frozen sample, variation, rank, and influence
    gate before any directional verdict.
variables:
  outcome:
  - name: tertiary_enrolment_three_year_change_pp
    source: world_bank_wdi:SE.TER.ENRR
    transformation: exact t+3 level minus t level, percentage points
    notes: Tertiary gross enrolment includes students outside typical ages and cross-border study; it can exceed
      100 and need not reflect quality or completion.
  treatment:
  - name: earlier_electricity_access_gain_10pp
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: electricity access at t minus t−5, divided by 10 percentage points
    notes: National access percentage is a modelled share and is not school electrification or an enacted policy.
  controls:
  - name: baseline_outcome_t
    source: world_bank_wdi:SE.TER.ENRR
    transformation: unmodified outcome percentage at t
  - name: baseline_access_t_minus_5
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: unmodified national electricity-access percentage at t−5
  - name: log_real_gdp_per_person_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive real GDP per person at t
  - name: prior_five_year_log_income_growth
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: log real GDP per person(t) minus log real GDP per person(t−5)
estimator:
  template: descriptive
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Equal country-year-pair OLS of exact three-year milestone change on prior five-year electricity gain
    per 10 points, baseline milestone, baseline access, real income and prior income growth, plus country and
    anchor-year effects. CR1 country-cluster standard errors, two-sided Student t with G−1 degrees of freedom;
    fixed Bonferroni p≤0.01/5.
falsification:
  test: fixed_wdi_electricity_gain_tertiary_enrolment_forward_2026
  rule: INCONCLUSIVE on any prespecified custody, sample, material/low-change, rank, influence or uncertainty
    failure. Otherwise SUPPORTED requires beta ≥+1.0 outcome points per +10 earlier electricity points and
    two-sided p≤0.01/5; REFUTED requires beta ≤−1.0 and the same p cutoff; other estimable results are PARTIAL.
    All five cases remain in the denominator. Zero causal, policy, school, position and featured credit.
  threshold:
    family_id: wdi_electricity_schooling_forward_2026_10_10
    family_size: 5
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.002
    meaningful_beta_min_pp_per_10pp_access_gain: 1.0
    min_complete_pairs: 400
    min_countries: 50
    min_pairs_per_country: 3
    min_years: 10
    min_material_gain_rows: 50
    min_material_gain_countries: 20
    material_gain_pp: 10.0
    min_low_change_rows: 100
    min_low_change_countries: 30
    low_change_pp: 2.0
    max_top_one_percent_residualized_exposure_share: 0.2
    max_country_residualized_exposure_share: 0.15
    max_year_residualized_exposure_share: 0.2
    outcome_valid_max: 200.0
    roster_sha256: a7b8e33e420cd1c0ce8160ad4e03e1102440d184842dd450027a446df26e8638
    source_files:
      electricity:
        path: data/vintages/world_bank_wdi/EG.ELC.ACCS.ZS@2026-05-05T195057Z.parquet
        sha256: aa564cbe2947b3d1c3499d7ecb9b2c38c6aa5de073d2cc1a797cfe2fe42f2931
        manifest: data/manifests/fetch_run_2026-05-05T200056Z.yaml
        manifest_sha256: a571d660fd359d245176b77e595b59923a90a1e40a799ea56c13f001a7b09945
      income:
        path: data/vintages/world_bank_wdi/NY.GDP.PCAP.KD@2026-05-05T194645Z.parquet
        sha256: 0cf53ee3a334988ded027fbe160a8d8c70773656772daf1c82206eb3f7c02a9f
        manifest: data/manifests/fetch_run_2026-05-05T200056Z.yaml
        manifest_sha256: a571d660fd359d245176b77e595b59923a90a1e40a799ea56c13f001a7b09945
      tertiary_enrolment:
        path: data/vintages/world_bank_wdi/SE.TER.ENRR@2026-05-05T195043Z.parquet
        sha256: 0459b48b5625f54872c4708f4a6107e66c8c44087b18d798c99e91e83511cede
        manifest: data/manifests/fetch_run_2026-05-05T200056Z.yaml
        manifest_sha256: a571d660fd359d245176b77e595b59923a90a1e40a799ea56c13f001a7b09945
    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
prior_confidence: 0.35
disclosure: Electricity access may proxy broad development, urbanization, incomes and state capacity; school
  reporting varies. Tertiary gross enrolment includes students outside typical ages and cross-border study;
  it can exceed 100 and need not reflect quality or completion. Earlier related IESET results informed choice,
  so the local correction does not cover archive-wide selection. No coefficient identifies an electricity-policy
  or education-policy effect.
scope:
  period:
  - 1995
  - 2021
  countries:
  - GLOBAL
  outcome_dim:
  - education_access
  policy_family:
  - none
  treatment_tags:
  - electricity_access_gain
