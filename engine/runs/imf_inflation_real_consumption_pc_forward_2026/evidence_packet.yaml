limitations:
- IMF WEO annual average CPI inflation is an observed macro signal, not a monetary-policy
  treatment.
- The bounded tanh transformation avoids leverage from hyperinflation but compresses
  high-inflation differences.
- WDI private consumption, gross fixed capital formation, and ILO-modeled unemployment
  have different concepts and coverage; each outcome is tested separately.
- Country and calendar-year fixed effects, baseline outcome and income controls, and
  forward timing do not identify causal effects.
- The three-test Bonferroni correction does not correct selection across the wider
  IESET archive; these retrospective files are not a new-data holdout.
- All three outcomes receive zero school, policy, causal, and featured credit.
