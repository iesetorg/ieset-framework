limitations:
- Resource rents are modeled World Bank estimates of commodity value less extraction cost divided by current
  GDP; they are not randomized treatment or a fiscal-revenue measure.
- Total rent includes oil, gas, minerals, coal and forest rents; the four predictors are correlated and
  belong to one eight-cell Holm family.
- Real sector value added is a national-accounts series in constant 2015 US dollars; cross-country level
  comparability and methodological breaks can affect growth measures.
- Country/anchor effects, baseline income, sector scale and prior sector growth cannot remove commodity-price,
  investment, exchange-rate or institutional confounding.
- The local services-value-added parquet has an exact SHA pin but no tracked fetch manifest; its original
  download transaction is not independently reconstructed.
- The frozen 1995–2010 anchors yield nonoverlapping 1995–2000, 2000–2005, 2005–2010 and 2010–2015 follow-up
  intervals; no pandemic period is included.
- No causal, school, policy, position or featured credit is assigned; Holm corrects this family, not every
  earlier IESET resource question.
