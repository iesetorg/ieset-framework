limitations:
- IMF PCPS Brent is a common global price, not a country-specific export price or exogenous country treatment; timing
  and fixed effects do not establish effects.
- WDI fuel exports are a share of merchandise exports, not GDP or net fuel exports; countries may also import fuel,
  and fixed 2000-2004 shares do not capture later trade changes.
- The outcomes are national-accounts or balance-of-payments aggregates with revisions and potential country-method
  breaks; real mean consumption has no distributional interpretation.
- All four cells share one oil series, baseline exposure and many countries; Holm controls only this selected family,
  not the broader IESET search.
- Country/year effects and baseline outcome trends do not eliminate global demand, exchange-rate, domestic production,
  financial, and fiscal confounding.
- Only derived results are tracked; raw IMF/World Bank values are not redistributed. All causal, policy, school,
  position and featured credit is zero.
