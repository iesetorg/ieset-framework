  period:
  - 1994
  - 2023
  temporal_structure: panel
  exclusion_rules:
  - Use only committed item/country/exposure-year roster keys; no interpolation or
    substitutes.
  - Require exact annual single-item PPI at t-1,t,t+1, finite and positive, A/E/X
    flags at all three years; exclude I/B/M/blank/unknown.
  - Require finite tas/pr at t and all 1961–1990 baseline years and positive pr baseline
    sample SD.
  - Exclude absolute prior/future PPI log growth >1.0 and countries with fewer than
    five complete years.
  - No post-value changes to item, years, flags, estimator, gates, sign or family
    size.
variables:
  outcome:
  - name: subsequent_single_item_ppi_log_growth
    source: faostat:producer_prices
    transformation: log(item 15 annual PPI at t+1) minus log(PPI at t); 2014–2016=100
  treatment:
  - name: absolute_temperature_departure
    source: world_bank_cckp:cru_ts4_10_tas_pr_annual_global
    transformation: absolute country annual temperature departure from 1961–1990 normal,
      °C
  controls:
  - name: prior_single_item_ppi_log_growth
    source: faostat:producer_prices
    transformation: log(PPI at t) minus log(PPI at t-1)
  - name: other_precipitation_departure
    source: world_bank_cckp:cru_ts4_10_tas_pr_annual_global
    transformation: absolute country annual precipitation departure
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Country/exposure-year FE OLS, prior PPI growth and other-weather control;
    country CR1, two-sided Student t(G-1), full-rank and residual concentration gates.
falsification:
  test: cckp_faostat_weather_named_crop_ppi_family_2026_10_10_15_temperature
  rule: INCONCLUSIVE if source, complete-case (500/30), material-exposure (100/20),
    five-year-country, full-rank, positive finite SE or 20% top-country residualized
    exposure gate fails. SUPPORTED iff beta >= +0.02 and p <= 0.01/118; REFUTED iff
    beta <= -0.02 at same cutoff; otherwise PARTIAL when estimable. All 118 cells
    remain in denominator.
  threshold:
    family_id: cckp_faostat_weather_named_crop_ppi_family_2026_10_10
    family_size: 118
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 8.474576271186441e-05
