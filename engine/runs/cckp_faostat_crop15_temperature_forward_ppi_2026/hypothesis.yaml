version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Larger absolute annual country temperature departure at year t is associated
  with higher next-year Wheat single-item producer price index log growth after prior
  PPI growth, the other weather departure, and country/year effects.
methodology_note: Value-blind named CPC 01 crop family (118 correlated tests), all
  eligible items by key coverage; FAO item 15, CPC 0111, annual single-item producer
  price index 2014–2016=100. No measurements, flags or null masks opened at registration.
