limitations:
- Repeated Findex country surveys do not follow the same adults over time; country
  averages are ecological estimates.
- COVID-era interview modes and later mode changes, questionnaire differences, income
  and employment composition, and common trends can affect survey-wave changes.
- The 2017 and 2021 exposure periods are observational; economy and transition effects
  do not identify a digital-finance or banking-policy effect.
- All six tests share one source and overlapping respondents or constructs, so six
  records are not independent replications. The family correction is local to these
  six tests.
- Business-purpose borrowing includes informal sources; account ownership and formal
  saving include mobile-money accounts by definition.
- No causal, policy, school, position, or featured credit is permitted.
