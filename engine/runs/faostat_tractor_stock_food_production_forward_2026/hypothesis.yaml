hypothesis_id: faostat_tractor_stock_food_production_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Larger 1990-to-2000 increases in agricultural tractors in use predict greater
  2000-to-2010 growth in the food-production index across the frozen country roster.
evidence_type: descriptive
methodology_note: One of a closed three-test descriptive family, fixed before selected
  values. Family alpha 0.01 with Bonferroni denominator three; source-key rows do
  not establish non-null values.
