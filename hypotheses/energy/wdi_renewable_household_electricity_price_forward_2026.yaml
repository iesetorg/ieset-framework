disclosure: The older green-transition cost claim requires policy stringency, firm-capacity
  phase-outs, industrial electricity prices, and manufacturing outcomes. This new test is only
  a direct-measure household-price association and cannot validate that old causal chain. The
  old alias price candidate used CO2 intensity as its outcome, not observed price. Gas, hydro/weather,
  exchange rates, taxes, subsidies, retail regulation and energy-crisis shocks can confound
  this association. It receives zero causal, policy, school-score, position, and featured credit.
