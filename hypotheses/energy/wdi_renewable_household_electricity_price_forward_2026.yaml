# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_renewable_household_electricity_price_forward_2026
version: 1
status: pre_registered
topic: energy
claim_direction: +
claim: Across the frozen 2011–2021 European country-year panel, a larger annual rise in renewable
  electricity output share from t-1 to t predicts a higher medium-household, tax-inclusive electricity
  price change from the second semester of t to the second semester of t+1.
methodology_note: Prospective one-test associational family. Registration uses WDI exposure
  values and exact Eurostat price keys/dimensions only. Selected Eurostat numeric prices, null
  masks, signs, and fits remain unopened until a separate source-lock commit. The local family
  denominator is one.
evidence_type: associational
sample:
  countries: &id001
  - AUT
  - BEL
  - BGR
  - CYP
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - FRA
  - GRC
  - HRV
  - HUN
  - IRL
  - ITA
  - LTU
  - LUX
  - LVA
  - MLT
  - NLD
  - NOR
  - POL
  - PRT
  - ROU
  - SVK
  - SVN
  - SWE
  period:
  - 2011
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - Use only the committed 297-row country-year roster; exact WDI treatment values at t-1 and
    t and selected Eurostat second-semester household price keys at t and t+1. No interpolation,
    nearest-year joins, or source substitution.
  - Use the 28 selected national ISO3 countries and the fixed Eurostat dimensions freq=S, siec=E7000,
    nrg_cons=KWH2500-4999, unit=KWH, tax=I_TAX, currency=EUR, period suffix S2. Exclude aggregates
    and other bands.
  - Require finite WDI renewable share in [0,100], blank WDI obs_status, and absolute annual
    share change <=15 percentage points before outcome access. Require at least seven eligible
    years per country in the primary panel; keep zero/small exposure changes.
  - After separately committed source lock only, require positive finite Eurostat prices at
    t and t+1. The pinned Parquet retains no provisional or break flags; do not infer ordinary
    status.
  - Do not change countries, years, dimension selector, lags, covariates, thresholds, or the
    sample using selected price values or missingness.
variables:
  treatment:
  - name: renewable_output_share_annual_change_pp
    source: world_bank_wdi:EG.ELC.RNEW.ZS
    transformation: annual percentage-point change from t-1 to t
    notes: IEA-origin electricity generation share, not an enacted policy or installed capacity.
  outcome:
  - name: household_electricity_price_forward_log_change
    source: eurostat:nrg_pc_204
    transformation: log(positive tax-inclusive EUR/kWh price in t+1 S2) minus log(positive price
      in t S2), medium household band KWH2500-4999
    notes: End-user household price, not industrial, wholesale, or generation cost. Includes
      energy, network, taxes, and possible subsidies.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS one-year forward log price change on prior annual renewable-share change; country
    and treatment-year fixed effects, country-cluster CR1, two-sided Student t with G-1 degrees.
    No controls or alternate lags. Require full rank, finite uncertainty, and residual-exposure
    concentration. A mandatory pre-2018 sensitivity repeats the model at t<=2017.
falsification:
  test: wdi_renewable_household_price_forward_2026_10_10
  rule: INCONCLUSIVE if source hash, registration chronology, sample, material exposure, concentration,
    rank, or cluster-inference gates fail. SUPPORTED iff the primary beta is positive, >=0.01
    log price per share percentage point, and two-sided p<=0.01, with the pre-2018 model independently
    clearing the same sign, magnitude, and p gates. REFUTED iff both clear in the opposite direction.
    Estimable but nondirectional evidence is PARTIAL. If a directional primary cannot run its
    mandatory pre-2018 diagnostic, mark INCONCLUSIVE.
  threshold:
    family_id: wdi_renewable_household_price_forward_2026_10_10
    family_size: 1
    family_alpha: 0.01
    p_max_two_sided: 0.01
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.01
    min_valid_rows: 240
    min_valid_countries: 24
    min_material_change_rows: 120
    min_material_change_countries: 20
    pre2018_max_treatment_year: 2017
    pre2018_min_valid_rows: 150
    pre2018_min_valid_countries: 24
    pre2018_min_material_change_rows: 75
    pre2018_min_material_change_countries: 20
    material_treatment_change_min_abs: 2.0
    max_abs_treatment_change: 15.0
    min_years_per_country: 7
    min_pre_years_per_country: 5
    max_top_one_percent_residual_x_share: 0.3
    max_top_country_residual_x_share: 0.2
    expected_key_rows: 297
    expected_key_countries: 28
    roster_sha256: 9cbd08539e1adaeff4f15764bab769d158fc88ed7c3d0a0b62386a76d70534f0
    source_files:
      renewable:
