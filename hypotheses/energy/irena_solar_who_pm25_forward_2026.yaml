hypothesis_id: irena_solar_who_pm25_forward_2026
version: 1
status: pre_registered
topic: energy
claim_direction: '-'
claim: Across the fixed national-area key roster, greater growth in solar-PV installed capacity per resident
  from 2010 to 2015 predicts a larger fall in population-weighted all-area ambient PM2.5 concentration
  from 2015 to 2019.
methodology_note: New-ID prospective descriptive calibration using an IRENA capacity measure and a WHO
  modelled ambient-exposure measure. It is not a test of renewable electricity generated or a decarbonization
  policy. Related renewable-deployment and WHO PM2.5 cases exist in the archive; this is a selected distinct
  outcome, not replication. No selected numeric values or null masks were opened before registration.
evidence_type: descriptive
