  temporal_structure: cross_section_with_justification
  cross_section_justification: One predeclared earlier exposure and one later outcome change per national
    area; annual source rows are not treated as independent observations.
  exclusion_rules:
  - Use only the fixed 140 national areas with exact 2010 and 2015 IRENA solar-PV capacity and WDI population
    keys and WHO SDGPM25 country, RESIDENCEAREATYPE_TOTL keys in 2010, 2015, and 2019.
  - Require finite nonnegative IRENA capacity, strictly positive finite WDI population, and WHO all-area
    PM2.5 in [0,500] micrograms per cubic metre at every required endpoint.
  - Exclude non-country WHO rows and all other residence categories; no imputation, interpolation, nearest-year
    join, winsorization, geography replacement, or vintage switch.
  - Key presence does not imply a non-null measurement; all complete-value exclusions and frozen gates
    are reported.
variables:
  outcome:
  - name: later_all_area_pm25_change_2015_2019
    source: who_gho:SDGPM25
    transformation: 2019 minus 2015 country RESIDENCEAREATYPE_TOTL population-weighted ambient PM2.5,
      micrograms per cubic metre.
  treatment:
  - name: prior_solar_pv_capacity_per_resident_log_change
    source: irena:installed_capacity_solar_pv
    transformation: log1p(2015 installed MW per million WDI residents) minus log1p(2010 installed MW per
      million WDI residents).
  controls:
  - name: solar_capacity_per_resident_log_2010
    source: irena:installed_capacity_solar_pv
    transformation: log1p(2010 installed MW per million WDI residents).
  - name: baseline_pm25_2015
    source: who_gho:SDGPM25
    transformation: 2015 all-area country PM2.5 level.
  - name: prior_pm25_change_2010_2015
    source: who_gho:SDGPM25
    transformation: 2015 minus 2010 all-area country PM2.5.
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: Equal-country OLS of later PM2.5 change on prior log1p solar-capacity-per-resident change, with
    intercept and three fixed controls. HC3 robust SE and two-sided Student t reference with N−5 df. No
    model, subgroup, weighting, or covariate search.
falsification:
  rule: Any sample, material-exposure, IQR, rank, residual-variation, HC3, single-area concentration,
    or leave-one-out fit gate failure is INCONCLUSIVE with no published coefficient. Otherwise SUPPORTED
    requires beta <= -0.5 micrograms per cubic metre per +1 log1p solar-intensity change, two-sided p
    <= 0.01/3, and negative beta in >=80% of successful leave-one-out fits. REFUTED requires beta >= +0.5,
    the same p cutoff, and positive beta in >=80% of successful fits; all other estimable outcomes are
    PARTIAL.
  test: ieset_three_distinct_measurements_2026_10_10
  threshold:
    family_id: ieset_three_distinct_measurements_2026_10_10
    family_size: 3
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0033333333333333335
    expected_sign: '-'
    min_complete_national_areas: 85
    min_material_exposure_areas: 30
    material_exposure_min: 0.7
    min_exposure_iqr: 0.5
    max_single_area_residualized_exposure_share: 0.15
    max_single_area_residualized_outcome_share: 0.2
    max_loo_fit_failures: 2
    min_loo_same_sign_share: 0.8
    meaningful_abs_beta: 0.5
