# yaml-language-server: $schema=../../../IESET/schemas/hypothesis.schema.json
hypothesis_id: us_state_wind_solar_share_vs_residential_price_2010_2025
version: 1
status: draft
topic: energy
claim: States that expanded wind+solar share most since 2010 saw larger residential electricity price increases ('net zero drives bills').
claim_direction: +
evidence_type: associational
sample:
  countries: &id002
  - USA
  period: &id001
  - 2010
  - 2025
  temporal_structure: cross_section_with_justification
variables:
  outcome:
  - name: d_res_price
    source: eia_v2:electricity/retail-sales RES price
    transformation: 2025 minus 2010, cents/kWh
  - name: d_vre_share
    source: eia_v2:electric-power-operational-data SUN+WND / ALL
    transformation: 2025 minus 2010, pp
estimator:
  template: descriptive
falsification:
  rule: 'Long-difference OLS across 50 states+DC: d_price ~ d_vre_share + d_gas_share + price_2010, HC3. SUPPORTED if beta>0 and p<0.05; REFUTED if beta<0 and p<0.05; INCONCLUSIVE otherwise. Excludes AK,
    HI in robustness.'
  test: long_difference_ols
  threshold: beta_vre>0 & p<0.05
prior_confidence: 0.35
disclosure: Drafted 2026-10-09 by agent from a high-engagement X claim. The headline value quoted in the tweet was seen before drafting; the falsification threshold was fixed before the analysis script
  was run and is frozen in PREREG_LEDGER.json (SHA256 + UTC). Not git-pre-registered (needs user-approved commit).
conflict_disclosure: Author holds no positions related to this claim. Engine house prior is market-liberal; disclosed.
steelman: hypotheses/steelman/us_state_wind_solar_share_vs_residential_price_2010_2025.md
scope:
  period: *id001
  countries: *id002
  outcome_dim:
  - energy
  policy_family:
  - energy_policy
source_provenance:
