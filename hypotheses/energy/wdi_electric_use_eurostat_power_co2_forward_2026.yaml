disclosure: The already visible IESET OWID renewable-to-fossil-share study is an accounting-substitution
  endpoint test; the EU ETS path study uses EU aggregate total CO2. A legacy price-claim alias study
  substitutes OWID CO2 intensity as an outcome and is related but not this inventory sector series.
  None tests this exact national
  lagged public-power-and-heat inventory outcome. The two new cases share country-years and an emissions
  outcome; they are not independent replications. WDI energy series are IEA-origin, Eurostat inventory
  is EEA-origin; hydro/weather, nuclear, imports, heat, fuel and ETS factors can confound association.
  Source status and inventory flags are unavailable in the pinned parquet. Treatment is not a policy intervention.
  Zero causal, policy, school, and featured credit.
