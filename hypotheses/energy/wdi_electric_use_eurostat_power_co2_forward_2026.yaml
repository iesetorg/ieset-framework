# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_electric_use_eurostat_power_co2_forward_2026
version: 1
status: pre_registered
topic: energy
claim_direction: +
claim: Across the frozen 1991–2022 national panel, a larger electric-power consumption per capita change
  from t-1 to t predicts higher Eurostat public electricity-and-heat CO2 emissions growth from t to t+1.
methodology_note: Prospective descriptive two-test family. Registration uses WDI treatment values and
  exact Eurostat outcome keys/dimensions only. The selected Eurostat CO2 values, null masks, signs, and
  fits remain unopened until a separate source-lock commit follows this registration. Both tests stay
  in the family denominator even if one is inconclusive.
evidence_type: associational
sample:
  countries: &id002
  - AUT
  - BEL
  - BGR
  - CYP
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - FRA
  - GRC
  - HRV
  - HUN
  - IRL
  - ISL
  - ITA
  - LTU
  - LUX
  - LVA
  - MLT
  - NLD
  - NOR
  - POL
  - PRT
  - ROU
  - SVK
  - SVN
  - SWE
  period: &id001
  - 1991
  - 2022
  temporal_structure: panel
  exclusion_rules:
  - Use only the committed country-year roster; require exact treatment values at t-1 and t and selected
    Eurostat emissions keys at t and t+1. No interpolation, nearest-year joins, or source substitution.
  - Use only the 29 frozen ISO3 countries mapped from national Eurostat GEO codes; EL maps to GRC. Exclude
    EU27_2020 and all other aggregates. This pinned selected vintage has no GBR series.
  - Require finite WDI treatment values at both exposure endpoints; renewable share in [0,100] or electric
    use >0 as applicable. Apply absolute annual exposure-change cap 0.25 before outcome access.
  - Require at least ten eligible years per country before and after outcome-value filtering. Keep zero
    and small treatment changes in the regression.
  - After separately committed source lock only, require positive finite Eurostat CO2 values at t and
    t+1. The pinned Parquet contains no status/break flags; do not infer normal status.
  - Do not choose countries, years, covariates, lags, alternative sector codes, or sample gates using
    selected outcome values or missingness.
variables:
  treatment:
  - name: electric_use_annual_log_change
    source: world_bank_wdi:EG.USE.ELEC.KH.PC
    transformation: annual log change in positive kWh per capita from t-1 to t
    notes: IEA-origin WDI series; a measured energy-series exposure, not a policy intervention. Blank
      WDI observation status cannot identify method breaks.
  outcome:
  - name: public_electricity_heat_co2_forward_log_change
    source: eurostat:env_air_gge
    transformation: log(positive CO2 at t+1) minus log(positive CO2 at t), selector freq=A, unit=THS_T,
      airpol=CO2, src_crf=CRF1A1A
    notes: EEA/UNFCCC territorial inventory republished by Eurostat; CRF1A1A includes public electricity
      and heat production. THS_T is thousand tonnes. No observation flags were retained in this pinned
      Parquet.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS of one-year forward log CO2 change on one prior annual treatment change, with country and
    treatment-year fixed effects. Country-cluster CR1 covariance and two-sided Student t with G-1 degrees
    of freedom. No controls or alternate lags. Require full rank, finite uncertainty, and residual-exposure
    concentration gates. A mandatory pre-2019 sensitivity repeats the model at t<=2018.
falsification:
  test: wdi_energy_eurostat_power_co2_2026_10_10
  rule: INCONCLUSIVE if SHA/registration/lock, sample, material-exposure, ten-year-country, residual-exposure
    concentration, model-rank, or cluster-inference gates fail. SUPPORTED iff primary beta has positive
    sign, absolute beta >= 0.2, and two-sided p <= 0.005, with the pre-2019 model independently clearing
    the same sign, magnitude, and p gates. REFUTED iff the same gates clear in the opposite direction.
    An estimable case that fails directional gates is PARTIAL. If a directional primary cannot run the
    mandatory pre-2019 diagnostic, mark INCONCLUSIVE. Both tests remain in the Bonferroni denominator.
  threshold:
    family_id: wdi_energy_eurostat_power_co2_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.2
    min_valid_rows: 670
    min_valid_countries: 23
    min_material_change_rows: 80
    min_material_change_countries: 20
    pre2019_max_treatment_year: 2018
    pre2019_min_valid_rows: 570
    pre2019_min_valid_countries: 23
    pre2019_min_material_change_rows: 65
    pre2019_min_material_change_countries: 19
    material_treatment_change_min_abs: 0.05
    max_abs_treatment_change: 0.25
    min_years_per_country: 10
    max_top_one_percent_residual_x_share: 0.3
    max_top_country_residual_x_share: 0.2
    expected_key_rows: 926
    expected_key_countries: 29
