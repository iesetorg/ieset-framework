hypothesis_id: who_smoking_decline_premature_ncd_mortality_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: +
claim: Across the frozen WHO country-key roster, a one-unit decline in age-standardized current tobacco-smoking
  prevalence decline from 2000 to 2010 predicts at least 0.05 percentage points more decline in premature NCD
  mortality probability from 2010 to 2021, conditional on baseline exposure, baseline mortality, and WHO region.
  This is a descriptive association.
evidence_type: descriptive
methodology_note: One member of the frozen two-test WHO exposure–mortality family who_exposure_premature_ncd_mortality_2026_10_10.
  The family was selected after existing visible IESET health/environment archive work; its Bonferroni correction
  does not erase archive-wide selection. Registered source-key roster and runner precede selected value access.
