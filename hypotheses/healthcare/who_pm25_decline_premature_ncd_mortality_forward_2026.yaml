# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: who_pm25_decline_premature_ncd_mortality_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: +
claim: Across the frozen WHO country-key roster, a one-unit decline in population-total ambient PM2.5 concentration
  decline from 2010 to 2015 predicts at least 0.03 percentage points more decline in premature NCD mortality
  probability from 2015 to 2021, conditional on baseline exposure, baseline mortality, and WHO region. This
  is a descriptive association.
evidence_type: descriptive
methodology_note: One member of the frozen two-test WHO exposure–mortality family who_exposure_premature_ncd_mortality_2026_10_10.
  The family was selected after existing visible IESET health/environment archive work; its Bonferroni correction
  does not erase archive-wide selection. Registered source-key roster and runner precede selected value access.
