hypothesis_id: wash_safe_water_under5_mortality_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: '-'
claim: Across five fixed four-year windows, a larger preceding increase in national safely managed drinking
  water coverage is associated with a larger subsequent decline in under-five mortality, conditional on
  mortality baseline and prior mortality trend, prior service share, real income per person, and country
  and anchor effects.
methodology_note: Retrospective descriptive two-exposure family. WHO national exposure and WDI income
  values were inspected before registration; only WDI under-five mortality country/year/indicator keys,
  not values or null masks, were read. First-addition registration, source lock, and measurement are separate
  commits. Local two-test correction does not account for selection in the wider archive.
