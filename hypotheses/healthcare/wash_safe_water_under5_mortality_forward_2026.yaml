  exclusion_rules:
  - Only 696 exact country/anchor slots in the frozen key roster, selected using WDI mortality keys at
    t-4, t and t+4 without reading mortality values or null masks.
  - Keep ISO3/XKX country rows only, WHO country-total residential category, finite safe-service percentages
    [0,100] and positive real income at t-4/t with blank/null status; exclude absolute four-year service
    jumps above 30 points.
  - After separate committed source lock, require finite WDI under-five mortality values in (0,500] per
    1,000 births and blank/null status at t-4, t, t+4; never impute or switch indicator.
  - Retain countries with at least three complete anchor rows; no post-result covariate, anchor, country,
    outcome or vintage switch.
variables:
  outcome:
  - name: next_four_year_log_under5_mortality_change
    source: world_bank_wdi:SH.DYN.MORT
    transformation: Natural log of under-five mortality per 1,000 live births at t+4 divided by the level
      at t. Negative means decline.
  treatment:
  - name: prior_four_year_safe_service_coverage_change
    source: who_gho:WSH_WATER_SAFELY_MANAGED
    transformation: National safely managed drinking water percentage at t minus t-4; one unit is one
      coverage percentage point, not an assigned intervention.
  controls:
  - name: prior_safe_service_share
    source: who_gho:WSH_WATER_SAFELY_MANAGED
    transformation: National safe-service percentage at t-4.
  - name: baseline_log_under5_mortality
    source: world_bank_wdi:SH.DYN.MORT
    transformation: Natural log of under-five mortality per 1,000 births at t.
  - name: prior_log_under5_mortality_change
    source: world_bank_wdi:SH.DYN.MORT
    transformation: Log under-five mortality at t minus log level at t-4.
  - name: log_real_income_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
  - name: prior_log_real_income_change
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Log real income per person at t minus t-4.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Country and anchor fixed-effects OLS, country-cluster CR1 with small-sample correction and two-sided
    Student t on G-1 degrees of freedom. Outcome windows are adjacent but nonoverlapping. No model search.
falsification:
  rule: INCONCLUSIVE if any frozen source, chronology, complete-case, support, rank, concentration or
    clustered-uncertainty gate fails. Otherwise negative beta at most -0.002 next-four-year log under-five
    mortality change per +1 prior service percentage point with two-sided p<=0.005 SUPPORTS only a narrow
    descriptive association; comparably positive beta REFUTES it. Every other estimable result is PARTIAL.
    Gate-cleared results are public descriptive calibrations only; INCONCLUSIVE is archived. Zero causal,
    policy, school, position and featured credit.
