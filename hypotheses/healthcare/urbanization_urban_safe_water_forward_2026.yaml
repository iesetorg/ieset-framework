  period:
  - 2004
  - 2024
  temporal_structure: panel
  exclusion_rules:
  - Only the 486 exact water country/anchor slots in the frozen key roster; WHO urban outcome keys at
    t-4, t and t+4, not outcome values, set the upper bound.
  - Use WDI national ISO3/XKX country rows only, valid urban-share percentages [0,100] and positive real
    income at t-4/t with blank/null observation status; exclude absolute four-year urban-share jumps above
    10 points.
  - Require finite WHO country-level urban service coverage in [0,100] at t-4, t, t+4. Exclude regional/global
    and rural/total records, never impute or replace a missing value.
  - Retain only countries with at least three complete anchor rows. No post-result covariate, outcome,
    anchor, country or vintage switch.
variables:
  outcome:
  - name: urban_water_coverage_change_next_four_years
    source: who_gho:WSH_WATER_SAFELY_MANAGED
    transformation: Urban-residence coverage percentage at t+4 minus t; WHO/JMP estimate.
  treatment:
  - name: national_urban_share_change_prior_four_years
    source: world_bank_wdi:SP.URB.TOTL.IN.ZS
    transformation: Urban share percentage at t minus t-4; one unit is one percentage point of observed
      urbanization, not a policy treatment.
  controls:
  - name: prior_urban_share
    source: world_bank_wdi:SP.URB.TOTL.IN.ZS
    transformation: Urban share at t-4.
  - name: baseline_urban_service
    source: who_gho:WSH_WATER_SAFELY_MANAGED
    transformation: Urban service coverage at t.
  - name: prior_urban_service_change
    source: who_gho:WSH_WATER_SAFELY_MANAGED
    transformation: Urban service coverage at t minus t-4.
  - name: log_real_income_per_person
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive GDP per person at t.
  - name: prior_log_real_income_change
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Log income per person at t minus t-4.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One country and anchor fixed-effects OLS slope per outcome. Country-cluster CR1 with small-sample
    correction; two-sided Student t on G-1 degrees of freedom. Outcome windows are adjacent but nonoverlapping.
    No model search.
falsification:
  rule: INCONCLUSIVE if any frozen source, chronology, sample, exposure-support, rank, concentration,
    or clustered-uncertainty gate fails. Otherwise negative beta at most -0.2 service percentage points
    per +1 prior urban-share point with two-sided p<=0.01/3 SUPPORTS only the narrow descriptive strain
    association; comparably positive beta REFUTES it. Every other estimable result is PARTIAL. All three
    tests remain in the family, including any archived failure. Gate-cleared SUPPORTED, REFUTED and PARTIAL
    receive descriptive calibration only; INCONCLUSIVE is archived. Zero causal, policy, school, position
    and featured credit.
  test: urbanization_urban_wash_forward_2026_10_10
  threshold:
    family_id: urbanization_urban_wash_forward_2026_10_10
    family_size: 3
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0033333333333333335
    expected_beta_sign: '-'
    meaningful_abs_beta: 0.2
    min_complete_rows: 350
    min_complete_countries: 70
    min_complete_anchors: 4
    min_anchors_per_country: 3
    material_rise_min_raw_pp: 1.0
    min_material_rise_rows: 80
    min_material_rise_countries: 30
