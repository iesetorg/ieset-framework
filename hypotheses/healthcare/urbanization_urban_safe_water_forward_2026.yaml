hypothesis_id: urbanization_urban_safe_water_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: '-'
claim: Across five fixed four-year windows, countries with faster observed urban-population-share growth
  over the prior four years will have slower subsequent improvement in urban safely managed drinking water
  coverage, conditional on baseline coverage, its preceding trend, urban share, real income per person,
  and country and anchor effects.
methodology_note: Retrospective descriptive three-outcome family using WDI urban share and real-income
  values plus WHO urban-service country/year/dimension keys only. No selected WHO value or null mask was
  read before first-addition registration and a later source-lock commit. The local three-test correction
  does not cover selection from the wider IESET archive.
