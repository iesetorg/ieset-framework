hypothesis_id: who_aud_suicide_forward_2016_2019_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: +
claim: Among the fixed 183 WHO country-key roster, higher adult alcohol-use-disorder
  prevalence in 2016 predicts a larger 2015-to-2019 increase (or smaller decline)
  in all-age both-sex suicide deaths per 100,000, conditional on the 2015 level, 2012-to-2015
  prior trend, 2015 real GDP per person and WHO region. This is descriptive.
methodology_note: One of two correlated, source-locked WHO AUD/mortality descriptive
  calibrations. Earlier inflation to suicide results were visible, but that exposure
  is distinct from alcohol-use-disorder prevalence. The source-key roster and exact
  selected dimensions were screened without values or null masks; the frozen family
  contract is engine/audits/who_aud_mortality_prereg_2026-10-10.md.
