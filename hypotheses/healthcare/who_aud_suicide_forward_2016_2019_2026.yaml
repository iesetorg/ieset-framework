  period:
  - 2012
  - 2019
  temporal_structure: cross_section_with_justification
  cross_section_justification: One fixed 2016 AUD prevalence exposure and one later
    2019 endpoint per country; 2012/2015 outcome histories and 2015 GDP precede the
    exposure. This order does not identify an effect.
  exclusion_rules:
  - Only the full fixed 183-country exact source-key intersection; no post-result
    geography or year changes.
  - Require finite 2016 AUD prevalence in [0,100], exact 2012/2015/2019 outcome within
    its registered range, and positive 2015 real GDP per person. No imputation, nearest-year
    match, winsorization, or substitution.
  - All complete-country, region, variation, concentration, leverage, holdout and
    inference gates in falsification.threshold precede any directional verdict.
variables:
  treatment:
  - name: adult_alcohol_use_disorder_prevalence_2016_pp
    source: who_gho:SA_0000001462
    transformation: Exact 2016 both-sex 12-month AUD prevalence among adults age 15+,
      percentage points.
    notes: WHO models many country estimates; this is not alcohol per-capita consumption
      or an intervention.
  outcome:
  - name: suicide_2019_minus_2015
    source: who_gho:SDGSUICIDE
    transformation: Exact 2019 minus 2015 both-sex, all-age crude suicide deaths per
      100,000.
  controls:
  - name: suicide_2015_level
    source: who_gho:SDGSUICIDE
    transformation: Exact 2015 outcome level divided by 10 in OLS.
  - name: suicide_2012_to_2015_prior_change
    source: who_gho:SDGSUICIDE
    transformation: Exact 2015 minus 2012 outcome, divided by 10 in OLS.
  - name: log_real_gdp_per_person_2015
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive constant-price 2015 real GDP per person.
  - name: who_region
    source: who_gho:ParentLocationCode
    transformation: Five indicators for six frozen WHO regions; AFR reference.
estimator:
  template: descriptive
  fixed_effects:
  - WHO region
  notes: Equal-country OLS of 2019−2015 outcome change on 2016 AUD prevalence, 2015
    level, 2012−2015 prior change, log 2015 real GDP per person and WHO region; HC3
    robust two-sided Student t(n−k), with six leave-one-WHO-region-out fits. All source
    and influence gates frozen.
falsification:
  test: fixed_who_aud_mortality_2016_2019_2026
  rule: INCONCLUSIVE if a frozen source, sample, region, AUD-IQR, rank, residualized-exposure
    share, hat-leverage, holdout-estimability, or HC3 uncertainty gate fails. Otherwise
    SUPPORTED requires beta >= +0.25 outcome units per +1 percentage point AUD, two-sided
    p<=0.005, and at least five of six positive regional holdout slopes; REFUTED requires
    beta <= the negative of that magnitude, p<=0.005, and at least five negative holdout
    slopes; otherwise PARTIAL. Both cases remain in one Bonferroni denominator.
  threshold:
    family_id: who_aud_mortality_2016_2019_2026
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: +
    meaningful_beta_min_per_1pp_aud: 0.25
    min_complete_countries: 150
    min_complete_countries_each_who_region: 8
    min_leave_one_region_out_countries: 100
    min_concordant_regional_holdouts: 5
    min_aud_iqr_pp: 1.0
    max_country_residualized_exposure_share: 0.15
    max_hat_leverage: 0.2
    pretrend_year: 2012
    baseline_year: 2015
    aud_exposure_year: 2016
    outcome_year: 2019
    expected_key_countries: 183
    who_region_reference: AFR
    who_regions:
    - AFR
    - AMR
    - EMR
