# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: who_physician_density_maternal_mortality_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: +
claim: Across the frozen country-key roster, larger gains in WHO physician density from 2000 to 2010 predict
  at least +0.05 log point maternal-mortality reduction from 2011 to 2019 per ten additional physicians
  per 10,000 people, conditional on initial physician density and 2011 maternal mortality. This is a descriptive
  association.
evidence_type: descriptive
methodology_note: One of a closed two-test family with both questions and Bonferroni denominator fixed
  before selected values. Direct WHO WASH-child-health retesting was excluded after inspecting the four
  recent failed WASH screens. Source-key roster and exact source hashes precede selected-value access.
