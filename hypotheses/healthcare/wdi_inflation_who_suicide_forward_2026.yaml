hypothesis_id: wdi_inflation_who_suicide_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: +
claim: Across the fixed national-area key roster, greater 2005-to-2013 consumer-price inflation volatility
  predicts a larger 2014-to-2021 increase in the WHO all-age, both-sex suicide mortality rate.
methodology_note: New-ID prospective descriptive calibration joining an IMF-sourced WDI annual CPI inflation
  series to a WHO all-age, both-sex suicide-mortality series. Related inflation and mortality cases exist
  in the archive but do not constitute replication. No selected numeric values or null masks were opened
  before registration.
