  period: &id001
  - 2005
  - 2021
  temporal_structure: cross_section_with_justification
  cross_section_justification: One predeclared earlier exposure and one later outcome change per national
    area; annual source rows are not treated as independent observations.
  exclusion_rules:
  - Use only the fixed 185 national areas with all nine annual 2005–2013 WDI FP.CPI.TOTL.ZG keys and exact
    WHO SDGSUICIDE COUNTRY, SEX_BTSX, AGEGROUP_YEARSALL keys in 2014 and 2021.
  - Require all nine CPI inflation rates finite in [-100,10000] percent and both all-age suicide rates
    finite in [0,200] per 100,000; the exposure uses the sample standard deviation with denominator eight.
  - No imputation, interpolation, nearest-year join, annual-row dropping, geography replacement, winsorization,
    or vintage switch.
  - Key presence does not imply a non-null measurement; all complete-value exclusions and frozen gates
    are reported.
variables:
  outcome:
  - name: all_age_both_sex_suicide_mortality_change_2014_2021
    source: who_gho:SDGSUICIDE
    transformation: 2021 minus 2014 all-age, both-sex crude suicide deaths per 100,000 people.
  treatment:
  - name: prior_cpi_inflation_volatility_asinh
    source: world_bank_wdi:FP.CPI.TOTL.ZG
    transformation: asinh(sample standard deviation of nine exact annual 2005–2013 CPI inflation rates
      in percentage points divided by 5).
  controls:
  - name: baseline_suicide_mortality_2014
    source: who_gho:SDGSUICIDE
    transformation: 2014 all-age, both-sex crude suicide deaths per 100,000 people.
  - name: prior_mean_inflation_asinh
    source: world_bank_wdi:FP.CPI.TOTL.ZG
    transformation: asinh(arithmetic mean of exact 2005–2013 CPI inflation percentages divided by 5).
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: Equal-country OLS of later suicide-rate change on earlier asinh inflation volatility, with intercept
    and two fixed controls. HC3 robust SE and two-sided Student t reference with N−4 df. No model, subgroup,
    weighting, or covariate search.
falsification:
  rule: Any sample, material-exposure, IQR, rank, residual-variation, HC3, single-area concentration,
    or leave-one-out fit gate failure is INCONCLUSIVE with no published coefficient. Otherwise SUPPORTED
    requires beta >= +0.5 suicide death per 100,000 per +1 transformed volatility unit, two-sided p <=
    0.01/3, and positive beta in >=80% of successful leave-one-out fits. REFUTED requires beta <= -0.5,
    the same p cutoff, and negative beta in >=80% of successful fits; all other estimable outcomes are
    PARTIAL.
  test: ieset_three_distinct_measurements_2026_10_10
  threshold:
    family_id: ieset_three_distinct_measurements_2026_10_10
    family_size: 3
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0033333333333333335
    expected_sign: +
    min_complete_national_areas: 110
    min_material_exposure_areas: 30
    material_exposure_min: 5.0
    min_exposure_iqr: 0.25
    max_single_area_residualized_exposure_share: 0.15
    max_single_area_residualized_outcome_share: 0.2
    max_loo_fit_failures: 2
    min_loo_same_sign_share: 0.8
    meaningful_abs_beta: 0.5
    roster_sha256: 153a79fc73ea16c106bc669723e5d74ac60051f02748e8ccbfcec8ec2b556bc6
