# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_health_spending_who_uhc_forward_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: +
claim: >-
  Among the fixed country-key roster with complete observations, a one
  percentage-point-of-GDP increase in total current health expenditure from
  2000 to 2010 predicts at least one additional WHO UHC service-coverage
  index point gained from 2010 to 2020, conditional on 2010 service coverage,
  its 2000–2010 change, and the 2000 spending level. This is a descriptive
  forward association, not an effect of public health spending or policy.
evidence_type: descriptive
methodology_note: >-
  One closed, prospectively registered descriptive calibration using two
  hash-pinned source vintages. The archived generic
  public_health_spending_avoidable_mortality_panel run is known and REFUTED
  under its legacy rules, but it concerns a different claim and outcome.
  This new result neither regrades nor replicates it. No selected values,
  null masks, coefficients, or fits were inspected before registration.
sample:
  countries: [GLOBAL]
  period: [2000, 2020]
  temporal_structure: cross_section_with_justification
  cross_section_justification: >-
    One 2000–2010 expenditure-share change and one later 2010–2020
    WHO service-coverage-index change are constructed per eligible economy.
  exclusion_rules:
    - >-
      Candidate economies are all ISO 3166 alpha-3 countries and territories
      plus XKX with exact WDI keys for 2000 and 2010 and WHO COUNTRY keys
      for 2000, 2010, and 2020. The key-only roster is pinned in the
      registration commit; key presence does not imply a non-null reading.
    - >-
      Require finite WDI current-health-expenditure/GDP readings in (0,100]
      at 2000 and 2010, and finite WHO UHC service-coverage-index readings
      in [0,100] at 2000, 2010, and 2020. Any missing or invalid cell
      excludes that economy. Do not interpolate, impute, replace, winsorise,
      or select a geography subset after reading values.
variables:
  outcome:
    - name: who_uhc_service_coverage_index_change_2010_2020
      source: who_gho:UHC_INDEX_REPORTED
      transformation: 2020 index minus 2010 index, unitless 0–100 index points
      notes: >-
        Composite of selected service-coverage tracers, partly proxied and
        modelled; it does not measure mortality or financial protection.
  treatment:
    - name: current_health_expenditure_gdp_share_change_2000_2010_pp
      source: world_bank_wdi:SH.XPD.CHEX.GD.ZS
      transformation: 2010 percentage of GDP minus 2000 percentage of GDP
      notes: Total public and private current spending, not government spending.
  controls:
    - name: who_uhc_index_2010
      source: who_gho:UHC_INDEX_REPORTED
      transformation: 2010 index level
    - name: who_uhc_index_prior_change_2000_2010
      source: who_gho:UHC_INDEX_REPORTED
      transformation: 2010 index minus 2000 index
    - name: current_health_expenditure_gdp_share_2000
      source: world_bank_wdi:SH.XPD.CHEX.GD.ZS
      transformation: 2000 percentage of GDP
intervention_channel: fiscal
intervention_channel_justification: >-
  A total health-spending share is observed, but no fiscal intervention
  or enacted policy is identified.
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: >-
    Equal-economy cross-sectional OLS with intercept, the pre-2010
    health-expenditure/GDP change, and the three listed controls. HC3
    heteroskedasticity-robust standard error and two-sided Student t
    reference with N−5 degrees of freedom. One fixed model; no geography,
    endpoint, or covariate search.
falsification:
  test: fixed_wdi_health_spending_who_uhc_forward_2000_2020
  rule: >-
    INCONCLUSIVE if fewer than 80 complete economies, fewer than 20 with
    absolute spending-share change of at least 0.5 GDP percentage point,
    exposure interquartile range under 0.5 point, a rank-deficient model,
    non-finite or non-positive HC3 uncertainty, one economy contributing
    over 20 percent of squared exposure residual after controls, or more
    than two failed leave-one-economy-out fits. Otherwise SUPPORTED requires
    beta at least +1 UHC index point per +1 GDP point spending change,
    two-sided p at most 0.01, and at least 75 percent of successful
    leave-one-out betas positive. REFUTED requires beta at most −1,
    p at most 0.01, and at least 75 percent of leave-one-out betas negative.
    Every other estimable result is PARTIAL. Zero causal, policy, school,
    position, and featured credit.
  threshold:
    family_size: 1
    min_complete_economies: 80
    min_abs_change_0_5pp_economies: 20
    min_exposure_iqr_pp: 0.5
    max_single_economy_residualized_exposure_share: 0.2
    max_loo_failures: 2
    min_loo_sign_share: 0.75
    meaningful_abs_beta_index_points_per_gdp_pp: 1.0
    two_sided_p_max: 0.01
    roster_sha256: 34702ce92aa78d7e24b63744e33cfc2d09a0537333fcad2c08f5bc1404067270
    source_files:
      spending:
        path: data/vintages/world_bank_wdi/SH.XPD.CHEX.GD.ZS@2026-05-05T203513Z.parquet
        sha256: ca58050bf93fd11b1b864f04c8d27eaedbd6e260eba3a7e5df473a8cb0b5cc40
        manifest: data/manifests/fetch_run_2026-05-05T210519Z.yaml
        manifest_sha256: 5022cf82e5656d89c54d3c0df1cc3c12718b93896488eebfde3ffa197beef112
      uhc:
        path: data/vintages/who_gho/UHC_INDEX_REPORTED@2026-04-30T114740Z.parquet
        sha256: e4e1fea6a88f1cfcb97599a762f3c3988d5e2bff3674458f94f13e9710c35b1a
        manifest: data/manifests/fetch_run_bootstrap_2026-04-30T121833Z.yaml
        manifest_sha256: e4eba4196e874aa69112f5e93420aa1daeffe64225e73ff536b336e33dec282e
    policy_score_eligible: false
    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
prior_confidence: 0.38
disclosure: >-
  Total current health spending includes public and private expenditure and
  can change as a GDP ratio through the denominator. Health expenditure can
  respond to coverage gaps; both series can track income, state capacity,
  demographics, disease burden, or reporting changes. The WHO index is a
  modelled composite of selected tracer coverage, not care quality,
  mortality, or financial-risk protection. The 2020 endpoint includes the
  pandemic period. This one-test nominal cutoff does not correct selection
  across the larger IESET archive. The WHO vintage is CC-BY-NC-SA-3.0 IGO;
  tracked outputs contain metadata and summary estimates, not raw WHO rows.
scope:
  period: [2000, 2020]
  countries: [GLOBAL]
  outcome_dim: [life_expectancy_health]
  policy_family: [none]
  treatment_tags: [total_current_health_expenditure_share]
steelman: hypotheses/steelman/wdi_health_spending_who_uhc_forward_2026.md
covers_claims: []
linked_hypotheses: []
linked_conditions: []
notes: >-
  Registration plan:
  engine/audits/wdi_health_spending_who_uhc_forward_2026_prereg_2026-10-10.md.
  Frozen runner:
  scripts/run_wdi_health_spending_who_uhc_forward_2026.py.
