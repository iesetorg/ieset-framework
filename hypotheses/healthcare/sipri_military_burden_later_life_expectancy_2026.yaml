  temporal_structure: panel
  exclusion_rules:
  - Use only frozen key-roster years and exact t-3/t SIPRI and t-3/t/t+3 UNDP observations;
    no interpolation or nearest-year match.
  - Map SIPRI country names by frozen pycountry lookup and explicit exception table;
    exclude aggregates and predecessor states.
  - Keep finite military shares from 0 to 40 percent of GDP and finite outcomes; GNI
    per person must be strictly positive.
  - Exclude absolute three-year military-burden change above 3 percentage points and
    absolute prior or subsequent outcome change above the frozen outcome-specific
    bound.
  - Keep only countries with at least six complete treatment years; do not change
    the source, crosswalk, window, model, multiplicity or gates after selected values
    are opened.
variables:
  outcome:
  - name: later_life_expectancy_three_year_change
    source: undp_hdi:life_expectancy
    transformation: life expectancy at t+3 minus t
    notes: UNDP historical series may be modelled or revised.
  treatment:
  - name: military_burden_three_year_change
    source: sipri:milex_share_gdp
    transformation: military expenditure share of GDP at t minus t-3, in percentage
      points
    notes: Military burden is not an exogenous policy treatment; changes can reflect
      the GDP denominator.
  controls:
  - name: prior_outcome_three_year_change
    source: undp_hdi:life_expectancy
    transformation: life expectancy at t minus t-3
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS of later three-year change on military-burden change and prior outcome
    change, with country and treatment-year fixed effects. CR1 country-clustered SE
    and two-sided Student t(G-1); rank and residualized-exposure concentration gates.
falsification:
  test: sipri_undp_military_burden_development_2026_10_10_life_expectancy
  rule: INCONCLUSIVE if frozen-source, 900-row/60-country, 100-material-row/30-country,
    six-year-country, full-rank, finite clustered-SE or 15% residualized-exposure
    concentration gate fails. SUPPORTED iff beta <= -0.15 and two-sided p <= 0.0025.
    REFUTED iff beta >= +0.15 at the same cutoff. Otherwise PARTIAL if estimable.
    All four stay in the family denominator.
  threshold:
    family_id: sipri_undp_military_burden_development_2026_10_10
    family_size: 4
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0025
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.15
    meaningful_beta_unit: years later 3-year change per +1 percentage point military-burden
      change
    key_roster_sha256: ae96b3af522e07ff24f42178ea70dd640ef8d5635df0b0d3f8b658141668a8ae
    source_lock_path: data/pinned_evidence/sipri_undp_military_burden_2026.manifest.json
    min_complete_rows: 900
    min_complete_countries: 60
    min_material_rows: 100
    min_material_countries: 30
    material_abs_exposure_percentage_points: 0.25
    max_abs_exposure_percentage_points: 3.0
    max_abs_prior_and_forward_outcome_change: 8.0
    min_complete_years_per_country: 6
    max_top_country_residualized_exposure_share: 0.15
