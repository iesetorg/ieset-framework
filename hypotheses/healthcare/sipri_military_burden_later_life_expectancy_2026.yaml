hypothesis_id: sipri_military_burden_later_life_expectancy_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: '-'
claim: Within the frozen 1994–2016 treatment-year roster, a larger three-year rise
  in SIPRI military expenditure as a share of GDP from t-3 to t predicts a smaller
  subsequent three-year improvement in UNDP life expectancy from t to t+3, after the
  prior outcome trend and country/year effects.
methodology_note: Blind four-cell descriptive SIPRI–UNDP family. Before registration
  only source manifests, hashes, schemas, name/country/year keys and official methodology
  were inspected; neither selected values nor null masks were read. Four correlated
  UNDP components share a SIPRI exposure; they are not independent replications.
