hypothesis_id: sipri_military_burden_later_public_health_spending_2026
version: 1
status: pre_registered
topic: healthcare
claim_direction: '-'
claim: Across frozen annual country anchors 2003–2016, larger rises in SIPRI military expenditure as a
  GDP share from t−3 to t predict smaller subsequent t to t+3 changes in WDI domestic general government
  health expenditure as a GDP share, conditional on prior outcome change, baseline outcome and fiscal/income
  levels, with country and anchor-year fixed effects.
evidence_type: associational
methodology_note: One of two correlated SIPRI public-spending-intensity extension tests. The shared 2310-row
  physical key roster and five official source hashes were assembled without reading selected values or
  null masks. Measurement follows separate commits for registration and exact source lock.
