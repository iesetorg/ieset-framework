disclosure: A negative prior follows visible fiscal crowding-out debates. Both outcomes share a GDP denominator
  with SIPRI and national accounting can shift. Controls and fixed effects do not identify causation or
  a defense-to-civilian substitution. This correlated two-cell extension is not independent archive replication;
  zero causal/policy/school/featured credit.
