  temporal_structure: panel
  exclusion_rules:
  - Only the frozen national country/anchor roster, t=2003–2016, with physical SIPRI keys at t−3/t, both
    WDI spending series at t−3/t/t+3, and WDI general expense and income keys at t.
  - After source lock, retain finite military shares in [0,20] at t−3/t with |change|≤5 points; finite
    outcome shares in [0,20] at t−3/t/t+3 with both three-year changes ≤5 points; fiscal expense in [0,100]
    and positive real GDP per capita at t.
  - Retain countries with at least three complete anchors. No imputation, interpolation, winsorization,
    status substitution, alternative lag or post-result gate changes. Admit blank/A WDI statuses only;
    neither certifies accounting comparability.
variables:
  treatment:
  - name: prior_three_year_military_burden_change_pp
    source: sipri:milex_share_gdp
    transformation: Military expenditure percent GDP at t minus t−3; [0,20] endpoints and |change|≤5 points.
    notes: Prior descriptive spending-share movement; not an exogenous policy shock.
  outcome:
  - name: later_three_year_fiscal_policy_change_pp
    source: world_bank_wdi:SH.XPD.GHED.GD.ZS
    transformation: Domestic general government health expenditure percent GDP at t+3 minus t.
    notes: Public spending intensity with a shared GDP denominator, not a budget appropriation.
  controls:
  - name: prior_outcome_share_change
    source: world_bank_wdi:SH.XPD.GHED.GD.ZS
    transformation: Percent GDP at t minus t−3.
  - name: baseline_outcome_share
    source: world_bank_wdi:SH.XPD.GHED.GD.ZS
    transformation: Percent GDP at t.
  - name: baseline_government_expense_share
    source: world_bank_wdi:GC.XPN.TOTL.GD.ZS
    transformation: General government expense percent GDP at t.
  - name: baseline_log_real_income
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log real GDP per capita at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - anchor_year
  clustering: country
  notes: Equal country-anchor OLS with four frozen controls, country and year FE; country CR1 cluster
    SE and two-sided Student t(G−1), 99.5% interval. Five fixed SHA256 country-fold omissions assess coefficient
    sign stability. Both cells remain in the 0.01/2 denominator even if one is inconclusive.
falsification:
  test: sipri_wdi_public_budget_health_2026_10_10
  rule: INCONCLUSIVE if exact source/chronology, complete-row/country/year, material change, residual
    variation, concentration, full-rank, uncertainty or five-fold coverage gates fail. SUPPORTED iff beta≤−0.30
    percentage points per +1 military point with two-sided p≤0.005 and at least four of five fold signs
    negative. REFUTED iff beta≥+0.30, p≤0.005 and at least four signs positive. Otherwise PARTIAL.
  threshold:
    family_id: sipri_military_burden_public_spending_intensity_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided: 0.005
    expected_beta_sign: '-'
