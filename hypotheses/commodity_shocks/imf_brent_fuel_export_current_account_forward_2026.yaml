  period:
  - 2000
  - 2019
  temporal_structure: panel
  exclusion_rules:
  - Use only the frozen structural country, shock-year and outcome-key roster; require at least three finite, status-clean
    fuel-export shares in 2000-2004 and take their fixed arithmetic mean, bounded [0,100].
  - For shock years 2005-2017 require exactly twelve positive finite monthly IMF Brent prices in each of t-1 and
    t; annual arithmetic means form log(price_t/price_t-1). No missing month is imputed.
  - For each cell require finite status-clean outcome at t-2, t and t+2 and real GDP per person at t. Current-account
    values must lie in [-100,100] percent GDP; fixed-investment values in [0,100] percent GDP; real income and real
    private consumption levels must be positive.
  - Retain country panels with at least five complete rows. Never alter source, endpoint, country, lag, controls
    or threshold after selected values; no winsorization or missing-as-zero recoding.
variables:
  treatment:
  - name: standardized_brent_shock_times_preperiod_fuel_export_share
    source: imf_pcps:POILBRE; world_bank_wdi:TX.VAL.FUEL.ZS.UN
    transformation: Log annual mean Brent price change t-1→t multiplied by fixed 2000-2004 mean fuel exports as
      a fraction of merchandise exports, then standardized by complete-case pooled population SD.
    notes: The interaction is an exposure proxy, not a country-specific oil export price or measured policy intervention.
  outcome:
  - name: future_two_year_current_account_change
    source: world_bank_wdi:BN.CAB.XOKA.GD.ZS
    transformation: Exact t to t+2 change in percentage-point level, requiring values within the frozen bound.
    notes: Current-account balance, percent of GDP
  controls:
  - name: prior_two_year_outcome_change
    source: world_bank_wdi:BN.CAB.XOKA.GD.ZS
    transformation: Same outcome change t-2→t in its headline units.
  - name: baseline_outcome_level
    source: world_bank_wdi:BN.CAB.XOKA.GD.ZS
    transformation: Level at t, logged for real income or private consumption.
  - name: baseline_log_real_income
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log positive real GDP per person at t; duplicates baseline outcome and is omitted when
      income is the outcome.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - shock_year
  clustering: country_and_shock_year
  notes: Equal country-year OLS on pooled-SD interaction exposure, prior outcome change, baseline outcome and log
    real income (income outcome omits duplicate log-income control), country and shock-year effects. Two-way country/year
    CR1 cluster covariance; two-sided Student t with min(country clusters,year clusters)-1 degrees of freedom; Holm
    over all four cells. Five fixed country-hash omission folds assess directional stability.
falsification:
  test: imf_brent_fuel_export_forward_macro_2026_10_10
  rule: INCONCLUSIVE if exact sources, sample, exporter spread, residual variation/concentration, rank, two-way
    cluster uncertainty or fold coverage fails. SUPPORTED iff positive beta >= 0.5 percentage points per +1 interaction
    SD, Holm-adjusted two-sided p<=0.05, and at least four of five hash-fold slopes are positive. REFUTED iff beta
    <= -0.5, same p and at least four negative folds. Otherwise PARTIAL.
  threshold:
    family_id: imf_brent_fuel_export_forward_macro_2026_10_10
    family_size: 4
    family_alpha: 0.05
    holm_alpha: 0.05
    registered_beta_sign: +
    meaningful_abs_beta: 0.5
    beta_unit: percentage points per +1 pooled SD oil-shock-by-baseline-fuel-share
