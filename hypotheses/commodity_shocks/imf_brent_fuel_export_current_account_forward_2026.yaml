hypothesis_id: imf_brent_fuel_export_current_account_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Among the fixed national 2005-2017 shock-year roster, a larger IMF Brent annual-price increase in year t
  interacted with a higher fixed 2000-2004 fuel share of merchandise exports predicts a larger subsequent t to t+2
  increase in current-account balance, percent of gdp, conditional on baseline level and prior two-year change,
  baseline real income, country and shock-year effects.
evidence_type: associational
methodology_note: One of four distinct macro-response endpoints in a single prospective, descriptive IMF PCPS ×
  WDI fuel-export-exposure family. Source keys and hashes only were inspected before registration; selected values
  and null masks remain sealed through four separate source-lock commits.
