  rule: INCONCLUSIVE if exact source/registration/lock custody, complete-case, event/control, full-rank, partialled-event concentration, or finite cluster-uncertainty gate fails. SUPPORTED only if event beta is at least +0.5 percentage points with two-sided p at most 0.005. REFUTED only if event beta is at most -0.5 percentage points at the same cutoff. Otherwise PARTIAL. This local cutoff does not correct archive-wide selection.
