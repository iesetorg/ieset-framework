disclosure: The CEPII event is a positive net increase in recorded FTA-covered partners, not an identified treaty effect. Country selection into agreements, simultaneous reforms, partner composition, CEPII coverage changes, prior export trends, commodity prices, and the merchandise-export denominator can move the WDI share. Including the t-1 share in a t-1-to-t+2 change equation creates mathematical coupling and does not remove regression to the mean. Earlier CEPII FTA-growth, FTA-covered-partner-GDP/high-tech-export, and RTA-partner-expansion/HS6-product tests, plus WDI manufactures-share work with other exposures, were visible before registration. This is neither an independent holdout nor archive-wide multiplicity control. Descriptive calibration only; no causal, policy, school, position, or featured credit.
