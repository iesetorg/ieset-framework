hypothesis_id: cepii_new_fta_partners_manufactures_share_forward_2026
version: 1
status: pre_registered
topic: trade
claim_direction: '+'
claim: Across the fixed 1995–2018 country-year roster, a positive year-t increase in CEPII FTA-covered foreign partner count predicts a higher exact t-1-to-t+2 change in WDI manufactures exports as a share of merchandise exports than a year with no positive increase, conditional on the t-1 share and country/year effects.
methodology_note: Prospective descriptive one-test calibration. Only CEPII treatment values, WDI manufactures-export-share schema and country/year keys, source hashes/manifests, and prior hypothesis text informed registration. Selected WDI outcome values, null masks, and statuses remain closed until a separately committed source lock. Frozen contract is engine/audits/cepii_new_fta_partners_manufactures_share_prereg_2026-10-10.md.
evidence_type: associational
sample:
  countries: [GLOBAL]
  period: [1995, 2018]
  temporal_structure: panel
  exclusion_rules:
  - Use only the committed key-only country/year roster, selected from the fixed current-country ISO3 allowlist. Require exact CEPII year t and WDI indicator keys at t-1 and t+2; key presence alone does not establish a measured outcome.
  - CEPII new partner count must be a finite nonnegative integer. Code event if count at t is at least one, and control if it is zero; retain events of every positive size without outcome-dependent tuning.
  - After a separate committed source lock, require unique selected WDI rows and finite manufactures-export shares in [0,100] at both exact endpoints. Read only the selected `value` field, never `obs_status`; there is no status filter, imputation, nearest-year match, alternate series, or winsorization.
  - Retain countries with at least five complete measured pairs after outcome access.
variables:
  treatment:
  - name: positive_increase_in_fta_covered_partner_count
    source: cepii:gravity_new_fta_partner_count
    transformation: Indicator that positive year-over-year increase in active CEPII fta_wto-covered foreign partner count at t is at least one.
    notes: Derived as max(year-over-year change in covered partner count, 0). It measures net expansion in CEPII partner coverage, not first treaty accession, treaty depth, tariff reductions, or an exogenous policy shock.
  outcome:
  - name: forward_manufactures_export_share_change_percentage_points
    source: world_bank_wdi:TX.VAL.MANF.ZS.UN
    transformation: Exact manufactures exports as percent of merchandise exports at t+2 minus t-1, in percentage points.
    notes: This is an export-composition share with a merchandise-export denominator, not manufacturing productivity, export volume, or value added.
  controls:
  - name: baseline_manufactures_export_share
    source: world_bank_wdi:TX.VAL.MANF.ZS.UN
    transformation: Exact manufactures exports as percent of merchandise exports at t-1.
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: One OLS event coefficient versus zero-increase years, with the fixed t-1 baseline share and country and treatment-year fixed effects. Country-cluster CR1 standard errors and two-sided Student t(G-1) inference. The same t-1 share appears in the change outcome and as a covariate; this mechanical coupling and regression to the mean remain interpretation risks. No additional controls, lags, subgroups, or source search.
falsification:
