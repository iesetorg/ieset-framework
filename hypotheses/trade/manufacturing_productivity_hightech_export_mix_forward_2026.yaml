prior_confidence: 0.4
disclosure: >
  Descriptive calibration only. High-tech share can rise when other manufactured
  exports fall and is not domestic industrial value added. This study and its
  family partner share the OECD PDB productivity measure and many countries;
  they are not independent replications. No causal, policy-effect, position,
  featured, or school-score credit.
