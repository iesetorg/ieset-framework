    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.35
disclosure: This is a selected descriptive association, not a policy experiment
  or a causal price elasticity. BIS weights manufacturing trade partners, not
  tourism source markets; its CPI-adjusted index may miss tourist prices. WDI
  arrivals can reflect different border, survey, air, or accommodation methods
  and are trips rather than unique visitors. Exchange-rate changes can follow
  growth, inflation, crises, and safety shocks. Earlier adjacent IESET tests
  were visible; local p<=0.01 does not correct corpus-wide selection. No causal,
  policy, position, school-score, or featured credit.
steelman: hypotheses/steelman/bis_reer_appreciation_tourism_arrivals_forward_2026.md
scope:
  period: [2004, 2019]
  countries: *countries
  outcome_dim: [tourism_activity]
  policy_family: [none]
  treatment_tags: []
covers_claims: []
linked_hypotheses: []
linked_conditions: []
notes: The tourism_activity scope tag records inbound visitor-arrival volume,
  without treating the exchange-rate association as a tourism-policy effect.
