# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: bis_reer_appreciation_tourism_arrivals_forward_2026
version: 1
status: pre_registered
topic: trade
claim_direction: "-"
claim: In the fixed 62-economy 2004-2018 panel, a year with at least five log
  points of BIS broad real effective exchange-rate appreciation predicts lower
  international tourist-arrival growth from that year to the next.
methodology_note: One-test prospective descriptive calibration. Treatment values,
  GDP-control values, and tourism country/year keys alone were screened before
  registration; no tourism values, null masks, or observation-status fields were
  opened. Earlier IESET REER/export results, country-specific tourism cases, and
  a tourism-as-exposure/youth-employment test were visible. The exact BIS REER to
  WDI tourist-arrivals pair was absent. Registration and a separate source-lock
  commit must precede outcome access. The local two-sided alpha 0.01 is not
  archive-wide selection control or independent replication.
evidence_type: associational
sample:
  countries: &countries [ARE, ARG, AUS, AUT, BEL, BGR, BIH, BRA, CAN, CHE, CHL,
    CHN, COL, CYP, CZE, DEU, DNK, DZA, ESP, EST, FIN, FRA, GBR, GRC, HKG, HRV,
    HUN, IDN, IND, IRL, ISL, ISR, ITA, JPN, KOR, LTU, LUX, LVA, MAR, MEX, MKD,
    MLT, MYS, NLD, NOR, NZL, PER, PHL, POL, PRT, ROU, RUS, SAU, SGP, SRB, SVK,
    SVN, SWE, THA, TUR, USA, ZAF]
  period: [2004, 2018]
  temporal_structure: panel
  exclusion_rules:
  - Use only the 62 listed country IDs and exact treatment years 2004-2018 in the
    frozen country/year key roster; the arrival endpoint is exact t+1, ending in
    2019 before the COVID-19 disruption.
  - Exclude the BIS euro-area aggregate XM, WDI aggregate codes, and countries
    outside the fixed roster. Use BIS monthly FREQ=M, EER_TYPE=R, EER_BASKET=B,
    COLLECTION=A, UNIT_MEASURE=882; require twelve distinct finite positive
    monthly index values in each t-1 and t calendar year.
  - Require positive finite WDI tourist-arrival counts at t and t+1 and finite
    WDI real GDP growth at t; WDI observation status must be blank/null at each
    selected country/year. Drop countries with fewer than five complete pairs.
  - No country substitution, outcome-based roster revision, imputation, trimming,
    alternative vintage, or post-result model selection.
variables:
  outcome:
  - name: next_year_international_tourist_arrival_log_growth
    source: world_bank_wdi:ST.INT.ARVL
    transformation: Natural log of positive arrivals at exact t+1 minus natural
      log of positive arrivals at t.
    notes: WDI counts inbound arrival trips, not unique persons, receipts, or
      domestic tourism; national reporting methods may differ.
  treatment:
  - name: broad_real_eer_appreciation_event
    source: bis:WS_EER
    transformation: Indicator that 100 times log of the arithmetic mean of
      twelve monthly broad real EER indices at t divided by the same at t-1
      is at least five log points; zero otherwise.
    notes: A higher BIS REER index means appreciation. Its basket weights
      manufacturing trade rather than tourist origins.
  controls:
  - name: baseline_log_international_tourist_arrivals
    source: world_bank_wdi:ST.INT.ARVL
    transformation: Natural log of positive arrival count at t.
  - name: real_gdp_growth_at_t
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: Annual real GDP growth percentage at t.
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: One predeclared OLS coefficient for the appreciation indicator with
    baseline log arrivals, GDP growth, country fixed effects, and treatment-year
    fixed effects. Country-cluster CR1 standard errors use Student t with G-1
    degrees of freedom. No search or post-result covariate dropping.
falsification:
  test: bis_reer_tourism_arrivals_forward_2026_10_10
  rule: INCONCLUSIVE if fewer than 400 complete pairs, 25 countries, five
    complete years per retained country, 30 appreciation events, or 15 event
    countries survive; also if one country accounts for over 15% or the top 1%
    of rows for over 20% of residualized treatment sum of squares after all
    controls, the model is rank deficient, or clustered uncertainty is nonfinite.
    Otherwise a coefficient at most -0.03 log points with two-sided p<=0.01
    SUPPORTS the narrow negative association; a coefficient at least +0.03
    with p<=0.01 REFUTES it. Every other estimable result is PARTIAL.
  threshold:
    family_id: bis_reer_tourism_arrivals_forward_2026_10_10
    family_size: 1
    family_alpha: 0.01
    p_max_two_sided: 0.01
    expected_beta_sign: "-"
    meaningful_beta_min_abs: 0.03
    min_complete_rows: 400
    min_complete_countries: 25
    min_years_per_country: 5
    event_min_log_points: 5.0
    min_event_rows: 30
    min_event_countries: 15
    max_top_country_residual_x_share: 0.15
    max_top_one_percent_residual_x_share: 0.20
    expected_key_rows: 930
    expected_key_countries: 62
    expected_treatment_and_gdp_control_rows: 930
    expected_treatment_events: 118
    expected_treatment_event_countries: 40
    roster_sha256: 0dc4d0162c1dcdc289f904c9331da8e08f4f2a98e8e57b3163c2a396771146eb
    source_files:
      reer:
