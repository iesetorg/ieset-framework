disclosure: >
  The old SUPPORTED result was seen before this registration. WITS product HHI
  and the high-technology export value can share underlying trade records;
  forward timing does not remove all source coupling. Dollar values can change
  with prices and exchange rates. An association is not evidence of innovation,
  policy effects, or consumer welfare. Other IESET tests may share sources or
  eligible countries. Any result is descriptive calibration with zero school
  credit.
