hypothesis_id: wdi_total_rent_services_growth_2026
version: 1
status: pre_registered
topic: resource_rents
claim_direction: +
claim: Across fixed country windows in 1995, 2000, 2005 and 2010, higher baseline total natural resource
  rents (% GDP) predicts higher cumulative real services value-added growth in the next five years, conditional
  on prior five-year sector growth, baseline sector scale and real income, and country/anchor effects.
evidence_type: associational
methodology_note: One of eight prospective World Bank WDI resource-rent/sector cells. Only source hashes,
  official series definitions, country/year keys and schemas were inspected before registration. Selected
  values, null masks and estimates remain sealed until eight separate source-lock commits.
