# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: jst_1929_credit_intensity_real_gdp_pc_loss_v2
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: >
  In the fixed 18-economy JST R6 historical panel, a higher 1929 nominal
  private-loans-to-nominal-GDP ratio is associated across countries with a
  larger 1929–1933 real-GDP-per-person loss. This is a descriptive interwar
  vulnerability contrast, not evidence that credit caused the Depression.
evidence_type: descriptive
sample:
  countries: [AUS, BEL, CAN, CHE, DEU, DNK, ESP, FIN, FRA, GBR, IRL, ITA, JPN, NLD, NOR, PRT, SWE, USA]
  period: [1929, 1933]
  temporal_structure: cross_section_with_justification
  cross_section_justification: >
    The frozen registration and source plan specify one country-level rank
    comparison of 1929 exposure with 1929–1933 endpoint loss. This design
    does not estimate within-country panel or policy effects.
  exclusion_rules:
    - >
      Fix the 18 countries and only 1929 and 1933 before opening selected
      values or null masks. Require all 36 country-year keys. Retain a country
      only when 1929 tloans and GDP and both-year rgdpmad and CPI are finite
      and strictly positive. Both family tests use the identical complete-case
      country sample. No replacement, interpolation, winsorisation, or
      alternative vintage.
variables:
  treatment:
    - name: private_loans_to_gdp_1929_pp
      source: jst:R6.tloans_gdp
      transformation: 100 * tloans_1929 / gdp_1929
      notes: Both are nominal local-currency measures in the JST R6 source.
  outcome:
    - name: real_gdp_per_person_loss_1929_1933_log_pp
      source: jst:R6.rgdpmad
      transformation: -100 * log(rgdpmad_1933 / rgdpmad_1929)
estimator:
  template: descriptive
  clustering: none
  notes: >
    Estimate one country-level Spearman rank correlation of the fixed 1929
    exposure and subsequent loss. Use average ranks for ties, a two-sided
    99,999-draw permutation p-value with seed 20261010, and every
    leave-one-country-out rank correlation. The two outcomes share one
    family and Bonferroni p<=0.025 each. No regressions, controls, weights,
    revised periods, or country-level subclaims.
falsification:
  test: jst_1929_credit_intensity_real_gdp_pc_loss_rank_family_v2
  rule: >
    First require unchanged registration and two later, separately committed
    metadata-only source locks. INCONCLUSIVE if source hash/schema/key roster
    fails; fewer than 12 countries are complete for both outcomes; 1929
    loan/GDP spread is under 20 percentage points; or this outcome's loss
    spread is under 5 log percentage points. After these gates, SUPPORTED
    requires Spearman rho>=0.4, two-sided permutation p<=0.025, and every
    leave-one-country-out rho positive. REFUTED requires rho<=-0.4,
    p<=0.025, and every leave-one-out rho negative. Otherwise PARTIAL.
    One two-test family, no causal/policy/school/position/featured credit.
  threshold:
    family_id: jst_interwar_credit_intensity_real_price_losses_2026_10_10
    family_size: 2
    minimum_common_complete_countries: 12
    minimum_credit_intensity_spread_pp: 20.0
    minimum_outcome_loss_spread_log_pp: 5.0
    bonferroni_two_sided_p_max_each: 0.025
    permutations_each: 99999
    support_rho_min: 0.4
    refute_rho_max: -0.4
prior_confidence: 0.45
disclosure: >
  The two outcomes share countries, years, exposure, and source, so they are
  correlated components of one research question and not independent
  replication. Loan/GDP in 1929 can proxy financial depth and development,
  and output after 1929 depends on banking distress, gold-standard choices,
  exchange rates, tariffs, and fiscal responses. JST splices historical
  archival series. An advanced-economy rank association cannot establish
  causation or worldwide Depression severity. The adjacent JST interwar
  trade-to-GDP result uses overlapping years and countries but measures a
  different, descriptive aggregate; its observed result did not select this
  family's countries, measures, or verdict gates.
methodology_note: >
  Frozen source custody, family denominator, and analysis contract:
  engine/audits/jst_interwar_credit_severity_source_plan_2026.md.
  Post-result metadata erratum: the original registration used the invalid
  schema token cross_section and omitted the formal cross-section justification
  field. The original committed spec and measured result remain in history.
  This correction does not restore blind preregistration or public credit;
  both records remain archived.
scope:
  period: [1929, 1933]
  countries: [AUS, BEL, CAN, CHE, DEU, DNK, ESP, FIN, FRA, GBR, IRL, ITA, JPN, NLD, NOR, PRT, SWE, USA]
  outcome_dim: [gdp_growth]
  policy_family: [monetary_policy]
  treatment_tags: [historical_private_credit_intensity, great_depression]
steelman: hypotheses/steelman/jst_1929_credit_intensity_real_gdp_pc_loss_v2.md
covers_claims: []
linked_hypotheses: []
linked_conditions: []
