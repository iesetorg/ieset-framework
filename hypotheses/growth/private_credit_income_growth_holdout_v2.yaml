        source: world_bank_wdi:FS.AST.PRVT.GD.ZS
        path: data/vintages/world_bank_wdi/FS.AST.PRVT.GD.ZS@2026-05-05T194720Z.parquet
        sha256: 57d2717d9097b3142f9b116242218621e4560a6bf4e29ddc22081dd66b2a1b19
        manifest: data/manifests/fetch_run_2026-05-05T200056Z.yaml
        series_id: FS.AST.PRVT.GD.ZS
        source_url: https://api.worldbank.org/v2/country/all/indicator/FS.AST.PRVT.GD.ZS?format=json
        indicator_id: FS.AST.PRVT.GD.ZS
