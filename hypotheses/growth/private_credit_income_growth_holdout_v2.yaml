prior_confidence: 0.4
disclosure: The old PARTIAL label is archived metadata from a same-commit run whose result was known before this design. Private credit depth can reflect credit booms, reverse causation, and financial development; next-year GDP growth does not establish productivity or welfare. This country-disjoint panel is descriptive and receives no causal, welfare, or school-score credit.
