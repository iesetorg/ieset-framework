# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: tariff_private_consumption_growth_holdout_v2
version: 1
status: pre_registered
topic: growth
claim_direction: '-'
claim: Among countries excluded from the old tariff study, a higher weighted applied merchandise
  tariff at year t predicts slower real private-consumption-per-person growth from t to t+1, conditional
  on country and treatment-year effects.
methodology_note: New-ID country-disjoint measured-association follow-up to market_dynamism_tariff_reduction_consumption_pc.
  Its same-commit REFUTED old result was known before this registration. The historical runner restricted
  its fit to the explicit old country roster, all of which is excluded here. This design tests only
  the stated measured pair, not the old policy mechanism. Four tests share a two-sided Bonferroni
  cutoff of 0.025. No school score credit.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period: &id001
  - 1996
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all countries in the historical old specification: ARG AUS BGD BRA CAN CHL CHN COL DEU
    DNK EGY ESP EST FIN FRA GBR IDN IND ITA JPN KEN KOR LKA MAR MEX MYS NGA NLD NOR NZL PAK PER PHL
    POL SWE THA TUR USA VNM ZAF.'
  - Retain ISO 3166-1 alpha-3 countries and XKX only; exclude aggregates and every old-roster row
    before fitting.
  - Use exact treatment-year and next-year observations, at least five usable treatment years per
    country, and no interpolation, imputation, nearest-year substitution, country replacement, or
    vintage switch.
  - Require nonnegative tariffs or patent applications where used, positive log-growth endpoints
    and income where used, positive population denominator where used, and poverty percentages within
    0 to 100.
variables:
  outcome:
  - name: next_year_log_real_private_consumption_pc_growth
    source: world_bank_wdi:NE.CON.PRVT.PC.KD
    transformation: Natural log of positive real household consumption expenditure per person at
      exact t+1 minus natural log at exact t.
  treatment:
  - name: weighted_applied_tariff_pct
    source: wits:weighted_mean_applied_tariff
    transformation: Nonnegative weighted mean applied merchandise tariff percentage at treatment
      year t.
  controls: []
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One fixed primary coefficient with country and treatment-year effects and country-clustered
    uncertainty. No model or covariate search.
falsification:
  rule: If fewer than 500 complete treatment-year pairs or 40 countries survive the five-year rule,
    or the primary estimate or clustered uncertainty is unidentified or nonfinite, return INCONCLUSIVE.
    Otherwise SUPPORT requires the expected-sign coefficient at two-sided p<=0.10/4=0.025; REFUTATION
    requires the opposite-sign coefficient at the same cutoff. Every other estimable result is PARTIAL.
    All four fixed tests count in this Bonferroni family even if a test is inconclusive.
  test: country_disjoint_fourth_legacy_panel_fe
  threshold:
    family_id: fourth_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 4
    family_alpha: 0.1
    family_p_max: 0.025
    expected_sign: '-'
    min_observations: 500
    min_countries: 40
    min_pairs_per_country: 5
    old_hypothesis_id: market_dynamism_tariff_reduction_consumption_pc
    old_result_bucket: REFUTED
    old_claim_direction: '-'
    old_n_obs: 1021
    old_n_countries: 39
    old_run_commit: 441b76cba266e45285ffc1e4bdc81dc303a88e29
    old_country_count: 40
    old_country_ids:
