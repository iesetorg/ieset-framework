hypothesis_id: remittance_change_new_limited_liability_registrations_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Across the fixed 2006-2021 country/economy panel, a larger annual increase in personal remittances
  received as a share of GDP from t-1 to t predicts higher log(1 + newly registered limited-liability
  firms) growth from t to t+1, conditional on the year-t registration baseline, log real GDP per capita,
  real GDP growth, and country and treatment-year effects.
methodology_note: Prospective two-test descriptive calibration. Before registration, remittance and GDP-control
  values and selected outcome country/year/indicator keys were inspected; no enrolment or registration
  values, null masks, or status fields were opened. The two outcomes share one fixed roster and one Bonferroni
  family. The frozen contract is engine/audits/remittance_schooling_entry_family_prereg_2026-10-10.md.
evidence_type: associational
