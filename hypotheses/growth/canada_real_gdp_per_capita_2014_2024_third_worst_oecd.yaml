hypothesis_id: canada_real_gdp_per_capita_2014_2024_third_worst_oecd
version: 1
status: pre_registered
topic: growth
claim: Canada's real GDP per capita grew only about 3.2% in total from 2014 to 2024, third worst among the 38 OECD countries.
claim_direction: '-'
evidence_type: descriptive
sample:
  countries: &id002
  - CAN
  period: &id001
  - 2014
  - 2024
  temporal_structure: cross_section_with_justification
variables:
  outcome:
  - name: real_gdp_per_capita
    source: imf_weo_sdmx:NGDPRPC
    transformation: constant national currency per person; growth 2014->2024
estimator:
  template: descriptive
falsification:
  rule: g_i = NGDPRPC(2024)/NGDPRPC(2014) - 1 for the 38 OECD members (IMF WEO latest release). SUPPORTED if g_CAN <= 5.0% AND Canada ranks 36th or worse of 38. REFUTED if g_CAN > 8.0% OR Canada ranks 30th
    or better. PARTIAL otherwise. If NGDPRPC is missing for a country, use NGDP_R/LP (disclosed).
  test: peer_rank
  threshold: g_can<=0.05 & rank>=36
prior_confidence: 0.65
