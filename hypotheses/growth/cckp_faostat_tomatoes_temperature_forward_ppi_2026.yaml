hypothesis_id: cckp_faostat_tomatoes_temperature_forward_ppi_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Larger absolute annual country temperature °C departure at year t is associated
  with higher next-year Tomatoes single-item producer price index log growth t→t+1
  after prior PPI growth, the other weather departure, and country/year effects.
methodology_note: Value-blind key-selected single named crop, two-exposure Bonferroni
  family. Annual FAOSTAT single-item PPI, not an aggregate price index; 2014–2016=100.
  Source hashes, codes, schema and keys alone were inspected at registration.
evidence_type: associational
