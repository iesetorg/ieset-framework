  exclusion_rules:
  - Use only country/exposure-year keys in the committed roster; no interpolation
    or substitutions.
  - Use exact annual Tomatoes single-item PPI values at t-1,t,t+1, finite and positive,
    with A/E/X flags at all three years; exclude I/B/M/blank/unknown.
  - Require complete finite tas and pr at t and every 1961–1990 baseline year and
    positive pr sample SD.
  - Exclude absolute prior/future PPI log growth above 1.0 and countries with fewer
    than five complete years.
  - Do not change item, exposure, years, transformation, gates, estimator, flags or
    family size after opening measurements.
variables:
  outcome:
  - name: next_year_tomatoes_ppi_log_growth
    source: faostat:producer_prices
    transformation: log(Tomatoes single-item annual PPI at t+1) minus log(PPI at t);
      index 2014–2016=100
  treatment:
  - name: absolute_temperature_departure
    source: world_bank_cckp:cru_ts4_10_tas_pr_annual_global
    transformation: Absolute annual country temperature °C departure from 1961–1990
      normal
  controls:
  - name: prior_tomatoes_ppi_log_growth
    source: faostat:producer_prices
    transformation: log(PPI at t) minus log(PPI at t-1)
  - name: other_precipitation_departure
    source: world_bank_cckp:cru_ts4_10_tas_pr_annual_global
    transformation: Absolute annual country precipitation departure
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Country/exposure-year FE OLS, prior PPI growth and other-weather control;
    country CR1 and two-sided Student t(G-1); full-rank and concentration gates.
falsification:
  test: cckp_faostat_weather_tomatoes_ppi_family_2026_10_10_temperature
  rule: INCONCLUSIVE on any exact-source, complete-case, material-exposure, five-year-country,
    full-rank, positive finite SE, or 20% top-country residualized-exposure gate failure.
    SUPPORTED iff beta >= +0.02 and two-sided p <= 0.005; REFUTED iff beta <= -0.02
    at the same cutoff; otherwise PARTIAL when estimable. Both cases remain in one
    family.
  threshold:
    family_id: cckp_faostat_weather_tomatoes_ppi_family_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.02
    min_complete_rows: 500
    min_complete_countries: 30
    min_material_rows: 100
    min_material_countries: 20
    min_complete_years_per_country: 5
    material_abs_temperature_departure_deg_c: 1.0
    material_abs_precipitation_departure_baseline_sd: 1.0
    max_abs_ppi_log_growth: 1.0
    max_top_country_residualized_exposure_share: 0.2
