  exclusion_rules:
  - Use only the fixed 2,744-row key roster and its 180 named country/economy codes. Exclude all other
    areas and World Bank regional/income aggregates; no roster expansion after registration.
  - Require exact remittance years t-1 and t, exact outcome years t and t+2, and exact GDP controls at
    t. No nearest-year matching, interpolation, imputation, source substitution, or horizon change.
  - The preregistered treatment/control screen requires finite nonnegative remittance shares at t-1 and
    t, strictly positive real GDP per capita at t, finite real GDP growth at t, and at least five candidate
    years per country. Do not trim, winsorize, or cap valid remittance changes.
  - After the separately committed source lock, keep only finite nonnegative gross-enrolment ratios at
    both endpoints with blank WDI observation status. Do not cap gross enrolment at 100.
  - After measured-case filtering, require at least five complete pairs per retained country. No outcome-based
    country substitution or school/policy link.
variables:
  treatment:
  - name: annual_change_personal_remittances_received_pct_gdp
    source: world_bank_wdi:BX.TRF.PWKR.DT.GD.ZS
    transformation: Exact year-t percentage of GDP minus year-(t-1) percentage of GDP, in untrimmed percentage-point
      units.
  outcome:
  - name: secondary_gross_enrolment_change_pp
    source: world_bank_wdi:SE.SEC.ENRR
    transformation: Exact secondary gross-enrolment ratio in year t+2 minus its year-t ratio, in percentage
      points; gross ratios may exceed 100.
  controls:
  - name: baseline_outcome_at_t
    source: world_bank_wdi:SE.SEC.ENRR
    transformation: Gross-enrolment ratio at exact t in percentage points.
  - name: log_real_gdp_per_capita_at_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of strictly positive constant-2015-US-dollar GDP per capita at exact t.
  - name: real_gdp_growth_at_t
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: Exact year-t annual real GDP growth in percentage points.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One full-rank OLS coefficient for continuous remittance-share change, controlling for the year-t
    baseline outcome, log real GDP per capita, real GDP growth, country effects, and treatment-year effects.
    Country-cluster CR1 covariance with two-sided Student t(G-1) inference. Residualize exposure against
    all other model columns for the frozen concentration gate. No alternate model or subgroup search.
falsification:
  test: wdi_remittance_schooling_entry_family_2026_10_10
  rule: INCONCLUSIVE if source/roster chronology, 300-row/30-country/5-year sample, 20-country material-exposure,
    30% maximum-country residualized-exposure share, full-rank design, or cluster-uncertainty gate fails.
    Otherwise SUPPORTED only for beta >= +0.2 percentage points per +1 remittance GDP percentage point
    and two-sided p <= 0.005; REFUTED only for beta <= -0.2 at the same p cutoff; all other estimable
    results PARTIAL. Both fixed tests remain in the family if one is inconclusive.
  threshold:
    family_id: wdi_remittance_schooling_entry_family_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: +
