disclosure: The expected positive sign may reflect a prior that household transfers help pay for schooling
  or formal enterprise. Remittance/GDP can rise because GDP falls; country migration selection, education
  or registry reforms, and reverse timing can confound both outcomes. School enrolment is a gross ratio,
  not attainment; registrations cover formal limited-liability entities only, not all enterprises. This
  is a descriptive association, not a remittance mechanism, causal effect, or policy evaluation. Shared
  WDI transport and country-years mean the two tests are not independent replications. The local two-test
  correction does not erase wider IESET selection. Zero school, policy, causal, and featured credit.
