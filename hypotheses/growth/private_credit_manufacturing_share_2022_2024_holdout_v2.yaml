  period:
  - 2022
  - 2024
  temporal_structure: cross_section_with_justification
  cross_section_justification: One exposure-year country cross section is matched to a later outcome change;
    the test does not claim a country-year panel or time-series identification.
  exclusion_rules:
  - Only the exact 181 ISO3 country codes inherited from the old hypothesis; no donor or country substitution.
  - Read credit, manufacturing share, and real GDP per capita in 2022, and manufacturing share in 2024. Require
    exactly one country-year-indicator row for each selected cell.
  - Require finite values, positive GDP per capita, 0<=credit<=300 percent of GDP, 0<=manufacturing share<=100
    percent of GDP, and blank WDI obs_status for all selected cells.
  - Complete case only; no interpolation, winsorisation, weighting, geographic restriction, alternate endpoint,
    or alternate source.
variables:
  outcome:
  - name: manufacturing_share_change_2022_2024
    source: world_bank_wdi:NV.IND.MANF.ZS
    transformation: 2024 value minus 2022 value, percentage points of GDP
    notes: Manufacturing value-added share, not manufacturing real volume or employment.
  treatment:
  - name: private_credit_depth_2022
    source: world_bank_wdi:FS.AST.PRVT.GD.ZS
    transformation: 2022 percent of GDP divided by 10
    notes: Exposure, not exogenous credit or a policy intervention; coefficient scale is per 10 GDP-percentage-point
      difference.
  controls:
  - name: manufacturing_share_2022
    source: world_bank_wdi:NV.IND.MANF.ZS
    transformation: 2022 level, percent of GDP
  - name: log_real_gdp_per_capita_2022
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive 2022 constant-dollar GDP per capita
estimator:
  template: descriptive
  clustering: none
  notes: 'OLS with intercept and HC3 robust covariance: delta manufacturing share = alpha + beta*(2022 private
    credit/GDP divided by 10) + gamma*(2022 manufacturing share) + delta*log(2022 real GDP per capita) + residual.
    At least 80 complete countries, credit IQR at least 10 GDP percentage points, full four-column rank, finite
    HC3 standard error and confidence interval. One predeclared coefficient and no secondary tests.'
falsification:
  test: private_credit_manufacturing_share_2022_2024_holdout_v2_ols_hc3_fixed_2024
  rule: First require unchanged preregistration bytes, a separately committed source-key lock, exact WDI SHA-256
    and fetch-manifest hashes, unique selected keys, stated completeness/range/status gates, at least 80 complete
    countries, credit IQR at least 10 GDP percentage points, full-rank design, and finite HC3 uncertainty.
    Failure is INCONCLUSIVE. With all gates passed, SUPPORTED if beta <= -0.10 manufacturing-share points per
    ten credit/GDP points and its two-sided 95 percent HC3 confidence interval is wholly below zero; REFUTED
    if beta >= +0.10 and its interval wholly above zero; PARTIAL otherwise. One test; no causal, school, policy,
    or featured credit.
  threshold: N>=80; credit IQR>=10 GDP percentage points; beta <= -0.10 and CI upper <0 for support; beta >=+0.10
    and CI lower >0 for refutation
prior_confidence: 0.5
disclosure: The old same-commit 1990-2023 fit reported a negative coefficient and is already known, which could
  influence expectations. This design adds a distinct lagged two-year change endpoint, not independent source
  replication. Credit depth and manufacturing composition share common development and financial-cycle determinants;
  conditioning on two 2022 levels does not identify a causal effect. WDI values may be revised. Even a directional
  result is capped to one descriptive calibration with zero school, policy, causal, and featured credit.
