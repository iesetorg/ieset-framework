hypothesis_id: private_credit_manufacturing_share_2022_2024_holdout_v2
version: 1
status: pre_registered
topic: growth
claim_direction: '-'
claim: Among the fixed 181-country legacy roster, higher 2022 domestic credit to the private sector as a share
  of GDP predicts a decline in manufacturing value-added share between 2022 and 2024, conditional on 2022 manufacturing
  share and real GDP per capita. This is a descriptive cross-country association, not evidence that credit
  caused deindustrialisation.
evidence_type: descriptive
methodology_note: The legacy 1990-2023 same-commit result is known and archived. This new-ID continuation uses
  a 2024 outcome outside its fitted years but the same May 2026 WDI vintage; the source predates registration,
  so this is not a newly collected holdout. The exact 2024 selected values and null masks were not inspected
  before this registration. The 181-country roster, one endpoint, model, floors, thresholds, and no-score ceiling
  are frozen before the source lock and run.
