hypothesis_id: wdi_credit_formal_entry_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: Across the fixed national-area roster, a larger 2005–2015 rise in domestic credit to the private
  sector as a share of GDP predicts a larger 2015–2022 rise in new limited-liability business registrations
  per 1,000 working-age residents.
methodology_note: Prospective descriptive WDI calibration. Related credit and business-entry archive
  cases exist; this exact forward density contrast is a distinct outcome in a fixed two-test family.
  Only source metadata and geography/year keys were opened before registration.
evidence_type: descriptive
