  - 2022
  temporal_structure: cross_section_with_justification
  cross_section_justification: One earlier exposure change and one later outcome change per national
    area; annual source rows are not independent observations.
  exclusion_rules:
  - Fixed 215-area ISO3 key roster; exact credit years 2005/2015 and registrations, population, and
    age-15–64 share years 2010/2015/2022.
  - Credit/GDP must be finite in [0,500] percent; registrations finite in [0,1000000000]; population
    positive; age-15–64 share in (0,100] percent at every endpoint.
  - No imputation, interpolation, nearest-year join, geography replacement, status-based reselection,
    winsorization, or vintage switch; key presence is not numeric completeness.
variables:
  outcome:
  - name: formal_entry_density_log_change_2015_2022
    source: world_bank_wdi:IC.BUS.NREG
    transformation: 2022 minus 2015 log1p(new limited-liability registrations per 1,000 age-15–64 residents),
      with WDI population and age-share denominators.
  treatment:
  - name: private_credit_gdp_change_2005_2015_pp
    source: world_bank_wdi:FS.AST.PRVT.GD.ZS
    transformation: 2015 minus 2005 private-credit/GDP share, GDP percentage points.
  controls:
  - name: credit_gdp_2005
    source: world_bank_wdi:FS.AST.PRVT.GD.ZS
    transformation: 2005 private-credit/GDP level.
  - name: entry_density_log_2015
    source: world_bank_wdi:IC.BUS.NREG
    transformation: 2015 log1p new LLC registrations per 1,000 working-age residents.
  - name: prior_entry_density_log_change_2010_2015
    source: world_bank_wdi:IC.BUS.NREG
    transformation: 2015 minus 2010 log1p entry density using exact population and age-share endpoints.
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: Equal-country OLS with intercept and three fixed controls, HC3 robust standard error, and two-sided
    Student t reference with N minus 5 degrees of freedom. No model, subgroup, weighting, or covariate
    search.
falsification:
  rule: Any sample, material-change, IQR, rank, residual-variation, HC3, single-area concentration,
    or leave-one-out gate failure is INCONCLUSIVE with no public coefficient. Otherwise SUPPORTED requires
    beta at least +0.005 log units per credit/GDP point, two-sided p at most 0.005, and positive sign
    in at least 80% of successful leave-one-out fits. REFUTED uses beta at most -0.005 and corresponding
    significance and negative sign stability. Other estimable results are PARTIAL.
  test: ieset_credit_access_economic_2026_10_10
  threshold:
    family_id: ieset_credit_access_economic_2026_10_10
    family_size: 2
    family_alpha: 0.01
