prior_confidence: 0.4
disclosure: The old PARTIAL label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Regulatory quality does not measure private-school entry; gross enrollment can exceed 100 percent and does not measure teaching quality. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
