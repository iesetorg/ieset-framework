prior_confidence: 0.4
disclosure: The old REFUTED label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Attainment of at least upper-secondary education among adults age 25 and older is a slowly changing stock; income is not a market-policy intervention and schooling can also raise income. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
