topic: growth
claim: Despite the security turnaround, El Salvador has the lowest investment rate in Central America and has not out-grown its peers under Bukele.
claim_direction: '-'
evidence_type: descriptive
sample:
  countries: &id002
  - SLV
  - GTM
  - HND
  - NIC
  - CRI
  - PAN
  - DOM
  period: &id001
  - 2019
  - 2025
  temporal_structure: panel
variables:
  outcome:
  - name: investment_gdp
