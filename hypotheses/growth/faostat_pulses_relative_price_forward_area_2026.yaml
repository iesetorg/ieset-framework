  exclusion_rules:
  - Use only fixed key-roster treatment years, exact t-1/t producer price indices
    and exact t-1/t/t+1 crop outcome; no interpolation or nearest-year join.
  - Map FAOSTAT M49 country keys to current ISO3 with pycountry; exclude non-ISO3
    aggregates.
  - Admit finite positive index/outcome values with A, E or X flags; exclude I, B,
    M, blank and unknown flags, and report admitted flag counts.
  - Exclude absolute log relative-price growth or either outcome growth above 0.50.
    Keep countries with at least five complete treatment years.
  - Do not change codes, years, flags, transformations, sample floors, multiplicity,
    estimator or gate thresholds after selected measurements are opened.
variables:
  outcome:
  - name: forward_area_log_growth
    source: faostat:crop_and_livestock_products
    transformation: log(harvested area at t+1) minus log(harvested area at t), exact
      item 1726, element 5312, unit ha
    notes: Aggregate group outcome; yield can change with crop composition.
  treatment:
  - name: relative_crop_producer_price_log_growth
    source: faostat:producer_prices
    transformation: '[log(index item 1726/agriculture index item 2051) at t] minus
      same at t-1; element 5539, annual 7021'
    notes: Relative nominal farm-gate price index; not an exogenous price shock.
  controls:
  - name: prior_outcome_log_growth
    source: faostat:crop_and_livestock_products
    transformation: log(outcome at t) minus log(outcome at t-1)
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS of next-year log outcome growth on current relative-price log growth
    and prior outcome log growth, with country and treatment-year effects. Country-cluster
    CR1 uncertainty, two-sided Student t(G-1), full-rank and residualized-exposure
    concentration gates.
falsification:
  test: faostat_relative_price_crop_supply_family_2026_10_10_pulses_area
  rule: INCONCLUSIVE if any committed-source, sample (500/30), material-exposure (100/20),
    five-year-country, rank, concentration or finite-cluster-uncertainty gate fails.
    SUPPORTED iff beta >= +0.05 and two-sided p <= 0.01/8. REFUTED iff beta <= -0.05
    and the same cutoff. Otherwise PARTIAL if estimable. All eight cells remain in
    the family denominator.
  threshold:
    family_id: faostat_relative_price_crop_supply_family_2026_10_10
    family_size: 8
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.00125
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.05
    meaningful_beta_unit: log growth per log relative-price change
    min_complete_rows: 500
    min_complete_countries: 30
    min_material_rows: 100
    min_material_countries: 20
    material_abs_relative_price_log_change: 0.05
    max_abs_price_and_outcome_log_change: 0.5
    min_complete_years_per_country: 5
    max_top_country_residualized_exposure_share: 0.2
    roster_sha256: 8cc8933d4c40092016b25358c25609311681b1eab589c4d77ece1cc6979a0b18
    source_lock_path: data/pinned_evidence/faostat_relative_price_crop_supply_2026.manifest.json
