hypothesis_id: faostat_pulses_relative_price_forward_area_2026
version: 1
status: pre_registered
topic: growth
claim_direction: +
claim: In the frozen 1992–2023 country-year source-key roster, stronger annual growth
  in the pulses producer-price index relative to the agriculture producer-price index
  from t-1 to t predicts higher pulses harvested area growth from t to t+1, after
  prior outcome growth and country/year effects.
methodology_note: Prospective eight-cell FAOSTAT descriptive family. Only schemas,
  codebooks, source hashes and item/country/year keys were read before registration.
  Price and crop measurements, flags and null masks remain unopened until the separate
  source lock is committed. Four food-crop groups cross two distinct supply margins;
  the eight cells overlap and are not independent replications.
evidence_type: associational
