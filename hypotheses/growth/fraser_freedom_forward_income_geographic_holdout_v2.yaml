disclosure: The analyst knew the old PARTIAL verdict when selecting this disjoint follow-up. Country and
  year effects plus lagged outcome timing do not identify a causal effect; omitted institutions, reverse
  causation, and shared international measurement may explain the association. An old proxy result cannot
  be promoted by this registration alone. Some WDI/WGI vintages and eligible countries overlap the already
  fitted 16 WGI/trade v2 holdouts. "Held-out" means country-disjoint from this design's named old ID,
  not unseen across the entire IESET programme; the three-test correction applies only to this registered
  family.
