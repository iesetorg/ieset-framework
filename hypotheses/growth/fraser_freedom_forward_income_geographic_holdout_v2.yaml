# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: fraser_freedom_forward_income_geographic_holdout_v2
version: 1
status: pre_registered
topic: growth
claim: Among countries excluded from the old economic-freedom study, higher Fraser aggregate economic-freedom
  scores are associated with faster real PPP GDP-per-capita growth from treatment year t to exact calendar
  year t+1, conditional on country and year effects and three fixed controls.
claim_direction: +
methodology_note: New-ID country-disjoint follow-up to economic_freedom_index_income_correlation (PARTIAL
  old result known). The old draft included Heritage and component-index language, but its generic runner
  used only the first treatment. This follow-up narrows the primary verdict to the Fraser aggregate and
  next-year real income growth. Legal-system and sound-money scores are fixed separate descriptive
  regressions on available subsets of the primary panel, each requiring at least five paired years per
  country and reporting its own observation and country count. Once all pinned files pass hash custody,
  component-row availability cannot alter the primary sample or verdict; a missing or mismatched pinned
  component file aborts the run before fit. Neither component receives separate verdict or scoreboard credit.
  The three local Fraser
  slices are pinned by SHA-256, but no fetch or derivation manifest for those slices was found; upstream
  acquisition and component transformation remain unverified. The analyst saw the old same-commit result before
  designing this new-ID holdout; that old run receives no prospective credit. The three tests share international
  macro data and use a Bonferroni family threshold. No held-out coefficient was inspected before registration.
  A provisional pre-registration screen counted finite/nonmissing candidate-series records without reviewing
  magnitudes; those counts were withdrawn and replaced by country/year-key upper bounds. Candidate selection
  and the 1500-pair/70-country minimum gate were therefore calibrated after seeing availability patterns.
  Some WDI/WGI vintages and eligible countries overlap the already fitted 16 WGI/trade v2 holdouts. "Held-out"
  means country-disjoint from this design's named old ID, not unseen across the entire IESET programme;
  the three-test correction applies only to this registered family.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period: &id001
  - 2000
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all 44 countries in the historical old specification, including any without fitted rows:
    ARG AUS AUT BEL BRA CAN CHL CHN CZE DEU DNK EGY ESP EST FIN FRA GBR GHA HKG HUN IDN IND IRL ITA JPN
    KEN KOR MEX MYS NGA NLD NOR NZL PHL POL RUS SGP SWE THA TUR USA VEN VNM ZAF.'
  - Retain only ISO 3166-1 alpha-3 countries with nonmissing finite primary treatment, outcome, and control
    series, exact t and t+1 calendar-year pairing, and at least five complete treatment years per country.
    Component-score row availability does not filter the primary sample after source hashes verify. Do not
    choose countries or covariates
    by the held-out outcome level, sign, or coefficient.
  - Require positive values before natural-log transformations; do not impute, interpolate, or use a nearest-year
    substitute.
variables:
  outcome:
  - name: next_year_log_real_gdp_pc_ppp_growth
    source: world_bank_wdi:NY.GDP.PCAP.PP.KD
    transformation: natural log of exact t+1 value minus natural log of t value; both positive
  treatment:
  - name: fraser_aggregate_score
    source: fraser_efw:aggregate_score
    transformation: level at t
  controls:
  - name: log_population
    source: world_bank_wdi:SP.POP.TOTL
    transformation: natural log at t
  - name: trade_openness
    source: world_bank_wdi:NE.TRD.GNFS.ZS
    transformation: level at t
  - name: rule_of_law
    source: wgi:RL.EST
    transformation: level at t
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One primary OLS coefficient on the t treatment with country and treatment-year fixed effects
    and country-clustered standard errors. Treatment year t is the year-effect key. Use the fixed complete-case
    sample; no automatic control dropping. The three registered primary tests use the same two-sided Bonferroni
    threshold.
falsification:
  rule: If fewer than 1500 complete t/t+1 country-year pairs or 70 countries remain after the five-year
    screen, or if the primary coefficient or its clustered uncertainty is unidentified/nonfinite, return
    INCONCLUSIVE. Otherwise SUPPORT requires a positive primary coefficient and two-sided country-clustered
    p <= 0.10/3. REFUTATION requires a negative coefficient and the same p threshold. Every other estimable
    result is PARTIAL. Apply the same family rule to all three tests, including adverse results.
  test: country_disjoint_exact_next_year_panel_fe
  threshold:
    family_id: legacy_wdi_wgi_owid_panel_holdouts_2026_10_09
    family_size: 3
    family_alpha: 0.1
    family_p_max: 0.03333333333333333
    expected_sign: +
    min_observations: 1500
    min_countries: 70
    min_pairs_per_country: 5
    old_hypothesis_id: economic_freedom_index_income_correlation
    old_result_bucket: PARTIAL
    old_country_count: 44
    source_files:
      outcome:
        path: data/vintages/world_bank_wdi/NY.GDP.PCAP.PP.KD@2026-05-05T194648Z.parquet
