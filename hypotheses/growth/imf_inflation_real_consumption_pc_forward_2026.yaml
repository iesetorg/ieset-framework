hypothesis_id: imf_inflation_real_consumption_pc_forward_2026
version: 1
status: pre_registered
topic: growth
claim_direction: '-'
claim: Across the fixed 187-economy structural panel, a larger three-year increase in bounded IMF annual
  CPI inflation predicts lower subsequent three-year growth of real household consumption per person.
methodology_note: Retrospective blind-outcome calibration from exact pinned IMF and WDI snapshots. Only
  source schemas, selected WDI indicator/country/year keys, and IMF inflation plus WDI GDP-per-person
  control values were read before registration. No selected outcome value, null mask, observation status,
  coefficient, or exact directed-pair result card was opened. A related IMF-inflation to CEPAL poverty
  design and wider archive labels were visible, so this is not an archive-wide independent holdout.
