  temporal_structure: panel
  exclusion_rules:
  - Use the frozen key-only 3,919 economy-year roster and exact ISO3/year joins. Do not add, replace,
    or remove economies after selected outcomes are opened.
  - IMF WEO flow WEO inflation must have a finite annual value at t-3 and t. WDI real GDP per person must
    be finite, positive, and have blank observation status at t-3 and t.
  - Selected WDI outcome files must carry unique indicator_id/country_iso3/year keys at t-3, t, and t+3.
    The prelock structural-key check does not inspect their values, nulls, or status.
  - Use exposure years t=1995..2016 only, and selected outcome years t-3, t, t+3 ending no later than
    2019 to avoid pandemic and IMF projection periods.
  - Require positive finite selected values at t-3, t, and t+3. Require blank WDI observation status for
    all three selected years. Drop an invalid or status-flagged triple only; report separate counts.
  - After selected triple filtering, retain only economies with at least eight complete exposure years.
    No interpolation, nearest-year substitution, winsorization, outcome-driven country removal, alternate
    horizon, or alternate estimator.
variables:
  treatment:
  - name: bounded_inflation_acceleration
    source: imf_weo_sdmx:WEO__PCPIPCH
    transformation: 2 * (tanh(CPI inflation percent at t / 20) - tanh(CPI inflation percent at t-3 / 20))
    notes: One exposure unit is roughly a rise from zero to 11 percent annual CPI inflation. It is a bounded
      macro signal, not policy treatment.
  outcome:
  - name: forward_three_year_log_real_private_consumption_pc_change
    source: world_bank_wdi:NE.CON.PRVT.PC.KD
    transformation: ln(positive real household consumption per person at t+3) minus ln(value at t)
    notes: Three-year forward change; selected t-3/t/t+3 values remain sealed until a separately committed
      source lock.
  controls:
  - name: baseline_outcome
    source: world_bank_wdi:NE.CON.PRVT.PC.KD
    transformation: selected outcome level at t, log level for consumption
  - name: prior_outcome_change
    source: world_bank_wdi:NE.CON.PRVT.PC.KD
    transformation: selected outcome level at t minus level at t-3, log difference for consumption
  - name: prior_bounded_inflation_level
    source: imf_weo_sdmx:WEO__PCPIPCH
    transformation: 2 * tanh(CPI inflation percent at t-3 / 20)
  - name: log_real_gdp_pc_at_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive constant-price GDP per person at t
  - name: prior_three_year_log_gdp_pc_change
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log GDP per person at t minus natural log at t-3
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: 'One OLS equation per selected outcome: t to t+3 change on bounded t-3 to t inflation acceleration,
    prior bounded inflation level, baseline outcome, prior outcome change, log GDP per person at t, prior
    three-year log GDP-per-person change, economy and treatment-year effects. Reporter-cluster CR1 covariance
    with G/(G-1)*(N-1)/(N-K) small-sample correction, two-sided Student t(G-1) p-values, and simultaneous
    99.6667 percent confidence intervals. Require full rank and residualized-treatment concentration gates.'
falsification:
  test: run_imf_inflation_macro_responses_2026
  rule: INCONCLUSIVE if frozen registration/source-lock chronology, source custody, key roster, selected-outcome
    validity/status, complete-case/time/material-exposure floors, full rank, residualized-treatment concentration,
    or finite country-cluster uncertainty fail. SUPPORTED only if the coefficient has the registered sign,
    absolute magnitude at least 0.015 log points, and two-sided p<=0.01/3. REFUTED only if the opposite
    sign clears the same magnitude and p gate. All other method-valid estimates are PARTIAL. No fallback
    endpoint or post-result specification change.
  threshold:
    family_id: imf_inflation_macro_responses_2026_10_10
    family_size: 3
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0033333333333333335
