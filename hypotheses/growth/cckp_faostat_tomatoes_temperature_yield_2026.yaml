hypothesis_id: cckp_faostat_tomatoes_temperature_yield_2026
version: 1
status: pre_registered
topic: growth
claim_direction: '-'
claim: For the fixed 1963–2024 country-year roster, larger absolute annual mean-temperature
  departure from 1961–1990 country normal, degC is associated with lower same-year
  tomatoes yield log growth after prior crop growth, the other climate-departure measure,
  and country/year effects.
methodology_note: 'Value-blind 56-cell climate/crop family: four FAO aggregate groups
  and ten named crops, two crop margins, two distinct weather exposures. Only source
  schema, hashes, item/country/year keys, units and flag codebook were inspected at
  registration; measurements, null masks and flags remain unopened. All cells share
  one family multiplicity denominator and are correlated, not independent replications.'
