  period:
  - 1961
  - 2024
  temporal_structure: panel
  exclusion_rules:
  - Use only country-year keys in the committed roster; no interpolation, nearest-year
    join, or substitutions.
  - Map FAOSTAT M49 to current ISO3 with pycountry; exclude noncountries and the CCKP
    KSV code.
  - Require exact crop values at t, t-1 and t-2, finite and positive, exact unit;
    admit only FAO A, E and X flags and report their counts. Exclude I, B, M, blank
    or unknown flags.
  - Require climate tas and pr at t and all 1961–1990 baseline years; finite values
    and a positive precipitation baseline sample SD.
  - Exclude absolute current or prior crop log growth above 1.0; keep countries with
    at least five complete years.
  - Do not change item, margin, climate exposure, years, transformation, gates, estimator
    or family size after opening selected measurements.
variables:
  outcome:
  - name: same_year_yield_log_growth
    source: faostat:crop_and_livestock_products
    transformation: log(yield at year t) minus log(yield at t-1), item 388, element
      5412, unit kg/ha
  treatment:
  - name: absolute_temperature_departure
    source: world_bank_cckp:cru_ts4_10_tas_pr_annual_global
    transformation: absolute annual mean-temperature departure from 1961–1990 country
      normal, degC
    notes: Annual country-average gridded observation; does not isolate crop-zone
      weather.
  controls:
  - name: prior_crop_log_growth
    source: faostat:crop_and_livestock_products
    transformation: log(yield at t-1) minus log(yield at t-2)
  - name: other_pr_departure
    source: world_bank_cckp:cru_ts4_10_tas_pr_annual_global
    transformation: absolute annual precipitation departure from 1961–1990 country
      normal, divided by that baseline's sample SD
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS with country and outcome-year fixed effects, prior crop log growth and
    the other weather-departure control; country-cluster CR1 standard error and two-sided
    Student t(G-1), full-rank and residualized-exposure concentration gates. No alternate
    estimator is substituted on failure.
falsification:
  test: cckp_faostat_weather_crop_family_2026_10_10_tomatoes_yield_temperature
  rule: INCONCLUSIVE if exact-source, complete-case (500/30), material exposure (100/20),
    five-year-country, rank, positive finite country-cluster SE, or 20% top-country
    residualized-exposure cap fails. SUPPORTED iff beta <= -0.02 and two-sided p <=
    0.01/56. REFUTED iff beta >= +0.02 at the same p cutoff; otherwise PARTIAL when
    estimable. All 56, including failures, remain in the denominator.
  threshold:
    family_id: cckp_faostat_weather_crop_family_2026_10_10
    family_size: 56
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.00017857142857142857
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.02
