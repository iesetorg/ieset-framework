prior_confidence: 0.50
disclosure: >-
  Residential property prices and income respond jointly to credit, policy,
  migration, and demand. The lag and fixed effects do not identify a housing
  policy effect. The original candidate's mislabeled proxy and same-commit
  result provide no prospective support for this narrow test.
steelman: hypotheses/steelman/bis_real_residential_price_growth_income_growth_country_holdout_v2.md
scope:
  period: [1996, 2023]
  countries: *heldout
  outcome_dim: [housing, gdp_growth]
  policy_family: [housing_policy]
