hypothesis_id: oecd_cit_private_investment_forward_calibration_2026
version: 1
status: pre_registered
topic: fiscal
claim_direction: +
claim: Across the fixed 2001–2020 OECD-source tax-rate reporter roster, a statutory combined corporate-income-tax
  cut of at least one percentage point from t−1 to t predicts a higher two-year change
  in private gross fixed capital formation as a share of GDP from t to t+2 than tax-stable
  years, conditional on rate-hike years, baseline private investment, country effects,
  and year effects.
methodology_note: New claim-specific descriptive calibration after the archived corporate_tax_rate_investment_elasticity
  Fraser/GDP-per-capita placeholder failed its estimator floor. Treatment/shock values
  and outcome keys only were inspected before registration; selected outcome values,
  null masks, and status fields remain unopened. The two-test Bonferroni contract
  is in engine/audits/placeholder_claim_specific_replacement_prereg_2026-10-10.md.
  No old verdict, score, or causal credit is inherited.
