  temporal_structure: panel
  exclusion_rules:
  - Use only the frozen key-only roster with OECD statutory-rate keys at t−1,t and
    WDI private-investment keys at t,t+2; no year substitution or imputation.
  - Rates must be finite within 0–100%; a cut is Δrate≤−1 pp, hike Δrate≥+1 pp, stable
    |Δrate|<1 pp; keep every otherwise valid reform.
  - Both private-investment endpoints must be finite within 0–100% of GDP and have
    blank WDI observation status; omit blank-code aggregate rows.
  - After the lock, retain countries with at least five complete pairs and enforce
    the registered sample, exposure, rank, and influence floors.
scope:
  period: *id001
  countries: *id002
  outcome_dim:
  - industrial_capability
  policy_family:
  - tax_policy
  treatment_tags:
  - corporate_income_tax
variables:
  treatment:
  - name: cit_cut_at_least_one_pp
    source: oecd_taxstruct:combined_corporate_income_tax_rate
    transformation: 1 if rate(t)-rate(t−1)≤−1 percentage point; 0 otherwise.
  - name: cit_hike_at_least_one_pp
    source: oecd_taxstruct:combined_corporate_income_tax_rate
    transformation: Nuisance indicator, 1 if rate(t)-rate(t−1)≥+1 percentage point.
  outcome:
  - name: two_year_private_investment_share_change
    source: world_bank_wdi:NE.GDI.FPRV.ZS
    transformation: Private gross fixed capital formation / GDP at t+2 minus its value
      at t, in percentage points.
  controls:
  - name: baseline_private_investment_share
    source: world_bank_wdi:NE.GDI.FPRV.ZS
    transformation: Value at tax-change year t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: OLS with cut and hike indicators and baseline private-investment share; country-cluster
    CR1 standard errors and Student t(G−1).
falsification:
  rule: SUPPORTED if the cut coefficient is at least +0.5 percentage point with two-sided
    country-cluster p≤0.005; REFUTED if at most −0.5 pp with p≤0.005; otherwise PARTIAL.
    Any frozen sample, exposure, full-rank, uncertainty, or concentration gate failure
    is INCONCLUSIVE.
  test: oecd_cit_private_investment_forward_bonferroni_2026
  threshold:
    family_id: placeholder_claim_specific_replacement_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: +
    meaningful_beta_min_abs: 0.5
    min_valid_rows: 500
    min_valid_countries: 30
    min_cut_rows: 50
    min_cut_countries: 20
    min_stable_rows: 200
    min_years_per_country: 5
    max_top_one_percent_partialled_x_share: 0.2
    max_top_country_partialled_x_share: 0.12
