hypothesis_id: us_federal_interest_share_of_receipts_doubled_since_2002
version: 1
status: pre_registered
topic: fiscal
claim: Interest on the US national debt now takes about 25% of federal tax revenue, up from about 12% in 2002.
claim_direction: +
evidence_type: descriptive
sample:
  countries: &id002
  - USA
  period: &id001
  - 2002
  - 2026
  temporal_structure: time_series
variables:
  outcome:
  - name: federal_interest_outlays_fy
    source: fred:FYOINT
    transformation: USD millions, fiscal year (net interest)
  - name: federal_receipts_fy
    source: fred:FYFR
    transformation: USD millions, fiscal year
estimator:
  template: descriptive
falsification:
  rule: 'Share = FYOINT/FYFR. SUPPORTED if latest FY share >= 22% AND FY2002 share <= 15%. REFUTED if latest FY share < 15%. PARTIAL otherwise. Note: FYOINT is net interest; the post''s $1.3T figure is
    gross interest including intragovernmental trust-fund interest, which this test does not use.'
  test: ratio_endpoints
  threshold: share_latest>=0.22 & share_2002<=0.15
prior_confidence: 0.5
disclosure: Drafted 2026-10-09 from a high-engagement X post (source URL in source_provenance). The figures quoted in the post were seen before drafting. No IESET data for this test was fetched or inspected
  before this spec was frozen in prereg/x_sourced_2026-10-09_batch2/PREREG_LEDGER.json and committed to git; the run directory is added in a later commit. Thresholds chosen by the drafting agent and not
  reviewed by a second analyst.
conflict_disclosure: Author holds no positions related to this claim. Engine house prior is market-liberal; disclosed.
steelman: hypotheses/steelman/us_federal_interest_share_of_receipts_doubled_since_2002.md
scope:
  period: *id001
  countries: *id002
  outcome_dim:
  - fiscal_policy
  - taxation
  policy_family:
  - fiscal_policy
