disclosure: The old REFUTED label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Total tax revenue does not measure redistribution or marginal tax rates; private gross capital formation and tax receipts both have GDP in the denominator. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
