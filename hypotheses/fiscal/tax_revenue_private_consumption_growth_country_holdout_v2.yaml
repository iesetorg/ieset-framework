prior_confidence: 0.4
disclosure: The old SUPPORTED result was seen before this new design. Feasibility checked null masks and country/year
  keys only, never candidate magnitudes, signs, or estimates. Central-government tax revenue as a share of GDP excludes most subnational taxes and social contributions; it is not tax-code
  simplicity, marginal tax rates, or household disposable income. Real private consumption per person measures spending,
  not after-tax income. This is descriptive calibration, not causal validation of the old mechanism, and grants
  no policy or school-score credit.
