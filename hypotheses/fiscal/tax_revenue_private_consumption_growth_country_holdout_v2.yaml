# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: tax_revenue_private_consumption_growth_country_holdout_v2
version: 1
status: pre_registered
topic: fiscal
claim_direction: '-'
claim: Across countries excluded from the old tax-simplicity panel, a higher central-government tax-revenue share of GDP at year
  t predicts lower next-year log growth in real household and NPISH final consumption per person, conditional on
  real GDP per person and country and year fixed effects.
methodology_note: New-ID country-disjoint, measured-association follow-up to tax_simplicity_disposable_income_growth.
  The old same-commit SUPPORTED result was known before this design and supplies no prospective evidence. One five-case
  family uses a two-sided Bonferroni p<=0.10/5 rule fixed before outcome magnitudes, signs, or fits. Pre-registration
  feasibility examined country/year keys and null masks only. All old-roster countries are excluded; this is descriptive
  calibration with zero school-score credit.
evidence_type: associational
sample:
  countries:
  - GLOBAL
  period:
  - 2000
  - 2022
  temporal_structure: panel
  exclusion_rules:
  - 'Exclude all countries in the historical old specification: ARG AUS BGD BRA CAN CHL CHN COL DEU DNK EGY ESP
    EST FIN FRA GBR IDN IND ITA JPN KEN KOR LKA MAR MEX MYS NGA NLD NOR NZL PAK PER PHL POL SWE THA TUR USA VNM
    ZAF.'
  - Retain ISO alpha-3 countries and XKX only; drop geographic aggregates and exclude the whole old roster before
    fitting.
  - Join treatment year t to exact calendar year t+1; require at least five complete treatment years per country
    and do not interpolate, impute, swap countries, or switch vintages.
  - Require finite treatment, outcome, and control measures, with positive real income for the log control. Require
    positive real consumption at both t and t+1 for log growth.
variables:
  outcome:
  - name: next_year_private_consumption_pc_log_growth
    source: world_bank_wdi:NE.CON.PRVT.PC.KD
    transformation: Log of positive real per-person consumption at exact t+1 minus log of its positive value at
      t.
  treatment:
  - name: central_government_tax_revenue_pct_gdp
    source: world_bank_wdi:GC.TAX.TOTL.GD.ZS
    transformation: Observed level at treatment year t.
  controls:
  - name: log_real_gdp_pc_at_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One fixed OLS coefficient with country and treatment-year effects, country-clustered standard errors, and
    no model search or automatic control dropping.
falsification:
  rule: INCONCLUSIVE if fewer than 400 complete treatment-year pairs or 35 countries survive the five-year rule,
    or if the primary coefficient or country-clustered uncertainty is unidentified or nonfinite. Otherwise SUPPORTED
    for the expected sign at two-sided p<=0.02; REFUTED for the opposite sign at p<=0.02; PARTIAL for every other
    estimable result. All five registered tests remain in the correction family, including inconclusive tests.
  test: country_disjoint_seventh_legacy_panel_fe
  threshold:
    family_id: seventh_legacy_panel_geographic_holdouts_2026_10_09
    family_size: 5
    family_alpha: 0.1
    family_p_max: 0.02
    expected_sign: '-'
    min_observations: 400
    min_countries: 35
    min_pairs_per_country: 5
    old_hypothesis_id: tax_simplicity_disposable_income_growth
    old_result_bucket: SUPPORTED
    old_n_obs: 786
    old_n_countries: 36
    old_spec_commit: e786a95e676c9d6283c123682d43bf54dbacd73b
    old_run_commit: e786a95e676c9d6283c123682d43bf54dbacd73b
    old_runner_filter_proof: At old_run_commit, scripts/run_panel_fe.py filter_sample restricts country_iso3 to
      spec.sample.countries before run_panel_ols. The entire old roster below is excluded, including any old countries
      without fitted rows.
    old_country_count: 40
    old_country_ids:
    - ARG
    - AUS
