    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.5
disclosure: A negative prior reflects fiscal crowding-out debate, but the outcome is total fixed investment
  and GDP-share denominators can co-move. Country/year effects and controls do not identify causation
  or defense policy effects. Local alpha .01 does not correct archive-wide selection. Zero causal, policy,
  school, position and featured credit.
