  temporal_structure: panel
  exclusion_rules:
  - Only the frozen SIPRI-name-to-ISO3 key roster at t=2000, 2005, 2010 and 2015; require exact source
    keys at military t−5/t, WDI investment t/t+5, and WDI real GDP per capita t−5/t.
  - After registration and source-lock commits, require finite military shares in [0,20] percent GDP at
    both endpoints and absolute five-year change <=5 points; finite investment shares in [0,80] at t and
    t+5; positive finite GDP per capita at t−5 and t.
  - Retain countries with at least two complete anchors. No imputation, interpolation, winsorization,
    source substitution or post-result window/model/cap change. SIPRI has no cell-status field; WDI blank
    status is not proof of observed rather than estimated data.
variables:
  treatment:
  - name: prior_five_year_military_burden_change_pp
    source: sipri:milex_share_gdp
    transformation: Military expenditure percent of GDP at t minus percent of GDP at t−5; [0,20] endpoint
      and <=5-point absolute-change bounds.
    notes: Descriptive expenditure-share movement, not an exogenous defense budget policy shock.
  outcome:
  - name: later_five_year_fixed_investment_share_change_pp
    source: world_bank_wdi:NE.GDI.FTOT.ZS
    transformation: Gross fixed capital formation percent of GDP at t+5 minus percent of GDP at t.
    notes: Includes public and private fixed assets, potentially defense assets; not civil infrastructure
      spending.
  controls:
  - name: baseline_fixed_investment_share
    source: world_bank_wdi:NE.GDI.FTOT.ZS
    transformation: Percent GDP at t.
  - name: baseline_military_burden
    source: sipri:milex_share_gdp
    transformation: Percent GDP at t−5.
  - name: baseline_log_real_income
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of constant-2015-dollar GDP per capita at t.
  - name: prior_real_income_growth
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log GDP per capita at t minus log at t−5.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - anchor_year
  clustering: country
  notes: Equal-country-anchor OLS of t-to-t+5 investment-share change on prior military-burden change,
    four frozen baseline controls, country and anchor-year effects. Country-cluster CR1 covariance; two-sided
    Student t(G−1), 99% interval; fixed five-fold country hash omissions for sign stability. One test,
    alpha .01.
falsification:
  test: sipri_military_fixed_investment_forward_2026_10_10
  rule: INCONCLUSIVE if exact-source/chronology, complete-case, anchor, material-change, residual-variation,
    concentration, full-rank, cluster-uncertainty or hash-fold coverage gates fail. SUPPORTED iff beta
    <= −0.25 investment-share points per +1 military-share point, two-sided p <= .01, and at least four
    of five folds are negative. REFUTED iff beta >= +0.25 with p <= .01 and at least four folds positive.
    Otherwise PARTIAL.
  threshold:
    family_id: sipri_military_burden_fixed_investment_2026_10_10
    family_size: 1
    family_alpha: 0.01
    p_max_two_sided: 0.01
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.25
