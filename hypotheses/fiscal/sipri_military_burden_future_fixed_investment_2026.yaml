hypothesis_id: sipri_military_burden_future_fixed_investment_2026
version: 1
status: pre_registered
topic: fiscal
claim_direction: '-'
claim: Across four frozen five-year national windows, larger rises in SIPRI military expenditure as a
  GDP share from t−5 to t predict smaller subsequent changes in WDI gross fixed capital formation as a
  GDP share from t to t+5, conditional on baseline investment, military burden, real income, prior income
  growth, and country/anchor effects.
evidence_type: associational
methodology_note: One prospective descriptive panel test. The 660-row country/year roster and official
  source hashes were assembled from metadata and keys only; selected values, null masks and signs remain
  unopened before this registration and a separate source lock.
