    secondary_source_sha256: fee6f66739512936ab17e82c4b7b788dc3030620ba30a6e5671e972a3a341a21
    min_valid_rows: 300
    min_valid_countries: 90
    min_rows_per_anchor: 45
    min_complete_anchors_per_country: 2
    min_material_change_rows: 50
    min_material_change_countries: 35
    material_change_pp: 0.5
    max_military_share_pct_gdp: 20.0
    max_abs_five_year_military_change_pp: 5.0
    max_investment_share_pct_gdp: 80.0
    min_residual_treatment_sd_pp: 0.2
    min_residual_outcome_sd_pp: 1.0
    max_top_one_percent_treatment_ss_share: 0.3
    max_top_country_treatment_ss_share: 0.2
    min_fold_rows: 200
