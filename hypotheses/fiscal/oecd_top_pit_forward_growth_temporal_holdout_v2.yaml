    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    causal_credit: 0
    featured_eligible: false
prior_confidence: 0.35
disclosure: >-
  OECD headline tax rates can differ sharply from effective liabilities and
  omit bracket thresholds, credits, social contributions, capital income,
  and tax-base reforms. The modern rates do not reproduce the old 70-percent
  treatment. GDP growth, tax schedules, and trade can respond to common
  shocks; country/year effects and a pretrend do not identify a tax effect.
  The old verdict and related top-PIT studies were visible before this new
  registration, and the 0.005 cutoff does not correct the entire IESET
  archive search. No causal, policy, school, position, or featured credit.
steelman: hypotheses/steelman/oecd_top_pit_forward_growth_temporal_holdout_v2.md
intervention_channel: fiscal
intervention_channel_justification: The exposure is the OECD-recorded statutory personal income-tax schedule.
scope:
