linked_conditions: []
notes: 'STATUS: UNTESTED CANDIDATE; prepared 2026-10-09. No outcome microdata have been acquired, no estimator has
  run, and no causal result, local dataset, fetch manifest, access permission or ingestion adapter is claimed.

  PROVENANCE: manual is a registered pending provenance marker in data/fetchers/publishers.yaml. Each manual series
  below is a planned extraction/linkage, not an existing IESET dataset. Before estimation, preserve publisher URL,
  exact table/field, unit, coverage, extraction UTC, release vintage, license/access restrictions, SHA256 and linkage
  recipe in an immutable manifest. The 2026-10-09 website consultation date is not a dataset fetch timestamp. No
  derived/computed series is represented as materialized.

  REGISTRATION: resolve access, legal coding, estimand and power review; independently review the steelman; obtain
  a prospective preregistration commit that is a strict ancestor of the first run commit. Do not create run artifacts
  from this draft. Changes after any first run require an explicitly versioned alternative; no retroactive preregistration
  claim.

  ATTRIBUTION: fiscal tax-base treatment only. State payroll and land taxes, RBA monetary policy, pandemic support
  expiry, commodity prices and ATO enforcement must not be silently attributed to a federal tax-rate increase. Party
  identity is not a treatment. Effects apply to the stated treated population and window, not to all Australian
  business or net national welfare.

  LEGAL PROVENANCE: ATO, Changes to deductibility of interest on ATO debts, published 2025-06-06, https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/tax-professionals-newsroom/changes-to-deductibility-of-interest-on-ato-debts
  ; effective 2025-07-01. The rate quoted in that old release is not a current GIC-rate input. ATO law explanation,
  updated 2025-08-29, https://www.ato.gov.au/api/public/content/0-cd3490b1-151e-442d-9571-b0d481b340e0 records announcement
  on 2023-12-13 and accounting-period qualification. Preserve the operative statutory text and effective-date coding
  in the eventual manifest.

  OUTCOME PROVENANCE: ASIC Series 1 and interpretation, https://www.asic.gov.au/about-asic/corporate-publications/statistics/insolvency-statistics
  and https://asic.gov.au/regulatory-resources/find-a-document/statistics/insolvency-statistics/how-to-interpret-asic-s-corporate-insolvency-statistics/
  . October 2026 context: https://www.asic.gov.au/about-asic/corporate-publications/newsletters/asic-corporate-insolvency-update/asic-corporate-insolvency-update-issue-41-october-2026
  reports 14,153 first administrations in 2025-26, down 4% from 2024-25. These public aggregates are context, not
  treated/control data.

  BUSINESS POPULATION PROVENANCE: ABS, released 2026-08-18, https://www.abs.gov.au/statistics/economy/business-indicators/counts-australian-businesses-including-entries-and-exits/latest-release
  ; business counts and ASIC registered companies have different denominators. No conversion between them is allowed
  without a consistent scope.

  ENFORCEMENT PROVENANCE: ANAO, published 2026-06-30, https://www.anao.gov.au/work/performance-audit/australian-taxation-office-management-of-small-business-taxpayer-debt
  documents firmer actions resuming in 2023-24 and limitations in evaluating debt-management outcomes. The audit
  supports the need for enforcement controls, not a causal estimate of tax-policy harm.

  ACCESS BLOCKERS: confidential business tax, debt, remission, collection and payroll records; entity-to-group-to-ASIC
  crosswalk; approval for secure linkage and disclosure control; policy-rate vintage; enforcement-confounding documentation;
  reporting maturity and power. Public sources cited here do not confer access. Causal attribution is outside this
  screen; data and adjusted-comparison validity remain unresolved. Numeric prior and effect thresholds are proposals,
  not measured findings.


  DESIGN REVIEW: narrowed to an associational implementation-survivor vulnerability screen. The initial causal framing
  was rejected before any run because selection at implementation makes first-administration pretrends mechanically
  zero and because low exposure is not untreated. Any causal design needs new historical inception cohorts, transport
  assumptions and selection bounds.


  PUBLICATION STATUS (2026-10-10): imported as an untested candidate. Any earlier no-registration/no-import statements
  describe the initial 2026-10-09 draft. Git tracking alone does not establish a verified spec-before-run pair,
  completed data ingestion, an empirical verdict or evidence-score eligibility. Missing data and protocol gates
  remain binding.

  '
mechanism_measurement:
  mechanism_type: tax_policy
  design_features:
  - treated_vs_untreated_units
  - distributional_decomposition
  - leakage_substitution
  - welfare_accounting
  - implementation_capacity_check
  comparison_structure:
    treated_units:
    - High pre-announcement immediately usable GIC tax-shield exposure in incorporated small employers active at
      implementation.
    control_units:
    - Low-exposure implementation survivors matched/standardised on overlapping pre-announcement distress and finance
      covariates. This is a comparison group, not a demonstrably untreated control.
    exempt_or_uncontrolled_units:
    - Commercial loan interest retaining its usual deductibility is a financing substitution margin, not an automatically
      exchangeable control group.
    time_frequency: mixed
    notes: Primary cumulative 12-month outcome with historical covariates and monthly mechanism data. All comparisons
      are associational; causal policy effects cannot be recovered from first-administration pretrends in the fixed
      survivor cohort.
  causal_layers:
  - layer: first_order_policy_effect
    mechanism: Deduction withdrawal changes effective cash tax cost only to the extent the shield was usable.
    variable_names:
    - actual_interest_and_cash_tax
    - preannouncement_lost_gic_tax_shield_share
    candidate_sources:
    - manual:ato_interest_tax_cash_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Required corporate-tax layer; legal enactment alone does not count as measured.
  - layer: behavioral_response
    mechanism: Firms repay, seek remissions, improve compliance or refinance rather than bear the full gross interest
      cost.
    variable_names:
    - repayment_refinancing_response
    candidate_sources:
    - manual:ato_debt_and_business_credit_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Separate behavioural adaptation from baseline distress; do not adjust away mediators in total-effect
      estimates.
  - layer: dynamic_investment_response
    mechanism: Reduced liquidity may defer productive capital and hiring, while discipline may improve allocation.
    variable_names:
    - firm_capital_and_market_share
    - payroll_employment_retention
    candidate_sources:
    - manual:abs_bla_de_business_accounts_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Corporate-tax layer; no investment linkage measured.
  - layer: market_structure_response
    mechanism: Exit and restructuring can redistribute market share, enable entry or transfer viable assets.
    variable_names:
    - first_external_administration_12m
    - firm_capital_and_market_share
    candidate_sources:
    - manual:asic_series1_firm_linkage_not_acquired
    - manual:abs_bla_de_business_accounts_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Distinguish formal appointment, continuing operation, sale and permanent shutdown.
  - layer: macro_feedback
    mechanism: Credit and employment spillovers may amplify firm effects or be offset by resource reallocation and
      public receipts.
    variable_names:
    - net_welfare_and_macro_feedback
    candidate_sources:
    - manual:linked_firm_sector_welfare_inputs_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Required corporate-tax layer; no aggregate extrapolation from partial-equilibrium coefficient.
  - layer: distributional_incidence
    mechanism: Workers, owners, creditors and compliant competitors may bear different costs and benefits.
    variable_names:
    - workers_owners_creditors_incidence
    candidate_sources:
    - manual:linked_payroll_owner_creditor_records_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Required corporate-tax layer; group composition and tax-payment incidence unresolved.
  - layer: fiscal_or_enforcement_cost
    mechanism: Extra receipts and compliance incentives must be netted against recovery and insolvency administration
      costs.
    variable_names:
    - fiscal_collection_and_enforcement_cost
    - enforcement_policy_exposure
    candidate_sources:
    - manual:ato_collection_cost_and_revenue_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: Concurrent enforcement is both a potential confound and a resource-cost channel.
  - layer: net_welfare
    mechanism: A transfer to taxpayers is not automatically a resource loss; evaluate productive losses against
      compliance and reallocation gains.
    variable_names:
    - net_welfare_and_macro_feedback
    candidate_sources:
    - manual:linked_firm_sector_welfare_inputs_not_acquired
    measurement_status: data_gap
    required_for_dispositive_verdict: true
    notes: National welfare claim remains unavailable even if the narrower survival effect is estimated.
  distributional_groups:
  - enforcement_targets
  - taxpayers
  - suppliers
  - new_entrants
  - future_cohorts
  welfare_accounting:
    first_order_transfer: 'data_gap: actual incremental cash taxes and interest receipts, with remissions and deduction
      timing.'
    deadweight_loss: 'data_gap: productive activity lost beyond transfers, net of reallocation gains.'
    quality_loss: 'data_gap: supplier/customer service continuity after restructurings.'
    future_supply_loss: 'data_gap: investment and employment scarring.'
    fiscal_or_enforcement_cost: 'data_gap: collection, compliance and insolvency administration resources.'
    net_welfare_formula: 'data_gap: compliance/fairness and reallocation benefits plus value of incremental public
      resources minus non-transfer output, adjustment and administration costs; avoid double-counting tax receipts
      as both benefit and loss.'
  promotion_gate: screen_only_until_second_order_measured
  notes: All six fiscal.tax_corporate layers are explicitly required and currently data_gap; enforcement and net
    welfare are additional required checks. No axis/position mapping has been added. Mechanism layer names are schema
    categories, not certification of causal inference. The adjusted high/low vulnerability contrast alone cannot
    establish a policy effect.
