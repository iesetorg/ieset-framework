prior_confidence: 0.38
disclosure: Education spending/GDP can rise when GDP falls and can respond to past achievement. A three-year
  gap can miss long human-capital lags; reporting and overlapping milestones induce correlated errors.
  This local family correction does not erase the prior archive-wide search. No public result here proves
  a spending or policy effect.
scope:
