# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: wdi_education_spending_bachelor_attainment_forward_2026
version: 1
status: pre_registered
topic: fiscal
claim_direction: +
claim: Across complete WDI country-year pairs in 2000–2018, a one-percentage-point-higher government education-expenditure
  share of GDP at anchor year predicts at least one percentage point more adults 25+ with bachelor's attainment
  gain over the next exact three years, conditional on baseline outcome, income, GDP growth, and country/year
  fixed effects. This is a descriptive association, not an education-policy effect.
evidence_type: descriptive
methodology_note: One member of the closed six-test education-milestones family wdi_education_spending_milestones_2026_10_10.
  The old education-spending candidate archive, including a generic tertiary-enrolment proxy, was visible
  before this new design. This fixed forward-change design is not an independent validation of those old
  results. Registration and runner precede selected value access.
sample:
  countries:
  - GLOBAL
  period:
  - 2000
  - 2021
  temporal_structure: panel
  exclusion_rules:
  - Use only the frozen 216 ISO-3-plus-XKX source-key roster; source-key presence does not imply a non-null
    reading.
  - For each anchor t in 2000–2018, require finite exact t spending, baseline outcome, GDP per person,
    GDP growth, and exact t+3 outcome. No interpolation or imputation.
  - Government education expenditure/GDP must be in (0,30]; GDP per person >0; GDP growth in [-100,100];
    both outcome readings must be in the registered outcome range.
  - Retain only economies with at least three complete pairs; all other sample and concentration floors
    are fixed in falsification.threshold.
variables:
  outcome:
  - name: bachelor_attainment_three_year_change_pp
    source: world_bank_wdi:SE.TER.CUAT.BA.ZS
    transformation: exact t+3 level minus t level, percentage points
    notes: University access can raise the share of adults with a bachelor-equivalent qualification. The
      population-25+ stock changes slowly and says little about degree quality or labor demand.
  treatment:
  - name: government_education_spending_pct_gdp_t
    source: world_bank_wdi:SE.XPD.TOTL.GD.ZS
    transformation: unmodified percentage of GDP at anchor t
  controls:
  - name: baseline_bachelor_attainment_t
    source: world_bank_wdi:SE.TER.CUAT.BA.ZS
    transformation: unmodified outcome percentage at t
  - name: log_real_gdp_per_person_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: natural log of positive real GDP per person at t
  - name: real_gdp_growth_t
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: annual GDP growth percent at t
intervention_channel: fiscal
intervention_channel_justification: The exposure is a public education-expenditure share, but no enacted
  policy or exogenous change is identified.
estimator:
  template: descriptive
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Equal country-year-pair OLS of exact three-year outcome change on education spending share, baseline
    outcome, log real GDP per person, GDP growth, country effects and anchor-year effects. Country-cluster
    standard error; two-sided Student t with G-1 degrees of freedom. The fixed six-test family uses Bonferroni
    0.01/6.
falsification:
  test: fixed_wdi_education_spending_bachelor_attainment_forward_2026
  rule: An outcome is INCONCLUSIVE if any frozen sample, variation, rank, concentration, or uncertainty
    gate fails. Otherwise SUPPORTED requires beta >= +1.0 three-year outcome percentage points per +1
    point GDP spending and two-sided p <= 0.01/6; REFUTED requires beta <= -1.0 and the same p cutoff;
    otherwise PARTIAL. All six tests remain in the family denominator, including inconclusive cases. Zero
    causal, policy, school, position, or featured credit.
  threshold:
    family_id: wdi_education_spending_milestones_2026_10_10
    family_size: 6
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0016666666666666668
    meaningful_beta_min_pp: 1.0
    min_complete_pairs: 150
    min_countries: 20
    min_pairs_per_country: 3
    min_material_countries: 12
    material_within_country_spending_range_pp: 0.5
    max_country_residualized_exposure_share: 0.25
    max_year_residualized_exposure_share: 0.2
    outcome_valid_max: 100.0
    roster_sha256: a7b8e33e420cd1c0ce8160ad4e03e1102440d184842dd450027a446df26e8638
    source_files:
      spending:
        path: data/vintages/world_bank_wdi/SE.XPD.TOTL.GD.ZS@2026-05-05T204028Z.parquet
        sha256: 0f21a848f064c16fce431b5425f5fb51519044c3e88256f329821b00504cc501
        manifest: data/manifests/fetch_run_2026-05-05T210519Z.yaml
        manifest_sha256: 5022cf82e5656d89c54d3c0df1cc3c12718b93896488eebfde3ffa197beef112
      income:
