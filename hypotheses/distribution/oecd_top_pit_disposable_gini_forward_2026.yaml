disclosure: The top rate is a statutory rate for high wage earners and may not represent taxes actually paid; tax-base changes, bracket thresholds, other taxes and transfers, income shifting, macro shocks, and survey revisions can move the Gini. The model omits a separate Gini_t covariate because t is already the subtraction endpoint and may follow the tax change, but the change outcome remains vulnerable to regression to the mean and starting-inequality confounding. Related prior top-PIT-to-WID pretax-top-share, top-PIT-to-registrations, and union-density-to-IDD-Gini tests are visible, so this is neither an independent holdout nor archive-wide multiplicity control. Descriptive calibration only; no causal, policy, school, position, or featured credit.
