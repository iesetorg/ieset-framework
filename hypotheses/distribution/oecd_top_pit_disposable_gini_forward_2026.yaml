# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: oecd_top_pit_disposable_gini_forward_2026
version: 1
status: pre_registered
topic: distribution
claim_direction: '-'
claim: Across the fixed 2007–2018 OECD panel, a rise of at least one percentage point in the top statutory personal income-tax rate from t-1 to t predicts a lower exact t-to-t+1 change in the all-age disposable-income Gini than a tax-stable year, conditional on a separate tax-cut indicator and country/year effects.
methodology_note: Prospective descriptive one-test calibration. Only selected tax-rate values, selected OECD IDD Gini schema and country/year keys, source hashes and manifests, and earlier hypothesis text informed registration. The IDD Gini value, null mask, and observation status are closed until a separately committed source lock. Frozen contract is engine/audits/oecd_top_pit_disposable_gini_prereg_2026-10-10.md.
evidence_type: associational
sample:
  countries: &countries
  - AUT
  - CAN
  - CHE
  - CRI
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - GBR
  - GRC
  - HUN
  - IRL
  - ISL
  - ISR
  - ITA
  - KOR
  - LTU
  - LVA
  - NLD
  - NOR
  - NZL
  - POL
  - PRT
  - SVK
  - SVN
  - SWE
  - TUR
  - USA
  period: [2007, 2018]
  temporal_structure: panel
  exclusion_rules:
  - Use only the committed key-only country/year roster; require exact tax years t-1 and t and exact Gini keys at t and t+1, with at least five candidate years per country.
  - Both statutory-rate endpoints must be finite and in [0,100] percent. The out-of-range France 2013 endpoint and adjacent annual changes are excluded before outcome access; do not cap or repair that value.
  - Code hike if rate(t)-rate(t-1) >= 1 percentage point, cut if <= -1, and stable otherwise. Retain all otherwise valid large changes.
  - After the separate source-lock commit, require unique OECD IDD selectors and finite Gini values in [0,1] at both endpoints with OBS_STATUS A at both endpoints. No imputation, nearest-year matching, substitution, or outcome winsorization.
  - Retain countries with at least five complete measured pairs after outcome access.
variables:
  treatment:
  - name: top_statutory_pit_hike_at_least_one_pp
    source: oecd:oecd_top_statutory_pit_rate
    transformation: Indicator that top statutory personal income-tax rate at t minus t-1 is at least +1 percentage point.
    notes: OECD TS_PIT rate on gross wage earnings at the top bracket; not an effective tax rate or a measure of capital-income taxation.
  - name: top_statutory_pit_cut_at_least_one_pp
    source: oecd:oecd_top_statutory_pit_rate
    transformation: Indicator that the same annual change is at most -1 percentage point; prespecified nuisance covariate.
  outcome:
  - name: next_year_disposable_income_gini_change
    source: oecd:DSD_IDD@DF_IDD
    transformation: Exact OECD IDD all-age disposable-income Gini at t+1 minus t, on its 0-to-1 scale; INC_DISP_GINI, FREQ A, STATISTICAL_OPERATION _Z, UNIT_MEASURE 0_TO_1, AGE _T, METH2012, D_CUR, POVERTY_LINE _Z.
    notes: Relative income dispersion in the OECD IDD, not the WID pretax top-income share or an absolute-poverty measure.
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: One OLS coefficient for the hike indicator versus stable years, with cut indicator, country and treatment-year fixed effects. Country-cluster CR1 standard errors and two-sided Student t(G-1) inference. Gini at t is already the subtraction endpoint and may be affected by the year-t tax change, so it is not added as a separate covariate. This choice leaves regression-to-mean and starting-inequality confounding risks. No control, lag, subgroup, or source search; the cut coefficient is nuisance only.
falsification:
  test: run_oecd_top_pit_disposable_gini_forward_2026
  rule: INCONCLUSIVE if exact source/registration/lock custody, complete-case, hike/cut event, full-rank, partialled-hike concentration, or finite cluster-uncertainty gate fails. SUPPORTED only if hike beta <= -0.005 Gini units with two-sided p <= 0.005. REFUTED only if beta >= +0.005 at the same cutoff. Otherwise PARTIAL. The threshold is local to this test and does not correct the visible archive-wide search.
  threshold:
    family_id: oecd_top_pit_disposable_gini_forward_2026_10_10
    family_size: 1
    family_alpha: 0.005
    p_max_two_sided: 0.005
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.005
    min_valid_rows: 220
    min_valid_countries: 25
    min_years_per_country: 5
    min_hike_rows: 20
    min_hike_countries: 12
    min_cut_rows: 15
