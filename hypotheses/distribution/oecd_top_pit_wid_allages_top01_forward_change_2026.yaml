# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: oecd_top_pit_wid_allages_top01_forward_change_2026
version: 1
status: pre_registered
topic: distribution
claim_direction: '-'
claim: >
  Among the fixed 30-country OECD/WID overlap, a larger year-t increase in the
  top statutory personal income tax rate from t-1 is associated with a smaller
  year-t to t+1 change in the WID top 0.1 percent share of pre-tax national
  income measured with WID's all-ages population code sptincj999.
methodology_note: >
  New-ID, value-blind calibration of a narrow forward-change association.
  Earlier tax-inequality event candidates and a WID top-0.1-percent trade
  openness panel are already visible; this is not an independent holdout or
  repair of their historical runs. Only source keys and the WID fetcher code
  were inspected before this design was committed. The selected raw WID code
  is sptincj999 (all ages), not sptincj992 (adults). This local ten-slot
  Bonferroni screen uses p<=0.005 and makes no global multiple-testing claim.
evidence_type: associational
sample:
  countries: [AUS, AUT, BEL, CAN, CHE, CHL, COL, CZE, DEU, DNK, ESP, EST, FIN, FRA, GBR, GRC, IRL, ISR, ITA, JPN, KOR, MEX, NLD, NOR, NZL, POL, PRT, SWE, TUR, USA]
  period: [2001, 2023]
  temporal_structure: panel
  exclusion_rules:
    - Use exactly the named countries and calendar years t=2001 through 2023, with OECD top-rate observations at t-1 and t and WID all-ages top-0.1-percent shares at t and t+1.
    - Require one country-year row per exact series selector; reject duplicate, unmapped, or missing keys without interpolation, vintage substitution, or country replacement.
    - Require finite OECD rate levels in [0,100] percent and finite WID share levels in [0,1] at every endpoint. Retain countries with at least 15 complete t-years.
    - Require at least 550 complete rows, 25 countries, 20 nonzero tax-rate-change country-years, and rate changes in at least 10 countries; otherwise INCONCLUSIVE_DATA_PENDING.
variables:
  outcome:
    - name: all_ages_top_0_1_pretax_national_income_share_forward_change_pp
      source: wid:wid_all
      transformation: >
        100 * (sptincj999 p99.9p100 share at t+1 minus the same share at t);
        exact country and calendar-year joins, yielding percentage points.
      notes: >
        WID age code 999 is all ages and j is equal-split. This is a pre-tax
        national-income share, not adult, post-tax, disposable-income, or
        household-survey inequality. The raw WID vintage retains the code.
  treatment:
    - name: top_statutory_pit_rate_change_pp
      source: oecd:oecd_top_statutory_pit_rate
      transformation: >
        OECD TS_PIT top statutory personal income tax rate in percentage
        points at t minus t-1, using the pinned annual narrow vintage.
      notes: >
        Combined central and sub-central top rate for gross wage earnings;
        this is a statutory schedule measure, not an effective income-tax
        rate or an observed tax burden for the WID top 0.1 percent.
  controls: []
estimator:
  template: panel_fe
  fixed_effects: [country, year]
  clustering: country
  notes: >
    One preselected coefficient in OLS of next-year percentage-point change
    in the WID share on the current percentage-point change in the statutory
    top rate, with country and treatment-year fixed effects. Standard errors
    cluster by country; use a two-sided Student-t p-value with G-1 degrees of
    freedom, where G is the number of retained country clusters. No covariate,
    lag, subgroup, or estimator search. Report only this primary fit.
falsification:
  test: oecd_top_pit_wid_allages_selected_forward_change_screen_2026_10_09
  rule: >
    If the exact source custody, WID all-ages selector, complete-case floors,
    within-country exposure-change floors, fixed-effect rank, or finite
    country-clustered uncertainty fail, report INCONCLUSIVE_DATA_PENDING.
    Otherwise a negative coefficient with two-sided p<=0.005 SUPPORTS the
    stated association; a positive coefficient with two-sided p<=0.005
    REFUTES its direction; every other estimable result is PARTIAL. These
    verdicts describe an association and grant zero school or policy credit.
  threshold:
    family_id: selected_top_pit_wid_inequality_2026_10_09
    family_size: 10
    family_alpha: 0.05
    family_p_max: 0.005
    expected_sign: '-'
    min_observations: 550
    min_countries: 25
    min_pairs_per_country: 15
    min_nonzero_rate_changes: 20
    min_rate_change_countries: 10
    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    causal_credit: 0
    wid_variable: sptincj999
    wid_percentile: p99.9p100
    wid_fetcher_priority: [sptincj999, sptincj992]
    wid_fetcher_sha256: 301e10d90f3e5828d9e38de145510787890b6798bd41c815dba4da50f2c1446c
    source_files:
      top_pit:
        source: oecd:oecd_top_statutory_pit_rate
        path: data/vintages/oecd/oecd_top_statutory_pit_rate@2026-07-23T153857Z.parquet
        sha256: b500bdc808385c17ace3eb6d78b5698a02dadd28943daf5e7d198d9093f19151
        manifest: data/manifests/fetch_run_2026-07-23T153857Z_oecd_tax_structure.yaml
        manifest_sha256: 6a9172689c2f5561fddfd3b779431bca070d48f54b2f75814ff4e9295fa0ba18
        series_id: oecd_top_statutory_pit_rate
      wid_raw:
        source: wid:wid_all
        path: data/vintages/wid/wid_all@2026-05-05T204054Z.parquet
        sha256: d7a676b332bc7c12f4c48305fc8906c0bd990818d5bc841e266336ac212c1702
        manifest: data/manifests/fetch_run_2026-05-05T210519Z.yaml
        manifest_sha256: 5022cf82e5656d89c54d3c0df1cc3c12718b93896488eebfde3ffa197beef112
        series_id: wid_all
prior_confidence: 0.45
disclosure: >
  The expected negative direction reflects a redistribution and reporting
  response prior, but statutory top rates do not identify the effective tax
  faced by the WID group. Tax reforms can coincide with macro shocks, alter
  reporting or income timing, and affect the tax-derived components of WID
  estimates. The outcome can change for reasons unrelated to tax rates.
  Prior related results are visible, all observations are historical, and
  p<=0.005 is only a local multiplicity guard. No causal, school, policy,
  position, featured, or independent-replication credit is claimed.
steelman: hypotheses/steelman/oecd_top_pit_wid_allages_top01_forward_change_2026.md
intervention_channel: fiscal
intervention_channel_justification: The OECD treatment is a measured statutory income-tax schedule rate.
scope:
  period: [2001, 2024]
  countries: [AUS, AUT, BEL, CAN, CHE, CHL, COL, CZE, DEU, DNK, ESP, EST, FIN, FRA, GBR, GRC, IRL, ISR, ITA, JPN, KOR, MEX, NLD, NOR, NZL, POL, PRT, SWE, TUR, USA]
  outcome_dim: [poverty_inequality, taxation]
