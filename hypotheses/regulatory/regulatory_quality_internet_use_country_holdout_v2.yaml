disclosure: The initial INCONCLUSIVE_DATA_PENDING and later PARTIAL histories of both competition_telecom_prices_quality and digital_education_market_entry were seen before this design. These old IDs reuse one source pair and the same roster, not two independent tests. Feasibility checked null masks and country/year
  keys only, never candidate magnitudes, signs, or estimates. WGI regulatory quality is not telecom competition;
  internet-user share measures adoption, not telecom price, quality, or platform market power. This is descriptive
  calibration, not causal validation of the old mechanism, and grants no policy or school-score credit.
