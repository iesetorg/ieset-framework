disclosure: The old PARTIAL label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Government consumption is not central planning; the WGI voice-and-accountability estimate is a perception composite, not an information-quality measure. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
