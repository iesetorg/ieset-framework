hypothesis_id: bis_neer_hicp_multicategory_pass_through_2026
version: 1
status: pre_registered
topic: monetary
claim_direction: +
claim: Across twenty fixed, mutually non-nested Eurostat HICP consumer-spending groups, annual BIS nominal
  broad effective-exchange-rate depreciation at year t is followed by higher annual-average group inflation
  in t+1 in at least five distinct groups, each clearing the frozen effect-size, country-deletion, and
  family-adjusted uncertainty gates, with no qualified opposite-direction group.
methodology_note: One prospective omnibus descriptive hypothesis with twenty planned component estimates.
  BIS nominal EER exposure values and exact Eurostat categorical COICOP/country/year keys were screened
  before registration; no selected HICP values, null masks, or fits were opened. The 9,741-row category
  roster is a key-only upper bound. All twenty fixed groups stay in the family denominator; no component
  is a separate public hypothesis or graduation.
evidence_type: associational
sample:
  countries: &id001
  - AUT
  - BEL
  - BGR
  - CYP
