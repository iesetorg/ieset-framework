  period:
  - 2002
  - 2019
  temporal_structure: panel
  exclusion_rules:
  - Use only the immutable category-country-treatment-year key roster, exact Eurostat freq=A/unit=RCH_A_AVG,
    the twenty frozen three-digit COICOP groups, and the 29-country crosswalk. Require the exact HICP
    category/country/year t+1 key; no parent aggregate, alternate source, or nearby-year substitution.
  - BIS exposure must be monthly nominal broad EER, FREQ=M/EER_TYPE=N/EER_BASKET=B, OBS_STATUS=A, with
    twelve finite positive months in both t−1 and t. Set x=100 log(annual-mean EER at t−1 / annual-mean
    EER at t), positive for nominal depreciation; require |x|≤15. Material exposure has |x|≥2.
  - After the separately committed source lock, require each selected HICP outcome cell in t+1 to be finite.
    Do not trim on outcome magnitude or assume cell-flag continuity absent from the pinned Parquet.
  - For each component retain only countries with ten complete years and require at least 400 complete
    cells/24 countries and 150 material-depreciation cells/22 countries. Require at least sixteen of twenty
    components estimable for the omnibus; no interpolation, adaptive controls, category replacement, or
    post-result country exclusion.
variables:
  treatment:
  - name: bis_neer_depreciation_log_percent_t
    source: bis:WS_EER
    transformation: 100 times natural log of mean monthly nominal broad EER in t−1 divided by that in
      t; positive for nominal depreciation. Each mean requires twelve positive status-A months.
    notes: Manufacturing-trade weights do not equal the import share of each HICP group. This is not a
      policy treatment.
  outcome:
  - name: twenty_coicop_hicp_annual_average_rates_t_plus_1
    source: eurostat:prc_hicp_aind
    transformation: Published annual-average rate of change in t+1, unit RCH_A_AVG and percentage points,
      separately for the twenty exact COICOP groups fixed in the threshold and roster.
    notes: Each group is a distinct three-digit household-spending category. Component estimates are planned
      evidence for one omnibus verdict, not separate public hypotheses. Some groups include services or
      regulated prices.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country_and_treatment_year
  notes: For each of twenty groups separately, OLS of t+1 HICP annual-average inflation on BIS nominal
    depreciation at t, country and treatment-year fixed effects; two-way country/year CR1 uncertainty
    and two-sided Student t with min(G,T)−1 degrees of freedom. Frozen complete-case, exposure-concentration,
    rank, effect-size and leave-one-country-out gates. The omnibus aggregates the twenty component classifications
    by the prespecified five-group rule; there is one public verdict.
falsification:
  test: bis_neer_eurostat_goods_hicp_2026_10_10
  rule: A component is INCONCLUSIVE if source/chronology, complete-case, material-exposure, ten-year-per-country,
    residual-exposure concentration (top 1%≤30%, top country≤25%), rank, or two-way cluster uncertainty
    gates fail. Component SUPPORTED iff beta≥0.04 HICP percentage points per +1 log-percentage-point depreciation,
    two-sided p≤0.01/20, and every leave-one-country-out beta≥0.02; component REFUTED iff beta≤−0.04 with
    the same p cutoff and every country-deletion beta≤−0.02. Otherwise component PARTIAL. Omnibus INCONCLUSIVE
    if fewer than sixteen components are estimable; SUPPORTED if at least five components support and
    none refutes; REFUTED if at least five refute and none supports; otherwise PARTIAL. All twenty components
    remain in the correction denominator; only the omnibus is a public hypothesis.
