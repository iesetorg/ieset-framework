# yaml-language-server: $schema=../../../IESET/schemas/hypothesis.schema.json
hypothesis_id: argentina_core_vs_headline_inflation_2025_2026
version: 1
status: draft
topic: monetary
claim: 'Stripping volatile/regulated items flatters Argentine inflation: over Jan 2025-Aug 2026 INDEC core (nucleo) monthly inflation runs below headline, i.e. ''exclude food and fuel and it looks fine''.'
claim_direction: '?'
evidence_type: descriptive
sample:
  countries: &id002
  - ARG
  period: &id001
  - 2025
  - 2026
  temporal_structure: time_series
variables:
  outcome:
  - name: ipc_headline_mom
    source: indec_ipc:headline
    transformation: mom_pct
  - name: ipc_core_mom
    source: indec_ipc:core
    transformation: mom_pct
  - name: ipc_regulated_mom
    source: indec_ipc:regulated
    transformation: mom_pct
estimator:
  template: descriptive
falsification:
  rule: 'SUPPORTED if mean(headline-core) >= 0.10pp over 2025-01..2026-08; REFUTED if mean(headline-core) <= 0; PARTIAL otherwise. Secondary (informative): mean(regulated-core).'
  test: mean_gap_headline_minus_core
  threshold: mean(headline_mom - core_mom) >= 0.10
prior_confidence: 0.4
disclosure: Drafted 2026-10-09 by agent from a high-engagement X claim. The headline value quoted in the tweet was seen before drafting; the falsification threshold was fixed before the analysis script
  was run and is frozen in PREREG_LEDGER.json (SHA256 + UTC). Not git-pre-registered (needs user-approved commit).
conflict_disclosure: Author holds no positions related to this claim. Engine house prior is market-liberal; disclosed.
steelman: hypotheses/steelman/argentina_core_vs_headline_inflation_2025_2026.md
scope:
  period: *id001
  countries: *id002
  outcome_dim:
  - inflation
  policy_family:
  - monetary_policy
source_provenance:
  archive_refs:
  - https://x.com/MartinDandach/status/2104389560658456823
  mined_at: '2026-10-09'
  mined_by_model: Grok Bot (X search)
notes: X-sourced draft; build dir ~/IESET-x-build; runner scripts/run_x_hypotheses.py
