  exclusion_rules:
  - Use only exact country/year keys in the frozen 1,558-row common key roster; all selected outcomes
    supply keys at t-3, t, t+3. Structural WDI keys do not establish nonmissing outcome values.
  - Require valid WDI internet-user percentages within [0,100] and blank/null status at t-3 and t; positive
    finite real GDP per person at t-3 and t, and population at t-3, t, t+3, all blank/null status.
  - Require Finite selected shares within [0,100] at t-3, t, t+3. Selected outcome status must be blank/null
    at all three endpoints.
  - Retain an economy only with at least five complete treatment-year rows after selected outcome gating;
    no imputation, country replacement, post-result exclusions, or vintage switch.
  - Treatment years 2009–2016 imply outcome years through 2019; the financial crisis and other common
    shocks remain possible confounders.
variables:
  outcome:
  - name: services_employment_share_change_t3
    source: world_bank_wdi:SL.SRV.EMPL.ZS
    transformation: WDI SL.SRV.EMPL.ZS percentage-point share at t+3 minus its share at t.
  treatment:
  - name: observed_internet_user_share_three_year_change_per_ten_points
    source: world_bank_wdi:IT.NET.USER.ZS
    transformation: (WDI IT.NET.USER.ZS at t minus t-3)/10; one unit means 10 percentage points of observed
      uptake. This is not a policy exposure.
  controls:
  - name: prior_internet_user_share
    source: world_bank_wdi:IT.NET.USER.ZS
    transformation: Share at t-3 divided by 10.
  - name: baseline_outcome
    source: world_bank_wdi:SL.SRV.EMPL.ZS
    transformation: Same transformed outcome level at t.
  - name: prior_outcome_change
    source: world_bank_wdi:SL.SRV.EMPL.ZS
    transformation: Same transformed outcome level at t minus t-3.
  - name: log_real_gdp_per_person_t
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive constant-2015-dollar GDP per person at t.
  - name: prior_real_gdp_per_person_log_change
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Log real GDP per person at t minus t-3.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: One frozen country and treatment-year fixed-effects OLS coefficient on observed internet uptake
    per 10 percentage points, with prior internet level, baseline outcome, prior outcome change, log
    real income, and prior income change. Country-cluster CR1 covariance with small-sample correction;
    two-sided Student t with G-1 degrees of freedom. No model search or covariate dropping.
falsification:
  rule: INCONCLUSIVE if any frozen source, chronology, completeness, exposure-support, rank, influence,
    or uncertainty gate fails. Otherwise positive beta >= 0.5 with two-sided p<=0.01/3 SUPPORTS only
    the narrow descriptive association; negative beta <= -0.5 with that p REFUTES it. Every other estimable
    result is PARTIAL. All three tests count even if one is inconclusive. SUPPORTED, REFUTED, and gate-cleared PARTIAL all receive public descriptive-calibration status;
    INCONCLUSIVE is archived. Every result has zero causal, policy, school, position, or featured credit.
