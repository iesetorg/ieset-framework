disclosure: Descriptive calibration only. WDI services employment is an ILO-modeled sector share; a
  larger share does not show better jobs or welfare. Internet uptake can be jointly driven by income,
  regulation, education, and other unmeasured changes. Fixed effects and forward timing do not identify
  a causal or policy effect. The local family correction does not cover wider archive selection or provide
  independent replication. Zero causal, policy, position, school-score, and featured credit.
