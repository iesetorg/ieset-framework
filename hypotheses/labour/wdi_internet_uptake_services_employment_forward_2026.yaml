hypothesis_id: wdi_internet_uptake_services_employment_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: +
claim: Within the frozen global ISO-economy key roster, a larger observed rise in WDI internet-user
  share from t-3 to t predicts a larger subsequent t to t+3 rise in services employment share, conditional
  on baseline and prior trends. This is a descriptive association, not an internet-policy effect.
methodology_note: New-ID retrospective descriptive calibration within one fixed three-test family. Existing
  internet-use candidates and the earlier internet-to-patent calibration were visible before design,
  but no selected outcome value, null mask, observation status, or exact-pair result was read. First-addition
  registration and separate hash-checked source lock must precede selected outcome access. Two-sided
  Bonferroni p<=0.01/3 is local and does not correct archive-wide adaptive selection.
evidence_type: associational
