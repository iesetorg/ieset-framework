hypothesis_id: border_closure_raises_low_wage_growth_2025_2026
version: 1
status: draft
topic: labour
claim: 'Cutting immigration raises wages of low-paid native workers: after the 2024-25 border collapse, bottom-quartile wage growth rose relative to top-quartile wage growth.'
claim_direction: +
evidence_type: associational
sample:
  countries: &id002
  - USA
  period: &id001
  - 2023
  - 2026
  temporal_structure: time_series
variables:
  outcome:
  - name: wgt_q1_minus_q4
    source: atlanta_fed_wgt:Average Wage Quartile (lowest minus highest)
    transformation: 3mma median y/y, pp
estimator:
  template: descriptive
falsification:
  rule: Gap = Q1 - Q4 wage growth. Compare mean gap Feb-2025..latest vs Jan-2023..Jun-2024. SUPPORTED if change >= +0.5pp; REFUTED if change <= -0.5pp; INCONCLUSIVE otherwise. No causal identification (tight-labour-market
    cycle confound).
  test: gap_change_pre_post
  threshold: delta_gap >= 0.5
prior_confidence: 0.35
disclosure: Drafted 2026-10-09 by agent from a high-engagement X claim. The headline value quoted in the tweet was seen before drafting; the falsification threshold was fixed before the analysis script
  was run and is frozen in PREREG_LEDGER.json (SHA256 + UTC). Not git-pre-registered (needs user-approved commit).
conflict_disclosure: Author holds no positions related to this claim. Engine house prior is market-liberal; disclosed.
