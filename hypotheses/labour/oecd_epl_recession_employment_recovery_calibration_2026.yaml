# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: oecd_epl_recession_employment_recovery_calibration_2026
version: 1
status: pre_registered
topic: labour
claim_direction: '-'
claim: Among frozen nonoverlapping recession events among OECD-source reporter economies selected by the deepest
  negative real-GDP-growth year within each contiguous WDI contraction spell from
  2000–2022, a higher prior-year OECD EPR_V1 regular-worker employment-protection
  score predicts a smaller change in the OECD employment-to-population ratio for ages
  20–64 from the recession year t to t+2, conditional on baseline employment, recession
  severity, and event-year effects.
methodology_note: New claim-specific descriptive calibration after the archived labour_market_flexibility_employment_resilience
  Fraser/GDP-per-capita placeholder failed its estimator floor. Treatment/shock values
  and outcome keys only were inspected before registration; selected outcome values,
  null masks, and status fields remain unopened. The two-test Bonferroni contract
  is in engine/audits/placeholder_claim_specific_replacement_prereg_2026-10-10.md.
  No old verdict, score, or causal credit is inherited.
evidence_type: associational
sample:
  countries: &id002
  - ARG
  - AUS
  - AUT
  - BEL
  - BRA
  - CAN
  - CHE
  - CHL
  - COL
  - CRI
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - FRA
  - GBR
  - GRC
  - HUN
  - IRL
  - ISL
  - ISR
  - ITA
  - JPN
  - KOR
  - LUX
  - LVA
  - MEX
  - NLD
  - NOR
  - NZL
  - PER
  - POL
  - PRT
  - RUS
  - SVK
  - SVN
  - SWE
  - TUR
  - USA
  - ZAF
  period: &id001
  - 2000
  - 2024
  temporal_structure: panel
  exclusion_rules:
  - Select the deepest negative WDI real-GDP-growth year in each contiguous contraction
    spell; ties use the earlier year. Keep events at least three years apart within
    country, choosing the deeper contraction when spells would overlap.
  - Use only the frozen key-only roster with OECD EPR_V1 at t−1 and OECD annual employment-ratio
    keys at t,t+2; no event-year or age substitution.
  - The employment outcome is OECD EMP_RATIO, PT_POP_SUB, both sexes, ages 20–64,
    employed; both endpoints must be finite within 0–100 and have final observed status
    A.
  - Keep all otherwise valid recession spells and enforce the registered sample, crisis-wave,
    rank, uncertainty, and concentration floors after the lock.
scope:
  period: *id001
  countries: *id002
  outcome_dim:
  - employment_labour
  policy_family:
  - labour_market
  treatment_tags:
  - employment_protection
variables:
  treatment:
  - name: pre_recession_regular_worker_employment_protection
    source: oecd:EPR_V1
    transformation: EPR_V1 0–6 index in t−1; higher means stricter regular-worker
      dismissal protection.
  outcome:
  - name: two_year_post_recession_employment_ratio_change
    source: oecd:DSD_LFS_DF_LFS_INDIC
    transformation: EMP_RATIO of employed persons ages 20–64 at t+2 minus t, percentage
      points.
  controls:
  - name: recession_real_gdp_growth
    source: world_bank_wdi:NY.GDP.MKTP.KD.ZG
    transformation: Real GDP growth percent in event year t; negative by event definition.
  - name: baseline_employment_ratio
    source: oecd:DSD_LFS_DF_LFS_INDIC
    transformation: EMP_RATIO at event year t.
estimator:
  template: descriptive
  fixed_effects:
  - event_year
  clustering: country
  notes: Cross-country recession-event OLS with prior-year EPL, baseline employment,
    negative GDP-growth shock, and event-year effects; country-cluster CR1 and Student
    t(G−1). No country fixed effects because the estimand compares baseline protection
    levels across countries.
falsification:
  rule: SUPPORTED if the EPL coefficient is at most −0.75 employment percentage point
    per EPL index point with two-sided country-cluster p≤0.005; REFUTED if at least
    +0.75 pp with p≤0.005; otherwise PARTIAL. Any frozen sample, crisis-wave, full-rank,
    uncertainty, or concentration gate failure is INCONCLUSIVE.
  test: oecd_epl_recession_employment_recovery_bonferroni_2026
  threshold:
    family_id: placeholder_claim_specific_replacement_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.005
    expected_beta_sign: '-'
    meaningful_beta_min_abs: 0.75
    min_valid_rows: 60
    min_valid_countries: 30
    min_countries_with_two_nonoverlapping_events: 20
    min_2009_events: 20
    min_2020_events: 20
    min_distinct_event_years: 3
    max_one_event_year_share: 0.5
    min_epl_interquartile_gap: 0.5
    max_top_one_percent_partialled_x_share: 0.25
    max_top_country_partialled_x_share: 0.12
    roster_sha256: 1b028afd632f1646503bcf5f0107a917eaddc5cba20e3d5b524bde5bfbe7f19f
    source_files:
