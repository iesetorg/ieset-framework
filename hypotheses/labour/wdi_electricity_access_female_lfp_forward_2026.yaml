  period:
  - 2000
  - 2020
  temporal_structure: cross_section_with_justification
  cross_section_justification: One fixed ten-year prior electricity gain and one subsequent ten-year female
    participation gain per country; baseline access and participation are controlled.
  exclusion_rules:
  - Only the frozen 216-economy ISO3-plus-XKX source-key roster; key presence is not non-null evidence.
  - Require finite exact electricity readings in 2000 and 2010 and female participation readings in 2010 and
    2020 with status blank or A.
  - All four levels in [0,100]. No interpolation, imputation, nearest-year substitution, aggregate rows, or
    post-result country selection.
  - Coverage, variation, concentration and deterministic country-hash holdout gates are frozen in falsification.threshold.
variables:
  outcome:
  - name: female_lfp_2010_2020_gain_pp
    source: world_bank_wdi:SL.TLF.CACT.FE.ZS
    transformation: 2020 modelled ILO female LFP minus 2010 level, percentage points
    notes: Labour force includes employed and unemployed women age 15+, not unpaid household work or employment
      quality.
  treatment:
  - name: electricity_access_2000_2010_gain_pp
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: 2010 electricity-access share minus 2000 share, percentage points
    notes: Population with electricity access; availability does not measure supply quality.
  controls:
  - name: baseline_female_lfp_2010
    source: world_bank_wdi:SL.TLF.CACT.FE.ZS
    transformation: 2010 level, percentage points
  - name: baseline_electricity_access_2000
    source: world_bank_wdi:EG.ELC.ACCS.ZS
    transformation: 2000 level, percentage points
estimator:
  template: descriptive
  notes: Equal-country cross-sectional OLS of female LFP gain on earlier access gain, baseline female LFP,
    baseline electricity access, and intercept. HC3 two-sided Student t with residual degrees of freedom; five
    deterministic ISO3-hash-fold holdouts; alpha 0.01.
falsification:
  test: fixed_wdi_electricity_access_female_lfp_forward_2026
  rule: INCONCLUSIVE if any frozen coverage, variation, rank, uncertainty, concentration, or holdout-estimability
    gate fails. Otherwise SUPPORTED requires slope at least +0.10, two-sided p<=0.01 and at least four positive
    holdout slopes; REFUTED requires slope at most -0.10, p<=0.01 and at least four negative holdout slopes;
    other estimable fits PARTIAL. Zero causal, policy, school, position, and featured credit.
  threshold:
    family_id: wdi_electricity_access_female_lfp_forward_2026
    family_size: 1
    family_alpha: 0.01
    p_max_two_sided: 0.01
    meaningful_beta_min_abs: 0.1
    min_complete_countries: 120
    min_material_gain_countries: 30
    material_electricity_access_gain_pp: 10.0
    min_exposure_p90_p10_spread_pp: 15.0
    min_baseline_below_95_countries: 40
    max_top_country_residualized_exposure_share: 0.15
    max_top_ten_country_residualized_exposure_share: 0.5
    min_leave_one_hash_fold_out_countries: 100
    min_concordant_holdouts_for_directional_verdict: 4
    roster_sha256: a7b8e33e420cd1c0ce8160ad4e03e1102440d184842dd450027a446df26e8638
    source_lock_path: data/pinned_evidence/wdi_electricity_female_lfp_2026.manifest.json
    causal_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    featured_eligible: false
prior_confidence: 0.4
disclosure: Electrification may reduce time costs and enable participation, but development, fertility, schooling,
  norms, and industrial change jointly affect both. Earlier visible electricity tests influenced selection;
  no causal or policy effect is claimed.
