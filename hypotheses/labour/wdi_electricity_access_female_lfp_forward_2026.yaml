hypothesis_id: wdi_electricity_access_female_lfp_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: +
claim: Across the frozen WDI country-key roster, larger electricity-access gains from 2000 to 2010 predict
  at least +0.10 percentage points more female labour-force participation gain from 2010 to 2020 per +1 electricity
  point, conditional on baseline access and baseline female participation. This is a descriptive association.
evidence_type: descriptive
methodology_note: This distinct female-labour outcome was selected after visible IESET electricity-to-growth
  and electricity-to-child-mortality archive studies. Its one-test threshold does not adjust archive-wide search.
  Runner, exact source-key roster, and rule are committed before measured-value access.
