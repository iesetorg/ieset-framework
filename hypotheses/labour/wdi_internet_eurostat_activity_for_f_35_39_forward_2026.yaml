disclosure: Digital diffusion may affect job search and business matching, but Internet use is a national
  proxy for development and economic change. Eurostat LFS cells lack retained flags, foreign-citizen estimates
  may be imprecise, and historical national breaks remain possible. The 64 cells share shocks and two
  related labour margins; family correction is local, not archive-wide. No causal, policy, school, position,
  or featured credit.
