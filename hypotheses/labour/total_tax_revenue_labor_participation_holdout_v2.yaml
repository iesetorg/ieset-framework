disclosure: The old PARTIAL label was seen before this new design. Feasibility screening saw null masks but no outcome magnitudes, signs, or fitted statistics. Tax revenue as a share of GDP is not a payroll-tax rate; participation is not hours worked or employment. Country disjointness is relative to the named old run; these source vintages can overlap other IESET fits. This is descriptive calibration only, with no causal, welfare, or school-score credit.
