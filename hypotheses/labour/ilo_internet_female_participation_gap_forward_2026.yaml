hypothesis_id: ilo_internet_female_participation_gap_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: +
claim: Among fixed national 2005–2017 anchor years, a larger t−2 to t increase in the share of people using the
  Internet predicts a higher subsequent t to t+2 change in female minus male labour-force participation gap, age
  15+, conditional on its earlier change and level, baseline real income, country and anchor-year effects.
evidence_type: associational
methodology_note: One of five distinct labour endpoints in a single prospective descriptive WDI Internet × ILOSTAT
  family. Source keys, exact source identity and hashes only were inspected before registration. Selected numeric
  values and status/null masks remain sealed through five separate committed source locks.
