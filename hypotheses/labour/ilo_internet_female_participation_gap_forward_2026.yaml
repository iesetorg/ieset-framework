  period:
  - 2003
  - 2019
  temporal_structure: panel
  exclusion_rules:
  - Use only the frozen cell-specific national country, anchor-year and exact ILO source-key roster. Require the
    identical ILO source code at t−2, t and t+2 and both female and male codes at each time for derived gender outcomes.
  - Require finite WDI Internet percentages at t−2 and t within [0,100], positive finite WDI real GDP per person
    at t, and finite ILO outcomes at t−2, t and t+2.
  - ILO rates must be in [0,100]; hourly female and male earnings must both be positive in the same source/year/local
    currency. Retain countries with at least five complete anchor years. No imputation, winsorization, source substitution
    or missing-as-zero recoding.
variables:
  treatment:
  - name: prior_two_year_internet_uptake
    source: world_bank_wdi:IT.NET.USER.ZS
    transformation: (Internet use percent at t minus percent at t−2) divided by 10; +1 exposure unit is +10 percentage
      points.
    notes: National diffusion measure, not a policy intervention or exogenous treatment.
  outcome:
  - name: future_female_participation_gap_change
    source: ilostat:EAP_2WAP_SEX_AGE_RT_A
    transformation: female minus male participation percentages (percentage points), both same ILO country-year-source
      keys; Percentage-point change in selected outcome from t to t+2.
    notes: female minus male labour-force participation gap, age 15+
  controls:
  - name: prior_two_year_outcome_change
    source: ilostat:EAP_2WAP_SEX_AGE_RT_A
    transformation: Same selected outcome change t−2→t in headline units.
  - name: baseline_outcome_level
    source: ilostat:EAP_2WAP_SEX_AGE_RT_A
    transformation: Selected outcome level at t, in percentage points or log ratio.
  - name: baseline_log_real_income
    source: world_bank_wdi:NY.GDP.PCAP.KD
    transformation: Natural log of positive real GDP per person at t.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - anchor_year
  clustering: country_and_anchor_year
  notes: Equal country-year OLS on prior Internet uptake /10, prior same-outcome change, baseline outcome, log real
    GDP per person, country and anchor-year effects. Two-way country/year CR1 cluster covariance; two-sided Student
    t with min(country clusters,year clusters)-1 degrees of freedom. Holm over all five cells, with failed cells
    assigned p=1. Five fixed country-hash omission folds assess direction.
falsification:
  test: ilo_internet_forward_labour_2026_10_10
  rule: INCONCLUSIVE if exact sources, sample, residual variation/concentration, rank, two-way cluster uncertainty
    or fold coverage fails. SUPPORTED iff beta has registered sign and magnitude ≥0.35 percentage points per +10
    Internet percentage points, Holm-adjusted two-sided p≤0.05, and at least four of five hash-fold slopes have
    that sign. REFUTED iff the reverse beta meets the same magnitude, Holm and fold requirements. Otherwise PARTIAL.
  threshold:
    family_id: ilo_internet_forward_labour_2026_10_10
    family_size: 5
    family_alpha: 0.05
    holm_alpha: 0.05
    registered_beta_sign: +
    meaningful_abs_beta: 0.35
    beta_unit: percentage points per +10 percentage-point prior Internet uptake
    source_key_roster_path: data/pinned_evidence/ilo_internet_labour_2026_key_roster.csv
    source_key_roster_sha256: 240209e929ef63138d1e182ac24f61b2d4ac474bb3950a48de65469e4aac182e
    source_lock_path: data/pinned_evidence/ilo_internet_female_participation_gap_forward_2026.source.json
    family_source_sha256: 030dcab0cba4ddc430e6a48b264ec58a1bf7642f7ea8f56f47549be4db6e2713
    min_valid_rows: 500
    min_valid_countries: 50
    min_years: 10
    min_rows_per_country: 5
    min_residual_exposure_sd: 0.15
    min_residual_outcome_sd: 0.15
    max_top_one_percent_exposure_ss_share: 0.3
    max_top_country_exposure_ss_share: 0.18
    max_top_year_exposure_ss_share: 0.35
    max_top_one_percent_outcome_ss_share: 0.3
    max_top_country_outcome_ss_share: 0.18
    max_top_year_outcome_ss_share: 0.35
    min_fold_rows: 350
