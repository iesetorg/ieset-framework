  - 2019
  temporal_structure: cross_section_with_justification
  cross_section_justification: One fixed 2000-to-2010 exposure change and later 2011-to-2019 outcome improvement
    per country; the end year avoids the 2020 pandemic shock.
  exclusion_rules:
  - Only the frozen 216 ISO3-plus-XKX source-key intersection; rectangular WDI rows are not proof of a
    non-null measurement.
  - Exact WDI female upper-secondary attainment in 2000 and 2010, finite, status blank/A and in [0,100].
  - Exact WDI total fertility rate in 2011 and 2019, finite, status blank/A and in (0,10].
  - No interpolation, alternate years, imputation, aggregate rows or post-result country adjustment.
variables:
  outcome:
  - name: fertility_2011_2019_reduction_births_per_woman
    source: world_bank_wdi:SP.DYN.TFRT.IN
    transformation: 2011 total fertility rate minus 2019 rate, births per woman
    notes: A period synthetic rate, not the completed family size of an observed cohort.
  treatment:
  - name: female_upper_secondary_attainment_2000_2010_gain_pp
    source: world_bank_wdi:SE.SEC.CUAT.UP.FE.ZS
    transformation: 2010 minus 2000 percentage of women age 25+ with at least completed upper-secondary
      education
    notes: Cumulative attainment; source vintage has no matching per-run fetch-manifest entry, so exact
      raw bytes and baseline pull declaration are locked.
  controls:
  - name: baseline_female_attainment_2000
    source: world_bank_wdi:SE.SEC.CUAT.UP.FE.ZS
    transformation: 2000 female attainment percentage
  - name: baseline_total_fertility_2011
    source: world_bank_wdi:SP.DYN.TFRT.IN
    transformation: 2011 births per woman
estimator:
  template: descriptive
  notes: Equal-country cross-sectional OLS of later outcome improvement on prior exposure gain, baseline
    exposure and 2011 baseline outcome, with intercept; HC3 two-sided Student t, five deterministic ISO3
    hash-fold holdouts. Shared two-test family alpha 0.01; Bonferroni p cutoff 0.005.
falsification:
  test: fixed_wdi_female_upper_secondary_fertility_forward_2026
  rule: INCONCLUSIVE if any frozen complete-case, material-gain, exposure spread, rank, finite uncertainty,
    residualized-exposure concentration, or holdout gate fails. Otherwise SUPPORTED requires positive
    slope at least the frozen meaningful bound, two-sided p<=0.005 and at least four positive holdout
    slopes; REFUTED requires negative slope at least the same absolute bound, p<=0.005 and at least four
    negative holdout slopes; other estimable cases PARTIAL. Both tests remain in the multiplicity denominator
    regardless of data gates. Zero causal, policy, school, position and featured credit.
  threshold:
    family_id: physician_education_followthrough_2026
    family_size: 2
    family_alpha: 0.01
    bonferroni_p_max_two_sided: 0.005
    meaningful_beta_min_abs: 0.01
    min_complete_countries: 120
    min_material_exposure_gain_countries: 30
    material_exposure_gain: 10.0
    min_exposure_p90_p10_spread: 15.0
    max_top_country_residualized_exposure_share: 0.15
    max_top_10_residualized_exposure_share: 0.55
    min_leave_one_hash_fold_out_countries: 100
    min_concordant_holdouts_for_directional_verdict: 4
    roster_sha256: 8befd15bbffd25608f71ac534f5ccffcff876d1bc3aae0fc92ba2e2425756dc0
    source_lock_path: data/pinned_evidence/physician_education_family_2026.manifest.json
    causal_credit: 0
    policy_score_eligible: false
    policy_score_credit: 0
    school_score_eligible: false
    school_score_credit: 0
    featured_eligible: false
prior_confidence: 0.35
disclosure: Female schooling may change reproductive options, but delayed childbearing, income, labour
  markets, health care and norms jointly affect attainment and fertility. The raw attainment vintage lacks
  a per-run fetch-manifest entry; this is disclosed before values.
