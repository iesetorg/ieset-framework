hypothesis_id: wdi_female_upper_secondary_fertility_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: +
claim: Across the frozen country-key roster, larger gains in the share of women age 25+ with at least
  upper-secondary attainment from 2000 to 2010 predict at least 0.01 more births-per-woman fertility reduction
  from 2011 to 2019 per one percentage-point attainment gain, conditional on baseline female attainment
  and baseline fertility. This is a descriptive association.
evidence_type: descriptive
methodology_note: One of a closed two-test family with both questions and Bonferroni denominator fixed
  before selected values. Direct WHO WASH-child-health retesting was excluded after inspecting the four
  recent failed WASH screens. Source-key roster and exact source hashes precede selected-value access.
