hypothesis_id: wdi_education_ilostat_female_lfp_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: +
claim: Across the fixed national-area key roster, a larger 2005-to-2015 rise in government education expenditure
  as a share of GDP predicts a larger 2015-to-2023 increase in female prime-age labour-force participation.
methodology_note: New-ID prospective descriptive calibration joining a UNESCO-sourced WDI public-education
  expenditure ratio with ILOSTAT female age-25–54 labour-force participation. Related education and labour
  cases exist in the archive; this exact forward endpoint claim is selected and receives only a local
  three-test cutoff. No selected numeric values or null masks were opened before registration.
