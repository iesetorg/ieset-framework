  period: &id001
  - 2005
  - 2023
  temporal_structure: cross_section_with_justification
  cross_section_justification: One predeclared earlier exposure and one later outcome change per national
    area; annual source rows are not treated as independent observations.
  exclusion_rules:
  - Use only the fixed 183 national areas with WDI SE.XPD.TOTL.GD.ZS keys at 2005 and 2015 and exact ILOSTAT
    EAP_2WAP_SEX_AGE_RT_A, SEX_F, AGE_AGGREGATE_Y25-54 keys at 2005, 2015, and 2023.
  - Require finite education-spending-to-GDP percentages in [0,20] and female prime-age participation
    percentages in [0,100] at every exact endpoint.
  - No imputation, interpolation, nearest-year join, country replacement, post-result status filter, winsorization,
    or vintage switch.
  - Key presence does not imply a non-null measurement; all complete-value exclusions and frozen gates
    are reported.
variables:
  outcome:
  - name: female_prime_age_lfp_change_2015_2023_pp
    source: ilostat:EAP_2WAP_SEX_AGE_RT_A
    transformation: Female age-25–54 labour-force participation rate in 2023 minus 2015, percentage points.
  treatment:
  - name: public_education_spending_gdp_share_change_2005_2015_pp
    source: world_bank_wdi:SE.XPD.TOTL.GD.ZS
    transformation: Government education expenditure/GDP in 2015 minus 2005, GDP percentage points.
  controls:
  - name: education_spending_gdp_share_2005
    source: world_bank_wdi:SE.XPD.TOTL.GD.ZS
    transformation: 2005 government education expenditure/GDP level.
  - name: female_prime_age_lfp_2015
    source: ilostat:EAP_2WAP_SEX_AGE_RT_A
    transformation: 2015 female age-25–54 labour-force participation rate.
  - name: prior_female_prime_age_lfp_change_2005_2015
    source: ilostat:EAP_2WAP_SEX_AGE_RT_A
    transformation: 2015 minus 2005 female age-25–54 labour-force participation rate.
estimator:
  template: descriptive
  fixed_effects: []
  clustering: none
  notes: Equal-country OLS of later female prime-age participation change on earlier education-spending/GDP
    change, with intercept and three fixed controls. HC3 robust SE and two-sided Student t reference with
    N−5 df. No model, subgroup, weighting, or covariate search.
falsification:
  rule: Any sample, material-exposure, IQR, rank, residual-variation, HC3, single-area concentration,
    or leave-one-out fit gate failure is INCONCLUSIVE with no published coefficient. Otherwise SUPPORTED
    requires beta >= +1.0 participation percentage point per +1 GDP percentage point spending change,
    two-sided p <= 0.01/3, and positive beta in >=80% of successful leave-one-out fits. REFUTED requires
    beta <= -1.0, the same p cutoff, and negative beta in >=80% of successful fits; all other estimable
    outcomes are PARTIAL.
  test: ieset_three_distinct_measurements_2026_10_10
  threshold:
    family_id: ieset_three_distinct_measurements_2026_10_10
    family_size: 3
    family_alpha: 0.01
    p_max_two_sided_bonferroni: 0.0033333333333333335
    expected_sign: +
    min_complete_national_areas: 90
    min_material_exposure_areas: 30
    material_exposure_min: 0.5
    min_exposure_iqr: 0.5
    max_single_area_residualized_exposure_share: 0.15
    max_single_area_residualized_outcome_share: 0.2
    max_loo_fit_failures: 2
    min_loo_same_sign_share: 0.8
    meaningful_abs_beta: 1.0
    roster_sha256: 3d6430fc9cf9e5d7016db12afc962f2dd13dd57ec8494d06608229c612a251f1
    source_files:
      education:
        path: data/vintages/world_bank_wdi/SE.XPD.TOTL.GD.ZS@2026-05-05T204028Z.parquet
        sha256: 0f21a848f064c16fce431b5425f5fb51519044c3e88256f329821b00504cc501
        manifest: data/manifests/fetch_run_2026-05-05T210519Z.yaml
