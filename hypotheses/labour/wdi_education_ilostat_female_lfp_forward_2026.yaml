disclosure: The public education spending ratio is an observed fiscal share, not a policy assignment.
  It may move through GDP or expenditure composition. ILO participation includes work seekers, may be
  modelled, and does not measure employment quality. Childcare, norms, demographics, labour demand, and
  shocks confound the association. No causal, policy, school, position, or featured credit.
