prior_confidence: 0.50
disclosure: >-
  The old PARTIAL result and source-key availability are known. Country-year
  holdout observations are disjoint, but countries and data publishers overlap.
  Pandemic shutdowns, job-retention programmes, shifts out of the labour
  force, and GDP-denominator changes can jointly move ALMP spending and
  measured unemployment. OECD describes low-education workers as unusually
  exposed and unemployment as incomplete labour slack during COVID-19. The
  2019 EPL index is a legal-rules proxy, not a full flexicurity measure. A
  two-year descriptive association cannot validate the old policy mechanism.
steelman: hypotheses/steelman/oecd_almp_epl_low_education_unemployment_temporal_holdout_v2.md
scope:
