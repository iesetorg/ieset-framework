# yaml-language-server: $schema=../../schemas/hypothesis.schema.json
hypothesis_id: oecd_almp_migrant_unemployment_gap_forward_2026
version: 1
status: pre_registered
topic: labour
claim_direction: '-'
claim: Across the frozen OECD country panel, a larger increase in public active labour market programme spending
  as a percentage of GDP from t-1 to t predicts a smaller foreign-born minus native-born unemployment-rate
  gap change from t to t+1.
methodology_note: Prospective descriptive two-test family registered with key-only outcome access and exposure-only
  variation checks. Existing strict and legacy ALMP, migration, and migrant-employment cases were reviewed;
  neither directed pair is an old exact test. Both tests remain in the family denominator even if one is inconclusive.
evidence_type: associational
sample:
  countries:
  - AUS
  - AUT
  - BEL
  - CAN
  - CHE
  - CHL
  - COL
  - CZE
  - DEU
  - DNK
  - ESP
  - EST
  - FIN
  - FRA
  - GBR
  - GRC
  - HUN
  - IRL
  - ISL
  - ISR
  - ITA
  - LTU
  - LUX
  - LVA
  - MEX
  - NLD
  - NOR
  - NZL
  - POL
  - PRT
  - SVK
  - SVN
  - SWE
  - TUR
  - USA
  period:
  - 2001
  - 2022
  temporal_structure: panel
  exclusion_rules:
  - Retain only the exact committed key-only country-year roster, treatment years 2001-2022, and countries
    with at least five eligible candidate years.
  - Require direct OECD foreign-born and native-born total-sex unemployment-rate keys at t and t+1; exclude
    the EU aggregate and never infer missing birth-place cells.
  - After registration and a separate source-lock commit, require finite selected unemployment rates in [0,100]
    at both endpoints; drop no other rows based on outcome magnitude.
  - After source lock, accept only blank or A OECD OBS_STATUS at both birth-place cells and both endpoints;
    all other observation-status codes are excluded without inspecting their values for selection.
  - Require finite, unique source selectors and no interpolation, substitute series, or geography imputation.
  - Public SOCX TP60 exposure values must be within [0,10] percent GDP and have both t-1 and t observations.
variables:
  outcome:
  - name: foreign_minus_native_unemployment_gap_change_pp
    source: oecd:OECD.ELS.IMD,DSD_MIG@DF_MIG_NUP_SEX,1.0
    transformation: (FB unemployment rate at t+1 minus NB rate at t+1) minus (FB rate at t minus NB rate at
      t)
    notes: OECD UNE_RATE, percentage of labour force in the same subgroup; annual total sex and education.
      It is a birthplace gap, not an immigrant-arrival cohort outcome.
  treatment:
  - name: public_active_labour_market_spending_change
    source: oecd:DSD_SOCX@DF_SOCX_AGG
    transformation: public SOCX TP60 spending percent GDP at t minus the same at t-1
    notes: Public active labour market programme expenditure as percent GDP; not programme participation or
      immigrant-targeted support.
estimator:
  template: panel_fe
  fixed_effects:
  - country
  - year
  clustering: country
  notes: Primary OLS forward gap change on one treatment change with country and treatment-year
    fixed effects, without baseline gap adjustment. CR1 country-cluster covariance and two-sided Student
    t with G-1 degrees of freedom. A baseline-gap-adjusted model, 2022 exclusion, and t<=2019 window
    are diagnostic-only sensitivities. The adjusted change model is algebraically an ANCOVA for the future
    gap and can be sensitive to regression to the mean; it cannot change the primary verdict. No model
    search or coefficient comparison across the two separate rosters.
falsification:
  test: run_labour_gap_family_2026
  rule: INCONCLUSIVE if source/roster custody, complete-case, material-exposure, or rank/cluster gates fail.
    SUPPORTED only when the coefficient is negative with two-sided p<=0.005 and at least -0.1 pp gap change
    per +0.1 GDP percentage point of ALMP spending. REFUTED requires the symmetric positive sign, p, and magnitude
    gates. Any other estimable result is PARTIAL. Both tests remain in the Bonferroni denominator; time sensitivities
    cannot create a verdict.
  threshold:
    family_id: labour_gap_family_2026_10_10
    family_size: 2
    family_alpha: 0.01
    p_max_two_sided: 0.005
    practical_effect_pp_min: 0.1
    exposure_scale: 0.1
    min_valid_rows: 300
    min_valid_countries: 25
    min_years_per_country: 5
    min_material_rows: 80
    min_material_countries: 20
    material_exposure_change: 0.05
    expected_key_rows: 641
    expected_key_countries: 35
    roster_sha256: 3e850df6b2cf9b90d566fb5acf271e9c7358024ea7f593dd7acce60441475e20
