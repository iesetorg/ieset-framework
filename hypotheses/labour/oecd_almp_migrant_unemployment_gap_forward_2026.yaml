disclosure: Country-level descriptive calibration only. ALMP expenditure may react to unemployment and recessions;
  percent-GDP denominator changes mechanically with GDP. Programmes need not target foreign-born workers, and
  gap changes can reflect changing cohort mix. No causal, programme-effect, school-score, position, or featured
  credit.
